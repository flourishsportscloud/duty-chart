<!DOCTYPE html>
<html lang="en">
<head><script src="../fis/shell.js?v=3"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2D5A">
<link rel="icon" href="../fis/fis-icon-192.png">
<title>PL Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== PL Reports · cool-neutral corporate theme ===== */
:root{
  --bg:#f2f4f7;--card:#ffffff;--card2:#f8fafc;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--faint:#94a3b8;--line:#e5e9f0;--line2:#d5dbe5;
  --head:#111827;--head2:#1f2937;--navy:#2b4c7e;--navy2:#1f2937;--accent:#2b4c7e;--accentS:#e8eef7;
  --green:#15803d;--greenS:#ecfdf3;--greenL:#a7e3bf;--red:#c0362c;--redS:#fdf1f0;--redL:#f3b7b1;--amber:#b45309;--amberS:#fff7e8;--grey:#8a94a6;--greyS:#f1f3f6;--blue:#2b4c7e;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button{font-family:inherit;cursor:pointer}
/* top bar */
header{background:linear-gradient(180deg,var(--head2),var(--head));color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.h1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.h1 h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.h1 h1 a{color:#cbd5e1;text-decoration:none;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.14);padding:3px 9px;border-radius:99px}
.who{display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.who b{font-size:13px;font-weight:600;color:#e2e8f0;margin-right:2px}
.who button{border:1px solid rgba(255,255,255,.14);background:transparent;color:#cbd5e1;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600}
.sub{display:flex;justify-content:space-between;align-items:center;margin:10px auto 0;gap:8px;flex-wrap:wrap;max-width:1080px}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1);color:#cbd5e1;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#94a3b8}
.chip.live::before{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}.chip.err::before{background:#f87171}.chip.loc::before{background:#fbbf24}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#cbd5e1;padding:6px 16px;border-radius:8px;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--head)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,calc((100% - 1080px)/2 + 16px));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;text-align:left;line-height:1.2}
nav button.on{background:var(--head);border-color:var(--head);color:#fff}
nav button small{display:block;font-weight:500;font-size:10.5px;color:var(--mut);margin-top:1px}
nav button.on small{color:#94a3b8}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 40px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:.01em;display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.card h3 .hint{font-size:11.5px;font-weight:500;color:var(--mut)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
/* week strip */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.weeknav button.ar{border:1px solid var(--line);background:var(--card);border-radius:9px;width:34px;height:32px;font-size:15px;color:var(--ink2)}
.weeknav button.ar:disabled{opacity:.35}
.weeknav .wl{flex:1;text-align:center;font-weight:600;font-size:12.5px;color:var(--ink2)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:6px 2px 7px;text-align:center;font-size:11px;color:var(--mut);font-weight:500}
.day b{display:block;font-size:16px;color:var(--ink);font-weight:700;margin:1px 0}
.day .pc{font-weight:700;font-size:11.5px;color:var(--ink2)}
.day.g{background:var(--greenS);border-color:var(--greenL)}.day.g .pc{color:var(--green)}
.day.r{background:var(--redS);border-color:var(--redL)}.day.r .pc{color:var(--red)}
.day.today .tg{color:var(--accent)}
.day.sel{border-color:var(--head);box-shadow:0 0 0 1.5px var(--head)}
.day.lock{opacity:.45}
.day .tg{font-size:9px;letter-spacing:.06em;font-weight:700;height:11px;color:transparent}
/* notices */
.notice{padding:10px 12px;border-radius:11px;background:var(--amberS);color:#7c4a03;font-size:12.5px;margin-bottom:12px;border:1px solid #f6dfb5}
.notice.info{background:var(--accentS);color:var(--accent);border-color:#cdd9ea}
.notice.bad{background:var(--redS);color:#8f241c;border-color:var(--redL)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .k{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
.kpi .v small{font-size:13px;font-weight:600;color:var(--mut)}
.kpi.main{background:var(--head);border-color:var(--head)}.kpi.main .k{color:#94a3b8}.kpi.main .v{color:#fff}
.kpi.d .v{color:var(--green)}.kpi.n .v{color:var(--red)}.kpi.o .v{color:var(--amber)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hero h2{margin:2px 0 0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.cnt{text-align:center;border-radius:10px;padding:7px 2px;background:var(--card2);border:1px solid var(--line)}
.cnt b{display:block;font-size:17px;font-weight:700}.cnt span{font-size:10.5px;color:var(--mut);font-weight:500}
.cnt.d b{color:var(--green)}.cnt.n b{color:var(--red)}.cnt.a b{color:var(--grey)}
.bar{height:6px;border-radius:99px;background:#e9edf3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.rd i{background:linear-gradient(90deg,var(--green),var(--green) 70%,#e0a23b)}
.pct{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
/* PL scorecards */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.plc{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.plc:hover{border-color:var(--line2);box-shadow:0 2px 4px rgba(15,23,42,.05),0 10px 24px rgba(15,23,42,.07)}
.plc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plc h4{margin:0;color:var(--ink);font-size:15.5px;font-weight:700}.plc small{color:var(--mut);font-size:12px;font-weight:500}
.plc .mini3{display:flex;gap:14px;margin:12px 0 10px;font-size:12px;color:var(--mut)}
.plc .mini3 b{font-size:15px;color:var(--ink);display:block;font-weight:700}
.plc .mini3 .n b{color:var(--red)}.plc .mini3 .d b{color:var(--green)}
.plc .foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.plc .foot b{color:var(--ink2);font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tag.ok{background:var(--greenS);color:var(--green)}.tag.bad{background:var(--redS);color:var(--red)}.tag.warn{background:var(--amberS);color:var(--amber)}.tag.idle{background:var(--greyS);color:var(--mut)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--p)*1%),#e9edf3 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink)}
/* attention */
.att{display:grid;gap:10px}
.attpl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.attpl .ah{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--line);font-size:13px}
.attpl .ah b{font-weight:700}
.attpl ul{list-style:none;margin:0;padding:4px 12px}
.attpl li{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.attpl li:last-child{border-bottom:0}
.attpl li .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto;transform:translateY(-1px)}
.attpl li .dot.o{background:var(--amber)}
.attpl li .w{color:var(--mut)}
.lateline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.lateline:last-child{border-bottom:0}
.lateline .lb{font-weight:700;color:var(--amber);margin-right:2px}
.pill{display:inline-flex;gap:4px;align-items:center;border:1px solid #f1dcb6;background:var(--amberS);color:#7c4a03;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:600}
.pill small{font-weight:500;color:#a46a1a}
th small{display:block;font-weight:600;color:var(--ink2);font-size:12px;letter-spacing:0;text-transform:none}
.allclear{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--greenS);color:var(--green);font-weight:600;font-size:13px}
/* heat / week */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.sbox{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;font-size:11px;color:var(--mut);font-weight:600;background:var(--card)}
.sbox b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.sbox.r{border-color:var(--redL);background:var(--redS)}.sbox.g{border-color:var(--greenL);background:var(--greenS)}.sbox.g b{color:var(--green)}
.heatrow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.heatrow:last-child{border-bottom:0}
.heatrow .nm{font-weight:700;font-size:13px}.heatrow .nm small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.wk{display:flex;gap:8px;align-items:flex-end;height:96px;margin-top:4px}
.wk div{flex:1;text-align:center;font-size:10.5px;color:var(--mut)}
.wk .col{height:64px;display:flex;align-items:flex-end;background:#eef1f5;border-radius:8px;overflow:hidden}
.wk .col i{width:100%;background:var(--faint);display:block;border-radius:8px 8px 0 0}
.wk .col i.g{background:var(--green)}.wk .col i.r{background:#d9796f}
.nd{font-size:12.5px;line-height:1.5}
.nd div{padding:6px 0;border-bottom:1px solid var(--line)}
.nd div:last-child{border-bottom:0}
.nd .bl{color:var(--mut)}
.ok{color:var(--green);font-weight:600;font-size:12.5px}
/* fold */
details.card{padding:0}
details.card>summary{list-style:none;padding:14px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin-left:10px;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>summary .hint{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:500}
details.card>.fb{padding:0 16px 14px}
/* task blocks (PL page) */
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.bh{background:var(--card2);color:var(--ink);padding:11px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bh .bn{font-weight:700;flex:1;min-width:140px;font-size:14px}
.st{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--greyS);letter-spacing:.02em}
.st.Done{color:var(--green);background:var(--greenS)}.st.Missed,.st.Overdue{color:var(--red);background:var(--redS)}.st.Due{color:var(--amber);background:var(--amberS)}.st.Upcoming{color:var(--accent);background:var(--accentS)}.st.NoFixed{color:var(--mut)}
.tm-chip{font-size:11px;background:var(--card);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);font-weight:600}
.bpc{font-size:12px;font-weight:700;color:var(--ink2)}
.timed{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--accentS);flex-wrap:wrap;font-size:12px}
.timed input{padding:5px;font-size:14px;border:1px solid var(--line2);border-radius:7px}
.timed button{border:0;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;background:var(--head);color:#fff}
.timed button.sec{background:#dfe5ee;color:var(--ink)}
.item{border-top:1px solid var(--line);padding:10px 14px}
.item:first-of-type{border-top:0}
.ih{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;margin-bottom:4px;font-size:13.5px}
.row{padding:6px 0 7px}
.row.sub{padding-left:12px;border-left:2px solid var(--line);margin:2px 0}
.rl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.lbl{font-size:13px;color:var(--ink2);font-weight:500}
.rb{display:flex;gap:5px;flex:0 0 auto}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--ink2)}
.mini.on{background:var(--accentS);border-color:#c9d6ea;color:var(--accent)}
.mini:disabled,.mini.ro{opacity:.45}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.box{min-width:58px;flex:0 0 auto;border:1.5px dashed var(--line2);background:var(--card);border-radius:11px;padding:3px 5px 5px;text-align:center;font-family:inherit;color:var(--ink);min-height:56px}
.box .sl{display:block;font-size:10px;color:var(--mut);height:12px;font-weight:600}
.box .sy{display:block;font-size:17px;font-weight:800;line-height:22px;color:#c3cad6}
.box .tm{display:block;font-size:9px;color:var(--mut);line-height:11px}
.box .tm.late{color:var(--amber);font-weight:700}
.box.d{background:var(--greenS);border:1.5px solid var(--greenL)}.box.d .sy{color:var(--green)}
.box.n{background:var(--redS);border:1.5px solid var(--redL)}.box.n .sy{color:var(--red)}
.box.a{background:var(--greyS);border:1.5px solid #d3d9e3}.box.a .sy{color:var(--grey)}
.box.ro{cursor:default}
.box.obs.oc{border:1.5px solid var(--oc);background:color-mix(in srgb,var(--oc) 12%,#fff)}.box.obs.oc .sy{color:var(--oc)}
.obsleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--mut);margin-top:4px}.obsleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.box.obs .tm{font-size:10px;line-height:12px;text-align:left;padding:0 2px}
.row.de{display:flex;align-items:center;gap:8px}
.row.de .rl{flex:1;margin:0}
.rembox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px;margin-top:6px}
.rr{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.rr .sn{flex:0 0 36px;font-weight:700;font-size:12px;padding-top:7px}
.rr input,.rr textarea{font:inherit;font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:6px 7px;background:#fff}
.rr input{width:70px;flex:0 0 70px}.rr textarea{flex:1;min-height:34px;resize:vertical}
.rr .by{font-size:10px;color:var(--mut);flex:0 0 auto;max-width:90px}
/* tables */
.tw{overflow-x:auto;margin:0 -2px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--card2)}
tr:last-child td{border-bottom:0}
td.c{text-align:center;font-weight:700}
td.c span{display:inline-block;min-width:44px;padding:3px 6px;border-radius:8px}
td.g span{background:var(--greenS);color:var(--green)}td.r span{background:var(--redS);color:var(--red)}td.e span{color:var(--faint)}
.cat{margin-bottom:14px}.cat>b{color:var(--ink);font-size:13px}
.cat .tot{float:right;font-weight:700;font-size:12px;color:var(--accent)}
.cat table{margin-top:6px}
.muted{color:var(--mut);font-size:12px}
/* login */
.login{max-width:400px;margin:36px auto}.login label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.login select,.login input,.pwrow input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;background:var(--head);color:#fff;font-weight:700;padding:11px 14px;font-size:14px;margin-top:14px;width:100%}
.btn.sec{background:#e3e8ef;color:var(--ink)}
.pwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pwrow .btn{margin:0;width:auto;padding:9px 12px;font-size:12px}
@media (max-width:640px){
  header{padding:10px 12px 9px}.wrap{padding:12px 12px 36px}nav{padding:8px 12px}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi.main{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
  .kpi .v{font-size:21px}.hero h2{font-size:18px}
  .heatrow{grid-template-columns:1fr;gap:6px}
  .card{padding:14px}
}
/* ===== FIS premium theme · navy + gold (school logo colours) ===== */
:root{--navy:#1F2D5A;--navy2:#16214A;--navy3:#2B3C74;--gold:#E3A94F;--goldlt:#F4D9A6;--goldink:#8A5B12;--ac:#E3A94F;
--bg:#F5F3EE;--card:#fff;--card2:#F8F6F1;--ink:#1B2340;--ink2:#3A4260;--mut:#646B80;--faint:#9AA0B3;--line:#E6E2D8;--line2:#D5CFBF;
--head:#16214A;--head2:#1F2D5A;--accent:#1F2D5A;--accentS:#EAEEF8;
--green:#1F7A52;--greenS:#E6F1EA;--greenL:#A9D3BD;--red:#B83247;--redS:#F8E6EA;--redL:#E8B3BF;--amber:#A8670A;--amberS:#FBF1DC;--grey:#8A91A6;--greyS:#ECEEF4;--blue:#2F5BB5;
--serif:'Lora',Georgia,'Times New Roman',serif;--sh:0 1px 2px rgba(20,25,60,.05),0 6px 20px rgba(20,25,60,.04)}
body{background:var(--bg);color:var(--ink)}

<script>
/* ================= CONFIG ================= */
const secList=(cls,letters)=>{const o=[];cls.forEach(c=>[...letters].forEach(l=>o.push(c+l)));return o};
const PLS=[
 {id:'poonam',ac:'#C2385B',name:'Poonam',cls:'Class 6–7',sections:secList([6,7],'ABC')},
 {id:'garima',ac:'#5F3585',name:'Garima',cls:'Class 8–9',sections:['8A','8B','8C','9A','9B']},
 {id:'santosh',ac:'#2B8FBF',name:'Sarita',cls:'Class 10–11',sections:['10A','10B','11A']}
];
const SENIORS=[{id:'sarita',name:'Sarita (Head of Secondary)'},{id:'dean',name:'Dean of Academics'},{id:'director',name:'Director–Admin'}];
const PEOPLE=[...PLS.map(p=>({id:p.id,name:p.name,pl:p.id})),...SENIORS.map(s=>({id:s.id,name:s.name,senior:true}))];

const DP=[
{id:'dp1',name:'Morning Round',time:'08:30',items:[

function idbGet(k){return new Promise(res=>{try{const t=idb.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbPut(k,v){return new Promise((res,rej)=>{try{const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}})}
function qCount(){let n=0;Object.keys(Q).forEach(id=>Q[id].forEach(b=>{n+=Object.keys(b.patch.cells).length+Object.keys(b.patch.rem).length}));return n}

  Object.assign(dst.rem,clone(src.rem||{}));
}

const PERMANENT=/Only today|only your own|Bad record|This login is for|too large|Only the seniors|Only the Director/i;
let retryTimer=null,retryWait=2000;
function scheduleRetry(){if(retryTimer)return;const w=retryWait+Math.random()*1000;retryWait=Math.min(retryWait*2,60000);retryTimer=setTimeout(()=>{retryTimer=null;flushQueue()},w)}

function sameDoc(a,b,own){   // equal apart from the server's stamps on the items we just saved ourselves
  if(!a||!b)return false;const skip=own||{cells:{},rem:{}};
  const norm=(o,sk)=>JSON.stringify(Object.keys(o||{}).sort().map(k=>sk[k]?[k,(o[k]||{}).s,(o[k]||{}).x,(o[k]||{}).n,((o[k]||{}).obs||[]).length]:[k,o[k]]));
  return norm(a.cells,skip.cells)===norm(b.cells,skip.cells)&&norm(a.rem,skip.rem)===norm(b.rem,skip.rem);
}
async function sendDoc(id){
  while(hasPend(id)){
    const b=Q[id][0];b.sent=true;saveQueue();S.sending++;paintConn();
    try{
      const doc=await api('save',[id,b.patch,b.rid]);
      S.sending--;Q[id].shift();if(!Q[id].length)delete Q[id];saveQueue();
      S.netErr=false;retryWait=2000;if(doc.now)SKEW=doc.now-Date.now();
      const before=S.docs[id]?clone(S.docs[id]):null;const sd={pl:doc.pl,mode:doc.mode,date:doc.date,wk:doc.wk,cells:doc.cells,rem:doc.rem};
      docSig[id]=JSON.stringify(sd);   // the next refresh will not count our own save as news
      S.docs[id]=overlay(id,sd);saveLocal();
      if(!sameDoc(before,S.docs[id],b.patch))requestRender();   // redraw only if someone else's change came back with ours
    }catch(e){
      S.sending--;
      if(e.server&&PERMANENT.test(e.message)){   // a rule says no: keep a visible record, never drop silently
        Q[id].shift();if(!Q[id].length)delete Q[id];
        S.failed.push({id:id,msg:e.message,n:Object.keys(b.patch.cells).length+Object.keys(b.patch.rem).length,at:Date.now()});
        saveQueue();paintFails();poll();continue;
      }
      b.sent=true;S.netErr=!e.server;saveQueue();scheduleRetry();return;   // busy / offline: same request id is retried later
    }
  }
  paintConn();
}
let polling=false;const docSig={};
async function poll(){
  if(!API_URL||polling||!S.token)return;polling=true;const wk=S.wk;
  try{
    flushQueue();
    const v=await api('state',[wk]);
    if(v.now)SKEW=v.now-Date.now();
    let changed=false;
    if(wk===S.wk){
      Object.keys(S.docs).forEach(id=>{if(S.docs[id].wk===wk&&!v.docs[id]&&!hasPend(id)){delete S.docs[id];changed=true}});
      Object.keys(v.docs).forEach(id=>{const sig=JSON.stringify(v.docs[id]);if(docSig[id]!==sig||!S.docs[id]){docSig[id]=sig;changed=true}
        S.docs[id]=overlay(id,v.docs[id])});
      const ts=JSON.stringify(v.times||{});if(ts!==JSON.stringify(S.times))changed=true;S.times=v.times||{};
      if(v.me){S.me=Object.assign(S.me||{},v.me);try{localStorage.setItem('plplan_me',JSON.stringify(S.me))}catch(e){}}
    }
    S.netErr=false;paintConn();saveLocal();if(changed||S.firstPoll!==false){S.firstPoll=false;requestRender()}
  }catch(e){S.netErr=!e.server;paintConn()}
  finally{polling=false}
}

function mkCell(rk,s,now,mode,date){
  const b=ROWMAP[mode][rk].block;const due=dueOf(b);
  const late=(s&&due&&date===todayStr()&&nowMin()>toMin(due))?1:0;
  return{s:s,by:whoName(),at:now,l:late};
}
function setCells(plId,list){
  const mode=S.mode,date=S.date;const id=docId(plId,mode,date);const doc=ensureDoc(id,plId,mode,date);
  const now=Date.now();const patch={cells:{}};
  list.forEach(x=>{const key=x[0]+'__'+x[1];const c=mkCell(x[0],x[2],now,mode,date);doc.cells[key]=c;patch.cells[key]=clone(c)});
  persist(id,patch);
  if(list.length===1&&fastBox(plId,list[0][0],list[0][1]))renderSoon(1200);else render(true);
}
function fastBox(plId,rk,sec){   // instant feedback on old phones: redraw only the tapped box
  try{const el=document.querySelector(`button.box[data-act="tick"][data-pl="${plId}"][data-row="${rk}"][data-sec="${sec}"]`);if(!el)return false;
    const r=ROWMAP[S.mode][rk],pl=plOf(plId),doc=S.docs[docId(plId,S.mode,S.date)];
    const showSec=secsFor(pl,S.mode,r)[0]!=='x';
    const t=document.createElement('div');t.innerHTML=boxHTML(pl,r,sec,doc&&doc.cells[rk+'__'+sec],!!r.block.yn,true,showSec);
    el.replaceWith(t.firstChild);return true}catch(e){return false}
}
const OBS_MAX=7;
const OBS_COL=['','#d64545','#e0b000','#9bc53d','#1e9e5a','#14a3a3','#3a63c8','#7b4fc9'];
const OBS_NAME=['','Red','Yellow','Light green','Green','Teal','Blue','Purple'];
function applyOps(cell,ops,by){
  const obs=((cell&&cell.obs)||[]).slice();
  ops.forEach(o=>{if(o==='add')obs.push(Date.now());else if(o==='pop')obs.pop()});
  return {s:obs.length?'D':'',obs:obs,by:by,at:Date.now(),l:0};
}
function doObs(plId,rk,sec,op){
  if(!canAct(plId))return;
  const mode=S.mode,date=S.date,id=docId(plId,mode,date),doc=ensureDoc(id,plId,mode,date),key=rk+'__'+sec;
  if(op==='add'&&((doc.cells[key]&&doc.cells[key].obs)||[]).length>=OBS_MAX)return;
  doc.cells[key]=applyOps(doc.cells[key],[op],whoName());
  persist(id,{cells:{[key]:{ops:[op]}}});render();
}
function obsUndo(plId,rk){
  const doc=S.docs[docId(plId,S.mode,S.date)];if(!doc)return;
  let best=null,bt=0;Object.keys(doc.cells).forEach(k=>{const p=k.split('__');if(p[0]!==rk)return;const o=doc.cells[k].obs||[];if(o.length&&o[o.length-1]>bt){bt=o[o.length-1];best=p[1]}});
  if(best)doObs(plId,rk,best,'pop');
}
const NEXT={'':'D',D:'N',N:'A',A:''};
function doTick(plId,rk,sec){
  if(!canAct(plId))return;
  const id=docId(plId,S.mode,S.date);const c=S.docs[id]&&S.docs[id].cells[rk+'__'+sec];
  setCells(plId,[[rk,sec,NEXT[(c&&c.s)||'']]]);
}
const timers={},pend={};
function schedule(id,key){(pend[id]=pend[id]||new Set()).add(key);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700)}
function flush(id){
  clearTimeout(timers[id]);const keys=pend[id];if(!keys||!keys.size)return;pend[id]=new Set();
  const doc=S.docs[id];const patch={cells:{},rem:{}};
  keys.forEach(k=>{if(doc.rem[k])patch.rem[k]=clone(doc.rem[k]);
    const c=doc.cells[k];if(c&&!c.obs&&!(ROWMAP[S.mode][k.split('__')[0]]||{item:{}}).item.multi)patch.cells[k]=clone(c)});   // timed observations travel only as "add"/"pop" — a remark must never overwrite their times
  persist(id,patch);
}
function flushAll(){Object.keys(pend).forEach(flush)}
function onRemInput(el){
  const plId=el.dataset.pl,rk=el.dataset.row,sec=el.dataset.sec,f=el.dataset.f;
  if(!canAct(plId))return;
  const mode=S.mode,date=S.date,id=docId(plId,mode,date),doc=ensureDoc(id,plId,mode,date),key=rk+'__'+sec;
  if(f==='ac'){const ak='ac-'+key;doc.rem[ak]={n:'',x:el.value,by:whoName(),at:Date.now()};schedule(id,ak);return}  // optional action note, own key so it never changes the tick
  const e=doc.rem[key]||{n:'',x:''};e[f]=el.value;e.by=whoName();e.at=Date.now();doc.rem[key]=e;
  const has=(e.n!==''&&e.n!=null)||String(e.x||'').trim()!=='';
  const multi=(ROWMAP[mode][rk]||{item:{}}).item.multi;
  if(has&&!multi&&!(doc.cells[key]&&doc.cells[key].s))doc.cells[key]=mkCell(rk,'D',Date.now(),mode,date);
  schedule(id,key);
}

/* ================= STATS ================= */
function cellS(doc,rk,sec){const c=doc&&doc.cells&&doc.cells[rk+'__'+sec];return (c&&c.s)||''}
function countRows(doc,pl,mode,rows){
  const o={D:0,N:0,A:0,P:0,T:0};
  rows.forEach(r=>secsFor(pl,mode,r).forEach(s=>{const v=cellS(doc,r.key,s);o.T++;o[v||'P']++}));
  o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o;
}
const stats=(doc,pl,mode)=>countRows(doc,pl,mode,ROWS[mode]);
const getDoc=(pl,mode,date)=>S.docs[docId(pl.id,mode,date)];
function blockInfo(doc,pl,mode,b,date){
  const rows=ROWS[mode].filter(r=>r.block===b);const c=countRows(doc,pl,mode,rows);const due=dueOf(b);const today=todayStr();
  let st,cls;
  if(c.P===0&&c.N===0){st='Done';cls='Done'}
  else if(date<today){st='Missed';cls='Missed'}
  else if(date>today){st='Upcoming';cls='Upcoming'}
  else if(c.P===0&&c.N>0){st='Missed';cls='Missed'}
  else if(!due){st='No fixed time';cls='NoFixed'}
  else{const m=nowMin(),d=toMin(due);if(m>d){st='Overdue';cls='Overdue'}else if(d-m<=30){st='Due soon';cls='Due'}else{st='Upcoming';cls='Upcoming'}}
  return{c:c,st:st,cls:cls,due:due};
}
function dayClass(c,date){
  if(date>todayStr())return 'lock';
  if(c.T&&c.N>0)return 'r';if(c.T&&c.pct===100)return 'g';return '';
}
function sumStats(list){const o={D:0,N:0,A:0,P:0,T:0};list.forEach(c=>{['D','N','A','P','T'].forEach(k=>o[k]+=c[k])});o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o}
function dayStats(date,plsList){return sumStats(plsList.map(pl=>stats(getDoc(pl,S.mode,date),pl,S.mode)))}

function paintConn(){

  let t,c;
  if(S.conn==='local'){t='Setting up · this device only';c='loc'}
  else if(S.sending&&!S.netErr){t='Saving…';c='busy'}
  else if(n&&(S.netErr||!navigator.onLine)){t=(navigator.onLine?'Save failed – retrying':'Offline')+' · '+n+' pending';c='err'}
  else if(n){t=n+' change'+(n>1?'s':'')+' pending';c='pend'}
  else if(S.netErr||!navigator.onLine){t=navigator.onLine?"Can't reach server · retrying":'Offline';c='err'}
  else if(S.conn==='init'&&S.firstPoll!==false){t='Connecting…';c=''}
  else{t='Saved · live';c='live'}
  el.textContent=t;el.className='chip '+c;
}

}
function typing(){const a=document.activeElement;return !!(a&&a.classList&&(a.classList.contains('remin')||a.classList.contains('cwin')))}
/* ---- redraw control: never under the user's finger ---- */
let lastTouch=0,renderTimer=null;
['touchstart','pointerdown','keydown','wheel'].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now()},{passive:true,capture:true}));
document.addEventListener('scroll',()=>{lastTouch=Date.now()},{passive:true});
const userBusy=()=>typing()||Date.now()-lastTouch<4000;
function requestRender(){S.dirty=true;if(renderTimer)return;const go=()=>{renderTimer=null;if(!S.dirty)return;if(userBusy()){renderTimer=setTimeout(go,1000);return}render()};renderTimer=setTimeout(go,50)}
function renderSoon(ms){clearTimeout(S.soonT);const t0=Date.now();S.soonT=setTimeout(()=>{if(typing()||lastTouch>t0+100){requestRender();return}render(true)},ms||900)}   // after own tap: redraw counters once, unless the user is touching again
function render(force){
  if(!force&&userBusy()){S.dirty=true;requestRender();return}
  if(typing()&&!force){S.dirty=true;return}
  S.dirty=false;
  paintTop();paintBack();paintFails();
  if(!S.me){document.getElementById('root').innerHTML=loginHTML();return}
  if(S.view==='pw'){document.getElementById('root').innerHTML=pwHTML();return}
  if(S.view==='logins'){document.getElementById('root').innerHTML=loginsHTML();return}
  if(S.view==='report'){const sc=window.scrollY;document.getElementById('root').innerHTML=`<div class="noprint">${strip()}</div>`+reportHTML();window.scrollTo(0,sc);return}
  if(!S.me.senior&&S.tab!==S.me.id)S.tab=S.me.id;

  root.style.setProperty('--ac',(plOf(S.tab)||{}).ac||'#E3A94F');root.innerHTML=strip()+(S.tab==='dash'?dashboard():plPage(plOf(S.tab)));
  window.scrollTo(0,scroll);
}

  let h=`<div class="card"><div class="weeknav"><button class="ar" data-act="wk" data-v="-1">‹</button><div class="wl">Week of ${m.getDate()} ${m.toLocaleString('en',{month:'short'})} – ${e.getDate()} ${e.toLocaleString('en',{month:'short'})} ${e.getFullYear()}</div><button class="ar" data-act="wk" data-v="1" ${nextOk?'':'disabled'}>›</button></div><div class="strip">`;

function remarksCard(plsList){
  const cats={};
  plsList.forEach(pl=>{
    const doc=getDoc(pl,S.mode,S.date);if(!doc||!doc.rem)return;
    Object.keys(doc.rem).forEach(k=>{
      const e=doc.rem[k];const p=k.split('__');const r=ROWMAP[S.mode][p[0]];if(!r)return;
      const hasN=e.n!==''&&e.n!=null&&!isNaN(+e.n);const hasX=String(e.x||'').trim()!=='';
      if(!hasN&&!hasX)return;
      const cat=r.sub?r.item.name+' › '+r.label:r.label;
      const c=cats[cat]=cats[cat]||{tot:0,hasNum:false,list:[],ord:ROWS[S.mode].indexOf(r)};
      const ac=doc.rem['ac-'+k];c.list.push({pl:pl,sec:p[1],n:hasN?e.n:'',x:e.x||'',by:e.by,at:e.at,ac:ac&&ac.x});
      if(hasN){c.tot+=+e.n;c.hasNum=true}
    });
  });
  const names=Object.keys(cats).sort((a,b)=>cats[a].ord-cats[b].ord);
  const cnt=names.reduce((a,n)=>a+cats[n].list.length,0);
  const dk='rem|'+(plsList.length>1?'all':plsList[0].id);
  let h=`<details class="card" data-k="${dk}"${detOpen(dk,cnt&&cnt<=6)?' open':''}><summary>Remarks &amp; numbers<span class="hint">${cnt?cnt+' entr'+(cnt>1?'ies':'y'):'None today'}</span></summary><div class="fb">`;
  if(!names.length)return h+`<div class="muted">No remarks or numbers recorded for this day.</div></div></details>`;
  names.forEach(n=>{

  });
  return h+'</div></details>';
}

function sectionBoxes(pl,doc){
  return `<div class="secs">`+pl.sections.map(s=>{
    let d=0,n=0,t=0;ROWS.dp.forEach(r=>{const v=cellS(doc,r.key,s);t++;if(v==='D'||v==='A')d++;if(v==='N')n++});
    const p=t?Math.round(d/t*100):0;
    return `<div class="sbox ${n?'r':p===100?'g':''}">${esc(s)}<b>${p}%</b>${n?`<span style="color:var(--red)">${n} ✗</span>`:''}</div>`;
  }).join('')+`</div>`;
}
function plPage(pl){
  const mode=S.mode,doc=getDoc(pl,mode,S.date);const c=stats(doc,pl,mode);const today=todayStr();
  const editable=canAct(pl.id);
  let notice='';
  if(S.date<today)notice='<div class="notice info">Past day — shown as recorded.</div>';
  else if(S.date===today&&!editable)notice=`<div class="notice">You can view ${esc(pl.name)}’s plan but only ${esc(pl.name)} and the seniors can update it.</div>`;
  let h=notice;
  const sm=plSummary(pl,mode,S.date);
  h+=`<div class="card"><div class="hero" style="margin-bottom:12px"><div><div class="eyebrow">${mode==='dp'?'Day Plan · '+pl.sections.length+' sections':'Day End'}</div><h2>${esc(pl.name)} <span class="muted" style="font-size:14px;font-weight:600">· ${pl.cls}</span></h2><div class="muted" style="margin-top:2px">${parseD(S.date).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</div></div><div style="display:flex;align-items:center;gap:10px">${statusTag(sm,S.date)}${ringHTML(c.pct,c.N||sm.late.length)}</div></div>`+
    countsHTML(pl,mode,S.date,c)+
    `<div class="bar ${c.N?'rd':''}"><i style="width:${c.pct}%"></i></div><div class="muted" style="margin-top:6px">% complete = (Done + NA) ÷ all items</div></div>`;
  h+=`<div class="card"><h3>This week <span class="hint">% complete per day</span></h3>${weekChart(pl)}<div class="tcbar" style="margin:10px 0 0"><button data-act="report" data-v="${pl.id}">📄 ${esc(pl.name)}’s report card (✓ / ✗)</button></div></div>`;
  if(mode==='dp')h+=`<div class="card"><h3>Section-wise completion</h3>${sectionBoxes(pl,doc)}</div>`;
  h+=`<div class="card"><h3>Not Done <span class="hint">${sm.nd.length||''}</span></h3><div class="nd">${notDone(pl,doc,mode)}</div></div>`;
  h+=remarksCard([pl]);
  h+=blocksHTML(pl,doc,mode,editable);
  if(mode==='dp'){cwCarry(pl);h+=`<div class="blk"><div class="bh"><span class="bn">Student Care Watch</span><span class="bpc">washroom · water · lunch</span></div>${cwPanel(pl,getDoc(pl,'dp',S.date),editable)}</div>`}
  return h;
}
function plSummary(pl,mode,date){
  const doc=getDoc(pl,mode,date);const c=stats(doc,pl,mode);const today=todayStr();
  const late=[],next=[];
  DEFS[mode].forEach(b=>{const i=blockInfo(doc,pl,mode,b,date);
    if(i.st==='Overdue'||(date<today&&i.st==='Missed'))late.push({b:b,i:i});
    else if(i.st==='Due soon'||i.st==='Upcoming')next.push({b:b,i:i});});
  next.sort((x,y)=>(x.i.due||'99')<(y.i.due||'99')?-1:1);
  const nd=[];ROWS[mode].forEach(r=>{const bad=secsFor(pl,mode,r).filter(s=>cellS(doc,r.key,s)==='N');if(bad.length)nd.push({r:r,bad:bad})});
  return {doc:doc,c:c,late:late,next:next,nd:nd};
}
function statusTag(sm,date){
  const today=todayStr(),c=sm.c;
  if(c.T&&c.P===0&&c.N===0)return '<span class="tag ok">Complete</span>';
  if(sm.late.length)return `<span class="tag bad">${sm.late.length} ${date<today?'missed':'overdue'}</span>`;
  if(c.N)return `<span class="tag warn">${c.N} not done</span>`;
  if(!(c.D+c.A+c.N))return '<span class="tag idle">Not started</span>';
  return '<span class="tag ok">On track</span>';
}
/* ================= DONE / NOT-DONE CHECK · CARE WATCH · REPORT CARDS (shared by PL and PM Plan) =================
   Every section of every task is ✓ done · NA · ✗ marked Not Done · ! not marked although its time is over
   (any past day, or today after the block's due time — blocks with no fixed time after END_DAY) · · still to come.
   Care-watch children are kept in the day's record under cw-<id> keys (no server change needed); regular names
   carry forward to the next working day. Guideline checks: a medical case and a regular care-watch child must be met
   at least twice in the day. */
const END_DAY='15:30';
const SYM={D:'✓',A:'NA',N:'✗',M:'!',P:'·'};
const WHO='PL';
const TC_SECS=(pl,mode,r)=>secsFor(pl,mode,r);
const MEET_MIN=2;
function isDueNow(b,date){const t=todayStr();if(date<t)return true;if(date>t)return false;return nowMin()>toMin((b&&dueOf(b))||END_DAY)}
function stOf(doc,r,sec,date){const c=doc&&doc.cells&&doc.cells[r.key+'__'+sec];if(c&&c.s)return c.s;return isDueNow(r.block,date)?'M':'P'}
const rowLabel=r=>r.sub?r.item.name+' › '+r.label:r.label;
const shortN=pl=>pl.name.split(' ')[0];
function dayEmpty(pl,date){return ['dp','de'].every(m=>{const d=getDoc(pl,m,date);return !d||!Object.keys(d.cells||{}).some(k=>d.cells[k]&&(d.cells[k].s||(d.cells[k].obs&&d.cells[k].obs.length)))})}
function remLines(pl,doc,r,mode){
  const out=[];TC_SECS(pl,mode,r).forEach(sec=>{
    const k=r.key+'__'+sec;const e=doc&&doc.rem&&doc.rem[k];const a=doc&&doc.rem&&doc.rem['ac-'+k];const c=doc&&doc.cells&&doc.cells[k];
    const x=e&&String(e.x||'').trim(),ac=a&&String(a.x||'').trim();
    let n=e&&e.n!==''&&e.n!=null?e.n:'';if(n===''&&c&&c.n!==''&&c.n!=null&&c.n!==undefined)n=c.n;
    const ph=e&&e.ph&&e.ph.length?e.ph.length:0;
    if(x||n!==''||ac||ph)out.push({sec,x,n,ac,ph,by:(e&&e.by)||(a&&a.by)||''});
  });return out;
}
function remLineHTML(pl,l,withName){return `<div>${withName?`<b>${esc(shortN(pl))}${l.sec!=='x'?' · '+esc(l.sec):''}</b>`:`<b>${l.sec!=='x'?esc(l.sec):''}</b>`}${l.n!==''?' #'+esc(l.n):''}${l.x?': '+esc(l.x):''}${l.ph?' 📷'+l.ph:''}${l.ac?` <span class="ac">→ Action: ${esc(l.ac)}</span>`:''}</div>`}

/* ---------- Care watch (washroom / urine, water, lunch, other) ---------- */
const CW_TYPES={wr:'🚻 Washroom / urine',wt:'💧 Water',ln:'🍱 Lunch / food',ot:'⚕ Other'};
const CW_CHK=[['lb','Lunch box'],['fb','Fruit box'],['wb','Water bottle']];
function careList(doc){
  const out=[];if(!doc||!doc.rem)return out;
  Object.keys(doc.rem).forEach(k=>{const m=/^cw-([a-z0-9]+)__x$/.exec(k);if(!m)return;let v=null;try{v=JSON.parse(doc.rem[k].x||'null')}catch(e){}
    if(!v||!v.n)return;const id=m[1];const c=doc.cells&&doc.cells['cw-'+id+'__x'];const ac=doc.rem['cw-'+id+'-ac__x'];
    const chk={};CW_CHK.forEach(([q])=>{const cc=doc.cells&&doc.cells['cw-'+id+'-'+q+'__x'];chk[q]=(cc&&cc.s)||''});
    out.push({id,n:v.n,s:v.s||'',t:v.t||'ot',k:v.k||'r',at:doc.rem[k].at||0,by:doc.rem[k].by||'',met:(c&&c.obs)||[],chk,ac:ac?String(ac.x||''):''});});
  return out.sort((a,b)=>(a.k===b.k?0:a.k==='r'?-1:1)||a.at-b.at);
}
const hasCareKeys=doc=>!!(doc&&doc.rem&&Object.keys(doc.rem).some(k=>/^cw-[a-z0-9]+__x$/.test(k)));
function careBad(c,date){return c.k==='r'&&c.met.length<MEET_MIN&&isDueNow(null,date)}
function medList(pl,date){const d=getDoc(pl,'dp',date);return ((d&&d.med)||[]).map(m=>({id:m.id,n:m.name,s:m.sec||'',x:m.x||'',met:[m.ack?m.ack.at:0].concat((m.fu||[]).map(f=>f.at)).filter(Boolean)}))}
const medBad=(m,date)=>m.met.length<MEET_MIN&&isDueNow(null,date);
const cwid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function cwCell(plId,key,s){
  const id=docId(plId,'dp',S.date);const doc=ensureDoc(id,plId,'dp',S.date);
  const c={s:s,by:whoName(),at:Date.now(),l:0};doc.cells[key]=c;persist(id,{cells:{[key]:clone(c)}});
}
function cwPanel(pl,doc,editable){
  const list=careList(doc);const date=S.date;
  let h=`<div class="cw"><div class="cwh">👶 Care watch <span class="muted">— children to check through the day (met at least ${MEET_MIN}×)</span></div>`;
  list.forEach(c=>{
    const bad=careBad(c,date);
    h+=`<div class="cwc ${bad?'bad':''} ${c.k==='o'?'one':''}"><div class="cwt"><div><b>${esc(c.n)}</b>${c.s?' · '+esc(c.s):''} <span class="cwty">${CW_TYPES[c.t]||''}</span> ${c.k==='o'?'<span class="cwty o">Today only</span>':''}</div>`+
      (editable?`<button class="mini" data-act="cwdel" data-pl="${pl.id}" data-id="${c.id}">Remove</button>`:'')+`</div>`+
      `<div class="tms">${c.met.map((t,i)=>`<span class="tmc fu">Met ${i+1} · ${fmtT(t)}</span>`).join('')||`<span class="tmc ${bad?'no':''}">Not met yet</span>`}${c.k==='r'?`<span class="tmc ${c.met.length>=MEET_MIN?'fu':'ack'}">${c.met.length}/${MEET_MIN}</span>`:''}</div>`+
      `<div class="acts">${editable?`<button class="btn2 fu sm" data-act="cwmet" data-pl="${pl.id}" data-id="${c.id}">+ Met now</button>${c.met.length?`<button class="mini" data-act="cwunmet" data-pl="${pl.id}" data-id="${c.id}">↶</button>`:''}`:''}`+
      CW_CHK.map(([q,lbl])=>{const v=c.chk[q];return `<button class="cwk ${v}" ${editable?`data-act="cwchk" data-pl="${pl.id}" data-id="${c.id}" data-q="${q}"`:'disabled'}>${lbl} ${v==='D'?'✓':v==='N'?'✗':v==='A'?'NA':''}</button>`}).join('')+`</div>`+
      `<input class="cwin" data-pl="${pl.id}" data-id="${c.id}" placeholder="Observation / action taken (optional)" value="${esc(c.ac)}" ${editable?'':'readonly'}></div>`;
  });
  if(!list.length)h+=`<div class="muted" style="margin:4px 0 8px">No child on the care watch today.</div>`;
  if(editable)h+=`<div class="cwf"><input class="cwin" id="cwn_${pl.id}" placeholder="Child's name" autocomplete="off"><select class="cwin" id="cws_${pl.id}">${pl.sections.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`+
    `<select class="cwin" id="cwt_${pl.id}">${Object.keys(CW_TYPES).map(k=>`<option value="${k}">${CW_TYPES[k]}</option>`).join('')}</select><select class="cwin" id="cwk_${pl.id}"><option value="r">Regular – check daily</option><option value="o">Today only (unusual case)</option></select>`+
    `<button class="btn2 full" data-act="cwadd" data-pl="${pl.id}">+ Add child</button></div>`;
  return h+`</div>`;
}
function cwAdd(plId){
  if(!canAct(plId))return;const g=x=>document.getElementById(x+'_'+plId);
  const n=(g('cwn').value||'').trim();if(!n){showMsg("Type the child's name.");g('cwn').focus();return}
  const id=cwid();const key='cw-'+id+'__x';
  const docI=docId(plId,'dp',S.date);const doc=ensureDoc(docI,plId,'dp',S.date);
  const e={x:JSON.stringify({n:n.slice(0,60),s:g('cws').value,t:g('cwt').value,k:g('cwk').value}),by:whoName(),at:Date.now()};
  cwRemSave(docI,doc,key,e);render(true);
}
function cwDel(plId,cid){const docI=docId(plId,'dp',S.date);const doc=ensureDoc(docI,plId,'dp',S.date);cwRemSave(docI,doc,'cw-'+cid+'__x',{x:'',by:whoName(),at:Date.now()});render(true)}
function cwMet(plId,cid,op){
  if(!canAct(plId))return;const id=docId(plId,'dp',S.date);const doc=ensureDoc(id,plId,'dp',S.date);const key='cw-'+cid+'__x';
  if(op==='pop'&&!((doc.cells[key]&&doc.cells[key].obs)||[]).length)return;
  doc.cells[key]=applyOps(doc.cells[key],[op],whoName());persist(id,{cells:{[key]:{ops:[op]}}});render(true);
}
const CYC={'':'D',D:'N',N:'A',A:''};
function cwChk(plId,cid,q){if(!canAct(plId))return;const doc=ensureDoc(docId(plId,'dp',S.date),plId,'dp',S.date);const key='cw-'+cid+'-'+q+'__x';cwCell(plId,key,CYC[(doc.cells[key]&&doc.cells[key].s)||'']);render(true)}
function cwAc(el){const plId=el.dataset.pl;if(!canAct(plId)||!el.dataset.id)return;const docI=docId(plId,'dp',S.date);const doc=ensureDoc(docI,plId,'dp',S.date);
  cwRemSave(docI,doc,'cw-'+el.dataset.id+'-ac__x',{x:el.value.slice(0,300),by:whoName(),at:Date.now()},true)}
/* Regular names carry forward: on a new day the list from the last working day is copied in once. */
const cwDone={};let cwPrevBusy=false;
function cwCarry(pl){
  const date=S.date;if(date!==todayStr()||!canAct(pl.id)||cwDone[pl.id+date])return;
  const doc=getDoc(pl,'dp',date);if(hasCareKeys(doc)){cwDone[pl.id+date]=1;return}
  const prev=Object.keys(S.docs).filter(id=>{const d=S.docs[id];return d.pl===pl.id&&d.mode==='dp'&&d.date<date&&hasCareKeys(d)}).map(id=>S.docs[id]).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!prev){
    if(cwPrevBusy||cwDone['prev'+S.wk])return;cwPrevBusy=true;
    const m=parseD(S.wk);m.setDate(m.getDate()-7);
    api('state',[ds(m)]).then(v=>{Object.keys(v.docs||{}).forEach(id=>{if(!S.docs[id])S.docs[id]=v.docs[id]})}).catch(()=>{}).finally(()=>{cwPrevBusy=false;cwDone['prev'+S.wk]=1;render()});
    return;
  }
  cwDone[pl.id+date]=1;
  const regs=careList(prev).filter(c=>c.k==='r');if(!regs.length)return;
  const id=docId(pl.id,'dp',date);const d=ensureDoc(id,pl.id,'dp',date);const patch={rem:{}};
  regs.forEach(c=>{const key='cw-'+c.id+'__x';d.rem[key]={x:JSON.stringify({n:c.n,s:c.s,t:c.t,k:'r'}),by:whoName(),at:Date.now()};patch.rem[key]=clone(d.rem[key])});
  persist(id,patch);
}

/* ---------- Dashboard: done / not-done check with category tabs ---------- */
function rowCheck(r,mode,date){
  let tot=0,done=0,bad=0,pend=0;const parts=[],badW=[],badL=[],rems=[];
  PLS.forEach(pl=>{
    const doc=getDoc(pl,mode,date);const secs=TC_SECS(pl,mode,r);const bw=[];
    const chips=secs.map(sec=>{const st=stOf(doc,r,sec,date);tot++;if(st==='D'||st==='A')done++;else if(st==='N'||st==='M'){bad++;bw.push(`<span class="nds ${st}">${sec!=='x'?esc(sec)+' ':''}${st==='N'?'not done':'not marked'}</span>`)}else pend++;
      return `<span class="cp ${st}" title="${esc(pl.name)}${sec!=='x'?' · '+sec:''}">${sec!=='x'?esc(sec)+' ':''}${SYM[st]}</span>`}).join('');
    parts.push(`<span class="tpl"><i>${esc(shortN(pl))}</i>${chips}</span>`);
    if(bw.length){badW.push(`<b>${esc(shortN(pl))}</b> ${bw.join(' ')}`);badL.push(`<span class="ndn">${esc(shortN(pl))}</span> ${bw.join(' ')}`)}
    remLines(pl,doc,r,mode).forEach(l=>rems.push(remLineHTML(pl,l,true)));
  });
  return {tot,done,bad,pend,parts,badW,badL,rems};
}
function careStrip(date){
  const out=[];PLS.forEach(pl=>{
    if(WHO==='PM')medList(pl,date).filter(m=>medBad(m,date)).forEach(m=>out.push(`<b>${esc(shortN(pl))}</b> · 🩺 ${esc(m.n)}${m.s?' '+esc(m.s):''} met ${m.met.length}/${MEET_MIN}`));
    careList(getDoc(pl,'dp',date)).filter(c=>careBad(c,date)).forEach(c=>out.push(`<b>${esc(shortN(pl))}</b> · 👶 ${esc(c.n)}${c.s?' '+esc(c.s):''} met ${c.met.length}/${MEET_MIN}`));
  });return out;
}
function careTab(date){
  let h=`<div class="muted" style="margin-bottom:8px">Guideline: every medical case and every regular care-watch child is met at least ${MEET_MIN} times in the day (noted + follow-up).</div>`;
  PLS.forEach(pl=>{
    const med=WHO==='PM'?medList(pl,date):[];const cw=careList(getDoc(pl,'dp',date));
    h+=`<div class="tcblk">${esc(pl.name)} · ${esc(pl.cls)}</div>`;
    if(!med.length&&!cw.length){h+=`<div class="muted" style="margin-bottom:6px">No medical case or care-watch child logged.</div>`;return}
    h+=`<div class="tw"><table class="cwtab"><tr><th>Child</th><th>Type</th><th>Met</th><th>Checks / note</th></tr>`+
      med.map(m=>{const b=medBad(m,date);return `<tr class="${b?'bad':''}"><td><b>${esc(m.n)}</b>${m.s?' · '+esc(m.s):''}</td><td>🩺 Medical</td><td><b class="${m.met.length>=MEET_MIN?'okc':'noc'}">${m.met.length}×</b> ${m.met.map(fmtT).join(', ')}</td><td>${esc(m.x)}</td></tr>`}).join('')+
      cw.map(c=>{const b=careBad(c,date);return `<tr class="${b?'bad':''}"><td><b>${esc(c.n)}</b>${c.s?' · '+esc(c.s):''}${c.k==='o'?' <span class="cwty o">today</span>':''}</td><td>${CW_TYPES[c.t]||''}</td><td><b class="${c.met.length>=MEET_MIN||c.k==='o'?'okc':'noc'}">${c.met.length}×</b> ${c.met.map(fmtT).join(', ')}</td><td>${CW_CHK.map(([q,l])=>c.chk[q]?`${l} ${SYM[c.chk[q]]}`:'').filter(Boolean).join(' · ')}${c.ac?`<div class="ac">→ ${esc(c.ac)}</div>`:''}</td></tr>`}).join('')+`</table></div>`;
  });
  return h;
}
function taskCheck(mode,date){
  const blocks=DEFS[mode];const tab=S.tcTab||'nd';
  const per={};let nBad=0;
  blocks.forEach(b=>{per[b.id]=0;ROWS[mode].filter(r=>r.block===b).forEach(r=>{const x=rowCheck(r,mode,date);if(x.bad){per[b.id]++;nBad++}})});
  const cs=mode==='dp'?careStrip(date):[];
  let h=`<div class="card tcard"><h3>Done / not-done check <span class="hint">${parseD(date).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span></h3>`;
  h+=`<div class="tabs2 noprint"><button data-act="tctab" data-v="nd" class="${tab==='nd'?'on':''} red">⚠ Not done <span class="bd">${nBad+cs.length}</span></button>`+
    blocks.map(b=>`<button data-act="tctab" data-v="${b.id}" class="${tab===b.id?'on':''}">${esc(b.name)}${per[b.id]?` <span class="bd">${per[b.id]}</span>`:' <span class="okd">✓</span>'}</button>`).join('')+
    (mode==='dp'?`<button data-act="tctab" data-v="care" class="${tab==='care'?'on':''}">${WHO==='PM'?'🩺 Medical & care':'👶 Care watch'}${cs.length?` <span class="bd">${cs.length}</span>`:''}</button>`:'')+
    `<button data-act="report" data-v="">📄 Report cards</button></div>`;
  h+=`<div class="leg"><span><span class="cp D">✓</span> Done</span><span><span class="cp A">NA</span> Not applicable</span><span><span class="cp N">✗</span> Marked not done</span><span><span class="cp M">!</span> Not marked – time over</span><span><span class="cp P">·</span> Still due</span></div>`;
  if(tab==='care'&&mode==='dp')return h+careTab(date)+`</div>`;
  if(tab==='nd'){
    /* one dark, bold strip per segment — tap to open; inside, task title bold, defaulter names & sections light */
    let body='',okN=0;const grp={},ord=[];
    ROWS[mode].forEach(r=>{const x=rowCheck(r,mode,date);if(!x.bad){if(!x.pend)okN++;return}
      if(!grp[r.block.id]){grp[r.block.id]={b:r.block,items:[],n:0};ord.push(r.block.id)}
      const g=grp[r.block.id];g.n+=x.bad;
      g.items.push(`<div class="ndi"><div class="ndt">${esc(rowLabel(r))}</div><div class="ndw">${x.badL.join('<span class="sep">·</span>')}</div></div>`)});
    const seg=(k,title,cnt,sub,inner)=>{const dk='nd|'+mode+'|'+k;
      return `<details class="ndg" data-k="${dk}" ${detOpen(dk,false)?'open':''}><summary><span class="ndgt">${esc(title)}</span><span class="ndgc">${sub}</span><span class="ndgb">${cnt}</span><span class="ndga">›</span></summary><div class="ndgi">${inner}</div></details>`};
    ord.forEach(id=>{const g=grp[id];body+=seg(id,g.b.name,g.n,`${g.items.length} task${g.items.length>1?'s':''}`,g.items.join('')+`<button class="ndmore" data-act="tctab" data-v="${id}">See every section of ${esc(g.b.name)} ›</button>`)});
    if(cs.length)body+=seg('care',WHO==='PM'?'Medical & care watch':'Care watch',cs.length,`met fewer than ${MEET_MIN}×`,cs.map(x=>`<div class="ndi"><div class="ndw">${x}</div></div>`).join('')+`<button class="ndmore" data-act="tctab" data-v="care">Open the full list ›</button>`);
    h+=body?`<div class="ndhint">Tap a segment to see who has not done it.</div>`+body:`<div class="allclear">✓ Nothing marked not done and nothing overdue.</div>`;
    if(okN)h+=`<div class="okline" style="margin-top:8px">✓ ${okN} task${okN>1?'s':''} done by everyone · tap a category above to see every section</div>`;
    return h+`</div>`;
  }
  const b=blocks.find(x=>x.id===tab)||blocks[0];
  ROWS[mode].filter(r=>r.block===b).forEach(r=>{const x=rowCheck(r,mode,date);

}

/* ---------- Report cards (daily / weekly, ✓ and ✗ per task) ---------- */
function repDayCell(pl,mode,r,date){
  const today=todayStr();if(date>today)return {k:'F'};
  if(date<today&&dayEmpty(pl,date))return {k:'E'};
  const doc=getDoc(pl,mode,date);const secs=TC_SECS(pl,mode,r);const st=secs.map(sec=>stOf(doc,r,sec,date));
  const badS=secs.filter((sec,i)=>st[i]==='N'||st[i]==='M');
  if(badS.length)return {k:'X',bad:badS,tot:secs.length};
  if(st.every(x=>x==='A'))return {k:'NA'};
  if(st.every(x=>x==='D'||x==='A'))return {k:'Y'};
  return {k:'P'};
}
function cellHTML(c){
  if(c.k==='Y')return '<span class="y">✓</span>';
  if(c.k==='X')return `<span class="x">✗${c.tot>1?`<small>${c.bad.length}</small>`:''}</span>`;
  if(c.k==='NA')return '<span class="na">NA</span>';
  if(c.k==='E')return '<span class="e">–</span>';
  return '<span class="e">·</span>';
}

/* ================= SCREENS & PHONE BACK =================
   #/dash · #/pl/<id> · #/report · #/pw · #/logins — Back steps one screen; at home a second Back leaves. */
const navStack=[];const scrollAt={};
const homeRoute=()=>S.me&&S.me.senior?'#/dash':'#/pl/'+(S.me?S.me.id:'');
function curRoute(){if(!S.me)return '#/login';if(S.view)return '#/'+S.view;return S.tab==='dash'?'#/dash':'#/pl/'+S.tab}
function applyRoute(h){
  const m=/^#\/(dash|pl\/([a-z]+)|report|pw|logins)$/.exec(h||'');if(!m||!S.me)return false;
  if(m[1]==='dash'){if(!S.me.senior)return false;S.view=null;S.tab='dash'}
  else if(m[2]){if(!plOf(m[2])||(!S.me.senior&&m[2]!==S.me.id))return false;S.view=null;S.tab=m[2]}
  else{if(m[1]==='logins'&&!S.me.admin)return false;S.view=m[1];if(m[1]==='logins')S.users=null}
  return true;
}
function routeFromHash(first){

    if(h&&h!==homeRoute()&&applyRoute(h)){history.pushState({},'',h);navStack.push(h)}else applyRoute(homeRoute())}

function go(route){   // move to a screen, keeping the phone's Back history in step
  const cur=curRoute();if(route===cur)return;scrollAt[cur]=window.scrollY;
  if(navStack.length>=2&&navStack[navStack.length-2]===route){history.back();return}
  applyRoute(route);history.pushState({},'',route);navStack.push(route);render(true);window.scrollTo(0,scrollAt[route]||0);
}

  scrollAt[navStack[navStack.length-1]]=window.scrollY;
  const i=navStack.lastIndexOf(h);if(i>=0)navStack.length=i+1;else{navStack.length=0;navStack.push(homeRoute());if(h!==homeRoute())navStack.push(h)}

  const rows=[['Date','PL','Report','Block','Item','Section','Status','Marked by','Marked at','Remark/No.','Remark by']];
  const lab={D:'Done',N:'Not done',A:'NA','':''};
  Object.keys(S.docs).sort().forEach(id=>{const d=S.docs[id];if(d.wk!==S.wk)return;const pl=plOf(d.pl);if(!pl||!ROWS[d.mode])return;
    ROWS[d.mode].forEach(r=>secsFor(pl,d.mode,r).forEach(sec=>{const k=r.key+'__'+sec,c=d.cells[k],e=d.rem[k];if(!c&&!e)return;
      rows.push([d.date,pl.name,d.mode==='dp'?'Day Plan':'Day End',r.block.name,r.sub?r.item.name+' > '+r.label:r.label,sec==='x'?'':sec,
        c?(c.obs?c.obs.length+' observations':lab[c.s||'']):'',c?c.by||'':'',c&&c.at?new Date(c.at).toLocaleString('en-IN'):'',e?((e.n!==''&&e.n!=null?e.n+' ':'')+(e.x||'')):'',e?e.by||'':''])}))});
  const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PL-Reports-week-'+S.wk+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ================= EVENTS ================= */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;if(t.tagName==='A')ev.preventDefault();
  const a=t.dataset.act;
  if(a==='login'){doLogin();return}
  if(a==='logout'){logout();return}
  if(a==='back'){goBack();return}
  if(a==='clearfails'){S.failed=[];saveQueue();paintFails();return}
  if(a==='csv'){exportCSV();return}
  if(a==='reload'){location.reload();return}
  if(a==='view'){if(S.view===t.dataset.v){goBack();return}S.users=null;go('#/'+t.dataset.v);return}
  if(a==='closeview'){goBack();return}
  if(a==='savepw'){doChangePw(S.me.id,'np1','np2');return}
  if(a==='setuserpw'){doChangePw(t.dataset.u,'up_'+t.dataset.u);return}
  if(a==='report'){S.rep.pl=t.dataset.v||S.rep.pl;go('#/report');return}
  if(a==='reppl'){S.rep.pl=t.dataset.v;render(true);return}
  if(a==='repkind'){S.rep.kind=t.dataset.v;render(true);return}
  if(a==='print'){const pl=plOf(S.rep.pl);const old=document.title;document.title=`PL ${S.rep.kind==='week'?'Weekly':'Daily'} Report - ${pl?pl.name:''} - ${S.rep.kind==='week'?'week of '+S.wk:S.date}`;window.print();setTimeout(()=>document.title=old,1500);return}
  if(a==='cntl'){S.cntOpen=S.cntOpen===t.dataset.v?null:t.dataset.v;render(true);return}
  if(a==='tctab'){S.tcTab=t.dataset.v;render(true);return}
  if(a==='cwadd'){cwAdd(t.dataset.pl);return}
  if(a==='cwdel'){if(confirmDel(t))cwDel(t.dataset.pl,t.dataset.id);return}
  if(a==='cwmet'){cwMet(t.dataset.pl,t.dataset.id,'add');return}
  if(a==='cwunmet'){cwMet(t.dataset.pl,t.dataset.id,'pop');return}
  if(a==='cwchk'){cwChk(t.dataset.pl,t.dataset.id,t.dataset.q);return}
  if(a==='mode'){S.mode=t.dataset.v;render(true)}
  else if(a==='tab'){if(t.dataset.v==='dash'&&!(S.me&&S.me.senior))return;go(t.dataset.v==='dash'?'#/dash':'#/pl/'+t.dataset.v)}
  else if(a==='day'){S.date=t.dataset.v;render(true)}
  else if(a==='wk'){
    const m=parseD(S.wk);m.setDate(m.getDate()+7*Number(t.dataset.v));S.wk=ds(m);
    const dates=weekDates(S.wk);const today=todayStr();
    S.date=dates.includes(today)?today:dates.filter(d=>d<=today).pop()||dates[0];
    subscribeWeek(S.wk);render(true);
  }
  else if(a==='tick')doTick(t.dataset.pl,t.dataset.row,t.dataset.sec);
  else if(a==='obsadd')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'add');
  else if(a==='obsundo'){if(canAct(t.dataset.pl))obsUndo(t.dataset.pl,t.dataset.row)}
  else if(a==='allrow'){const p=plOf(t.dataset.pl);if(!canAct(p.id))return;const rr=ROWMAP[S.mode][t.dataset.row];if(rr.item.multi)return;setCells(p.id,secsFor(p,S.mode,rr).map(s=>[t.dataset.row,s,'D']))}
  else if(a==='allitem'){const p=plOf(t.dataset.pl);if(!canAct(p.id))return;const list=[];ROWS[S.mode].filter(r=>r.item.id===t.dataset.item).forEach(r=>secsFor(p,S.mode,r).forEach(s=>list.push([r.key,s,'D'])));setCells(p.id,list)}
  else if(a==='rem'){const k=t.dataset.pl+'|'+t.dataset.row;S.openRem[k]=!S.openRem[k];render(true)}
  else if(a==='edittime'){S.editTime=S.editTime===t.dataset.b?null:t.dataset.b;render(true)}
  else if(a==='canceltime'){S.editTime=null;render(true)}
  else if(a==='savetime'||a==='notime'||a==='deftime'){
    if(!isSenior())return;const b=t.dataset.b;let v;
    if(a==='savetime'){v=document.getElementById('tin').value;if(!v)return}
    else if(a==='notime')v='none';else v='def';
    S.times[b]=v;persistCfg({times:{[b]:v},by:whoName(),at:Date.now()});
    S.editTime=null;render(true);
  }
});
document.addEventListener('input',ev=>{if(ev.target.classList&&ev.target.classList.contains('remin'))onRemInput(ev.target);else if(ev.target.classList&&ev.target.classList.contains('cwin')&&ev.target.dataset.id)cwAc(ev.target)});
document.addEventListener('focusout',ev=>{
  if(ev.target.classList&&(ev.target.classList.contains('remin')||ev.target.classList.contains('cwin'))){flushAll();setTimeout(()=>{if(!typing()&&S.dirty)render(true)},80)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='lpw')doLogin()});
window.addEventListener('pagehide',flushAll);
let statusSig='';
setInterval(()=>{if(document.hidden||!S.me)return;const sig=todayStr()+'|'+DEFS[S.mode].map(b=>{const d=dueOf(b);return d&&nowMin()>toMin(d)?1:0}).join('');if(sig!==statusSig){statusSig=sig;requestRender()}},60000);   // due/overdue labels change only at due times
render(true);initDb();
/* service worker + 'new version' banner come from the shared FIS shell (../fis/shell.js → /sw.js) */
</script>
