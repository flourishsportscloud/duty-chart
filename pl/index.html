<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2D5A">
<link rel="icon" href="../fis/fis-icon-192.png">
<title>PL Plan – Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== PL Plan – Live · cool-neutral corporate theme ===== */
:root{
  --bg:#f2f4f7;--card:#ffffff;--card2:#f8fafc;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--faint:#94a3b8;--line:#e5e9f0;--line2:#d5dbe5;
  --head:#111827;--head2:#1f2937;--navy:#2b4c7e;--navy2:#1f2937;--accent:#2b4c7e;--accentS:#e8eef7;
  --green:#15803d;--greenS:#ecfdf3;--greenL:#a7e3bf;--red:#c0362c;--redS:#fdf1f0;--redL:#f3b7b1;--amber:#b45309;--amberS:#fff7e8;--grey:#8a94a6;--greyS:#f1f3f6;--blue:#2b4c7e;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button{font-family:inherit;cursor:pointer}
/* top bar */
header{background:linear-gradient(180deg,var(--head2),var(--head));color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.h1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.h1 h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.h1 h1 a{color:#cbd5e1;text-decoration:none;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.14);padding:3px 9px;border-radius:99px}
.who{display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.who b{font-size:13px;font-weight:600;color:#e2e8f0;margin-right:2px}
.who button{border:1px solid rgba(255,255,255,.14);background:transparent;color:#cbd5e1;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600}
.sub{display:flex;justify-content:space-between;align-items:center;margin:10px auto 0;gap:8px;flex-wrap:wrap;max-width:1080px}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1);color:#cbd5e1;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#94a3b8}
.chip.live::before{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}.chip.err::before{background:#f87171}.chip.loc::before{background:#fbbf24}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#cbd5e1;padding:6px 16px;border-radius:8px;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--head)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,calc((100% - 1080px)/2 + 16px));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;text-align:left;line-height:1.2}
nav button.on{background:var(--head);border-color:var(--head);color:#fff}
nav button small{display:block;font-weight:500;font-size:10.5px;color:var(--mut);margin-top:1px}
nav button.on small{color:#94a3b8}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 40px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:.01em;display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.card h3 .hint{font-size:11.5px;font-weight:500;color:var(--mut)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
/* week strip */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.weeknav button.ar{border:1px solid var(--line);background:var(--card);border-radius:9px;width:34px;height:32px;font-size:15px;color:var(--ink2)}
.weeknav button.ar:disabled{opacity:.35}
.weeknav .wl{flex:1;text-align:center;font-weight:600;font-size:12.5px;color:var(--ink2)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:6px 2px 7px;text-align:center;font-size:11px;color:var(--mut);font-weight:500}
.day b{display:block;font-size:16px;color:var(--ink);font-weight:700;margin:1px 0}
.day .pc{font-weight:700;font-size:11.5px;color:var(--ink2)}
.day.g{background:var(--greenS);border-color:var(--greenL)}.day.g .pc{color:var(--green)}
.day.r{background:var(--redS);border-color:var(--redL)}.day.r .pc{color:var(--red)}
.day.today .tg{color:var(--accent)}
.day.sel{border-color:var(--head);box-shadow:0 0 0 1.5px var(--head)}
.day.lock{opacity:.45}
.day .tg{font-size:9px;letter-spacing:.06em;font-weight:700;height:11px;color:transparent}
/* notices */
.notice{padding:10px 12px;border-radius:11px;background:var(--amberS);color:#7c4a03;font-size:12.5px;margin-bottom:12px;border:1px solid #f6dfb5}
.notice.info{background:var(--accentS);color:var(--accent);border-color:#cdd9ea}
.notice.bad{background:var(--redS);color:#8f241c;border-color:var(--redL)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .k{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
.kpi .v small{font-size:13px;font-weight:600;color:var(--mut)}
.kpi.main{background:var(--head);border-color:var(--head)}.kpi.main .k{color:#94a3b8}.kpi.main .v{color:#fff}
.kpi.d .v{color:var(--green)}.kpi.n .v{color:var(--red)}.kpi.o .v{color:var(--amber)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hero h2{margin:2px 0 0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.cnt{text-align:center;border-radius:10px;padding:7px 2px;background:var(--card2);border:1px solid var(--line)}
.cnt b{display:block;font-size:17px;font-weight:700}.cnt span{font-size:10.5px;color:var(--mut);font-weight:500}
.cnt.d b{color:var(--green)}.cnt.n b{color:var(--red)}.cnt.a b{color:var(--grey)}
.bar{height:6px;border-radius:99px;background:#e9edf3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.rd i{background:linear-gradient(90deg,var(--green),var(--green) 70%,#e0a23b)}
.pct{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
/* PL scorecards */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.plc{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);box-shadow:var(--sh);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.plc:hover{border-color:var(--line2);box-shadow:0 2px 4px rgba(15,23,42,.05),0 10px 24px rgba(15,23,42,.07)}
.plc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plc h4{margin:0;color:var(--ink);font-size:15.5px;font-weight:700}.plc small{color:var(--mut);font-size:12px;font-weight:500}
.plc .mini3{display:flex;gap:14px;margin:12px 0 10px;font-size:12px;color:var(--mut)}
.plc .mini3 b{font-size:15px;color:var(--ink);display:block;font-weight:700}
.plc .mini3 .n b{color:var(--red)}.plc .mini3 .d b{color:var(--green)}
.plc .foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.plc .foot b{color:var(--ink2);font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tag.ok{background:var(--greenS);color:var(--green)}.tag.bad{background:var(--redS);color:var(--red)}.tag.warn{background:var(--amberS);color:var(--amber)}.tag.idle{background:var(--greyS);color:var(--mut)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--rc,var(--green)) calc(var(--p)*1%),#e9edf3 0);display:grid;place-items:center;flex:0 0 auto}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink)}
/* attention */
.att{display:grid;gap:10px}
.attpl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.attpl .ah{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--card2);border-bottom:1px solid var(--line);font-size:13px}
.attpl .ah b{font-weight:700}
.attpl ul{list-style:none;margin:0;padding:4px 12px}
.attpl li{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.attpl li:last-child{border-bottom:0}
.attpl li .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto;transform:translateY(-1px)}
.attpl li .dot.o{background:var(--amber)}
.attpl li .w{color:var(--mut)}
.lateline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.lateline:last-child{border-bottom:0}
.lateline .lb{font-weight:700;color:var(--amber);margin-right:2px}
.pill{display:inline-flex;gap:4px;align-items:center;border:1px solid #f1dcb6;background:var(--amberS);color:#7c4a03;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:600}
.pill small{font-weight:500;color:#a46a1a}
th small{display:block;font-weight:600;color:var(--ink2);font-size:12px;letter-spacing:0;text-transform:none}
.allclear{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--greenS);color:var(--green);font-weight:600;font-size:13px}
/* heat / week */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.sbox{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;font-size:11px;color:var(--mut);font-weight:600;background:var(--card)}
.sbox b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.sbox.r{border-color:var(--redL);background:var(--redS)}.sbox.g{border-color:var(--greenL);background:var(--greenS)}.sbox.g b{color:var(--green)}
.heatrow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.heatrow:last-child{border-bottom:0}
.heatrow .nm{font-weight:700;font-size:13px}.heatrow .nm small{display:block;color:var(--mut);font-weight:500;font-size:11px}
.wk{display:flex;gap:8px;align-items:flex-end;height:96px;margin-top:4px}
.wk div{flex:1;text-align:center;font-size:10.5px;color:var(--mut)}
.wk .col{height:64px;display:flex;align-items:flex-end;background:#eef1f5;border-radius:8px;overflow:hidden}
.wk .col i{width:100%;background:var(--faint);display:block;border-radius:8px 8px 0 0}
.wk .col i.g{background:var(--green)}.wk .col i.r{background:#d9796f}
.nd{font-size:12.5px;line-height:1.5}
.nd div{padding:6px 0;border-bottom:1px solid var(--line)}
.nd div:last-child{border-bottom:0}
.nd .bl{color:var(--mut)}
.ok{color:var(--green);font-weight:600;font-size:12.5px}
/* fold */
details.card{padding:0}
details.card>summary{list-style:none;padding:14px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin-left:10px;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>summary .hint{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:500}
details.card>.fb{padding:0 16px 14px}
/* task blocks (PL page) */
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.bh{background:var(--card2);color:var(--ink);padding:11px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bh .bn{font-weight:700;flex:1;min-width:140px;font-size:14px}
.st{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--greyS);letter-spacing:.02em}
.st.Done{color:var(--green);background:var(--greenS)}.st.Missed,.st.Overdue{color:var(--red);background:var(--redS)}.st.Due{color:var(--amber);background:var(--amberS)}.st.Upcoming{color:var(--accent);background:var(--accentS)}.st.NoFixed{color:var(--mut)}
.tm-chip{font-size:11px;background:var(--card);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);font-weight:600}
.bpc{font-size:12px;font-weight:700;color:var(--ink2)}
.timed{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--accentS);flex-wrap:wrap;font-size:12px}
.timed input{padding:5px;font-size:14px;border:1px solid var(--line2);border-radius:7px}
.timed button{border:0;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;background:var(--head);color:#fff}
.timed button.sec{background:#dfe5ee;color:var(--ink)}
.item{border-top:1px solid var(--line);padding:10px 14px}
.item:first-of-type{border-top:0}
.ih{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;margin-bottom:4px;font-size:13.5px}
.row{padding:6px 0 7px}
.row.sub{padding-left:12px;border-left:2px solid var(--line);margin:2px 0}
.rl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.lbl{font-size:13px;color:var(--ink2);font-weight:500}
.rb{display:flex;gap:5px;flex:0 0 auto}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--ink2)}
.mini.on{background:var(--accentS);border-color:#c9d6ea;color:var(--accent)}
.mini:disabled,.mini.ro{opacity:.45}
.boxes{display:flex;flex-wrap:wrap;gap:6px}
.box{min-width:58px;flex:0 0 auto;border:1.5px dashed var(--line2);background:var(--card);border-radius:11px;padding:3px 5px 5px;text-align:center;font-family:inherit;color:var(--ink);min-height:56px}
.box .sl{display:block;font-size:10px;color:var(--mut);height:12px;font-weight:600}
.box .sy{display:block;font-size:17px;font-weight:800;line-height:22px;color:#c3cad6}
.box .tm{display:block;font-size:9px;color:var(--mut);line-height:11px}
.box .tm.late{color:var(--amber);font-weight:700}
.box.d{background:var(--greenS);border:1.5px solid var(--greenL)}.box.d .sy{color:var(--green)}
.box.n{background:var(--redS);border:1.5px solid var(--redL)}.box.n .sy{color:var(--red)}
.box.a{background:var(--greyS);border:1.5px solid #d3d9e3}.box.a .sy{color:var(--grey)}
.box.ro{cursor:default}
.box.obs.oc{border:1.5px solid var(--oc);background:color-mix(in srgb,var(--oc) 12%,#fff)}.box.obs.oc .sy{color:var(--oc)}
.obsleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--mut);margin-top:4px}.obsleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.box.obs .tm{font-size:10px;line-height:12px;text-align:left;padding:0 2px}
.row.de{display:flex;align-items:center;gap:8px}
.row.de .rl{flex:1;margin:0}
.rembox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px;margin-top:6px}
.rr{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.rr .sn{flex:0 0 36px;font-weight:700;font-size:12px;padding-top:7px}
.rr input,.rr textarea{font:inherit;font-size:13px;border:1px solid var(--line2);border-radius:8px;padding:6px 7px;background:#fff}
.rr input{width:70px;flex:0 0 70px}.rr textarea{flex:1;min-height:34px;resize:vertical}
.rr .by{font-size:10px;color:var(--mut);flex:0 0 auto;max-width:90px}
/* tables */
.tw{overflow-x:auto;margin:0 -2px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--card2)}
tr:last-child td{border-bottom:0}
td.c{text-align:center;font-weight:700}
td.c span{display:inline-block;min-width:44px;padding:3px 6px;border-radius:8px}
td.g span{background:var(--greenS);color:var(--green)}td.r span{background:var(--redS);color:var(--red)}td.e span{color:var(--faint)}
.cat{margin-bottom:14px}.cat>b{color:var(--ink);font-size:13px}
.cat .tot{float:right;font-weight:700;font-size:12px;color:var(--accent)}
.cat table{margin-top:6px}
.muted{color:var(--mut);font-size:12px}
/* login */
.login{max-width:400px;margin:36px auto}.login label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.login select,.login input,.pwrow input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.btn{border:0;border-radius:10px;background:var(--head);color:#fff;font-weight:700;padding:11px 14px;font-size:14px;margin-top:14px;width:100%}
.btn.sec{background:#e3e8ef;color:var(--ink)}
.pwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pwrow .btn{margin:0;width:auto;padding:9px 12px;font-size:12px}
@media (max-width:640px){
  header{padding:10px 12px 9px}.wrap{padding:12px 12px 36px}nav{padding:8px 12px}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi.main{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
  .kpi .v{font-size:21px}.hero h2{font-size:18px}
  .heatrow{grid-template-columns:1fr;gap:6px}
  .card{padding:14px}
}
/* ===== FIS premium theme · navy + gold (school logo colours) ===== */
:root{--navy:#1F2D5A;--navy2:#16214A;--navy3:#2B3C74;--gold:#E3A94F;--goldlt:#F4D9A6;--goldink:#8A5B12;--ac:#E3A94F;
--bg:#F5F3EE;--card:#fff;--card2:#F8F6F1;--ink:#1B2340;--ink2:#3A4260;--mut:#646B80;--faint:#9AA0B3;--line:#E6E2D8;--line2:#D5CFBF;
--head:#16214A;--head2:#1F2D5A;--accent:#1F2D5A;--accentS:#EAEEF8;
--green:#1F7A52;--greenS:#E6F1EA;--greenL:#A9D3BD;--red:#B83247;--redS:#F8E6EA;--redL:#E8B3BF;--amber:#A8670A;--amberS:#FBF1DC;--grey:#8A91A6;--greyS:#ECEEF4;--blue:#2F5BB5;
--serif:'Lora',Georgia,'Times New Roman',serif;--sh:0 1px 2px rgba(20,25,60,.05),0 6px 20px rgba(20,25,60,.04)}
body{background:var(--bg);color:var(--ink)}

.day.sel{background:var(--navy);border-color:var(--navy);box-shadow:none;color:#C9D0E6}

<body>
<header>
  <div class="h1"><h1><a href="../fis/">‹ FIS</a><img class="hlogo" src="../fis/fis-logo-192.png" alt="FIS"><span>PL Plan – Live<small>Flourish International School</small></span></h1>
    <div class="who" id="whobox"></div></div>
  <div class="sub"><div class="seg" id="modeseg"></div><span class="chip" id="conn"></span></div>
</header>
<nav id="tabs"></nav>
<div class="wrap"><div id="msg"></div><div id="root"></div></div>

<script>
/* ================= CONFIG ================= */
const secList=(cls,letters)=>{const o=[];cls.forEach(c=>[...letters].forEach(l=>o.push(c+l)));return o};
const PLS=[
 {id:'poonam',ac:'#C2385B',name:'Poonam',cls:'Class 6–7',sections:secList([6,7],'ABC')},
 {id:'garima',ac:'#5F3585',name:'Garima',cls:'Class 8–9',sections:['8A','8B','8C','9A','9B']},
 {id:'santosh',ac:'#2B8FBF',name:'Santosh Yadav',cls:'Class 10–11',sections:['10A','10B','11A']}
];
const SENIORS=[{id:'sarita',name:'Sarita (Head of Secondary)'},{id:'dean',name:'Dean of Academics'},{id:'director',name:'Director–Admin'}];
const PEOPLE=[...PLS.map(p=>({id:p.id,name:p.name,pl:p.id})),...SENIORS.map(s=>({id:s.id,name:s.name,senior:true}))];

const DP=[
{id:'dp1',name:'Morning Round',time:'08:30',items:[
 {id:'assembly',name:'Assembly',rem:'r',subs:[['prayer','Prayer'],['fb','FB'],['tann',"Teacher's Announcement"],['uniform','Uniform'],['talk','Talk Hour']]},
 {id:'testobs',name:'Test Observation',rem:'r'},
 {id:'defaulters',name:'Defaulters',rem:'r',subs:[['late','Late Comers'],['uniform','Uniform']]}]},
{id:'dp8',name:'Class Observation',time:null,items:[{id:'lessoninsp',name:'Lesson Inspection',rem:'r',multi:1},{id:'learninginsp',name:'Learning Inspection',rem:'r',multi:1},{id:'tor',name:'Teaching Observation Report',rem:'n',multi:1}]},
{id:'dp2',name:'Reports',time:'10:45',items:[
 {id:'diary',name:'Diary Report',rem:'r'},{id:'collrep',name:'Collection Report',rem:'r'},{id:'defsubrev',name:'Defaulter Submission Review',rem:'r'}]},
{id:'dp3',name:'Activity',time:null,items:[
 {id:'cupboard',name:'Class Cupboard',rem:'r'},{id:'folder',name:'Class Folder',rem:'r'},{id:'display',name:'Class Display',rem:'r'},
 {id:'weeklysub',name:'Weekly Submission',rem:'r'},{id:'leftover',name:'Leftover Checked Assignment',rem:'r'},{id:'diststatus',name:'Distribution Status',rem:'r'},
 {id:'record',name:'Record Register',rem:'n'}]},
{id:'dp4',name:'Lunch Round',time:'11:30',items:[{id:'stayback',name:'Stayback',rem:'r'},{id:'lunchann',name:'PL Announcement',rem:'r'}]},
{id:'dp5',name:'Action',time:'14:30',items:[
 {id:'diarydef',name:'Diary Defaulter',rem:'r'},{id:'hwdef',name:'Home Work Defaulter',rem:'r'},{id:'absent',name:'Absentees Work',rem:'r'},
 {id:'testmarks',name:'Test Marks Defaulter',rem:'r'},{id:'hwquality',name:'HW Submission Quality',rem:'r'},{id:'mathspractice',name:'Maths Practice',rem:'r'}]},
{id:'dp6',name:'Distribution Round',time:'12:30',items:[{id:'distround',name:'Distribution Round & Report',rem:'r'}]},
{id:'dp7',name:'PL Round',time:'14:30',yn:true,items:[
 {id:'club10',name:'Club 10',rem:'r'},{id:'stationery',name:'Stationery',rem:'r'},{id:'bookreading',name:'Book Reading',rem:'r'},{id:'acadmot',name:'Academic Motivation',rem:'r'},{id:'plann',name:'Announcement',rem:'r'}]}
];
const DE=[
{id:'de1',name:'Parent Communication & Next Day Tests',time:'13:30',items:[
 {id:'diaryparent',name:'Diary to Parent & Test paper',subs:[['diary','Diary to Parent'],['test','Test paper'],['lessonpdf','Lesson PDF'],['testpdf','Test PDF'],['hwsms','Home Task SMS']]},
 {id:'defsms',name:'Defaulter SMS',subs:[['diary','Diary'],['booknb','Book-Notebook'],['test','Test'],['assign','Assignment']]}]},
{id:'de4',name:'Groups & Feedback',time:'15:00',items:[
 {id:'classgroup',name:'Class Group',subs:[['cgsg','Class / Subject Group'],['fg','Feedback Group'],['admin','Admin'],['pl','PL'],['stock','Stock']]},
 {id:'fbdisc',name:'Feedback Discussion',subs:[['diary','Diary'],['ohm','OHM'],['fo','FO'],['sb','SB']]}]},
{id:'de5',name:'Day-End Review & Discussion',time:'15:30',items:[
 {id:'ctp',name:'Class Test Performers'},{id:'chkcm',name:'Checking Status Review – CM'},{id:'chkmentor',name:'Checking Status Review – Mentor'},
 {id:'distcoll',name:'Distribution – Collection Record'},{id:'schedule',name:'Schedule Discussion'},
 {id:'mathsprep',name:'Maths Prep',sec:1,subs:[['planner','Planner'],['bookprep','Book Prep'],['checked','Checked Assignment'],['hwnb','HW Notebook'],['contentnb','Content Notebook'],['xerox','Content Xerox'],['diary','Diary'],['unchecked','Unchecked Status']]},
 {id:'teacherprep',name:'Teacher / Next Day Prep',sec:1,subs:[['lessonrev','Book / Lesson Review'],['content','Content'],['checkednb','Checked Notebook'],['checked','Checked Assignment'],['checkedtest','Checked Test'],['key','Assignment Answer Key'],['epl','EPL / Activity Prep'],['video','Video'],['ppt','PPT'],['viva','Viva'],['testdrive','Test on Drive'],['lessoninit','Lesson Initiative (Knowledge Spotlight / Literacy Lens)']]},
 {id:'supply',name:'Supply Chain',sec:1,subs:[['checked','Checked Assignment'],['testnb','Test NB'],['notebook','Notebook'],['nextassign','Next Day Assignment'],['bankxerox','Booklet / Xerox']]}]}
];
const DEFS={dp:DP,de:DE};
const ROWS={dp:[],de:[]};
Object.keys(DEFS).forEach(m=>DEFS[m].forEach(b=>b.items.forEach(it=>{
  if(it.subs) it.subs.forEach(s=>ROWS[m].push({key:it.id+'-'+s[0],item:it,label:s[1],block:b,rem:it.rem||'r',sub:true}));
  else ROWS[m].push({key:it.id,item:it,label:it.name,block:b,rem:it.rem||'r',sub:false});
})));
const ROWMAP={dp:{},de:{}};Object.keys(ROWS).forEach(m=>ROWS[m].forEach(r=>ROWMAP[m][r.key]=r));
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat'];

/* ================= HELPERS ================= */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const todayStr=()=>ds(new Date());
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function fmtT(ms){const d=new Date(ms);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap}
function fmt12(t){const a=t.split(':').map(Number);const ap=a[0]>=12?'PM':'AM';return (a[0]%12||12)+':'+pad(a[1])+' '+ap}
const docId=(pl,mode,date)=>pl+'_'+mode+'_'+date;

/* ================= STATE ================= */
const S={who:'',me:null,token:'',view:null,users:null,busy:false,tab:'dash',mode:'dp',wk:null,date:null,docs:{},times:{},conn:'init',openRem:{},editTime:null,dirty:false};
try{S.token=localStorage.getItem('plplan_token')||'';S.me=JSON.parse(localStorage.getItem('plplan_me')||'null');if(S.me)S.who=S.me.id}catch(e){}
if(!S.token)S.me=null;
(function initDates(){
  const now=new Date();
  if(now.getDay()===0){const y=new Date(now);y.setDate(y.getDate()-1);S.wk=ds(mondayOf(y));const sat=parseD(S.wk);sat.setDate(sat.getDate()+5);S.date=ds(sat)}
  else{S.wk=ds(mondayOf(now));S.date=ds(now)}
})();
const weekDates=wk=>{const m=parseD(wk);return DAYN.map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return ds(d)})};
const plOf=id=>PLS.find(p=>p.id===id);
const person=()=>PEOPLE.find(p=>p.id===S.who);
const isSenior=()=>!!(person()&&person().senior);
const canAct=plId=>{const p=person();if(!p)return false;if(S.date!==todayStr())return false;return !!(p.senior||p.pl===plId)};
const whoName=()=>person()?person().name:'';
const secsFor=(pl,mode,r)=>(mode==='dp'||(r&&r.item.sec))?pl.sections:['x'];
function dueOf(b){const t=S.times[b.id];if(t==='none')return null;if(t&&t!=='def')return t;return b.time}

/* ================= STORAGE (Google Sheet via Apps Script — see SETUP.md) ================= */
const API_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbyzHMWJYQOB8Qr9jlrsml9PnoRs6d9xjvzWMejOMUF_1RGohDSIhnHmxM6QF79LgJ-q/exec';
const lkey=()=>'plplan_gh_v2_'+(S.me?S.me.id:'');
function saveLocal(){try{localStorage.setItem(lkey(),JSON.stringify({docs:S.docs,times:S.times}))}catch(e){}}
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(lkey())||'null');if(o){S.docs=o.docs||{};S.times=o.times||{}}}catch(e){}}
function setConn(c){if(S.conn!==c){S.conn=c;paintConn()}}
let msgTimer=null;
function showMsg(t){const el=document.getElementById('msg');el.innerHTML=t?`<div class="notice bad">${esc(t)}</div>`:'';clearTimeout(msgTimer);if(t)msgTimer=setTimeout(()=>showMsg(''),6000)}
const queues={};
function enqueue(k,job){queues[k]=(queues[k]||Promise.resolve()).then(job).catch(()=>{})}
async function api(fn,args){
  let r;
  try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:args||[],token:S.token})})}
  catch(e){throw new Error('offline')}
  let j;try{j=JSON.parse(await r.text())}catch(e){throw new Error('offline')}
  if(!j.ok){const er=new Error(j.err||'Something went wrong.');er.server=true;if(/log in again/i.test(er.message)&&fn!=='login'){logout(true)}throw er}
  return j.v;
}
const unacked={},inflight={};
const hasPend=u=>!!(u&&(Object.keys(u.cells).length||Object.keys(u.rem).length));
function overlay(id,doc){
  doc.cells=doc.cells||{};doc.rem=doc.rem||{};
  [inflight[id],unacked[id]].forEach(u=>{if(u){
    Object.keys(u.cells).forEach(k=>{const c=u.cells[k];doc.cells[k]=c.ops?applyOps(doc.cells[k],c.ops,whoName()):clone(c)});
    Object.assign(doc.rem,clone(u.rem))}});
  return doc;
}
function persist(id,patch){
  const u=unacked[id]=unacked[id]||{cells:{},rem:{}};
  Object.keys(patch.cells||{}).forEach(k=>{const c=clone(patch.cells[k]);
    if(c.ops&&u.cells[k]&&u.cells[k].ops)u.cells[k].ops=u.cells[k].ops.concat(c.ops);else u.cells[k]=c});
  Object.assign(u.rem,clone(patch.rem||{}));
  saveLocal();
  if(!API_URL)return;
  enqueue(id,()=>sendDoc(id));
}
async function sendDoc(id){
  const u=unacked[id];if(!hasPend(u))return;
  inflight[id]=u;unacked[id]={cells:{},rem:{}};
  try{
    const doc=await api('save',[id,u]);
    delete inflight[id];S.docs[id]=overlay(id,doc);setConn('live');saveLocal();render();
  }catch(e){
    delete inflight[id];
    if(e.server){showMsg(e.message);poll()}
    else{const n=unacked[id];Object.keys(n.cells).forEach(k=>{const c=n.cells[k];if(c.ops&&u.cells[k]&&u.cells[k].ops)u.cells[k].ops=u.cells[k].ops.concat(c.ops);else u.cells[k]=c});
      unacked[id]={cells:u.cells,rem:Object.assign(u.rem,n.rem)};setConn('err')}
  }
}
let polling=false;
async function poll(){
  if(!API_URL||polling||!S.token)return;polling=true;const wk=S.wk;
  try{
    Object.keys(unacked).forEach(id=>{if(hasPend(unacked[id]))enqueue(id,()=>sendDoc(id))});
    const v=await api('state',[wk]);
    if(wk===S.wk){
      Object.keys(S.docs).forEach(id=>{if(S.docs[id].wk===wk&&!v.docs[id]&&!hasPend(unacked[id])&&!inflight[id])delete S.docs[id]});
      Object.keys(v.docs).forEach(id=>{S.docs[id]=overlay(id,v.docs[id])});
      S.times=v.times||{};
      if(v.me){S.me=Object.assign(S.me||{},v.me);try{localStorage.setItem('plplan_me',JSON.stringify(S.me))}catch(e){}}
    }
    setConn('live');saveLocal();render();
  }catch(e){setConn('err')}
  finally{polling=false}
}
function subscribeWeek(wk){poll()}
function setSession(v){
  S.token=v.token;S.me=v.me;S.who=v.me.id;S.docs={};S.times={};
  try{localStorage.setItem('plplan_token',S.token);localStorage.setItem('plplan_me',JSON.stringify(S.me))}catch(e){}
  S.tab=S.me.senior?'dash':S.me.id;loadLocal();
}
function logout(expired){
  try{localStorage.removeItem(lkey());localStorage.removeItem('plplan_token');localStorage.removeItem('plplan_me')}catch(e){}
  S.token='';S.me=null;S.who='';S.docs={};S.view=null;S.users=null;
  render(true);if(expired)showMsg('Please log in again.');
}
async function doLogin(){
  const id=document.getElementById('lid').value,pw=document.getElementById('lpw').value.trim();
  if(!id||!pw){showMsg('Choose your name and type your password.');return}
  S.busy=true;render(true);
  try{const v=await api('login',[id,pw]);setSession(v);showMsg('');S.busy=false;render(true);poll()}
  catch(e){S.busy=false;render(true);showMsg(e.server?e.message:"Can't reach the server. Check your internet.")}
}
async function doChangePw(target,inId,in2Id){
  const pw=document.getElementById(inId).value,pw2=in2Id?document.getElementById(in2Id).value:pw;
  if(pw.length<6){showMsg('Password must be at least 6 characters.');return}
  if(pw!==pw2){showMsg('The two passwords do not match.');return}
  try{const v=await api('changePw',[target,pw]);
    if(v&&v.token){setSession(v);S.view=null;render(true);showOk('Password changed.');poll()}
    else{document.getElementById(inId).value='';showOk('New password set for '+PEOPLE.find(p=>p.id===target).name+'.')}
  }catch(e){showMsg(e.message)}
}
function showOk(t){const el=document.getElementById('msg');el.innerHTML=`<div class="notice info">${esc(t)}</div>`;clearTimeout(msgTimer);msgTimer=setTimeout(()=>showMsg(''),5000)}
function loginHTML(){
  return `<div class="card login"><div class="llogo"><img src="../fis/fis-logo-192.png" alt="FIS"></div><h3 style="font-size:17px">Log in</h3><div class="muted">PL Plan – Live · FIS</div>
  <label for="lid">Your name</label><select id="lid"><option value="">— choose —</option>${PEOPLE.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>

/* ================= MUTATIONS ================= */
function ensureDoc(id,plId,mode,date){
  if(!S.docs[id])S.docs[id]={pl:plId,mode:mode,date:date,wk:ds(mondayOf(parseD(date))),cells:{},rem:{}};
  const d=S.docs[id];d.cells=d.cells||{};d.rem=d.rem||{};return d;
}
function mkCell(rk,s,now,mode,date){
  const b=ROWMAP[mode][rk].block;const due=dueOf(b);
  const late=(s&&due&&date===todayStr()&&nowMin()>toMin(due))?1:0;
  return{s:s,by:whoName(),at:now,l:late};
}
function setCells(plId,list){
  const mode=S.mode,date=S.date;const id=docId(plId,mode,date);const doc=ensureDoc(id,plId,mode,date);
  const now=Date.now();const patch={cells:{}};
  list.forEach(x=>{const key=x[0]+'__'+x[1];const c=mkCell(x[0],x[2],now,mode,date);doc.cells[key]=c;patch.cells[key]=clone(c)});
  persist(id,patch);render();
}
const OBS_MAX=7;
const OBS_COL=['','#d64545','#e0b000','#9bc53d','#1e9e5a','#14a3a3','#3a63c8','#7b4fc9'];
const OBS_NAME=['','Red','Yellow','Light green','Green','Teal','Blue','Purple'];
function applyOps(cell,ops,by){
  const obs=((cell&&cell.obs)||[]).slice();
  ops.forEach(o=>{if(o==='add')obs.push(Date.now());else if(o==='pop')obs.pop()});
  return {s:obs.length?'D':'',obs:obs,by:by,at:Date.now(),l:0};
}
function doObs(plId,rk,sec,op){
  if(!canAct(plId))return;
  const mode=S.mode,date=S.date,id=docId(plId,mode,date),doc=ensureDoc(id,plId,mode,date),key=rk+'__'+sec;
  if(op==='add'&&((doc.cells[key]&&doc.cells[key].obs)||[]).length>=OBS_MAX)return;
  doc.cells[key]=applyOps(doc.cells[key],[op],whoName());
  persist(id,{cells:{[key]:{ops:[op]}}});render();
}
function obsUndo(plId,rk){
  const doc=S.docs[docId(plId,S.mode,S.date)];if(!doc)return;
  let best=null,bt=0;Object.keys(doc.cells).forEach(k=>{const p=k.split('__');if(p[0]!==rk)return;const o=doc.cells[k].obs||[];if(o.length&&o[o.length-1]>bt){bt=o[o.length-1];best=p[1]}});
  if(best)doObs(plId,rk,best,'pop');
}
const NEXT={'':'D',D:'N',N:'A',A:''};
function doTick(plId,rk,sec){
  if(!canAct(plId))return;
  const id=docId(plId,S.mode,S.date);const c=S.docs[id]&&S.docs[id].cells[rk+'__'+sec];
  setCells(plId,[[rk,sec,NEXT[(c&&c.s)||'']]]);
}
const timers={},pend={};
function schedule(id,key){(pend[id]=pend[id]||new Set()).add(key);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700)}
function flush(id){
  clearTimeout(timers[id]);const keys=pend[id];if(!keys||!keys.size)return;pend[id]=new Set();
  const doc=S.docs[id];const patch={cells:{},rem:{}};
  keys.forEach(k=>{if(doc.rem[k])patch.rem[k]=clone(doc.rem[k]);if(doc.cells[k])patch.cells[k]=clone(doc.cells[k])});
  persist(id,patch);
}
function flushAll(){Object.keys(pend).forEach(flush)}
function onRemInput(el){
  const plId=el.dataset.pl,rk=el.dataset.row,sec=el.dataset.sec,f=el.dataset.f;
  if(!canAct(plId))return;
  const mode=S.mode,date=S.date,id=docId(plId,mode,date),doc=ensureDoc(id,plId,mode,date),key=rk+'__'+sec;
  const e=doc.rem[key]||{n:'',x:''};e[f]=el.value;e.by=whoName();e.at=Date.now();doc.rem[key]=e;
  const has=(e.n!==''&&e.n!=null)||String(e.x||'').trim()!=='';
  if(has&&!(doc.cells[key]&&doc.cells[key].s))doc.cells[key]=mkCell(rk,'D',Date.now(),mode,date);
  schedule(id,key);
}

/* ================= STATS ================= */
function cellS(doc,rk,sec){const c=doc&&doc.cells&&doc.cells[rk+'__'+sec];return (c&&c.s)||''}
function countRows(doc,pl,mode,rows){
  const o={D:0,N:0,A:0,P:0,T:0};
  rows.forEach(r=>secsFor(pl,mode,r).forEach(s=>{const v=cellS(doc,r.key,s);o.T++;o[v||'P']++}));
  o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o;
}
const stats=(doc,pl,mode)=>countRows(doc,pl,mode,ROWS[mode]);
const getDoc=(pl,mode,date)=>S.docs[docId(pl.id,mode,date)];
function blockInfo(doc,pl,mode,b,date){
  const rows=ROWS[mode].filter(r=>r.block===b);const c=countRows(doc,pl,mode,rows);const due=dueOf(b);const today=todayStr();
  let st,cls;
  if(c.P===0&&c.N===0){st='Done';cls='Done'}
  else if(date<today){st='Missed';cls='Missed'}
  else if(date>today){st='Upcoming';cls='Upcoming'}
  else if(c.P===0&&c.N>0){st='Missed';cls='Missed'}
  else if(!due){st='No fixed time';cls='NoFixed'}
  else{const m=nowMin(),d=toMin(due);if(m>d){st='Overdue';cls='Overdue'}else if(d-m<=30){st='Due soon';cls='Due'}else{st='Upcoming';cls='Upcoming'}}
  return{c:c,st:st,cls:cls,due:due};
}
function dayClass(c,date){
  if(date>todayStr())return 'lock';
  if(c.T&&c.N>0)return 'r';if(c.T&&c.pct===100)return 'g';return '';
}
function sumStats(list){const o={D:0,N:0,A:0,P:0,T:0};list.forEach(c=>{['D','N','A','P','T'].forEach(k=>o[k]+=c[k])});o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o}
function dayStats(date,plsList){return sumStats(plsList.map(pl=>stats(getDoc(pl,S.mode,date),pl,S.mode)))}

  const editable=canAct(pl.id);
  let notice='';
  if(S.date<today)notice='<div class="notice info">Past day — shown as recorded.</div>';
  else if(S.date===today&&!editable)notice=`<div class="notice">You can view ${esc(pl.name)}’s plan but only ${esc(pl.name)} and the seniors can update it.</div>`;
  let h=notice;
  const sm=plSummary(pl,mode,S.date);
  h+=`<div class="card"><div class="hero" style="margin-bottom:12px"><div><div class="eyebrow">${mode==='dp'?'Day Plan · '+pl.sections.length+' sections':'Day End'}</div><h2>${esc(pl.name)} <span class="muted" style="font-size:14px;font-weight:600">· ${pl.cls}</span></h2><div class="muted" style="margin-top:2px">${parseD(S.date).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</div></div><div style="display:flex;align-items:center;gap:10px">${statusTag(sm,S.date)}${ringHTML(c.pct,c.N||sm.late.length)}</div></div>`+
    `<div class="counts"><div class="cnt d"><b>${c.D}</b><span>Done</span></div><div class="cnt n"><b>${c.N}</b><span>Not Done</span></div><div class="cnt a"><b>${c.A}</b><span>NA</span></div><div class="cnt"><b>${c.P}</b><span>Pending</span></div></div>`+
    `<div class="bar ${c.N?'rd':''}"><i style="width:${c.pct}%"></i></div><div class="muted" style="margin-top:6px">% complete = (Done + NA) ÷ all items</div></div>`;
  h+=`<div class="card"><h3>This week <span class="hint">% complete per day</span></h3>${weekChart(pl)}</div>`;
  if(mode==='dp')h+=`<div class="card"><h3>Section-wise completion</h3>${sectionBoxes(pl,doc)}</div>`;
  h+=`<div class="card"><h3>Not Done <span class="hint">${sm.nd.length||''}</span></h3><div class="nd">${notDone(pl,doc,mode)}</div></div>`;
  h+=remarksCard([pl]);
  h+=blocksHTML(pl,doc,mode,editable);
  return h;
}
function plSummary(pl,mode,date){
  const doc=getDoc(pl,mode,date);const c=stats(doc,pl,mode);const today=todayStr();
  const late=[],next=[];
  DEFS[mode].forEach(b=>{const i=blockInfo(doc,pl,mode,b,date);
    if(i.st==='Overdue'||(date<today&&i.st==='Missed'))late.push({b:b,i:i});
    else if(i.st==='Due soon'||i.st==='Upcoming')next.push({b:b,i:i});});
  next.sort((x,y)=>(x.i.due||'99')<(y.i.due||'99')?-1:1);
  const nd=[];ROWS[mode].forEach(r=>{const bad=secsFor(pl,mode,r).filter(s=>cellS(doc,r.key,s)==='N');if(bad.length)nd.push({r:r,bad:bad})});
  return {doc:doc,c:c,late:late,next:next,nd:nd};
}
function statusTag(sm,date){
  const today=todayStr(),c=sm.c;
  if(c.T&&c.P===0&&c.N===0)return '<span class="tag ok">Complete</span>';
  if(sm.late.length)return `<span class="tag bad">${sm.late.length} ${date<today?'missed':'overdue'}</span>`;
  if(c.N)return `<span class="tag warn">${c.N} not done</span>`;
  if(!(c.D+c.A+c.N))return '<span class="tag idle">Not started</span>';
  return '<span class="tag ok">On track</span>';
}
function ringHTML(p,bad){return `<div class="ring" style="--p:${p};--rc:${bad?'#d08a3a':'var(--green)'}"><span>${p}%</span></div>`}
function dashboard(){
  const mode=S.mode,today=todayStr(),date=S.date;
  const sums=PLS.map(pl=>({pl:pl,sm:plSummary(pl,mode,date)}));
  const tot=sumStats(sums.map(x=>x.sm.c));const lateN=sums.reduce((a,x)=>a+x.sm.late.length,0);
  const dlabel=parseD(date).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'});
  let h='';
  /* 1 · headline */
  h+=`<div class="card"><div class="hero"><div><div class="eyebrow">${mode==='dp'?'Day Plan':'Day End'} · ${date===today?'Today':date<today?'Past day':''}</div><h2>${esc(dlabel)}</h2></div><span class="muted">% complete = (Done + NA) ÷ all items</span></div>`+
    `<div class="kpis"><div class="kpi main"><div class="k">Overall completion</div><div class="v">${tot.pct}%</div></div>`+
    `<div class="kpi d"><div class="k">Done</div><div class="v">${tot.D}<small> / ${tot.T}</small></div></div>`+
    `<div class="kpi n"><div class="k">Not done</div><div class="v">${tot.N}</div></div>`+
    `<div class="kpi"><div class="k">Pending</div><div class="v">${tot.P}</div></div>`+
    `<div class="kpi o"><div class="k">Blocks ${date<today?'missed':'overdue'}</div><div class="v">${lateN}</div></div></div></div>`;
  /* 2 · PL scorecards */
  h+=`<div class="grid4" style="margin-bottom:12px">`+sums.map(({pl,sm})=>{
    const c=sm.c,nx=sm.next[0];
    const foot=date===today&&nx?`<span>Next: <b>${esc(nx.b.name)}</b></span><span><b>${nx.i.due?fmt12(nx.i.due):'Any time'}</b></span>`
      :`<span>${pl.sections.length} sections</span><span>Tap to open plan ›</span>`;
    return `<div class="plc" data-act="tab" data-v="${pl.id}"><div class="top"><div><h4>${esc(pl.name)}</h4><small>${pl.cls} · ${pl.sections.join(', ')}</small><div style="margin-top:8px">${statusTag(sm,date)}</div></div>${ringHTML(c.pct,c.N||sm.late.length)}</div>`+
      `<div class="mini3"><span class="d"><b>${c.D}</b>Done</span><span class="n"><b>${c.N}</b>Not done</span><span><b>${c.A}</b>NA</span><span><b>${c.P}</b>Pending</span></div>`+
      `<div class="bar ${c.N?'rd':''}"><i style="width:${c.pct}%"></i></div><div class="foot">${foot}</div></div>`;
  }).join('')+`</div>`;
  /* 3 · needs attention */
  const att=sums.filter(x=>x.sm.late.length||x.sm.nd.length);
  h+=`<div class="card"><h3>Needs attention <span class="hint">${att.length?'Overdue blocks and items marked Not Done':''}</span></h3>`;
  if(!att.length)h+=`<div class="allclear">✓ All clear — nothing overdue or marked Not Done.</div>`;
  else h+=`<div class="att">`+att.map(({pl,sm})=>{
    const late=sm.late.length?`<div class="lateline"><span class="lb">${date<today?'Missed':'Overdue'}</span>${sm.late.map(x=>`<span class="pill">${esc(x.b.name)}${x.i.due?` <small>${fmt12(x.i.due)}</small>`:''}</span>`).join('')}</div>`:'';
    const nd=sm.nd.map(x=>`<li><span class="dot"></span><span><b>${esc(x.r.sub?x.r.item.name+' › '+x.r.label:x.r.label)}</b> <span class="w">· ${x.bad[0]!=='x'?x.bad.map(esc).join(', '):'Not done'}</span></span></li>`);
    const shown=nd.slice(0,5),more=nd.length-shown.length;
    const n=sm.late.length+sm.nd.length;
    return `<div class="attpl"><div class="ah"><b>${esc(pl.name)} <span class="muted" style="font-weight:500">· ${pl.cls}</span></b><span class="tag ${sm.late.length?'bad':'warn'}">${sm.late.length?sm.late.length+' block'+(sm.late.length>1?'s':'')+' late':''}${sm.late.length&&sm.nd.length?' · ':''}${sm.nd.length?sm.nd.length+' not done':''}</span></div><ul>${late?`<li style="display:block;padding:0">${late}</li>`:''}${shown.join('')}${more?`<li><a href="#" data-act="tab" data-v="${pl.id}" style="color:var(--accent);font-weight:600;text-decoration:none">+ ${more} more — open ${esc(pl.name)}’s plan ›</a></li>`:''}</ul></div>`;
  }).join('')+`</div>`;
  h+=`</div>`;
  /* 4 · section heat (Day Plan) */
  if(mode==='dp')h+=`<div class="card"><h3>Section-wise completion <span class="hint">Red = has a Not Done</span></h3>`+sums.map(({pl,sm})=>`<div class="heatrow"><div class="nm">${esc(pl.name)}<small>${pl.cls}</small></div>${sectionBoxes(pl,sm.doc)}</div>`).join('')+`</div>`;
  /* 5 · week */
  const dates=weekDates(S.wk);
  h+=`<div class="card"><h3>This week <span class="hint">% complete per day</span></h3><div class="tw"><table><tr><th>PL</th>${dates.map((d,i)=>`<th style="text-align:center">${DAYN[i]}<small>${parseD(d).getDate()}</small></th>`).join('')}</tr>`+
    PLS.map(pl=>`<tr><td><b>${esc(pl.name)}</b></td>`+dates.map(d=>{
      if(d>today)return '<td class="c e"><span>·</span></td>';const c=stats(getDoc(pl,mode,d),pl,mode);const any=c.D+c.A+c.N>0;
      return `<td class="c ${!any?'e':c.N?'r':(c.pct===100?'g':'')}"><span>${any?c.pct+'%':'–'}</span></td>`}).join('')+'</tr>').join('')+`</table></div></div>`;
  /* 6 · remarks */
  h+=remarksCard(PLS);
  return h;
}

/* ================= EVENTS ================= */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;if(t.tagName==='A')ev.preventDefault();
  const a=t.dataset.act;
  if(a==='login'){doLogin();return}
  if(a==='logout'){logout();return}
  if(a==='view'){S.view=S.view===t.dataset.v?null:t.dataset.v;S.users=null;render(true);window.scrollTo(0,0);return}
  if(a==='closeview'){S.view=null;render(true);return}
  if(a==='savepw'){doChangePw(S.me.id,'np1','np2');return}
  if(a==='setuserpw'){doChangePw(t.dataset.u,'up_'+t.dataset.u);return}
  if(a==='mode'){S.mode=t.dataset.v;render(true)}
  else if(a==='tab'){if(t.dataset.v==='dash'&&!(S.me&&S.me.senior))return;S.tab=t.dataset.v;render(true);window.scrollTo(0,0)}
  else if(a==='day'){S.date=t.dataset.v;render(true)}
  else if(a==='wk'){
    const m=parseD(S.wk);m.setDate(m.getDate()+7*Number(t.dataset.v));S.wk=ds(m);
    const dates=weekDates(S.wk);const today=todayStr();
    S.date=dates.includes(today)?today:dates.filter(d=>d<=today).pop()||dates[0];
    subscribeWeek(S.wk);render(true);
  }
  else if(a==='tick')doTick(t.dataset.pl,t.dataset.row,t.dataset.sec);
  else if(a==='obsadd')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'add');
  else if(a==='obsundo'){if(canAct(t.dataset.pl))obsUndo(t.dataset.pl,t.dataset.row)}
  else if(a==='allrow'){const p=plOf(t.dataset.pl);if(!canAct(p.id))return;const rr=ROWMAP[S.mode][t.dataset.row];if(rr.item.multi)return;setCells(p.id,secsFor(p,S.mode,rr).map(s=>[t.dataset.row,s,'D']))}
  else if(a==='allitem'){const p=plOf(t.dataset.pl);if(!canAct(p.id))return;const list=[];ROWS[S.mode].filter(r=>r.item.id===t.dataset.item).forEach(r=>secsFor(p,S.mode,r).forEach(s=>list.push([r.key,s,'D'])));setCells(p.id,list)}
  else if(a==='rem'){const k=t.dataset.pl+'|'+t.dataset.row;S.openRem[k]=!S.openRem[k];render(true)}
  else if(a==='edittime'){S.editTime=S.editTime===t.dataset.b?null:t.dataset.b;render(true)}
  else if(a==='canceltime'){S.editTime=null;render(true)}
  else if(a==='savetime'||a==='notime'||a==='deftime'){
    if(!isSenior())return;const b=t.dataset.b;let v;
    if(a==='savetime'){v=document.getElementById('tin').value;if(!v)return}
    else if(a==='notime')v='none';else v='def';
    S.times[b]=v;persistCfg({times:{[b]:v},by:whoName(),at:Date.now()});
    S.editTime=null;render(true);
  }
});
document.addEventListener('input',ev=>{if(ev.target.classList&&ev.target.classList.contains('remin'))onRemInput(ev.target)});
document.addEventListener('focusout',ev=>{
  if(ev.target.classList&&ev.target.classList.contains('remin')){flushAll();setTimeout(()=>{if(!typing()&&S.dirty)render(true)},80)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='lpw')doLogin()});
window.addEventListener('pagehide',flushAll);
setInterval(()=>render(),30000);
render(true);initDb();
</script>
