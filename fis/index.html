<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIS</title>
<meta name="description" content="Flourish International School – staff apps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="fis-icon-192.png">
<link rel="icon" href="fis-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIS">
<meta name="theme-color" content="#18213A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F8;--surface:#FFFFFF;--ink:#18213A;--muted:#5B6479;--line:#DCE2EE;--head:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--body:'Nunito Sans','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10152A;--surface:#1A2140;--ink:#EDF1FA;--muted:#A3ACC4;--line:#2C3558}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.25rem;letter-spacing:.02em;flex:0 0 auto}
h1{font-family:var(--head);font-weight:800;font-size:2rem;line-height:1;margin:0}
.sub{color:var(--muted);font-weight:600;font-size:.9rem;margin-top:2px}
.apps{display:grid;gap:12px}
a.app{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:inset 6px 0 0 var(--c);padding:16px 14px 16px 20px;min-height:76px}
a.app:focus-visible{outline:3px solid #2F6FDE;outline-offset:2px}
a.app:active{transform:scale(.99)}
.dot{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.1rem;flex:0 0 auto}
.t{flex:1;min-width:0}
.t b{display:block;font-family:var(--head);font-weight:700;font-size:1.15rem;line-height:1.15}
.t small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.tag{font-size:.7rem;font-weight:800;border-radius:999px;padding:2px 8px;background:#FFF1C2;color:#7A5A00;white-space:nowrap}
.go{color:var(--muted);font-size:1.4rem}
footer{margin-top:22px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">FIS</div>
    <div><h1>FIS</h1><div class="sub">Flourish International School · Staff apps</div></div>
  </header>
  <nav class="apps" id="apps" aria-label="FIS apps"></nav>
  <footer>Tip: add this page to your home screen once (iPhone: Safari › Share › Add to Home Screen · Android: Chrome › ⋮ › Install app). All FIS apps open from here.</footer>
</div>
<script>
const APPS = [{"name": "Duty Chart", "desc": "Morning, departure & stayback duties · leave, adjustments, check-in", "url": "../", "color": "#E4572E", "status": "live"}, {"name": "Checking Tracker 6–8", "desc": "Notebook, assignment & test checking for Classes 6–8", "url": "../checking/", "color": "#12907C", "status": "setup"}, {"name": "Daily Maintenance Record", "desc": "Log repairs, vendor jobs & CCTV issues · manager updates · director dashboard", "url": "../dmr/", "color": "#B26A00", "status": "live"}];
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const initials = n => n.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0,2).map(w => w[0]).join('').toUpperCase();
document.getElementById('apps').innerHTML = APPS.map(a => `<a class="app" href="${esc(a.url)}" style="--c:${esc(a.color)}">
  <span class="dot" aria-hidden="true">${esc(initials(a.name))}</span>
  <span class="t"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span>
  ${a.status === 'setup' ? '<span class="tag">Setting up</span>' : '<span class="go" aria-hidden="true">›</span>'}
</a>`).join('');
</script>
</body>
</html>
