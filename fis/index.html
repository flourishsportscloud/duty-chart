<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIS Staff Hub</title>
<meta name="description" content="Flourish International School – staff apps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="fis-logo-180.png">
<link rel="icon" href="fis-logo-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F2D5A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2D5A;--navy2:#16214A;--gold:#E3A94F;--crimson:#D23D63;--purple:#5F3585;--sky:#5FA8D8;
  --bg:#F5F3EE;--surface:#FFFFFF;--ink:#1B2340;--muted:#646B80;--line:#E6E2D8;
  --serif:'Lora',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--purple:#A987D6;--crimson:#E8668A;--bg:#0F1530;--surface:#18214A;--ink:#EEF0F7;--muted:#A6ADC4;--line:#2A3566}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 26px;border-bottom:4px solid var(--gold)}
@media (display-mode:standalone){.top{padding-top:calc(max(env(safe-area-inset-top,0px),50px) + 16px)}}
.top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;border-radius:14px;background:#fff;flex:0 0 auto;object-fit:contain;padding:3px}
.kick{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--serif);font-weight:600;font-size:1.75rem;line-height:1.15;margin:3px 0 0}
.date{font-size:.8rem;color:#C9CFE3;margin-top:4px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.search{position:relative;margin:0 0 6px}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--gold);outline-offset:1px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sec{margin-top:20px}
.sec h2{display:flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 2px 10px}
.sec h2 i{width:18px;height:3px;border-radius:2px;background:var(--c)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr}}
a.app{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px;min-height:74px;box-shadow:0 1px 2px rgba(20,25,60,.04)}
a.app:active{transform:scale(.99)}
a.app:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c)}
.t{flex:1;min-width:0}
.t b{display:block;font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.2}
.t small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px;line-height:1.35}
.tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border-radius:999px;padding:3px 8px;background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:#8A5B12;white-space:nowrap}
@media (prefers-color-scheme:dark){.tag{color:var(--gold)}}
.go{color:var(--muted);flex:0 0 auto}
.none{color:var(--muted);text-align:center;padding:24px 0}
.tick{display:flex;align-items:center;background:var(--navy2);color:#fff;text-decoration:none;overflow:hidden;white-space:nowrap}
.tick .lb{flex:0 0 auto;background:var(--gold);color:#1B2340;font-size:.64rem;letter-spacing:.16em;font-weight:700;text-transform:uppercase;padding:9px 12px;z-index:1}
.tick .vp{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tick .run{display:inline-flex;gap:34px;padding-left:100%;animation:run var(--dur,30s) linear infinite;font-size:.85rem;padding-top:9px;padding-bottom:9px}
.tick .run b{color:var(--gold);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tick .run{animation:none;padding-left:12px}}
.tick[hidden]{display:none}
.tag.new{background:var(--crimson);color:#fff}
footer{margin-top:26px;color:var(--muted);font-size:.78rem;text-align:center;line-height:1.5}
</style>
</head>
<body>
<header class="top"><div class="in">
  <img class="logo" src="fis-logo-192.png" alt="FIS logo">
  <div><div class="kick">Flourish International School</div><h1>Staff Hub</h1><div class="date" id="date"></div></div>
</div></header>
<a class="tick" id="tick" href="../announcements/" hidden><span class="lb">Highlights</span><span class="vp"><span class="run" id="run"></span></span></a>
<main class="wrap">
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Find an app…" aria-label="Find an app" autocomplete="off"></label>
  <div id="apps"></div>
  <footer>Add this page to your home screen once (iPhone: Safari › Share › Add to Home Screen · Android: Chrome › ⋮ › Install app).<br>All FIS staff apps open from here.</footer>
</main>
<script>
const APPS = [{"name": "Announcements", "was": "Notices and Circulars", "desc": "Notices · Circulars · Parent SMS · Primary, Middle and Secondary", "url": "../announcements/", "group": "ann", "icon": "bell", "status": "live"}, {"name": "Leaves & Duty Cover", "was": "Duty Chart", "desc": "Staff leaves · Adjustments · Duty cover · Check-in", "url": "../", "group": "ops", "icon": "duty", "status": "live"}, {"name": "Maintenance Desk", "was": "Daily Maintenance Record", "desc": "Repairs · Vendor jobs · CCTV issues · Manager updates", "url": "../dmr/", "group": "campus", "icon": "tool", "status": "live"}, {"name": "Academic Reports", "was": "FIS Reports", "desc": "Checking reports · Test performance · Defaulter dashboard", "url": "../reports/", "group": "acad", "icon": "chart", "status": "live"}, {"name": "Diary & Remarks", "was": "Diary Report", "desc": "Daily diary · Defaulters · Parent remarks · SMS list", "url": "../diary/?v=202611201122", "group": "acad", "icon": "diary", "status": "live"}, {"name": "Lost & Found", "was": "Lost and Found Desk", "desc": "Found items · Lost complaints · Handover with photo proof", "url": "../lostfound/", "group": "campus", "icon": "search", "status": "live"}, {"name": "Store & Purchase", "was": "Stock and Purchase Desk", "desc": "Store orders · Purchase requests · Handover · Deadlines", "url": "../stock/", "group": "campus", "icon": "box", "status": "live"}, {"name": "PL Day Plan", "was": "PL Plan – Live", "desc": "Section-wise day plan · Day-end checklist · Remarks", "url": "../pl/", "group": "heads", "icon": "plan", "status": "live"}, {"name": "PM Day Plan", "was": "PM Plan – Live", "desc": "Daily operations report · Classes 1–5", "url": "../pm/", "group": "heads", "icon": "plan2", "status": "live"}, {"name": "Support Staff", "was": "Support Staff – Live", "desc": "Guards · Housekeeping · Evening team · Water · Washrooms · Tasks and supervisor visits", "url": "../support/?v=20261120b", "group": "campus", "icon": "team", "status": "live"}, {"name": "Teacher Prep & Checking 6–11", "was": "Teacher Preparation and Checking", "desc": "Subject-wise preparation · Checking status · Pending work", "url": "../tpc/?v=20261120f", "group": "acad", "icon": "check", "status": "live"}, {"name": "Teacher Prep & Checking 1–5", "was": "Teacher Preparation and Checking Primary", "desc": "Class teacher and Hindi preparation · Checking status · Pending work", "url": "../tpc-primary/?v=20261120f", "group": "acad", "icon": "book", "status": "live"}, {"name": "Mentor Student Record", "was": "Student Checking & Performance", "desc": "Book · Notebook · Assignment checking · Test marks · Follow-up · Classes 1–11", "url": "../mentor/", "group": "acad", "icon": "check", "status": "setup"}, {"name": "Lesson Readiness", "was": "Academic Preparation Tracker", "desc": "Lesson plans · Presentations · Tests · Booklets · Classes 1–11", "url": "../prep/?v=20261111d", "group": "acad", "icon": "book", "status": "live"}, {"name": "Transport Operations", "was": "Transport Daily Report", "desc": "Director dashboard · Check-in & late · Vehicle check · Uniform & absentee register · Sunday washing", "url": "../tdaily/?v=202611221100", "group": "trans", "icon": "bus", "status": "live"}, {"name": "Transport Helpdesk", "was": "Transport Complaints & Requests", "desc": "Parent complaints · Requests · Route changes · Follow-up", "url": "../complaints/?v=202611201930", "group": "trans", "icon": "chat", "status": "live"}, {"name": "Arrivals & Departures", "was": "Student Entry Exit", "desc": "Bus, van and auto attendance · Late arrivals · Early pick-ups · Stayback", "url": "../transport/?v=202611201700", "group": "ops", "icon": "door", "status": "live"}, {"name": "CM Checking Desk", "was": "CM & PM Checking", "desc": "Class Manager day plan · Checked / Due · Manager review · Next-day plan", "url": "../checking-desk/?v=20261122b", "group": "heads", "icon": "check", "status": "live"}, {"name": "Events & Operations", "desc": "Events · Task allocation · Daily operations · Status reports", "url": "../events/", "group": "ops", "icon": "plan", "status": "setup"}];
const GROUPS = [['ann','Announcements','var(--gold)'],['ops','Admin & Daily Operations','var(--crimson)'],['heads','Heads Reporting','var(--navy)'],['acad','Academics','var(--purple)'],['trans','Transport','var(--gold)'],['campus','Operations','var(--sky)'],['more','More','var(--navy)']];
const P = {
 bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 duty:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 9h16M8 13h3M8 17h6"/>',
 plan:'<path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3"/><path d="m9 13 2 2 4-4"/>',
 plan2:'<path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3"/><path d="M9 12h6M9 16h4"/>',
 team:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 5 5"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/>',
 check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 1.5 1.5L12 8M8 15l1.5 1.5L12 14M14 9h2M14 15h2"/>',
 chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>',
 diary:'<path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h5M10 12h5"/>',
 door:'<path d="M5 21V4a1 1 0 0 1 1-1h9v18"/><path d="M15 5h3v16M3 21h18"/><circle cx="12" cy="12" r=".8" fill="currentColor"/>',
 bus:'<rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 10h16M8 21v-4M16 21v-4"/><circle cx="8" cy="14" r=".8" fill="currentColor"/><circle cx="16" cy="14" r=".8" fill="currentColor"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
 tool:'<path d="M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5z"/>',
 box:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5M9 11h4"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'};
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const svg = k => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k] || P.grid}</svg>`;
document.getElementById('date').textContent = new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
function draw(q){
  q = (q || '').trim().toLowerCase();
  const hit = a => !q || [a.name, a.was, a.desc].join(' ').toLowerCase().includes(q);
  const html = GROUPS.map(([g, label, c]) => { const list = APPS.filter(a => (a.group || 'more') === g && hit(a)); if (!list.length) return '';
    return `<section class="sec" style="--c:${c}"><h2><i></i>${label}</h2><div class="grid">` + list.map(a => `<a class="app" href="${esc(a.url)}">
      <span class="ic">${svg(a.icon)}</span><span class="t"><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span>
      ${a.group === 'ann' && ANN_NEW ? `<span class="tag new">${ANN_NEW} new</span>` : a.status === 'setup' ? '<span class="tag">Setting up</span>' : '<svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'}</a>`).join('') + `</div></section>`; }).join('');
  document.getElementById('apps').innerHTML = html || '<p class="none">No app matches your search.</p>';
}
document.getElementById('q').addEventListener('input', e => draw(e.target.value));
let ANN_NEW = 0;
draw('');
/* moving highlights and the "new" count come from the Announcements app */
(function(){
  const API = 'https://script.google.com/macros/s/AKfycbyxWYwmvDDlIR6VjS2W4209yu-72ex0vfNlRThchzInQ_pCIWO1ACbH31iuOdk410_JkA/exec';
  let me = ''; try { me = localStorage.getItem('fisAnnName') || ''; } catch(e){}
  fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn:'annList', args:[me]})})
    .then(r => r.json()).then(j => { if (!j.ok) return; const L = j.v.list || [], M = j.v.me || {};
      const hi = L.filter(a => a.hi);
      if (hi.length){ const run = document.getElementById('run'); run.innerHTML = hi.map(a => `<span><b>${esc(a.type)}</b>${esc(a.title)}</span>`).join('');
        run.style.setProperty('--dur', Math.max(18, hi.reduce((n, a) => n + a.title.length, 0) / 5) + 's'); document.getElementById('tick').hidden = false; }
      if (me){ ANN_NEW = L.filter(a => !(M[a.id] || {}).s || (a.ack && !(M[a.id] || {}).a)).length; draw(document.getElementById('q').value); } }).catch(() => {});
})();
</script>
</body>
</html>
