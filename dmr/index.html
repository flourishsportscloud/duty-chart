<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Daily Maintenance Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Design: the FIS crest language — a deep navy rounded patch, a gold ring, the italic "FIS"
   mark and its three small pills — carried through a calm ivory board. Serif headings and
   numerals give the formal, premium tone; status colours stay plain (crimson / amber / green)
   so a repair ticket can be read at a glance. */
:root{
  --bg:#F3F0E8; --surface:#FFFFFF; --surface-2:#F8F5EE; --ink:#14213D; --ink-2:#5A6378; --line:#E2DCCB;
  --navy:#14213D; --navy-2:#1F3366; --blue:#2F5DB5; --blue-bg:#E8EEFB;
  --gold:#A87A1E; --gold-b:#D4AF5A; --gold-bg:#FBF1D6;
  --accent:#14213D; --accent-ink:#FFFFFF;
  --open:#A63A32; --open-bg:#FBE9E6; --work:#9A6205; --work-bg:#FFF0D0; --done:#1E7A4C; --done-bg:#E1F3E9;
  --shadow:0 1px 2px rgb(20 33 61 / .06),0 6px 18px rgb(20 33 61 / .06);
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1324; --surface:#141E38; --surface-2:#1A2646; --ink:#EEF1F8; --ink-2:#A5AFC6; --line:#2A3759;
    --navy:#0F1A33; --navy-2:#1B2D5C; --blue:#8FB0F5; --blue-bg:#1D2B52;
    --gold:#DDB962; --gold-b:#E7C877; --gold-bg:#3A311A;
    --accent:#DDB962; --accent-ink:#14213D;
    --open:#F28B82; --open-bg:#3A1D1B; --work:#F2B866; --work-bg:#3A2D14; --done:#7BD39A; --done-bg:#15301F;
    --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1324; --surface:#141E38; --surface-2:#1A2646; --ink:#EEF1F8; --ink-2:#A5AFC6; --line:#2A3759;
  --navy:#0F1A33; --navy-2:#1B2D5C; --blue:#8FB0F5; --blue-bg:#1D2B52;
  --gold:#DDB962; --gold-b:#E7C877; --gold-bg:#3A311A;
  --accent:#DDB962; --accent-ink:#14213D;
  --open:#F28B82; --open-bg:#3A1D1B; --work:#F2B866; --work-bg:#3A2D14; --done:#7BD39A; --done-bg:#15301F;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-b);outline-offset:2px}

.back{display:inline-block;margin:0 0 10px 2px;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--ink)}

/* ----- masthead ----- */
.mast{position:relative;overflow:hidden;border-radius:20px;color:#F5F0E1;padding:18px 16px 16px;
  background:radial-gradient(120% 140% at 100% 0%,var(--navy-2) 0%,var(--navy) 62%);box-shadow:var(--shadow)}
.mast::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#8C6A1C,#E7C877 45%,#8C6A1C)}
.mast-top{display:flex;gap:14px;align-items:center}
.crest-img{flex:none;width:60px;height:60px;border-radius:18px;border:2px solid var(--gold-b);box-shadow:0 0 0 3px rgb(212 175 90 / .22);background:#18213A}
.crest{flex:none;width:58px;height:58px;border-radius:18px;background:#18213A;border:2px solid var(--gold-b);display:grid;place-items:center;align-content:center;gap:3px;
  box-shadow:0 0 0 3px rgb(212 175 90 / .22),inset 0 0 0 1px rgb(255 255 255 / .08)}
.crest b{font:italic 800 21px/1 var(--serif);letter-spacing:.02em;color:#fff}
.crest i{display:flex;gap:3px}
.crest i s{display:block;width:9px;height:4px;border-radius:3px;background:var(--gold-b)}
.crest i s:nth-child(2){background:#9FB8E8}.crest i s:nth-child(3){background:#fff}
.mast h1{margin:0;font:700 25px/1.12 var(--serif);letter-spacing:.005em;text-wrap:balance}
.eyebrow{margin:0 0 3px;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-b)}
.mast-date{margin:5px 0 0;font-size:13px;color:#C9D2E8}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;padding-top:12px;border-top:1px solid rgb(255 255 255 / .12);font-size:13px;color:#C9D2E8}
.who b{color:#fff;font-weight:600}
.role{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--gold-b);color:var(--gold-b);padding:3px 9px;border-radius:999px}
.chipbtn{border:1px solid rgb(255 255 255 / .25);background:rgb(255 255 255 / .08);color:#F5F0E1;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.chipbtn:hover{background:rgb(255 255 255 / .16)}
.who .sp{flex:1}

.notice{margin:12px 0 0;padding:11px 14px;border:1px solid var(--work);background:var(--work-bg);color:var(--work);border-radius:12px;font-size:14px}
.notice.info{border-color:var(--blue);background:var(--blue-bg);color:var(--ink)}
.status{display:flex;align-items:center;gap:7px;margin:20px 2px 0;font:500 12px var(--sans);color:var(--ink-2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.status.live i{background:var(--done);box-shadow:0 0 0 3px rgb(30 122 76 / .18)} .status.off i{background:var(--work)}

/* ----- login ----- */
.authcard{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.authcard h2{margin:0;font:700 26px/1.1 var(--serif)}
.authcard p{margin:0;font-size:14px;color:var(--ink-2)}
.field{display:grid;gap:5px}
.field label,.lbl{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:5px}
.field .lbl{margin-bottom:0}

/* ----- navigation ----- */
.tabs{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:15;margin:12px 0 14px;display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:4px;padding:5px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:11px;padding:10px 2px;font:600 13px var(--sans);color:var(--ink-2);position:relative;transition:background .15s,color .15s}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:inset 0 -2px 0 var(--gold-b)}
:root[data-theme="dark"] .tabs button[aria-pressed="true"]{background:var(--navy-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-pressed="true"]{background:var(--navy-2)}}
.tabs .bdg{margin-left:4px;font:700 10.5px var(--sans);background:var(--open);color:#fff;border-radius:9px;padding:1px 6px}

.newreq{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 0;padding:14px 16px;border-radius:16px;border:1.5px solid var(--gold-b);background:linear-gradient(135deg,var(--gold-bg),var(--surface));font:700 16px var(--sans);text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.newreq span{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold-b);font:700 20px/1 var(--sans)}
.newreq small{display:block;font:500 12px var(--sans);color:var(--ink-2);margin-left:auto;text-align:right}
.fbar{display:grid;gap:10px;margin-bottom:6px}
.search{position:relative}
.search input{padding-left:38px}
.search::before{content:"";position:absolute;left:13px;top:50%;width:13px;height:13px;margin-top:-8px;border:2px solid var(--ink-2);border-radius:50%;opacity:.7}
.search::after{content:"";position:absolute;left:25px;top:50%;width:7px;height:2px;margin-top:5px;background:var(--ink-2);transform:rotate(45deg);opacity:.7}
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink);transition:background .15s}
.chip .n{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] .n{background:rgb(255 255 255 / .18);color:#fff}
.chip.late[aria-pressed="false"]{color:var(--open);border-color:color-mix(in srgb,var(--open) 40%,var(--line))}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--navy-2);border-color:var(--gold-b)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--navy-2);border-color:var(--gold-b)}}
.datef{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.datef label{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=password],input[type=date],input[type=search],select,textarea,input[type=file]{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
.datef input{width:auto}
textarea{resize:vertical}

/* ----- group headings ----- */
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;margin:26px 2px 12px;padding-bottom:9px;border-bottom:1px solid var(--line);position:relative}
.ghead::after{content:"";position:absolute;left:0;bottom:-1px;width:54px;height:2px;background:var(--gold-b)}
.ghead h2{margin:0;display:flex;align-items:center;gap:10px;font:700 21px/1.2 var(--serif)}
.gcount{font:500 12px var(--sans);color:var(--ink-2)}
.sign{display:inline-block;font:700 12px/1 var(--sans);letter-spacing:.08em;background:var(--navy);color:#fff;padding:6px 9px;border-radius:8px;text-align:center;min-width:42px;box-shadow:inset 0 -2px 0 var(--gold-b)}
.sign.lg{font-size:15px;padding:8px 12px;min-width:60px;border-radius:10px}
:root[data-theme="dark"] .sign{background:var(--navy-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sign{background:var(--navy-2)}}

/* ----- complaint card ----- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 15px 14px 18px;margin-bottom:11px;display:grid;gap:11px;box-shadow:var(--shadow);overflow:hidden;animation:rise .28s ease both}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--open)}
.card.st-working::before{background:var(--work)} .card.st-done::before{background:var(--done)}
.card.hot{border-color:color-mix(in srgb,var(--open) 55%,var(--line))}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctop{display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px}
.area{font-weight:600}
.pill{margin-left:auto;font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.09em;padding:5px 10px;border-radius:999px}
.s-open.pill{color:var(--open);background:var(--open-bg)}
.s-working.pill{color:var(--work);background:var(--work-bg)}
.s-done.pill{color:var(--done);background:var(--done-bg)}
.tag{font:700 10px var(--sans);text-transform:uppercase;letter-spacing:.09em;padding:3px 8px;border-radius:999px;border:1px solid currentColor;color:var(--ink-2)}
.tag.urgent{color:var(--open)} .tag.low{color:var(--ink-2)} .tag.k{color:var(--blue)} .tag.v{color:var(--gold)}
.issue{margin:0;font-size:16px;font-weight:500;overflow-wrap:anywhere}
.meta{margin:0;display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--ink-2)}

/* logged → resolved timing */
.timeline{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch}
.tl{display:grid;gap:1px;padding:7px 11px;border-radius:11px;min-width:0}
.tl small{font:700 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.tl b{font:600 13px var(--sans);white-space:nowrap}
.tl-in{background:var(--blue-bg);color:var(--blue)}
.tl-out{background:var(--done-bg);color:var(--done)}
.tl-took{background:var(--gold-bg);color:var(--gold)}
.tl-wait{background:var(--surface-2);color:var(--ink)}
.tl-wait.late{background:var(--open-bg);color:var(--open)}
.tl-due{background:var(--surface-2);color:var(--ink-2)}
.tl-due.late{background:var(--open-bg);color:var(--open)}
.tl-arrow{align-self:center;color:var(--ink-2);font-size:15px}
.note{background:var(--surface-2);border-radius:11px;padding:10px 13px;display:grid;gap:4px;font-size:14px;border-left:3px solid var(--gold-b)}
.note p{margin:0;overflow-wrap:anywhere}
.note .eta{font:600 12px var(--sans);color:var(--ink-2)}

.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.thumb{position:relative;aspect-ratio:16/10;border:1px solid var(--line);border-radius:12px;background:var(--surface-2) center/cover no-repeat;overflow:hidden;padding:0}
.thumb:not(.ready):not(.failed)::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255 / .35) 50%,transparent 70%);animation:shimmer 1.3s infinite}
.thumb.failed::before{content:"Tap to load";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.tcap{position:absolute;left:8px;bottom:8px;font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;background:rgb(20 33 61 / .82);color:#fff;border-radius:999px;padding:3px 9px}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.mgr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stseg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:fit-content;max-width:100%;background:var(--surface-2)}
.stseg button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:13px}
.stseg button+button{border-left:1px solid var(--line)}
.stseg button[aria-pressed="true"].s-open,.stseg button[aria-pressed="true"].p-urgent{background:var(--open);color:#fff}
.stseg button[aria-pressed="true"].s-working{background:var(--work);color:#fff}
.stseg button[aria-pressed="true"].s-done{background:var(--done);color:#fff}
.stseg button[aria-pressed="true"].p-normal{background:var(--navy);color:#fff}
.stseg button[aria-pressed="true"].p-low{background:var(--ink-2);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:600;font-size:13px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:inset 0 -2px 0 var(--gold-b)}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}}
.btn.danger{border-color:var(--open);color:var(--open)}
.btn.danger.armed{background:var(--open);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.donebar{border-top:1px dashed var(--line);padding-top:11px}
.donebar.needs{background:var(--work-bg);border:1px solid var(--work);border-radius:12px;padding:9px 12px}
.donebar .hint{color:var(--work);font-weight:600;margin:0}
.panel{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.presets button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.empty{margin:42px 0;text-align:center;color:var(--ink-2)}

/* ----- overview ----- */
.sec{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px;margin:30px 2px 12px;padding-bottom:9px;border-bottom:1px solid var(--line);position:relative}
.sec::after{content:"";position:absolute;left:0;bottom:-1px;width:54px;height:2px;background:var(--gold-b)}
.sec h2{margin:0;font:700 21px/1.2 var(--serif)}
.linkbtn{border:0;background:none;padding:0;font:600 13px var(--sans);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:620px){.kpis{grid-template-columns:repeat(5,1fr)}.kpis .kpi:last-child:nth-child(odd){grid-column:auto}}
.kpi{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:grid;gap:3px;align-content:start;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--gold-b)}
.kpi:active{transform:scale(.985)}
.kpi::before{content:"";position:absolute;left:14px;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--gold-b)}
.kv{font:700 44px/1.05 var(--serif);font-variant-numeric:tabular-nums;margin-top:4px}
.kl{font:700 10.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.ks{font-size:12px;color:var(--ink-2)}
.kgo{margin-top:6px;font:600 12px var(--sans);color:var(--blue)}
.kpi.bad .kv{color:var(--open)} .kpi.bad::before{background:var(--open)}
.kpi.good .kv{color:var(--done)}

.perf{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:16px}
.perf-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{--p:0;--c:var(--done);width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.ring span{position:relative;font:700 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.ring span small{font-size:16px}
.grade{display:inline-block;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:999px;margin-bottom:6px}
.grade.g1{background:var(--done-bg);color:var(--done)} .grade.g2{background:var(--gold-bg);color:var(--gold)}
.grade.g3{background:var(--work-bg);color:var(--work)} .grade.g4{background:var(--open-bg);color:var(--open)}
.perf-top h3{margin:0;font:700 19px/1.2 var(--serif)}
.perf-top p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.meter{display:grid;gap:11px}
.meter div.m{display:grid;gap:5px}
.meter .mh{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.meter .mh span:last-child{font-variant-numeric:tabular-nums}
.meter .mh em{font-style:normal;font-weight:400;color:var(--ink-2);font-size:12px;margin-left:6px}
.meter .bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--navy-2),var(--blue))}
.meter .m.t2 .bar i{background:linear-gradient(90deg,#8C6A1C,var(--gold-b))}
.meter .m.t3 .bar i{background:linear-gradient(90deg,#1E7A4C,#58B98A)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.pstats b{display:block;font:700 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.pstats span{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
details.how{font-size:13px;color:var(--ink-2)}
details.how summary{cursor:pointer;font-weight:600;color:var(--blue)}
details.how ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}

.trend{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px;box-shadow:var(--shadow)}
.tcols{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:128px}
.tcol{border:0;background:transparent;padding:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:2px;border-radius:6px}
.tcol:hover{background:var(--surface-2)}
.tcol .pair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.tcol .pair i{display:block;width:42%;border-radius:3px 3px 0 0;min-height:2px;background:var(--navy-2)}
.tcol .pair i.r{background:var(--gold-b)}
:root[data-theme="dark"] .tcol .pair i:not(.r){background:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tcol .pair i:not(.r){background:var(--blue)}}
.tcol .dl{font:600 10px var(--sans);color:var(--ink-2);text-align:center;padding-top:4px;line-height:1.2}
.tcol.today .dl{color:var(--ink);font-weight:700}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin:10px 2px 2px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--navy-2)}
.legend span.r::before{background:var(--gold-b)}

.dept{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.dcell{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;gap:3px;box-shadow:var(--shadow);transition:transform .15s}
.dcell:hover{transform:translateY(-2px)}
.dcell .dn{font-weight:600}
.dcell .ds{font:700 10.5px var(--sans);text-transform:uppercase;letter-spacing:.09em}
.dcell.ok .ds{color:var(--done)} .dcell.warn .ds{color:var(--work)}
.dcell.bad{border-color:color-mix(in srgb,var(--open) 55%,var(--line))} .dcell.bad .ds{color:var(--open)}
.dcell .dd{font-size:12px;color:var(--ink-2)}
.bars{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:104px 1fr auto;align-items:center;gap:11px;border:0;background:transparent;padding:4px 2px;border-radius:10px;text-align:left;width:100%}
.brow:hover{background:var(--surface-2)}
.brow .track{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brow .fill{height:100%;background:linear-gradient(90deg,var(--navy-2),var(--blue));border-radius:12px}
.brow .num{font:600 13px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .num .h{color:var(--open)}
.rows{display:grid;gap:8px}
.ritem{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 13px;text-align:left;width:100%;box-shadow:var(--shadow)}
.ritem .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.ritem .when{font:600 12px var(--sans);white-space:nowrap;color:var(--ink-2)}
.ritem .when.late{color:var(--open)}
.drillhead{margin:2px 0 2px}
.drillhead .back2{border:0;background:none;padding:6px 2px;font:600 13px var(--sans);color:var(--blue)}
.drillhead h2{margin:4px 0 2px;font:700 28px/1.15 var(--serif)}
.drillhead p{margin:0;color:var(--ink-2);font-size:13.5px}

/* ----- admin ----- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td select{width:auto}
h3.sub{margin:18px 0 8px;font:700 17px var(--serif)}

/* thread, reminders */
.thread{display:grid;gap:7px}
.te{background:var(--surface-2);border-radius:11px;padding:8px 12px;border-left:3px solid var(--blue)}
.te.reminder{border-left-color:var(--gold-b);background:var(--gold-bg)}
.te .th{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.te .tt{color:var(--ink-2);white-space:nowrap}
.te p{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere}
.remn{color:var(--gold);font-weight:600}
.wrapchips{flex-wrap:wrap;overflow:visible}
.remarkform{align-items:center}
/* ----- floating action + sheets ----- */
.fab{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:9px;background:var(--navy);color:#fff;border:1.5px solid var(--gold-b);border-radius:999px;padding:14px 22px 14px 16px;
  font:700 14px var(--sans);letter-spacing:.04em;box-shadow:0 8px 24px rgb(20 33 61 / .38),0 0 0 4px rgb(212 175 90 / .18)}
.fab span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold-b);color:var(--navy);font:700 18px/1 var(--sans)}
:root[data-theme="dark"] .fab{background:var(--navy-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{background:var(--navy-2)}}
.scrim{position:fixed;inset:0;z-index:50;background:rgb(8 14 30 / .6);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:95%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;animation:rise .25s ease both}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{margin:0;font:700 25px/1.1 var(--serif)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 11px;display:grid;gap:2px;align-content:start}
.opt b{font-size:13px}
.opt span{font-size:11.5px;color:var(--ink-2);line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--gold-b);background:var(--gold-bg);box-shadow:inset 0 0 0 1px var(--gold-b)}
.floors,.cpick{display:flex;flex-wrap:wrap;gap:8px}
.floors button,.cpick button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:500}
.floors button .sign{background:var(--surface-2);color:var(--ink);box-shadow:none;min-width:0;padding:4px 7px;font-size:12px}
.floors button[aria-pressed="true"],.cpick button[aria-pressed="true"]{border-color:var(--gold-b);background:var(--gold-bg);box-shadow:inset 0 0 0 1px var(--gold-b)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}.brow{grid-template-columns:100px 1fr auto}.mast h1{font-size:22px}.kinds{grid-template-columns:1fr}.opt{grid-template-columns:auto 1fr;gap:2px 10px}.opt span{grid-column:2}.perf-top{grid-template-columns:1fr;justify-items:center;text-align:center}.ring{width:132px;height:132px}.kv{font-size:40px}}
#f-prev{max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--line);justify-self:start}
.err{margin:0;color:var(--open);font-size:14px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgb(6 10 22 / .92);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:1px solid var(--gold-b);padding:11px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media print{.tabs,.fab,.back,.who,.fbar{display:none!important}.card,.kpi,.perf{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../fis/">&lsaquo; FIS apps</a>
  <header class="mast">
    <div class="mast-top">
      <img class="crest-img" src="../fis/fis-icon-192.png" alt="FIS logo" width="60" height="60">
      <div>
        <p class="eyebrow">Flourish International School</p>
        <h1>Daily Maintenance Record</h1>
        <p class="mast-date" id="today"></p>
      </div>
    </div>
    <div class="who" id="who" hidden></div>
  </header>
  <p class="notice" id="banner" role="alert" hidden></p>

  <section id="auth" hidden></section>

  <div id="app" hidden>
    <button class="newreq" id="newreq" type="button"><span aria-hidden="true">+</span> New request <small>Report a problem with photo and location</small></button>
    <nav class="tabs" id="tabs" role="group" aria-label="View"></nav>
    <div class="fbar" id="filters">
      <div class="search"><input type="search" id="q" placeholder="Search complaints, areas, vendors, names" autocomplete="off" aria-label="Search complaints"></div>
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
      <div class="chips" id="cats" role="group" aria-label="Filter by category"></div>
      <div class="datef" id="datef">
        <label for="d-filter">Show date</label>
        <input type="date" id="d-filter">
        <button class="btn" id="d-clear" type="button" hidden>All dates</button>
      </div>
    </div>
    <main id="list"></main>
  </div>
  <p class="status" id="status"><i></i><span id="statusText">Loading…</span></p>
</div>

<button class="fab" id="fab" type="button" hidden><span aria-hidden="true">+</span>New request</button>

<div class="scrim" id="sheet" hidden>
  <form class="sheet" id="form" novalidate aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">New request</h2>
      <button type="button" class="btn" id="f-close">Close</button>
    </div>
    <div class="field">
      <span class="lbl" id="kind-lbl">What are you logging?</span>
      <div class="kinds" id="f-kind" role="group" aria-labelledby="kind-lbl"></div>
    </div>
    <div class="field">
      <span class="lbl" id="floor-lbl">Location</span>
      <div class="floors" id="f-floors" role="group" aria-labelledby="floor-lbl"></div>
    </div>
    <div class="field">
      <label for="f-area">Area (optional)</label>
      <input type="text" id="f-area" maxlength="80" placeholder="e.g. Girls washroom, UKG C, Staff room" autocomplete="off">
      <div class="presets" id="f-zones"></div>
    </div>
    <div class="field">
      <span class="lbl" id="cat-lbl">Category</span>
      <div class="cpick" id="f-cats" role="group" aria-labelledby="cat-lbl"></div>
    </div>
    <div class="field">
      <label for="f-text" id="f-text-lbl">What needs fixing</label>
      <textarea id="f-text" rows="3" maxlength="400" placeholder="e.g. Washbasin tap, water not coming"></textarea>
    </div>
    <div class="field" id="f-vendor-wrap" hidden>
      <label for="f-vendor">Vendor</label>
      <input type="text" id="f-vendor" maxlength="60" list="f-vendor-list" autocomplete="off" placeholder="e.g. Raju ji (carpenter)">
      <datalist id="f-vendor-list"></datalist>
    </div>
    <div class="field">
      <span class="lbl" id="pri-lbl">Priority</span>
      <div class="stseg" id="f-pri" role="group" aria-labelledby="pri-lbl"></div>
      <p class="hint">Choose Urgent for safety, water or electrical faults.</p>
    </div>
    <div class="row2">
      <div class="field" id="f-date-wrap">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field" id="f-photo-wrap">
        <label for="f-photo">Photo (optional)</label>
        <input type="file" id="f-photo" accept="image/*">
      </div>
    </div>
    <img id="f-prev" alt="Selected photo preview" hidden>
    <p class="err" id="f-err" role="alert" hidden></p>
    <div class="row">
      <button class="btn primary" id="f-submit" type="submit">Log complaint</button>
      <button class="btn danger" id="f-delete" type="button" hidden>Delete</button>
    </div>
  </form>
</div>

<input type="file" id="dp-file" accept="image/*" hidden>
<div class="lightbox" id="lightbox" hidden><img id="lb-img" alt="Complaint photo"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============ SET THIS ONCE: your Apps Script web app URL (ends in /exec) ============ */
const API_URL = new URLSearchParams(location.search).get('api') || 'https://script.google.com/macros/s/AKfycbxLwNiAoz_J76YA9Mp7kCZGDX0V33hvfn6ZBy4aZr6au91PTZizs0snKFEpMujLsQoo/exec';
/* ===================================================================================== */

(function(){
'use strict';

var FLOORS=[
  {k:'LGF',n:'Lower ground floor'},{k:'GF',n:'Ground floor'},{k:'1F',n:'1st floor'},
  {k:'2F',n:'2nd floor'},{k:'3F',n:'3rd floor'},
  {k:'STORE',n:'Storage / store room'},{k:'OUTDOOR',n:'Outdoor'},{k:'CAMPUS',n:'Campus-wide'}
];
var FLOOR_KEYS=FLOORS.map(function(f){return f.k;});
var FLOOR_NAME={};FLOORS.forEach(function(f){FLOOR_NAME[f.k]=f.n;});
var AREAS=['Classroom','Girls washroom','Boys washroom','Staff room','Corridor','Office','Lab','Stairs'];
var ZONES=['Playground','Gate','Parking','Garden','Boundary','Terrace'];
var STORES=['Main store','Sports store','Book store','Stationery store'];
var CATS=['CCTV','Computer lab','Digital board','Electric','Machinery','Wifi','Vendors','Others'];
var KINDS={complaint:'Complaint',task:'Management task',vendor:'Vendor repair'};
var KIND_SUB={complaint:'Something is broken or not working',task:'Work assigned by management',vendor:'A job for an outside vendor'};
var KIND_TITLE={complaint:'Log a complaint',task:'Assign a management task',vendor:'Log a vendor repair'};
var KIND_SUBMIT={complaint:'Log complaint',task:'Assign task',vendor:'Log vendor repair'};
var KIND_TAG={task:'Mgmt task',vendor:'Vendor repair'};
var STATUS={open:'Open',working:'Working',done:'Done'};
var PRIOS=['urgent','normal','low'];
var PRIO_LABEL={urgent:'Urgent',normal:'Normal',low:'Low'};
var SLA_DAYS={urgent:1,normal:3,low:7}; // standard target when the manager has not given a repair estimate
var ROLE_LABEL={staff:'Staff',manager:'Maintenance team',director:'Director'};
var CHIPS=[['all','All'],['pending','Pending'],['overdue','Overdue'],['open','Open'],['working','Working'],['done','Done']];
var PRESETS=['1 hour','Half day','1 day','2–3 days','1 week','Needs parts'];
var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

var token='';try{token=localStorage.getItem('dmr-name')||''}catch(e){}
function setToken(t){token=(t||'').trim();try{if(token)localStorage.setItem('dmr-name',token);else localStorage.removeItem('dmr-name')}catch(e){}}

var S={
  me:null,users:[],vendors:[],complaints:{},extra:{},days:{},today:'',cutoff:'',
  ready:false,view:'',drill:'',status:'all',cat:'all',date:'',q:'',perfDays:30,authMode:'login',
  drafts:{},expanded:new Set(),confirm:'',dirty:false,form:null,photos:{},
  pending:0,epoch:0,team:[],directors:[],remarkOpen:new Set()
};
try{var sv=localStorage.getItem('dmr-view');if(sv&&sv!=='drill')S.view=sv}catch(e){}

var $=function(id){return document.getElementById(id);};
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }}
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){var kid=kids[j];
      if(kid==null||kid===false)continue;
      e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
    }
  }
  return e;
}
function replace(el,kids){el.replaceChildren.apply(el,kids)}

/* ---------- dates (the server's India-time "today" wins over the phone's clock) ---------- */
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function TODAY(){return S.today||keyOf(new Date());}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
function fmtLong(k){return parseKey(k).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtShort(k){return parseKey(k).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function daysBetween(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5);}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true}).replace(/\s+/g,' ')}catch(e){return ''}}
function istDate(iso){try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}catch(e){return ''}}
function fmtDT(iso,fallbackKey){
  var ms=Date.parse(iso||'');
  if(!isNaN(ms))return new Date(ms).toLocaleDateString('en-GB',{timeZone:'Asia/Kolkata',day:'numeric',month:'short'})+' · '+fmtTime(iso);
  return fallbackKey?fmtShort(fallbackKey):'—';
}
function dur(ms){
  var m=Math.max(0,Math.round(ms/60000));
  if(m<1)return 'under 1 min';
  if(m<60)return m+' min';
  var hh=Math.floor(m/60);
  if(hh<24)return hh+'h'+(m%60?' '+(m%60)+'m':'');
  var d=Math.floor(hh/24);hh=hh%24;
  return d+'d'+(hh?' '+hh+'h':'');
}

/* ---------- server ---------- */
async function api(fn,args){
  var r;
  try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})});}
  catch(e){throw new Error("Can't reach the server. Check your internet and try again.");}
  var txt=await r.text(),j;
  try{j=JSON.parse(txt)}catch(x){throw new Error("The server didn't answer properly. Check the Apps Script deployment (Anyone can access).")}
  if(!j.ok)throw new Error(j.err||'Something went wrong.');
  return j.v;
}
function applyState(s){
  if(!s)return;
  S.me=s.me||null;S.team=s.team||[];S.directors=s.directors||[];S.vendors=s.vendors||[];S.today=s.today||S.today;S.cutoff=s.cutoff||'';
  S.complaints=s.complaints||{};
    if(S.me&&!S.view)S.view=S.me.role==='staff'?'date':'dash';
  S.ready=true;
  setStatus('live','Live · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}));
  render();
}
async function refresh(){
  if(!API_URL||S.pending)return;
  var ep=S.epoch;
  try{
    var s=await api('state',[token]);
    if(S.pending||ep!==S.epoch)return; // a change was made while we were asking: its answer is newer
    applyState(s);
  }catch(e){setStatus('off',"Can't reach the server — retrying");if(!S.ready)render();}
}
async function write(fn,args,optimistic){
  S.epoch++;S.pending++;
  if(optimistic){try{optimistic()}catch(e){}render();}
  setStatus('','Saving…');
  try{var s=await api(fn,args);S.pending--;S.epoch++;applyState(s);banner('');return true;}
  catch(e){S.pending--;S.epoch++;banner(e.message);toast(e.message);await refresh();return false;}
}
function setStatus(c,t){$('status').className='status '+c;$('statusText').textContent=t}
function banner(m,kind){var b=$('banner');b.textContent=m||'';b.className='notice'+(kind==='info'?' info':'');b.hidden=!m;}
var toastTimer=0;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3000);}

/* ---------- data shaping ---------- */
function items(){
  var out=[],all=Object.assign({},S.extra,S.complaints),today=TODAY();
  for(var id in all){
    var c=all[id];if(!c)continue;
    var st=STATUS[c.status]?c.status:'open';
    var date=DATE_RE.test(c.date)?c.date:'';
    var age=date?Math.max(0,daysBetween(date,today)):0;
    var prio=PRIOS.indexOf(c.priority)>-1?c.priority:'normal';
    var hasEst=(typeof c.etaDays==='number'&&DATE_RE.test(c.etaSet));
    var due=hasEst?addDays(c.etaSet,c.etaDays):'';
    // deadline: the manager's estimate; otherwise the standard target for the priority; "Needs parts" is on hold
    var deadline=due||((c.eta&&!hasEst)||!date?'':addDays(date,SLA_DAYS[prio]));
    var atMs=Date.parse(c.at||''),doneMs=Date.parse(c.doneAt||'');
    var doneDate=DATE_RE.test(c.doneDate)?c.doneDate:'';
    var took=null;
    if(st==='done'){
      if(!isNaN(atMs)&&!isNaN(doneMs)&&doneMs>=atMs)took=doneMs-atMs;
      else if(date&&doneDate)took=Math.max(0,daysBetween(date,doneDate))*864e5;
    }
    out.push({id:id,floor:FLOOR_KEYS.indexOf(c.floor)>-1?c.floor:'CAMPUS',area:c.area||'',text:c.text||'',
      cat:CATS.indexOf(c.category)>-1?c.category:'Others',kind:KINDS[c.kind]?c.kind:'complaint',
      vendor:c.vendor||'',date:date,age:age,at:c.at||'',atMs:atMs,by:c.by||'',hasPhoto:!!c.hasPhoto,hasDonePhoto:!!c.hasDonePhoto,thread:c.thread||[],
      st:st,prio:prio,hot:st!=='done'&&(prio==='urgent'||age>=3),
      remark:c.remark||'',eta:c.eta||'',due:due,deadline:deadline,estimated:!!due,
      overdue:st!=='done'&&!!deadline&&deadline<today,
      doneDate:doneDate,doneAt:c.doneAt||'',doneMs:doneMs,took:took});
  }
  return out;
}
function cmpStr(a,b){return a<b?-1:a>b?1:0;}
function floorThenTime(a,b){return FLOOR_KEYS.indexOf(a.floor)-FLOOR_KEYS.indexOf(b.floor)||cmpStr(a.at,b.at);}
function dateDescThenTime(a,b){return -cmpStr(a.date,b.date)||cmpStr(a.at,b.at);}
function hotFirst(a,b){return (b.hot?1:0)-(a.hot?1:0);}
function byDateGroup(a,b){return hotFirst(a,b)||floorThenTime(a,b);}
function byLocGroup(a,b){return hotFirst(a,b)||dateDescThenTime(a,b);}
function byUrgency(a,b){return (b.overdue?1:0)-(a.overdue?1:0)||hotFirst(a,b)||cmpStr(a.date||'9',b.date||'9')||cmpStr(a.at,b.at);}
function byResolved(a,b){return -cmpStr(a.doneAt||a.doneDate,b.doneAt||b.doneDate);}
function vendorNames(){var s={};S.vendors.forEach(function(v){s[v]=1;});items().forEach(function(i){if(i.vendor)s[i.vendor]=1;});return Object.keys(s).sort();}

function thumb(id,kind,label){

  if(S.photos[key]){b.style.backgroundImage='url("'+S.photos[key]+'")';b.classList.add('ready');}

function thumbsOf(i){
  var kids=[];
  if(i.hasPhoto)kids.push(thumb(i.id,'',i.st==='done'&&i.hasDonePhoto?'Before':'Photo'));
  if(i.st==='done'&&i.hasDonePhoto)kids.push(thumb(i.id,'done','After'));
  return kids.length?h('div',{class:'thumbs'},kids):null;

var io=null,queue=[],active=0;
function paint(el,src){el.style.backgroundImage='url("'+src+'")';el.classList.add('ready');el.classList.remove('failed');}
function pump(){
  while(active<2&&queue.length){
    (function(el){
      var key=el.dataset.key;
      if(S.photos[key]){paint(el,S.photos[key]);return;}
      active++;
      api('photo',[token,el.dataset.id,el.dataset.kind==='done'?'done':'']).then(function(r){S.photos[key]=r.data;paint(el,r.data);})
        .catch(function(){el.classList.add('failed');}).then(function(){active--;pump();});
    })(queue.shift());
  }
}
function hydrateThumbs(){
  if(io){io.disconnect();io=null;}
  queue=[];
  var els=document.querySelectorAll('.thumb:not(.ready)');
  if(!els.length)return;
  if(!('IntersectionObserver' in window)){els.forEach(function(e){queue.push(e);});pump();return;}
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);queue.push(e.target);pump();}});},{rootMargin:'250px'});
  els.forEach(function(e){io.observe(e);});
}

$('lightbox').addEventListener('click',function(){this.hidden=true;$('lb-img').removeAttribute('src');});
async function showPhoto(id,kind){

  if(!f||!id)return;

async function toJpeg(file){
  var url=URL.createObjectURL(file);
  try{
    var im=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error('decode'));};i.src=url;});
    var max=1100,q=0.72;
    for(var n=0;n<6;n++){
      var s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var out=c.toDataURL('image/jpeg',q);
      if(out.length<=700000)return out;
      max=Math.round(max*0.8);q=Math.max(0.45,q-0.08);
    }
    throw new Error('big');
  }finally{URL.revokeObjectURL(url);}
}

/* ---------- performance of the maintenance team ---------- */
function perf(all,days){
  var today=TODAY(),start=addDays(today,-(days-1));
  var received=all.filter(function(i){return i.date>=start&&i.date<=today;});
  var resolvedOfReceived=received.filter(function(i){return i.st==='done';});
  var resolvedIn=all.filter(function(i){return i.st==='done'&&i.doneDate>=start&&i.doneDate<=today;});
  var lateNow=all.filter(function(i){return i.overdue;});
  var onTime=resolvedIn.filter(function(i){return !i.deadline||i.doneDate<=i.deadline;}).length;
  var denom=resolvedIn.length+lateNow.length;
  var timed=resolvedIn.map(function(i){return i.took;}).filter(function(x){return x!=null;});
  var avgMs=timed.length?timed.reduce(function(a,b){return a+b;},0)/timed.length:null;
  var res=received.length?resolvedOfReceived.length/received.length:null;
  var ot=denom?onTime/denom:null;
  var sp=avgMs==null?null:Math.max(0,Math.min(1,(7-avgMs/864e5)/6));
  var score=null;
  if(received.length||resolvedIn.length){
    score=Math.round(100*(0.40*(res||0)+0.35*(ot||0)+0.25*(sp||0)));
  }
  return {days:days,received:received.length,resolved:resolvedOfReceived.length,resolvedIn:resolvedIn.length,lateNow:lateNow.length,
    res:res,ot:ot,sp:sp,avgMs:avgMs,score:score};
}
function gradeOf(s){return s>=85?['g1','Excellent']:s>=70?['g2','Good']:s>=50?['g3','Fair']:['g4','Needs attention'];}

  var P=perf(all,S.perfDays);
  var sel=h('div',{class:'chips',role:'group','aria-label':'Period'},[7,30].map(function(d){
    return h('button',{type:'button',class:'chip','aria-pressed':String(S.perfDays===d),onclick:function(){S.perfDays=d;render();}},'Last '+d+' days');
  }));
  var out=[];
  out.push(h('div',{class:'sec'},h('h2',null,'Maintenance performance'),sel));
  if(P.score==null){
    out.push(h('div',{class:'perf'},h('p',{class:'hint',style:'margin:0'},'No complaints were logged in this period, so there is nothing to score yet.')));
    return out;
  }
  var g=gradeOf(P.score);
  var ring=h('div',{class:'ring',style:'--p:'+P.score+';--c:'+(P.score>=85?'var(--done)':P.score>=70?'var(--gold-b)':P.score>=50?'var(--work)':'var(--open)'),role:'img','aria-label':'Performance score '+P.score+' percent'},
    h('span',null,String(P.score),h('small',null,'%')));
  var how=h('details',{class:'how'},h('summary',null,'How is this calculated?'),
    h('ul',null,
      h('li',null,'Resolution (40%): complaints logged in the period that are now done.'),
      h('li',null,'On time (35%): jobs finished by the repair date the manager gave, or by the standard target (urgent 1 day, normal 3 days, low 7 days) when no estimate was set. Jobs still overdue count against this.'),
      h('li',null,'Speed (25%): average time from logged to resolved. Full marks at 1 day or less, zero at 7 days or more. “Needs parts” jobs are not counted as late.'),
      h('li',null,'The score is a guide to workload and response, not a judgement of effort. Complaints that wait for parts or vendors weigh on it.')));
  out.push(h('div',{class:'perf'},
    h('div',{class:'perf-top'},ring,h('div',null,
      h('span',{class:'grade '+g[0]},g[1]),
      h('h3',null,'Overall score for the last '+S.perfDays+' days'),
      h('p',null,P.resolved+' of '+P.received+' complaints logged in this period are resolved. '+P.lateNow+' overdue right now.'))),
    h('div',{class:'meter'},
      h('div',{class:'m'},h('div',{class:'mh'},h('span',null,'Resolution rate',h('em',null,P.resolved+' of '+P.received)),h('span',null,pct(P.res))),h('div',{class:'bar'},h('i',{style:'width:'+Math.round((P.res||0)*100)+'%'}))),
      h('div',{class:'m t2'},h('div',{class:'mh'},h('span',null,'Finished on time',h('em',null,'weight 35%')),h('span',null,pct(P.ot))),h('div',{class:'bar'},h('i',{style:'width:'+Math.round((P.ot||0)*100)+'%'}))),

function drillSpec(key){

    case 'urgent':return {title:'Urgent pending',sub:'Marked urgent and not yet done',test:function(i){return P(i)&&i.prio==='urgent';},mode:'pending'};
    case 'overdue':return {title:'Overdue',sub:'Past the repair date, or past the standard target when no estimate was set',test:function(i){return i.overdue;},mode:'pending'};
    case 'week':return {title:'Completed this week',sub:'Resolved in the last 7 days, newest first',test:function(i){return i.st==='done'&&i.doneDate>=wk&&i.doneDate<=today;},mode:'done'};
    case 'today':return {title:'Logged today',sub:'Everything logged today',test:function(i){return i.date===today;},mode:'pending'};
    case 'resolved':return {title:'Recently resolved',sub:'Newest first, with logged and resolved times',test:function(i){return i.st==='done';},mode:'done'};
    case 'floor':return {title:FLOOR_NAME[v]||v,sub:'Pending at this location, most urgent first',test:function(i){return P(i)&&i.floor===v;},mode:'pending'};

    case 'kind':return {title:KINDS[v]+'s',sub:'All entries of this type, pending first',test:function(i){return i.kind===v;},mode:'mixed'};

  setTimeout(function(){
    var a=document.activeElement;
    var typing=a&&$('list').contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
    if(S.dirty&&!typing){S.dirty=false;render();}
  },0);
});
$('q').addEventListener('input',function(){S.q=this.value.trim();render();});

/* ---------- date jump beyond the 45-day window ---------- */
async function pickDate(d){
  S.date=DATE_RE.test(d)?d:'';
  render();
  if(S.date&&S.cutoff&&S.date<S.cutoff&&!S.days[S.date]){
    try{var r=await api('day',[token,S.date]);S.days[S.date]=true;Object.assign(S.extra,r.complaints);render();}
    catch(e){toast(e.message);}
  }
}
$('d-filter').addEventListener('change',function(){pickDate(this.value);});
$('d-clear').addEventListener('click',function(){pickDate('');});

/* ---------- log / edit sheet ---------- */
var sheet=$('sheet'),form=$('form');
function renderFloorPick(){
  replace($('f-floors'),FLOORS.map(function(f){
    return h('button',{type:'button','aria-pressed':String(S.form.floor===f.k),onclick:function(){S.form.floor=f.k;renderFloorPick();}},
      h('span',{class:'sign'},f.k),h('span',null,f.n));
  }));
  var list=S.form.floor==='OUTDOOR'?ZONES:S.form.floor==='STORE'?STORES:AREAS;
  replace($('f-zones'),list.map(function(n){return h('button',{type:'button',onclick:function(){$('f-area').value=n;}},n);}));
}
function renderKindPick(){
  replace($('f-kind'),Object.keys(KINDS).map(function(k){
    return h('button',{type:'button',class:'opt','aria-pressed':String(S.form.kind===k),'data-kind':k,onclick:function(){S.form.kind=k;renderKindPick();syncKind();}},
      h('b',null,KINDS[k]),h('span',null,KIND_SUB[k]));
  }));
}
function syncKind(){
  var k=S.form.kind;
  if(!S.form.edit){$('sheet-title').textContent=KIND_TITLE[k];$('f-submit').textContent=KIND_SUBMIT[k];}
  $('f-text-lbl').textContent=k==='task'?'What needs to be done':k==='vendor'?'What the vendor needs to do':'What needs fixing';
  var showV=isMgr()&&k==='vendor';
  $('f-vendor-wrap').hidden=!showV;
  if(showV)replace($('f-vendor-list'),vendorNames().map(function(v){return h('option',{value:v});}));
}
function renderCatPick(){
  replace($('f-cats'),CATS.map(function(c){
    return h('button',{type:'button','aria-pressed':String(S.form.cat===c),'data-cat':c,onclick:function(){S.form.cat=c;renderCatPick();}},c);
  }));
}
function renderPriPick(){
  replace($('f-pri'),PRIOS.map(function(p){
    return h('button',{type:'button',class:'p-'+p,'aria-pressed':String(S.form.priority===p),onclick:function(){S.form.priority=p;renderPriPick();}},PRIO_LABEL[p]);
  }));
}
function showErr(msg){var e=$('f-err');e.textContent=msg;e.hidden=!msg;}
function openSheet(edit){
  S.form={floor:edit?edit.floor:'',kind:edit?edit.kind:'complaint',cat:edit?edit.cat:'Others',priority:edit?edit.prio:'normal',photo:null,edit:edit||null};
  $('sheet-title').textContent=edit?'Edit entry':KIND_TITLE.complaint;
  $('f-submit').textContent=edit?'Save changes':KIND_SUBMIT.complaint;$('f-submit').disabled=false;
  $('f-area').value=edit?edit.area:'';$('f-text').value=edit?edit.text:'';$('f-photo').value='';
  $('f-vendor').value=edit?edit.vendor:'';
  $('f-date').value=edit?edit.date:TODAY();$('f-date').max=TODAY();
  $('f-date-wrap').hidden=!!edit&&!isMgr();
  $('f-photo-wrap').hidden=!!edit;
  $('f-delete').hidden=!edit;$('f-delete').textContent='Delete';$('f-delete').classList.remove('armed');
  $('f-prev').hidden=true;$('f-prev').removeAttribute('src');
  showErr('');renderKindPick();renderFloorPick();renderCatPick();renderPriPick();syncKind();
  sheet.hidden=false;
}
function closeSheet(){sheet.hidden=true;if(!$('fab').hidden)$('fab').focus();}
$('fab').addEventListener('click',function(){openSheet(null);});
$('newreq').addEventListener('click',function(){openSheet(null);});
$('f-close').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet();});
$('f-photo').addEventListener('change',async function(e){
  var f=e.target.files&&e.target.files[0];
  S.form.photo=null;$('f-prev').hidden=true;showErr('');
  if(!f)return;
  try{S.form.photo=await toJpeg(f);$('f-prev').src=S.form.photo;$('f-prev').hidden=false;}
  catch(_){e.target.value='';showErr('That photo could not be read or is too large. Try another photo.');}
});
$('f-delete').addEventListener('click',async function(){
  var b=this;
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to delete';return;}
  var i=S.form.edit;b.disabled=true;
  var ok=await write('deleteComplaint',[token,i.id],function(){delete S.complaints[i.id];delete S.extra[i.id];});
  b.disabled=false;
  if(ok){closeSheet();toast('Deleted');}else showErr('Could not delete. See the message above.');
});
form.addEventListener('submit',async function(e){
  e.preventDefault();
  var text=$('f-text').value.trim();
  if(!S.form.floor){showErr('Pick the floor, Outdoor, or Campus-wide.');return;}
  if(!text){showErr('Describe what needs to be done.');$('f-text').focus();return;}
  var date=$('f-date').value;
  if(!$('f-date-wrap').hidden&&!DATE_RE.test(date)){showErr('Pick a valid date.');return;}
  showErr('');
  var btn=$('f-submit');btn.disabled=true;var label=btn.textContent;btn.textContent='Saving…';
  var base={floor:S.form.floor,area:$('f-area').value.trim(),text:text,category:S.form.cat,kind:S.form.kind,priority:S.form.priority};
  var vendor=$('f-vendor').value.trim();
  var ok;
  if(S.form.edit){
    var i=S.form.edit,p={};
    if(base.floor!==i.floor)p.floor=base.floor;
    if(base.area!==i.area)p.area=base.area;
    if(base.text!==i.text)p.text=base.text;
    if(base.category!==i.cat)p.category=base.category;
    if(base.kind!==i.kind)p.kind=base.kind;
    if(base.priority!==i.prio)p.priority=base.priority;
    if(isMgr()&&DATE_RE.test(date)&&date!==i.date)p.date=date;
    if(isMgr()&&base.kind==='vendor'&&vendor!==i.vendor)p.vendor=vendor;
    ok=Object.keys(p).length?await write('editComplaint',[token,i.id,p]):true;
  }else{
    base.date=date;
    if(isMgr()&&base.kind==='vendor'&&vendor)base.vendor=vendor;
    if(S.form.photo)base.photo=S.form.photo;
    ok=await write('addComplaint',[token,base]);
  }
  btn.disabled=false;btn.textContent=label;
  if(ok){sheet.hidden=true;toast(S.form.edit?'Saved':S.form.kind==='task'?'Task assigned':S.form.kind==='vendor'?'Vendor repair logged':'Complaint logged');}
  else showErr($('banner').textContent||'Could not save. Try again.');
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!$('lightbox').hidden)$('lightbox').click();
  else if(!sheet.hidden)closeSheet();
});

/* ---------- start ---------- */
render();
if(API_URL){
  refresh();
  setInterval(function(){
    var busy=!sheet.hidden||!$('lightbox').hidden;
    var a=document.activeElement,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&S.me;
    if(document.visibilityState==='visible'&&!busy&&!typing&&S.me)refresh();
  },30000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.me&&sheet.hidden)refresh();});
}
})();
</script>
</body>
</html>
