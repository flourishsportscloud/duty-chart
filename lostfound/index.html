<style>
/* Layout: phone-first single column. Top bar with the signed-in staff name, one screen at a time, and a fixed bottom tab bar (Home, Complaints, Found, Floor round, History). Cases open as a full-screen layer; forms open as bottom sheets. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #1a2530;
  --muted: #5a6876;
  --line: #dbe1e8;
  --accent: #1f4e8c;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --amber-bg: #fff1cf;
  --amber-fg: #7a5200;
  --blue-bg: #e1ecfa;
  --blue-fg: #1f4e8c;
  --green-bg: #dff1e3;
  --green-fg: #1b6a33;
  --grey-bg: #eceff3;
  --grey-fg: #4a5662;
  --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171e; --surface: #19222c; --surface-2: #1f2a36; --ink: #e7edf3; --muted: #94a3b2; --line: #2c3946;
    --accent: #6aa5ec; --accent-ink: #0b1b2e; --danger: #f28b82;
    --amber-bg: #4a3a12; --amber-fg: #f3d58a; --blue-bg: #1b3552; --blue-fg: #a9cdf5;
    --green-bg: #1b4127; --green-fg: #a8ddb2; --grey-bg: #27323d; --grey-fg: #b6c2cd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171e; --surface: #19222c; --surface-2: #1f2a36; --ink: #e7edf3; --muted: #94a3b2; --line: #2c3946;
  --accent: #6aa5ec; --accent-ink: #0b1b2e; --danger: #f28b82;
  --amber-bg: #4a3a12; --amber-fg: #f3d58a; --blue-bg: #1b3552; --blue-fg: #a9cdf5;
  --green-bg: #1b4127; --green-fg: #a8ddb2; --grey-bg: #27323d; --grey-fg: #b6c2cd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; line-height: 1.2; margin: 0; font-weight: 700; }
h2 { font-size: 18px; line-height: 1.25; margin: 0; font-weight: 700; }
h3 { font-size: 16px; line-height: 1.3; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; }
.who { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.linkbtn { background: none; border: 0; padding: 6px 2px; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 36px; }

input[type=text], input[type=password], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
textarea { min-height: 88px; resize: vertical; }
input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.check { display: flex; gap: 12px; align-items: flex-start; font-weight: 500; min-height: 44px; }
.check span { padding-top: 1px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.btn { min-height: 48px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 44px; padding: 6px 14px; font-size: 15px; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); display: flex;
  padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tabbtn { flex: 1 1 0; min-width: 0; min-height: 56px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 8px; }
.tabbtn .badge { font-size: 12px; font-weight: 700; min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--grey-bg); color: var(--grey-fg); font-variant-numeric: tabular-nums; }
.tabbtn[aria-current="page"] { color: var(--accent); background: var(--blue-bg); }
.tabbtn[aria-current="page"] .badge { background: var(--accent); color: var(--accent-ink); }

.screenhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.count { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-height: 84px; }
.count b { font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count span { color: var(--muted); font-size: 14px; font-weight: 600; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.filters { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 4px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.row.withthumb { grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: start; }
.row .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.row .nothumb { width: 72px; height: 72px; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; }
.rtop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; align-items: flex-start; }
.rsub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; font-weight: 600; color: var(--green-fg); }
.sec { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 4px 0 -4px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 6px; white-space: nowrap; }
.p-amber { background: var(--amber-bg); color: var(--amber-fg); }
.p-blue { background: var(--blue-bg); color: var(--blue-fg); }
.p-green { background: var(--green-bg); color: var(--green-fg); }
.p-grey { background: var(--grey-bg); color: var(--grey-fg); }
.p-red { background: var(--danger); color: var(--surface); }
.p-line { border: 1px solid var(--line); color: var(--muted); }

.empty { text-align: center; padding: 32px 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface); }
.empty strong { font-size: 17px; color: var(--ink); }
.empty p { max-width: 42ch; }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 15px; }

.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.overlay .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.casehead { display: flex; align-items: center; gap: 10px; }
.casehead .code { font-weight: 700; font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.photos { display: flex; flex-direction: column; gap: 10px; }
.bigphoto { width: 100%; height: auto; max-height: 72vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); display: block; cursor: zoom-in; }
.nophoto { padding: 28px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.dl { display: grid; grid-template-columns: minmax(96px, auto) minmax(0, 1fr); gap: 6px 14px; font-size: 15px; margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.match { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface-2); }
.match .mhead { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; }
.match .mhead.nothumb { grid-template-columns: minmax(0, 1fr); }
.match img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.reasons { font-size: 14px; color: var(--muted); }
.hist { display: flex; flex-direction: column; gap: 0; }
.hist .h { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.hist .h:first-child { border-top: 0; }
.hist .h time { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.proof { display: flex; flex-direction: column; gap: 10px; }
.proof img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: zoom-in; }

.group h2 { font-size: 16px; padding: 8px 0 6px; border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.group h2 span { font-size: 14px; font-weight: 500; color: var(--muted); }
.group + .group { margin-top: 8px; }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.rcard.shown { border-color: var(--green-fg); }

.shwrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); }
.sheet { position: relative; background: var(--surface); width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; border-radius: 16px 16px 0 0; -webkit-overflow-scrolling: touch;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .shead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.err { color: var(--danger); font-size: 15px; font-weight: 600; min-height: 1.2em; }
.pw { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pw .pimg { position: relative; }
.pw .pimg img { width: 92px; height: 92px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.pw .pimg button { position: absolute; top: 2px; right: 2px; min-height: 32px; width: 32px; border-radius: 6px; border: 0; background: rgba(0,0,0,0.65); color: #fff; font-weight: 700; padding: 0; }
.pw .addbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 8px 18px; border-radius: 8px; border: 1px dashed var(--accent); color: var(--accent); font-weight: 600; cursor: pointer; background: var(--surface-2); }
.sig { width: 100%; height: 150px; border: 1px solid var(--line); border-radius: 8px; background: #fff; touch-action: none; display: block; }

.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 8px; font-weight: 600; z-index: 70; max-width: calc(100% - 32px); }
@media (min-width: 640px) { .counts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>

<div class="app">
  <a class="linkbtn" href="../fis/" style="align-self:flex-start">‹ All FIS apps</a>
  <header class="topbar">
    <h1>Lost and Found Desk</h1>
    <div class="who" id="who"></div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<nav class="bar" id="bar" aria-label="Main"></nav>
<div class="overlay" id="case" hidden></div>
<div class="shwrap" id="shwrap" hidden><div class="backdrop" data-act="sheet-close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<div class="lightbox" id="lb" hidden><img id="lbimg" alt="Photo, enlarged"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {

  var CHANNELS = [["door", "At the door"], ["desk", "At the parents' desk"], ["call", "By call"], ["diary", "Through the diary"], ["app", "Through the app"], ["other", "Other"]];
  var RTYPES = [["parent", "Parent"], ["student", "Child"], ["teacher", "Staff member"], ["other", "Other"]];
  var RELS = [["self", "The student (owner)"], ["parent", "Parent or guardian"], ["teacher", "Teacher"], ["other", "Other"]];
  var STOP = { the: 1, and: 1, with: 1, for: 1, has: 1, one: 1, its: 1, was: 1, are: 1, not: 1, demo: 1 };
  var TABS = [["home", "Home"], ["complaints", "Complaints"], ["found", "Found"], ["round", "Floor round"], ["history", "History"]];
  var STRONG = 10, MAYBE = 5, REVIEW_DAYS = 30;

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var pad = function (n) { return n < 10 ? "0" + n : "" + n; };

  var today = function () { return dstr(new Date()); };

  function csvDT(ms) { if (!ms) return ""; var d = new Date(ms); return dstr(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
  function mkId(p) { return p + "-" + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5); }
  var DATA_OK = /^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/;

  /* ---------- state ---------- */
  var S = { found: [], comps: [], hist: [], rdy: { f: false, c: false, h: false }, route: "home", caseId: "", name: "", uid: "", profileName: false, isMgr: false, isAdmin: false, me: null, users: [], canWrite: true, noDb: false, fail: false, caseHist: {}, proofs: {} };
  var M = { byC: {}, byI: {} };
  var colF = null, colC = null, colH = null, db = null;
  /* The page keeps its records in a Google Sheet through an Apps Script web app (see SETUP.md). */
  var API_URL = "https://script.google.com/macros/s/AKfycbwGqI1jcIxT8PoDtP6IhZuQuNhKWAURmZM6Iz9bo-GkdOhFCiPs5JuxZSeFs-Jxt8sD/exec";   // paste the Web app URL (ends in /exec) between the quotes, or open the page with ?api=<that URL>
  try { API_URL = new URLSearchParams(location.search).get("api") || API_URL; } catch (e) {}

  function shrink(file, max, q) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function () {
        var img = new Image();
        img.onerror = rej;
        img.onload = function () {
          var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", q));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function photoWidget(host, id, start, max, capture, maxPx, quality) {
    var list = (start || []).map(function (p) { return { v: p, src: safeImg(p) }; });
    function draw() {
      host.innerHTML = list.map(function (p, i) { return '<div class="pimg"><img src="' + (p.src || "") + '" alt="Photo ' + (i + 1) + '"><button type="button" data-rm="' + i + '" aria-label="Remove photo ' + (i + 1) + '">X</button></div>'; }).join("") +
        (list.length < max ? '<label class="addbtn" for="' + id + '-file">' + (list.length ? "Add another photo" : "Take or choose photo") + '</label><input type="file" id="' + id + '-file" accept="image/*"' + (capture ? ' capture="environment"' : "") + " hidden>" : "");
    }
    host.addEventListener("click", function (e) { var b = e.target.closest("[data-rm]"); if (b) { list.splice(+b.getAttribute("data-rm"), 1); draw(); } });

      try { var du = await shrink(f, maxPx, quality); list.push({ v: du, src: du }); draw(); } catch (x) { toast("That photo could not be read. Try another one."); }
    });
    draw();
    return { get: function () { return list.map(function (p) { return p.v; }); } };
  }
  function sigPad(host) {
    host.innerHTML = '<canvas class="sig" width="600" height="250" aria-label="Signature area"></canvas><div style="margin-top:8px"><button type="button" class="btn small" data-sig="clear">Clear signature</button></div>';
    var cv = host.querySelector("canvas"), ctx = cv.getContext("2d"), down = false, dirty = false;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / (r.width || 1), y: (e.clientY - r.top) * cv.height / (r.height || 1) }; }
    cv.addEventListener("pointerdown", function (e) { down = true; dirty = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });
    cv.addEventListener("pointermove", function (e) { if (!down) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { cv.addEventListener(n, function () { down = false; }); });
    host.addEventListener("click", function (e) { if (e.target.closest("[data-sig]")) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); dirty = false; } });
    return { get: function () { return dirty ? cv.toDataURL("image/png") : ""; } };

    else if (a === "unrestrict") { var uf = byId(S.found, id); if (uf && S.isMgr && !needName()) patchRec("found", uf, { restricted: false }, "Restricted mark removed", ""); }
    else if (a === "tick") tick(id);
    else if (a === "show-proof") showProof(id);
    else if (a === "export") exportCsv();
    else if (a === "demo-delete") demoDeleteSheet();
    else if (a === "name") nameSheet();
    else if (a === "logout") logout(false);
    else if (a === "team") teamSheet();
    else if (a === "demo-load") { b.disabled = true; tcall("seedDemo").then(function (st) { applyState(st); toast("Demo records loaded"); }, function (e) { b.disabled = false; writeErr(e); }); }
    else if (a === "fclear") {
      if (S.route === "round") F.round = { loc: "", q: "", hideShown: false, restricted: false }; else if (F[S.route]) F[S.route] = newF();
      renderScreen();
    }
  });
  function onField(ev) {
    var el = ev.target, fk = el.getAttribute && el.getAttribute("data-fk"), rk = el.getAttribute && el.getAttribute("data-rk");
    if (fk) { var key = el.closest("[data-fkey]").getAttribute("data-fkey"); F[key][fk] = el.value; renderList(); }
    else if (rk) { F.round[rk] = el.type === "checkbox" ? el.checked : el.value; renderList(); }
  }
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { $("#lb").hidden = true; } });
  window.addEventListener("hashchange", goRoute);

  /* ---------- start ---------- */
  function renderAuth(mode, msg) {
    $("#bar").innerHTML = ""; $("#who").innerHTML = "";
    var first = mode === "setup";
    $("#screen").innerHTML = '<div class="card"><form id="af" class="stack" novalidate><h2>' + (first ? "First time? Set password" : "Log in") + "</h2>" +
      fld("au-n", "Your name", '<input type="text" id="au-n" maxlength="40" autocomplete="username">') +
      fld("au-p", first ? "Choose a password (6 or more characters)" : "Password", '<input type="password" id="au-p" maxlength="60" autocomplete="' + (first ? "new-password" : "current-password") + '">') +
      (first ? fld("au-r", "I am", '<select id="au-r"><option value="staff">Staff</option><option value="incharge">Incharge (manager)</option><option value="admin">Admin</option></select>') + '<p class="rsub">The admin approves every new login. Use your full name so the log shows who did what.</p>' : "") +
      '<p class="err" id="au-e" role="alert">' + esc(msg || "") + '</p><button type="submit" class="btn primary block" id="au-go">' + (first ? "Create login" : "Log in") + '</button>' +
      '<button type="button" class="btn ghost block" id="au-sw">' + (first ? "I already have a login" : "First time? Set password") + "</button></form></div>";
    $("#au-sw").addEventListener("click", function () { renderAuth(first ? "login" : "setup", ""); });
    $("#af").addEventListener("submit", function (e) {
      e.preventDefault();
      var n = val("au-n"), pw = document.getElementById("au-p").value;
      if (!n || !pw) { $("#au-e").textContent = "Type your name and password."; return; }
      var b = $("#au-go"); b.disabled = true;
      call(first ? "setup" : "login", first ? [n, pw, val("au-r")] : [n, pw]).then(function (r) {
        if (r.pending) { renderAuth("login", "Your login is created. It is waiting for the admin to approve it."); return; }
        TOKEN = r.token; try { localStorage.setItem("lf-token", TOKEN); } catch (x) {}
        applyState(r.state); goRoute();
      }, function (err) { $("#au-e").textContent = err.message || "Could not log in."; b.disabled = false; });
    });
  }
  function teamSheet() {
    var rows = S.users.slice().sort(function (a, b) { return (a.status === "pending" ? 0 : 1) - (b.status === "pending" ? 0 : 1) || a.name.localeCompare(b.name); }).map(function (u, i) {
      var idx = S.users.indexOf(u);
      return '<div class="row"><div class="rtop"><h3>' + esc(u.name) + '</h3><span class="tags">' + pill(u.status === "active" ? "p-green" : "p-amber", u.status === "active" ? "Active" : u.status === "pending" ? "Waiting for approval" : "Password reset") + "</span></div>" +
        '<div class="field"><label for="tr-' + idx + '">Role</label><select id="tr-' + idx + '">' + opts([["staff", "Staff"], ["incharge", "Incharge (manager)"], ["admin", "Admin"]], u.role) + "</select></div>" +
        '<div class="actions">' + (u.status === "pending" ? '<button type="button" class="btn small primary" data-u="approve" data-i="' + idx + '">Approve</button>' : '<button type="button" class="btn small" data-u="role" data-i="' + idx + '">Save role</button>') +
        (u.name !== S.name ? '<button type="button" class="btn small" data-u="reset" data-i="' + idx + '">Reset password</button><button type="button" class="btn small danger" data-u="remove" data-i="' + idx + '">Remove</button>' : "") + "</div></div>";
    }).join("");
    openSheet("Team logins", '<div class="list">' + (rows || emptyBox("No logins yet", "People create their own login on the first screen.")) + '</div><p class="err" id="tm-e" role="alert"></p>', function (sh) {
      sh.addEventListener("click", function (e) {
        var b = e.target.closest("[data-u]"); if (!b) return;
        var u = S.users[+b.getAttribute("data-i")], act = b.getAttribute("data-u"); if (!u) return;
        var role = document.getElementById("tr-" + b.getAttribute("data-i")).value, p;
        if (act === "approve" || act === "role") p = tcall("approve", [u.name, role]);
        else if (act === "reset") p = tcall("resetUser", [u.name]);
        else p = tcall("removeUser", [u.name]);
        b.disabled = true;
        p.then(function (st) { applyState(st); teamSheet(); }, function (err) { $("#tm-e").textContent = err.message; b.disabled = false; });
      });
    });
  }
  async function start() {
    renderWho(); renderBar();
    if (!API_URL) { S.noDb = true; renderScreen(); return; }
    try { TOKEN = localStorage.getItem("lf-token") || ""; } catch (e) {}
    if (!TOKEN) { renderAuth("login", ""); return; }
    $("#screen").innerHTML = emptyBox("Loading records", "One moment.");
    try {
      var st = await tcall("state");
      if (!st || !st.me) { logout(false); return; }
      applyState(st); goRoute();
    } catch (e) {
      if (!TOKEN) return;
      S.fail = true; renderScreen();
    }
  }
  start();
})();
</script>
</body>
</html>
