function mkImg(txt,circ){

  x.strokeStyle='#E7A0A0';x.beginPath();x.moveTo(70,0);x.lineTo(70,420);x.stroke();
  x.fillStyle='#1F2D5A';x.font='italic 24px Georgia,serif';x.fillText(txt[0],90,80);x.fillText(txt[1],90,148);x.fillText(txt[2],90,216);
  x.strokeStyle='#C2385B';x.lineWidth=4;x.beginPath();x.ellipse(circ[0],circ[1],circ[2],26,0,0,7);x.stroke();
  x.fillStyle='#C2385B';x.font='bold 20px Arial';x.fillText('error',circ[0]-26,circ[1]+54);

}

   B({kind:'duty',title:'Lunch duty',from:'11:30',to:'12:00'}),
   B({kind:'duty',title:'Departure duty',from:'14:30',to:'14:45'}),
   B({title:'Maths NB L11 (Ex. 11.1 QA-C)',subject:'Maths',lesson:'L11',sections:'A B C',carry:true,note:'Carried due from yesterday'}),
   B({title:'English Book L8',material:'Book',subject:'English',lesson:'L8',sections:'A B C'}),
   B({title:'GK Book pg 44',material:'Book',subject:'GK',lesson:'Pg 44',sections:'A B C'}),

   du(B({title:'Maths NB Ex-5.4',subject:'Maths',lesson:'Ex-5.4',sections:'B',bundle:35,from:hm(m-70),to:hm(m-10)}),'Komal',20,2,'Pasting pending'),

   B({title:'SST Book L-12',material:'Book',subject:'S.St',lesson:'L-12',sections:'A B C'})

   ck(B({title:'S.St Book',material:'Book',subject:'S.St',sections:'A B C',bundle:118,from:hm(m-90),to:hm(m-30)}),'Pooja',35,{rv:'yes',errors:2,rvImgs:['p_demo3'],rvRemark:'Spellings of Sahara',rvBy:'Mentor head',rvAt:now-5*60000}),

  ]);
  mk(TD,'S10',[
   B({title:'English (FF) Book',material:'Book',subject:'English (FF)',sections:'A',bundle:32,from:hm(m-10),to:hm(m+50)}),
   B({title:'English (FF) Book',material:'Book',subject:'English (FF)',sections:'B',bundle:31,from:hm(m+50),to:hm(m+110)}),

  ]);

  /* ---- every other class, both days ---- */
  var SECS={1:'A B C',2:'A B C',3:'A B C',4:'A B C',5:'A B C',6:'A B C',7:'A B C',8:'A B C',9:'A B',10:'A B',11:'A'};
  var SUBJ={P:['EVS','Hindi 1','Maths','English','Science'],S:['Maths','Science','S.St','English (FF)','Hindi (Sparsh)','Sanskrit']};
  ['P1','P2','P3','P4','P5','S6','S7','S8','S9','S10','S11'].forEach(function(uid,i){

    var cm=w==='P'?({P1:'Rashami',P2:'Rashami',P3:'Pooja',P4:'Komal',P5:'Mansi'})[uid]:'CM';
    var ment=function(o){return B(Object.assign({by:'Mentor'},o))};
    if(!L.docs['days/'+YD+'__'+uid]){
      mk(YD,uid,[
        rv(ck(B({title:'Diary checking',material:'Diary',bundle:30+i,from:'08:30',to:'10:00'}),cm,1500),'Reviewer',0,[],'All signed'),
        rv(du(B({title:sj+' NB',subject:sj,lesson:'L-'+(5+i%4),sections:sa,bundle:34+i,from:'10:00',to:'11:15'}),cm,1400,2+i%4,'Absent students'),'Reviewer',i%3?0:3,i%3?[]:['p_demo'+(1+i%3)],i%3?'':'Presentation errors'),
        rn(ck(B({title:sj2+' Book',material:'Book',subject:sj2,sections:sb,bundle:33+i,from:'12:00',to:'13:00'}),cm,1300),'Reviewer',i%3+1,'Books left at home'),
        du(B({title:sj+' Book',material:'Book',subject:sj,lesson:'L-'+(3+i%5),sections:secs.join(' '),bundle:60+i,from:'13:00',to:'14:00'}),cm,1250,3+i%3,'Not brought')

    }
    if(!L.docs['days/'+TD+'__'+uid]){
      mk(TD,uid,[
        rv(ck(B({title:'Diary checking',material:'Diary',bundle:30+i,from:'08:30',to:'10:00'}),cm,300),'Reviewer',i%2?0:2,i%2?[]:['p_demo'+(1+i%3)],i%2?'Diaries signed':'Two diaries unsigned'),
        du(B({title:sj+' NB',subject:sj,lesson:'L-'+(6+i%3),sections:sa,bundle:34+i,from:hm(m-110),to:hm(m-50)}),cm,55,1+i%3,'Pending submission'),
        B({title:sj2+' Book',material:'Book',subject:sj2,sections:sb,bundle:33+i,from:hm(m-15),to:hm(m+45)}),
        B({title:sj+' NB',subject:sj,lesson:'L-'+(6+i%3),sections:sb,bundle:34+i,from:hm(m+50),to:hm(m+110),after:i%2?hm(m+40):''}),
        B({title:sj2+' NB',subject:sj2,sections:sa,bundle:32+i,from:hm(m-300),to:hm(m-240)}),
        B({title:sj2+' Book L-'+(9+i%3),material:'Book',subject:sj2,lesson:'L-'+(9+i%3),sections:secs.join(' ')}),
        ment({title:'Test Notebook',material:'Test Notebook',subject:'Test Notebook',sections:secs.join(' ')})
      ]);
    }
  });
  /* ---- the next day, already prepared for two classes (Prepare next day) ---- */
  var MD=fd(new Date(n.getTime()+864e5));
  ['P5','S6'].forEach(function(uid){
    var cnt=0,sl={},T=L.docs['days/'+TD+'__'+uid];
    sl.t0={order:0,kind:'duty',title:'Morning duty',from:'07:00',to:'07:30',cm:'pending',by:'CM'};
    sl.t1={order:1,kind:'check',title:'Diary checking',material:'Diary',from:'08:00',to:'09:30',cm:'pending',by:'CM'};
    Object.keys(T.slots).forEach(function(id){var x=T.slots[id];if(x.by!=='Mentor'&&(x.cm==='due'||(!x.from&&x.cm==='pending'))){sl['c_'+id]={order:50+(cnt++),kind:'check',title:'Due · '+([x.subject,x.lesson].filter(Boolean).join(' ')||x.title),material:x.material||'',subject:x.subject||'',lesson:x.lesson||'',sections:x.sections||'',bundle:x.cm==='due'?x.due:x.bundle,by:'CM',carry:true,cm:'pending',from:'',to:''}}});
    L.docs['days/'+MD+'__'+uid]={date:MD,unit:uid,slots:sl};
  });
  window.__demoDates={y:YD,t:TD,m:MD};

function local(fn,a){
  if(fn==='ping')return true;
  if(fn==='sync'){var d={ver:L.ver,days:{},docs:{}};Object.keys(L.docs).forEach(function(k){if(k.indexOf('config/')===0)d.docs[k]=L.docs[k];else if(a[1].indexOf(L.docs[k].date)>=0)d.days[k.slice(5)]=L.docs[k]});return d}
  if(fn==='set'||fn==='update'){L.docs[a[0]]=fn==='set'?a[1]:merge(L.docs[a[0]],a[1]);L.ver++;return true}
  if(fn==='putPhoto'){L.ph[a[0]]=a[1];return true}
  if(fn==='getPhoto')return L.ph[a[0]];
}
function call(fn,args){
  if(PREVIEW)return Promise.resolve(local(fn,args||[]));
  return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,code:CODE,args:args||[]})})
    .then(function(r){return r.json()}).then(function(j){if(!j.ok){var e=new Error(j.error||'error');e.auth=!!j.auth;throw e}return j.data});
}
function merge(a,b){
  if(b===null||typeof b!=='object'||Array.isArray(b))return b;
  var o=(a&&typeof a==='object'&&!Array.isArray(a))?JSON.parse(JSON.stringify(a)):{};
  Object.keys(b).forEach(function(k){o[k]=merge(o[k],b[k])});return o;
}
if(PREVIEW)seedDemo();
var cache={days:{},docs:{}},ver=-1,dates=[],qL=[],dL=[],busy=false,again=false,failed=0;
function snapDays(){var ids=Object.keys(cache.days);return{docs:ids.map(function(id){return{id:id,data:function(){return cache.days[id]}}}),metadata:{fromCache:false}}}
function snapDoc(p){var v=cache.docs[p];return{exists:!!v,data:function(){return v}}}
function notify(){qL.forEach(function(l){l.cb(snapDays())});dL.forEach(function(l){l.cb(snapDoc(l.path))})}
function fail(e){qL.forEach(function(l){l.err&&l.err(e)});dL.forEach(function(l){l.err&&l.err(e)})}
function poll(force){
  if(busy){again=true;return}
  if(force)ver=-1;
  busy=true;
  call('sync',[ver,dates]).then(function(d){
    failed=0;
    if(!d.same){ver=d.ver;cache.days=d.days||{};cache.docs=d.docs||{};notify()}
  }).catch(function(e){failed++;if(e.auth){try{localStorage.removeItem('cd_tok')}catch(x){}location.reload();return}if(failed>1)fail(e)})
  .then(function(){busy=false;if(again){again=false;poll(false)}});
}
setInterval(function(){if(!document.hidden)poll(false)},12000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll(false)});
function write(op,path,data){
  var parts=path.split('/');
  var cur=parts[0]==='days'?cache.days[parts[1]]:cache.docs[path];
  var next=op==='set'?data:merge(cur,data);
  if(parts[0]==='days')cache.days[parts[1]]=next;else cache.docs[path]=next;
  notify();
  return call(op,[path,data]).then(function(){poll(true)}).catch(function(e){poll(true);throw e});
}
var db={
  collection:function(c){
    return{
      doc:function(id){return{update:function(d){return write('update',c+'/'+id,d)},set:function(d){return write('set',c+'/'+id,d)}}},
      where:function(f,op,vals){return{onSnapshot:function(cb,err){dates=vals.slice();var l={cb:cb,err:err};qL.push(l);poll(true);return function(){qL=qL.filter(function(x){return x!==l})}}}}
    };
  },
  doc:function(path){
    return{
      update:function(d){return write('update',path,d)},set:function(d){return write('set',path,d)},
      onSnapshot:function(cb,err){var l={path:path,cb:cb,err:err};dL.push(l);if(ver>=0)cb(snapDoc(path));return function(){dL=dL.filter(function(x){return x!==l})}}
    };
  }
};
var assets={upload:function(blob){
  return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(blob)}).then(function(u){
    var id='p_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    return call('putPhoto',[id,u]).then(function(){pc[id]=u;return{id:id,url:u}});
  });
}};
/* photos: the page asks for /_blob/<id>; fetch each one from the server once and swap it in */
var pc={},pend={};
function fix(img){
  var m=/^\/_blob\/(.+)$/.exec(img.getAttribute('src')||'');if(!m)return;
  var id=m[1];img.setAttribute('data-pid',id);
  if(pc[id]){img.src=pc[id];return}
  img.removeAttribute('src');
  if(!pend[id])pend[id]=call('getPhoto',[id]).then(function(u){pc[id]=u;return u});
  pend[id].then(function(u){var a=document.querySelectorAll('img[data-pid="'+id+'"]');for(var i=0;i<a.length;i++)a[i].src=u}).catch(function(){delete pend[id]});
}
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType!==1)return;if(n.tagName==='IMG')fix(n);else if(n.querySelectorAll)n.querySelectorAll('img').forEach(fix)})})}).observe(document.documentElement,{childList:true,subtree:true});
/* sign-in gate: same name and password as the Diary app */
var ready=new Promise(function(resolve){
  function gate(msg){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:#1F2D5A;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,system-ui,sans-serif';
    var f='width:100%;padding:11px 12px;border:1px solid #E6E2D8;border-radius:9px;font-size:15px;margin-bottom:9px';
    d.innerHTML='<form style="background:#fff;border-radius:14px;padding:26px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)"><div style="font-family:Lora,Georgia,serif;font-size:22px;font-weight:700;color:#1F2D5A">CM Checking Desk</div><div style="height:3px;width:44px;background:#E3A94F;margin:8px 0 14px"></div><div style="color:#646B80;font-size:13.5px;margin-bottom:12px">Flourish International School · log in with the same name and password as the Diary app.</div><input id="cd-n" type="text" autocomplete="username" placeholder="Your name" style="'+f+'"><input id="cd-p" type="password" autocomplete="current-password" placeholder="Password" style="'+f+'"><div id="cd-err" style="color:#A42A47;font-size:13px;min-height:18px;margin:2px 0 8px">'+(msg||'')+'</div><button type="submit" style="width:100%;padding:11px;border:0;border-radius:9px;background:#1F2D5A;color:#fff;font-weight:700;font-size:15px">Log in</button></form>';
    document.body.appendChild(d);
    d.querySelector('form').onsubmit=function(ev){
      ev.preventDefault();var n=d.querySelector('#cd-n').value.trim(),pw=d.querySelector('#cd-p').value;
      if(!n||!pw)return;CODE='';
      call('login',[n,pw]).then(function(r){CODE=r.token;try{localStorage.setItem('cd_tok',CODE);localStorage.setItem('cd_name',r.name)}catch(e){}d.remove();resolve()}).catch(function(e){d.querySelector('#cd-err').textContent=e.auth||/password|login|approv/i.test(e.message)?e.message:'Could not reach the server. Check the connection.'});
    };
  }
  function start(){
    if(PREVIEW){var b=document.createElement('div'),dd=window.__demoDates||{},lab=function(d){var x=d.split('-');return new Date(+x[0],+x[1]-1,+x[2],12).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
      b.style.cssText='position:relative;z-index:9999;background:#1F2D5A;color:#fff;font:600 12.5px Inter,system-ui,sans-serif;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px;border-bottom:3px solid #E3A94F';
      b.innerHTML='<span style="color:#F4D9A6">PREVIEW · sample data only, nothing is saved. Data is loaded for</span>'+[['y','earlier day'],['t','today'],['m','plan prepared from carry-over']].map(function(a){return '<button data-go="'+dd[a[0]]+'" style="background:#E3A94F;color:#1B2340;border:0;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer">'+lab(dd[a[0]])+' · '+a[1]+'</button>'}).join('');
      b.addEventListener('click',function(ev){var g=ev.target.getAttribute&&ev.target.getAttribute('data-go');if(!g)return;var i=document.getElementById('datepick');if(!i){var nb=document.querySelector('nav button');if(nb)nb.click();i=document.getElementById('datepick')}if(i){i.value=g;i.dispatchEvent(new Event('change',{bubbles:true}))}});
      document.body.insertBefore(b,document.body.firstChild);resolve();return}
    if(!CODE){gate();return}
    call('ping').then(resolve).catch(function(e){if(e.auth){CODE='';try{localStorage.removeItem('cd_tok')}catch(x){}gate()}else resolve()});
  }
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
});
window.claude={use:function(n){
  if(n==='db')return ready.then(function(){return db});
  if(n==='assets')return ready.then(function(){return assets});
  if(n==='user')return Promise.resolve({can:function(){return true}});
  return Promise.reject(new Error('no'));
}};

.ccard:hover{border-top-color:var(--gold)}.cc-top{display:flex;justify-content:space-between;align-items:baseline}.cc-top b{font:700 18px var(--head);color:var(--navy)}
.cc-names{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin:5px 0 8px}.cc-names b{color:var(--ink)}
.cc-n{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.cgrid,.pgrid,.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.pgrid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--purple);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.pc-top{display:flex;gap:11px;align-items:center;margin-bottom:8px}.pc-top b{font:700 16px var(--head);color:var(--navy)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 17px var(--head)}
.deskseg{margin-bottom:12px;max-width:100%;overflow-x:auto}
.tcard .field{margin-top:8px}.srow2{display:grid;grid-template-columns:2fr 1.4fr 1.4fr;gap:10px;margin-bottom:8px}
.pgroup{margin-top:12px}.pgroup>span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:6px}
.cpc small{opacity:.7}
.cpc{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--navy)}.cpc.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:760px){
  .qgrid,.srow2{grid-template-columns:1fr}.ql{width:100%}
  header{position:static}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);border-top:3px solid var(--gold);padding:6px 6px calc(6px + env(safe-area-inset-bottom));max-width:none;justify-content:space-between;gap:4px;overflow:visible}
  nav button{flex:1;font:600 11.5px var(--body);padding:9px 4px;text-align:center;white-space:normal;line-height:1.2;border-radius:10px}
  main{padding-bottom:92px}
  .pt-row{padding:12px 12px}.pt-title{font-size:16px}
}
/* tables */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);background:var(--cream);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
tr.click{cursor:pointer} tr.click:hover td{background:var(--gold-soft)}
td .bar{height:6px;border-radius:3px;background:var(--line);width:90px;margin-top:5px;overflow:hidden}
td .bar i{display:block;height:100%;background:var(--good)}
.gap{margin-top:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:16px;padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{font:700 18px var(--head);color:var(--navy)}
.dues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.dues li{display:flex;gap:8px;justify-content:space-between;font-size:13px;border-bottom:1px dotted var(--line);padding-bottom:5px;align-items:center}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;background:#FBF1DC;color:#6B4A0E;border:1px solid #F0DDB3}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:#EBC1CB}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:90vw;border-bottom:2px solid var(--gold);box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--card);border-radius:18px;border-top:4px solid var(--gold);max-width:450px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg h2{font:600 24px var(--head);color:var(--navy)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.choice button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent);background:var(--gold-soft)}
.choice b{display:block;font-family:var(--head);color:var(--navy)}.choice span{font-size:12px;color:var(--mute)}
.swatches{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}
.th>button:first-child{border:1px solid var(--line);padding:0;border-radius:10px;overflow:hidden;cursor:zoom-in;background:#fff;display:block}
.th img{width:88px;height:88px;object-fit:cover;display:block}
.th .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1;font-size:14px}
.modal.light{background:rgba(10,20,40,.85);cursor:zoom-out}
.modal.light img{max-width:92vw;max-height:88vh;border-radius:12px;background:#fff}
.filebtn input{display:none}
.cpc{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:8px 15px;font-weight:700;cursor:pointer}
.cpc.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
@media (max-width:700px){
  main{padding:14px 12px 70px}
  header{padding:10px 12px 0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hrow h1{font-size:18px}
}
@media (max-width:540px){
  .slot{grid-template-columns:1fr}
  .tm{flex-direction:row;align-items:center;padding:14px 12px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .tbox{flex:1}
  .seg button{padding:10px 15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const toMin=t=>{if(!t)return null;const p=t.split(':').map(Number);return p[0]*60+p[1]};
const fmt=t=>{if(!t)return '';const p=t.split(':').map(Number);const ap=p[0]>=12?'PM':'AM';return (p[0]%12||12)+':'+pad(p[1])+' '+ap};
const mins=n=>{n=Math.max(0,Math.round(n));const h=Math.floor(n/60),r=n%60;return h?(h+' hr'+(r?' '+r+' min':'')):(r+' min')};
const durTxt=(a,b)=>{const m=toMin(b)-toMin(a);return m>0?mins(m):''};
const dayLabel=s=>new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parseYmd(s));
const dayLong=s=>new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parseYmd(s));
const dayShort=s=>new Intl.DateTimeFormat('en-IN',{weekday:'short',day:'numeric',month:'short'}).format(parseYmd(s));
const clockTxt=ts=>new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit'}).format(new Date(ts));
const num=v=>{const n=parseInt(v,10);return isFinite(n)&&n>0?n:0};
const uid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const unitById=id=>UNITS.find(u=>u.id===id);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const todayStr=()=>ymd(new Date());
function safeGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function hintMin(material,subject){
  const s=(subject||'').toLowerCase();
  if(material==='Book')return 60;
  if(material==='Notebook')return /math/.test(s)?60:(/english|science|s\.st|sst|computer/.test(s)?120:0);
  return 0;
}

/* ---------- state ---------- */
const me0=safeGet('fis-cd-me3');
const S={date:todayStr(),unit:'P5',tab:'board',desk:'all',role:null,me:null,meUnits:[],staff:null,roleHint:me0&&me0.role||'',name:me0&&me0.name||'',
  days:{},known:{},cfg:{},theme:{},draft:{},open:{},assets:null,lightbox:null,delConfirm:null,db:null,canWrite:true,loaded:false,slow:false,toast:'',dbMissing:false};
let unsubDays=null,loadTimer=null;

/* ---------- theme ---------- */
function applyTheme(){
  const t=Object.assign({},FIS_THEME,S.theme||{}),r=document.documentElement.style;
  ['navy','gold','purple','mag'].forEach(k=>{if(/^#[0-9a-fA-F]{6}$/.test(t[k]))r.setProperty('--'+k,t[k])});
}

/* ---------- roster ---------- */
function roster(u){const c=S.cfg[u]||{},d=DEFAULT_ROSTER[u]||{};return {cm:c.cm!=null?c.cm:(d.cm||''),reviewer:c.reviewer!=null?c.reviewer:(d.reviewer||'')}}

/* ---------- people and permissions ---------- */
function parseUnits(tx){tx=String(tx||'').toLowerCase();if(/all/.test(tx))return ALL_IDS.slice();const out=[];(tx.match(/\d+/g)||[]).forEach(n=>{const id=(+n<=5?'P':'S')+(+n);if(unitById(id)&&out.indexOf(id)<0)out.push(id)});return out}
function people(){
  const map={};
  const add=(name,role,units)=>{name=String(name||'').trim();if(!name)return;const k=role+'|'+name.toLowerCase();const p=map[k]||(map[k]={name:name,role:role,units:[]});units.forEach(u=>{if(p.units.indexOf(u)<0)p.units.push(u)})};
  ((S.staff&&S.staff.list)||DEFAULT_STAFF).forEach(x=>add(x.name,x.role,x.role==='director'?ALL_IDS:parseUnits(x.units)));
  UNITS.forEach(u=>{const r=roster(u.id);add(r.cm,'cm',[u.id]);add(r.reviewer,'cmh',[u.id])});
  const order={director:0,cmh:1,cm:2,pl:3};
  return Object.keys(map).map(k=>map[k]).sort((a,b)=>order[a.role]-order[b.role]||a.name.localeCompare(b.name));
}
function resolveMe(){
  if(!S.name){S.me=null;S.role=null;S.meUnits=[];return}
  const l=S.name.toLowerCase(),f=l.split(/\s+/)[0],ps=people();
  const p=ps.find(x=>x.name.toLowerCase()===l&&x.role===S.roleHint)||ps.find(x=>x.name.toLowerCase()===l)||ps.find(x=>x.name.toLowerCase().split(/\s+/)[0]===f);
  S.me=p?{name:p.name,role:p.role,units:p.units}:{name:S.name,role:'guest',units:[]};
  S.role=(S.me.role==='director'||S.me.role==='cmh')?'manager':S.me.role==='cm'?'cm':'viewer';
  S.meUnits=S.me.units;
}
const isDirector=()=>!!(S.me&&S.me.role==='director');
const canEditU=u=>!!(S.canWrite&&S.me&&(S.me.role==='director'||(S.me.role==='cmh'&&S.meUnits.indexOf(u)>=0)));
const canMarkU=u=>!!(S.canWrite&&S.me&&(canEditU(u)||(S.me.role==='cm'&&S.meUnits.indexOf(u)>=0)));
function isMgr(){return canEditU(S.unit)}
function visibleUnits(){return S.me&&S.me.role==='pl'&&S.meUnits.length?UNITS.filter(u=>S.meUnits.indexOf(u.id)>=0):UNITS}
const whoName=()=>S.name||(S.me&&S.me.name)||'Staff';

/* ---------- data access ---------- */
function slotsOf(date,unit){
  const d=S.days[date+'__'+unit];if(!d||!d.slots)return [];
  return Object.keys(d.slots).filter(k=>d.slots[k]&&typeof d.slots[k]==='object').map(k=>Object.assign({},d.slots[k],{id:k}));
}
const bySched=(a,b)=>(toMin(a.from)-toMin(b.from))||((a.order||0)-(b.order||0));
function split(date,unit){
  const all=slotsOf(date,unit);
  return {timed:all.filter(s=>s.from).sort(bySched),pool:all.filter(s=>!s.from).sort((a,b)=>(a.order||0)-(b.order||0))};
}
const isCheck=s=>s.kind!=='duty';
const isCM=s=>isCheck(s)&&s.by!=='Mentor';
function stats(date,unit){
  const all=slotsOf(date,unit),cm=all.filter(isCM);
  const st={items:cm.length,alloc:cm.filter(s=>s.from).length,pool:cm.filter(s=>!s.from).length,mentor:all.filter(s=>isCheck(s)&&s.by==='Mentor').length,
    done:cm.filter(s=>s.cm==='checked').length,dueBlocks:cm.filter(s=>s.cm==='due').length,dueNb:0,toReview:0,reviewed:0,errors:0,notDone:0,late:0};
  cm.forEach(s=>{
    if(s.cm==='due')st.dueNb+=num(s.due);
    if(s.cm&&s.cm!=='pending'){st.toReview++;if(s.rv==='yes'||s.rv==='no'){st.reviewed++;st.errors+=num(s.errors);st.notDone+=num(s.notDone)}}
    if(isLate(s,date))st.late++;
  });
  return st;
}
function isLate(s,date){
  if(!isCM(s)||(s.cm&&s.cm!=='pending'))return false;
  const t=todayStr();
  if(date<t)return true;
  return date===t&&!!s.to&&nowMin()>toMin(s.to);
}
function isNow(s,date){return date===todayStr()&&s.from&&s.to&&nowMin()>=toMin(s.from)&&nowMin()<toMin(s.to)}
function isLocked(s,date){return date===todayStr()&&s.after&&nowMin()<toMin(s.after)}
function liveInfo(s,date){
  if(!s.from||!s.to||(s.cm&&s.cm!=='pending'))return null;
  const t=todayStr();
  if(date!==t)return null;
  const nm=nowMin(),f=toMin(s.from),e=toMin(s.to);
  if(nm<f)return {txt:'Starts in '+mins(f-nm),cls:'p-info'};
  if(nm<e)return {txt:'Ends in '+mins(e-nm),cls:'p-gold p-now',pct:Math.round(100*(nm-f)/(e-f))};
  return {txt:'Ended '+mins(nm-e)+' ago',cls:isCheck(s)?'p-bad':'p-pending'};
}

/* ---------- writes (serial per document) ---------- */
const queues={};
function queue(key,fn){
  const p=(queues[key]||Promise.resolve()).then(fn).catch(e=>{toast(errText(e))});
  queues[key]=p;return p;
}
function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'You can view this page but not change it. Ask the owner for Contributor access.';
  if(c==='quota_exceeded')return 'The database is full. Delete old days before adding more.';
  return 'Could not save. Check the connection and try again.';
}
function writeSlots(unit,date,map){
  if(!S.db)return Promise.resolve();
  const key=date+'__'+unit;
  return queue(key,async()=>{
    const ref=S.db.collection('days').doc(key);
    if(S.days[key]||S.known[key])await ref.update({slots:map});
    else{await ref.set({date:date,unit:unit,slots:map});S.known[key]=true}
  });
}
const patch=(unit,date,id,p)=>writeSlots(unit,date,{[id]:p});
function writeCfg(units){
  if(!S.db)return Promise.resolve();
  return queue('cfg',async()=>{
    const ref=S.db.doc('config/roster');
    if(S.cfgKnown)await ref.update({units:units});else{await ref.set({units:units});S.cfgKnown=true}
  });
}
function readStaff(){const out=[];let i=0;while(document.getElementById('st-n-'+i)){out.push({name:document.getElementById('st-n-'+i).value.trim(),role:document.getElementById('st-r-'+i).value,units:document.getElementById('st-u-'+i).value.trim()});i++}return out.length?out:((S.staff&&S.staff.list)||DEFAULT_STAFF)}
function writeStaff(list){if(!S.db)return Promise.resolve();return queue('staff',async()=>{await S.db.doc('config/staff').set({list:list});S.staff={list:list}})}
function writeTheme(t){
  if(!S.db)return Promise.resolve();
  return queue('theme',async()=>{await S.db.doc('config/theme').set(t)});
}

/* ---------- subscriptions ---------- */
function subscribeDays(){
  if(!S.db)return;
  if(unsubDays){unsubDays();unsubDays=null}
  const a=S.date,b=addDays(S.date,1),c0=addDays(S.date,-1);
  unsubDays=S.db.collection('days').where('date','in',[c0,a,b]).onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{next[d.id]=d.data()});
    S.days=next;
    if(!snap.metadata.fromCache){S.loaded=true;S.slow=false;clearTimeout(loadTimer)}
    render();
  },e=>{S.slow=true;render()});
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
}
async function boot(){
  applyTheme();render();
  let db=null,user=null;
  try{db=await claude.use('db')}catch(e){db=null}
  try{user=await claude.use('user')}catch(e){user=null}
  if(!db){S.dbMissing=true;S.loaded=true;render();return}
  S.db=db;
  try{S.assets=await claude.use('assets')}catch(e){S.assets=null}
  try{const w=user&&user.can&&user.can('data.write');const wv=(w&&typeof w.then==='function')?await w:w;S.canWrite=wv!==false}catch(e){}
  subscribeDays();
  db.doc('config/roster').onSnapshot(d=>{S.cfgKnown=d.exists;const v=d.exists?d.data():null;S.cfg=(v&&v.units)||{};resolveMe();render()},()=>{});
  db.doc('config/staff').onSnapshot(d=>{S.staffKnown=d.exists;S.staff=d.exists?d.data():null;resolveMe();render()},()=>{});
  db.doc('config/theme').onSnapshot(d=>{S.theme=d.exists?d.data():{};applyTheme();render()},()=>{});
  render();
  try{const nm=localStorage.getItem('cd_name');if(!S.name&&nm){S.name=nm;resolveMe()}}catch(e){}
  resolveMe();
  if(!S.me)openRoleDialog();
}

/* ---------- toast ---------- */
let toastT=null;
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render()},3800)}

/* ---------- rendering ---------- */
function isMgr(){return S.role==='manager'}
function visibleUnits(){return isMgr()?UNITS:UNITS.filter(u=>u.id===S.meUnit)}
function render(){
  const a=document.activeElement,key=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd,scroll=window.scrollY;
  renderHeader();
  const m=document.getElementById('main');
  let h='';
  if(S.dbMissing)h+='<div class="banner bad">Could not reach the shared plan. Check the connection and reload.</div>';
  else if(S.slow&&!S.loaded)h+='<div class="banner">Saved plans cannot be reached yet. This page keeps trying and will fill in when the connection returns.</div>';
  else if(S.slow)h+='<div class="banner">The connection dropped. What you see may be out of date.</div>';
  
  if(!S.me&&!S.dbMissing)h+='<div class="empty"><b>Choose who you are</b>Tap “Who are you?” at the top to see your plan.</div>';
  else if(S.tab==='board'||S.tab==='next')h+=renderBoard();
  else if(S.tab==='desks')h+=renderDesks();
  else if(S.tab==='setup')h+=renderSetup();
  else h+=renderBoard();
  if(S.lightbox)h+='<div class="modal light" data-act="img-close"><img src="/_blob/'+esc(S.lightbox)+'" alt="Error photo"></div>';
  if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  m.innerHTML=h;
  if(key){const el=document.getElementById(key);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(ss,se)}catch(e){}}}
  window.scrollTo(0,scroll);
}
function renderHeader(){
  const nav=document.getElementById('nav');
  const items=NAV.filter(n=>!(n.id==='next'&&S.me&&S.me.role==='cm'));
  nav.innerHTML=items.map(n=>'<button data-act="tab" data-v="'+n.id+'"'+(S.tab===n.id?' class="on" aria-current="page"':'')+'>'+n.label+'</button>').join('');
  const d=new Date();
  document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-IN',{weekday:'short',day:'numeric',month:'short'}).format(d)+' · '+clockTxt(d);
  const me=document.getElementById('me');
  me.textContent=S.me?(S.me.name+' · '+ROLE_LABEL[S.me.role]):'Who are you?';
}
function bar2(showDate){
  const date=showDate?'<div class="datebar"><button data-act="date-prev" aria-label="Previous day">‹</button><label class="datebtn" title="Click to pick a date"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span><b>'+dayLong(S.date)+'</b>'+(S.date===todayStr()?'<small>Today</small>':S.date===addDays(todayStr(),1)?'<small>Tomorrow</small>':S.date<todayStr()?'<small>Earlier day</small>':'<small>Upcoming</small>')+'</span><input type="date" id="datepick" value="'+S.date+'" aria-label="Pick a date"></label><button data-act="date-next" aria-label="Next day">›</button><button data-act="date-today">Today</button></div>':'';
  return '<div class="bar2"><div class="tools"></div><div class="tools">'+date+'</div></div>';
}
const secHead=(t,sm)=>'<div class="secthead"><i></i><span>'+t+'</span>'+(sm?'<small>'+sm+'</small>':'')+'</div>';

/* --- day board --- */
function liveStrip(sp){
  if(S.date!==todayStr())return '';
  const nm=nowMin(),c=sp.timed.filter(s=>isCM(s)&&(!s.cm||s.cm==='pending'));
  const cur=c.find(s=>nm>=toMin(s.from)&&nm<toMin(s.to));
  if(cur)return '<span class="live">Now · '+esc(cur.title||cur.subject)+' · ends in '+mins(toMin(cur.to)-nm)+'</span>';
  const nxt=c.filter(s=>toMin(s.from)>nm).sort(bySched)[0];
  if(nxt)return '<span class="live">Next · '+fmt(nxt.from)+' · '+esc(nxt.title||nxt.subject)+' · in '+mins(toMin(nxt.from)-nm)+'</span>';
  return '';
}

const QTYPES=[['Book','Book'],['Notebook','Notebook'],['Diary','Diary'],['Assignment','Assignment'],['Test','Test'],['Duty','Duty'],['Other','Other']];
function personPills(u){const r=roster(u.id);return '<span class="pp"><i>Class Manager</i><b>'+(esc(r.cm)||'not set')+'</b></span><span class="pp"><i>'+WING[u.wing].mgr+'</i><b>'+(esc(r.reviewer)||'not set')+'</b></span>'}
function classChips(){
  const vis=visibleUnits();
  const row=(w)=>{const us=vis.filter(u=>u.wing===w);return us.length?'<div class="cgrp"><span>'+(w==='P'?'Primary':'Secondary')+'</span>'+us.map(x=>{const r=roster(x.id);return '<button class="cchip" data-act="unit" data-v="'+x.id+'" aria-pressed="'+(x.id===S.unit)+'"><b>'+esc(x.label)+'</b><small>'+(esc(r.cm)||'—')+'</small></button>'}).join('')+'</div>':''};
  return '<div class="cchips" role="group" aria-label="Choose class">'+row('P')+row('S')+'</div>';
}
function carryPanel(u,date){
  const prev=addDays(date,-1),items=carryItems(prev,u.id),have=slotsOf(date,u.id).map(x=>x.id);
  const todo=items.filter(s=>have.indexOf('c_'+s.id)<0);
  if(!todo.length)return '';
  let h='<div class="strip carry"><div class="sh"><b>Dues from '+dayShort(prev)+'</b><span>'+todo.length+' to put in this day</span>'+(canEditU(u.id)?'<button class="qb ok" data-act="carry-all">Add all</button>':'')+'</div>';
  todo.forEach((s,i)=>{h+='<div class="srow"><span class="no">'+(i+1)+'</span><div class="sm"><b>'+esc([s.subject,s.lesson,s.material].filter(Boolean).join(' · ')||s.title)+'</b><div class="pt-sub">'+(s.sections?'<span class="tag">Sec '+esc(s.sections)+'</span>':'')+(s.cm==='due'?'<span class="pill p-warn">'+num(s.due)+' due</span>':'<span class="pill p-bad">not checked</span>')+'</div></div>'+(canEditU(u.id)?'<button class="qb" data-act="carry-one" data-id="'+s.id+'">+ Add</button>':'')+'</div>'});
  return h+'</div>';
}
function quickAdd(u){
  const d=S.draft['q']||(S.draft['q']={type:'Notebook',name:'',subject:'',lesson:'',secs:[],from:'',to:'',split:'one'});
  const secs=u.sec.split('·').map(x=>x.trim()).filter(Boolean),duty=d.type==='Duty';
  let h='<div class="strip qa"><div class="sh"><b>Add a task</b><span>Everything is optional — only the time matters</span></div><div class="qrow"><span class="ql">Task</span><div class="chips">'+QTYPES.map(x=>'<button type="button" class="cpc'+(d.type===x[0]?' on':'')+'" data-act="q-type" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>';
  h+='<div class="qgrid"><div class="field"><label for="q-sub">Subject</label><input id="q-sub" type="text" list="subjects" data-d="q" data-k="subject" value="'+esc(d.subject)+'" placeholder="Maths"></div><div class="field"><label for="q-les">Lesson / number</label><input id="q-les" type="text" data-d="q" data-k="lesson" value="'+esc(d.lesson)+'" placeholder="L-8"></div><div class="field"><label for="q-nm">Task name</label><input id="q-nm" type="text" list="titles" data-d="q" data-k="name" value="'+esc(d.name)+'" placeholder="'+(duty?'Lunch duty':'Auto from subject')+'"></div></div>';
  if(!duty)h+='<div class="qrow"><span class="ql">Sections</span><div class="chips">'+secs.map(x=>'<button type="button" class="cpc'+(d.secs.indexOf(x)>=0?' on':'')+'" data-act="q-sec" data-v="'+x+'">'+x+(d.secs.indexOf(x)>=0&&d.secs.length>1?' · '+(d.secs.indexOf(x)+1):'')+'</button>').join('')+'</div></div>';
  if(!duty&&d.secs.length>1)h+='<div class="qrow"><span class="ql">Plan</span><div class="chips"><button type="button" class="cpc'+(d.split==='one'?' on':'')+'" data-act="q-split" data-v="one">One block for all sections</button><button type="button" class="cpc'+(d.split==='each'?' on':'')+'" data-act="q-split" data-v="each">Each section one after another</button></div></div>';
  h+='<div class="qrow"><span class="ql">Time</span><div class="field"><input id="q-from" type="time" aria-label="Start" data-d="q" data-k="from" value="'+esc(d.from)+'"></div><span class="to">to</span><div class="field"><input id="q-to" type="time" aria-label="End" data-d="q" data-k="to" value="'+esc(d.to)+'"></div><span class="note">Leave empty to keep it in the waiting list</span></div>';
  h+='<div class="row"><button class="btn gold" data-act="q-save">Add to plan</button><button class="btn ghost" data-act="q-close">Close</button></div></div>';

function renderBoard(){
  const planning=S.tab==='next';
  if(visibleUnits().every(x=>x.id!==S.unit))S.unit=visibleUnits()[0].id;
  const u=unitById(S.unit)||UNITS[0],sp=split(S.date,u.id),st=stats(S.date,u.id),edit=canEditU(u.id);
  let h=bar2(true)+classChips();
  h+='<div class="cstrip"><div><div class="eyebrow">'+(planning?'Plan next day':'Checking plan')+' · time based</div><h2>'+esc(u.label)+' · '+(planning?'Plan for ':'Checking plan · ')+dayShort(S.date)+'</h2><div class="who">'+personPills(u)+'</div></div>'+liveStrip(sp)+'</div>';
  if(planning)h+='<div class="hintbar"><b>How this works:</b> 1) Dues from the day before come in below. 2) Give each task a start and end time. 3) The Class Manager sees the plan in the morning and marks Checked or Due.</div>';
  h+='<div class="kpis"><div class="kpi g"><span>Done</span><b>'+st.done+'/'+st.items+'</b></div><div class="kpi w"><span>Notebooks due</span><b>'+st.dueNb+'</b></div><div class="kpi"><span>Reviewed</span><b>'+st.reviewed+'/'+st.toReview+'</b></div><div class="kpi '+(st.errors?'r':'')+'"><span>Errors</span><b>'+st.errors+'</b></div></div>';
  if(edit){
    h+=carryPanel(u,S.date);
    h+='<div class="tools" style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">'+(S.open.qa?'':'<button class="btn gold" data-act="q-open">+ Add task</button>')+(sp.timed.length?'':'<button class="btn ghost" data-act="template">Add usual duties and diary</button>')+'</div>';
    if(S.open.qa)h+=quickAdd(u);
  }
  const poolCM=sp.pool.filter(isCM),poolMentor=sp.pool.filter(s=>isCheck(s)&&s.by==='Mentor');
  if(poolCM.length||poolMentor.length||edit){

function tags(s){

async function handlePhoto(id,file){
  if(!file||!S.assets)return;
  S.uploading=id;render();
  try{
    const blob=await new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',0.82)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('x'))};img.src=u});
    const r=await S.assets.upload(blob);
    const d=S.draft['r:'+id]||(S.draft['r:'+id]={});d.imgs=(d.imgs||[]).concat([r.id]).slice(0,4);
  }catch(e){toast('The photo could not be uploaded. Try again.')}
  S.uploading=null;render();
}

function issuesFor(units){
  const out=[];
  units.forEach(u=>{slotsOf(S.date,u.id).filter(isCM).forEach(s=>{
    const nm=u.label+' · '+(s.title||s.subject||'Checking');
    if(isLate(s,S.date))out.push({u:u.id,t:nm,k:'Not updated',c:'p-bad'});
    else if(s.cm==='due')out.push({u:u.id,t:nm,k:num(s.due)+' due',c:'p-warn'});
    if(s.rv==='yes'&&num(s.errors))out.push({u:u.id,t:nm,k:num(s.errors)+' errors',c:'p-bad'});
    if(s.rv==='no')out.push({u:u.id,t:nm,k:num(s.notDone)+' not checked',c:'p-warn'});
    if(s.cm&&s.cm!=='pending'&&s.rv!=='yes'&&s.rv!=='no')out.push({u:u.id,t:nm,k:'Review pending',c:'p-pending'});
  })});
  return out;
}
function renderDesks(){
  const vis=visibleUnits(),role=S.me&&S.me.role;
  const tabs=[['all','All classes'],['cm','CM Desk'],['pm','PM / CMH Desk'],['pl','PL Desk']];
  let h=bar2(true)+'<div class="seg deskseg" role="group" aria-label="Desk">'+tabs.map(x=>'<button class="'+(S.desk===x[0]?'on-good':'')+'" data-act="desk" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  const tot={items:0,done:0,dueNb:0,errors:0,late:0};
  vis.forEach(u=>{const s=stats(S.date,u.id);Object.keys(tot).forEach(k=>tot[k]+=s[k]||0)});
  h+='<div class="kpis"><div class="kpi g"><span>Done</span><b>'+tot.done+'/'+tot.items+'</b></div><div class="kpi w"><span>Notebooks due</span><b>'+tot.dueNb+'</b></div><div class="kpi '+(tot.late?'r':'')+'"><span>Not updated</span><b>'+tot.late+'</b></div><div class="kpi '+(tot.errors?'r':'')+'"><span>Errors</span><b>'+tot.errors+'</b></div></div>';
  const ps=people().filter(p=>p.units.some(x=>vis.some(v=>v.id===x))||p.role==='director');
  if(S.desk==='all'){
    ['P','S'].forEach(w=>{const us=vis.filter(u=>u.wing===w);if(us.length)h+=secHead(WING[w].name,dayShort(S.date))+'<div class="cgrid">'+us.map(classCard).join('')+'</div>'});
  }else if(S.desk==='cm'){
    const l=ps.filter(p=>p.role==='cm');
    h+=secHead('Class Managers','Tap a class to see that Class Manager’s plan')+(l.length?'<div class="pgrid">'+l.map(personCard).join('')+'</div>':'<div class="empty"><b>No Class Managers yet</b>Add names in Team & Setup.</div>');
  }else if(S.desk==='pm'){
    const l=ps.filter(p=>p.role==='cmh');
    h+=secHead('PM / CM Head desk','Each head sees their own classes and issues')+(l.length?'<div class="pgrid">'+l.map(p=>{const is=issuesFor(p.units.map(unitById).filter(Boolean));return personCard(p).replace(/<\/div>$/,(is.length?'<div class="note" style="margin:10px 0 4px">Issues today</div><ul class="dues">'+is.slice(0,6).map(i=>'<li><span>'+esc(i.t)+'</span><span class="pill '+i.c+'">'+i.k+'</span></li>').join('')+'</ul>'+(is.length>6?'<div class="note">+ '+(is.length-6)+' more</div>':''):'<div class="note" style="margin-top:8px">No issues today.</div>')+'</div>')}).join('')+'</div>':'<div class="empty"><b>No heads yet</b>Add names in Team & Setup.</div>');
  }else{
    const l=ps.filter(p=>p.role==='pl');
    h+=secHead('PL / Floor Managers','Each PL sees only their own classes')+(l.length?'<div class="pgrid">'+l.map(personCard).join('')+'</div>':'<div class="empty"><b>No PLs added</b>Add PLs with their classes in Team & Setup.</div>');
  }
  return h;
}

/* --- next day --- */
function carryItems(date,unit){
  return slotsOf(date,unit).filter(s=>isCM(s)&&(s.cm==='due'||((!s.cm||s.cm==='pending')&&(isLate(s,date)||(!s.from&&date<=todayStr())))));
}
async function addCarry(unit,date,only){
  const prev=addDays(date,-1),map={},have=slotsOf(date,unit).map(x=>x.id);
  carryItems(prev,unit).forEach((s,i)=>{
    const id='c_'+s.id;if(have.indexOf(id)>=0||(only&&only!==s.id))return;
    map[id]={order:50+i,kind:'check',title:[s.subject,s.lesson,s.material].filter(Boolean).join(' ')||s.title||'Checking',material:s.material||'',subject:s.subject||'',lesson:s.lesson||'',sections:s.sections||'',bundle:s.cm==='due'?num(s.due):num(s.bundle),by:s.by||'CM',carry:true,note:'Carried from '+dayShort(prev),cm:'pending',from:'',to:''};
  });
  if(Object.keys(map).length)await writeSlots(unit,date,map);
  return Object.keys(map).length;
}

/* --- setup --- */
function renderSetup(){
  const dir=isDirector()&&S.canWrite;
  let h='<div style="height:6px"></div>'+secHead('Team & Setup',dir?'Names show for everyone':'View only');
  h+='<div class="card"><h3>Who sees what</h3><ul class="dues"><li><span><b>Director / Admin</b> · Director, Principal, Sharda</span><span class="note">All classes, can edit everything</span></li><li><span><b>PM / CM Head</b></span><span class="note">Sees all, plans and reviews own classes</span></li><li><span><b>Class Manager</b></span><span class="note">Sees all, marks Checked / Due for own class</span></li><li><span><b>PL / Floor Manager</b></span><span class="note">Sees only the classes given below</span></li></ul><div class="note" style="margin-top:6px">This sorts the screens for each person. It is not a password lock.</div></div>';
  [['P','Primary 1–5'],['S','Secondary 6–11']].forEach(w=>{
    h+=secHead(w[1]+' · class team');
    h+='<div class="tgrid">'+UNITS.filter(u=>u.wing===w[0]).map(u=>{const r=roster(u.id);return '<div class="card tcard"><h3>'+esc(u.label)+'</h3><div class="field"><label for="cfg-cm-'+u.id+'">Class Manager</label><input id="cfg-cm-'+u.id+'" type="text" value="'+esc(r.cm)+'" placeholder="Name"'+(dir?'':' disabled')+'></div><div class="field"><label for="cfg-rv-'+u.id+'">'+WING[u.wing].mgr+(u.wing==='P'?' (PM)':' (CMH)')+'</label><input id="cfg-rv-'+u.id+'" type="text" value="'+esc(r.reviewer)+'" placeholder="Name"'+(dir?'':' disabled')+'></div></div>'}).join('')+'</div>';
  });
  const st=((S.staff&&S.staff.list)||DEFAULT_STAFF);
  h+=secHead('Directors and PLs','Type class numbers for a PL, for example 1 2 3');
  h+='<div class="card" id="stafflist">'+st.map((x,i)=>'<div class="srow2"><div class="field"><label for="st-n-'+i+'">Name</label><input id="st-n-'+i+'" type="text" value="'+esc(x.name)+'"'+(dir?'':' disabled')+'></div><div class="field"><label for="st-r-'+i+'">Role</label><select id="st-r-'+i+'"'+(dir?'':' disabled')+'><option value="director"'+(x.role==='director'?' selected':'')+'>Director / Admin</option><option value="pl"'+(x.role==='pl'?' selected':'')+'>PL / Floor Manager</option></select></div><div class="field"><label for="st-u-'+i+'">Classes (PL)</label><input id="st-u-'+i+'" type="text" value="'+esc(x.units||'')+'" placeholder="1 2 3"'+(dir?'':' disabled')+'></div></div>').join('')+(dir?'<div class="row"><button class="btn ghost small" data-act="staff-add">+ Add person</button></div>':'')+'</div>';
  if(dir)h+='<div class="row gap"><button class="btn gold" data-act="cfg-save">Save team</button></div>';
  const t=Object.assign({},FIS_THEME,S.theme||{});
  h+=secHead('Brand colours')+'<div class="card"><div class="note">Starts with the FIS logo colours. Changes show for everyone straight away.</div><div class="swatches">'
   +[['navy','Navy · header and headings'],['gold','Gold · accents and active tab'],['purple','Purple · card edge and labels'],['mag','Magenta · highlights']].map(c=>'<div class="field"><label for="th-'+c[0]+'">'+c[1]+'</label><input id="th-'+c[0]+'" type="color" data-theme="'+c[0]+'" value="'+esc(t[c[0]])+'"'+(dir?'':' disabled')+'></div>').join('')
   +'</div>'+(dir?'<div class="row"><button class="btn small" data-act="theme-save">Save colours</button><button class="btn ghost small" data-act="theme-reset">Reset to FIS colours</button></div>':'')+'</div>';
  return h;
}

/* ---------- role dialog ---------- */
function openRoleDialog(){
  const ov=document.getElementById('overlay'),ps=people();
  const grp=r=>{const l=ps.filter(p=>p.role===r);return l.length?'<div class="pgroup"><span>'+ROLE_LABEL[r]+'</span><div class="chips">'+l.map(p=>'<button type="button" class="cpc" data-pick="'+esc(p.name)+'" data-prole="'+p.role+'">'+esc(p.name)+(p.role==='cm'||p.role==='cmh'?'<small> · '+p.units.map(x=>x.replace(/^[PS]/,'')).join(',')+'</small>':'')+'</button>').join('')+'</div></div>':''};
  ov.innerHTML='<div class="modal"><div class="dlg" role="dialog" aria-labelledby="rt"><h2 id="rt">Who are you?</h2><div class="note">Pick your name. You will see your own plan first.</div>'+grp('director')+grp('cmh')+grp('cm')+grp('pl')+'<div class="pgroup"><span>Someone else</span><div class="row"><div class="field grow"><input id="rolename" type="text" placeholder="Your name (view only)"></div><button class="btn small" id="rolesave" type="button">Continue</button></div></div></div></div>';
}
function closeRoleDialog(){document.getElementById('overlay').innerHTML=''}
function setMe(name,role){
  S.name=name;S.roleHint=role;resolveMe();safeSet('fis-cd-me3',{name:name,role:role});closeRoleDialog();
  const mu=S.meUnits.filter(x=>unitById(x));
  if(S.me&&mu.length&&mu.indexOf(S.unit)<0)S.unit=mu[0];
  if(S.me&&S.me.role==='director'&&!mu.length)S.unit=S.unit||'P5';
  S.tab='board';S.date=todayStr();subscribeDays();render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pick]');
  if(pk){setMe(pk.getAttribute('data-pick'),pk.getAttribute('data-prole'));return}
  if(e.target.id==='rolesave'){const n=document.getElementById('rolename').value.trim();if(n)setMe(n,'');return}
  const el=e.target.closest('[data-act]');if(!el)return;
  act(el.dataset.act,el.dataset.id,el.dataset.v,el);
});
document.addEventListener('click',e=>{const t=e.target;if(t&&t.id==='datepick'&&t.showPicker){try{t.showPicker()}catch(x){}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest&&e.target.closest('tr[data-act]');if(tr)act(tr.dataset.act,null,tr.dataset.v,tr)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.d){const d=S.draft[t.dataset.d]||(S.draft[t.dataset.d]={});d[t.dataset.k]=t.value}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='datepick'&&t.value){S.date=t.value;S.loaded=false;subscribeDays();render();return}
  if(t.dataset&&t.dataset.photo){const f=t.files&&t.files[0];t.value='';handlePhoto(t.dataset.photo,f);return}
  if(t.dataset&&t.dataset.rm){const sl=slotsOf(S.date,S.unit).find(x=>x.id===t.dataset.rm);if(sl&&(sl.cmRemark||'')!==t.value.trim())patch(S.unit,S.date,t.dataset.rm,{cmRemark:t.value.trim(),cmBy:whoName()});return}
  if(t.dataset&&t.dataset.theme){S.theme=Object.assign({},S.theme,{[t.dataset.theme]:t.value});applyTheme();return}
  if(t.dataset&&t.dataset.d){const d=S.draft[t.dataset.d]||(S.draft[t.dataset.d]={});d[t.dataset.k]=t.value;if(t.dataset.rerender)render()}
});
function setDate(d){S.date=d;S.loaded=false;subscribeDays();render()}
function getSlot(id){return slotsOf(S.date,S.unit).find(s=>s.id===id)||{id:id}}
async function act(a,id,v,el){
  const me=whoName();
  switch(a){
  case 'tab':{S.tab=v;if(v==='next'&&S.date<=todayStr())setDate(addDays(todayStr(),1));else if(v==='board'&&S.date>todayStr())setDate(todayStr());else render();break}
  case 'unit':S.unit=v;render();break;
  case 'open-class':S.unit=v;S.tab='board';render();window.scrollTo(0,0);break;
  case 'desk':S.desk=v;render();break;
  case 'q-open':S.open.qa=true;render();break;
  case 'q-close':S.open.qa=false;render();break;
  case 'q-type':{const d=S.draft.q||(S.draft.q={type:'Notebook',name:'',subject:'',lesson:'',secs:[],from:'',to:'',split:'one'});d.type=v;render();break}
  case 'q-sec':{const d=S.draft.q;const i=d.secs.indexOf(v);if(i<0)d.secs.push(v);else d.secs.splice(i,1);render();break}
  case 'q-split':S.draft.q.split=v;render();break;
  case 'q-save':{
    const d=S.draft.q||{};
    if((d.from&&!d.to)||(!d.from&&d.to)){toast('Set both start and end time, or leave both empty.');break}
    if(d.from&&toMin(d.to)<=toMin(d.from)){toast('End time must be after the start time.');break}
    const duty=d.type==='Duty',map={},sub=(d.subject||'').trim(),les=(d.lesson||'').trim();
    const mk=(sec,from,to,i)=>({kind:duty?'duty':'check',title:(d.name||'').trim()||(duty?'Duty':[sub,les,d.type!=='Other'?d.type:''].filter(Boolean).join(' ')||'Checking'),material:duty?'':d.type,subject:duty?'':sub,lesson:duty?'':les,sections:duty?'':sec,bundle:0,by:'CM',cm:'pending',from:from,to:to,order:(Date.now()%100000)+i});
    const secs=d.secs.slice();
    if(!duty&&secs.length>1&&d.split==='each'){let cur=d.from?toMin(d.from):0;const dur=d.from?toMin(d.to)-toMin(d.from):0;secs.forEach((sec,i)=>{const f=d.from?hm(cur):'',e=d.from?hm(Math.min(1439,cur+dur)):'';map[uid()+i]=mk(sec,f,e,i);cur+=dur})}
    else map[uid()]=mk(secs.join(' '),d.from||'',d.to||'',0);
    S.draft.q={type:d.type,name:'',subject:'',lesson:'',secs:[],from:'',to:'',split:'one'};
    await writeSlots(S.unit,S.date,map);toast('Added to the plan');break}
  case 'carry-all':{const n=await addCarry(S.unit,S.date);toast(n?n+' dues added':'Already added');break}
  case 'carry-one':{await addCarry(S.unit,S.date,id);break}
  case 'staff-add':{S.staff={list:readStaff().concat([{name:'',role:'pl',units:''}])};render();break}
  case 'date-prev':setDate(addDays(S.date,-1));break;
  case 'date-next':setDate(addDays(S.date,1));break;
  case 'date-today':setDate(todayStr());break;
  case 'goto-next':S.tab='next';setDate(addDays(todayStr(),1));break;
  case 'role-open':openRoleDialog();break;
  case 'more':S.open[id]='more';render();break;
  case 'close':S.open[id]=null;render();break;
  case 'cm-checked':{const s=getSlot(id);S.open[id]=null;await patch(S.unit,S.date,id,{cm:'checked',done:num(s.bundle),due:0,cmBy:me,cmAt:Date.now()});break}
  case 'cm-due-open':{const s=getSlot(id);S.draft['d:'+id]={due:s.cm==='due'?num(s.due):(num(s.bundle)||''),remark:s.cmRemark||''};S.open[id]='due';render();break}
  case 'cm-due-save':{const d=S.draft['d:'+id]||{};const n=num(d.due);if(!n){toast('Enter how many notebooks are due.');break}S.open[id]=null;await patch(S.unit,S.date,id,{cm:'due',due:n,done:0,cmBy:me,cmAt:Date.now(),cmRemark:(d.remark||'').trim()});break}
  case 'cm-reset':{S.open[id]=null;delete S.draft['r:'+id];await patch(S.unit,S.date,id,{cm:'pending',due:0,done:0,rv:'pending',errors:0,notDone:0,rvRemark:'',rvImgs:[]});break}
  case 'rv-pick':{const k='r:'+id,d=S.draft[k]||(S.draft[k]={});d.mode=v;if(v==='ok'){d.errors=0;d.notDone=0}render();break}
  case 'rv-save':{
    const d=S.draft['r:'+id]||{};if(!d.mode){toast('Choose All good, Errors found or Not checked.');break}
    let rv='yes',errors=0,notDone=0,imgs=[];
    if(d.mode==='no'){rv='no';notDone=num(d.notDone);if(!notDone){toast('Enter how many were not checked.');break}}
    if(d.mode==='err'){errors=num(d.errors);if(!errors){toast('Enter how many errors were found.');break}imgs=d.imgs||[]}
    await patch(S.unit,S.date,id,{rv:rv,notDone:notDone,errors:errors,rvImgs:imgs,rvRemark:(d.remark||'').trim(),rvBy:me,rvAt:Date.now()});toast('Review saved');break}
  case 'img-open':S.lightbox=v;render();break;
  case 'img-close':S.lightbox=null;render();break;
  case 'img-del':{const d=S.draft['r:'+id];if(d&&d.imgs){d.imgs.splice(num(v)>=0?parseInt(v,10):0,1);render()}break}
  case 'dup-open':{S.draft['p:'+id]={secs:[],mode:'after'};S.open[id]='dup';render();break}
  case 'dup-toggle':{const d=S.draft['p:'+id]||(S.draft['p:'+id]={secs:[],mode:'after'});const i=d.secs.indexOf(v);if(i<0)d.secs.push(v);else d.secs.splice(i,1);render();break}
  case 'dup-save':{
    const d=S.draft['p:'+id];if(!d||!d.secs.length){toast('Choose at least one section.');break}
    const src=getSlot(id),map={},timed=!!(src.from&&src.to),dur=timed?toMin(src.to)-toMin(src.from):0;let cur=timed?toMin(src.to):0;
    d.secs.slice().sort().forEach((sec,i)=>{
      const b={kind:src.kind||'check',title:src.title||'',note:src.note||'',cm:'pending',by:src.by||'CM',material:src.material||'',subject:src.subject||'',lesson:src.lesson||'',sections:sec,bundle:0,after:src.after||'',order:(Date.now()%100000)+i,from:'',to:''};
      if(timed&&d.mode==='same'){b.from=src.from;b.to=src.to}
      else if(timed&&d.mode==='after'&&cur+dur<=1439){b.from=hm(cur);b.to=hm(cur+dur);cur+=dur}
      map[uid()+i]=b;
    });
    S.open[id]=null;delete S.draft['p:'+id];
    await writeSlots(S.unit,S.date,map);toast(d.secs.length+' cop'+(d.secs.length===1?'y':'ies')+' created');break}
  case 'alloc':{const d=S.draft['a:'+id]||{};if(!d.from||!d.to){toast('Set a start and end time.');break}if(toMin(d.to)<=toMin(d.from)){toast('End time must be after the start time.');break}const s=getSlot(id);if(s.after&&toMin(d.from)<toMin(s.after))toast('Note: this starts before written work ends at '+fmt(s.after)+'.');await patch(S.unit,S.date,id,{from:d.from,to:d.to});delete S.draft['a:'+id];break}
  case 'to-cm':await patch(S.unit,S.date,id,{by:'CM'});break;
  case 'edit-new':S.draft['e:new']=null;S.open['new']=true;render();break;
  case 'edit-open':delete S.draft['e:'+id];S.open[id]='edit';S.delConfirm=null;render();break;
  case 'edit-cancel':delete S.draft['e:'+id];S.open[id]=null;S.delConfirm=null;render();break;
  case 'edit-save':{
    const d=S.draft['e:'+id];if(!d){break}
    if(d.from&&d.to&&toMin(d.to)<=toMin(d.from)){toast('End time must be after the start time.');break}
    if((d.from&&!d.to)||(!d.from&&d.to)){toast('Set both start and end time, or leave both empty.');break}
    const isNew=id==='new',nid=isNew?uid():id,chk=d.kind==='check';
    const body={kind:d.kind,title:(d.title||'').trim()||(chk?(d.subject||'Checking'):'Duty'),from:d.from||'',to:d.to||'',note:(d.note||'').trim()};
    if(chk){Object.assign(body,{material:d.material,subject:(d.subject||'').trim(),lesson:(d.lesson||'').trim(),sections:(d.sections||'').trim(),bundle:num(d.bundle),by:d.by||'CM',after:d.after||''})}
    if(isNew)Object.assign(body,{order:Date.now()%100000,cm:'pending'});
    delete S.draft['e:'+id];S.open[id]=null;
    await patch(S.unit,S.date,nid,body);if(isNew)toast('Added');break}
  case 'del-ask':S.delConfirm=id;render();break;
  case 'del-yes':S.delConfirm=null;S.open[id]=null;await patch(S.unit,S.date,id,null);break;
  case 'template':{const map={};DAY_TEMPLATE.forEach((t,i)=>{map['t'+pad(i)+'_'+S.date.replace(/-/g,'')]=Object.assign({order:i,cm:'pending',by:'CM'},t)});await writeSlots(S.unit,S.date,map);break}
  case 'cfg-save':{const units={};UNITS.forEach(u=>{units[u.id]={cm:document.getElementById('cfg-cm-'+u.id).value.trim(),reviewer:document.getElementById('cfg-rv-'+u.id).value.trim()}});await writeCfg(units);await writeStaff(readStaff().filter(x=>x.name));toast('Team saved');break}
  case 'theme-save':{const t={};['navy','gold','purple','mag'].forEach(k=>{const i=document.getElementById('th-'+k);t[k]=i?i.value:FIS_THEME[k]});await writeTheme(t);toast('Colours saved');break}
  case 'theme-reset':{S.theme={};applyTheme();await writeTheme(Object.assign({},FIS_THEME));toast('FIS colours restored');break}
  }
}
setInterval(()=>{renderHeader();const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()},30000);
boot();
})();
