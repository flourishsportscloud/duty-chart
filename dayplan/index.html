<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIS Day Plan</title>
<meta name="theme-color" content="#1F2D5A">
<link rel="icon" href="../fis/fis-logo-192.png">
<link rel="apple-touch-icon" href="../fis/fis-logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2D5A;--navy2:#16214A;--navy3:#2B3C74;--gold:#E3A94F;--goldlt:#F4D9A6;--goldink:#8A5B12;--bg:#F5F3EE;--card:#fff;--ink:#1B2340;--mut:#646B80;--line:#E6E2D8;--green:#1F7A52;--greenbg:#E6F1EA;--red:#B83247;--redbg:#F8E6EA;--amber:#A8670A;--amberbg:#FBF1DC;--grey:#8A91A6;--head:'Lora',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
header{background:linear-gradient(135deg,var(--navy2),var(--navy) 60%,var(--navy3));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:3px solid var(--gold);box-shadow:0 4px 18px rgba(15,22,50,.28);position:sticky;top:0;z-index:30}
.h1{display:flex;align-items:center;gap:11px}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.logo img{width:36px;height:36px;object-fit:contain}
.ttl{flex:1;min-width:0}
.ttl h1{font-family:var(--head);font-size:19px;margin:0;font-weight:600;line-height:1.2}
.ttl small{display:block;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--goldlt)}
.who button{border:1px solid rgba(227,169,79,.5);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;background:rgba(227,169,79,.14);color:var(--goldlt)}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar .ar{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;width:38px;height:36px;font-size:18px;font-weight:700}
.datebar .ar:disabled{opacity:.3}
.datebar .dl{flex:1;text-align:center;font-family:var(--head);font-weight:600;font-size:15px;line-height:1.2}
.datebar .dl small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:2px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line);border-top:4px solid var(--navy);box-shadow:0 1px 2px rgba(20,25,60,.05),0 6px 20px rgba(20,25,60,.04)}
.card h3{font-family:var(--head);margin:0 0 9px;font-size:16px;font-weight:600;color:var(--navy)}
.muted{color:var(--mut)}
.notice{padding:10px 12px;border-radius:12px;background:var(--amberbg);color:#6B4A0E;border:1px solid #F0DDB3;font-size:12.5px;margin-bottom:12px;line-height:1.45}
.notice.info{background:#EAEEF8;color:#2A3A70;border-color:#CBD3EA}
.notice.good{background:var(--greenbg);color:#14553A;border-color:#A9D3BD}
.notice.bad{background:var(--redbg);color:#7C1F30;border-color:#E8B3BF}
/* bottom navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -6px 20px rgba(20,25,60,.08)}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--navy);background:#F3EFE3}
nav.tabs button[aria-selected=true] svg{color:var(--goldink)}
/* progress strip */
.strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pct{font-family:var(--head);font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.bar{height:10px;border-radius:99px;background:#ECE8DD;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#C98A2B,var(--gold));border-radius:99px;transition:width .4s}
.bar.g i{background:linear-gradient(90deg,#17604A,var(--green))}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#F3EFE3;color:var(--navy);letter-spacing:.02em}
.chip.g{background:var(--greenbg);color:var(--green)}.chip.r{background:var(--redbg);color:var(--red)}.chip.a{background:var(--amberbg);color:var(--amber)}.chip.n{background:#ECEEF4;color:var(--grey)}
/* class tiles */
.grp{margin:14px 2px 8px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:800;display:flex;align-items:center;gap:8px}
.grp:after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.tile{position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 8px 10px;text-align:center;color:var(--ink);box-shadow:0 1px 2px rgba(20,25,60,.05);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-top:4px solid #D3CCBA}
.tile b{font-family:var(--head);font-size:19px;font-weight:700;color:var(--navy);line-height:1.1}
.tile small{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--mut);line-height:1.3}
.tile.none{background:#FAF8F3;border-top-color:#D3CCBA}.tile.none b{color:#9AA0B3}
.tile.pend{border-top-color:var(--gold);background:#FFFBF1}.tile.pend small{color:var(--amber)}
.tile.over{border-top-color:var(--red);background:#FFF6F7}.tile.over small{color:var(--red)}
.tile.done{border-top-color:var(--green);background:#F3FAF6}.tile.done small{color:var(--green)}
.tile.mine:after{content:"MY CLASS";position:absolute;top:6px;right:6px;font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--goldink);background:var(--goldlt);border-radius:99px;padding:1px 6px}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:span 2}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .top{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:2}
.sheet .top button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.sheet .top h2{font-family:var(--head);font-size:18px;margin:0;font-weight:600;flex:1;line-height:1.2}
.sheet .top h2 small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:2px;font-weight:700}
.sheet .body{max-width:760px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 110px)}
.planimg{position:relative;margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(20,25,60,.05)}
.planimg img{display:block;width:100%;height:auto}
.planimg .ph{padding:60px 10px;text-align:center;color:var(--mut);font-size:12px}
.planimg .rm{position:absolute;top:8px;right:8px;border:0;background:rgba(184,50,71,.92);color:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700}
.planimg .zoom{position:absolute;bottom:8px;right:8px;border:0;background:rgba(22,33,74,.82);color:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);box-shadow:0 -6px 20px rgba(20,25,60,.1)}
.actbar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:14px;background:var(--navy);color:#fff;letter-spacing:.01em}
.btn.gold{background:var(--gold);color:var(--navy2)}
.btn.green{background:var(--green)}
.btn.sec{background:#E6E2D8;color:var(--ink)}
.btn.red{background:var(--red)}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn.big{flex:1;padding:15px;font-size:15px}
.btn:disabled{opacity:.45}
.ackbox{border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);background:#fff;display:flex;gap:10px;align-items:center}
.ackbox .ic{font-size:22px}
.ackbox b{display:block;font-family:var(--head);font-size:15px;color:var(--navy)}
.ackbox small{display:block;color:var(--mut);margin-top:2px;line-height:1.4}
.ackbox.ok{background:var(--greenbg);border-color:#A9D3BD}.ackbox.late{background:var(--amberbg);border-color:#F0DDB3}.ackbox.over{background:var(--redbg);border-color:#E8B3BF}
.zoomer{position:fixed;inset:0;z-index:90;background:rgba(10,14,30,.95);overflow:auto;-webkit-overflow-scrolling:touch}
.zoomer img{display:block;width:230%;max-width:none;margin:60px auto 40px}
.zoomer button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;border:0;background:var(--gold);color:var(--navy2);font-weight:800;border-radius:10px;padding:10px 14px;z-index:2}
/* forms */
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=time],input[type=date],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,169,79,.3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}.row>.grow{flex:1;min-width:120px}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 8px;position:sticky;top:0;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
tr:nth-child(even) td{background:#FBFAF7}
td.num,th.num{text-align:center}
.names{display:flex;flex-wrap:wrap;gap:5px}
.nm{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:#F3EFE3;color:var(--navy);border:0}
.nm.g{background:var(--greenbg);color:var(--green)}.nm.r{background:var(--redbg);color:var(--red)}.nm.a{background:var(--amberbg);color:var(--amber)}
button.nm{cursor:pointer}
/* free staff */
.slots{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slots button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:700;color:var(--navy);font-size:12.5px;text-align:center;line-height:1.25}
.slots button small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.slots button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.slots button[aria-pressed=true] small{color:var(--gold)}
.slots button.now{box-shadow:0 0 0 2px var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:12.5px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
/* timetable editor */
.ttg{display:grid;grid-template-columns:44px repeat(var(--n),1fr);gap:4px;font-size:11px;align-items:center}
.ttg .h{font-weight:800;color:var(--mut);text-align:center;font-size:10px}
.ttg .dn{font-weight:800;color:var(--navy)}
.ttg button{border:2px dashed #D3CCBA;background:#fff;border-radius:8px;height:32px;font-weight:800;color:#C4BEAE;font-size:12px}
.ttg button.on{background:var(--navy);border:2px solid var(--navy);color:var(--gold)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,22,50,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:4px solid var(--gold)}
.modal h3{font-family:var(--head);margin:0 0 6px;font-size:18px;color:var(--navy)}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
/* login */
.login{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 34px) 16px 30px}
.login .brand{text-align:center;color:#fff}
.lg-top{background:linear-gradient(160deg,var(--navy2),var(--navy) 70%,var(--navy3));border-bottom:4px solid var(--gold);padding-bottom:28px}
.lg-top .logo{width:64px;height:64px;margin:0 auto 10px;border-radius:16px}
.lg-top .logo img{width:52px;height:52px}
.lg-top h1{font-family:var(--head);font-size:26px;margin:0;font-weight:600}
.lg-top small{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:6px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:26px 10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--navy2);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--goldlt);color:var(--goldink)}
.sync{font-size:10.5px;color:var(--mut);text-align:center;margin:4px 0 12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ configuration ============ */
const API=(new URLSearchParams(location.search).get('api'))||"https://script.google.com/macros/s/AKfycbz7qhQnCURNiHwGBbix3mAdYHizLXn6PWnSmv2a_9lOqXRqs92dvP-XIozSlV3fwtVG/exec";   /* paste the Apps Script /exec URL between the last two quotes (see SETUP.md) */
const PREVIEW=!API;
const CLASS_LIST=[["N","Nursery","Pre-primary"],["LKG","LKG","Pre-primary"],["UKG","UKG","Pre-primary"],["1","Class 1","Primary"],["2","Class 2","Primary"],["3","Class 3","Primary"],["4","Class 4","Primary"],["5","Class 5","Primary"],["6","Class 6","Middle & Secondary"],["7","Class 7","Middle & Secondary"],["8","Class 8","Middle & Secondary"],["9","Class 9","Middle & Secondary"],["10","Class 10","Middle & Secondary"],["11","Class 11","Middle & Secondary"],["A15","Adjustments · Classes 1–5","Daily charts"],["A611","Adjustments · Classes 6–11","Daily charts"],["F15","Free Teachers · Classes 1–5","Daily charts"],["F611","Free Teachers · Classes 6–11","Daily charts"],["CO","Co-curricular Schedule","Daily charts"]];
const SHORT={N:"Nur",A15:"Adj 1–5",A611:"Adj 6–11",F15:"Free 1–5",F611:"Free 6–11",CO:"Co-curr."};
const CNAME={};CLASS_LIST.forEach(c=>CNAME[c[0]]=c[1]);
const REAL=id=>/^(N|LKG|UKG|\d+|CO)$/.test(id);   /* ids a teacher can be linked to */
const GROUPS={A:"Academic (Classes 1–11)",P:"Pre-primary",C:"Co-curricular",O:"Other"};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
/* class teachers and co-curricular staff already on the duty chart; the Director can add everyone else in Staff */
const SEED_CT=[["Sunita",["1"]],["Priyanshi",["1"]],["Kanika",["1"]],["Deepmala",["2"]],["Deepali",["2"]],["Chhavi",["2"]],["Tina",["3"]],["Vahnishwari",["3"]],["Saroj",["3"]],["Pooja",["4"]],["Priya Shekhawat",["4"]],["Gauri",["4"]],["Anuradha",["5"]],["Reema",["5"]],["Devanshi",["5"]],["Shailesh",["6"]],["Ishita",["6"]],["Monika",["6"]],["Swati",["7"]],["Yavnika",["7"]],["Jyotsana",["7"]],["Pallavi",["8"]],["Shreya",["8"]],["Ritika",["8"]],["Shaan",["9"]],["Dr. Nisha",["9"]],["Jatin",["10"]],["Radha",["10"]],["Jitesh",["11"]]];
const SEED_CO=["Manmohan","Kanhaiya","Ritanshu","Niviya","Raj","Sahil","Bhawishya","Akash","Kritika","Jitendra","Lohit","Neelam","Sakil","Mansi","Vaibhav","Bhavyadeep","Bhuwan","Yogesh","Sundar","Mukul","Shivika","Nahida","Kavita","Bhupendra","Ram","Archana"];

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=n=>String(n||"").trim().toLowerCase();
const p2=n=>(n<10?"0":"")+n;
const IST=330*60000;
function istParts(ms){const d=new Date(ms+IST);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes(),wd:d.getUTCDay()}}
function isoOfMs(ms){const t=istParts(ms);return t.y+"-"+p2(t.m)+"-"+p2(t.d)}
function addDays(iso,n){const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function wdOf(iso){return new Date(iso+"T00:00:00Z").getUTCDay()}  /* 0 Sun */
function fmtDate(iso){const d=new Date(iso+"T00:00:00Z");return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}
function fmtTime(ms){const t=istParts(ms);const h=t.h%12||12;return h+":"+p2(t.mi)+" "+(t.h<12?"AM":"PM")}
function fmtHHMM(s){const [h,m]=String(s).split(":").map(Number);return (h%12||12)+":"+p2(m)+" "+(h<12?"AM":"PM")}
function dueMs(date,t){return Date.parse(date+"T"+t+":00+05:30")}
function hourLbl(h){const a=h%12||12;return a}
function slotLabel(st,i){const a=st+i-1,b=a+1;return hourLbl(a)+"–"+hourLbl(b)}
function slotSub(st,i){const a=st+i-1;return (a<12?"AM":"PM")}
function uid(){return "p_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
let toastT;function toast(m,err){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.className="toast"+(err?" err":"");t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),err?4200:2200)}

/* ============ state ============ */
const S={tok:null,me:null,d:null,date:null,tab:"plans",slot:null,view:"slot",ver:0,skew:0,photos:{},busy:false,sheet:null,draft:null,modal:null,staffDraft:null,err:"",fresh:0,dash:{open:{}}};
try{S.tok=localStorage.getItem("dp_tok")||null}catch(e){}
function nowMs(){return Date.now()+S.skew}
function today(){return S.d?S.d.today:isoOfMs(nowMs())}

/* ============ server calls (live) and a built-in preview server ============ */
async function call(fn,args){
  if(PREVIEW)return mock(fn,args||[]);
  let r;try{r=await fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args||[],code:S.tok})})}catch(e){throw new Error("No connection. Check the internet and try again.")}
  let j;try{j=await r.json()}catch(e){throw new Error("The server did not answer properly. Try again.")}
  if(!j.ok){if(j.auth&&S.tok){logout(true);throw new Error("Please log in again.")}throw new Error(j.error||"Something went wrong.")}
  return j.data;
}
const MD={settings:{ackBy:"08:00",slotStart:7,slotCount:9,editors:[]},staff:{list:[]},plan:{},ack:{},leave:{},cover:{},ver:1,me:null};
function mdKey(d){return d}
async function mock(fn,a){
  await new Promise(r=>setTimeout(r,120));
  const T=isoOfMs(Date.now());
  const me=S.mockMe;
  const ed=me&&(me.role==="admin");

    case "clearPlan":need();if(MD.plan[a[0]])delete MD.plan[a[0]][a[1]];if(MD.ack[a[0]])delete MD.ack[a[0]][a[1]];MD.ver++;return true;

const ST=()=>S.d.settings;
const slotsN=()=>Number(ST().slotCount)||9, slotStart=()=>Number(ST().slotStart)||7;
function nowSlot(){const t=istParts(nowMs());const i=t.h-slotStart()+1;return i>=1&&i<=slotsN()?i:1}
function staffList(){return (S.d.staff&&S.d.staff.list)||[]}
function clsGroup(id){return id==="A15"||id==="F15"?["1","2","3","4","5"]:id==="A611"||id==="F611"?["6","7","8","9","10","11"]:[id]}
function expectedFor(cls){const g=clsGroup(cls);return staffList().filter(s=>(s.cls||[]).some(c=>g.includes(c)))}
function mineIs(cls){const me=key(S.me.name),g=clsGroup(cls);return staffList().some(s=>key(s.name)===me&&(s.cls||[]).some(c=>g.includes(c)))}
function ackOf(cls,name){const m=(S.d.ack||{})[cls]||{};const r=m[key(name)];const p=(S.d.plan||{})[cls];return r&&p&&r.rev===p.rev?r:null}
function status(cls){
  const p=(S.d.plan||{})[cls];if(!p)return {k:"none"};
  const a=ackOf(cls,S.me.name);if(a)return {k:"done",a};
  const due=dueMs(S.d.date,p.ackBy||ST().ackBy);
  const stale=((S.d.ack||{})[cls]||{})[key(S.me.name)];
  return {k:nowMs()>due?"over":"pend",due,updated:!!stale};
}
function counts(cls){
  const p=(S.d.plan||{})[cls];const exp=expectedFor(cls);if(!p)return {plan:false,exp:exp.length,done:0,late:0,pend:exp.map(s=>s.name),doneList:[]};
  const doneList=[],pend=[];
  exp.forEach(s=>{const a=ackOf(cls,s.name);if(a)doneList.push({name:s.name,a});else pend.push(s.name)});
  /* anyone outside the expected list who acknowledged is also shown */
  const m=(S.d.ack||{})[cls]||{};Object.keys(m).forEach(k=>{if(m[k].rev===p.rev&&!exp.some(s=>key(s.name)===k))doneList.push({name:m[k].n,a:m[k],extra:true})});
  return {plan:true,exp:exp.length,done:doneList.filter(x=>!x.extra).length,late:doneList.filter(x=>x.a.late).length,pend,doneList};
}
function onLeaveSet(){const o={};(S.d.leave||[]).forEach(n=>o[key(n)]=1);return o}
function freeNames(slotNo){
  const wd=wdOf(S.d.date);const dayN=wd;if(dayN<1||dayN>6)return null;
  const leave=onLeaveSet(),cov=((S.d.cover||{})[slotNo]||[]).map(x=>key(x.name));
  const res={free:[],covered:[],busy:0,noTT:[],leave:[]};
  staffList().filter(s=>s.grp==="A").forEach(s=>{
    if(leave[key(s.name)]){res.leave.push(s.name);return}
    if(!s.tt){res.noTT.push(s.name);return}
    if((s.tt[dayN]||[]).includes(slotNo)){res.busy++;return}
    if(cov.includes(key(s.name)))res.covered.push(s.name);else res.free.push(s.name);
  });
  return res;
}

function dashHtml(){

/* ============ actions ============ */
async function act(a,v,el){
  const ed=S.me&&S.me.editor;
  switch(a){
    case "login":return doLogin();
    case "retry":return refresh(true);
    case "logout":return logout();
    case "tab":S.tab=v;S.sheet=null;return render();
    case "day":{S.date=addDays(S.date,Number(v));S.ver=0;await refresh(false);return}
    case "open":return openClass(v);
    case "close":S.sheet=null;S.draft=null;S.sheetEditing=false;return render();
    case "zoom":{const u=S.photos[v];if(!u)return;const z=document.createElement("div");z.className="zoomer";z.innerHTML='<button>Close</button><img src="'+u+'" alt="Plan, enlarged">';z.onclick=()=>z.remove();document.body.appendChild(z);return}
    case "ack":{S.busy=true;softSheet();try{const r=await call("ack",[S.date,S.sheet]);toast("Acknowledged at "+fmtTime(r.t));S.busy=false;await refresh(false);S.sheet=null}catch(e){S.busy=false;toast(e.message,true)}render();return}
    case "slot":S.slot=Number(v);return render();
    case "fview":S.view=v;return render();
    case "copyfree":{const r=freeNames(Number(v));const t="Free "+slotLabel(slotStart(),Number(v))+" ("+fmtDate(S.date)+"): "+(r.free.join(", ")||"none");copyText(t);return}
    case "copypend":{const rows=CLASS_LIST.map(c=>({n:c[1],cn:counts(c[0]),p:S.d.plan[c[0]]})).filter(r=>r.p&&r.cn.pend.length);copyText("Day Plan — pending acknowledgements, "+fmtDate(S.date)+"\n"+rows.map(r=>r.n+": "+r.cn.pend.join(", ")).join("\n"));return}
    /* plan editing */
    case "pick":{$("#file").click();return}
    case "rmimg":S.draft.imgs.splice(Number(v),1);S.draft.dirty=true;return softSheet();
    case "saveplan":{
      S.draft.note=($("#dnote")||{}).value||"";S.draft.ackBy=($("#dby")||{}).value||ST().ackBy;
      if(!S.draft.imgs.length){toast("Add at least one photograph first.",true);return}
      S.busy=true;softSheet();
      try{await call("savePlan",[S.date,S.sheet,{imgs:S.draft.imgs,note:S.draft.note,ackBy:S.draft.ackBy}]);toast("Plan shared");S.busy=false;S.sheetEditing=false;S.sheet=null;S.draft=null;await refresh(false)}catch(e){S.busy=false;toast(e.message,true);render()}
      return}
    case "clearplan":{if(!confirm("Remove this plan and its acknowledgements?"))return;try{await call("clearPlan",[S.date,S.sheet]);toast("Plan removed");S.sheet=null;S.draft=null;S.sheetEditing=false;await refresh(false)}catch(e){toast(e.message,true)}return}
    /* free staff cover */
    case "cover":{const [sl,nm]=v.split("|");const c=((S.d.cover||{})[sl]||[]).find(x=>key(x.name)===key(nm));S.modal={k:"cover",slot:Number(sl),name:nm,c:c||null};return render()}
    case "docover":case "uncover":{const m=S.modal,cv=JSON.parse(JSON.stringify(S.d.cover||{}));const arr=(cv[m.slot]||[]).filter(x=>key(x.name)!==key(m.name));if(a==="docover")arr.push({name:m.name,note:($("#cn")||{}).value||""});if(arr.length)cv[m.slot]=arr;else delete cv[m.slot];
      try{await call("saveCover",[S.date,cv]);S.modal=null;await refresh(false);toast(a==="docover"?"Marked as covered":"Cover removed")}catch(e){toast(e.message,true)}return}
    /* staff */
    case "mclose":S.modal=null;S.staffDraft=null;return render();
    case "addstaff":S.staffDraft={name:"",grp:"A",cls:[],tt:null};S.modal={k:"staff",i:-1};return render();
    case "editstaff":{const s=staffList()[Number(v)];S.staffDraft=JSON.parse(JSON.stringify(s));S.modal={k:"staff",i:Number(v)};return render()}
    case "scls":{syncStaffDraft();const c=S.staffDraft.cls,i=c.indexOf(v);if(i>=0)c.splice(i,1);else c.push(v);return render()}
    case "tt":{syncStaffDraft();const [d,i]=v.split("|").map(Number);const s=S.staffDraft;if(!s.tt){s.tt={};for(let x=1;x<=6;x++)s.tt[x]=[]}const arr=s.tt[d]||(s.tt[d]=[]);const k=arr.indexOf(i);if(k>=0)arr.splice(k,1);else arr.push(i);return render()}
    case "ttclear":syncStaffDraft();S.staffDraft.tt=null;return render();
    case "ttempty":{syncStaffDraft();const t={};for(let x=1;x<=6;x++)t[x]=[];S.staffDraft.tt=t;return render()}
    case "savestaff":{syncStaffDraft();const s=S.staffDraft;if(!s.name.trim()){toast("Type the name.",true);return}
      const list=JSON.parse(JSON.stringify(staffList()));const i=S.modal.i;if(i>=0)list[i]=s;else if(list.some(x=>key(x.name)===key(s.name))){toast("This name is already in the list.",true);return}else list.push(s);
      return saveStaffList(list)}
    case "delstaff":{if(!confirm("Remove this person from the list?"))return;const list=JSON.parse(JSON.stringify(staffList()));list.splice(S.modal.i,1);return saveStaffList(list)}
    case "seedstaff":{const list=SEED_CT.map(([n,c])=>({name:n,grp:"A",cls:c,tt:null})).concat(SEED_CO.map(n=>({name:n,grp:"C",cls:["CO"],tt:null})));return saveStaffList(list)}
    case "bulk":S.modal={k:"bulk"};return render();
    case "dobulk":return doBulk();
    case "settings":S.modal={k:"settings"};return render();
    case "savesettings":{const o={ackBy:$("#sab").value||ST().ackBy,slotStart:Number($("#sss").value),slotCount:Number($("#ssc").value)};if(S.me.admin&&$("#sed"))o.editors=$("#sed").value.split("\n").map(x=>x.trim()).filter(Boolean);try{await call("saveSettings",[o]);S.modal=null;await refresh(false);toast("Settings saved")}catch(e){toast(e.message,true)}return}
    case "leave":{const s=staffList()[Number(v)];const set=(S.d.leave||[]).filter(n=>key(n)!==key(s.name));if(!onLeaveSet()[key(s.name)])set.push(s.name);try{await call("saveLeave",[S.date,set]);await refresh(false)}catch(e){toast(e.message,true)}return}
  }
}
function syncStaffDraft(){const s=S.staffDraft;if(!s)return;const n=$("#sn"),g=$("#sg");if(n)s.name=n.value;if(g)s.grp=g.value}
async function saveStaffList(list){S.busy=true;try{await call("saveStaff",[list]);S.modal=null;S.staffDraft=null;S.busy=false;await refresh(false);toast("Staff list saved")}catch(e){S.busy=false;toast(e.message,true);render()}}
function doBulk(){
  const txt=($("#bulkt")||{}).value||"";const list=JSON.parse(JSON.stringify(staffList()));let added=0,upd=0;
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;const c=line.includes("\t")?line.split("\t"):line.split(",");
    const name=(c[0]||"").trim();if(!name)return;
    const g=((c[1]||"A").trim().toUpperCase()[0]);const grp=["A","P","C","O"].includes(g)?g:"A";
    const cls=(c[2]||"").split(/[\s;/]+/).map(x=>x.trim().toUpperCase()).filter(x=>CNAME[x]);
    let tt=null;if(c.length>3){tt={};for(let d=1;d<=6;d++)tt[d]=(c[2+d]||"").split(/[\s;/]+/).map(Number).filter(n=>n>=1&&n<=slotsN())}
    const s={name,grp,cls,tt},i=list.findIndex(x=>key(x.name)===key(name));
    if(i>=0){list[i]=Object.assign(list[i],{grp,cls:cls.length?cls:list[i].cls,tt:tt||list[i].tt});upd++}else{list.push(s);added++}
  });
  if(!added&&!upd){toast("Nothing to add — check the format.",true);return}
  saveStaffList(list).then(()=>toast(added+" added, "+upd+" updated"));
}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Could not copy",true));else toast("Copy is not available here",true)}

/* photographs: shrink on the phone, then send */
function encode(src,w,h){
  /* shrink so the text stays sharp: width up to 1400px, height up to 3400px, quality lowered until it fits */
  let sc=Math.min(1,1400/w,3400/h),q=.74,out="";
  for(let t=0;t<7;t++){const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<=900000)break;sc*=.86;q=Math.max(.55,q-.05)}
  if(out.length>1000000)throw new Error("This page is too large. Try a smaller file.");return out;
}
function imgPage(file){
  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{try{res([encode(img,img.width,img.height)])}catch(e){rej(e)}URL.revokeObjectURL(u)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("This file is not a photograph."))};img.src=u});
}
let pdfLib=null;
function loadPdfJs(){
  if(pdfLib)return pdfLib;
  pdfLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)};s.onerror=()=>{pdfLib=null;rej(new Error("The PDF reader could not load. Check the internet, or upload a photograph instead."))};document.head.appendChild(s)});
  return pdfLib;
}
async function pdfPages(file){
  const lib=await loadPdfJs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let n=1;n<=Math.min(doc.numPages,8);n++){const pg=await doc.getPage(n),v0=pg.getViewport({scale:1}),k=Math.min(3,1400/v0.width*1.6),v=pg.getViewport({scale:k});
    const c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);await pg.render({canvasContext:c.getContext("2d"),viewport:v}).promise;out.push(encode(c,c.width,c.height))}
  return out;
}
const toPages=f=>(f.type==="application/pdf"||/\.pdf$/i.test(f.name))?pdfPages(f):imgPage(f);
async function addFiles(files){
  if(!S.draft)return;const room=8-S.draft.imgs.length;if(room<=0){toast("A plan can have up to 8 pages.",true);return}
  S.busy=true;S.sheetEditing=true;S.draft.note=($("#dnote")||{}).value||"";S.draft.ackBy=($("#dby")||{}).value||S.draft.ackBy;softSheet();
  try{for(const f of Array.from(files)){const pages=await toPages(f);for(const url of pages){if(S.draft.imgs.length>=8){toast("Only the first 8 pages were added.",true);break}const id=uid();await call("putPhoto",[id,url]);S.photos[id]=url;S.draft.imgs.push(id);S.draft.dirty=true}}}
  catch(e){toast(e.message,true)}
  S.busy=false;softSheet();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;if(!S.tok&&!PREVIEW&&b.dataset.act!=="login")return;act(b.dataset.act,b.dataset.v,b)});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="file"){addFiles(e.target.files);e.target.value=""}});
document.addEventListener("input",e=>{if(S.sheet&&S.draft&&(e.target.id==="dnote"||e.target.id==="dby")){S.sheetEditing=true;S.draft.note=($("#dnote")||{}).value;S.draft.ackBy=($("#dby")||{}).value}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="ln"||e.target.id==="lp"))doLogin()});

/* ============ start ============ */
if(PREVIEW)seedPreview();
if(S.tok||PREVIEW&&false)refresh(true);else render();
</script>
