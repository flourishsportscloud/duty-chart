<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FIS Teacher Preparation and Checking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}
#gate{position:fixed;inset:0;z-index:50;background:var(--band);display:grid;place-items:center;padding:20px}
#gate form{background:var(--surface);border-radius:16px;padding:22px;max-width:380px;width:100%;display:grid;gap:12px}
#gate h2{font-family:var(--f-head);color:var(--ink);margin:0;font-size:20px}
#gate input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;max-width:90vw}
#toast.err{background:var(--late-ink);color:#fff}
.me{all:unset;cursor:pointer;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;background:var(--gold);color:var(--gold-ink)}

/* Layout: navy band (grade group + segment), subject chips, staff tabs, date-ordered cards. Words, not counts. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#DFE4EE; --ink:#13294B; --text:#1D2433; --muted:#5E6878;
  --band:#13294B; --band-ink:#FFFFFF; --band-muted:#B9C4D9; --gold:#E8A93A; --gold-ink:#3A2600;
  --done-bg:#DDF3EA; --done-ink:#0E6B49; --prog-bg:#FBEFD2; --prog-ink:#7A5200; --pend-ink:#B3401A; --pend-line:#E3A48C;
  --na-bg:#ECEEF2; --na-ink:#667080; --late-bg:#FCE4DC; --late-ink:#A3300F; --today:#2F6FE4;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-head:"Space Grotesk","Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1C2433; --line:#2B3548; --ink:#DCE5F7; --text:#E6EBF5; --muted:#A1ABBE;
  --band:#0B1A33; --band-ink:#FFFFFF; --band-muted:#9FB0CE; --gold:#E8A93A; --gold-ink:#2A1B00;
  --done-bg:#163A2D; --done-ink:#7FDDB4; --prog-bg:#3A2F14; --prog-ink:#F2C766; --pend-ink:#FF9C78; --pend-line:#7A3F2B;
  --na-bg:#232B3A; --na-ink:#97A0B1; --late-bg:#3D1E16; --late-ink:#FF9C78; --today:#7EA8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#1C2433; --line:#2B3548; --ink:#DCE5F7; --text:#E6EBF5; --muted:#A1ABBE;
  --band:#0B1A33; --band-ink:#FFFFFF; --band-muted:#9FB0CE; --gold:#E8A93A; --gold-ink:#2A1B00;
  --done-bg:#163A2D; --done-ink:#7FDDB4; --prog-bg:#3A2F14; --prog-ink:#F2C766; --pend-ink:#FF9C78; --pend-line:#7A3F2B;
  --na-bg:#232B3A; --na-ink:#97A0B1; --late-bg:#3D1E16; --late-ink:#FF9C78; --today:#7EA8FF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink)}
header .wrap{padding-block:16px;display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.school{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
h1{font-family:var(--f-head);font-size:24px;line-height:1.1;margin:2px 0 0}
.pill{display:inline-flex;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600}
.pill.sample{background:var(--gold);color:var(--gold-ink)}
.pill.today{background:rgba(255,255,255,.12);color:#fff;font-family:var(--f-mono)}
.sw{display:grid;gap:6px;background:rgba(255,255,255,.08);border-radius:14px;padding:4px}
.sw.two{grid-template-columns:1fr 1fr}.sw.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.sw button{all:unset;cursor:pointer;text-align:center;border-radius:10px;padding:9px 8px;color:#fff;font-family:var(--f-head);font-weight:600;font-size:15px}
.sw button small{display:block;font:500 11.5px var(--f-body);color:var(--band-muted)}
.sw button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.sw button[aria-pressed="true"] small{color:var(--gold-ink);opacity:.8}
.sw.lite button[aria-pressed="true"]{background:#fff;color:var(--band)}
.sw.lite button[aria-pressed="true"] small{color:var(--band)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--today);outline-offset:2px}
main .wrap{padding-block:16px 40px}
.stack{display:grid;gap:14px;min-width:0}.stack>*{min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.sm{padding:6px 12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pend-ink);flex:0 0 auto}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;flex:1 0 auto;display:flex;gap:7px;align-items:center;justify-content:center;padding:12px 16px 10px;border-bottom:3px solid transparent;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;font-family:var(--f-head)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.toolr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lt{font-family:var(--f-head);font-size:18px;color:var(--ink);margin:0}
.lt small{display:block;font:500 12.5px var(--f-body);color:var(--muted)}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mini button{all:unset;cursor:pointer;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.sumline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sumline div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
.sumline .o b{color:var(--late-ink)}
.wk{font-family:var(--f-head);font-weight:600;color:var(--ink);font-size:15px;margin:8px 0 -4px;display:flex;gap:10px;align-items:center}
.wk::after{content:"";flex:1;height:1px;background:var(--line)}
.todayline{display:flex;align-items:center;gap:10px;color:var(--today);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.todayline::before,.todayline::after{content:"";flex:1;height:2px;background:var(--today);opacity:.5}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.card.past{opacity:.8}
.head{display:flex;gap:12px;align-items:flex-start}
.date{flex:0 0 auto;width:56px;text-align:center;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);padding:6px 0;font-family:var(--f-mono)}
.date b{display:block;font-size:20px;color:var(--ink);line-height:1.1}
.date span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.what{min-width:0;flex:1;display:grid;gap:3px}
.t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cls{background:var(--band);color:#fff;border-radius:7px;padding:2px 8px;font-family:var(--f-mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.subj{font-weight:700;color:var(--ink)}
.les{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.who{font-size:12.5px;color:var(--muted)}
.tag{font-size:12.5px;font-weight:600;border-radius:8px;padding:3px 9px;justify-self:start;white-space:nowrap}
.tag.late{background:var(--late-bg);color:var(--late-ink)}
.tag.soon{background:var(--prog-bg);color:var(--prog-ink)}
.tag.ok{background:var(--done-bg);color:var(--done-ink)}
.tag.wait{background:var(--na-bg);color:var(--na-ink)}
.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.st{all:unset;cursor:pointer;border-radius:10px;padding:8px 10px;display:grid;gap:1px;border:1px solid transparent;min-height:40px}
.st b{font-size:13px}.st i{font-style:normal;font-size:11.5px;opacity:.9}
.st.P{background:var(--surface);border-color:var(--pend-line);color:var(--pend-ink)}
.st.I{background:var(--prog-bg);color:var(--prog-ink)}
.st.D{background:var(--done-bg);color:var(--done-ink)}
.st.N,.st.W{background:var(--na-bg);color:var(--na-ink)}
.st.W{cursor:default}
.st.L{background:var(--late-bg);color:var(--late-ink)}
.st.sel{box-shadow:0 0 0 2px var(--ink)}
.pick{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.pick b{color:var(--ink);font-size:13.5px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.opts .st{text-align:center;font-weight:700;font-size:13.5px}
.secs{display:grid;gap:6px}
.secrow{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.sn{display:grid;gap:4px;min-width:0}.sn b{font-size:14px;color:var(--ink)}
.pbar{height:5px;border-radius:3px;background:var(--na-bg);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--done-ink);border-radius:3px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.panel h2{font-family:var(--f-head);font-size:16.5px;color:var(--ink);margin:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.form select,.form input{font:inherit;font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);min-width:0;width:100%}
.btn{all:unset;cursor:pointer;text-align:center;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13.5px;background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--late-bg);color:var(--late-ink)}
.btn.xs{padding:4px 10px;font-size:12px}
.editbox{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.sec summary{cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--ink);list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"▸";color:var(--muted);font-size:13px}
details.sec[open] summary::before{content:"▾"}
details.sec summary span.nm{flex:1}
.lines{display:grid;gap:6px;padding-bottom:12px}
.line{all:unset;cursor:pointer;display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.line.late{background:var(--late-bg);border-color:var(--pend-line)}
.line.soon{background:var(--prog-bg);border-color:transparent}
.ld b{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--ink)}
.ld small{font-size:11.5px;color:var(--muted);font-weight:600}
.line.late .ld small{color:var(--late-ink)}
.lw{display:grid;gap:2px;min-width:0}
.lw b{font-size:13.5px;color:var(--ink)}
.lw small{font-size:12px;color:var(--muted)}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:6px}
.kind.prep{background:var(--band);color:#fff}.kind.check{background:var(--gold);color:var(--gold-ink)}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.rules summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.rules li{margin:6px 0;font-size:13.5px}
@media (max-width:640px){
  .sw button small{display:none}
  .els{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tab{padding:11px 13px 9px;font-size:14.5px}
  .line{grid-template-columns:92px minmax(0,1fr)}
  .sumline{grid-template-columns:1fr 1fr}
}
</style>
</head><body>

<header class="band">
  <div class="wrap">
    <div class="top">
      <div><div class="school">Flourish International School</div><h1>Teacher Preparation and Checking</h1></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="me" id="meBtn">Enter your name</button><span class="pill today" id="todayPill"></span></div>
    </div>
    <div class="sw two lite" role="group" aria-label="Grade group">
      <button type="button" id="wing-mid" aria-pressed="true">Middle grades<small>Classes 6 to 8</small></button>
      <button type="button" id="wing-sen" aria-pressed="false">Senior grades<small>Classes 9 to 11</small></button>
    </div>
    <div class="sw three" role="group" aria-label="Section">
      <button type="button" id="seg-prep" aria-pressed="true">Preparation<small>Before the lesson starts</small></button>
      <button type="button" id="seg-check" aria-pressed="false">Checking<small>Notebook, assignment, test</small></button>
      <button type="button" id="seg-dash" aria-pressed="false">Dashboard<small>Pending work</small></button>
    </div>
  </div>
</header>

<div id="gate" hidden><form id="gateF"><h2>Your name</h2><p class="note">Type your full name once. It is saved with every update you make.</p><input id="gateN" type="text" autocomplete="name" placeholder="Full name" required minlength="3" maxlength="60"><p class="note" id="gateE" style="color:var(--late-ink)"></p><button class="btn" type="submit">Continue</button></form></div>
<div id="toast" hidden role="status"></div>
<main><div class="wrap">
  <div id="listView" class="stack">
    <div class="chips" id="subjects" aria-label="Subject"></div>
    <div class="tabs" id="teachers" role="tablist" aria-label="Staff"></div>
    <div class="tools">
      <h2 class="lt" id="listTitle"></h2>
      <div class="toolr"><div class="mini" id="grades" role="group" aria-label="Class"></div>
        <button type="button" class="chip sm" id="leftOnly" aria-pressed="false">Pending only</button>
        <button type="button" class="chip sm" id="manage" aria-pressed="false">Edit list</button></div>
    </div>
    <div id="managePanel" class="panel" hidden></div>
    <div class="sumline" id="sum"></div>
    <div class="list" id="list"></div>
    <p class="note" id="hint"></p>
    <details class="rules"><summary>How dates and status are worked out</summary><ol id="rules"></ol></details>
  </div>
  <div id="dashView" class="stack" hidden></div>
</div></main>

function dateBox(s){const d=pd(s);return el('div',{class:'date'},el('span',{text:WD[d.getDay()]}),el('b',{text:String(d.getDate())}),el('span',{text:MO[d.getMonth()]}))}
function statusTag(r,st){
  if(st.notIn) return el('span',{class:'tag wait',text:'To be received on '+nice(r.d)});
  if(!st.left) return el('span',{class:'tag ok',text:r.kind==='prep'?'Preparation completed':'Checking completed'});
  const nd=st.next||r.due,n=daysTo(nd);
  if(st.late) return el('span',{class:'tag late',text:'Overdue · was due on '+nice(nd)});
  return el('span',{class:'tag '+(n<=2?'soon':'wait'),text:'Pending · due '+(n===0?'today':'on '+nice(nd))});
}
function head(r,label,tag,extra){

    el('div',{class:'t1'},tag,extra)));

function overviewCard(g,all){

  const tabs=el('div',{class:'tabs',role:'tablist','aria-label':'Arrange by',style:'position:static'});
  [['deadline','By deadline'],['dept','By department'],['class','By class']].forEach(([v,l])=>tabs.append(el('button',{type:'button',class:'tab',role:'tab','aria-selected':String(dashView===v),onclick:()=>{dashView=v;render()}},l)));
  box.append(tabs);
  const line=o=>el('button',{type:'button',class:'line'+(o.n<0?' late':o.n<=1?' soon':''),onclick:()=>go({seg:o.r.kind,subj:o.r.g,teacher:o.r.t})},
    el('span',{class:'ld'},el('b',{text:nice(o.nd)}),el('small',{text:o.n<0?'Overdue':o.n===0?'Due today':o.n===1?'Due next working day':'Upcoming'})),
    el('span',{class:'lw'},el('b',{},el('span',{class:'kind '+o.r.kind,text:o.r.kind==='prep'?'Preparation':'Checking'}),o.r.cs+' · '+o.r.s+' '+o.r.l),el('small',{text:o.r.t+' · Pending: '+o.what.join(', ')})));
  const section=(name,list,open)=>{ const late=list.some(o=>o.n<0);
    const d=el('details',{class:'sec',open:open?'':null},el('summary',{},el('span',{class:'nm',text:name}),
      !list.length?el('span',{class:'tag ok',text:'Nothing pending'}):late?el('span',{class:'tag late',text:'Overdue work'}):el('span',{class:'tag soon',text:'Work due soon'})));
