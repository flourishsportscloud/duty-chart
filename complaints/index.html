<!DOCTYPE html>
<html lang="en">
<head><script src="../fis/shell.js?v=3"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transport Helpdesk · FIS</title>
<link rel="icon" href="../fis/fis-logo-192.png">
<link rel="apple-touch-icon" href="../fis/fis-logo-180.png">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2D5A;--navy2:#16214A;--gold:#E3A94F;--goldInk:#8A5B12;--goldSoft:#FBF1DC;
  --bg:#F5F3EE;--card:#fff;--ink:#1B2340;--mute:#646B80;--line:#E6E2D8;--cream:#F3F0E8;--cream2:#F8F6F1;
  --red:#A42A47;--redbg:#F8E6EA;--amb:#8A5B12;--ambbg:#FBF1DC;--grn:#1F6B47;--grnbg:#E6F1EA;--blu:#1B5E8A;--blubg:#E3EFF7;
  --pur:#5F3585;--purbg:#EFE7F5;--gry:#8A90A2;--grybg:#EEF0F4;
  --head:'Lora',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:12px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold);box-shadow:0 4px 18px rgba(15,22,50,.28)}
.hrow{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo img{width:40px;height:40px;object-fit:contain}
h1{font-family:var(--head);font-size:19px;margin:0;font-weight:600;flex:1;min-width:0;line-height:1.2}
h1 small{display:block;font-family:Inter,sans-serif;color:var(--gold);font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2px}
.sync{flex:none;background:rgba(227,169,79,.18);color:#F4D9A6;border:1px solid rgba(227,169,79,.4);font-weight:600;letter-spacing:.03em;font-size:11px;padding:5px 10px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;font-family:var(--head);font-weight:600;font-size:14px;color:#DCE1F0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 13px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:var(--navy2);border-color:var(--gold)}
nav button b{font-family:Inter,sans-serif;display:inline-block;min-width:19px;height:19px;line-height:19px;border-radius:10px;background:#C2385B;color:#fff;font-size:11px;margin-left:6px;text-align:center;padding:0 5px}
main{padding:14px max(14px,env(safe-area-inset-right)) 60px max(14px,env(safe-area-inset-left));max-width:1120px;margin:0 auto}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);border-top:4px solid var(--navy);box-shadow:0 1px 2px rgba(20,25,60,.05),0 6px 20px rgba(20,25,60,.04);padding:16px;margin-bottom:14px}
.card.gold{border-top-color:var(--gold)}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sh span{font-family:var(--head);font-weight:600;font-size:19px;color:var(--navy)}
.sh small{color:var(--mute);font-size:12.5px}
.sh .r{margin-left:auto}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
/* period control */
.period{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.period::-webkit-scrollbar{display:none}
.period button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer;white-space:nowrap}
.period button.on{background:var(--navy);color:#fff}
.prange{font-size:12px;color:var(--mute);margin:-4px 2px 12px}
.dates{display:flex;gap:8px;margin:0 0 12px}.dates input{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,169,79,.3)}
input[type=search]{flex:1;min-width:180px}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{font-weight:600;border:0;border-radius:11px;padding:10px 15px;cursor:pointer;background:var(--navy);color:#fff;white-space:nowrap}
.btn.gold{background:var(--gold);color:var(--navy2)}
.btn.ghost{background:var(--cream);color:var(--navy);border:1px solid var(--line)}
.btn.red{background:var(--red)}.btn.grn{background:var(--grn)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button b{margin-left:6px;font-variant-numeric:tabular-nums;color:var(--mute)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}.seg button.on b{color:var(--gold)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi.red{border-top-color:var(--red)}.kpi.navy{border-top-color:var(--navy)}.kpi.grn{border-top-color:var(--grn)}.kpi.pur{border-top-color:var(--pur)}
.kpi span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi b{display:block;font-family:var(--head);font-size:30px;font-weight:700;color:var(--navy2);line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.red b{color:var(--red)}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.kpi small em{font-style:normal;font-weight:700;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:820px){.two{grid-template-columns:1fr}}
.two>.card{margin-bottom:0}.two{margin-bottom:14px}
/* ranked list */
.rk{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.rk:last-child{border-bottom:0}.rk:hover{background:var(--cream2)}
.rk .no{width:26px;height:26px;border-radius:8px;background:var(--cream);color:var(--navy);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.rk .nm{flex:1;min-width:0}.rk .nm div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .nm span{font-size:12px;color:var(--mute)}
.rk .ct{font-family:var(--head);font-weight:700;font-size:20px;color:var(--navy2);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.rk .bars{width:70px;height:6px;border-radius:3px;background:var(--cream);overflow:hidden;flex:none}.rk .bars i{display:block;height:100%;background:var(--red)}
/* case rows */
.case{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;align-items:flex-start}
.case:last-child{border-bottom:0}.case:hover{background:var(--cream2)}
.dt{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--cream);padding:5px 0;border:1px solid var(--line)}
.dt b{display:block;font-family:var(--head);font-size:19px;color:var(--navy2);line-height:1.1}
.dt span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.case .bd{flex:1;min-width:0}
.case .t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.case .t1 strong{font-size:15.5px;font-weight:700}
.case .t1 em{font-style:normal;color:var(--mute);font-size:13px}
.case .t2{font-size:12.5px;color:var(--mute);margin-top:3px}
.case .t3{font-size:13.5px;margin-top:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.case .t4{font-size:12.5px;margin-top:5px;color:var(--navy);background:var(--cream2);border-left:3px solid var(--gold);padding:4px 8px;border-radius:0 6px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;background:var(--grybg);color:var(--gry);letter-spacing:.02em}
.t-red{background:var(--redbg);color:var(--red)}.t-amb{background:var(--ambbg);color:var(--amb)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-blu{background:var(--blubg);color:var(--blu)}.t-pur{background:var(--purbg);color:var(--pur)}.t-navy{background:var(--navy);color:#fff}
.empty{padding:26px 10px;text-align:center;color:var(--mute)}
.note{font-size:12.5px;color:#6B4A0E;background:var(--goldSoft);border:1px solid #F0DDB3;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.45}
.hc.hire{cursor:pointer}.hbar{height:6px;border-radius:3px;background:var(--cream);overflow:hidden;margin:9px 0 6px}.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--grn))}
.hmeta{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.4}.hact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.hact a.btn{text-decoration:none}
.hsteps{margin-top:12px;border-top:1px solid var(--line)}.hstep{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.hck{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;color:var(--mute);cursor:pointer}.hstep.ok .hck{background:var(--grn);border-color:var(--grn);color:#fff}
.hsb{flex:1;min-width:0}.hsb b{display:block;font-size:14.5px}.hsb small{display:block;color:var(--mute);font-size:12.5px}.hsb em{display:block;font-style:normal;font-size:12px;color:var(--grn);margin-top:2px}.hsb input{width:100%;margin-top:6px;font-size:14px;padding:7px 10px}
.hdocs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.hdocs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}.hdocs button.on{background:var(--grnbg);border-color:#BFDCCB;color:var(--grn)}
.hform{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:12px}.hform label{display:flex;flex-direction:column;gap:4px}.hform .wide{grid-column:1/-1}
.hrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 2px;border-bottom:1px solid var(--line)}.hrow:last-child{border-bottom:0}.hrb{flex:1;min-width:200px;cursor:pointer}.hrb b{font-size:15px}
/* tables */
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;background:#fff}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--cream);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);white-space:nowrap}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
/* profile */
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof .av{width:52px;height:52px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:22px;flex:none}
.prof .pn{flex:1;min-width:0}.prof .pn b{display:block;font-family:var(--head);font-size:21px;color:var(--navy2)}.prof .pn span{font-size:13px;color:var(--mute)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats div{background:var(--cream2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:76px}
.stats span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.stats b{font-family:var(--head);font-size:19px;color:var(--navy2)}
.back{background:none;border:0;color:var(--navy);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px}
/* history cards inside profiles */
.hc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.hc:hover{border-color:var(--gold)}
.hc .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13.5px;margin-top:8px}
.hc .kv dt{color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-top:2px}
.hc .kv dd{margin:0}
.hc .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hc .top strong{font-family:var(--head);font-size:16px;color:var(--navy2)}
/* vehicle grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.vc{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:14px 13px 12px;background:#fff;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(20,25,60,.05)}
.vc::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--navy),#5F3585 55%,var(--gold))}
.vc:hover{border-color:var(--gold)}
.vc>b{font-family:var(--head);font-weight:700;font-size:19px;color:var(--navy);display:block}
.vc .st{font-size:12.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .ns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:9px;text-align:center}
.vc .ns div{border-radius:9px;padding:4px 2px;background:var(--cream)}
.vc .ns span{display:block;font-size:9px;letter-spacing:.12em;font-weight:700;color:var(--mute)}
.vc .ns strong{font-family:var(--head);font-size:16px;color:var(--navy2)}
.vc .ns .r{background:var(--redbg)}.vc .ns .r strong{color:var(--red)}
/* sheet (case view) */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(16,22,48,.55);display:flex;justify-content:center;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
@media (min-width:760px){.sheet{align-items:center}.sheet .in{border-radius:20px;max-height:90vh}}
.sh-top{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;border-bottom:3px solid var(--gold)}
.sh-top .tt{flex:1;min-width:0}
.sh-top .tt small{display:block;color:var(--gold);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.sh-top .tt b{font-family:var(--head);font-size:20px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
.sb{padding:14px 14px 30px}
.blk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.blk>.lbl{display:block;margin-bottom:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.facts div span{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700}
.facts div b{font-weight:600;font-size:14.5px}
.facts a{color:var(--blu);font-weight:600;text-decoration:none}
.quote{font-size:16px;line-height:1.55;color:var(--ink);background:var(--cream2);border-left:4px solid var(--navy);border-radius:0 10px 10px 0;padding:12px 14px;white-space:pre-wrap}
.tl{display:flex;flex-direction:column;gap:10px}
.tli{display:flex;gap:10px}
.tli i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:6px;box-shadow:0 0 0 3px var(--goldSoft)}
.tli .c{flex:1;min-width:0}
.tli .c .m{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tli .c p{margin:3px 0 0;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.role{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--navy);color:var(--gold)}
.role.FO{background:var(--blubg);color:var(--blu)}.role.HM{background:var(--purbg);color:var(--pur)}.role.TM{background:var(--grnbg);color:var(--grn)}.role.AD{background:var(--navy);color:var(--gold)}
.addr{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.addr .row{display:flex;gap:8px}.addr .row select{flex:1}
.stbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stbtns button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 4px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mute)}
.stbtns button.on.Open{background:var(--red);border-color:var(--red);color:#fff}
.stbtns button.on.Action{background:#B7791F;border-color:#B7791F;color:#fff}
.stbtns button.on.Closed{background:var(--grn);border-color:var(--grn);color:#fff}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.form label.full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:700;color:var(--mute);cursor:pointer;font-size:13px}
.step.done .ck{background:var(--grn);border-color:var(--grn);color:#fff}
.step .sx{flex:1;min-width:0}.step .sx b{display:block;font-size:14.5px}.step .sx span{font-size:12px;color:var(--mute)}
.fu{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fu input{flex:1;min-width:130px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--navy)}
.login{max-width:400px;margin:40px auto}
.login label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:12px 0 5px}.login input{width:100%}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);border-bottom:2px solid var(--gold);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:560px){main{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.card{padding:13px}.kpi b{font-size:26px}h1{font-size:17px}}

nav{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible!important}
nav button{white-space:normal!important;line-height:1.15;font-size:13px!important;padding:8px 4px!important;text-align:center;position:relative}
nav button b{position:absolute;top:-6px;right:-4px;margin:0!important}
@media (min-width:900px){nav{grid-template-columns:repeat(7,minmax(0,1fr))}}
.case .t3.full{-webkit-line-clamp:unset;display:block}
.inl{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.inl div{font-size:12.5px;line-height:1.4;background:var(--cream2);border-left:3px solid var(--gold);padding:4px 8px;border-radius:0 6px 6px 0}
.inl div.fo{border-left-color:var(--blu)}.inl div b{color:var(--navy)}.inl div small{color:var(--mute)}
.chips3{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chips3 span{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--grybg);color:var(--gry)}
.chips3 span.ok{background:var(--grnbg);color:var(--grn)}.chips3 span.no{background:var(--redbg);color:var(--red)}.chips3 span.wait{background:var(--ambbg);color:var(--amb)}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.flt input,.flt select{width:100%}
@media (min-width:700px){.flt{grid-template-columns:2fr 1fr 1fr 1fr 1fr}}
.wl{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:#fff;cursor:pointer}
.wl .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wl .r1 strong{font-size:15px}
.wl .r2{font-size:13px;color:var(--mute);margin-top:3px}.wl .r3{font-size:13.5px;margin-top:5px}
.fuh{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.fuh div{background:var(--cream2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px}
.fuh div small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:2px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo"><img src="../fis/fis-logo-192.png" alt="FIS"></div>
    <h1><small>FIS · Transport</small>Transport Helpdesk</h1>
    <button class="sync" id="sync" title="Read the Daily FO again">Loading…</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>
<script>
const APP_V="202611280030";
const QS=new URLSearchParams(location.search);
const API_URL=QS.get('api')||'https://script.google.com/macros/s/AKfycbxkeXNT1rwMcFD8Wpp-jCWDa8Fchaeq-ZKbYnCcBFxdB3ByQ9ZcQkdbHdLocv5S3ZVx5Q/exec';
const TD_URL=QS.get('tdapi')||QS.get('api')||'https://script.google.com/macros/s/AKfycbzIeMjvNueZiTlS6m-j8VNKJxLAbWVITVYkvdj7COAUJMhAsxe2BvPmPD7K3czI6oqWfw/exec';
const LS={get(k){try{return JSON.parse(localStorage.getItem('tcr_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('tcr_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('tcr_'+k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>d?(+d.slice(8,10))+' '+MON[+d.slice(5,7)-1]+' '+d.slice(0,4):'–';
const fmtS=d=>d?(+d.slice(8,10))+' '+MON[+d.slice(5,7)-1]:'–';
const nowIST=()=>new Date(Date.now()+330*6e4);
const today=()=>nowIST().toISOString().slice(0,10);
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const weekStart=d=>addDays(d,-((new Date(d+'T00:00:00Z').getUTCDay()+6)%7));
const stamp=t=>{if(!t)return'';const d=new Date(+t+330*6e4),h=d.getUTCHours(),m=d.getUTCMinutes();return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()+', '+((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm')};
const dtLabel=s=>{if(!s)return'';const[d,t]=s.split('T');if(!t)return fmt(d);const[h,m]=t.split(':').map(Number);return fmt(d)+', '+((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm')};
const nowLocal=()=>nowIST().toISOString().slice(0,16);
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

let S={token:LS.get('token'),name:LS.get('name'),entries:[],docs:{},at:'',td:null,
  tab:LS.get('tab2')||'dash',per:LS.get('per')||'month',from:'',to:'',q:'',
  cf:{st:'',cat:''},rf:'New',rview:'list',ff:'',wf:{st:'',q:'',cls:'',area:'',from:'',to:''},dview:'drv',denyFor:null,denyKind:'',sel:null,open:null,busy:false,role:LS.get('role')||'FO'};

async function call(fn,args,url){
  if(!API_URL)throw new Error('SETUP');
  const r=await fetch(url||API_URL,{method:'POST',body:JSON.stringify({fn,args:args||[],token:S.token})});
  const j=await r.json();
  if(!j.ok){if(j.login&&!url){LS.del('token');S.token=null;render();}throw new Error(j.err||'Error')}
  return j.v;
}
async function load(fresh){
  if(S.busy)return;S.busy=true;$('sync').textContent='Reading Daily FO…';
  try{const v=await call('cr_data',[!!fresh]);S.entries=v.entries;S.docs=v.docs;S.at=v.at;LS.set('cache',{entries:v.entries,docs:v.docs,at:v.at});$('sync').textContent='Updated '+(v.at.split(', ')[1]||'')}
  catch(e){$('sync').textContent=e.message==='SETUP'?'Not connected':'Offline · Retry';if(e.message!=='SETUP'&&e.message!=='LOGIN')toast(e.message)}
  S.busy=false;render();loadTD();
}
async function loadTD(){ // drivers on duty from Transport Operations (same login)
  if(!S.token)return;try{const v=await call('td_since',[S.token,0,salPin()],TD_URL);S.td=v.docs||{};S.tdAdmin=!!v.admin;S.salPin=v.salPin||'no';LS.set('td',{docs:pickTD(S.td)});if(S.tab==='sal'&&!S.tdAdmin)setTab('dash');if(!(S.sd&&S.tab==='sal'))render()}catch(e){}
}
function pickTD(d){const o={};Object.keys(d||{}).forEach(k=>{if(k==='roster/main'||/^reports\/\d{4}-\d\d-\d\d$/.test(k)){const x=d[k]||{};o[k]=k==='roster/main'?x:{att:x.att||{},cover:x.cover||{}}}});return o}

/* ---------- fleet & drivers (from Transport Operations) ---------- */
const ROUTES=[[1,1],[2,1],[3,1],[4,1],[5,1],[6,0],[7,0],[8,1],[9,1],[10,1],[11,0],[12,0],[13,0],[14,1],[15,1],[16,0],[34,0]];
const FLEET=ROUTES.map(([n,b])=>({id:'p'+n,label:(b?'Bus ':'Van ')+n,bus:!!b}));
const RESV=['r1','r2','r3','r4'];
function canon(v){const m=String(v||'').match(/^(Bus|Van)\s*(\d+)$/i);if(m){const f=FLEET.find(x=>x.id==='p'+(+m[2]));if(f)return f.label}return v}
const roster=()=>((S.td||{})['roster/main'])||{name:{},phone:{}};
const tdRep=d=>((S.td||{})['reports/'+d])||null;
const cfgMap=()=>((S.docs['config/drivers']||{}).map)||{};
const cfgPh=()=>((S.docs['config/drivers']||{}).phone)||{};
function crewOn(veh,d){ // {driver,dphone,cond,cphone,cover}
  const f=FLEET.find(x=>x.label===canon(veh)),R=roster();
  const pm=String(veh||'').match(/^Bus\s*([A-H])$/i),pre=pm&&(R.pre||[]).find(x=>String(x.code).toUpperCase()===pm[1].toUpperCase());
  if(pre)return{driver:pre.driver||'',dphone:pre.dphone||'',cond:pre.cond||'',cphone:pre.cphone||'',src:'Pre-primary run'};
  if(!f){const n=cfgMap()[veh]||'';return{driver:n,dphone:cfgPh()[veh]||'',cond:'',cphone:'',src:n?'Drivers list':''}}
  const one=slot=>{const base=(R.name||{})[slot]||'',ph=(R.phone||{})[slot]||'';const rep=d&&tdRep(d);
    if(rep&&rep.att&&rep.att[slot]==='A'){const r=RESV.find(x=>(rep.cover||{})[x]===slot&&rep.att[x]!=='A');
      if(r)return{n:(R.name||{})[r]||'Reserve',p:(R.phone||{})[r]||'',cover:base}; return{n:'',p:'',cover:base,abs:1}}
    return{n:base,p:ph}};
  const dr=one(f.id+'d'),co=f.bus?one(f.id+'c'):{n:'',p:''};
  return{driver:dr.n||cfgMap()[veh]||'',dphone:dr.p,cond:co.n,cphone:co.p,cover:dr.cover,ccover:co.cover,src:S.td?'Transport Operations':'Drivers list'}
}

/* ---------- entries ---------- */
const ov=id=>S.docs['ov/'+id]||{};
const kindOf=e=>ov(e.id).kind||e.kind;
const isComp=e=>kindOf(e)==='Complaint';
// transport request (vehicle start / change / stop, address change, by walk, bus<->van) vs parent information (one-day notes, things left in the vehicle, stay back...)
function reqClass(e,o){if(o&&o.rt)return o.rt;const t=String(e.text||'')+' '+String(e.cat||'');
  if(/transport change/i.test(e.cat||''))return 'tr';
  const perm=/from (today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|next|\d)|onwards|permanent|regular(ly)?\b|daily\b|every ?day|address|shift(ing|ed)?\s+(to|house|home|from)|new (house|home|address|location)/i;
  const temp=/\b(today|tomorrow|tmrw|aaj|kal)\b|for (\d+|one|two|three|a few|some) days?|this week|stay ?back|lunch|tiffin|bottle|book ?set|bookset|forg[oe]t|left (his|her|in|behind)|lost|found|uniform|jacket|sweater|bag\b|will go (with|home with)|pick(ed)? ?up by (parent|father|mother|grand)/i;
  if(temp.test(t)&&!perm.test(t))return 'pi';
  const tr=/address|shift(ing|ed)?\b|by ?walk|walk(ing)? (to|from)|(change|chang|different|another|switch|replace|other)\w*\s[\w\s,-]{0,25}(bus|van|vehicle|route|stop|stoppage|transport)|(bus|van)\s*(to|→|->)\s*(bus|van)|from (bus|van) to|(start|need|want|requir|request|avail|opt|join|add|allot|provide)\w*\s[\w\s,-]{0,30}(bus|van|transport|vehicle|conveyance)|(stop|discontinu|remov|cancel|leav|withdraw)\w*\s[\w\s,-]{0,30}(bus|van|transport|vehicle)|(bus|van|transport)\s[\w\s,-]{0,25}(discontinu|stop|cancel|not required|no longer)|transport (change|facility|service|request)|गाड़ी|पता|एड्रेस/i;
  return tr.test(t)?'tr':'pi'}
const isAnyReq=e=>['Request','Query','Not marked','Call'].includes(kindOf(e));
// Transport requests = start / change / stop a vehicle, address change, by walk <-> vehicle, bus <-> van. Everything else a parent asks or tells = Parent information.
const isReq=e=>isAnyReq(e)&&reqClass(e,ov(e.id))==='tr';
const isInfo=e=>isAnyReq(e)&&reqClass(e,ov(e.id))!=='tr';
const isChg=e=>e.kind==='Change';
const old=e=>e.d&&e.d<addDays(today(),-30);
function vehsOf(e){const o=ov(e.id);return (o.veh?[o.veh]:e.vehs||[]).map(canon)}
function crewOf(e){const o=ov(e.id),v=vehsOf(e)[0],c=v?crewOn(v,e.d):{driver:'',dphone:'',cond:'',cphone:''};
  return Object.assign({},c,o.driver?{driver:o.driver,dphone:o.dphone||'',src:'Set on this case'}:{},o.cond?{cond:o.cond}:{})}
function fuOf(e){if(!isComp(e))return null;const f=ov(e.id).fu;return f&&f.on?f:null}
const fuLog=e=>Array.isArray(ov(e.id).fl)?ov(e.id).fl:[];
function fuState(f){if(!f)return'';if(f.done)return'done';const n=nowLocal(),t=today();if(f.due&&f.due<n)return'over';if(f.due&&f.due.slice(0,10)===t)return'today';return'up'}
function statusOf(e){const o=ov(e.id);if(o.st)return o.st;if(isChg(e))return e.status||'Not entered';
  if(old(e)&&!fuOf(e))return 'Closed';return e.action?'Action logged':'Open'}
const autoClosed=e=>!ov(e.id).st&&!isChg(e)&&old(e)&&!fuOf(e);
const STAGES=['New','Acknowledged','Awaiting','Approved','Completed','Denied','Closed'];
function stageOf(e){const o=ov(e.id),r=o.rq||{};
  if(r.dec==='Denied')return'Denied';if(r.dec==='Awaiting')return'Awaiting';
  if(r.dec==='Approved')return (r.steps||{}).board?'Completed':'Approved';
  if(o.st==='Closed')return'Closed';if(r.ack)return'Acknowledged';if(old(e)&&!fuOf(e))return'Closed';return'New'}
const CATS=['Driver behaviour','Conductor / attendant behaviour','Late or early arrival','Child missed / left behind','Rash driving / safety','Seating / overcrowding','Vehicle condition / cleanliness','Route or stop issue','Student behaviour in vehicle','Communication with parent','Other'];
function guessCat(t){t=(t||'').toLowerCase();
  if(/left behind|did not wait|didn.t wait|missed|not pick|without (the )?child|forgot/.test(t))return'Child missed / left behind';
  if(/late|early|delay|time|wait(ed|ing)? for/.test(t))return'Late or early arrival';
  if(/rash|speed|fast|accident|unsafe|safety|seat ?belt/.test(t))return'Rash driving / safety';
  if(/seat|crowd|space|standing|rod/.test(t))return'Seating / overcrowding';
  if(/conductor|didi|attendant|maid|lady/.test(t))return'Conductor / attendant behaviour';
  if(/driver|rude|shout|behav|misbehav|abus/.test(t))return/student|kids|children|child.*(fight|hit)|bully/.test(t)&&!/driver/.test(t)?'Student behaviour in vehicle':'Driver behaviour';
  if(/fight|hit|bully|tease|push/.test(t))return'Student behaviour in vehicle';
  if(/dirty|clean|ac\b|fan|window|broken|smell|condition/.test(t))return'Vehicle condition / cleanliness';
  if(/route|stop|point|location|colony/.test(t))return'Route or stop issue';
  if(/call|inform|message|phone|communicat/.test(t))return'Communication with parent';return'Other'}
const catOf=e=>ov(e.id).cat||guessCat(e.text);
const RQT=['New transport facility','Change of pick-up vehicle','Change of drop vehicle','Change of pick-up / drop point','Change of both pick-up and drop','Discontinue transport','One-day / temporary change','Query / information','Other'];
function guessRqt(t){t=(t||'').toLowerCase();if(/discontinu|stop (the )?transport|not (use|avail)|withdraw/.test(t))return'Discontinue transport';
  if(/today|tomorrow|one day|temporar/.test(t))return'One-day / temporary change';if(/requested for|new|start|avail|facility|bus transportation/.test(t))return'New transport facility';
  if(/pick/.test(t)&&/drop/.test(t))return'Change of both pick-up and drop';if(/drop/.test(t))return'Change of drop vehicle';if(/pick/.test(t))return'Change of pick-up vehicle';if(/point|stop|address|shift/.test(t))return'Change of pick-up / drop point';return'Other'}
const rqOf=e=>ov(e.id).rq||{};
const ROLES={FO:'Front Office',HM:'House Manager',TM:'Transport Manager',AD:'Director / Admin'};
function remsOf(e){const o=ov(e.id),r=Array.isArray(o.rem)?o.rem.slice():[];if(o.note&&!r.length)r.push({t:o.note,by:o.by||'',role:'',at:0});return r}
const stTag=s=>({'Open':'t-red','Action logged':'t-amb','Closed':'t-grn','Approved':'t-grn','Denied':'t-navy','Not entered':'t-amb'}[s]||'');
const sgTag=s=>({New:'t-red',Acknowledged:'t-blu',Awaiting:'t-amb',Approved:'t-pur',Completed:'t-grn',Denied:'t-navy',Closed:''}[s]||'');
const priTag=p=>p==='High'?'t-red':p==='Medium'?'t-amb':p==='Low'?'t-blu':'';
const studentKey=e=>e.name.toLowerCase().replace(/[^a-z ]/g,'').trim()+' · '+e.cls;

/* ---------- period ---------- */
const PER=[['today','Today'],['week','This week'],['month','This month'],['last30','Last 30 days'],['all','All'],['custom','Dates']];
function range(){const t=today();switch(S.per){case'today':return[t,t];case'week':return[weekStart(t),t];case'month':return[t.slice(0,8)+'01',t];
  case'last30':return[addDays(t,-29),t];case'custom':return[S.from||t.slice(0,8)+'01',S.to||t];default:return['2000-01-01','2999-12-31']}}
const inR=(e,R)=>e.d>=R[0]&&e.d<=R[1];
function periodBar(){if(S.noPB)return'';const R=range();
  return `<div class="period">${PER.map(([k,l])=>`<button class="${S.per===k?'on':''}" data-per="${k}">${l}</button>`).join('')}</div>
  ${S.per==='custom'?`<div class="dates"><input type="date" id="f-from" value="${S.from||R[0]}" aria-label="From"><input type="date" id="f-to" value="${S.to||R[1]}" aria-label="To"></div>`:''}
  <div class="prange">${S.per==='all'?'All records':R[0]===R[1]?fmt(R[0]):fmt(R[0])+' – '+fmt(R[1])}</div>`}
function search(L){const q=S.q.trim().toLowerCase();if(!q)return L;
  return L.filter(e=>{const c=crewOf(e),r=rqOf(e);return(e.name+' '+e.cls+' '+e.text+' '+(e.action||'')+' '+vehsOf(e).join(' ')+' '+c.driver+' '+c.cond+' '+catOf(e)+' '+(r.area||'')).toLowerCase().includes(q)})}
const byDate=(a,b)=>a.d<b.d?1:a.d>b.d?-1:0;

/* ---------- shared pieces ---------- */
function stepChips(e){const r=rqOf(e),s=r.steps||{},st=stageOf(e);
  const c=(ok,l,cls)=>`<span class="${ok?'ok':cls||''}">${ok?'✓ ':''}${l}</span>`;
  if(r.dec==='Denied')return `<div class="chips3">${c(r.ack,'Acknowledged')}<span class="no">✗ Denied${r.reason?' — '+esc(r.reason):''}</span></div>`;
  if(r.dec==='Awaiting')return `<div class="chips3">${c(r.ack,'Acknowledged')}<span class="wait">⏳ Awaiting${r.reason?' — '+esc(r.reason):''}</span></div>`;
  return `<div class="chips3">${c(r.ack,'Acknowledged',st==='New'?'no':'')}${c(r.dec==='Approved','Approved')}${r.dec==='Approved'?[['visit','House visit'],['fee','Fee'],['db','Database'],['group','Group message'],['board','On board']].map(([k,l])=>c(s[k],l,'no')).join(''):''}</div>`}
function caseRow(e){const c=crewOf(e),R=remsOf(e),f=fuOf(e),fs=fuState(f),rq=isReq(e),fl=fuLog(e);
  const st=rq?stageOf(e):statusOf(e),v=vehsOf(e),r=rqOf(e);
  const meta=[rq?(r.type||guessRqt(e.text)):catOf(e),rq?(r.area||'colony not entered'):(v.length?v.join(', '):'Vehicle not known'),rq?'':c.driver].filter(Boolean).join(' · ');
  return `<button class="case" data-case="${e.id}"><div class="dt"><b>${+e.d.slice(8,10)}</b><span>${MON[+e.d.slice(5,7)-1]}</span></div>
   <div class="bd"><div class="t1"><strong>${esc(e.name)}</strong><em>${esc(e.cls)}</em>
    <span class="tag ${rq?sgTag(st):stTag(st)}">${esc(st)}</span>${!rq&&e.pri?`<span class="tag ${priTag(e.pri)}">${e.pri}</span>`:''}
    ${fl.length?`<span class="tag t-blu">${fl.length} follow-up${fl.length>1?'s':''}</span>`:''}${fs&&fs!=='done'?`<span class="tag ${fs==='over'?'t-red':fs==='today'?'t-amb':'t-blu'}">Next ${fs==='over'?'overdue':dtLabel(f.due)}</span>`:''}</div>
    <div class="t2">${esc(meta)}</div>
    <div class="t3 full">${esc(e.text)}</div>
    <div class="inl">${e.action?`<div class="fo"><b>Action (Daily FO):</b> ${esc(e.action)}</div>`:''}${R.slice(-2).map(x=>`<div><b>${esc(ROLES[x.role]||x.by||'Remark')}:</b> ${esc(x.t)} <small>${x.at?'· '+stamp(x.at):''}</small></div>`).join('')}${!e.action&&!R.length&&!rq?'<div style="border-left-color:var(--red)"><b>No action recorded yet</b></div>':''}</div>
    ${rq?stepChips(e):''}</div></button>`}
function caseList(L,max){if(!L.length)return'<div class="empty">No entries for this period.</div>';const n=max||100;
  return L.slice(0,n).map(caseRow).join('')+(L.length>n?`<div class="empty">${L.length-n} more — choose a shorter period or search.</div>`:'')}
function rank(rows,key,lim){const mx=Math.max(1,...rows.map(r=>r.n));
  return rows.slice(0,lim||8).map((r,i)=>`<button class="rk" data-go="${key}|${esc(r.k)}"><span class="no">${i+1}</span><span class="nm"><div>${esc(r.k)}</div><span>${esc(r.sub||'')}</span></span><span class="bars"><i style="width:${r.n/mx*100}%"></i></span><span class="ct">${r.n}</span></button>`).join('')||'<div class="empty">None in this period.</div>'}
function groupBy(L,fn){const m=new Map();L.forEach(e=>[].concat(fn(e)).forEach(k=>{if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(e)}));return m}

/* ---------- tabs ---------- */
const TABS0=[['dash','Dashboard'],['comp','Complaints'],['req','Transport Requests'],['info','Parent Information'],['wait','Waiting list'],['fu','Follow-ups'],['chg','Change Tracker'],['fleet','Drivers'],['hire','Driver Hiring']];
const tabsNow=()=>S.tdAdmin?TABS0.concat([['sal','🔒 Salary']]):TABS0;
function nav(){const E=S.entries,open=E.filter(e=>isComp(e)&&statusOf(e)==='Open').length,nw=E.filter(e=>isReq(e)&&stageOf(e)==='New').length,
  fu=E.filter(e=>['over','today'].includes(fuState(fuOf(e)))).length;const c={comp:open,req:nw,info:E.filter(e=>isInfo(e)&&e.d===today()).length,fu,wait:E.filter(e=>isReq(e)&&stageOf(e)==='Awaiting').length,hire:hires().filter(x=>x.st==='In hiring').length};
  $('nav').innerHTML=tabsNow().map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">${l}${c[k]?`<b>${c[k]}</b>`:''}</button>`).join('')}

function lookups(){S.noPB=true;let h;try{h=S.dview==='bus'?busTab():S.dview==='stu'?stuTab():drvTab()}finally{S.noPB=false}return h}
function dash(){if(S.sel&&['drv','bus','stu'].includes(S.sel.t)){S.dview=S.sel.t;return periodBar()+lookups()}
  const E=S.entries,R=range(),t=today(),wk=weekStart(t),mo=t.slice(0,8)+'01';
  const C=E.filter(isComp),Q=E.filter(isReq),CP=C.filter(e=>inR(e,R)),QP=Q.filter(e=>inR(e,R));
  const cnt=(L,a)=>L.filter(e=>e.d>=a&&e.d<=t).length;
  const fus=E.filter(e=>fuOf(e)&&!fuOf(e).done),over=fus.filter(e=>fuState(fuOf(e))==='over').length,tod=fus.filter(e=>fuState(fuOf(e))==='today').length;
  const sg=s=>Q.filter(e=>stageOf(e)===s).length;
  const drv=[...groupBy(CP,e=>crewOf(e).driver||'').entries()].map(([k,L])=>({k,n:L.length,sub:[...new Set(L.flatMap(vehsOf))].join(', ')+' · '+L.filter(e=>statusOf(e)==='Open').length+' open'})).sort((a,b)=>b.n-a.n);
  const veh=[...groupBy(CP,e=>vehsOf(e)).entries()].map(([k,L])=>({k,n:L.length,sub:(crewOn(k,t).driver||'Driver not set')+' · '+L.filter(e=>statusOf(e)==='Open').length+' open'})).sort((a,b)=>b.n-a.n);
  const con=[...groupBy(CP.filter(e=>catOf(e)==='Conductor / attendant behaviour'||crewOf(e).cond),e=>crewOf(e).cond||'').entries()].map(([k,L])=>({k,n:L.length,sub:[...new Set(L.flatMap(vehsOf))].join(', ')})).sort((a,b)=>b.n-a.n);
  const cat=[...groupBy(CP,catOf).entries()].map(([k,L])=>({k,n:L.length,sub:L.filter(e=>statusOf(e)==='Open').length+' open'})).sort((a,b)=>b.n-a.n);
  return `${periodBar()}
  <div class="kpis">
   <button class="kpi red" data-tab="comp"><span>Complaints · period</span><b>${CP.length}</b><small>Today <em>${cnt(C,t)}</em> · Week <em>${cnt(C,wk)}</em> · Month <em>${cnt(C,mo)}</em></small></button>
   <button class="kpi red" data-tab="comp" data-cst="Open"><span>Open complaints</span><b>${C.filter(e=>statusOf(e)==='Open').length}</b><small>Action logged <em>${C.filter(e=>statusOf(e)==='Action logged').length}</em> · older than 1 month close automatically</small></button>
   <button class="kpi" data-tab="fu"><span>Follow-ups due</span><b>${over+tod}</b><small>Overdue <em>${over}</em> · Today <em>${tod}</em> · Upcoming <em>${fus.length-over-tod}</em></small></button>
   <button class="kpi navy" data-tab="req" data-rst="New"><span>Transport requests · period</span><b>${QP.length}</b><small>New <em>${sg('New')}</em> · Acknowledged <em>${sg('Acknowledged')}</em></small></button>
   <button class="kpi" data-tab="info"><span>Parent information · period</span><b>${E.filter(e=>isInfo(e)&&inR(e,R)).length}</b><small>Today <em>${E.filter(e=>isInfo(e)&&e.d===t).length}</em> · stay back, things left in the vehicle, one-day changes</small></button>
   <button class="kpi pur" data-tab="req" data-rst="Approved"><span>Onboarding in progress</span><b>${sg('Approved')}</b><small>Completed <em>${sg('Completed')}</em></small></button>
   <button class="kpi" data-tab="wait"><span>Awaiting / denied</span><b>${sg('Awaiting')} / ${sg('Denied')}</b><small>Colony-wise list inside</small></button>
  </div>
  <div class="two">
   <div class="card"><div class="sh"><span>Complaints by driver</span><small>driver on duty that day</small></div>${rank(drv.filter(r=>r.k),'drv',8)}</div>
   <div class="card"><div class="sh"><span>Complaints by vehicle</span><small>bus and van number</small></div>${rank(veh,'bus',8)}</div>
  </div>
  <div class="two">
   <div class="card"><div class="sh"><span>Complaints by category</span></div>${rank(cat,'cat',11)}</div>
   <div class="card"><div class="sh"><span>Conductor complaints</span><small>buses with a conductor</small></div>${rank(con.filter(r=>r.k),'con',8)}</div>
  </div>
  <div class="card gold"><div class="sh"><span>Latest complaints</span><small>${CP.length} in this period</small><button class="btn ghost sm r" data-tab="comp">View all</button></div>${caseList(CP.sort(byDate),6)}</div>
  <div class="card gold"><div class="sh"><span>Look up</span><small>by driver, vehicle or student — tap a card for the full history</small></div>
   <div class="seg">${[['drv','By driver'],['bus','By vehicle'],['stu','By student']].map(([k,l])=>`<button class="${S.dview===k?'on':''}" data-dv="${k}">${l}</button>`).join('')}</div>${lookups()}</div>`}

function compTab(){const R=range(),B=search(S.entries.filter(e=>isComp(e)&&inR(e,R))).sort(byDate);
  let L=B;if(S.cf.st)L=L.filter(e=>statusOf(e)===S.cf.st);if(S.cf.cat)L=L.filter(e=>catOf(e)===S.cf.cat);
  const n=s=>B.filter(e=>statusOf(e)===s).length;
  return `${periodBar()}
  <div class="seg">${[['','All',B.length],['Open','Open',n('Open')],['Action logged','Action logged',n('Action logged')],['Closed','Closed',n('Closed')]].map(([k,l,c])=>`<button class="${S.cf.st===k?'on':''}" data-cst="${k}">${l}<b>${c}</b></button>`).join('')}</div>
  <div class="bar"><input type="search" id="f-q" placeholder="Search student, bus, driver, words" value="${esc(S.q)}">
   <select id="f-cat" aria-label="Category"><option value="">All categories</option>${CATS.map(c=>`<option ${S.cf.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="card"><div class="sh"><span>Complaints &amp; Concerns</span><small>${L.length} · tap a complaint to open the case</small></div>${caseList(L)}</div>`}

function colonyView(L,title){const G=[...groupBy(L,e=>rqOf(e).area||'Colony not entered').entries()].sort((a,b)=>(a[0]==='Colony not entered')-(b[0]==='Colony not entered')||b[1].length-a[1].length);
  return `<div class="card"><div class="sh"><span>${title} · colony-wise</span><small>${L.length} students in ${G.length} colonies</small></div>
  ${G.map(([k,es])=>`<div class="hc" style="cursor:default"><div class="top"><strong>${esc(k)}</strong><span class="tag t-navy">${es.length} student${es.length>1?'s':''}</span></div>
   ${es.sort(byDate).map(e=>`<div class="case" data-case="${e.id}" style="padding:9px 0"><div class="bd"><div class="t1"><strong>${esc(e.name)}</strong><em>Class ${esc(e.cls)}</em></div>
    <div class="t2">Requested ${fmt(e.d)} · ${esc(rqOf(e).type||guessRqt(e.text))}${rqOf(e).decAt>1?' · '+esc(rqOf(e).dec)+' '+stamp(rqOf(e).decAt):''}</div>${rqOf(e).reason?`<div class="t4">Reason: ${esc(rqOf(e).reason)}</div>`:''}</div></div>`).join('')}</div>`).join('')||'<div class="empty">None.</div>'}</div>`}
function reqTab(){const R=range(),all=S.entries.filter(isReq);
  const B=search(all.filter(e=>inR(e,R)||['Approved','Acknowledged','New'].includes(stageOf(e))&&e.d>=addDays(today(),-60))),L=B.filter(e=>!S.rf||stageOf(e)===S.rf).sort(byDate);
  const n=s=>B.filter(e=>stageOf(e)===s).length;
  return `${periodBar()}
  <div class="seg">${['New','Acknowledged','Approved','Completed','Closed'].map(s=>`<button class="${S.rf===s?'on':''}" data-rst="${s}">${s==='Approved'?'Approved · onboarding':s}<b>${n(s)}</b></button>`).join('')}<button class="${!S.rf?'on':''}" data-rst="">All<b>${B.length}</b></button></div>
  <div class="note">Awaiting and denied requests are in the <b>Waiting list</b> tab. Green = step done · grey = not done yet.</div>
  <div class="bar"><input type="search" id="f-q" placeholder="Search student, class, colony" value="${esc(S.q)}"></div>
  <div class="card"><div class="sh"><span>Transport Requests</span><small>${L.length}</small></div>${caseList(L)}</div>`}
function infoTab(){const R=range(),L=search(S.entries.filter(e=>isInfo(e)&&inR(e,R))).sort(byDate);
  return `${periodBar()}
  <div class="note"><b>Parent information</b> — one-day notes and messages from parents: going with a parent today, stay back / not staying back, lunch, books or things left in the vehicle, a book set to be sent. Only vehicle start / change / stop, address change, by walk ↔ vehicle and bus ↔ van are <b>Transport Requests</b>. If a case is in the wrong list, open it and change <b>Head</b>.</div>
  <div class="bar"><input type="search" id="f-q" placeholder="Search student, class, text" value="${esc(S.q)}"></div>
  <div class="card"><div class="sh"><span>Parent Information</span><small>${L.length}</small></div>${caseList(L)}</div>`}
function waitTab(){const all=S.entries.filter(e=>isReq(e)&&['Awaiting','Denied'].includes(stageOf(e)));const W=S.wf;
  const areas=[...new Set(all.map(e=>rqOf(e).area).filter(Boolean))].sort(),classes=[...new Set(all.map(e=>e.cls))].sort();
  let L=all.filter(e=>(!W.st||stageOf(e)===W.st)&&(!W.area||rqOf(e).area===W.area)&&(!W.cls||e.cls===W.cls)&&(!W.from||e.d>=W.from)&&(!W.to||e.d<=W.to)&&(!W.q||(e.name+' '+e.cls+' '+(rqOf(e).area||'')).toLowerCase().includes(W.q.toLowerCase()))).sort(byDate);
  const n=s=>all.filter(e=>stageOf(e)===s).length;
  return `<div class="seg">${[['','All',all.length],['Awaiting','Awaiting',n('Awaiting')],['Denied','Denied',n('Denied')]].map(([k,l,c])=>`<button class="${W.st===k?'on':''}" data-wst="${k}">${l}<b>${c}</b></button>`).join('')}</div>
  <div class="flt"><input type="search" id="w-q" placeholder="Student name" value="${esc(W.q)}"><select id="w-cls"><option value="">All classes</option>${classes.map(c=>`<option ${W.cls===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
   <select id="w-area"><option value="">All colonies</option>${areas.map(c=>`<option ${W.area===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input type="date" id="w-from" value="${W.from}" aria-label="From"><input type="date" id="w-to" value="${W.to}" aria-label="To"></div>
  <div class="card"><div class="sh"><span>Transport waiting cases</span><small>${L.length} · date-wise · all dates</small></div>
  ${L.map(e=>{const r=rqOf(e),R=remsOf(e),last=R[R.length-1];return `<div class="wl" data-case="${e.id}"><div class="r1"><strong>${esc(e.name)}</strong><em style="font-style:normal;color:var(--mute)">${esc(e.cls)}</em><span class="tag ${stageOf(e)==='Denied'?'t-navy':'t-amb'}">${stageOf(e)}</span><span class="tag">${esc(r.area||'colony not entered')}</span></div>
    <div class="r2">Requested ${fmt(e.d)} · ${esc(r.type||guessRqt(e.text))}${r.decAt>1?` · ${esc(r.dec)} by ${esc(r.decBy||'')} on ${stamp(r.decAt)}`:''}</div>
    <div class="r3">${esc(e.text)}</div><div class="inl">${r.reason?`<div style="border-left-color:var(--red)"><b>Reason:</b> ${esc(r.reason)}</div>`:''}${last?`<div><b>${esc(ROLES[last.role]||last.by||'Remark')}:</b> ${esc(last.t)}</div>`:''}</div></div>`}).join('')||'<div class="empty">No waiting cases with these filters.</div>'}</div>`}
function fuTab(){const E=S.entries.filter(e=>isComp(e)&&(fuOf(e)||fuLog(e).length)),grp={due:[],up:[],done:[]};
  E.forEach(e=>{const f=fuOf(e),s=fuState(f);grp[!f?'done':(s==='over'||s==='today')?'due':s==='done'?'done':'up'].push(e)});
  grp.due.sort((a,b)=>(fuOf(a).due||'')<(fuOf(b).due||'')?-1:1);grp.up.sort((a,b)=>(fuOf(a).due||'')<(fuOf(b).due||'')?-1:1);
  const T={due:'Due now',up:'Upcoming',done:'Completed'};if(!T[S.ff])S.ff=grp.due.length?'due':'up';
  const row=e=>{const f=fuOf(e),L=fuLog(e),last=L[L.length-1];return `<button class="case" data-case="${e.id}"><div class="dt"><b>${L.length}</b><span>times</span></div><div class="bd">
    <div class="t1"><strong>${esc(e.name)}</strong><em>${esc(e.cls)}</em><span class="tag">${esc(catOf(e))}</span>${f&&f.due&&!f.done?`<span class="tag ${fuState(f)==='over'?'t-red':fuState(f)==='today'?'t-amb':'t-blu'}">Next: ${dtLabel(f.due)}</span>`:''}</div>
    <div class="t2">Complaint of ${fmt(e.d)} · ${esc(vehsOf(e).join(', ')||'vehicle ?')} · ${esc(crewOf(e).driver||'')}</div><div class="t3">${esc(e.text)}</div>
    ${last?`<div class="t4">Last follow-up ${stamp(last.at)} by ${esc(last.by||'')}: ${esc(last.t)}</div>`:'<div class="t4" style="border-left-color:var(--red)">No follow-up done yet</div>'}</div></button>`};
  return `<div class="note">Follow-ups are for complaint cases only — a child who was upset, bullied, left behind, or a concern about driver, conductor or timing. Transport requests that are waiting are in the <b>Waiting list</b>.</div>
  <div class="seg">${Object.keys(T).map(k=>`<button class="${S.ff===k?'on':''}" data-ff="${k}">${T[k]}<b>${grp[k].length}</b></button>`).join('')}</div>
  <div class="card"><div class="sh"><span>Follow-ups · ${T[S.ff]}</span><small>open a case to record a follow-up</small></div>${grp[S.ff].map(row).join('')||'<div class="empty">Nothing here.</div>'}</div>`}
function histCard(e){const c=crewOf(e),R=remsOf(e),last=R[R.length-1],rq=isReq(e),st=rq?stageOf(e):statusOf(e);
  return `<div class="hc" data-case="${e.id}"><div class="top"><strong>${fmt(e.d)}</strong><span class="tag ${rq?sgTag(st):stTag(st)}">${esc(st)}</span>${!rq&&e.pri?`<span class="tag ${priTag(e.pri)}">${e.pri}</span>`:''}<span class="tag">${esc(rq?'Request':catOf(e))}</span></div>
  <dl class="kv"><dt>Student</dt><dd><b>${esc(e.name)}</b> · ${esc(e.cls)}</dd><dt>Vehicle</dt><dd>${esc(vehsOf(e).join(', ')||'Not known')}</dd><dt>Driver</dt><dd>${esc(c.driver||'—')}${c.cond?' · Conductor '+esc(c.cond):''}</dd>
  <dt>Complaint</dt><dd>${esc(e.text)}</dd><dt>What happened</dt><dd>${last?esc(last.t)+` <span style="color:var(--mute);font-size:12px">— ${esc(ROLES[last.role]||'')} ${esc(last.by||'')}</span>`:esc(e.action||'No action recorded yet')}</dd></dl></div>`}
function profile(title,sub,init,L,stats){const C=L.filter(isComp);
  return `<button class="back" data-back>← All</button><div class="card gold"><div class="prof"><div class="av">${esc(init)}</div><div class="pn"><b>${esc(title)}</b><span>${sub}</span></div></div>
   <div class="stats"><div><span>Complaints</span><b>${C.length}</b></div><div><span>Open</span><b style="color:var(--red)">${C.filter(e=>statusOf(e)==='Open').length}</b></div><div><span>High</span><b>${C.filter(e=>e.pri==='High').length}</b></div><div><span>Requests</span><b>${L.filter(isReq).length}</b></div>${stats||''}</div></div>
   <div class="card"><div class="sh"><span>Case history</span><small>newest first · tap to open</small></div>${L.sort(byDate).map(histCard).join('')||'<div class="empty">No entries for this period.</div>'}</div>`}
function drvTab(){const R=range(),L=search(S.entries.filter(e=>(isComp(e)||isReq(e))&&inR(e,R)));const t=today();
  const known=new Set();FLEET.forEach(f=>{const c=crewOn(f.label,t);if(c.driver)known.add(c.driver)});
  const G=groupBy(L,e=>crewOf(e).driver||'');[...known].forEach(k=>{if(!G.has(k))G.set(k,[])});
  if(S.sel&&S.sel.t==='drv'){const es=G.get(S.sel.k)||[];const vs=[...new Set(es.flatMap(vehsOf))],ph=es.map(e=>crewOf(e).dphone).find(Boolean)||phoneOf(S.sel.k);
    return periodBar()+profile(S.sel.k,`Driver · ${vs.join(', ')||'—'}${ph?` · <a href="tel:${esc(ph)}">${esc(ph)}</a>`:''}`,S.sel.k[0]||'?',es)}
  const rows=[...G.entries()].filter(([k])=>k).map(([k,es])=>({k,es,c:es.filter(isComp).length,o:es.filter(e=>isComp(e)&&statusOf(e)==='Open').length,v:[...new Set(es.flatMap(vehsOf))]})).sort((a,b)=>b.c-a.c||a.k.localeCompare(b.k));
  const today_=k=>FLEET.find(f=>crewOn(f.label,t).driver===k);
  return `${periodBar()}<div class="bar"><input type="search" id="f-q" placeholder="Search driver" value="${esc(S.q)}"></div>
  <div class="card"><div class="sh"><span>Driver-wise</span><small>complaints are counted on the driver on duty that day · tap a driver</small></div>
  <div class="grid">${rows.map(r=>`<button class="vc" data-go="drv|${esc(r.k)}"><b>${esc(r.k)}</b><div class="st">${esc(r.v.join(', ')||(today_(r.k)||{}).label||'—')}</div>
   <div class="ns"><div class="r"><span>COMPL.</span><strong>${r.c}</strong></div><div><span>OPEN</span><strong>${r.o}</strong></div><div><span>REQ.</span><strong>${r.es.filter(isReq).length}</strong></div></div></button>`).join('')||'<div class="empty">No drivers yet.</div>'}</div></div>`}
function phoneOf(name){const R=roster();for(const id in (R.name||{}))if(R.name[id]===name)return(R.phone||{})[id]||'';return''}
function busTab(){const R=range(),L=search(S.entries.filter(e=>(isComp(e)||isReq(e)||isChg(e))&&inR(e,R))),t=today();
  const G=groupBy(L,e=>vehsOf(e).length?vehsOf(e):['Vehicle not known']);FLEET.forEach(f=>{if(!G.has(f.label))G.set(f.label,[])});
  if(S.sel&&S.sel.t==='bus'){const es=G.get(S.sel.k)||[],c=crewOn(S.sel.k,t);
    return periodBar()+profile(S.sel.k,`Today: driver ${esc(c.driver||'—')}${c.dphone?` · <a href="tel:${esc(c.dphone)}">${esc(c.dphone)}</a>`:''}${c.cond?' · conductor '+esc(c.cond):''}`,S.sel.k.split(' ')[1]||'?',es.filter(e=>!isChg(e)),`<div><span>Changes</span><b>${es.filter(isChg).length}</b></div>`)}
  const ord=k=>{const m=k.match(/^(Bus|Van|Auto) (\w+)/);return m?[{Bus:0,Van:1,Auto:2}[m[1]],isNaN(m[2])?100+m[2].charCodeAt(0):+m[2]]:[9,0]};
  const rows=[...G.entries()].sort((a,b)=>{const x=ord(a[0]),y=ord(b[0]);return x[0]-y[0]||x[1]-y[1]});
  return `${periodBar()}<div class="card"><div class="sh"><span>Vehicle-wise</span><small>use this when drivers change · tap a vehicle</small></div>
  <div class="grid">${rows.map(([k,es])=>{const c=crewOn(k,t),C=es.filter(isComp);return `<button class="vc" data-go="bus|${esc(k)}"><b>${esc(k)}</b><div class="st">${esc(c.driver||'—')}</div>
   <div class="ns"><div class="r"><span>COMPL.</span><strong>${C.length}</strong></div><div><span>OPEN</span><strong>${C.filter(e=>statusOf(e)==='Open').length}</strong></div><div><span>REQ.</span><strong>${es.filter(isReq).length}</strong></div></div></button>`}).join('')}</div></div>`}
function stuTab(){const R=range(),L=search(S.entries.filter(e=>!isChg(e)&&inR(e,R)));const G=groupBy(L,studentKey);
  if(S.sel&&S.sel.t==='stu'){const es=G.get(S.sel.k)||S.entries.filter(e=>studentKey(e)===S.sel.k);const e0=es[0]||{name:'',cls:''};
    return periodBar()+profile(e0.name,`Class ${esc(e0.cls)} · ${esc([...new Set(es.flatMap(vehsOf))].join(', ')||'vehicle not known')}`,(e0.name||'?')[0],es)}
  const rows=[...G.entries()].map(([k,es])=>({k,es,c:es.filter(isComp).length,r:es.filter(isReq).length})).sort((a,b)=>b.c-a.c||b.r-a.r||(b.es.length-a.es.length));
  return `${periodBar()}<div class="bar"><input type="search" id="f-q" placeholder="Search student or class" value="${esc(S.q)}"></div>
  <div class="card"><div class="sh"><span>Student-wise</span><small>${rows.length} students · tap a name</small></div><div class="tw"><table><thead><tr><th>Student</th><th>Class</th><th>Vehicle</th><th class="n">Complaints</th><th class="n">Requests</th><th>Last</th></tr></thead><tbody>
  ${rows.slice(0,200).map(r=>`<tr data-go="stu|${esc(r.k)}" style="cursor:pointer"><td><b>${esc(r.es[0].name)}</b></td><td>${esc(r.es[0].cls)}</td><td>${esc([...new Set(r.es.flatMap(vehsOf))].join(', '))}</td><td class="n">${r.c||'–'}</td><td class="n">${r.r||'–'}</td><td>${fmtS(r.es.sort(byDate)[0].d)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">None</td></tr>'}</tbody></table></div></div>`}
function chgTab(){const R=range(),L=search(S.entries.filter(e=>isChg(e)&&inR(e,R))).sort(byDate);const n=s=>L.filter(e=>statusOf(e)===s).length;
  return `${periodBar()}<div class="bar"><input type="search" id="f-q" placeholder="Search student, vehicle" value="${esc(S.q)}"></div>

  sheet();if(keep&&$('rem-text'))$('rem-text').value=keep;const si=document.querySelector('.sheet .in');if(si)si.scrollTop=sc;

    let r=`<tr><td class="n">${i+1}</td><td><b>${esc(x.name||id)}</b><br><span style="color:var(--mute);font-size:12px">${esc(x.role||'')}</span></td><td>${x.doj?fmt(x.doj):'–'}<br><span style="color:var(--mute);font-size:12px">${svcLen(x.doj)}</span></td><td class="n">${inr(j)}</td>
      <td>${inc.map(e=>`<span class="tag" style="margin:0 4px 4px 0">${inr(e.amount)} ${esc(e.label||'')}</span>`).join('')||'<span style="color:var(--mute)">No increment yet</span>'}</td><td class="n"><b>${inr(cur)}</b>${j&&cur&&cur>j?`<br><span style="color:var(--grn);font-size:12px">+${Math.round((cur-j)/j*100)}%</span>`:''}</td>
      <td><button class="btn sm ghost" data-sedit="${esc(id)}">${D?'Close':'Edit'}</button></td></tr>`;
    if(D)r+=`<tr><td></td><td colspan="6"><div class="hform"><label><span class="lbl">Date of joining</span><input type="date" id="sd-doj" value="${esc(D.doj||'')}"></label><label><span class="lbl">Joining salary (₹)</span><input id="sd-join" inputmode="numeric" value="${esc(D.join==null?'':D.join)}"></label><label><span class="lbl">Post</span><input id="sd-role" value="${esc(D.role||'')}"></label></div>
      <div class="lbl" style="margin:8px 0 6px">Increments (oldest first)</div>${D.inc.map((e,k)=>`<div class="hform" style="margin-bottom:6px"><label><span class="lbl">Year / month</span><input id="sd-l-${k}" value="${esc(e.label||'')}" placeholder="2025 or Dec 2024"></label><label><span class="lbl">Date</span><input type="date" id="sd-d-${k}" value="${esc(e.date||'')}"></label><label><span class="lbl">New salary (₹)</span><input id="sd-a-${k}" inputmode="numeric" value="${esc(e.amount==null?'':e.amount)}"></label><button class="btn sm ghost" data-sdrm="${k}" style="align-self:end">Remove</button></div>`).join('')}
      <div class="bar"><button class="btn sm ghost" data-sdadd="1">＋ Add increment</button><button class="btn sm gold" data-sdsave="${esc(id)}" ${S.sbusy?'disabled':''}>${S.sbusy?'Saving…':'Save'}</button><button class="btn sm ghost" data-sedit="${esc(id)}">Cancel</button></div></td></tr>`;
    return r}).join('');
  const r=roster(),have={};ids.forEach(id=>{have[String(sal[id].name||'').trim().toLowerCase()]=1});
  const miss=Object.keys(r.name||{}).filter(id=>r.name[id]&&!sal[id]&&!have[String(r.name[id]).trim().toLowerCase()]);
  return `<div class="note">🔒 Salary is visible only to Harsh Yadav and Rahul Yadav. It was moved here from Transport Operations so that drivers and conductors never see it.${S.salPin==='none'?' <b>Salary PIN is not set</b> — ask to set it so that typing your name at login is not enough.':''}</div>
  <div class="kpis"><div class="kpi navy"><span>Staff</span><b>${ids.length}</b></div><div class="kpi"><span>Monthly total</span><b style="font-size:24px">${inr(tot)}</b><small>at joining <em>${inr(totJ)}</em></small></div><div class="kpi red"><span>Increment review due</span><b>${due.length}</b><small>${esc(due.slice(0,4).join(', '))}${due.length>4?'…':''}</small></div></div>
  <div class="card"><div class="sh"><span>Salary &amp; increments</span><small>${ids.length} staff</small></div><div class="tw"><table><thead><tr><th class="n">#</th><th>Name</th><th>Joined</th><th class="n">Joining</th><th>Increments</th><th class="n">Current</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No salary records yet.</td></tr>'}</tbody>
  <tfoot><tr><td></td><td><b>Total monthly</b></td><td></td><td class="n">${inr(totJ)}</td><td></td><td class="n"><b>${inr(tot)}</b></td><td></td></tr></tfoot></table></div>
  ${miss.length?`<div class="bar" style="margin-top:12px"><select id="sd-new"><option value="">Add salary record for…</option>${miss.map(id=>`<option value="${esc(id)}">${esc(r.name[id])}</option>`).join('')}</select><button class="btn sm" data-sdnew="1">Add</button></div>`:''}</div>`}
function sdRead(){const D=S.sd;if(!D)return;const v=id=>{const e=$(id);return e?e.value:null};if(v('sd-doj')!=null)D.doj=v('sd-doj');if(v('sd-join')!=null)D.join=v('sd-join');if(v('sd-role')!=null)D.role=v('sd-role');
  D.inc.forEach((e,k)=>{if(v('sd-l-'+k)!=null){e.label=v('sd-l-'+k);e.date=v('sd-d-'+k);e.amount=v('sd-a-'+k)}})}

document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-hv],[data-hhd],[data-hopen],[data-hstep],[data-hdoc],[data-hstart],[data-hadd],[data-hedit],[data-hdel],[data-hf],[data-hupok],[data-hupx],[data-htpl],[data-hcall],[data-salgo],[data-sedit],[data-sdadd],[data-sdrm],[data-sdsave],[data-sdnew]');if(!t)return;
  const d=t.dataset,A=()=>hires(),get=id=>A().find(x=>x.id===id);ev.stopPropagation();render.force=true;
  if(d.hcall!=null){const x=get(d.hcall);if(x){x.lc={at:Date.now(),by:me()};if((x.st||'New')==='New')x.st='Called';hSave(x,'Call noted')}return}
  if(d.hv!=null){S.hv=d.hv;S.hopen=null;S.hedit=false;render();scrollTo(0,0);return}
  if(d.hopen!=null){S.hopen=d.hopen;S.hback=d.hback||'pipe';S.hedit=false;render();scrollTo(0,0);return}
  if(d.hf!=null){S.hf=d.hf;render();return}
  if(d.hhd){S.hhd=d.hhd;S.hrf='';S.hf='';render();return}
  if(d.htpl){hTemplate();return}
  if(d.hupx){S.hup=null;render();return}
  if(d.hstart){const x=get(d.hstart);if(x){x.st='In hiring';x.steps=x.steps||{};x.hs={by:me(),at:Date.now()};S.hopen=x.id;S.hback='pipe';S.hv='pipe';hSave(x,'Hiring started')}return}
  if(d.hstep){const[id,k]=d.hstep.split('|'),x=get(id);if(!x)return;const s=Object.assign({},x.steps||{}),c=Object.assign({},s[k]||{});
    if(c.ok){c.ok=false}else{c.ok=true;c.d=today();c.who=me()}if(k==='dc'){const it={};HDOCS.forEach(q=>{it[q[0]]=c.ok});c.it=it}s[k]=c;x.steps=s;
    if(hDone(x)===HSTEPS.length)x.st='Joined';else if(x.st==='Joined'||!x.st||x.st==='New'||x.st==='Called'||x.st==='Interested')x.st='In hiring';
    hSave(x,c.ok?'Step done':'Step un-ticked');return}
  if(d.hdoc){const[id,q]=d.hdoc.split('|'),x=get(id);if(!x)return;const s=Object.assign({},x.steps||{}),c=Object.assign({},s.dc||{}),it=Object.assign({},c.it||{});it[q]=!it[q];c.it=it;
    const all=HDOCS.every(z=>it[z[0]]);if(all&&!c.ok){c.ok=true;c.d=today();c.who=me()}else if(!all)c.ok=false;s.dc=c;x.steps=s;
    if(hDone(x)===HSTEPS.length)x.st='Joined';else if(['Joined','New','Called','Interested'].includes(x.st||'New'))x.st='In hiring';hSave(x,it[q]?'Document received':'Document un-ticked');return}
  if(d.hedit){S.hopen=d.hedit;S.hedit=true;render();return}
  if(d.hdel){const x=get(d.hdel);if(!x)return;if(S.hdelc!==x.id){S.hdelc=x.id;t.textContent='Tap again to remove';setTimeout(()=>{S.hdelc=null},4000);return}
    x.del=true;S.hopen=null;S.hdelc=null;hSave(x,'Removed');return}
  if(d.hadd!=null){const g=id=>($(id).value||'').trim(),n=g('h-n'),ph=digits(g('h-ph'));if(!n||ph.length<10){toast('Enter the name and a 10-digit mobile');return}
    const dup=A().find(y=>digits(y.ph)===ph&&y.id!==d.hadd);if(dup&&S.hdup!==ph){S.hdup=ph;toast(dup.n+' already has this mobile — tap Save again to add anyway');return}
    const x=d.hadd?Object.assign({},get(d.hadd)):{id:hid(),st:'New',src:'Guard room',addBy:me(),addAt:Date.now()};
    Object.assign(x,{n,ph,role:$('h-role').value,lic:g('h-lic'),exp:g('h-exp'),area:g('h-area'),vd:g('h-vd'),ref:g('h-ref'),prev:g('h-prev'),note:g('h-note')});
    S.hdup=null;S.hedit=false;if(!d.hadd){S.hv='db';S.hopen=null}hSave(x,'Candidate saved');return}
  if(d.hupok){const L=(S.hup||{}).add||[];if(!L.length||S.hbusy)return;S.hbusy=true;render();let done=0;
    try{for(let i=0;i<L.length;i+=200){const part=L.slice(i,i+200).map(v=>({k:'hire/'+hid(),v}));await call('cr_setmany',[S.token,part]);part.forEach(p=>{S.docs[p.k]=p.v});done+=part.length}
      toast(done+' candidates added');S.hup=null;S.hv='db'}catch(e){toast((done?done+' added, then ':'')+'not saved: '+e.message)}
    S.hbusy=false;render.force=true;render();return}
  if(d.salgo){const v=($('sal-pin')||{}).value||'';try{sessionStorage.setItem('hd_salpin',v.trim())}catch(e){}S.salErr='Checking…';render();await loadTD();S.salErr=S.salPin==='need'?'Wrong PIN.':'';render.force=true;render();return}
  if(d.sedit!=null){if(S.sd&&S.sd.id===d.sedit){S.sd=null}else{const x=salDocs()[d.sedit]||{};S.sd={id:d.sedit,doj:x.doj||'',join:x.join==null?'':x.join,role:x.role||'',inc:JSON.parse(JSON.stringify(x.inc||[]))}}render();return}
  if(d.sdadd){sdRead();S.sd.inc.push({label:String(new Date().getFullYear()),date:today(),amount:''});render();return}
  if(d.sdrm!=null){sdRead();S.sd.inc.splice(+d.sdrm,1);render();return}
  if(d.sdnew){const id=($('sd-new')||{}).value;if(!id)return;const r=roster();S.td['salary/'+id]={name:r.name[id],order:99};S.sd={id,doj:'',join:'',role:'',inc:[]};render();return}
  if(d.sdsave){sdRead();const id=d.sdsave,x=salDocs()[id]||{},D=S.sd,num=v=>v===''||v==null||isNaN(v)?null:Number(v);
    const doc=Object.assign({},x,{doj:D.doj||'',join:num(D.join),role:String(D.role||'').trim(),inc:D.inc.filter(e=>e.amount!==''&&e.amount!=null).map(e=>({label:String(e.label||'').trim(),date:e.date||'',amount:Number(e.amount)}))});
    S.sbusy=true;render();try{await call('td_set',[S.token,'salary/'+id,doc,salPin()],TD_URL);S.td['salary/'+id]=doc;S.sd=null;toast('Salary saved')}catch(e){toast(e.message==='LOGIN'?'Log in again':'Not saved: '+e.message)}S.sbusy=false;render.force=true;render();return}
},true);
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='h-q'){S.hq=t.value;render.force=true;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='sal-pin'){const b=document.querySelector('[data-salgo]');if(b)b.click()}});
document.addEventListener('change',async ev=>{const t=ev.target,d=t.dataset;
  if(t.id==='h-rf'){S.hrf=t.value;render.force=true;render();return}
  if(d.hst){const x=hires().find(y=>y.id===d.hst);if(x){x.st=t.value;if(t.value==='In hiring'&&!x.steps)x.steps={};hSave(x,'Status saved')}return}
  if(d.hnote){const[id,k]=d.hnote.split('|'),x=hires().find(y=>y.id===id);if(!x)return;const s=Object.assign({},x.steps||{});s[k]=Object.assign({},s[k]||{},{note:t.value.trim()});x.steps=s;hSave(x,'Note saved');return}
  if(t.id==='h-file'&&t.files&&t.files[0]){toast('Reading file…');try{S.hup=await hRead(t.files[0])}catch(e){S.hup=null;toast(e.message)}render.force=true;render();return}
});

/* self-update */
(function(){async function chk(){if(location.protocol==='file:')return;try{const t=await (await fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'})).text(),m=t.match(/const APP_V="(\d+)"/);if(m&&m[1]!==APP_V){const u=new URL(location.href);u.searchParams.set('v',m[1]);if(window.FIS&&FIS.newVersion)FIS.newVersion(u.toString());else location.replace(u.toString())}}catch(e){}}
  chk();document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})})();
const c=LS.get('cache');if(c&&S.token){S.entries=c.entries||[];S.docs=c.docs||{};S.at=c.at||''}
const ct=LS.get('td');if(ct&&ct.docs)S.td=ct.docs;
render();if(S.token&&API_URL)load(false);
setInterval(()=>{if(S.token&&!document.hidden)load(false)},5*60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.token)load(false)});
</script>
