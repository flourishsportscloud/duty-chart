<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2D5A">
<link rel="icon" href="../fis/fis-icon-192.png">
<title>PM Plan – Live</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--navy2:#26397d;--bg:#eef1f7;--card:#fff;--ink:#1d2433;--mut:#6b7488;--line:#dfe4ee;--green:#1e9e5a;--red:#d64545;--grey:#8d96a8;--amber:#c97b00;--blue:#3a63c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 12px 8px;position:sticky;top:0;z-index:20}
.h1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h1 h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.h1 h1 a{color:#fff;text-decoration:none;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px}
.who{display:flex;align-items:center;gap:6px;font-size:12px}
.who b{font-size:13px}.who button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:600}
.login{max-width:380px;margin:30px auto}.login label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.login select,.login input,.pwrow input{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #c7cfe2;border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;padding:10px 14px;font-size:14px;margin-top:12px;width:100%}
.btn.sec{background:#cfd6e8;color:var(--ink)}
.pwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pwrow .btn{margin:0;width:auto;padding:8px 10px;font-size:12px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.chip.live{background:#1e9e5a}.chip.err{background:#d64545}.chip.loc{background:#c97b00}
.seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:6px;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--navy)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--navy2);position:sticky;top:0}
nav button{flex:0 0 auto;border:0;background:rgba(255,255,255,.14);color:#fff;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600}
nav button.on{background:#fff;color:var(--navy)}
nav button small{display:block;font-weight:400;font-size:10px;opacity:.8}
.wrap{max-width:980px;margin:0 auto;padding:10px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.card h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.weeknav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.weeknav button.ar{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
.weeknav button.ar:disabled{opacity:.35}
.weeknav .wl{flex:1;text-align:center;font-weight:600;font-size:12px;color:var(--mut)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.day{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;color:var(--ink)}
.day b{display:block;font-size:15px}
.day .pc{font-weight:700;font-size:12px;margin-top:2px}
.day.g{background:#e3f6ec;border-color:#9ad8b7}.day.r{background:#fde8e8;border-color:#f0aaaa}
.day.today{box-shadow:0 0 0 2px var(--navy)}
.day.sel{border-color:var(--navy);border-width:2px;outline:2px solid var(--navy)}
.day.lock{opacity:.45}
.day .tg{font-size:9px;color:var(--navy);font-weight:700;height:11px}
.notice{padding:8px 10px;border-radius:8px;background:#fff6dd;color:#7a5600;font-size:12px;margin-bottom:10px}
.notice.info{background:#e9eefc;color:#2a3f86}
.notice.bad{background:#fde8e8;color:#9e2a2a}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.cnt{text-align:center;border-radius:8px;padding:6px 2px;background:#f3f5fa}
.cnt b{display:block;font-size:18px}.cnt span{font-size:10px;color:var(--mut)}
.cnt.d b{color:var(--green)}.cnt.n b{color:var(--red)}.cnt.a b{color:var(--grey)}
.bar{height:10px;border-radius:99px;background:#e6eaf3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.rd i{background:var(--red)}
.pct{font-size:22px;font-weight:800;color:var(--navy)}
.wk{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.wk .col{height:64px;display:flex;align-items:flex-end;background:#f3f5fa;border-radius:6px;overflow:hidden}
.wk .col i{width:100%;background:var(--grey);display:block}
.wk .col i.g{background:var(--green)}.wk .col i.r{background:var(--red)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sbox{border:1px solid var(--line);border-radius:8px;text-align:center;padding:5px 2px;font-size:11px}
.sbox b{display:block;font-size:14px}
.sbox.r{border-color:var(--red);background:#fde8e8}.sbox.g{border-color:#9ad8b7;background:#e3f6ec}
.nd{font-size:12px;line-height:1.5}
.nd div{padding:4px 0;border-bottom:1px dashed var(--line)}
.nd .bl{color:var(--mut)}
.ok{color:var(--green);font-weight:600;font-size:12px}
.blk{background:var(--card);border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.08);overflow:hidden}
.bh{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bh .bn{font-weight:700;flex:1;min-width:140px}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff}
.st.Done{color:var(--green)}.st.Missed,.st.Overdue{color:var(--red)}.st.Due{color:var(--amber)}.st.Upcoming{color:var(--blue)}.st.NoFixed{color:var(--grey)}
.tm-chip{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px;border:0;color:#fff}
.bpc{font-size:11px;opacity:.85}
.timed{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#eef1fb;flex-wrap:wrap;font-size:12px}
.timed input{padding:4px;font-size:14px}
.timed button{border:0;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--navy);color:#fff}
.timed button.sec{background:#cfd6e8;color:var(--ink)}
.item{border-top:1px solid var(--line);padding:8px 10px}
.item:first-of-type{border-top:0}
.ih{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;margin-bottom:4px}
.row{padding:5px 0 6px}
.row.sub{padding-left:10px;border-left:3px solid #dfe4ee;margin:2px 0}
.rl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.lbl{font-size:13px}
.rb{display:flex;gap:5px;flex:0 0 auto}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--navy)}
.mini.on{background:#e9eefc;border-color:#aebbe6}
.mini:disabled,.mini.ro{opacity:.5}
.boxes{display:flex;flex-wrap:wrap;gap:5px}
.box{min-width:56px;flex:0 0 auto;border:2px dashed #c5cce0;background:#fff;border-radius:9px;padding:3px 4px 4px;text-align:center;font-family:inherit;color:var(--ink);cursor:pointer;min-height:54px}
.box .sl{display:block;font-size:10px;color:var(--mut);height:12px}
.box .sy{display:block;font-size:17px;font-weight:800;line-height:22px;color:#b4bccd}
.box .tm{display:block;font-size:9px;color:var(--mut);line-height:11px}
.box .tm.late{color:var(--amber);font-weight:700}
.box.d{background:#e3f6ec;border:2px solid var(--green)}.box.d .sy{color:var(--green)}
.box.n{background:#fde8e8;border:2px solid var(--red)}.box.n .sy{color:var(--red)}
.box.a{background:#eceff5;border:2px solid var(--grey)}.box.a .sy{color:var(--grey)}
.box.ro{cursor:default}
.box.obs.oc{border:2px solid var(--oc);background:color-mix(in srgb,var(--oc) 16%,#fff)}.box.obs.oc .sy{color:var(--oc)}
.obsleg{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:10px;color:var(--mut);margin-top:3px}.obsleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.box.obs .tm{font-size:10px;line-height:12px;text-align:left;padding:0 2px}
.row.de{display:flex;align-items:center;gap:8px}
.row.de .rl{flex:1;margin:0}
.rembox{background:#f6f8fc;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px}
.rr{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.rr .sn{flex:0 0 36px;font-weight:700;font-size:12px;padding-top:6px}
.rr input,.rr textarea{font:inherit;font-size:13px;border:1px solid #c7cfe2;border-radius:6px;padding:5px 6px;background:#fff}
.rr input{width:70px;flex:0 0 70px}.rr textarea{flex:1;min-height:34px;resize:vertical}
.rr .by{font-size:10px;color:var(--mut);flex:0 0 auto;max-width:90px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.c{text-align:center;font-weight:700}
td.g{background:#e3f6ec;color:var(--green)}td.r{background:#fde8e8;color:var(--red)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.plc{border:1px solid var(--line);border-radius:10px;padding:10px}
.plc h4{margin:0 0 2px;color:var(--navy)}.plc small{color:var(--mut)}
.cat{margin-bottom:10px}.cat b{color:var(--navy)}
.cat .tot{float:right;font-weight:700}
.muted{color:var(--mut);font-size:12px}
.h1 h1 small{font-weight:400;font-size:11px;opacity:.8;display:block}
.bh .bn small{font-weight:400;opacity:.8;margin-left:6px;font-size:11px}
.nbox{display:block;width:62px;text-align:center}
.nbox .sl{display:block;font-size:10px;color:var(--mut)}
.nbox input{width:62px;font:inherit;font-size:15px;font-weight:700;text-align:center;border:2px dashed #c5cce0;border-radius:9px;padding:6px 2px;background:#fff}
.nbox input.f{border:2px solid var(--green);background:#e3f6ec;color:var(--green)}
.nbox .tm{display:block;font-size:9px;color:var(--mut);height:11px}
.blk.over .box:not(.d):not(.n):not(.a){border-color:var(--red);border-style:solid}.blk.over .nbox input:not(.f){border-color:var(--red);border-style:solid}
.due{border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px;background:#e9eefc;color:#2a3f86}.due.od{background:#fde8e8;color:#a32727}.due.ds{background:#fff4dc;color:#7a5600}.due.ok2{background:#e3f6ec;color:#17794a}
.legend{font-size:11px;color:var(--mut);margin-top:6px}
.box.obs .tm{font-size:9px;line-height:11px;text-align:left;padding:0 2px}
.phs{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center}
.ph{border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;width:64px;font-size:9px;color:var(--mut)}
.ph img{display:block;width:58px;height:58px;object-fit:cover;border-radius:6px;background:#eef1f7}
.phadd{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px dashed #c5cce0;border-radius:8px;font-size:11px;font-weight:600;color:var(--navy);cursor:pointer}
.phadd input{display:none}
.ph.up{opacity:.6;position:relative}.ph.fail{border-color:var(--red);color:var(--red);font-weight:700}
.med{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.med h5{margin:0 0 6px;font-size:12px;color:var(--navy)}
.mc{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px;background:#fbfcfe}
.mc .mt{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.mc .mn{font-weight:700}.mc .mx{font-size:12px;color:var(--mut);margin-top:2px}
.mc .tms{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.tmc{font-size:11px;border-radius:99px;padding:2px 8px;background:#e9eefc;color:#2a3f86;font-weight:600}
.tmc.ack{background:#fff1d6;color:#8a5a00}.tmc.fu{background:#e3f6ec;color:#16733f}
.mc .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.medf{display:grid;grid-template-columns:1fr 64px;gap:6px;margin-top:4px}
.medf input,.medf select,.tlr input,.tlr textarea{font:inherit;font-size:13px;border:1px solid #c7cfe2;border-radius:6px;padding:6px;background:#fff;min-width:0}
.medf .full{grid-column:1/-1}
.btn2{border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px;background:var(--navy);color:#fff}
.btn2.fu{background:#1e9e5a}.btn2.sm{padding:5px 9px;font-size:12px}
.tlsecs{display:flex;gap:6px;padding:8px 10px;background:#f3f5fa;flex-wrap:wrap;align-items:center}
.tlsecs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-weight:700;color:var(--navy)}
.tlsecs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tlr{border-top:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:74px 1fr;gap:6px 8px;align-items:start}
.tlr.now{background:#fff8e6;box-shadow:inset 3px 0 0 #e0a800}.tlr.past .tlt{color:var(--mut)}
.tlt{font-weight:700;font-size:12px;line-height:1.3}.tlt small{display:block;font-weight:600;color:#b07a00;font-size:10px}
.tlb{display:flex;flex-direction:column;gap:5px}
.tlo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.obsbtn{border:2px dashed #c5cce0;background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;color:var(--navy)}
.obsbtn.d{border:2px solid var(--green);background:#e3f6ec;color:var(--green)}
.sumt td,.sumt th{font-size:12px}
.phview{position:fixed;inset:0;background:rgba(10,15,30,.85);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.phview img{max-width:100%;max-height:80vh;border-radius:8px}.phview button{border:0;border-radius:8px;padding:8px 18px;font-weight:700}
/* ===== FIS premium theme · navy + gold (school logo colours) ===== */
:root{--navy:#1F2D5A;--navy2:#16214A;--navy3:#2B3C74;--gold:#E3A94F;--goldlt:#F4D9A6;--goldink:#8A5B12;--ac:#E3A94F;
--bg:#F5F3EE;--card:#fff;--card2:#F8F6F1;--ink:#1B2340;--ink2:#3A4260;--mut:#646B80;--faint:#9AA0B3;--line:#E6E2D8;--line2:#D5CFBF;
--head:#16214A;--head2:#1F2D5A;--accent:#1F2D5A;--accentS:#EAEEF8;
--green:#1F7A52;--greenS:#E6F1EA;--greenL:#A9D3BD;--red:#B83247;--redS:#F8E6EA;--redL:#E8B3BF;--amber:#A8670A;--amberS:#FBF1DC;--grey:#8A91A6;--greyS:#ECEEF4;--blue:#2F5BB5;
--serif:'Lora',Georgia,'Times New Roman',serif;--sh:0 1px 2px rgba(20,25,60,.05),0 6px 20px rgba(20,25,60,.04)}
body{background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy2),var(--navy) 60%,var(--navy3))!important;border-bottom:3px solid var(--gold);box-shadow:0 4px 18px rgba(15,22,50,.28)!important}
.h1 h1{font-family:var(--serif);font-weight:600;letter-spacing:.1px;gap:10px}
.h1 h1 small{display:block;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:2px}
.h1 h1 a{color:var(--goldlt)!important;border-color:rgba(227,169,79,.45)!important;background:rgba(227,169,79,.12)}
.hlogo{width:42px;height:42px;border-radius:11px;background:#fff;padding:3px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.who b{color:var(--goldlt)}
.who button{border-color:rgba(227,169,79,.5)!important;background:rgba(227,169,79,.14)!important;color:var(--goldlt)!important}
.chip{background:rgba(227,169,79,.16)!important;color:var(--goldlt)!important;border:1px solid rgba(227,169,79,.4)}
.chip.live{background:rgba(46,125,91,.35)!important;border-color:rgba(120,210,165,.5);color:#D5F5E5!important}
.chip.err{background:rgba(184,50,71,.4)!important;border-color:rgba(255,150,165,.5);color:#FFE0E5!important}
.seg{background:rgba(255,255,255,.08)!important;border:1px solid rgba(227,169,79,.4)}
.seg button{color:#DCE1F0!important}
.seg button.on{background:#fff!important;color:var(--navy2)!important}
nav{background:var(--navy2)!important;border-bottom:1px solid rgba(227,169,79,.35)!important;gap:8px!important;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{display:flex!important;flex-direction:column;align-items:flex-start;background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.13)!important;border-left:4px solid var(--ac)!important;color:#DCE1F0!important;border-radius:12px!important;font-family:var(--serif);font-weight:600!important;font-size:14px!important;padding:7px 14px 7px 12px!important}
nav button small{font-family:Inter,system-ui,sans-serif;color:#DCE1F0!important;opacity:.8;font-weight:500;font-size:10px!important}
nav button.on{background:#fff!important;color:var(--navy2)!important;border-color:#fff!important;border-left-color:var(--ac)!important;box-shadow:0 2px 10px rgba(0,0,0,.25)}
nav button.on small{color:var(--mut)!important;opacity:1}
.card,.plc,.blk,.kpi{border-radius:16px}
.card{border:1px solid var(--line);border-top:4px solid var(--ac,var(--navy));box-shadow:var(--sh)}
.card h3,.plc h4,.hero h2{font-family:var(--serif);color:var(--navy);font-weight:600}
.pct,.kpi .v,.cnt b,.sbox b,.day b{font-family:var(--serif)}
.pct,.day b{color:var(--navy)}
.plc{border-top:4px solid var(--ac,var(--navy))}
.kpi{border-top:3px solid var(--gold)}
.kpi.main{background:linear-gradient(135deg,var(--navy2),var(--navy3));border-color:var(--navy)}.kpi.main .k{color:var(--goldlt)}.kpi.main .v{color:#fff}
.day.sel{background:var(--navy);border-color:var(--navy);box-shadow:none;color:#C9D0E6}
.day.sel b,.day.sel .pc{color:#fff}.day.sel .tg{color:var(--gold)}
.day.today{box-shadow:0 0 0 2px var(--gold)}.day.today.sel{box-shadow:0 0 0 2px var(--gold)}
.day .tg{color:var(--goldink)}.day:not(.today) .tg{color:transparent}
.weeknav .wl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.bar i{background:linear-gradient(90deg,#C98A2B,var(--gold))!important}
.bar.rd i{background:linear-gradient(90deg,#9E2A3E,var(--red))!important}
.cnt{background:#F3F0E8;border-color:transparent}
.cnt span{text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:600}
.cnt.h b{color:var(--red)}
.bh{background:linear-gradient(90deg,var(--navy),var(--navy3))!important;color:#fff!important;border-left:5px solid var(--gold);border-bottom:0!important}
.bh .bn{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.02em;color:#fff}
.bh .bn small{font-family:Inter,sans-serif;font-weight:600;color:var(--goldlt);margin-left:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.bh .st{background:#fff!important}
.tm-chip{background:var(--gold)!important;color:var(--navy2)!important;border:0!important;font-weight:700}
.bpc{font-family:var(--serif);color:var(--gold)!important;font-size:13px}

<script>
/* ================= CONFIG ================= */
const secList=(cls,letters)=>{const o=[];cls.forEach(c=>[...letters].forEach(l=>o.push(c+l)));return o};
const PLS=[
 {id:'shally',ac:'#C2385B',name:'Sanjana',cls:'Class 1–2',sections:secList([1,2],'ABC')},
 {id:'neetu',ac:'#5F3585',name:'Neetu',cls:'Class 3',sections:secList([3],'ABC')},
 {id:'divyanshi',ac:'#2B8FBF',name:'Divyanshi',cls:'Class 4',sections:secList([4],'ABC')},
 {id:'diksha',ac:'#D98E1F',name:'Diksha',cls:'Class 5',sections:secList([5],'ABC')}
];
const SENIORS=[{id:'dean',name:'Dean of Academics'},{id:'director',name:'Director–Admin'}];
const PEOPLE=[...PLS.map(p=>({id:p.id,name:p.name,pl:p.id})),...SENIORS.map(s=>({id:s.id,name:s.name,senior:true}))];

/* Day Plan — PM PLAN – DAY PLAN. kind:'num' = a count per section. rem:1 remark, rem:'n' number + remark,
   rem:'p' photo log. yn:1 shows YES / NO. multi:1 = tap each time you check (every tap is saved with its time).
   one:1 = one box for the whole PM (not per section). Block ids are fixed server-side for due-time overrides. */
const DP=[
{id:'att',name:'Attendance',time:'08:30',items:[
 {id:'total',name:'Total Attendance',kind:'num'},{id:'present',name:'Present',kind:'num'},{id:'absent',name:'Absent',kind:'num'},
 {id:'latec',name:'Late Comer',rem:1},{id:'sbverify',name:'Verify SB Attendance & Register',rem:1},
 {id:'uniformd',name:'Uniform Defaulter',rem:1},{id:'earlyl',name:'Early Leaver',rem:'n'}]},
{id:'morn',name:'Morning Observation',time:'08:30',items:[
 {id:'assembly',name:'Assembly',rem:1},{id:'fruit',name:'Fruit Break',rem:1},{id:'testexec',name:'Test Execution',rem:1}]},
{id:'admin',name:'DCR – Action',time:'10:30',items:[
 {id:'dcrerr',name:'Errors',rem:1},{id:'dcrabs',name:'Absentees Work Allocation',rem:1},
 {id:'dcrbook',name:'Book',rem:'n',yn:1},{id:'dcrnb',name:'Notebook',rem:'n',yn:1},{id:'dcrassign',name:'Assignment',rem:'n',yn:1},
 {id:'dcrincomp',name:'Incomplete Work Action',rem:1},{id:'dcrdef',name:'Defaulters',rem:'n'},{id:'dcrprev',name:'Previous Day Defaulter Collection',rem:1}]},
{id:'reports',name:'Proof Reading',tag:'number / remark',time:'11:00',items:[
 {id:'proof',name:'Proof Reading',rem:'n',subs:[['diary','Diary'],['book','Book'],['notebook','Notebook']]}]},
{id:'comm',name:'PM Rounds',time:'12:30',items:[
 {id:'lfr',name:'Lost and Found',rem:1},{id:'statrev',name:'Stationery Review',rem:1},{id:'sbmon',name:'Stayback Monitoring',rem:1},
 {id:'sblunchr',name:'Stayback Lunch',rem:1},{id:'distr',name:'Distribution Round',rem:1},{id:'bookrev',name:'Book Review',rem:1}]},
{id:'welfare',name:'Student Welfare',time:'14:00',items:[
 {id:'medicalr',name:'Medical',rem:1,med:1},{id:'lunchcase',name:'Lunch Observation – Case',rem:1},{id:'washcase',name:'Washroom Cases',rem:1},{id:'sblunchcase',name:'Stayback Lunch Case',rem:1}]},
{id:'campus',name:'Washroom',tag:'tap each time you check · up to 5 · or NA',time:null,items:[
 {id:'wr_dry',name:'Dryness',multi:1,one:1,max:5},{id:'wr_clean',name:'Cleanliness',multi:1,one:1,max:5},{id:'wr_supply',name:'Supplies',multi:1,one:1,max:5},
 {id:'wr_img',name:'Washroom Images',rem:'p',one:1},{id:'wr_light',name:'Lights',multi:1,one:1,max:5},{id:'wr_fan',name:'Fans',multi:1,one:1,max:5}]},
{id:'audit',name:'Other Subjects Observations',time:null,items:[
 {id:'osskill',name:'Skill Course',rem:1},{id:'osfl',name:'Foreign Language',rem:1},{id:'osart',name:'Art',rem:1},{id:'oslib',name:'Library',rem:1},{id:'oscomp',name:'Computer Lab',rem:1}]}
];
/* Day End — PM PLAN – DAY END TASKS. sec:1 = marked per section; otherwise one tick per item.
   rem:'n' = number + remark per section, rem:'c' = number + colour, rem:'p' = photo log per section. Ids start with e_ so they never clash with Day Plan rows. */
const DE=[
{id:'de1',name:'Parent Communication',time:'13:30',items:[
 {id:'e_diaryparent',name:'Parent Communication',sec:1,rem:'n',subs:[['diary','Diary to Parent'],['lessonpdf','Lesson PDF'],['testpdf','Test paper PDF'],['hwsms','Home Task SMS']]},
 {id:'e_defsms',name:'Defaulter SMS',subs:[['diary','Diary'],['booknb','Book-Notebook'],['test','Test'],['assign','Assignment']]}]},
{id:'de2',name:'Class Group',time:'15:00',items:[
 {id:'e_classgroup',name:'Class Group',subs:[['fg','Feedback Group'],['admin','Admin'],['preprimary','Pre-Primary communication'],['floor','Floor manager'],['cm','Class manager'],['stock','Stock'],['epl','EPL']]}]},
{id:'de3',name:'Day-End Review',time:'15:30',items:[
 {id:'e_ctp',name:'Class Test Performers'},{id:'e_chkcm',name:'Checking Status Review – CM'},{id:'e_chkmentor',name:'Checking Status Review – Mentor'},
 {id:'e_distcoll',name:'Distribution – Collection Record'},{id:'e_schedule',name:'Schedule Discussion'},{id:'e_cmplan',name:'CM Plan'},
 {id:'e_teacherprep',name:'Teacher / Next Day Prep',sec:1,subs:[['lessonrev','Book / Lesson Review'],['content','Content'],['checkednb','Checked Notebook'],['checked','Checked Assignment'],['checkedtest','Checked Test'],['key','Assignment Answer Key'],['epl','EPL / Activity Prep'],['video','Video'],['ppt','PPT'],['viva','Viva'],['testdrive','Test on Drive'],['lessoninit','Lesson Initiative (Knowledge Spotlight / Literacy Lens)']]},
 {id:'e_supply',name:'Supply Chain',sec:1,subs:[['checked','Checked Assignment'],['testnb','Test NB'],['notebook','Notebook'],['book','Book'],['nextassign','Next Day Assignment'],['stockreq','Stock Requirement']]},
 {id:'e_infra',name:'Infrastructure',sec:1,subs:[['light','Light off'],['fan','Fan off'],['ac','AC off'],['dboard','Digital Board']]},
 {id:'e_furn',name:'Furniture (Number / Colour)',sec:1,rem:'c'},
 {id:'e_cupb',name:'Classroom Cupboards (Image log)',sec:1,rem:'p'},
 {id:'e_water',name:'Water Bottle',sec:1}]},
{id:'de4',name:'Feedback & Discussion',time:'15:00',items:[
 {id:'e_feedback',name:'Feedback',subs:[['studybase','Studybase'],['calllog','Call Log'],['diary','Diary'],['ohm','OHM']]},
 {id:'e_discussion',name:'Discussion',subs:[['classroom','Classroom Discussion'],['lesson','Lesson / Learning'],['class','Class'],['teacher','Teacher']]}]},
{id:'de5',name:'Audit & Update',time:'15:30',items:[
 {id:'e_route',name:'Route Plan'},{id:'e_cocurr',name:'Co-Curricular'},{id:'e_record',name:'Record Register'},{id:'e_folder',name:'Class Folder'},{id:'e_library',name:'Library Record'}]}
];
const DEFS={dp:DP,de:DE};
const WEEKLY=[['classobs','Classroom Observation'],['groupremark','Group Remark Discussion'],['feedback','Feedback Discussion'],['display','Class Display'],['awards','Weekly Awards'],['comp','Competitions Plan / Announcement'],['weekend','Weekend Audit']];
const WKBLOCK={id:'wkblock',name:'Observation Update',time:null};
const WEEKEND=[['wa_cert','Certificate'],['wa_display','Class Display'],['wa_cupb','Cupboard'],['wa_dcr','DCR Audit – Error SMS']];
const WEBLOCK={id:'weblock',name:'Weekend Audit',time:null};
/* Class Timeline (Day Plan): half-hour slots per section — activity, an "Observed" time stamp and a remark.
   Kept out of the completion % (it is a log, not a checklist). Keys: tl0800__A etc. */
const TL_START=8*60,TL_END=14*60+30;const TLBLOCK={id:'tline',name:'Class Timeline',time:null};
const TLSLOTS=[];for(let m=TL_START;m<TL_END;m+=30){const k='tl'+String(Math.floor(m/60)).padStart(2,'0')+String(m%60).padStart(2,'0');TLSLOTS.push({key:k,from:m,to:m+30})}

const ROWS={dp:[],de:[]};const ROWMAP={};
Object.keys(DEFS).forEach(m=>DEFS[m].forEach(b=>{b.mode=m;b.items.forEach(it=>{
  if(it.subs)it.subs.forEach(s=>ROWS[m].push({key:it.id+'-'+s[0],item:it,label:s[1],block:b,mode:m,rem:it.rem||1,kind:'',sub:true}));
  else ROWS[m].push({key:it.id,item:it,label:it.name,block:b,mode:m,rem:it.rem||1,kind:it.kind||'',sub:false});
})}));
Object.keys(ROWS).forEach(m=>ROWS[m].forEach(r=>ROWMAP[r.key]=r));
/* Follow-up checks: 3 extra ticks under these items (not counted in block %), so the PM records how many times the item was checked */
const FU_IDS=['washcase','wr_dry','wr_clean','wr_supply'];const FUROWS={};
ROWS.dp.filter(r=>FU_IDS.indexOf(r.key)>=0).forEach(r=>{FUROWS[r.key]=[1,2,3].map(n=>{

const queues={};

async function api(fn,args){

}
const unacked={},inflight={};
const hasPend=u=>!!(u&&(Object.keys(u.cells).length||Object.keys(u.rem).length||(u.med&&u.med.length)));
function applyMed(list,m,by){
  const e=list.find(x=>x.id===m.id);const now=Date.now();
  if(m.op==='add'&&!e)list.push({id:m.id,name:m.name,sec:m.sec,x:m.x||'',ack:{at:now,by:by},fu:[]});
  else if(!e)return list;
  else if(m.op==='fu')e.fu.push({at:now,by:by});
  else if(m.op==='unfu')e.fu.pop();
  else if(m.op==='note')e.x=m.x;
  else if(m.op==='del')return list.filter(x=>x.id!==m.id);
  return list;
}
function overlay(id,doc){
  doc.cells=doc.cells||{};doc.rem=doc.rem||{};doc.med=doc.med||[];
  [inflight[id],unacked[id],typed[id]].forEach(u=>{if(u){
    Object.keys(u.cells).forEach(k=>{const c=u.cells[k];doc.cells[k]=c.ops?applyOps(doc.cells[k],c.ops,whoName()):clone(c)});
    Object.assign(doc.rem,clone(u.rem));
    (u.med||[]).forEach(m=>{doc.med=applyMed(doc.med,m,whoName())})}});
  return doc;
}
function persist(id,patch){
  const u=unacked[id]=unacked[id]||{cells:{},rem:{},med:[]};u.med=u.med||[];
  (patch.med||[]).forEach(m=>u.med.push(clone(m)));
  Object.keys(patch.cells||{}).forEach(k=>{const c=clone(patch.cells[k]);
    if(c.ops&&u.cells[k]&&u.cells[k].ops)u.cells[k].ops=u.cells[k].ops.concat(c.ops);else u.cells[k]=c});
  Object.assign(u.rem,clone(patch.rem||{}));
  saveLocal();
  if(!API_URL)return;
  enqueue(id,()=>sendDoc(id));
}
async function sendDoc(id){
  const u=unacked[id];if(!hasPend(u))return;
  inflight[id]=u;unacked[id]={cells:{},rem:{},med:[]};
  try{
    const doc=await api('pmSave',[id,u]);
    delete inflight[id];if(u.med&&u.med.length&&!('med' in doc))showMsg('Medical cases need the new server script (pm/Code.gs) — ask the Director to update it.');
    S.docs[id]=overlay(id,doc);setConn('live');saveLocal();render();
  }catch(e){
    delete inflight[id];
    if(e.server){showMsg(e.message);poll()}
    else{const n=unacked[id];Object.keys(n.cells).forEach(k=>{const c=n.cells[k];if(c.ops&&u.cells[k]&&u.cells[k].ops)u.cells[k].ops=u.cells[k].ops.concat(c.ops);else u.cells[k]=c});
      unacked[id]={cells:u.cells,rem:Object.assign(u.rem,n.rem),med:(u.med||[]).concat(n.med||[])};setConn('err');retrySoon()}
  }
}
let retryT=null;function retrySoon(){clearTimeout(retryT);retryT=setTimeout(()=>{Object.keys(unacked).forEach(id=>{if(hasPend(unacked[id]))enqueue(id,()=>sendDoc(id))})},4000)}
let polling=false;
async function poll(){
  if(!API_URL||polling||!S.token)return;polling=true;const wk=S.wk;
  try{
    Object.keys(unacked).forEach(id=>{if(hasPend(unacked[id]))enqueue(id,()=>sendDoc(id))});
    const v=await api('pmState',[wk]);
    if(wk===S.wk){
      Object.keys(S.docs).forEach(id=>{if(S.docs[id].wk===wk&&!v.docs[id]&&!hasPend(unacked[id])&&!inflight[id])delete S.docs[id]});
      Object.keys(v.docs).forEach(id=>{S.docs[id]=overlay(id,v.docs[id])});
      S.times=v.times||{};
      if(v.me){S.me=Object.assign(S.me||{},v.me);try{localStorage.setItem('pmplan_me',JSON.stringify(S.me))}catch(e){}}
    }
    setConn('live');saveLocal();render();
  }catch(e){setConn('err')}
  finally{polling=false}
}

/* ================= MUTATIONS ================= */
function ensureDoc(id,plId,mode,date){
  if(!S.docs[id])S.docs[id]={pl:plId,mode:mode,date:date,wk:mode==='wk'?date:ds(mondayOf(parseD(date))),cells:{},rem:{}};
  const d=S.docs[id];d.cells=d.cells||{};d.rem=d.rem||{};d.med=d.med||[];return d;
}
function mkCell(rk,s,now,wk){
  const r=ROWMAP[rk];const due=(!wk&&r)?dueOf(r.block):null;
  const late=(s&&due&&S.date===todayStr()&&nowMin()>toMin(due))?1:0;
  return{s:s,by:whoName(),at:now,l:late};
}
function setCells(plId,list,wk){
  if(!canAct(plId,wk))return;
  const mode=wk?'wk':S.mode;
  const id=wk?docId(plId,'wk',S.wk):docId(plId,mode,S.date);
  const doc=ensureDoc(id,plId,mode,wk?S.wk:S.date);
  const now=Date.now();const patch={cells:{}};
  list.forEach(x=>{const key=x[0]+'__'+x[1];const c=mkCell(x[0],x[2],now,wk);doc.cells[key]=c;patch.cells[key]=clone(c)});
  persist(id,patch);render();
}
const NEXT={'':'D',D:'N',N:'A',A:''};
const OBS_MAX=10;
function applyOps(cell,ops,by){
  const obs=((cell&&cell.obs)||[]).slice();let na=!!(cell&&cell.na);
  ops.forEach(o=>{if(o==='add'){na=false;obs.push(Date.now())}else if(o==='pop')obs.pop();else if(o==='na'){na=!na;if(na)obs.length=0}});
  const c={s:na?'A':(obs.length?'D':''),obs:obs,by:by,at:Date.now(),l:0};if(na)c.na=1;return c;
}
function doObs(plId,rk,sec,op){
  if(!canAct(plId))return;
  const mode=S.mode,id=docId(plId,mode,S.date),doc=ensureDoc(id,plId,mode,S.date),key=rk+'__'+sec;
  const n=((doc.cells[key]&&doc.cells[key].obs)||[]).length;const r=ROWMAP[rk];const mx=(r&&r.item.max)||(r&&r.tl?1:OBS_MAX);
  if(op==='add'&&n>=mx){showMsg(r&&r.tl?'Already marked observed — tap ↶ to undo.':'Up to '+mx+' checks a day.');return}
  if(op==='pop'&&!n)return;
  doc.cells[key]=applyOps(doc.cells[key],[op],whoName());
  persist(id,{cells:{[key]:{ops:[op]}}});render();
}
function doTick(plId,rk,sec,wk){
  if(!canAct(plId,wk))return;
  const id=wk?docId(plId,'wk',S.wk):docId(plId,S.mode,S.date);const c=S.docs[id]&&S.docs[id].cells[rk+'__'+sec];
  setCells(plId,[[rk,sec,NEXT[(c&&c.s)||'']]],wk);
}
const timers={},pend={},typed={};
function schedule(id,key){(pend[id]=pend[id]||new Set()).add(key);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700)}
function flush(id){
  clearTimeout(timers[id]);const keys=pend[id];if(!keys||!keys.size)return;pend[id]=new Set();
  const t=typed[id]||{cells:{},rem:{}};delete typed[id];const patch={cells:{},rem:{}};
  keys.forEach(k=>{if(t.rem[k])patch.rem[k]=clone(t.rem[k]);if(t.cells[k])patch.cells[k]=clone(t.cells[k])});
  persist(id,patch);
}
function flushAll(){Object.keys(pend).forEach(flush)}
function onRemInput(el){
  const plId=el.dataset.pl,rk=el.dataset.row,sec=el.dataset.sec,f=el.dataset.f;
  if(!canAct(plId))return;
  const mode=ROWMAP[rk].mode;const dd=mode==='wk'?S.wk:S.date;const id=docId(plId,mode,dd),doc=ensureDoc(id,plId,mode,dd),key=rk+'__'+sec;
  if(f==='num'){
    const v=el.value;doc.cells[key]={s:v!==''?'D':'',n:v,by:whoName(),at:Date.now(),l:0};
  }else{
    const e=doc.rem[key]||{x:''};e[f]=el.value;e.by=whoName();e.at=Date.now();doc.rem[key]=e;
    const has=(e.n!==''&&e.n!=null)||String(e.x||'').trim()!=='';
    if(!ROWMAP[rk].tl&&!/^med-/.test(rk)&&has&&!(doc.cells[key]&&doc.cells[key].s==='D'))doc.cells[key]=mkCell(rk,'D',Date.now(),mode==='wk');
  }
  const t=typed[id]=typed[id]||{cells:{},rem:{}};
  if(doc.rem[key])t.rem[key]=clone(doc.rem[key]);if(doc.cells[key])t.cells[key]=clone(doc.cells[key]);
  schedule(id,key);
}

/* ================= STATS ================= */
function cellS(doc,rk,sec){const c=doc&&doc.cells&&doc.cells[rk+'__'+sec];return (c&&c.s)||''}
function countRows(doc,pl,rows){
  const o={D:0,N:0,A:0,P:0,T:0};
  rows.forEach(r=>secsOf(pl,r).forEach(s=>{const v=cellS(doc,r.key,s);o.T++;o[v||'P']++}));
  o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o;
}
const stats=(doc,pl,mode)=>countRows(doc,pl,ROWS[mode]);
const getDoc=(pl,mode,date)=>S.docs[docId(pl.id,mode,date)];
const getWkDoc=(pl,wk)=>S.docs[docId(pl.id,'wk',wk)];
function blockInfo(doc,pl,b,date){
  const rows=ROWS[b.mode].filter(r=>r.block===b);const c=countRows(doc,pl,rows);const due=dueOf(b);const today=todayStr();
  let st,cls;
  if(c.P===0&&c.N===0){st='Done';cls='Done'}
  else if(date<today){st='Missed';cls='Missed'}
  else if(date>today){st='Upcoming';cls='Upcoming'}
  else if(c.P===0&&c.N>0){st='Missed';cls='Missed'}
  else if(!due){st='No fixed time';cls='NoFixed'}
  else{const m=nowMin(),d=toMin(due);if(m>d){st='Overdue';cls='Overdue'}else if(d-m<=30){st='Due soon';cls='Due'}else{st='Upcoming';cls='Upcoming'}}
  return{c:c,st:st,cls:cls,due:due};
}
function dayClass(c,date){if(date>todayStr())return 'lock';if(c.T&&c.N>0)return 'r';if(c.T&&c.pct===100)return 'g';return ''}
function sumStats(list){const o={D:0,N:0,A:0,P:0,T:0};list.forEach(c=>{['D','N','A','P','T'].forEach(k=>o[k]+=c[k])});o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o}
const dayStats=(date,list)=>sumStats(list.map(pl=>stats(getDoc(pl,S.mode,date),pl,S.mode)));
function wkDone(pl,wk,rows){rows=rows||WKROWS;const d=getWkDoc(pl,wk);let n=0;rows.forEach(r=>{const v=cellS(d,r.key,'x');if(v==='D'||v==='A')n++});return n}

  let h=`<details class="card" data-k="${dk}" ${detOpen(dk,false)?'open':''}><summary style="cursor:pointer;font-weight:700">Numbers &amp; remarks <span class="muted" style="font-weight:500">· extra notes only — the done / not-done check is above · ${cnt} entr${cnt===1?'y':'ies'}</span></summary>`;
  if(!names.length)return h+`<div class="muted">No numbers or remarks recorded for this day.</div></details>`;
  names.forEach(n=>{
    const c=cats[n];
    h+=`<div class="cat"><b>${esc(n)}</b>${c.hasNum?`<span class="tot">Total: ${c.tot}</span>`:''}<table><tr><th>Section</th><th>No.</th><th>Remark</th><th>By · time</th></tr>`+
      c.list.map(e=>`<tr><td>${list.length>1?esc(e.pl.name)+' · ':''}${esc(e.sec)}</td><td>${esc(e.n)}</td><td>${esc(e.x)}</td><td>${esc(e.by||'')}${e.at?' · '+fmtT(e.at):''}</td></tr>`).join('')+`</table></div>`;

}
function weekChart(pl){

    const c=stats(getDoc(pl,S.mode,d),pl,S.mode);const fut=d>today;

    return `<div><div class="col">${fut?'':`<i class="${cl}" style="height:${c.pct}%"></i>`}</div>${DAYN[i]}<br><b>${fut?'–':c.pct+'%'}</b></div>`;
  }).join('')+`</div>`;
}
function sectionBoxes(pl,doc,mode){
  const rows=ROWS[mode].filter(r=>secsOf(pl,r)[0]!=='x');
  return `<div class="secs">`+pl.sections.map(s=>{
    let d=0,h=0,t=0;rows.forEach(r=>{const v=cellS(doc,r.key,s);t++;if(v==='D'||v==='A')d++;if(v==='N')h++});
    const p=t?Math.round(d/t*100):0;
    return `<div class="sbox ${h?'r':p===100?'g':''}">${esc(s)}<b>${p}%</b>${h?`<span style="color:var(--red)">${h} ✗</span>`:''}</div>`;

}
function dueBanner(pl,doc){

}
function plPage(pl){

    `<div class="counts" style="margin-top:8px"><div class="cnt d"><b>${c.D}</b><span>Done</span></div><div class="cnt n"><b>${c.N}</b><span>Not Done</span></div><div class="cnt a"><b>${c.A}</b><span>NA</span></div><div class="cnt"><b>${c.P}</b><span>Pending</span></div></div>`+

  if(mode==='dp')cwCarry(pl);

  if(mode==='dp')h+=daySummary([pl]);

/* ================= DONE / NOT-DONE CHECK · CARE WATCH · REPORT CARDS (shared by PL and PM Plan) =================
   Every section of every task is ✓ done · NA · ✗ marked Not Done · ! not marked although its time is over
   (any past day, or today after the block's due time — blocks with no fixed time after END_DAY) · · still to come.
   Care-watch children are kept in the day's record under cw-<id> keys (no server change needed); regular names
   carry forward to the next working day. Guideline checks: a medical case and a regular care-watch child must be met
   at least twice in the day. */
const END_DAY='15:30';
const SYM={D:'✓',A:'NA',N:'✗',M:'!',P:'·'};
const WHO='PM';
const TC_SECS=(pl,mode,r)=>secsOf(pl,r);
const MEET_MIN=2;
function isDueNow(b,date){const t=todayStr();if(date<t)return true;if(date>t)return false;return nowMin()>toMin((b&&dueOf(b))||END_DAY)}
function stOf(doc,r,sec,date){const c=doc&&doc.cells&&doc.cells[r.key+'__'+sec];if(c&&c.s)return c.s;return isDueNow(r.block,date)?'M':'P'}
const rowLabel=r=>r.sub?r.item.name+' › '+r.label:r.label;
const shortN=pl=>pl.name.split(' ')[0];
function dayEmpty(pl,date){return ['dp','de'].every(m=>{const d=getDoc(pl,m,date);return !d||!Object.keys(d.cells||{}).some(k=>d.cells[k]&&(d.cells[k].s||(d.cells[k].obs&&d.cells[k].obs.length)))})}
function remLines(pl,doc,r,mode){
  const out=[];TC_SECS(pl,mode,r).forEach(sec=>{
    const k=r.key+'__'+sec;const e=doc&&doc.rem&&doc.rem[k];const a=doc&&doc.rem&&doc.rem['ac-'+k];const c=doc&&doc.cells&&doc.cells[k];
    const x=e&&String(e.x||'').trim(),ac=a&&String(a.x||'').trim();
    let n=e&&e.n!==''&&e.n!=null?e.n:'';if(n===''&&c&&c.n!==''&&c.n!=null&&c.n!==undefined)n=c.n;
    const ph=e&&e.ph&&e.ph.length?e.ph.length:0;
    if(x||n!==''||ac||ph)out.push({sec,x,n,ac,ph,by:(e&&e.by)||(a&&a.by)||''});
  });return out;
}
function remLineHTML(pl,l,withName){return `<div>${withName?`<b>${esc(shortN(pl))}${l.sec!=='x'?' · '+esc(l.sec):''}</b>`:`<b>${l.sec!=='x'?esc(l.sec):''}</b>`}${l.n!==''?' #'+esc(l.n):''}${l.x?': '+esc(l.x):''}${l.ph?' 📷'+l.ph:''}${l.ac?` <span class="ac">→ Action: ${esc(l.ac)}</span>`:''}</div>`}

/* ---------- Care watch (washroom / urine, water, lunch, other) ---------- */
const CW_TYPES={wr:'🚻 Washroom / urine',wt:'💧 Water',ln:'🍱 Lunch / food',ot:'⚕ Other'};
const CW_CHK=[['lb','Lunch box'],['fb','Fruit box'],['wb','Water bottle']];
function careList(doc){
  const out=[];if(!doc||!doc.rem)return out;
  Object.keys(doc.rem).forEach(k=>{const m=/^cw-([a-z0-9]+)__x$/.exec(k);if(!m)return;let v=null;try{v=JSON.parse(doc.rem[k].x||'null')}catch(e){}
    if(!v||!v.n)return;const id=m[1];const c=doc.cells&&doc.cells['cw-'+id+'__x'];const ac=doc.rem['cw-'+id+'-ac__x'];
    const chk={};CW_CHK.forEach(([q])=>{const cc=doc.cells&&doc.cells['cw-'+id+'-'+q+'__x'];chk[q]=(cc&&cc.s)||''});
    out.push({id,n:v.n,s:v.s||'',t:v.t||'ot',k:v.k||'r',at:doc.rem[k].at||0,by:doc.rem[k].by||'',met:(c&&c.obs)||[],chk,ac:ac?String(ac.x||''):''});});
  return out.sort((a,b)=>(a.k===b.k?0:a.k==='r'?-1:1)||a.at-b.at);
}
const hasCareKeys=doc=>!!(doc&&doc.rem&&Object.keys(doc.rem).some(k=>/^cw-[a-z0-9]+__x$/.test(k)));
function careBad(c,date){return c.k==='r'&&c.met.length<MEET_MIN&&isDueNow(null,date)}
function medList(pl,date){const d=getDoc(pl,'dp',date);return ((d&&d.med)||[]).map(m=>({id:m.id,n:m.name,s:m.sec||'',x:m.x||'',met:[m.ack?m.ack.at:0].concat((m.fu||[]).map(f=>f.at)).filter(Boolean)}))}
const medBad=(m,date)=>m.met.length<MEET_MIN&&isDueNow(null,date);
const cwid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function cwCell(plId,key,s){
  const id=docId(plId,'dp',S.date);const doc=ensureDoc(id,plId,'dp',S.date);
  const c={s:s,by:whoName(),at:Date.now(),l:0};doc.cells[key]=c;persist(id,{cells:{[key]:clone(c)}});
}
function cwPanel(pl,doc,editable){
  const list=careList(doc);const date=S.date;
  let h=`<div class="cw"><div class="cwh">👶 Care watch <span class="muted">— children to check through the day (met at least ${MEET_MIN}×)</span></div>`;
  list.forEach(c=>{
    const bad=careBad(c,date);
    h+=`<div class="cwc ${bad?'bad':''} ${c.k==='o'?'one':''}"><div class="cwt"><div><b>${esc(c.n)}</b>${c.s?' · '+esc(c.s):''} <span class="cwty">${CW_TYPES[c.t]||''}</span> ${c.k==='o'?'<span class="cwty o">Today only</span>':''}</div>`+
      (editable?`<button class="mini" data-act="cwdel" data-pl="${pl.id}" data-id="${c.id}">Remove</button>`:'')+`</div>`+
      `<div class="tms">${c.met.map((t,i)=>`<span class="tmc fu">Met ${i+1} · ${fmtT(t)}</span>`).join('')||`<span class="tmc ${bad?'no':''}">Not met yet</span>`}${c.k==='r'?`<span class="tmc ${c.met.length>=MEET_MIN?'fu':'ack'}">${c.met.length}/${MEET_MIN}</span>`:''}</div>`+
      `<div class="acts">${editable?`<button class="btn2 fu sm" data-act="cwmet" data-pl="${pl.id}" data-id="${c.id}">+ Met now</button>${c.met.length?`<button class="mini" data-act="cwunmet" data-pl="${pl.id}" data-id="${c.id}">↶</button>`:''}`:''}`+
      CW_CHK.map(([q,lbl])=>{const v=c.chk[q];return `<button class="cwk ${v}" ${editable?`data-act="cwchk" data-pl="${pl.id}" data-id="${c.id}" data-q="${q}"`:'disabled'}>${lbl} ${v==='D'?'✓':v==='N'?'✗':v==='A'?'NA':''}</button>`}).join('')+`</div>`+
      `<input class="cwin" data-pl="${pl.id}" data-id="${c.id}" placeholder="Observation / action taken (optional)" value="${esc(c.ac)}" ${editable?'':'readonly'}></div>`;
  });
  if(!list.length)h+=`<div class="muted" style="margin:4px 0 8px">No child on the care watch today.</div>`;
  if(editable)h+=`<div class="cwf"><input class="cwin" id="cwn_${pl.id}" placeholder="Child's name" autocomplete="off"><select class="cwin" id="cws_${pl.id}">${pl.sections.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`+
    `<select class="cwin" id="cwt_${pl.id}">${Object.keys(CW_TYPES).map(k=>`<option value="${k}">${CW_TYPES[k]}</option>`).join('')}</select><select class="cwin" id="cwk_${pl.id}"><option value="r">Regular – check daily</option><option value="o">Today only (unusual case)</option></select>`+
    `<button class="btn2 full" data-act="cwadd" data-pl="${pl.id}">+ Add child</button></div>`;
  return h+`</div>`;
}
function cwAdd(plId){
  if(!canAct(plId))return;const g=x=>document.getElementById(x+'_'+plId);
  const n=(g('cwn').value||'').trim();if(!n){showMsg("Type the child's name.");g('cwn').focus();return}
  const id=cwid();const key='cw-'+id+'__x';
  const docI=docId(plId,'dp',S.date);const doc=ensureDoc(docI,plId,'dp',S.date);
  const e={x:JSON.stringify({n:n.slice(0,60),s:g('cws').value,t:g('cwt').value,k:g('cwk').value}),by:whoName(),at:Date.now()};
  cwRemSave(docI,doc,key,e);render(true);
}
function cwDel(plId,cid){const docI=docId(plId,'dp',S.date);const doc=ensureDoc(docI,plId,'dp',S.date);cwRemSave(docI,doc,'cw-'+cid+'__x',{x:'',by:whoName(),at:Date.now()});render(true)}
function cwMet(plId,cid,op){
  if(!canAct(plId))return;const id=docId(plId,'dp',S.date);const doc=ensureDoc(id,plId,'dp',S.date);const key='cw-'+cid+'__x';
  if(op==='pop'&&!((doc.cells[key]&&doc.cells[key].obs)||[]).length)return;
  doc.cells[key]=applyOps(doc.cells[key],[op],whoName());persist(id,{cells:{[key]:{ops:[op]}}});render(true);
}
const CYC={'':'D',D:'N',N:'A',A:''};
function cwChk(plId,cid,q){if(!canAct(plId))return;const doc=ensureDoc(docId(plId,'dp',S.date),plId,'dp',S.date);const key='cw-'+cid+'-'+q+'__x';cwCell(plId,key,CYC[(doc.cells[key]&&doc.cells[key].s)||'']);render(true)}
function cwAc(el){const plId=el.dataset.pl;if(!canAct(plId)||!el.dataset.id)return;const docI=docId(plId,'dp',S.date);const doc=ensureDoc(docI,plId,'dp',S.date);
  cwRemSave(docI,doc,'cw-'+el.dataset.id+'-ac__x',{x:el.value.slice(0,300),by:whoName(),at:Date.now()},true)}
/* Regular names carry forward: on a new day the list from the last working day is copied in once. */
const cwDone={};let cwPrevBusy=false;
function cwCarry(pl){
  const date=S.date;if(date!==todayStr()||!canAct(pl.id)||cwDone[pl.id+date])return;
  const doc=getDoc(pl,'dp',date);if(hasCareKeys(doc)){cwDone[pl.id+date]=1;return}
  const prev=Object.keys(S.docs).filter(id=>{const d=S.docs[id];return d.pl===pl.id&&d.mode==='dp'&&d.date<date&&hasCareKeys(d)}).map(id=>S.docs[id]).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!prev){
    if(cwPrevBusy||cwDone['prev'+S.wk])return;cwPrevBusy=true;
    const m=parseD(S.wk);m.setDate(m.getDate()-7);
    api('pmState',[ds(m)]).then(v=>{Object.keys(v.docs||{}).forEach(id=>{if(!S.docs[id])S.docs[id]=v.docs[id]})}).catch(()=>{}).finally(()=>{cwPrevBusy=false;cwDone['prev'+S.wk]=1;render()});
    return;
  }
  cwDone[pl.id+date]=1;
  const regs=careList(prev).filter(c=>c.k==='r');if(!regs.length)return;
  const id=docId(pl.id,'dp',date);const d=ensureDoc(id,pl.id,'dp',date);const patch={rem:{}};
  regs.forEach(c=>{const key='cw-'+c.id+'__x';d.rem[key]={x:JSON.stringify({n:c.n,s:c.s,t:c.t,k:'r'}),by:whoName(),at:Date.now()};patch.rem[key]=clone(d.rem[key])});
  persist(id,patch);

/* ---------- Dashboard: done / not-done check with category tabs ---------- */
function rowCheck(r,mode,date){
  let tot=0,done=0,bad=0,pend=0;const parts=[],badW=[],badL=[],rems=[];
  PLS.forEach(pl=>{
    const doc=getDoc(pl,mode,date);const secs=TC_SECS(pl,mode,r);const bw=[];
    const chips=secs.map(sec=>{const st=stOf(doc,r,sec,date);tot++;if(st==='D'||st==='A')done++;else if(st==='N'||st==='M'){bad++;bw.push(`<span class="nds ${st}">${sec!=='x'?esc(sec)+' ':''}${st==='N'?'not done':'not marked'}</span>`)}else pend++;
      return `<span class="cp ${st}" title="${esc(pl.name)}${sec!=='x'?' · '+sec:''}">${sec!=='x'?esc(sec)+' ':''}${SYM[st]}</span>`}).join('');
    parts.push(`<span class="tpl"><i>${esc(shortN(pl))}</i>${chips}</span>`);
    if(bw.length){badW.push(`<b>${esc(shortN(pl))}</b> ${bw.join(' ')}`);badL.push(`<span class="ndn">${esc(shortN(pl))}</span> ${bw.join(' ')}`)}
    remLines(pl,doc,r,mode).forEach(l=>rems.push(remLineHTML(pl,l,true)));
  });
  return {tot,done,bad,pend,parts,badW,badL,rems};
}
function careStrip(date){
  const out=[];PLS.forEach(pl=>{
    if(WHO==='PM')medList(pl,date).filter(m=>medBad(m,date)).forEach(m=>out.push(`<b>${esc(shortN(pl))}</b> · 🩺 ${esc(m.n)}${m.s?' '+esc(m.s):''} met ${m.met.length}/${MEET_MIN}`));
    careList(getDoc(pl,'dp',date)).filter(c=>careBad(c,date)).forEach(c=>out.push(`<b>${esc(shortN(pl))}</b> · 👶 ${esc(c.n)}${c.s?' '+esc(c.s):''} met ${c.met.length}/${MEET_MIN}`));
  });return out;
}
function careTab(date){
  let h=`<div class="muted" style="margin-bottom:8px">Guideline: every medical case and every regular care-watch child is met at least ${MEET_MIN} times in the day (noted + follow-up).</div>`;
  PLS.forEach(pl=>{
    const med=WHO==='PM'?medList(pl,date):[];const cw=careList(getDoc(pl,'dp',date));
    h+=`<div class="tcblk">${esc(pl.name)} · ${esc(pl.cls)}</div>`;
    if(!med.length&&!cw.length){h+=`<div class="muted" style="margin-bottom:6px">No medical case or care-watch child logged.</div>`;return}
    h+=`<div class="tw"><table class="cwtab"><tr><th>Child</th><th>Type</th><th>Met</th><th>Checks / note</th></tr>`+
      med.map(m=>{const b=medBad(m,date);return `<tr class="${b?'bad':''}"><td><b>${esc(m.n)}</b>${m.s?' · '+esc(m.s):''}</td><td>🩺 Medical</td><td><b class="${m.met.length>=MEET_MIN?'okc':'noc'}">${m.met.length}×</b> ${m.met.map(fmtT).join(', ')}</td><td>${esc(m.x)}</td></tr>`}).join('')+
      cw.map(c=>{const b=careBad(c,date);return `<tr class="${b?'bad':''}"><td><b>${esc(c.n)}</b>${c.s?' · '+esc(c.s):''}${c.k==='o'?' <span class="cwty o">today</span>':''}</td><td>${CW_TYPES[c.t]||''}</td><td><b class="${c.met.length>=MEET_MIN||c.k==='o'?'okc':'noc'}">${c.met.length}×</b> ${c.met.map(fmtT).join(', ')}</td><td>${CW_CHK.map(([q,l])=>c.chk[q]?`${l} ${SYM[c.chk[q]]}`:'').filter(Boolean).join(' · ')}${c.ac?`<div class="ac">→ ${esc(c.ac)}</div>`:''}</td></tr>`}).join('')+`</table></div>`;
  });
  return h;
}
function taskCheck(mode,date){
  const blocks=DEFS[mode];const tab=S.tcTab||'nd';
  const per={};let nBad=0;
  blocks.forEach(b=>{per[b.id]=0;ROWS[mode].filter(r=>r.block===b).forEach(r=>{const x=rowCheck(r,mode,date);if(x.bad){per[b.id]++;nBad++}})});
  const cs=mode==='dp'?careStrip(date):[];
  let h=`<div class="card tcard"><h3>Done / not-done check <span class="hint">${parseD(date).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</span></h3>`;
  h+=`<div class="tabs2 noprint"><button data-act="tctab" data-v="nd" class="${tab==='nd'?'on':''} red">⚠ Not done <span class="bd">${nBad+cs.length}</span></button>`+
    blocks.map(b=>`<button data-act="tctab" data-v="${b.id}" class="${tab===b.id?'on':''}">${esc(b.name)}${per[b.id]?` <span class="bd">${per[b.id]}</span>`:' <span class="okd">✓</span>'}</button>`).join('')+
    (mode==='dp'?`<button data-act="tctab" data-v="care" class="${tab==='care'?'on':''}">${WHO==='PM'?'🩺 Medical & care':'👶 Care watch'}${cs.length?` <span class="bd">${cs.length}</span>`:''}</button>`:'')+
    `<button data-act="report" data-v="">📄 Report cards</button></div>`;
  h+=`<div class="leg"><span><span class="cp D">✓</span> Done</span><span><span class="cp A">NA</span> Not applicable</span><span><span class="cp N">✗</span> Marked not done</span><span><span class="cp M">!</span> Not marked – time over</span><span><span class="cp P">·</span> Still due</span></div>`;
  if(tab==='care'&&mode==='dp')return h+careTab(date)+`</div>`;
  if(tab==='nd'){
    /* one dark, bold strip per segment — tap to open; inside, task title bold, defaulter names & sections light */
    let body='',okN=0;const grp={},ord=[];
    ROWS[mode].forEach(r=>{const x=rowCheck(r,mode,date);if(!x.bad){if(!x.pend)okN++;return}
      if(!grp[r.block.id]){grp[r.block.id]={b:r.block,items:[],n:0};ord.push(r.block.id)}
      const g=grp[r.block.id];g.n+=x.bad;
      g.items.push(`<div class="ndi"><div class="ndt">${esc(rowLabel(r))}</div><div class="ndw">${x.badL.join('<span class="sep">·</span>')}</div></div>`)});
    const seg=(k,title,cnt,sub,inner)=>{const dk='nd|'+mode+'|'+k;
      return `<details class="ndg" data-k="${dk}" ${detOpen(dk,false)?'open':''}><summary><span class="ndgt">${esc(title)}</span><span class="ndgc">${sub}</span><span class="ndgb">${cnt}</span><span class="ndga">›</span></summary><div class="ndgi">${inner}</div></details>`};
    ord.forEach(id=>{const g=grp[id];body+=seg(id,g.b.name,g.n,`${g.items.length} task${g.items.length>1?'s':''}`,g.items.join('')+`<button class="ndmore" data-act="tctab" data-v="${id}">See every section of ${esc(g.b.name)} ›</button>`)});
    if(cs.length)body+=seg('care',WHO==='PM'?'Medical & care watch':'Care watch',cs.length,`met fewer than ${MEET_MIN}×`,cs.map(x=>`<div class="ndi"><div class="ndw">${x}</div></div>`).join('')+`<button class="ndmore" data-act="tctab" data-v="care">Open the full list ›</button>`);
    h+=body?`<div class="ndhint">Tap a segment to see who has not done it.</div>`+body:`<div class="allclear">✓ Nothing marked not done and nothing overdue.</div>`;
    if(okN)h+=`<div class="okline" style="margin-top:8px">✓ ${okN} task${okN>1?'s':''} done by everyone · tap a category above to see every section</div>`;
    return h+`</div>`;
  }
  const b=blocks.find(x=>x.id===tab)||blocks[0];
  ROWS[mode].filter(r=>r.block===b).forEach(r=>{const x=rowCheck(r,mode,date);
    h+=`<div class="tk ${x.bad?'bad':''}"><div class="tkh"><b>${esc(rowLabel(r))}</b><span class="tkc">${x.bad?x.bad+' not done · ':''}${x.done}/${x.tot} done</span></div><div class="tkp">${x.parts.join('')}</div>${x.rems.length?`<div class="tkr">${x.rems.join('')}</div>`:''}</div>`});
  return h+`</div>`;
}

function repDayCell(pl,mode,r,date){
  const today=todayStr();if(date>today)return {k:'F'};
  if(date<today&&dayEmpty(pl,date))return {k:'E'};
  const doc=getDoc(pl,mode,date);const secs=TC_SECS(pl,mode,r);const st=secs.map(sec=>stOf(doc,r,sec,date));
  const badS=secs.filter((sec,i)=>st[i]==='N'||st[i]==='M');
  if(badS.length)return {k:'X',bad:badS,tot:secs.length};
  if(st.every(x=>x==='A'))return {k:'NA'};
  if(st.every(x=>x==='D'||x==='A'))return {k:'Y'};
  return {k:'P'};
}
function cellHTML(c){
  if(c.k==='Y')return '<span class="y">✓</span>';
  if(c.k==='X')return `<span class="x">✗${c.tot>1?`<small>${c.bad.length}</small>`:''}</span>`;
  if(c.k==='NA')return '<span class="na">NA</span>';
  if(c.k==='E')return '<span class="e">–</span>';
  return '<span class="e">·</span>';
}

/* ================= PHOTOS =================
   Fast path: the photo is shrunk on the phone (≈30 KB), shown at once, and sent in the background.
   If the network drops it retries by itself (same photo id, so no duplicates). Thumbnails load in batches
   and are cached on the phone, so they don't download again on every refresh. */
const PHOTOS={};const phLoading={};const PHPEND={};   // PHPEND[tmpId]={doc,key,data,state:'up'|'fail',tries}
const PHC='pmplan_ph_v1';
try{const c=JSON.parse(localStorage.getItem(PHC)||'{}');Object.assign(PHOTOS,c)}catch(e){}
function cachePhoto(id,data){PHOTOS[id]=data;try{const c=JSON.parse(localStorage.getItem(PHC)||'{}');c[id]=data;const ks=Object.keys(c);while(ks.length>40)delete c[ks.shift()];localStorage.setItem(PHC,JSON.stringify(c))}catch(e){}}
let phBatchBusy=false,phOld=false;
function loadPhotos(){
  if(phBatchBusy)return;
  const need=[];document.querySelectorAll('img[data-pid]').forEach(img=>{const id=img.dataset.pid;if(!PHOTOS[id]&&!phLoading[id]&&need.indexOf(id)<0)need.push(id)});
  if(!need.length)return;
  const ids=need.slice(0,12);ids.forEach(id=>phLoading[id]=1);phBatchBusy=true;
  const done=list=>{(list||[]).forEach(v=>{cachePhoto(v.id,v.data);document.querySelectorAll(`img[data-pid="${v.id}"]`).forEach(x=>x.src=v.data)})};
  const p=phOld?Promise.all(ids.map(id=>api('pmPhotoGet',[id]).catch(()=>null))).then(l=>l.filter(Boolean))
    :api('pmPhotos',[ids]).catch(e=>{if(/Unknown request/.test(e.message)){phOld=true;return Promise.all(ids.map(id=>api('pmPhotoGet',[id]).catch(()=>null))).then(l=>l.filter(Boolean))}throw e});
  p.then(done).catch(()=>{}).finally(()=>{ids.forEach(id=>delete phLoading[id]);phBatchBusy=false;setTimeout(loadPhotos,50)});
}
function shrink(file){
  return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{let w=640,q=0.6,out='';
      for(let t=0;t<7;t++){const sc=Math.min(1,w/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=34000)break;w=Math.round(w*0.82);q=Math.max(0.38,q-0.06)}
      URL.revokeObjectURL(u);out.length<=46000?res(out):rej(new Error('Photo is too large.'))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that photo.'))};img.src=u});
}
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pendFor=(doc,key)=>Object.keys(PHPEND).filter(t=>PHPEND[t].doc===doc&&PHPEND[t].key===key);
async function uploadPhoto(el){
  const plId=el.dataset.pl,rk=el.dataset.row,sec=el.dataset.sec,f=el.files&&el.files[0];el.value='';
  if(!f||!canAct(plId))return;
  const mode=(ROWMAP[rk]&&ROWMAP[rk].mode)||'dp',id=docId(plId,mode,S.date),key=rk+'__'+sec;
  let data;try{data=await shrink(f)}catch(e){showMsg(e.message);return}
  const tmp=rid();PHPEND[tmp]={doc:id,key,data,state:'up',tries:0};render(true);
  sendPhoto(tmp);
}
function sendPhoto(tmp){
  const p=PHPEND[tmp];if(!p)return;p.state='up';render(true);
  flushAll();
  enqueue(p.doc,async()=>{                                   // after any pending ticks for the same record
    try{
      const doc=await api('pmPhoto',[p.doc,p.key,p.data,tmp]);
      const ph=(doc.rem[p.key]&&doc.rem[p.key].ph)||[];const got=ph.find(x=>x.id===tmp)||ph[ph.length-1];
      if(got)cachePhoto(got.id,p.data);
      delete PHPEND[tmp];S.docs[p.doc]=overlay(p.doc,doc);setConn('live');saveLocal();render(true);
    }catch(e){
      if(e.server&&!/lock|timed out|Service invoked too many|try again/i.test(e.message)){delete PHPEND[tmp];showMsg(e.message);render(true);return}
      p.tries++;if(p.tries<4){setTimeout(()=>sendPhoto(tmp),1500*p.tries)}else{p.state='fail';render(true)}
    }
  });
}
function retryPhoto(tmp){const p=PHPEND[tmp];if(p){p.tries=0;sendPhoto(tmp)}}
function phThumbs(ph,docIdv,key,editable,addAttrs,max){
  max=max||5;const pend=pendFor(docIdv,key);
  return ph.map(p=>`<button class="ph" data-act="photo" data-id="${p.id}"><img alt="Photo" data-pid="${p.id}" src="${PHOTOS[p.id]||''}"><span>${fmtT(p.at)}</span></button>`).join('')+
    pend.map(t=>{const q=PHPEND[t];return q.state==='fail'?`<button class="ph fail" data-act="phretry" data-tmp="${t}"><img alt="Photo" src="${q.data}"><span>⟳ Retry</span></button>`:`<span class="ph up"><img alt="Photo" src="${q.data}"><span>Saving…</span></span>`}).join('')+
    (editable&&ph.length+pend.length<max?`<label class="phadd">📷 Add<input type="file" accept="image/*" capture="environment" data-act="phup" ${addAttrs}></label>`:'');
}
function showPhoto(id){
  const src=PHOTOS[id];if(!src)return;
  const d=document.createElement('div');d.className='phview';d.innerHTML=`<img alt="Photo" src="${src}"><button>Close</button>`;
  d.addEventListener('click',()=>d.remove());document.body.appendChild(d);
}

  if(a==='report'){S.rep.pl=t.dataset.v||S.rep.pl;S.view='report';render(true);window.scrollTo(0,0);return}
  if(a==='reppl'){S.rep.pl=t.dataset.v;render(true);return}
  if(a==='repkind'){S.rep.kind=t.dataset.v;render(true);return}
  if(a==='print'){const pl=plOf(S.rep.pl);const old=document.title;document.title=`PM ${S.rep.kind==='week'?'Weekly':'Daily'} Report - ${pl?pl.name:''} - ${S.rep.kind==='week'?'week of '+S.wk:S.date}`;window.print();setTimeout(()=>document.title=old,1500);return}
  if(a==='tctab'){S.tcTab=t.dataset.v;render(true);return}
  if(a==='cwadd'){cwAdd(t.dataset.pl);return}
  if(a==='cwdel'){if(confirmDel(t))cwDel(t.dataset.pl,t.dataset.id);return}
  if(a==='cwmet'){cwMet(t.dataset.pl,t.dataset.id,'add');return}
  if(a==='cwunmet'){cwMet(t.dataset.pl,t.dataset.id,'pop');return}
  if(a==='cwchk'){cwChk(t.dataset.pl,t.dataset.id,t.dataset.q);return}
  if(a==='savepw'){doChangePw(S.me.id,'np1','np2');return}
  if(a==='setuserpw'){doChangePw(t.dataset.u,'up_'+t.dataset.u);return}
  if(a==='mode'){S.mode=t.dataset.v;S.editTime=null;render(true)}
  else if(a==='tab'){if(t.dataset.v==='dash'&&!(S.me&&S.me.senior))return;S.tab=t.dataset.v;render(true);window.scrollTo(0,0)}
  else if(a==='day'){S.date=t.dataset.v;render(true)}
  else if(a==='wk'){
    const m=parseD(S.wk);m.setDate(m.getDate()+7*Number(t.dataset.v));S.wk=ds(m);
    const dates=weekDates(S.wk);const today=todayStr();
    S.date=dates.includes(today)?today:(dates.filter(d=>d<=today).pop()||dates[0]);
    subscribeWeek(S.wk);render(true);
  }
  else if(a==='tick')doTick(t.dataset.pl,t.dataset.row,t.dataset.sec,!!t.dataset.wk);
  else if(a==='obsadd')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'add');
  else if(a==='obsundo')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'pop');
  else if(a==='obsna')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'na');
  else if(a==='medadd')medAdd(t.dataset.pl);
  else if(a==='medfu')medOp(t.dataset.pl,{op:'fu',id:t.dataset.id});
  else if(a==='medunfu')medOp(t.dataset.pl,{op:'unfu',id:t.dataset.id});
  else if(a==='meddel'){if(confirmDel(t))medOp(t.dataset.pl,{op:'del',id:t.dataset.id})}
  else if(a==='tlsec'){S.tlSec=t.dataset.v;render(true)}
  else if(a==='phretry')retryPhoto(t.dataset.tmp);
  else if(a==='allrow'){const p=plOf(t.dataset.pl);setCells(p.id,secsOf(p,ROWMAP[t.dataset.row]).map(s=>[t.dataset.row,s,'D']))}
  else if(a==='allitem'){const p=plOf(t.dataset.pl);const list=[];ROWS[S.mode].filter(r=>r.item.id===t.dataset.item).forEach(r=>secsOf(p,r).forEach(s=>list.push([r.key,s,'D'])));setCells(p.id,list)}
  else if(a==='rem'){const k=t.dataset.pl+'|'+t.dataset.row;S.openRem[k]=!S.openRem[k];render(true)}
  else if(a==='photo')showPhoto(t.dataset.id);
  else if(a==='edittime'){S.editTime=S.editTime===t.dataset.b?null:t.dataset.b;render(true)}
  else if(a==='canceltime'){S.editTime=null;render(true)}
  else if(a==='savetime'||a==='notime'||a==='deftime'){
    if(!isSenior())return;const b=t.dataset.b;let v;
    if(a==='savetime'){v=document.getElementById('tin').value;if(!v)return}else if(a==='notime')v='none';else v='def';
    S.times[b]=v;persistCfg({times:{[b]:v},by:whoName(),at:Date.now()});S.editTime=null;render(true);
  }
});
document.addEventListener('change',ev=>{if(ev.target.dataset&&ev.target.dataset.act==='phup')uploadPhoto(ev.target)});
document.addEventListener('input',ev=>{if(ev.target.classList&&ev.target.classList.contains('remin'))onRemInput(ev.target);else if(ev.target.classList&&ev.target.classList.contains('cwin')&&ev.target.dataset.id)cwAc(ev.target)});
document.addEventListener('focusout',ev=>{
  if(ev.target.classList&&ev.target.classList.contains('remin')){flushAll();setTimeout(()=>{if(!typing()&&S.dirty)render(true)},80)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='lpw')doLogin()});
window.addEventListener('pagehide',flushAll);
setInterval(()=>render(),30000);
render(true);initDb();
</script>
</body>
</html>
