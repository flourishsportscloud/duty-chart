<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2a5c">
<link rel="icon" href="../fis/fis-icon-192.png">
<title>PM Plan – Live</title>
<style>
:root{--navy:#1b2a5c;--navy2:#26397d;--bg:#eef1f7;--card:#fff;--ink:#1d2433;--mut:#6b7488;--line:#dfe4ee;--green:#1e9e5a;--red:#d64545;--grey:#8d96a8;--amber:#c97b00;--blue:#3a63c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 12px 8px;position:sticky;top:0;z-index:20}
.h1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h1 h1{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.h1 h1 a{color:#fff;text-decoration:none;font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:99px}
.who{display:flex;align-items:center;gap:6px;font-size:12px}
.who b{font-size:13px}.who button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:600}
.login{max-width:380px;margin:30px auto}.login label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.login select,.login input,.pwrow input{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #c7cfe2;border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;padding:10px 14px;font-size:14px;margin-top:12px;width:100%}
.btn.sec{background:#cfd6e8;color:var(--ink)}
.pwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pwrow .btn{margin:0;width:auto;padding:8px 10px;font-size:12px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.chip.live{background:#1e9e5a}.chip.err{background:#d64545}.chip.loc{background:#c97b00}
.seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 14px;border-radius:6px;font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--navy)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--navy2);position:sticky;top:0}
nav button{flex:0 0 auto;border:0;background:rgba(255,255,255,.14);color:#fff;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600}
nav button.on{background:#fff;color:var(--navy)}
nav button small{display:block;font-weight:400;font-size:10px;opacity:.8}
.wrap{max-width:980px;margin:0 auto;padding:10px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
.card h3{margin:0 0 8px;font-size:14px;color:var(--navy)}
.weeknav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.weeknav button.ar{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
.weeknav button.ar:disabled{opacity:.35}
.weeknav .wl{flex:1;text-align:center;font-weight:600;font-size:12px;color:var(--mut)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.day{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;color:var(--ink)}
.day b{display:block;font-size:15px}
.day .pc{font-weight:700;font-size:12px;margin-top:2px}
.day.g{background:#e3f6ec;border-color:#9ad8b7}.day.r{background:#fde8e8;border-color:#f0aaaa}
.day.today{box-shadow:0 0 0 2px var(--navy)}
.day.sel{border-color:var(--navy);border-width:2px;outline:2px solid var(--navy)}
.day.lock{opacity:.45}
.day .tg{font-size:9px;color:var(--navy);font-weight:700;height:11px}
.notice{padding:8px 10px;border-radius:8px;background:#fff6dd;color:#7a5600;font-size:12px;margin-bottom:10px}
.notice.info{background:#e9eefc;color:#2a3f86}
.notice.bad{background:#fde8e8;color:#9e2a2a}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.cnt{text-align:center;border-radius:8px;padding:6px 2px;background:#f3f5fa}
.cnt b{display:block;font-size:18px}.cnt span{font-size:10px;color:var(--mut)}
.cnt.d b{color:var(--green)}.cnt.n b{color:var(--red)}.cnt.a b{color:var(--grey)}
.bar{height:10px;border-radius:99px;background:#e6eaf3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.rd i{background:var(--red)}
.pct{font-size:22px;font-weight:800;color:var(--navy)}
.wk{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.wk .col{height:64px;display:flex;align-items:flex-end;background:#f3f5fa;border-radius:6px;overflow:hidden}
.wk .col i{width:100%;background:var(--grey);display:block}
.wk .col i.g{background:var(--green)}.wk .col i.r{background:var(--red)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sbox{border:1px solid var(--line);border-radius:8px;text-align:center;padding:5px 2px;font-size:11px}
.sbox b{display:block;font-size:14px}
.sbox.r{border-color:var(--red);background:#fde8e8}.sbox.g{border-color:#9ad8b7;background:#e3f6ec}
.nd{font-size:12px;line-height:1.5}
.nd div{padding:4px 0;border-bottom:1px dashed var(--line)}
.nd .bl{color:var(--mut)}
.ok{color:var(--green);font-weight:600;font-size:12px}
.blk{background:var(--card);border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.08);overflow:hidden}
.bh{background:var(--navy);color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bh .bn{font-weight:700;flex:1;min-width:140px}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff}
.st.Done{color:var(--green)}.st.Missed,.st.Overdue{color:var(--red)}.st.Due{color:var(--amber)}.st.Upcoming{color:var(--blue)}.st.NoFixed{color:var(--grey)}
.tm-chip{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px;border:0;color:#fff}
.bpc{font-size:11px;opacity:.85}
.timed{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#eef1fb;flex-wrap:wrap;font-size:12px}
.timed input{padding:4px;font-size:14px}
.timed button{border:0;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--navy);color:#fff}
.timed button.sec{background:#cfd6e8;color:var(--ink)}
.item{border-top:1px solid var(--line);padding:8px 10px}
.item:first-of-type{border-top:0}
.ih{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;margin-bottom:4px}
.row{padding:5px 0 6px}
.row.sub{padding-left:10px;border-left:3px solid #dfe4ee;margin:2px 0}
.rl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.lbl{font-size:13px}
.rb{display:flex;gap:5px;flex:0 0 auto}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--navy)}
.mini.on{background:#e9eefc;border-color:#aebbe6}
.mini:disabled,.mini.ro{opacity:.5}
.boxes{display:flex;flex-wrap:wrap;gap:5px}
.box{min-width:56px;flex:0 0 auto;border:2px dashed #c5cce0;background:#fff;border-radius:9px;padding:3px 4px 4px;text-align:center;font-family:inherit;color:var(--ink);cursor:pointer;min-height:54px}
.box .sl{display:block;font-size:10px;color:var(--mut);height:12px}
.box .sy{display:block;font-size:17px;font-weight:800;line-height:22px;color:#b4bccd}
.box .tm{display:block;font-size:9px;color:var(--mut);line-height:11px}
.box .tm.late{color:var(--amber);font-weight:700}
.box.d{background:#e3f6ec;border:2px solid var(--green)}.box.d .sy{color:var(--green)}
.box.n{background:#fde8e8;border:2px solid var(--red)}.box.n .sy{color:var(--red)}
.box.a{background:#eceff5;border:2px solid var(--grey)}.box.a .sy{color:var(--grey)}
.box.ro{cursor:default}
.box.obs.oc{border:2px solid var(--oc);background:color-mix(in srgb,var(--oc) 16%,#fff)}.box.obs.oc .sy{color:var(--oc)}
.obsleg{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:10px;color:var(--mut);margin-top:3px}.obsleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.box.obs .tm{font-size:10px;line-height:12px;text-align:left;padding:0 2px}
.row.de{display:flex;align-items:center;gap:8px}
.row.de .rl{flex:1;margin:0}
.rembox{background:#f6f8fc;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px}
.rr{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.rr .sn{flex:0 0 36px;font-weight:700;font-size:12px;padding-top:6px}
.rr input,.rr textarea{font:inherit;font-size:13px;border:1px solid #c7cfe2;border-radius:6px;padding:5px 6px;background:#fff}
.rr input{width:70px;flex:0 0 70px}.rr textarea{flex:1;min-height:34px;resize:vertical}
.rr .by{font-size:10px;color:var(--mut);flex:0 0 auto;max-width:90px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.c{text-align:center;font-weight:700}
td.g{background:#e3f6ec;color:var(--green)}td.r{background:#fde8e8;color:var(--red)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.plc{border:1px solid var(--line);border-radius:10px;padding:10px}
.plc h4{margin:0 0 2px;color:var(--navy)}.plc small{color:var(--mut)}
.cat{margin-bottom:10px}.cat b{color:var(--navy)}
.cat .tot{float:right;font-weight:700}
.muted{color:var(--mut);font-size:12px}
.h1 h1 small{font-weight:400;font-size:11px;opacity:.8;display:block}
.bh .bn small{font-weight:400;opacity:.8;margin-left:6px;font-size:11px}
.nbox{display:block;width:62px;text-align:center}
.nbox .sl{display:block;font-size:10px;color:var(--mut)}
.nbox input{width:62px;font:inherit;font-size:15px;font-weight:700;text-align:center;border:2px dashed #c5cce0;border-radius:9px;padding:6px 2px;background:#fff}
.nbox input.f{border:2px solid var(--green);background:#e3f6ec;color:var(--green)}
.nbox .tm{display:block;font-size:9px;color:var(--mut);height:11px}
.blk.over .box:not(.d):not(.n):not(.a){border-color:var(--red);border-style:solid}.blk.over .nbox input:not(.f){border-color:var(--red);border-style:solid}
.due{border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px;background:#e9eefc;color:#2a3f86}.due.od{background:#fde8e8;color:#a32727}.due.ds{background:#fff4dc;color:#7a5600}.due.ok2{background:#e3f6ec;color:#17794a}
.legend{font-size:11px;color:var(--mut);margin-top:6px}
.box.obs .tm{font-size:9px;line-height:11px;text-align:left;padding:0 2px}
.phs{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center}
.ph{border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;width:64px;font-size:9px;color:var(--mut)}
.ph img{display:block;width:58px;height:58px;object-fit:cover;border-radius:6px;background:#eef1f7}
.phadd{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px dashed #c5cce0;border-radius:8px;font-size:11px;font-weight:600;color:var(--navy);cursor:pointer}
.phadd input{display:none}
.phview{position:fixed;inset:0;background:rgba(10,15,30,.85);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.phview img{max-width:100%;max-height:80vh;border-radius:8px}.phview button{border:0;border-radius:8px;padding:8px 18px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="h1"><h1><a href="../fis/">‹ FIS</a><span>PM Plan – Live<small>Daily Operational Report · Classes 1–5</small></span></h1>
    <div class="who" id="whobox"></div></div>
  <div class="sub"><div class="seg" id="modeseg"></div><span class="chip" id="conn"></span></div>
</header>
<nav id="tabs"></nav>
<div class="wrap"><div id="msg"></div><div id="root"></div></div>

<script>
/* ================= CONFIG ================= */
const secList=(cls,letters)=>{const o=[];cls.forEach(c=>[...letters].forEach(l=>o.push(c+l)));return o};
const PLS=[
 {id:'shally',name:'Shally',cls:'Class 1–2',sections:secList([1,2],'ABC')},
 {id:'neetu',name:'Neetu',cls:'Class 3',sections:secList([3],'ABC')},
 {id:'divyanshi',name:'Divyanshi',cls:'Class 4',sections:secList([4],'ABC')},
 {id:'diksha',name:'Diksha',cls:'Class 5',sections:secList([5],'ABC')}
];
const SENIORS=[{id:'dean',name:'Dean of Academics'},{id:'director',name:'Director–Admin'}];
const PEOPLE=[...PLS.map(p=>({id:p.id,name:p.name,pl:p.id})),...SENIORS.map(s=>({id:s.id,name:s.name,senior:true}))];

/* Day Plan — PM PLAN – DAY PLAN. kind:'num' = a count per section. rem:1 remark, rem:'n' number + remark,
   rem:'p' photo log. yn:1 shows YES / NO. multi:1 = tap each time you check (every tap is saved with its time).
   one:1 = one box for the whole PM (not per section). Block ids are fixed server-side for due-time overrides. */
const DP=[
{id:'att',name:'Attendance',time:'08:30',items:[
 {id:'total',name:'Total Attendance',kind:'num'},{id:'present',name:'Present',kind:'num'},{id:'absent',name:'Absent',kind:'num'},
 {id:'latec',name:'Late Comer',rem:1},{id:'sbverify',name:'Verify SB Attendance & Register',rem:1},
 {id:'uniformd',name:'Uniform Defaulter',rem:1},{id:'earlyl',name:'Early Leaver',rem:'n'}]},
{id:'morn',name:'Morning Observation',time:'08:30',items:[
 {id:'assembly',name:'Assembly',rem:1},{id:'fruit',name:'Fruit Break',rem:1},{id:'testexec',name:'Test Execution',rem:1}]},
{id:'admin',name:'DCR – Action',time:'10:30',items:[
 {id:'dcrerr',name:'Errors',rem:1},{id:'dcrabs',name:'Absentees Work Allocation',rem:1},
 {id:'dcrbook',name:'Book',rem:'n',yn:1},{id:'dcrnb',name:'Notebook',rem:'n',yn:1},{id:'dcrassign',name:'Assignment',rem:'n',yn:1},
 {id:'dcrincomp',name:'Incomplete Work Action',rem:1},{id:'dcrdef',name:'Defaulters',rem:'n'},{id:'dcrprev',name:'Previous Day Defaulter Collection',rem:1}]},
{id:'reports',name:'Proof Reading',tag:'number / remark',time:'11:00',items:[
 {id:'proof',name:'Proof Reading',rem:'n',subs:[['diary','Diary'],['book','Book'],['notebook','Notebook']]}]},
{id:'comm',name:'PM Rounds',time:'12:30',items:[
 {id:'lfr',name:'Lost and Found',rem:1},{id:'statrev',name:'Stationery Review',rem:1},{id:'sbmon',name:'Stayback Monitoring',rem:1},
 {id:'sblunchr',name:'Stayback Lunch',rem:1},{id:'distr',name:'Distribution Round',rem:1},{id:'bookrev',name:'Book Review',rem:1}]},
{id:'welfare',name:'Student Welfare',time:'14:00',items:[
 {id:'medicalr',name:'Medical',rem:1},{id:'lunchcase',name:'Lunch Observation – Case',rem:1},{id:'washcase',name:'Washroom Cases',rem:1},{id:'sblunchcase',name:'Stayback Lunch Case',rem:1}]},
{id:'campus',name:'Washroom',tag:'tap each time you check',time:null,items:[
 {id:'wr_dry',name:'Dryness',multi:1,one:1},{id:'wr_clean',name:'Cleanliness',multi:1,one:1},{id:'wr_supply',name:'Supplies',multi:1,one:1},
 {id:'wr_img',name:'Washroom Images',rem:'p',one:1},{id:'wr_light',name:'Lights',multi:1,one:1},{id:'wr_fan',name:'Fans',multi:1,one:1}]},
{id:'audit',name:'Other Subjects Observations',time:null,items:[
 {id:'osskill',name:'Skill Course',rem:1},{id:'osfl',name:'Foreign Language',rem:1},{id:'osart',name:'Art',rem:1}]}
];
/* Day End — PM PLAN – DAY END TASKS. sec:1 = marked per section; otherwise one tick per item.
   rem:'n' = number + remark per section, rem:'c' = number + colour, rem:'p' = photo log per section. Ids start with e_ so they never clash with Day Plan rows. */
const DE=[
{id:'de1',name:'Parent Communication',time:'13:30',items:[
 {id:'e_diaryparent',name:'Parent Communication',sec:1,rem:'n',subs:[['diary','Diary to Parent'],['lessonpdf','Lesson PDF'],['testpdf','Test paper PDF'],['hwsms','Home Task SMS']]},
 {id:'e_defsms',name:'Defaulter SMS',subs:[['diary','Diary'],['booknb','Book-Notebook'],['test','Test'],['assign','Assignment']]}]},
{id:'de2',name:'Class Group',time:'15:00',items:[
 {id:'e_classgroup',name:'Class Group',subs:[['fg','Feedback Group'],['admin','Admin'],['preprimary','Pre-Primary communication'],['floor','Floor manager'],['cm','Class manager'],['stock','Stock'],['epl','EPL']]}]},
{id:'de3',name:'Day-End Review',time:'15:30',items:[
 {id:'e_ctp',name:'Class Test Performers'},{id:'e_chkcm',name:'Checking Status Review – CM'},{id:'e_chkmentor',name:'Checking Status Review – Mentor'},
 {id:'e_distcoll',name:'Distribution – Collection Record'},{id:'e_schedule',name:'Schedule Discussion'},{id:'e_cmplan',name:'CM Plan'},
 {id:'e_teacherprep',name:'Teacher / Next Day Prep',sec:1,subs:[['lessonrev','Book / Lesson Review'],['content','Content'],['checkednb','Checked Notebook'],['checked','Checked Assignment'],['checkedtest','Checked Test'],['key','Assignment Answer Key'],['epl','EPL / Activity Prep'],['video','Video'],['ppt','PPT'],['viva','Viva'],['testdrive','Test on Drive'],['lessoninit','Lesson Initiative (Knowledge Spotlight / Literacy Lens)']]},
 {id:'e_supply',name:'Supply Chain',sec:1,subs:[['checked','Checked Assignment'],['testnb','Test NB'],['notebook','Notebook'],['book','Book'],['nextassign','Next Day Assignment'],['stockreq','Stock Requirement']]},
 {id:'e_infra',name:'Infrastructure',sec:1,subs:[['light','Light off'],['fan','Fan off'],['ac','AC off'],['dboard','Digital Board']]},
 {id:'e_furn',name:'Furniture (Number / Colour)',sec:1,rem:'c'},
 {id:'e_cupb',name:'Classroom Cupboards (Image log)',sec:1,rem:'p'},
 {id:'e_water',name:'Water Bottle',sec:1}]},
{id:'de4',name:'Feedback & Discussion',time:'15:00',items:[
 {id:'e_feedback',name:'Feedback',subs:[['studybase','Studybase'],['calllog','Call Log'],['diary','Diary'],['ohm','OHM']]},
 {id:'e_discussion',name:'Discussion',subs:[['classroom','Classroom Discussion'],['lesson','Lesson / Learning'],['class','Class'],['teacher','Teacher']]}]},
{id:'de5',name:'Audit & Update',time:'15:30',items:[
 {id:'e_route',name:'Route Plan'},{id:'e_cocurr',name:'Co-Curricular'},{id:'e_record',name:'Record Register'},{id:'e_folder',name:'Class Folder'},{id:'e_library',name:'Library Record'}]}
];
const DEFS={dp:DP,de:DE};
const WEEKLY=[['classobs','Classroom Observation'],['groupremark','Group Remark Discussion'],['feedback','Feedback Discussion'],['display','Class Display'],['awards','Weekly Awards'],['comp','Competitions Plan / Announcement'],['weekend','Weekend Audit']];
const WKBLOCK={id:'wkblock',name:'Observation Update',time:null};
const WEEKEND=[['wa_cert','Certificate'],['wa_display','Class Display'],['wa_cupb','Cupboard'],['wa_dcr','DCR Audit – Error SMS']];
const WEBLOCK={id:'weblock',name:'Weekend Audit',time:null};

const ROWS={dp:[],de:[]};const ROWMAP={};
Object.keys(DEFS).forEach(m=>DEFS[m].forEach(b=>{b.mode=m;b.items.forEach(it=>{
  if(it.subs)it.subs.forEach(s=>ROWS[m].push({key:it.id+'-'+s[0],item:it,label:s[1],block:b,mode:m,rem:it.rem||'',kind:'',sub:true}));
  else ROWS[m].push({key:it.id,item:it,label:it.name,block:b,mode:m,rem:it.rem||'',kind:it.kind||'',sub:false});
})}));
Object.keys(ROWS).forEach(m=>ROWS[m].forEach(r=>ROWMAP[r.key]=r));
const WKROWS=WEEKLY.map(w=>({key:'wk-'+w[0],item:{},label:w[1],block:WKBLOCK,mode:'wk',rem:'',kind:'',sub:false}));
const WEROWS=WEEKEND.map(w=>({key:'wk-'+w[0],item:{},label:w[1],block:WEBLOCK,mode:'wk',rem:'',kind:'',sub:false}));
WKROWS.concat(WEROWS).forEach(r=>ROWMAP[r.key]=r);
const wkRowsFor=mode=>mode==='de'?WEROWS:WKROWS;
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat'];
const secsOf=(pl,r)=>((r.mode==='dp'&&!r.item.one)||r.item.sec)?pl.sections:['x'];
const secLbl=s=>s==='x'?'':s;

/* ================= HELPERS ================= */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const todayStr=()=>ds(new Date());
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function fmtT(ms){const d=new Date(ms);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap}
function fmt12(t){const a=t.split(':').map(Number);const ap=a[0]>=12?'PM':'AM';return (a[0]%12||12)+':'+pad(a[1])+' '+ap}
const docId=(pl,mode,date)=>pl+'_'+mode+'_'+date;
function curWk(){const n=new Date();if(n.getDay()===0){const y=new Date(n);y.setDate(y.getDate()-1);return ds(mondayOf(y))}return ds(mondayOf(n))}

const S={who:'',me:null,token:'',view:null,users:null,busy:false,tab:'dash',mode:'dp',wk:null,date:null,docs:{},times:{},conn:'init',openRem:{},editTime:null,dirty:false};

if(!S.token)S.me=null;
(function(){
  const now=new Date();S.wk=curWk();
  if(now.getDay()===0){const sat=parseD(S.wk);sat.setDate(sat.getDate()+5);S.date=ds(sat)}else S.date=ds(now);
})();
const weekDates=wk=>{const m=parseD(wk);return DAYN.map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return ds(d)})};
const plOf=id=>PLS.find(p=>p.id===id);

function canAct(plId,wk){const p=person();if(!p)return false;if(wk){if(S.wk!==curWk())return false}else if(S.date!==todayStr())return false;return !!(p.senior||p.pl===plId)}

const API_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbxViQm3zVut9JJe1Z-jAbsEU1yfNXzf3SjajRRN_S7ANl1XFYmSBHzuixePxVzDAn6wGw/exec';

let msgTimer=null;
function showMsg(t){const el=document.getElementById('msg');el.innerHTML=t?`<div class="notice bad">${esc(t)}</div>`:'';clearTimeout(msgTimer);if(t)msgTimer=setTimeout(()=>showMsg(''),6000)}
function showOk(t){const el=document.getElementById('msg');el.innerHTML=`<div class="notice info">${esc(t)}</div>`;clearTimeout(msgTimer);msgTimer=setTimeout(()=>showMsg(''),5000)}
const queues={};
function enqueue(k,job){queues[k]=(queues[k]||Promise.resolve()).then(job).catch(()=>{})}
async function api(fn,args){
  let r;
  try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:args||[],token:S.token})})}
  catch(e){throw new Error('offline')}
  let j;try{j=JSON.parse(await r.text())}catch(e){throw new Error('offline')}
  if(!j.ok){const er=new Error(j.err||'Something went wrong.');er.server=true;if(/log in again|not for PM Plan/i.test(er.message)&&fn!=='login'){logout(true)}throw er}
  return j.v;
}
const unacked={},inflight={};
const hasPend=u=>!!(u&&(Object.keys(u.cells).length||Object.keys(u.rem).length));
function overlay(id,doc){
  doc.cells=doc.cells||{};doc.rem=doc.rem||{};
  [inflight[id],unacked[id],typed[id]].forEach(u=>{if(u){
    Object.keys(u.cells).forEach(k=>{const c=u.cells[k];doc.cells[k]=c.ops?applyOps(doc.cells[k],c.ops,whoName()):clone(c)});
    Object.assign(doc.rem,clone(u.rem))}});
  return doc;
}
function persist(id,patch){
  const u=unacked[id]=unacked[id]||{cells:{},rem:{}};
  Object.keys(patch.cells||{}).forEach(k=>{const c=clone(patch.cells[k]);
    if(c.ops&&u.cells[k]&&u.cells[k].ops)u.cells[k].ops=u.cells[k].ops.concat(c.ops);else u.cells[k]=c});
  Object.assign(u.rem,clone(patch.rem||{}));
  saveLocal();
  if(!API_URL)return;
  enqueue(id,()=>sendDoc(id));
}
async function sendDoc(id){
  const u=unacked[id];if(!hasPend(u))return;
  inflight[id]=u;unacked[id]={cells:{},rem:{}};
  try{
    const doc=await api('pmSave',[id,u]);
    delete inflight[id];S.docs[id]=overlay(id,doc);setConn('live');saveLocal();render();
  }catch(e){
    delete inflight[id];
    if(e.server){showMsg(e.message);poll()}
    else{const n=unacked[id];Object.keys(n.cells).forEach(k=>{const c=n.cells[k];if(c.ops&&u.cells[k]&&u.cells[k].ops)u.cells[k].ops=u.cells[k].ops.concat(c.ops);else u.cells[k]=c});
      unacked[id]={cells:u.cells,rem:Object.assign(u.rem,n.rem)};setConn('err')}
  }
}
let polling=false;
async function poll(){
  if(!API_URL||polling||!S.token)return;polling=true;const wk=S.wk;
  try{
    Object.keys(unacked).forEach(id=>{if(hasPend(unacked[id]))enqueue(id,()=>sendDoc(id))});
    const v=await api('pmState',[wk]);
    if(wk===S.wk){
      Object.keys(S.docs).forEach(id=>{if(S.docs[id].wk===wk&&!v.docs[id]&&!hasPend(unacked[id])&&!inflight[id])delete S.docs[id]});
      Object.keys(v.docs).forEach(id=>{S.docs[id]=overlay(id,v.docs[id])});
      S.times=v.times||{};
      if(v.me){S.me=Object.assign(S.me||{},v.me);try{localStorage.setItem('pmplan_me',JSON.stringify(S.me))}catch(e){}}
    }
    setConn('live');saveLocal();render();
  }catch(e){setConn('err')}
  finally{polling=false}
}
function subscribeWeek(wk){poll()}

/* ================= MUTATIONS ================= */
function ensureDoc(id,plId,mode,date){
  if(!S.docs[id])S.docs[id]={pl:plId,mode:mode,date:date,wk:mode==='wk'?date:ds(mondayOf(parseD(date))),cells:{},rem:{}};
  const d=S.docs[id];d.cells=d.cells||{};d.rem=d.rem||{};return d;
}
function mkCell(rk,s,now,wk){
  const r=ROWMAP[rk];const due=(!wk&&r)?dueOf(r.block):null;
  const late=(s&&due&&S.date===todayStr()&&nowMin()>toMin(due))?1:0;
  return{s:s,by:whoName(),at:now,l:late};
}
function setCells(plId,list,wk){
  if(!canAct(plId,wk))return;
  const mode=wk?'wk':S.mode;
  const id=wk?docId(plId,'wk',S.wk):docId(plId,mode,S.date);
  const doc=ensureDoc(id,plId,mode,wk?S.wk:S.date);
  const now=Date.now();const patch={cells:{}};
  list.forEach(x=>{const key=x[0]+'__'+x[1];const c=mkCell(x[0],x[2],now,wk);doc.cells[key]=c;patch.cells[key]=clone(c)});
  persist(id,patch);render();
}
const NEXT={'':'D',D:'N',N:'A',A:''};
const OBS_MAX=10;
function applyOps(cell,ops,by){
  const obs=((cell&&cell.obs)||[]).slice();
  ops.forEach(o=>{if(o==='add')obs.push(Date.now());else if(o==='pop')obs.pop()});
  return {s:obs.length?'D':'',obs:obs,by:by,at:Date.now(),l:0};
}
function doObs(plId,rk,sec,op){
  if(!canAct(plId))return;
  const mode=S.mode,id=docId(plId,mode,S.date),doc=ensureDoc(id,plId,mode,S.date),key=rk+'__'+sec;
  const n=((doc.cells[key]&&doc.cells[key].obs)||[]).length;
  if(op==='add'&&n>=OBS_MAX){showMsg('Up to '+OBS_MAX+' checks a day.');return}
  if(op==='pop'&&!n)return;
  doc.cells[key]=applyOps(doc.cells[key],[op],whoName());
  persist(id,{cells:{[key]:{ops:[op]}}});render();
}
function doTick(plId,rk,sec,wk){
  if(!canAct(plId,wk))return;
  const id=wk?docId(plId,'wk',S.wk):docId(plId,S.mode,S.date);const c=S.docs[id]&&S.docs[id].cells[rk+'__'+sec];
  setCells(plId,[[rk,sec,NEXT[(c&&c.s)||'']]],wk);
}
const timers={},pend={},typed={};
function schedule(id,key){(pend[id]=pend[id]||new Set()).add(key);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700)}
function flush(id){
  clearTimeout(timers[id]);const keys=pend[id];if(!keys||!keys.size)return;pend[id]=new Set();
  const t=typed[id]||{cells:{},rem:{}};delete typed[id];const patch={cells:{},rem:{}};
  keys.forEach(k=>{if(t.rem[k])patch.rem[k]=clone(t.rem[k]);if(t.cells[k])patch.cells[k]=clone(t.cells[k])});
  persist(id,patch);
}
function flushAll(){Object.keys(pend).forEach(flush)}
function onRemInput(el){
  const plId=el.dataset.pl,rk=el.dataset.row,sec=el.dataset.sec,f=el.dataset.f;
  if(!canAct(plId))return;
  const mode=ROWMAP[rk].mode;const id=docId(plId,mode,S.date),doc=ensureDoc(id,plId,mode,S.date),key=rk+'__'+sec;
  if(f==='num'){
    const v=el.value;doc.cells[key]={s:v!==''?'D':'',n:v,by:whoName(),at:Date.now(),l:0};
  }else{
    const e=doc.rem[key]||{x:''};e[f]=el.value;e.by=whoName();e.at=Date.now();doc.rem[key]=e;
    const has=(e.n!==''&&e.n!=null)||String(e.x||'').trim()!=='';
    if(has&&!(doc.cells[key]&&doc.cells[key].s==='D'))doc.cells[key]=mkCell(rk,'D',Date.now(),false);
  }
  const t=typed[id]=typed[id]||{cells:{},rem:{}};
  if(doc.rem[key])t.rem[key]=clone(doc.rem[key]);if(doc.cells[key])t.cells[key]=clone(doc.cells[key]);
  schedule(id,key);
}

/* ================= STATS ================= */
function cellS(doc,rk,sec){const c=doc&&doc.cells&&doc.cells[rk+'__'+sec];return (c&&c.s)||''}
function countRows(doc,pl,rows){
  const o={D:0,N:0,A:0,P:0,T:0};
  rows.forEach(r=>secsOf(pl,r).forEach(s=>{const v=cellS(doc,r.key,s);o.T++;o[v||'P']++}));
  o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o;
}
const stats=(doc,pl,mode)=>countRows(doc,pl,ROWS[mode]);
const getDoc=(pl,mode,date)=>S.docs[docId(pl.id,mode,date)];
const getWkDoc=(pl,wk)=>S.docs[docId(pl.id,'wk',wk)];
function blockInfo(doc,pl,b,date){
  const rows=ROWS[b.mode].filter(r=>r.block===b);const c=countRows(doc,pl,rows);const due=dueOf(b);const today=todayStr();
  let st,cls;
  if(c.P===0&&c.N===0){st='Done';cls='Done'}
  else if(date<today){st='Missed';cls='Missed'}
  else if(date>today){st='Upcoming';cls='Upcoming'}
  else if(c.P===0&&c.N>0){st='Missed';cls='Missed'}
  else if(!due){st='No fixed time';cls='NoFixed'}
  else{const m=nowMin(),d=toMin(due);if(m>d){st='Overdue';cls='Overdue'}else if(d-m<=30){st='Due soon';cls='Due'}else{st='Upcoming';cls='Upcoming'}}
  return{c:c,st:st,cls:cls,due:due};
}
function dayClass(c,date){if(date>todayStr())return 'lock';if(c.T&&c.N>0)return 'r';if(c.T&&c.pct===100)return 'g';return ''}
function sumStats(list){const o={D:0,N:0,A:0,P:0,T:0};list.forEach(c=>{['D','N','A','P','T'].forEach(k=>o[k]+=c[k])});o.pct=o.T?Math.round((o.D+o.A)/o.T*100):0;return o}
const dayStats=(date,list)=>sumStats(list.map(pl=>stats(getDoc(pl,S.mode,date),pl,S.mode)));
function wkDone(pl,wk,rows){rows=rows||WKROWS;const d=getWkDoc(pl,wk);let n=0;rows.forEach(r=>{const v=cellS(d,r.key,'x');if(v==='D'||v==='A')n++});return n}

function strip(){

  if(S.date<today)h+='<div class="muted" style="margin-top:6px">Showing a past day as recorded — read only.</div>';

function boxHTML(pl,r,sec,c,editable,wk,showSec){
  const s=(c&&c.s)||'';const cls={D:'d',N:'n',A:'a'}[s]||'';const yn=r.item&&r.item.yn;
  const sym=s==='D'?(yn?'YES':'✓'):s==='N'?(yn?'NO':'✗'):s==='A'?'NA':'·';
  const tm=s&&c.at?`<span class="tm ${c.l?'late':''}">${fmtT(c.at)}${c.l?' · late':''}</span>`:'';
  const by=s&&c&&c.by?` title="${esc(c.by)}"`:'';
  return `<button class="box ${cls} ${editable?'':'ro'}"${by} data-act="tick" ${wk?'data-wk="1"':''} data-pl="${pl.id}" data-row="${r.key}" data-sec="${sec}"><span class="sl">${wk?'Wk':showSec?esc(sec):''}</span><span class="sy">${sym}</span>${tm}</button>`;
}
function numBox(pl,r,sec,c,editable){
  const v=c&&c.n!=null?c.n:'';
  return `<label class="nbox"><span class="sl">${esc(sec)}</span><input class="remin ${v!==''?'f':''}" type="number" inputmode="numeric" min="0" data-f="num" data-pl="${pl.id}" data-row="${r.key}" data-sec="${sec}" value="${esc(v)}" ${editable?'':'readonly'}><span class="tm">${v!==''&&c.at?fmtT(c.at):''}</span></label>`;
}
function remPanel(pl,r,doc,editable){
  return `<div class="rembox">`+secsOf(pl,r).map(s=>{
    const e=(doc&&doc.rem&&doc.rem[r.key+'__'+s])||{};
    let h=`<div class="rr"><div class="sn">${esc(secLbl(s))}</div>`;
    if(r.rem==='p'){
      const ph=e.ph||[];
      h+=`<div class="phs">`+ph.map(p=>`<button class="ph" data-act="photo" data-id="${p.id}"><img alt="Photo" data-pid="${p.id}" src="${PHOTOS[p.id]||''}"><span>${fmtT(p.at)}</span></button>`).join('')+
        (editable&&ph.length<5?`<label class="phadd">📷 Add<input type="file" accept="image/*" capture="environment" data-act="phup" data-pl="${pl.id}" data-row="${r.key}" data-sec="${s}"></label>`:'')+(!ph.length&&!editable?'<span class="muted">No photo</span>':'')+`</div>`;
      return h+`</div>`;
    }
    if(r.rem==='n'||r.rem==='c')h+=`<input class="remin" type="number" inputmode="numeric" placeholder="#" data-pl="${pl.id}" data-row="${r.key}" data-sec="${s}" data-f="n" value="${esc(e.n==null?'':e.n)}" ${editable?'':'readonly'}>`;
    h+=`<textarea class="remin" rows="1" placeholder="${r.rem==='c'?'Colour':'Remark'}" data-pl="${pl.id}" data-row="${r.key}" data-sec="${s}" data-f="x" ${editable?'':'readonly'}>${esc(e.x||'')}</textarea>`+
      (e.by?`<div class="by">${esc(e.by.split(' ')[0])}<br>${e.at?fmtT(e.at):''}</div>`:'')+`</div>`;
    return h;
  }).join('')+`</div>`;
}
function remCount(pl,r,doc){let n=0;secsOf(pl,r).forEach(s=>{const e=doc&&doc.rem&&doc.rem[r.key+'__'+s];if(e&&((e.n!==''&&e.n!=null)||String(e.x||'').trim()||(e.ph&&e.ph.length)))n++});return n}
const REMLBL={1:'Remark',n:'# / Remark',c:'# / Colour',p:'📷 Photos'};
function rowHTML(pl,r,doc,editable){
  const secs=secsOf(pl,r);const one=secs[0]==='x';
  const rcount=r.rem?remCount(pl,r,doc):0;const open=S.openRem[pl.id+'|'+r.key];
  let h=`<div class="row ${r.sub?'sub':''} ${one?'de':''}"><div class="rl"><span class="lbl">${esc(r.label)}</span><span class="rb">`;
  if(r.rem)h+=`<button class="mini ${open?'on':''}" data-act="rem" data-pl="${pl.id}" data-row="${r.key}">${REMLBL[r.rem]}${rcount?' ('+rcount+')':''}</button>`;
  if(r.item.multi)h+=`<button class="mini ${editable?'':'ro'}" data-act="obsundo" data-pl="${pl.id}" data-row="${r.key}" data-sec="${secs[0]}">↶ Undo last</button>`;
  else if(r.kind!=='num'&&!one)h+=`<button class="mini ${editable?'':'ro'}" data-act="allrow" data-pl="${pl.id}" data-row="${r.key}">all ${r.item.yn?'YES':'✓'}</button>`;
  h+=`</span></div><div class="boxes">`;
  h+=secs.map(s=>{const c=doc&&doc.cells[r.key+'__'+s];return r.kind==='num'?numBox(pl,r,s,c,editable):r.item.multi?obsBoxHTML(pl,r,s,c,editable):boxHTML(pl,r,s,c,editable,false,!one)}).join('');
  h+=`</div>`;
  if(r.rem&&open)h+=remPanel(pl,r,doc,editable);
  return h+'</div>';
}
function blocksHTML(pl,doc,editable){
  let h='';
  DEFS[S.mode].forEach(b=>{
    const info=blockInfo(doc,pl,b,S.date);
    const timeTxt=info.due?fmt12(info.due):'No fixed time';
    h+=`<div class="blk ${info.cls==='Overdue'?'over':''}"><div class="bh"><span class="bn">${esc(b.name)}${b.tag?`<small>${esc(b.tag)}</small>`:''}</span><span class="st ${info.cls}">${info.st}</span>`+
      `<button class="tm-chip" ${isSenior()?`data-act="edittime" data-b="${b.id}"`:'disabled style="opacity:1"'}>⏰ ${timeTxt}${isSenior()?' ✎':''}</button><span class="bpc">${info.c.pct}%</span></div>`;
    if(S.editTime===b.id&&isSenior()){
      h+=`<div class="timed">Due time: <input type="time" id="tin" value="${info.due||'12:00'}"><button data-act="savetime" data-b="${b.id}">Save</button><button class="sec" data-act="notime" data-b="${b.id}">No fixed time</button>${b.time?`<button class="sec" data-act="deftime" data-b="${b.id}">Reset (${fmt12(b.time)})</button>`:''}<button class="sec" data-act="canceltime">Cancel</button></div>`;
    }
    b.items.forEach(it=>{
      h+=`<div class="item">`;
      if(it.subs){
        h+=`<div class="ih"><span>${esc(it.name)}${it.sec&&S.mode==='de'?' <small class="muted" style="font-weight:400">· section-wise</small>':''}</span><button class="mini ${editable?'':'ro'}" data-act="allitem" data-pl="${pl.id}" data-item="${it.id}">All ✓</button></div>`;
        ROWS[S.mode].filter(r=>r.item===it).forEach(r=>{h+=rowHTML(pl,r,doc,editable)});
      }else h+=rowHTML(pl,ROWMAP[it.id],doc,editable);
      h+='</div>';
    });
    h+='</div>';
  });
  return h;
}
function weeklyCard(pl,mode){
  const rows=wkRowsFor(mode);const blk=rows[0].block;
  const d=getWkDoc(pl,S.wk);const ed=canAct(pl.id,true);
  let h=`<div class="blk"><div class="bh"><span class="bn">${esc(blk.name)}<small>weekly – mark once</small></span><span class="bpc">${wkDone(pl,S.wk,rows)}/${rows.length}</span></div>`;
  rows.forEach(r=>{
    h+=`<div class="item"><div class="row de"><div class="rl"><span class="lbl">${esc(r.label)}</span></div><div class="boxes">${boxHTML(pl,r,'x',d&&d.cells[r.key+'__x'],ed,true,false)}</div></div></div>`;
  });
  return h+'</div>';
}
function notDone(pl,doc,mode){
  const out=[];
  ROWS[mode].forEach(r=>{
    const bad=secsOf(pl,r).filter(s=>cellS(doc,r.key,s)==='N');
    if(bad.length)out.push(`<div><b>${esc(r.sub?r.item.name+' › '+r.label:r.label)}</b> <span class="bl">· ${esc(r.block.name)}</span>${bad[0]!=='x'?' — '+bad.map(esc).join(', '):''}</div>`);
  });
  return out.length?out.join(''):'<div class="ok">No “Not Done” items 🎉</div>';
}
function remarksCard(list,mode){mode=mode||'dp';
  const cats={};
  list.forEach(pl=>{
    const doc=getDoc(pl,mode,S.date);if(!doc)return;
    const ents={};
    Object.keys(doc.rem||{}).forEach(k=>{const e=doc.rem[k];const hn=e.n!==''&&e.n!=null;const hp=e.ph&&e.ph.length;if(String(e.x||'').trim()||hn||hp)ents[k]={x:(e.x||'')+(hp?(e.x?' · ':'')+'📷 '+e.ph.length+' photo'+(e.ph.length>1?'s':''):''),by:e.by||(hp?e.ph[e.ph.length-1].by:''),at:e.at||(hp?e.ph[e.ph.length-1].at:0),n:hn?e.n:''}});
    Object.keys(doc.cells||{}).forEach(k=>{const c=doc.cells[k];const r=ROWMAP[k.split('__')[0]];
      if(r&&r.kind==='num'&&c.n!==''&&c.n!=null){ents[k]=Object.assign(ents[k]||{x:''},{n:c.n,by:c.by,at:c.at})}});
    Object.keys(ents).forEach(k=>{
      const e=ents[k];const p=k.split('__');const r=ROWMAP[p[0]];if(!r)return;
      const hasN=e.n!==''&&e.n!=null&&!isNaN(+e.n);
      const cat=(r.block.name==='Student Welfare'?'Welfare › ':'')+(r.sub?r.item.name+' › '+r.label:r.label);
      const c=cats[cat]=cats[cat]||{tot:0,hasNum:false,list:[],ord:ROWS[mode].indexOf(r)};
      c.list.push({pl:pl,sec:p[1],n:hasN?e.n:'',x:e.x||'',by:e.by,at:e.at});
      if(hasN){c.tot+=+e.n;c.hasNum=true}
    });
  });
  const names=Object.keys(cats).sort((a,b)=>cats[a].ord-cats[b].ord);
  let h=`<div class="card"><h3>Numbers &amp; Remarks by category</h3>`;
  if(!names.length)return h+`<div class="muted">No numbers or remarks recorded for this day.</div></div>`;
  names.forEach(n=>{
    const c=cats[n];
    h+=`<div class="cat"><b>${esc(n)}</b>${c.hasNum?`<span class="tot">Total: ${c.tot}</span>`:''}<table><tr><th>Section</th><th>No.</th><th>Remark</th><th>By · time</th></tr>`+
      c.list.map(e=>`<tr><td>${list.length>1?esc(e.pl.name)+' · ':''}${esc(e.sec)}</td><td>${esc(e.n)}</td><td>${esc(e.x)}</td><td>${esc(e.by||'')}${e.at?' · '+fmtT(e.at):''}</td></tr>`).join('')+`</table></div>`;
  });
  return h+'</div>';
}
function weekChart(pl){
  const dates=weekDates(S.wk);const today=todayStr();
  return `<div class="wk">`+dates.map((d,i)=>{
    const c=stats(getDoc(pl,S.mode,d),pl,S.mode);const fut=d>today;
    const cl=c.N>0?'r':c.pct===100&&c.T?'g':'';
    return `<div><div class="col">${fut?'':`<i class="${cl}" style="height:${c.pct}%"></i>`}</div>${DAYN[i]}<br><b>${fut?'–':c.pct+'%'}</b></div>`;
  }).join('')+`</div>`;
}
function sectionBoxes(pl,doc,mode){
  const rows=ROWS[mode].filter(r=>secsOf(pl,r)[0]!=='x');
  return `<div class="secs">`+pl.sections.map(s=>{
    let d=0,h=0,t=0;rows.forEach(r=>{const v=cellS(doc,r.key,s);t++;if(v==='D'||v==='A')d++;if(v==='N')h++});
    const p=t?Math.round(d/t*100):0;
    return `<div class="sbox ${h?'r':p===100?'g':''}">${esc(s)}<b>${p}%</b>${h?`<span style="color:var(--red)">${h} ✗</span>`:''}</div>`;
  }).join('')+`</div>`;
}
function dueBanner(pl,doc){
  if(S.date!==todayStr())return '';
  const od=[],ds2=[];let next=null;const nm=nowMin();
  DEFS[S.mode].forEach(b=>{const i=blockInfo(doc,pl,b,S.date);if(i.cls==='Done'||!i.due)return;
    if(i.st==='Overdue')od.push(b.name+' ('+fmt12(i.due)+')');
    else if(i.st==='Due soon')ds2.push(b.name+' in '+(toMin(i.due)-nm)+' min');
    else if(i.st==='Upcoming'&&(!next||toMin(i.due)<toMin(next.due)))next={n:b.name,due:i.due}});
  let h='';
  if(od.length)h+=`<div class="due od">⏰ <b>Overdue:</b> ${od.map(esc).join(' · ')}</div>`;
  if(ds2.length)h+=`<div class="due ds">⚠️ <b>Due soon:</b> ${ds2.map(esc).join(' · ')}</div>`;
  if(next)h+=`<div class="due">Next due: <b>${esc(next.n)}</b> at ${fmt12(next.due)} (in ${toMin(next.due)-nm} min)</div>`;
  if(!od.length&&!ds2.length&&!next)h+=`<div class="due ok2">✓ Nothing pending against a due time right now.</div>`;
  return h;
}
function plPage(pl){
  const mode=S.mode,doc=getDoc(pl,mode,S.date);const c=stats(doc,pl,mode);const today=todayStr();const editable=canAct(pl.id);
  let notice='';
  if(S.date<today)notice='<div class="notice info">Past day — shown as recorded.</div>';
  else if(!editable&&S.date===today)notice=`<div class="notice">You can view ${esc(pl.name)}’s plan, but only ${esc(pl.name)} and the seniors can update it.</div>`;
  let h=notice+dueBanner(pl,doc);
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin:0">${esc(pl.name)} · ${pl.cls}</h3><span class="muted">${mode==='dp'?'Day Plan':'Day End'} · ${pl.sections.length} sections · ${parseD(S.date).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'})}</span></div><div class="pct">${c.pct}%</div></div>`+
    `<div class="counts" style="margin-top:8px"><div class="cnt d"><b>${c.D}</b><span>Done</span></div><div class="cnt n"><b>${c.N}</b><span>Not Done</span></div><div class="cnt a"><b>${c.A}</b><span>NA</span></div><div class="cnt"><b>${c.P}</b><span>Pending</span></div></div>`+
    `<div class="bar ${c.N?'rd':''}"><i style="width:${c.pct}%"></i></div><div class="muted" style="margin-top:4px">% complete = (Done + NA) ÷ total · ${mode==='dp'?'Observation Update':'Weekend Audit'} ${wkDone(pl,S.wk,wkRowsFor(mode))}/${wkRowsFor(mode).length}</div></div>`;
  h+=`<div class="card"><h3>This week</h3>${weekChart(pl)}</div>`;
  h+=`<div class="card"><h3>Section-wise completion</h3>${sectionBoxes(pl,doc,mode)}</div>`;
  h+=`<div class="card"><h3>Not Done</h3><div class="nd">${notDone(pl,doc,mode)}</div></div>`;
  h+=remarksCard([pl],mode);
  h+=blocksHTML(pl,doc,editable);
  h+=weeklyCard(pl,mode);
  return h;
}
function dashboard(){
  const mode=S.mode,today=todayStr();let h='';
  h+=`<div class="card"><h3>All PMs · ${parseD(S.date).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'})} · ${mode==='dp'?'Day Plan':'Day End'}</h3><div class="grid4">`;
  PLS.forEach(pl=>{
    const doc=getDoc(pl,mode,S.date);const c=stats(doc,pl,mode);
    let od=0;DEFS[mode].forEach(b=>{const i=blockInfo(doc,pl,b,S.date);if(i.st==='Overdue'||(S.date<today&&i.st==='Missed'))od++});
    h+=`<div class="plc"><h4>${esc(pl.name)}</h4><small>${pl.cls}</small><div class="pct" style="margin:4px 0">${c.pct}%</div><div class="bar ${c.N?'rd':''}"><i style="width:${c.pct}%"></i></div>`+
      `<div class="counts" style="margin-top:8px"><div class="cnt d"><b>${c.D}</b><span>Done</span></div><div class="cnt n"><b>${c.N}</b><span>Not Done</span></div><div class="cnt a"><b>${c.A}</b><span>NA</span></div><div class="cnt"><b>${c.P}</b><span>Pending</span></div></div>`+
      `<div class="muted">Blocks ${S.date<today?'missed':'overdue'}: <b style="color:${od?'var(--red)':'var(--green)'}">${od}</b>${' · Weekly '+wkDone(pl,S.wk,wkRowsFor(mode))+'/'+wkRowsFor(mode).length}</div></div>`;
  });
  h+='</div></div>';
  h+=`<div class="card"><h3>Section-wise completion</h3>`+PLS.map(pl=>`<div style="margin-bottom:8px"><b>${esc(pl.name)}</b>${sectionBoxes(pl,getDoc(pl,mode,S.date),mode)}</div>`).join('')+`</div>`;
  const dates=weekDates(S.wk);
  h+=`<div class="card"><h3>Week table (% complete)</h3><table><tr><th>PM</th>${dates.map((d,i)=>`<th style="text-align:center">${DAYN[i]}</th>`).join('')}</tr>`+
    PLS.map(pl=>`<tr><td><b>${esc(pl.name)}</b></td>`+dates.map(d=>{
      if(d>today)return '<td class="c">🔒</td>';const c=stats(getDoc(pl,mode,d),pl,mode);const any=c.D+c.A+c.N>0;
      return `<td class="c ${c.N?'r':(c.pct===100?'g':'')}">${any?c.pct+'%':'–'}</td>`}).join('')+'</tr>').join('')+`</table></div>`;
  h+=`<div class="card"><h3>Not Done by PM</h3>`+PLS.map(pl=>`<div style="margin-bottom:8px"><b>${esc(pl.name)}</b><div class="nd">${notDone(pl,getDoc(pl,mode,S.date),mode)}</div></div>`).join('')+`</div>`;
  h+=remarksCard(PLS,mode);
  return h;
}

/* ================= PHOTOS ================= */
const PHOTOS={};const phLoading={};
function loadPhotos(){
  document.querySelectorAll('img[data-pid]').forEach(img=>{const id=img.dataset.pid;if(PHOTOS[id]||phLoading[id])return;phLoading[id]=1;
    api('pmPhotoGet',[id]).then(v=>{PHOTOS[id]=v.data;document.querySelectorAll(`img[data-pid="${id}"]`).forEach(x=>x.src=v.data)}).catch(()=>{}).finally(()=>{delete phLoading[id]})});
}
function shrink(file){
  return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
    img.onload=()=>{let w=720,q=0.62,out='';
      for(let t=0;t<6;t++){const sc=Math.min(1,w/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=46000)break;w=Math.round(w*0.8);q=Math.max(0.4,q-0.06)}
      URL.revokeObjectURL(u);out.length<=46000?res(out):rej(new Error('Photo is too large.'))};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that photo.'))};img.src=u});
}
async function uploadPhoto(el){
  const plId=el.dataset.pl,rk=el.dataset.row,sec=el.dataset.sec,f=el.files&&el.files[0];el.value='';
  if(!f||!canAct(plId))return;
  const mode=ROWMAP[rk].mode,id=docId(plId,mode,S.date);
  showOk('Uploading photo…');
  try{const data=await shrink(f);flushAll();
    const doc=await api('pmPhoto',[id,rk+'__'+sec,data]);
    const ph=doc.rem[rk+'__'+sec].ph;PHOTOS[ph[ph.length-1].id]=data;
    S.docs[id]=overlay(id,doc);saveLocal();render(true);showOk('Photo saved.');
  }catch(e){showMsg(e.message==='offline'?"Can't reach the server — photo not saved.":e.message)}
}
function showPhoto(id){
  const src=PHOTOS[id];if(!src)return;
  const d=document.createElement('div');d.className='phview';d.innerHTML=`<img alt="Photo" src="${src}"><button>Close</button>`;
  d.addEventListener('click',()=>d.remove());document.body.appendChild(d);
}

/* ================= EVENTS ================= */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='login'){doLogin();return}
  if(a==='logout'){logout();return}
  if(a==='view'){S.view=S.view===t.dataset.v?null:t.dataset.v;S.users=null;render(true);window.scrollTo(0,0);return}
  if(a==='closeview'){S.view=null;render(true);return}
  if(a==='savepw'){doChangePw(S.me.id,'np1','np2');return}
  if(a==='setuserpw'){doChangePw(t.dataset.u,'up_'+t.dataset.u);return}
  if(a==='mode'){S.mode=t.dataset.v;S.editTime=null;render(true)}
  else if(a==='tab'){if(t.dataset.v==='dash'&&!(S.me&&S.me.senior))return;S.tab=t.dataset.v;render(true);window.scrollTo(0,0)}
  else if(a==='day'){S.date=t.dataset.v;render(true)}
  else if(a==='wk'){
    const m=parseD(S.wk);m.setDate(m.getDate()+7*Number(t.dataset.v));S.wk=ds(m);
    const dates=weekDates(S.wk);const today=todayStr();
    S.date=dates.includes(today)?today:(dates.filter(d=>d<=today).pop()||dates[0]);
    subscribeWeek(S.wk);render(true);
  }
  else if(a==='tick')doTick(t.dataset.pl,t.dataset.row,t.dataset.sec,!!t.dataset.wk);
  else if(a==='obsadd')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'add');
  else if(a==='obsundo')doObs(t.dataset.pl,t.dataset.row,t.dataset.sec,'pop');
  else if(a==='allrow'){const p=plOf(t.dataset.pl);setCells(p.id,secsOf(p,ROWMAP[t.dataset.row]).map(s=>[t.dataset.row,s,'D']))}
  else if(a==='allitem'){const p=plOf(t.dataset.pl);const list=[];ROWS[S.mode].filter(r=>r.item.id===t.dataset.item).forEach(r=>secsOf(p,r).forEach(s=>list.push([r.key,s,'D'])));setCells(p.id,list)}
  else if(a==='rem'){const k=t.dataset.pl+'|'+t.dataset.row;S.openRem[k]=!S.openRem[k];render(true)}
  else if(a==='photo')showPhoto(t.dataset.id);
  else if(a==='edittime'){S.editTime=S.editTime===t.dataset.b?null:t.dataset.b;render(true)}
  else if(a==='canceltime'){S.editTime=null;render(true)}
  else if(a==='savetime'||a==='notime'||a==='deftime'){
    if(!isSenior())return;const b=t.dataset.b;let v;
    if(a==='savetime'){v=document.getElementById('tin').value;if(!v)return}else if(a==='notime')v='none';else v='def';
    S.times[b]=v;persistCfg({times:{[b]:v},by:whoName(),at:Date.now()});S.editTime=null;render(true);
  }
});
document.addEventListener('change',ev=>{if(ev.target.dataset&&ev.target.dataset.act==='phup')uploadPhoto(ev.target)});
document.addEventListener('input',ev=>{if(ev.target.classList&&ev.target.classList.contains('remin'))onRemInput(ev.target)});
document.addEventListener('focusout',ev=>{
  if(ev.target.classList&&ev.target.classList.contains('remin')){flushAll();setTimeout(()=>{if(!typing()&&S.dirty)render(true)},80)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='lpw')doLogin()});
window.addEventListener('pagehide',flushAll);
setInterval(()=>render(),30000);
