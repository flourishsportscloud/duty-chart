<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>FIS Tasks & Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F1E9;--card:#FFFFFF;--ink:#14213D;--muted:#5E6577;--line:#E4DECF;--soft:#FAF8F3;
  --gold:#9C7A33;--gold-bg:#F3EAD3;--navy:#14213D;--navy2:#22335C;--on-navy:#F6F3EC;
  --bad:#A32A2A;--bad-bg:#F8E4E2;--warn:#8A5A00;--warn-bg:#FBEFD2;--ok:#2D6B3F;--ok-bg:#E3F0E5;
  --work:#1F4E8C;--work-bg:#E1EAF6;--rw:#7A3E9D;--rw-bg:#F0E6F6;--todo:#5E6577;--todo-bg:#ECEEF3;--no:#7B7B7B;--no-bg:#EDEDED;
  --sh:0 1px 2px rgba(20,33,61,.06),0 10px 28px rgba(20,33,61,.07);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1322;--card:#161E33;--ink:#EDE8DB;--muted:#9CA3B8;--line:#28324D;--soft:#121A2D;
  --gold:#D4B16A;--gold-bg:#2B2616;--navy:#EDE8DB;--navy2:#C9C2B0;--on-navy:#0D1322;
  --bad:#FF9D94;--bad-bg:#3A1E24;--warn:#F2C060;--warn-bg:#35290F;--ok:#8FD5A0;--ok-bg:#17301F;
  --work:#9DC1F2;--work-bg:#172A47;--rw:#D3A6EC;--rw-bg:#2D1D3A;--todo:#9CA3B8;--todo-bg:#1E2740;--no:#A5A5A5;--no-bg:#262626;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));display:grid;gap:14px}
/* top bar */
.hdr{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.mono{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 15px var(--serif);letter-spacing:.04em;border:1px solid var(--gold);flex:none}
.hdr h1{font:700 24px/1 var(--serif);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr small{display:block;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.me{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;min-height:40px;font-weight:600;font-size:13px;box-shadow:var(--sh)}
/* avatars */
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--sans);color:#fff;flex:none;border:2px solid var(--card)}
.av.sm{width:22px;height:22px;font-size:10px;border-width:1.5px}.av.lg{width:52px;height:52px;font-size:20px}
.c0{background:#14213D}.c1{background:#7A3E9D}.c2{background:#1F4E8C}.c3{background:#2D6B3F}.c4{background:#9C7A33}.c5{background:#A32A2A}.c6{background:#0F766E}.c7{background:#B45309}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px}
/* hero */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:var(--on-navy);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden;border:1px solid var(--gold)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(212,177,106,.35),transparent 70%)}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(135deg,#1B2A4D,#0F1830);color:#EDE8DB}}
.hero .hi{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h2{font:700 32px/1.1 var(--serif);margin:4px 0 2px}
.hero p{opacity:.85;font-size:14px;max-width:34ch}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.tile{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 6px;text-align:center;color:inherit;min-height:56px}
.tile b{display:block;font:700 24px/1 var(--serif)}
.tile span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.tile.hot{background:rgba(255,120,110,.22);border-color:rgba(255,160,150,.5)}
/* banner */
.alert{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border:1px solid transparent;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;text-align:left;width:100%}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.banner{padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
/* sections */
.sh{display:flex;align-items:baseline;gap:8px;margin:6px 2px 0}
.sh h3{font:700 21px var(--serif)}
.sh span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sh.bad h3{color:var(--bad)}.sh.rev h3{color:var(--warn)}.sh.rw h3{color:var(--rw)}
.sh .grow{flex:1}
.cards{display:grid;gap:10px}
.empty{padding:26px 18px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;font:700 22px var(--serif);color:var(--ink);margin-bottom:4px}
/* chips and buttons */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}.scroll .chip{white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:10px 6px;font-weight:600;font-size:13px;color:var(--muted);min-height:42px}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--on-navy)}
.btn{min-height:44px;padding:8px 18px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;font-size:14px}
.btn.pri{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.warn{background:var(--rw-bg);color:var(--rw);border-color:transparent}
.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
/* task card */
.tk{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--todo);border-radius:14px;padding:12px 14px;display:grid;gap:8px;box-shadow:var(--sh);cursor:pointer;position:relative}
.tk.s-working{border-left-color:var(--work)}.tk.s-review{border-left-color:#C98A00}.tk.s-rework{border-left-color:var(--rw)}.tk.s-done{border-left-color:var(--ok)}.tk.s-declined{border-left-color:var(--no)}
.tk.over{border-left-color:var(--bad)}
.tk.s-done h3,.tk.s-declined h3{color:var(--muted)}
.tk.s-done h3{text-decoration:line-through}
.tk .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tk .top .grow{flex:1}
.tk h3{font:600 16px/1.3 var(--sans)}
.tk .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tk .meta b{color:var(--ink);font-weight:600}
.tk .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk .foot .grow{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold-bg);color:var(--gold);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.daily{background:var(--work-bg);color:var(--work)}
.flag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.pill.rev{background:var(--warn-bg);color:var(--warn);border-color:transparent}.pill.rw{background:var(--rw-bg);color:var(--rw);border-color:transparent}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st.todo{background:var(--todo-bg);color:var(--todo)}.st.work{background:var(--work-bg);color:var(--work)}.st.rev{background:var(--warn-bg);color:var(--warn)}.st.rw{background:var(--rw-bg);color:var(--rw)}.st.ok{background:var(--ok-bg);color:var(--ok)}.st.no{background:var(--no-bg);color:var(--no)}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap}
/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--sh)}
.panel.gold{border-top:3px solid var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.bad{color:var(--bad);font-weight:700}td.ok{color:var(--ok);font-weight:700}td.rv{color:var(--warn);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-weight:600}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.kpi b{display:block;font:700 30px/1 var(--serif)}.kpi span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}.kpi.rev b{color:var(--warn)}.kpi.work b{color:var(--work)}.kpi.gold b{color:var(--gold)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 13px var(--sans);font-style:normal}
.pcard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:14px;display:grid;gap:10px;text-align:left;width:100%;box-shadow:var(--sh)}
.pcard h3{font:700 22px/1.15 var(--serif)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0;min-height:36px;text-align:left}
.pers{display:flex;align-items:center;gap:10px;margin-top:6px}.pers b{font-weight:700}.pers span{color:var(--muted);font-size:12px}
/* inputs */
input[type=text],input[type=date],input[type=time],input[type=password],textarea,select{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:16px}
textarea{resize:vertical}
label.l{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.f{display:grid;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
.sw{display:flex;align-items:center;gap:10px;font-size:14px}.sw input{width:20px;height:20px}
.pk{display:flex;gap:8px;flex-wrap:wrap}
.pk button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;min-height:40px;font-weight:600;font-size:13px;color:var(--muted)}
.pk button[aria-pressed=true]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,33,61,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#bar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end}
#bar button.t{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;position:relative}
#bar button.t[aria-selected=true]{color:var(--gold)}
#bar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bar .fab{border:0;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;font:400 32px/1 var(--sans);margin:-26px auto 0;box-shadow:0 8px 20px rgba(156,122,51,.45);border:4px solid var(--card)}
#bar .bd{position:absolute;top:2px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--gold);-webkit-overflow-scrolling:touch}
@media(min-width:700px){#ov{align-items:center}#sheet{border-radius:20px;max-height:90vh}}
#sheet h2.t{font:700 26px/1.15 var(--serif);margin-bottom:6px}
.sx{float:right;border:0;background:var(--card);border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1;color:var(--muted);margin:-2px 0 6px 8px;border:1px solid var(--line)}
.kv{display:grid;gap:8px;margin:10px 0}
.kv div{display:flex;gap:10px;align-items:center;font-size:14px}.kv label{width:88px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none}
.thread{display:grid;gap:10px;margin:14px 0}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;max-width:92%;font-size:14px;box-shadow:0 1px 2px rgba(20,33,61,.05)}
.msg.me{margin-left:auto;background:var(--gold-bg);border-color:transparent}
.msg .mh{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px;flex-wrap:wrap}.msg .mh b{color:var(--ink)}
.msg .kd{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.msg.k-submit .kd{background:var(--warn-bg);color:var(--warn)}.msg.k-approve{border-color:var(--ok);background:var(--ok-bg)}.msg.k-approve .kd{background:var(--ok);color:#fff}
.msg.k-rework{border-color:var(--rw);background:var(--rw-bg)}.msg.k-rework .kd{background:var(--rw);color:#fff}
.msg.k-decline{border-color:var(--bad);background:var(--bad-bg)}.msg.k-decline .kd{background:var(--bad);color:#fff}
.msg.k-demand{border-color:var(--gold);background:var(--gold-bg)}.msg.k-demand .kd{background:var(--gold);color:#fff}
.msg.k-brief .kd{background:var(--work-bg);color:var(--work)}
.msg.prob{box-shadow:inset 3px 0 0 var(--bad)}
.msg .pf{color:var(--bad);font-weight:700;font-size:12px}
.sysl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);justify-content:center}
.ims{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.im{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:0;overflow:hidden;width:96px;height:72px}
.im img{width:100%;height:100%;object-fit:cover;display:block;background:var(--line)}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;position:sticky;bottom:-8px}
.cmp .acts{display:flex;gap:8px;flex-wrap:wrap}
.pvs{display:flex;gap:6px;flex-wrap:wrap}.pv{position:relative;width:64px;height:48px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.pv img{width:100%;height:100%;object-fit:cover}.pv button{position:absolute;top:0;right:0;border:0;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;line-height:1;font-size:13px}
.sub{font-size:12px;color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:80;display:grid;place-items:center;padding:16px}
#lb img{max-width:100%;max-height:86vh;border-radius:10px}
#lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:42px;height:42px;font-size:22px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;max-width:90vw;box-shadow:var(--sh)}
.demo{background:var(--gold-bg);color:var(--gold);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.persona{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.persona button{display:grid;justify-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-weight:600;box-shadow:var(--sh)}
.persona small{color:var(--muted);font-weight:500;font-size:11px}
@media(min-width:760px){.tiles{gap:12px}}
@media(max-width:420px){.hero h2{font-size:28px}.row{grid-template-columns:1fr}}
@media print{#bar,#ov,#toast{display:none!important}}
</style></head>
<body>
<div class="wrap" id="app"></div>
<nav id="bar" hidden></nav>
<div id="ov" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="lb" hidden></div>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
var API_URL='https://script.google.com/macros/s/AKfycbw4OG5V07zPUjbFvfZr7-9YpcAG6W7cSJ6cJ84nY_chPehLlH0Tezv-jVsV95eExJv4/exec';/* paste the Web app URL (ends in /exec) between the quotes, or open the page once with ?api=URL */
var GUIDE_URL='FIS-Tasks-and-Projects-Guide.pdf';
var S={tok:'',me:'',admin:false,loaded:false,err:'',tasks:[],projects:[],people:[],P:{},PJ:{},view:'home',scope:'me',group:'deadline',flt:'open',pj:'',pjp:'',period:'week',dp:'',dpg:'deadline',mx:false,cmp:{},confirm:null,redraw:null,demo:false,seen:{},base:0,imgc:{},open:''};
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function pdate(s){var a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2])}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(s){if(!s)return 'No date';var d=pdate(s);return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function ftime(t){if(!t)return '';var a=t.split(':'),h=+a[0];return (h%12||12)+':'+a[1]+' '+(h<12?'AM':'PM')}
function fstamp(ms){if(!ms)return '';var d=new Date(ms);return d.getDate()+' '+MON[d.getMonth()]+', '+ftime(pad(d.getHours())+':'+pad(d.getMinutes()))}
function addDays(s,n){var d=pdate(s);d.setDate(d.getDate()+n);return ymd(d)}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2800)}
function nm(id){return S.P[id]?S.P[id].name:'—'}
function fn1(id){return nm(id).split(' ')[0]}
function hue(id){var h=0;id=String(id);for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h%8}
function ini(id){return esc(nm(id).trim().charAt(0).toUpperCase()||'?')}
function av(id,c){return '<span class="av c'+hue(id)+' '+(c||'')+'" title="'+esc(nm(id))+'">'+ini(id)+'</span>'}
function avs(ids,c){ids=ids||[];var m=ids.slice(0,4).map(function(i){return av(i,c)}).join('');if(ids.length>4)m+='<span class="av sm c0">+'+(ids.length-4)+'</span>';return '<span class="avs">'+m+'</span>'}
function names(ids){return (ids||[]).map(fn1).join(', ')||'—'}
function has(t,p){return (t.assignees||[]).indexOf(p)>=0}
function dueMs(t){if(!t.date)return null;var d=pdate(t.date);if(t.time){var a=t.time.split(':');d.setHours(+a[0],+a[1],0,0)}else d.setHours(23,59,59,0);return d.getTime()}
function span(ms){var m=Math.max(1,Math.round(ms/60000));if(m<60)return m+' min';var h=Math.floor(m/60);if(h<48){var r=m%60;return h+'h'+(r?' '+r+'m':'')}return Math.floor(h/24)+' days'}
var ST={todo:['To do','todo'],working:['Working','work'],review:['In review','rev'],rework:['Rework','rw'],done:['Done','ok'],declined:['Declined','no']};
function stOf(t){return t.status||'todo'}
function isOpen(t){var s=stOf(t);return s==='todo'||s==='working'||s==='rework'}
function isClosed(t){var s=stOf(t);return s==='done'||s==='declined'}
function isOver(t){var d=dueMs(t);return isOpen(t)&&d!=null&&d<Date.now()}
function onTime(t){var d=dueMs(t);return t.status==='done'&&(d==null||(t.deliveredAt||t.doneAt||0)<=d)}
function sortDue(a,b){var x=dueMs(a),y=dueMs(b);if(x==null)x=9e15;if(y==null)y=9e15;return x-y}
function stChip(t){var s=ST[stOf(t)]||ST.todo;return '<span class="st '+s[1]+'">'+s[0]+'</span>'}
function dueInfo(t){
  var s=stOf(t);
  if(s==='done')return {c:'ok',x:'Done '+fstamp(t.doneAt)};
  if(s==='declined')return {c:'',x:'Declined'};
  if(s==='review')return {c:'rev',x:'Awaiting approval'};
  var d=dueMs(t);if(d==null)return {c:'',x:'No deadline'};
  var diff=d-Date.now();
  if(diff<0)return {c:'bad',x:'Overdue '+span(-diff)};
  return {c:diff<3*3600e3?'warn':'',x:'Due in '+span(diff)};
}
function lastMsg(t){var m=(t.msgs||[]).filter(function(x){return x.kind!=='start'});return m.length?m[m.length-1]:null}
function nImgs(t){return (t.msgs||[]).reduce(function(n,m){return n+((m.imgs||[]).length)},0)}
function unread(t){
  if(!(has(t,S.me)||t.by===S.me))return false;
  var m=lastMsg(t);if(!m||m.by===S.me)return false;
  return m.at>(S.seen[t.id]||S.base);
}
function markSeen(id){S.seen[id]=Date.now();try{localStorage.setItem('fisTkSeen:'+S.me,JSON.stringify(S.seen))}catch(e){}}
function loadSeen(){
  try{S.seen=JSON.parse(localStorage.getItem('fisTkSeen:'+S.me)||'{}')}catch(e){S.seen={}}
  try{var b=+localStorage.getItem('fisTkBase:'+S.me);if(!b){b=Date.now()-24*3600e3;localStorage.setItem('fisTkBase:'+S.me,b)}S.base=b}catch(e){S.base=Date.now()-24*3600e3}
}
function pjName(t){return t.project&&S.PJ[t.project]?S.PJ[t.project].title:''}
function pjTag(t){var n=pjName(t);return n?'<span class="tag">'+esc(n)+'</span>':'<span class="tag daily">Daily task</span>'}

/* ---------- reminders (what needs me) ---------- */
function attn(){
  var me=S.me,td=today(),T=S.tasks,mine=T.filter(function(t){return has(t,me)});
  var o={
    approve:T.filter(function(t){return stOf(t)==='review'&&t.by===me}).sort(sortDue),
    rework:mine.filter(function(t){return stOf(t)==='rework'}).sort(sortDue),
    over:mine.filter(isOver).sort(sortDue),
    today:mine.filter(function(t){return isOpen(t)&&!isOver(t)&&t.date===td}).sort(sortDue),
    unread:T.filter(unread),
    soon:mine.filter(function(t){return isOpen(t)&&t.date>td&&t.date<=addDays(td,7)}).sort(sortDue)
  };
  o.count=o.approve.length+o.rework.length+o.over.length;
  return o;
}
function taskCard(t,o){
  o=o||{};var di=dueInfo(t),over=isOver(t),s=stOf(t),a=has(t,S.me),owner=t.by===S.me||S.admin;
  var h='<article class="tk s-'+s+(over?' over':'')+'" data-act="open" data-id="'+t.id+'">';
  h+='<div class="top">'+pjTag(t)+(t.priority==='high'?'<span class="flag">▲ High</span>':'')+'<span class="grow"></span>'+(unread(t)?'<span class="dot" title="New message"></span>':'')+'<span class="pill '+di.c+'">'+esc(di.x)+'</span></div>';
  h+='<h3>'+esc(t.title)+'</h3>';
  h+='<div class="meta">'+avs(t.assignees,'sm')+'<span><b>'+esc(names(t.assignees))+'</b>'+(t.by?' · from <b>'+esc(fn1(t.by))+'</b>':'')+'</span></div>';
  h+='<div class="meta"><span>'+esc(fdate(t.date))+(t.time?' · '+esc(ftime(t.time)):'')+'</span></div>';
  var nm_=(t.msgs||[]).filter(function(m){return m.kind==='say'||m.kind==='rework'||m.kind==='demand'||m.kind==='submit'}).length,ni=nImgs(t);
  h+='<div class="foot">'+stChip(t)+(nm_?'<span class="cnt">💬 '+nm_+'</span>':'')+(ni?'<span class="cnt">📷 '+ni+'</span>':'')+(t.approval?'<span class="cnt">✔ approval</span>':'')+'<span class="grow"></span>';
  if(o.quick!==false){
    if(a&&(s==='todo'||s==='rework'))h+='<button class="btn sm pri" data-act="qstart" data-id="'+t.id+'">Start</button>';
    else if(a&&s==='working'&&!t.approval)h+='<button class="btn sm ok" data-act="qdone" data-id="'+t.id+'">Mark done</button>';
    else if(a&&s==='working')h+='<button class="btn sm gold" data-act="open" data-id="'+t.id+'">Submit</button>';
    else if(owner&&s==='review')h+='<button class="btn sm gold" data-act="open" data-id="'+t.id+'">Review</button>';
  }
  return h+'</div></article>';
}
function cards(list,o){return '<div class="cards">'+list.map(function(t){return taskCard(t,o)}).join('')+'</div>'}
function sec(title,list,cls,o,sub){
  if(!list.length)return '';
  return '<section class="grp"><div class="sh '+(cls||'')+'"><h3>'+title+'</h3><span>'+(sub||list.length+' task'+(list.length>1?'s':''))+'</span></div>'+cards(list,o)+'</section>';
}

/* ---------- Home ---------- */
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function homeHtml(){
  var a=attn(),td=new Date(),mine=S.tasks.filter(function(t){return has(t,S.me)});
  var working=mine.filter(function(t){return stOf(t)==='working'}).length;
  var line=a.count?('You have '+a.count+' thing'+(a.count>1?'s':'')+' that need'+(a.count>1?'':'s')+' you. Sorted by urgency below.'):(a.today.length?('A calm day: '+a.today.length+' task'+(a.today.length>1?'s':'')+' due today and nothing overdue.'):'You are all clear. Nothing is overdue or waiting for you.');
  var h='<div class="hero"><div class="hi">'+DOW[td.getDay()]+', '+td.getDate()+' '+MON[td.getMonth()]+'</div><h2>'+greet()+', '+esc(fn1(S.me))+'</h2><p>'+line+'</p>';
  h+='<div class="tiles"><button class="tile" data-act="go" data-v="today"><b>'+a.today.length+'</b><span>Due today</span></button><button class="tile'+(a.over.length?' hot':'')+'" data-act="go" data-v="over"><b>'+a.over.length+'</b><span>Overdue</span></button><button class="tile" data-act="go" data-v="working"><b>'+working+'</b><span>Working</span></button><button class="tile'+(a.approve.length?' hot':'')+'" data-act="go" data-v="approve"><b>'+a.approve.length+'</b><span>To approve</span></button></div></div>';
  if(a.approve.length){
    h+='<section class="grp"><div class="sh rev"><h3>Waiting for your approval</h3><span>'+a.approve.length+'</span></div><div class="cards">'+a.approve.map(function(t){
      var m=(t.msgs||[]).filter(function(x){return x.kind==='submit'}).slice(-1)[0];
      return '<article class="tk s-review" data-act="open" data-id="'+t.id+'"><div class="top">'+pjTag(t)+'<span class="grow"></span><span class="pill rev">Submitted '+esc(fstamp(t.deliveredAt))+'</span></div><h3>'+esc(t.title)+'</h3><div class="meta">'+avs(t.assignees,'sm')+'<span><b>'+esc(names(t.assignees))+'</b> submitted this</span></div>'+(m&&m.text?'<div class="meta">“'+esc(m.text)+'”</div>':'')+((m&&m.imgs&&m.imgs.length)?'<div class="meta">📷 '+m.imgs.length+' photo'+(m.imgs.length>1?'s':'')+'</div>':'')+'<div class="foot"><button class="btn sm ok" data-act="qappr" data-id="'+t.id+'">Approve</button><button class="btn sm warn" data-act="open" data-id="'+t.id+'">Rework / decline</button></div></article>';
    }).join('')+'</div></section>';
  }
  h+=sec('Rework requested',a.rework,'rw');
  h+=sec('Overdue',a.over,'bad');
  h+=sec('Due today',a.today,'');
  var ur=a.unread.filter(function(t){return a.approve.indexOf(t)<0&&a.rework.indexOf(t)<0&&a.over.indexOf(t)<0&&a.today.indexOf(t)<0});
  h+=sec('New messages',ur.slice(0,5),'');
  h+=sec('Coming up this week',a.soon.slice(0,5),'',null,'next 7 days');
  if(!a.count&&!a.today.length&&!ur.length&&!a.soon.length)h+='<div class="empty"><b>All clear ✓</b>No pending tasks. New tasks allocated to you will appear here.</div>';
  if(S.admin)h+='<button class="btn" data-act="nav" data-v="team">Open the Director dashboard →</button>';
  return h;
}

/* ---------- Tasks ---------- */
function groupTasks(list,mode,scope){
  var td=today(),tm=addDays(td,1),wk=addDays(td,7),G=[],map={};
  function put(key,title,t,cls,ord,sub){if(!map[key]){map[key]={key:key,title:title,cls:cls||'',ord:ord||0,sub:sub||'',list:[]};G.push(map[key])}map[key].list.push(t)}
  list.forEach(function(t){
    if(mode==='deadline'){
      if(isClosed(t))return put('z','Completed',t,'',9);
      if(isOver(t))return put('a','Overdue',t,'bad',0);
      if(!t.date)return put('f','No deadline',t,'',6);
      if(t.date<td)return put('b','Earlier · in review',t,'rev',1);
      if(t.date===td)return put('c','Today',t,'',2);
      if(t.date===tm)return put('d','Tomorrow',t,'',3);
      if(t.date<=wk)return put('e','Next 7 days',t,'',4);
      return put('e2','Later',t,'',5);
    }
    if(mode==='person'){
      var ids=scope==='by'?(t.assignees||[]):[t.by||'?'];
      ids.forEach(function(p){put(p,(scope==='by'?'To ':'From ')+nm(p),t,'',0)});return;
    }
    if(mode==='project'){var k=t.project||'_';return put(k,t.project&&S.PJ[t.project]?S.PJ[t.project].title:'Daily tasks',t,'',k==='_'?1:0)}
    var order={rework:0,review:1,working:2,todo:3,done:4,declined:5};var s=stOf(t);put(s,ST[s][0],t,s==='rework'?'rw':s==='review'?'rev':'',order[s]);
  });
  G.forEach(function(g){g.list.sort(sortDue)});
  if(mode==='person')G.sort(function(a,b){return sortDue(a.list[0],b.list[0])});else G.sort(function(a,b){return a.ord-b.ord||(a.title<b.title?-1:1)});
  return G;
}
function tasksHtml(){
  var base=S.tasks.filter(function(t){return S.scope==='me'?has(t,S.me):(t.by===S.me)});
  var list=base.filter(function(t){var s=stOf(t);return S.flt==='all'||(S.flt==='open'&&(s==='todo'||s==='working'||s==='rework'||s==='review'))||(S.flt==='review'&&s==='review')||(S.flt==='done'&&(s==='done'||s==='declined'))});
  var h='<div class="seg"><button data-act="scope" data-v="me" aria-pressed="'+(S.scope==='me')+'">Given to me</button><button data-act="scope" data-v="by" aria-pressed="'+(S.scope==='by')+'">Given by me</button></div>';
  h+='<div class="scroll">'+[['deadline','By deadline'],['person',S.scope==='me'?'By who gave':'By person'],['project','By project'],['status','By status']].map(function(x){return '<button class="chip" data-act="grp" data-v="'+x[0]+'" aria-pressed="'+(S.group===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<div class="scroll">'+[['open','Open'],['review','In review'],['done','Done'],['all','All']].map(function(x){return '<button class="chip" data-act="flt" data-v="'+x[0]+'" aria-pressed="'+(S.flt===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(!list.length)return h+'<div class="empty"><b>Nothing here</b>'+(S.scope==='me'?'No tasks match this filter.':'You have not given any task yet. Tap + to allocate one.')+'</div>';
  groupTasks(list,S.group,S.scope).forEach(function(g){
    var hd=(S.group==='person')?'<span class="pers" style="margin:0">'+av(g.key==='?'?'':g.key,'sm')+'</span> '+esc(g.title):esc(g.title);
    h+='<section class="grp"><div class="sh '+g.cls+'"><h3>'+hd+'</h3><span>'+g.list.length+'</span></div>'+cards(g.list)+'</section>';
  });
  return h;
}

/* ---------- Projects ---------- */
function pjStats(p){
  var l=S.tasks.filter(function(t){return t.project===p.id&&stOf(t)!=='declined'}),d=l.filter(function(t){return stOf(t)==='done'}).length;
  var ppl={};l.forEach(function(t){(t.assignees||[]).forEach(function(x){ppl[x]=1})});
  return {n:l.length,d:d,pct:l.length?Math.round(d*100/l.length):0,over:l.filter(isOver).length,rev:l.filter(function(t){return stOf(t)==='review'}).length,ppl:Object.keys(ppl)};
}
function ringH(p){return '<div class="ring" style="--p:'+p+'"><i>'+p+'%</i></div>'}
function daysTo(s){if(!s)return '';var n=Math.round((pdate(s)-pdate(today()))/864e5);return n===0?'Today':n>0?n+' day'+(n>1?'s':'')+' to go':Math.abs(n)+' day'+(n<-1?'s':'')+' ago'}
function projectsHtml(){
  if(S.pj&&S.PJ[S.pj])return projectDetail(S.PJ[S.pj]);
  var h='<div class="sh" style="margin-top:0"><h3>Projects & events</h3><span class="grow"></span><button class="btn pri sm" data-act="pnew">+ New project</button></div>';
  var l=S.projects.slice().sort(function(a,b){var sa=pjStats(a),sb=pjStats(b);return (sa.pct===100)-(sb.pct===100)||((a.date||'9')<(b.date||'9')?-1:1)});
  if(!l.length)return h+'<div class="empty"><b>No projects yet</b>Create a project such as Children’s Day, then add tasks and allocate them to people.</div>';
  return h+'<div class="pgrid">'+l.map(function(p){var s=pjStats(p);
    return '<button class="pcard" data-act="popen" data-id="'+p.id+'"><div style="display:flex;gap:12px;align-items:center">'+ringH(s.pct)+'<div style="flex:1;min-width:0"><div class="sub"><b>'+esc(fdate(p.date))+'</b> · '+esc(daysTo(p.date))+'</div><h3>'+esc(p.title)+'</h3></div></div>'+(p.note?'<p class="sub">'+esc(p.note)+'</p>':'')+'<div class="sub"><b>'+s.d+'/'+s.n+'</b> done'+(s.rev?' · <b style="color:var(--warn)">'+s.rev+' in review</b>':'')+(s.over?' · <b style="color:var(--bad)">'+s.over+' overdue</b>':'')+'</div>'+avs(s.ppl,'sm')+'</button>';
  }).join('')+'</div>';
}
function projectDetail(p){
  var s=pjStats(p),can=S.admin||p.createdBy===S.me,l=S.tasks.filter(function(t){return t.project===p.id});
  var h='<button class="back" data-act="pback">← All projects</button><div class="panel gold"><div style="display:flex;gap:12px;align-items:center">'+ringH(s.pct)+'<div style="flex:1"><div class="sub"><b>'+esc(fdate(p.date))+'</b> · '+esc(daysTo(p.date))+'</div><h2 style="font:700 26px/1.1 var(--serif)">'+esc(p.title)+'</h2></div></div>'+(p.note?'<p class="sub">'+esc(p.note)+'</p>':'')+'<div class="sub"><b>'+s.d+'/'+s.n+'</b> tasks done'+(s.rev?' · '+s.rev+' in review':'')+(s.over?' · <b style="color:var(--bad)">'+s.over+' overdue</b>':'')+'</div>'+(can?'<div class="chips"><button class="btn sm" data-act="pedit" data-id="'+p.id+'">Edit project</button><button class="btn sm '+(S.confirm==='pj'+p.id?'no':'ghost')+'" data-act="pdel" data-id="'+p.id+'">'+(S.confirm==='pj'+p.id?'Tap again to delete project and its tasks':'Delete project')+'</button></div>':'')+'</div>';
  h+='<div class="sh"><h3>Who is doing what</h3><span class="grow"></span><button class="btn pri sm" data-act="tnew" data-pj="'+p.id+'">+ Add task</button></div>';
  var ppl=s.ppl;l.forEach(function(t){(t.assignees||[]).forEach(function(x){if(ppl.indexOf(x)<0)ppl.push(x)})});
  h+='<div class="scroll"><button class="chip" data-act="pp" data-v="" aria-pressed="'+(!S.pjp)+'">Everyone</button>'+ppl.map(function(x){return '<button class="chip" data-act="pp" data-v="'+x+'" aria-pressed="'+(S.pjp===x)+'">'+esc(fn1(x))+'</button>'}).join('')+'</div>';
  if(!l.length)return h+'<div class="empty"><b>No tasks yet</b>Add a task and allocate it to one or more people. It appears on their Home screen with the deadline.</div>';
  ppl.filter(function(x){return !S.pjp||S.pjp===x}).forEach(function(x){
    var tl=l.filter(function(t){return has(t,x)}).sort(sortDue);if(!tl.length)return;
    var d=tl.filter(function(t){return stOf(t)==='done'}).length;
    h+='<section class="grp"><div class="sh"><h3><span class="pers" style="display:inline-flex;margin:0">'+av(x,'sm')+'</span> '+esc(nm(x))+'</h3><span>'+d+'/'+tl.length+' done</span></div>'+cards(tl)+'</section>';
  });
  return h;
}

/* ---------- Reports and the Director dashboard ---------- */
function inPeriod(t){
  var p=S.period;if(p==='all')return true;if(!t.date)return false;var td=today();
  if(p==='today')return t.date===td;
  if(p==='month')return t.date.slice(0,7)===td.slice(0,7);
  var d=pdate(td),dow=(d.getDay()+6)%7,mon=addDays(td,-dow),sun=addDays(mon,6);return t.date>=mon&&t.date<=sun;
}
function pstat(list){
  var r={n:0,done:0,work:0,todo:0,rev:0,rw:0,over:0,ontime:0,dec:0};
  list.forEach(function(t){var s=stOf(t);if(s==='declined'){r.dec++;return}r.n++;
    if(s==='done'){r.done++;if(onTime(t))r.ontime++}else if(s==='working')r.work++;else if(s==='review')r.rev++;else if(s==='rework')r.rw++;else r.todo++;
    if(isOver(t))r.over++});
  r.pct=r.done?Math.round(r.ontime*100/r.done):null;return r;
}
function periodChips(){return '<div class="scroll">'+[['today','Today'],['week','This week'],['month','This month'],['all','All time']].map(function(x){return '<button class="chip" data-act="period" data-v="'+x[0]+'" aria-pressed="'+(S.period===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'}
function teamHtml(){
  if(!S.admin)return personReport(S.me,true);
  if(S.dp&&S.P[S.dp])return personReport(S.dp,false);
  var list=S.tasks.filter(inPeriod),all=pstat(list),td=today();

    e.preventDefault();var n=$('#au-n').value.trim(),p=$('#au-p').value;
    if(!n||!p){$('#au-e').textContent='Type your name and password.';return}
    $('#au-b').disabled=true;$('#au-e').textContent='';
    api('login',[n,p]).then(function(r){S.tok=r.token;try{localStorage.setItem('fisEvTok',r.token);localStorage.setItem('fisEvName',r.name)}catch(x){}paint();return load()},
      function(er){var b=$('#au-b');if(b){b.disabled=false;$('#au-e').textContent=er.message||'Could not sign in'}});
  };
  setTimeout(function(){var i=$(saved?'#au-p':'#au-n');if(i)i.focus()},60);
  }
}
function start(){
  paint();
  if(S.tok&&(API_URL||S.demo))load();
  setInterval(function(){if(S.tok&&S.loaded&&(S.demo||document.visibilityState==='visible'))load()},25000);
  setInterval(function(){if(S.tok&&S.loaded&&$('#ov').hidden)paint()},30000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.tok&&S.loaded)load()});
}
(function init(){
  var q='';try{q=new URLSearchParams(location.search)}catch(e){}
  try{var a=q&&q.get('api');if(a)localStorage.setItem('fisEvApi',a);API_URL=API_URL||localStorage.getItem('fisEvApi')||''}catch(e){}
  if(q&&q.get('demo')){
    S.demo=true;var s=document.createElement('script');s.src='demo.js';s.onload=function(){start()};s.onerror=function(){$('#app').innerHTML='<div class="empty">Could not load the demo.</div>'};document.head.appendChild(s);return;
  }
  try{S.tok=localStorage.getItem('fisEvTok')||''}catch(e){}
  start();
})();
})();
</script>
