<script>
/* Parent Connect — GitHub Pages client layer: Diary-password login + Apps Script API (replaces the Claude runtime) */
(function(){
"use strict";
var API=new URLSearchParams(location.search).get('api')||"https://script.google.com/macros/s/AKfycbz7s2dv7a3mtqyvLodOfr-X6aiALC3QsdEqhkDxqgl826kFHKjsKYGvCxFGjlNhqqcMfw/exec";
var K='pc_tok',W='pc_who';
function lg(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ld(k){try{localStorage.removeItem(k)}catch(e){}}
var GH=window.GH={tok:lg(K)||'',who:lg(W)||{}};
async function call(fn,args,tok){
  if(API.indexOf('__API')===0)throw new Error('This app is not connected to its server yet. See SETUP.md.');
  var r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],code:tok||''})});
  var j=await r.json();
  if(!j.ok){var e=new Error(j.error||'Something went wrong');e.auth=!!j.auth;throw e}
  return j.data;
}
GH.api=async function(fn,args){
  try{return await call(fn,args,GH.tok)}
  catch(e){if(e.auth&&!GH._x){GH._x=1;ld(K);location.reload()}throw e}
};
GH.allowed=function(){
  var n=String(GH.who.name||'').trim().toLowerCase(),r=String(GH.who.role||'').toLowerCase();
  if(n==='harsh yadav')return['director'];
  if(r==='admin')return['admin'];
  if(/^(pl|cm|cmh|pm)$/.test(r))return['coord'];
  return['teacher'];
};
GH.logout=function(){ld(K);ld(W);ld('pc2_me');location.reload()};
GH.gate=function(){
  return new Promise(async function(done){
    var app=document.getElementById('app');
    if(GH.tok){
      try{var me=await call('ping',[],GH.tok);GH.who={name:me.name,role:me.role};ls(W,GH.who);return done()}
      catch(e){if(!e.auth&&GH.who.name)return done();GH.tok='';ld(K)}
    }
    var msg='',lastN='';
    function paint(){
      app.innerHTML='<div class="loginw"><div class="loginc"><div style="font-size:19px;font-weight:800;color:var(--navy)">Parent Connect</div>'
       +'<div class="mut" style="font-size:12.5px;margin-bottom:12px">Flourish International School, Bikaner</div>'
       +'<div class="banner">Contains names of students and parents. Staff use only.</div>'
       +'<label class="lbl">Name</label><input type="text" id="gn" autocomplete="username" placeholder="Same name as in the Diary app">'
       +'<label class="lbl">Password</label><input type="password" id="gp" autocomplete="current-password" placeholder="Same password as in the Diary app">'
       +(msg?'<div style="color:#b3123f;font-size:13px;margin-top:10px">'+msg.replace(/</g,'&lt;')+'</div>':'')
       +'<div style="margin-top:18px"><button class="btn pri" id="gb">Sign in</button></div>'
       +'<div class="mut" style="font-size:12px;margin-top:10px">Use the same login you use for the Diary app. You stay signed in on this phone or computer.</div></div></div>';
      var go=document.getElementById('gb'),n=document.getElementById('gn'),p=document.getElementById('gp');
      n.value=lastN||GH.who.name||'';
      async function submit(){
        lastN=n.value;go.disabled=true;go.textContent='Signing in…';
        try{
          var r=await call('login',[n.value,p.value],'');
          var prev=(GH.who.name||'').toLowerCase();
          GH.tok=r.token;GH.who={name:r.name,role:r.role};ls(K,GH.tok);ls(W,GH.who);
          if(prev&&prev!==r.name.toLowerCase()){ld('pc2_me');try{ME=null;ME_WAIT=true}catch(e){}}
          done();
        }catch(e){msg=e.message||'Could not sign in';paint()}
      }
      go.onclick=submit;p.onkeydown=n.onkeydown=function(e){if(e.key==='Enter')submit()};
      (n.value?p:n).focus();
    }
    paint();
  });
};
/* ---- shared storage: same calls the app made to the Claude db, served by the Apps Script ---- */
var C={},VER=0,subs=[],started=false,first=false,busy=false;
function snap(col){var m=C[col]||{};return{docs:Object.keys(m).filter(function(i){return m[i]}).map(function(i){return{id:i,data:function(){return m[i]}}})}}
async function pull(){
  if(busy)return;busy=true;
  try{
    var r=await GH.api('sync',[VER]),ch={};
    if(!r.same){VER=r.ver;Object.keys(r.rows).forEach(function(k){var i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);(C[c]=C[c]||{})[id]=r.rows[k];ch[c]=1})}
    subs.forEach(function(s){if(!first||ch[s.col])s.cb(snap(s.col))});
    first=true;
  }catch(e){subs.forEach(function(s){s.err&&s.err(e)})}
  finally{busy=false}
}
function start(){if(started)return;started=true;pull();setInterval(function(){if(!document.hidden)pull()},10000)}
var DB={
  collection:function(name){
    var m=/^data\/users\/([^\/]+)/.exec(name);
    if(m)return{doc:function(){return{
      get:async function(){var v=await GH.api('get',['profiles',m[1]]);return v?{data:function(){return v}}:null},
      set:async function(v){await GH.api('set',['profiles',m[1],v])}}}};
    return{onSnapshot:function(cb,err){subs.push({col:name,cb:cb,err:err});start();return function(){}}};
  },
  doc:function(path){var i=path.indexOf('/'),c=path.slice(0,i),id=path.slice(i+1);
    return{set:async function(v){await GH.api('set',[c,id,v]);(C[c]=C[c]||{})[id]=v}}}
};
var SL=function(n){return String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'staff'};
window.claude={use:async function(k){
  if(k==='db')return DB;
  if(k==='user')return{id:async function(){return SL(GH.who.name)}};
  throw new Error('not available');
}};
/* ---- Parent Insight PDFs: server sends the file, the browser reads the text ---- */
var pdfP=null,V='3.11.174',CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+V+'/';
function loadPdf(){
  return pdfP||(pdfP=new Promise(function(res,rej){
    var s=document.createElement('script');s.src=CDN+'pdf.min.js';
    s.onload=async function(){try{var t=await fetch(CDN+'pdf.worker.min.js').then(function(r){return r.text()});
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));res(pdfjsLib)}catch(e){pdfP=null;rej(e)}};
    s.onerror=function(){pdfP=null;rej(new Error('pdf.js could not be loaded'))};document.head.appendChild(s);
  }));
}
GH.pdfText=async function(lib,data){
  var pdf=await lib.getDocument({data:data,useSystemFonts:true,verbosity:0}).promise,out='';
  for(var p=1;p<=pdf.numPages;p++){
    var tc=await(await pdf.getPage(p)).getTextContent();
    var its=tc.items.filter(function(i){return i.str!==''}).map(function(i){return{s:i.str,x:i.transform[4],y:i.transform[5]}});
    its.sort(function(a,b){return b.y-a.y||a.x-b.x});
    var lines=[];its.forEach(function(it){var L=lines[lines.length-1];if(L&&Math.abs(L.y-it.y)<2.5)L.its.push(it);else lines.push({y:it.y,its:[it]})});
    lines.forEach(function(L,i){L.its.sort(function(a,b){return a.x-b.x});if(i&&lines[i-1].y-L.y>15)out+='\n';out+=L.its.map(function(x){return x.s}).join('')+'\n'});
  }
  return out;
};
GH.insightText=async function(id){
  var a=await Promise.all([loadPdf(),GH.api('insight',[id])]),bin=atob(a[1].b64),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return GH.pdfText(a[0],u);
};
})();

</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=dOf(s);d.setDate(d.getDate()+n);return isoOf(d)};
const diffDays=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const fmtD=s=>{if(!s)return'';const d=dOf(s);return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtS=s=>{const d=dOf(s);return d.getDate()+' '+MON[d.getMonth()]};
const fmtDY=s=>{if(!s)return'';const d=dOf(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const fmtT=ms=>{const d=new Date(ms);return d.getDate()+' '+MON[d.getMonth()]+', '+(d.getHours()%12||12)+':'+pad(d.getMinutes())+(d.getHours()<12?' am':' pm')};
const todayISO=()=>isoOf(new Date());
const ago=s=>{const n=diffDays(s,todayISO());return n<=0?'today':n===1?'yesterday':n+' days ago'};
const GROUPS=['Pre-Primary','Class 1-2','Class 3-5','Class 6-7','Class 8-9','Class 10-11'];
const SUBJECTS=['Maths','Hindi','English','Science','SST','Computer','Sanskrit','French/German','Co-curricular','Class Teacher'];
const OWNERS=['Maths teacher','Hindi teacher','English teacher','Science teacher','SST teacher','Computer teacher','Sanskrit teacher','French/German teacher','Co-curricular teacher','Class teacher','Coordinator','Administration'];
const ROLES=[['director','Director','Sees everything'],['coord','Coordinator / PL','Own class group(s)'],['admin','Administration','All departments and calls'],['teacher','Teacher','Own subject or class']];
const SRC_LBL={Studybase:'Studybase',Call:'Call received',Diary:'Diary remark',Desk:'Front office desk',Internal:'Internal'};
const srcName=m=>SRC_LBL[m]||m;
const CASES=['Complaints','Academic complaints','Behavioural','Medical cases','Admission enquiries','HR','Transport','Fee and documents','Requests'];
const KW_MED=/\b(fever|unwell|injur\w*|ill health|vomit\w*|doctor|medic\w*|hospital|surgery|fractur\w*|allerg\w*|sick|hurt|cough|pain|stomach|headache|dizz\w*)\b/i;
const KW_BEH=/\b(bully\w*|fight\w*|misbehav\w*|abus\w*|aggressive|disturb\w*|beat|hitting|troubl\w*|teas\w*|naughty|indiscipline|rude)\b/i;
function caseOf(r){const a=[],cm=r.ct==='Complain'||r.ct==='Concern',t=r.t||'';
  if(cm)a.push('Complaints');
  if((cm&&['Academics','Books','Exam'].includes(r.dp))||(cm&&r.weak))a.push('Academic complaints');
  if(r.dp==='Behavioural'||KW_BEH.test(t))a.push('Behavioural');
  if(r.dp==='Health'||KW_MED.test(t))a.push('Medical cases');
  if(r.dp==='Admission'||r.ct==='Enquiry')a.push('Admission enquiries');
  if(r.dp==='HR')a.push('HR');
  if(r.dp==='Transport')a.push('Transport');
  if(r.dp==='Fee'||r.dp==='Documents')a.push('Fee and documents');
  if(r.ct==='Request')a.push('Requests');
  return a}
const dayLbl=d=>d===todayISO()?'Today':d===addDays(todayISO(),-1)?'Yesterday':fmtS(d);

  const ok=ME.subject==='Co-curricular'?(r.dp==='Co Curricular'||r.dp==='Competition'):(r.sub||[]).includes(ME.subject);

  return rows.map(r=>'<div class="bar" data-a="'+act+'" data-k="'+key+'" data-v="'+esc(r[0])+'"><span>'+esc(r[0])+'</span><span class="t"><i style="width:'+Math.max(3,r[1]/mx*100)+'%;background:'+color+'"></i></span><b>'+r[1].toLocaleString()+'</b></div>').join('')||'<div class="mut">Nothing in this selection</div>';
}
const priP=p=>p?'<span class="st '+(p==='High'?'bad':p==='Medium'?'warn':'info')+'">'+p+'</span>':'';
const dots=n=>n?'<span class="dots">'+Array.from({length:Math.min(n,8)},()=>'<i></i>').join('')+'</span>':'';
const srcP=m=>'<span class="st src s-'+esc(m)+'">'+esc(srcName(m))+'</span>';

/* ---------- follow-up days ---------- */
const dayOf=ms=>isoOf(new Date(ms));
const checkedOn=(id,d)=>(FU[id].checks||[]).some(c=>dayOf(c.at)===d);
const fuStart=id=>dayOf(FU[id].at);
function fuPill(id){
  const v=FU[id];if(!v)return'';const t=todayISO();
  if(v.st==='closed')return'<span class="st ok">Done</span>';
  if(v.due<t)return'<span class="st bad">Ended '+fmtS(v.due)+'</span>';
  return'<span class="st info">Until '+fmtS(v.due)+'</span>';
}
function strip(id){
  const v=FU[id],s=fuStart(id),e=v.due>s?v.due:s,n=Math.min(diffDays(s,e)+1,45),t=todayISO(),by={};
  (v.checks||[]).forEach(c=>{const d=dayOf(c.at);by[d]=(by[d]||0)+1});
  let h='<div class="ds">';
  for(let i=0;i<n;i++){const d=addDays(s,i),k=by[d]||0;h+='<span class="'+(k?'ok':d<t?'miss':d===t?'now':'')+'" title="'+fmtD(d)+(k?' · checked '+k+'×':d<t?' · missed':'')+'"><small>'+dOf(d).getDate()+'</small>'+(k?'✓'+(k>1?'<em>'+k+'</em>':''):'')+'</span>'}
  return h+'</div>';
}
function fuSummary(id){
  const v=FU[id],s=fuStart(id),t=todayISO(),tot=diffDays(s,v.due)+1,no=Math.max(1,Math.min(diffDays(s,t)+1,tot)),n=(v.checks||[]).length;
  let missed=0;for(let i=0;i<Math.min(diffDays(s,t),tot);i++)if(!checkedOn(id,addDays(s,i)))missed++;
  return'<b style="color:var(--navy)">Day '+no+' of '+tot+'</b> · Checked '+n+' time'+(n===1?'':'s')+(missed?' · <span style="color:var(--red);font-weight:700">Missed '+missed+' day'+(missed>1?'s':'')+'</span>':'')+(v.st==='open'&&v.due>=t?(checkedOn(id,t)?' · <span style="color:var(--green);font-weight:700">Checked today</span>':' · <span style="color:var(--mag);font-weight:700">Not checked today</span>'):'');
}

/* ---------- remarks (chat under every feedback) ---------- */
const remItems=id=>(REM[id]&&REM[id].items)||[];

  +'<div class="rin"><textarea rows="2" id="rt-'+id+'" placeholder="Write a remark…"></textarea><button class="btn pri sm" data-a="remadd" data-id="'+id+'">Send</button></div></div>';

function refreshThreads(id){document.querySelectorAll('[data-th="'+id+'"]').forEach(e=>{e.outerHTML=thread(id)})}

/* ---------- acknowledgements ---------- */

const akRole=()=>ME.role==='teacher'?'teacher':ME.role==='coord'?'pl':ME.role==='admin'?'admin':'director';
const akItems=id=>(ACK[id]&&ACK[id].items)||[];
function akStrip(r){
  const it=akItems(r.id),slots=['teacher','pl','admin'].concat(it.some(x=>x.role==='director')?['director']:[]);
  return'<div class="ak">'+slots.map(k=>{const x=it.filter(z=>z.role===k);if(x.length){const l=x[x.length-1];return'<span class="a ok"><b>'+AK[k]+'</b> ✓ '+esc(l.by)+' · '+fmtT(l.at)+(x.length>1?' +'+(x.length-1):'')+'</span>'}return'<span class="a w"><b>'+AK[k]+'</b> waiting · '+ago(r.d)+'</span>'}).join('')+'</div>';
}
function akBtn(r){const mine=akItems(r.id).some(x=>x.by===ME.name&&x.role===akRole());return mine?'<span class="st ok">You acknowledged</span>':'<button class="btn sm navy" data-a="ack" data-id="'+r.id+'">Acknowledge</button>'}
function ackDo(id){ACK[id]=ACK[id]||{items:[]};ACK[id].items.push({role:akRole(),by:ME.name,at:Date.now()});saveACK(id);toast('Acknowledged by '+ME.name+' as '+AK[akRole()]);render(true);if(document.querySelector('.drawer'))openDrawer(id)}
const waitTxt=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/6e4));return m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' days'};

function callCard(c){
  const s=CS[c.id],done=callDone(c),att=(s&&s.att)||[],t=todayISO(),late=!done&&c.due&&c.due<t;

  +'<div class="tx" style="cursor:default;-webkit-line-clamp:5">'+esc(c.t)+'</div>';
  if(c.imgs&&c.imgs.length)h+='<div class="ths">'+c.imgs.map(i=>'<img class="th" data-a="img" alt="attachment" src="'+esc(i.id?'/_blob/'+i.id:i.u)+'">').join('')+'</div>';

const COLS=[['Feedback',a=>a.length],['Studybase',a=>a.filter(r=>r.m==='Studybase').length],['Call',a=>a.filter(r=>r.m==='Call').length],['Diary',a=>a.filter(r=>r.m==='Diary').length],['Desk',a=>a.filter(r=>r.m==='Desk').length],['Internal',a=>a.filter(r=>r.m==='Internal').length],['Request',a=>a.filter(r=>r.ct==='Request').length],['Query',a=>a.filter(r=>r.ct==='Query').length],['Concern',a=>a.filter(r=>r.ct==='Concern'||r.ct==='Complain').length],['Follow-up',a=>a.filter(r=>r.why.length&&!FU[r.id]).length]];
function mx(head,rows,cols,act,k){
  if(!rows.length)return'<div class="empty card">Nothing in this selection.</div>';
  return'<div class="card"><div class="tw"><table><thead><tr><th>'+head+'</th>'+cols.map(c=>'<th class="n">'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr class="cr" data-a="'+act+'"'+(k?' data-k="'+k+'"':'')+' data-v="'+esc(r[1])+'"><td><b style="color:var(--navy)">'+esc(r[0])+'</b></td>'+cols.map(c=>'<td class="n">'+c[1](r[2],r[1])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
}
function groupBy(L,f){const m={};L.forEach(r=>{const k=f(r);if(k!=null)(m[k]=m[k]||[]).push(r)});return m}

const HV=[['cases','Cases'],['sum','Numbers'],['cat','Types'],['cls','Classes'],['dep','Departments'],['day','Days'],['stu','Students']];
function caseCard(key,L){
  const x=L.filter(r=>r.cs.includes(key));
  let h='<div class="card cc"><h3>'+esc(key)+'<small>'+x.length+' in this period</small></h3>';
  h+=x.length?x.slice(0,4).map(r=>'<div class="att" data-a="open" data-id="'+r.id+'"><div class="m"><b>'+esc(r.n)+'</b> <span class="st nu">'+esc(r.c)+'</span> '+srcP(r.m)+'<div class="mut" style="font-size:12.5px">'+esc(r.t.slice(0,110))+(r.t.length>110?'…':'')+'</div></div><div class="x mut" style="font-size:12px">'+dayLbl(r.d)+'</div></div>').join('')+'<div style="margin-top:10px"><button class="btn sm" data-a="case" data-v="'+esc(key)+'">'+(x.length>4?'See all '+x.length+' cases':'Open this category')+'</button></div>':'<div class="empty" style="padding:18px 0">No cases in this period.</div>';

  h+='<div class="scroll" style="margin-bottom:14px">'+HV.map(x=>'<button class="chip '+(hv===x[0]?'on':'')+'" data-a="hv" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  const src=tally(L,r=>r.m);
  if(hv==='cat')h+=mx('Type',tally(L,r=>r.ct).map(x=>[x[0],x[0],L.filter(r=>r.ct===x[0])]),COLS,'flt','ct');
  else if(hv==='dep')h+=mx('Department',tally(L,r=>r.dp).map(x=>[x[0],x[0],L.filter(r=>r.dp===x[0])]),COLS,'flt','dp');
  else if(hv==='cls'){const g=groupBy(L,r=>r.cb),cb=groupBy(callList(),r=>r.cb);h+=mx('Class',Object.keys(g).sort((a,b)=>brank(a)-brank(b)).map(k=>[k==='—'?'Enquiries':k,k,g[k]]),COLS.concat([['Calls made',(a,k)=>(cb[k]||[]).length]]),'cl')}

  else{

      +'<div class="card" style="margin-top:16px"><h3>Latest remarks<small>'+rems.length+'</small></h3>'+(rems.length?rems.slice(0,6).map(z=>'<div class="att" data-a="open" data-id="'+z.r.id+'"><div class="m"><b>'+esc(z.r.n)+'</b> <span class="st nu">'+esc(z.r.c)+'</span><div class="mut" style="font-size:12.5px">'+esc(z.x.by)+': '+esc(z.x.text.slice(0,110))+'</div></div><div class="x mut" style="font-size:12px">'+fmtT(z.x.at)+'</div></div>').join(''):'<div class="empty">No remarks written yet.</div>')+'</div></div>'
      +'<div class="card"><h3>By type</h3>'+bars(tally(L,r=>r.ct).slice(0,8),'flt','ct','#572686')+'<h3 style="margin-top:16px">By source</h3>'+bars(src,'flt','m','#2B9BD6')+'<h3 style="margin-top:16px">By department</h3>'+bars(tally(L,r=>r.dp).slice(0,8),'flt','dp','#EFA11D')+'<h3 style="margin-top:16px">By class</h3>'+bars(Object.entries(Object.fromEntries(Object.entries(groupBy(L,r=>r.cb)).sort((a,b)=>brank(a[0])-brank(b[0])).map(e=>[e[0]==='—'?'Enquiries':e[0],e[1].length]))),'flt','cl','#1B3156')+'</div></div>';

      h+='</div>';
    }
  }
  return h;

/* ---------- student ---------- */

function vStudent(){
  const[n,c]=STK.split('|'),f=D.f.filter(r=>r.n===n&&r.c===c&&inScope(r)),ca=D.c.filter(x=>x.n===n&&x.c===c&&callScope(x)),ch=D.h.filter(x=>x.n===n&&x.c===c&&cScope(x)&&canCalls());

  const open=f.filter(r=>FU[r.id]&&FU[r.id].st==='open').length;

  let L;if(ME.role==='teacher'&&ME.classes&&ME.classes.length)L=ME.classes.slice();else L=[...new Set(D.f.filter(inScope).map(r=>r.c).filter(c=>c&&c!=='—'))];
  return[...new Set(L)].sort((a,b)=>crank(a)-crank(b))}
function clInit(){const L=myClasses();if(!CLS||!L.includes(CLS))CLS=L[0]||'';if(CLS)loadIns(CLS)}
const caseRows=c=>D.f.filter(r=>r.c===c&&inScope(r)&&isCase(r)).sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:0);
function stat(rows){const o={n:rows.length,none:0,prog:0,done:0,last:0,oldest:''};rows.forEach(r=>{const s=actOf(r.id);o[s]++;const la=lastAct(r.id);if(la&&la.at>o.last)o.last=la.at;if(s==='none'&&(!o.oldest||r.d<o.oldest))o.oldest=r.d});return o}
function tile(l,v,c){return'<div class="tile"><div class="mut" style="font-size:12px">'+l+'</div><b style="font-size:24px;color:'+(c||'var(--navy)')+'">'+v+'</b></div>'}
function rosterOf(c){
  const m={};D.f.filter(r=>r.c===c&&inScope(r)&&r.n).forEach(r=>{(m[r.n]=m[r.n]||[]).push(r)});
  const e=INS[insKey(c)];if(e&&e.data&&(ME.role!=='teacher'||ME.subject==='Class Teacher'||!(ME.classes||[]).length||true)&&canCalls())Object.values(e.data.students).forEach(s=>{if(!Object.keys(m).some(n=>nk(n)===nk(s.n)))m[s.n]=[]});
  return m}
function vClass(){
  const L=myClasses();if(!L.length)return'<div class="empty card">No class found for you yet. Ask the Director to check your login.</div>';
  if(!CLS||!L.includes(CLS))CLS=L[0];
  let h='<div class="scroll" style="margin-bottom:12px">'+L.map(c=>'<button class="chip '+(c===CLS?'on':'')+'" data-a="clsel" data-v="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';
  h+='<div class="scroll" style="margin-bottom:14px"><button class="chip '+(CLM==='ov'?'on':'')+'" data-a="clm" data-v="ov">Overview</button><button class="chip '+(CLM==='ac'?'on':'')+'" data-a="clm" data-v="ac">Action</button></div>';
  return h+(CLM==='ov'?clOverview():clAction());
}
function clOverview(){
  const m=rosterOf(CLS),names=Object.keys(m).sort(),e=INS[insKey(CLS)];
  const q=(CF.q||'').toLowerCase(),shownN=names.filter(n=>!q||n.toLowerCase().includes(q));
  let h='<div class="hint">Every child in Class '+esc(CLS)+'. Tap a child to see all feedback, calls, parent insight and actions in one place.'+(e&&e.data?' Parent Insight chart read till '+esc(e.data.upto)+'.':e&&e.st==='load'?' Reading the Parent Insight chart…':'')+'</div>';
  h+='<div class="card" style="margin-bottom:14px"><label class="lbl">Find a child in this class</label><input type="search" id="cfq" placeholder="Type a name" value="'+esc(CF.q)+'"></div>';
  if(!names.length)return h+'<div class="empty card">No feedback found for this class yet.</div>';
  h+='<div class="sgrid">'+shownN.map(n=>{
    const rows=m[n],cs=rows.filter(isCase),st=stat(cs),ins=e&&e.data?insFind(e.data,n):null,last=rows.reduce((a,r)=>r.d>a?r.d:a,'');
    return'<div class="scard" data-a="stu" data-v="'+esc(n+'|'+CLS)+'"><b>'+esc(n)+'</b><div class="chs"><span class="st nu">'+rows.length+' feedback</span>'+(st.none?'<span class="st bad">'+st.none+' no action</span>':'')+(st.prog?'<span class="st warn">'+st.prog+' in progress</span>':'')+(st.done?'<span class="st ok">'+st.done+' done</span>':'')+(ins&&ins.open?'<span class="st cat">'+ins.open+' open in insight</span>':'')+'</div><small class="mut">'+(last?'Last feedback '+fmtS(last)+' · '+ago(last):'No feedback this year')+'</small></div>'}).join('')+'</div>';
  return h;
}
function clAction(){
  const all=caseRows(CLS),stA=stat(all);
  let rows=all.filter(r=>(!CF.st||actOf(r.id)===CF.st)&&(!CF.src||r.m===CF.src)&&(!CF.dp||r.dp===CF.dp)&&(!CF.stu||r.n===CF.stu)&&(!CF.q||(r.n+' '+r.t).toLowerCase().includes(CF.q.toLowerCase())));
  let h='<div class="hint">Cases from every source (Studybase, calls, diary, front desk, internal) for Class '+esc(CLS)+'. Record what you did, with date and time, so the work is visible. This shows effort in progress, it is not a score.</div>';
  h+='<div class="tiles">'+tile('Cases',stA.n)+tile('No action yet',stA.none,stA.none?'#b3123f':'')+tile('In progress',stA.prog,'#b86e00')+tile('Done',stA.done,'#18794e')+tile('Last action',stA.last?fmtT(stA.last):'—')+tile('Waiting longest',stA.oldest?diffDays(stA.oldest,todayISO())+' days':'—')+'</div>';
  const L=myClasses();
  if(L.length>1){h+='<div class="card" style="margin-bottom:16px"><h3>All my classes<small>work in progress</small></h3><div class="tw"><table><thead><tr><th>Class</th><th>Cases</th><th>No action</th><th>In progress</th><th>Done</th><th>Actioned</th><th>Last action</th></tr></thead><tbody>'
    +L.map(c=>{const s=stat(caseRows(c));return'<tr class="clk" data-a="clsel" data-v="'+esc(c)+'"><td><b>'+esc(c)+'</b></td><td>'+s.n+'</td><td>'+s.none+'</td><td>'+s.prog+'</td><td>'+s.done+'</td><td>'+(s.n?Math.round((s.prog+s.done)*100/s.n)+'%':'—')+'</td><td>'+(s.last?fmtT(s.last):'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
  const byS={};all.forEach(r=>{(byS[r.n]=byS[r.n]||[]).push(r)});
  h+='<div class="card" style="margin-bottom:16px"><h3>Children with cases<small>tap a name to filter</small></h3><div class="tw"><table><thead><tr><th>Child</th><th>Cases</th><th>No action</th><th>In progress</th><th>Done</th><th>Last action</th></tr></thead><tbody>'
    +Object.keys(byS).sort((a,b)=>stat(byS[b]).none-stat(byS[a]).none||a.localeCompare(b)).map(n=>{const s=stat(byS[n]);return'<tr class="clk" data-a="cft" data-k="stu" data-v="'+esc(n)+'"><td><b>'+esc(n)+'</b></td><td>'+s.n+'</td><td>'+s.none+'</td><td>'+s.prog+'</td><td>'+s.done+'</td><td>'+(s.last?fmtT(s.last):'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  const sc=(k,arr,lbl)=>'<div class="scroll" style="margin-bottom:8px">'+arr.map(x=>'<button class="chip '+(CF[k]===x[0]?'on':'')+'" data-a="cft" data-k="'+k+'" data-v="'+esc(x[0])+'">'+esc(x[1])+'</button>').join('')+'</div>';
  const srcs=[...new Set(all.map(r=>r.m))],dps=[...new Set(all.map(r=>r.dp))].sort();
  h+=sc('st',[['','All status'],['none','No action yet'],['prog','In progress'],['done','Done']])+sc('src',[['','All sources']].concat(srcs.map(s=>[s,srcName(s)])))
   +'<div class="row" style="margin-bottom:12px"><div style="flex:1;min-width:180px"><select data-cf="dp"><option value="">All departments</option>'+dps.map(d=>'<option '+(CF.dp===d?'selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div><div style="flex:1;min-width:180px"><input type="search" id="cfq" placeholder="Search child or word" value="'+esc(CF.q)+'"></div>'+((CF.st||CF.src||CF.dp||CF.stu||CF.q)?'<button class="btn sm" data-a="cft" data-k="clear" data-v="">Clear filters</button>':'')+'</div>';
  h+=rows.length?rows.slice(0,shown).map(actCard).join('')+(rows.length>shown?'<div style="text-align:center;margin:14px 0"><button class="btn" data-a="more">Show more ('+(rows.length-shown)+' left)</button></div>':''):'<div class="empty card">No cases match.</div>';
  return h;
}
function actCard(r){
  const s=actOf(r.id),la=lastAct(r.id),n=actItems(r.id).length;
  return'<div class="fc '+esc(r.p)+'"><div class="hd"><b class="lk" data-a="stu" data-v="'+esc(stKey(r))+'">'+esc(r.n||'—')+'</b><span class="st nu">'+esc(r.c)+'</span>'+srcP(r.m)+actPill(s)+'<span class="dt">'+fmtD(r.d)+' · '+ago(r.d)+'</span></div>'
  +'<div class="tx" data-a="open" data-id="'+r.id+'">'+esc(r.t)+'</div>'+imgsH(r)
  +(la?'<div class="actl"><b>'+esc(la.by)+'</b> · '+fmtT(la.at)+(n>1?' · '+n+' actions':'')+'<br>'+esc(la.text)+'</div>':'<div class="actl none">No action recorded yet. Waiting '+Math.max(0,diffDays(r.d,todayISO()))+' day(s).</div>')
  +'<div class="ft" style="margin-top:8px"><span class="st cat">'+esc(r.ct)+'</span><span class="st nu">'+esc(r.dp)+'</span><span class="sp"></span><button class="btn pri sm" data-a="actrec" data-id="'+r.id+'">Record action</button><button class="btn sm" data-a="open" data-id="'+r.id+'">Open</button></div></div>';
}
const QCH=['Spoke to the child','Informed the parent','Checked notebook or practice','Gave extra practice','Counselled','Referred to coordinator','Monitoring daily'];
function actModal(id){
  const r=D.byId[id];
  formModal('Record action: '+(r.n||''),'<div class="quote" style="margin:0 0 6px;max-height:90px;overflow:auto">'+esc(r.t)+'</div>'
    +'<div class="chips" style="margin-top:10px">'+QCH.map(x=>'<button type="button" class="chip qch">'+esc(x)+'</button>').join('')+'</div>'
    +lab('What did you do?','<textarea name="t" rows="3" placeholder="e.g. Maths practice checked. Gave 10 sums daily."></textarea>')
    +lab('Status',sel('st',[['prog','In progress. I am still working on it'],['done','Done. Concern addressed']],'prog'))
    +'<div class="mut" style="margin-top:10px;font-size:12.5px">Saved with date and time: '+fmtT(Date.now())+' by '+esc(ME.name)+'</div>','Save action',v=>{
      if(!v.t.trim()){toast('Write what you did');return false}
      REM[id]=REM[id]||{items:[]};REM[id].items.push({id:Date.now().toString(36),at:Date.now(),by:ME.name,role:roleLbl(),text:v.t.trim(),act:1,st:v.st});saveREM(id);toast('Action saved '+fmtT(Date.now()))});
  document.querySelectorAll('.mod .qch').forEach(b=>b.onclick=()=>{const ta=document.querySelector('.mod textarea[name=t]');ta.value=(ta.value?ta.value.replace(/\s*$/,'')+'. ':'')+b.textContent;ta.focus()});
}
const imgsH=r=>r.imgs&&r.imgs.length?'<div class="ths">'+r.imgs.map(i=>'<img class="th" data-a="img" alt="attachment" src="'+esc(i.id?'/_blob/'+i.id:i.u)+'">').join('')+'</div>':'';

/* ===== Paste many (Studybase, calls, desk) ===== */
function parsePaste(tx,defCls,defDate){
  const known=new Map();D.f.forEach(r=>{if(r.n)known.set(r.n.toLowerCase().replace(/\s+/g,' '),r)});
  const rows=[];
  tx.split(/\r?\n/).forEach(line=>{if(!line.trim())return;
    let cells=line.split(/\t|\s*\|\s*/).map(s=>s.trim()).filter(Boolean);if(cells.length===1)cells=line.split(/\s{3,}/).map(s=>s.trim()).filter(Boolean);
    let d='',c='',n='';const rest=[];
    cells.forEach(x=>{
      let m=/^(\d{4}-\d{2}-\d{2})$|^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(x);
      if(m&&!d){d=m[1]||((m[4].length===2?'20'+m[4]:m[4])+'-'+pad(m[3])+'-'+pad(m[2]));return}
      m=/^(PG|NURSERY|NUR|LKG|UKG|\d{1,2})\s*[- ]?\s*([A-E])?$/i.exec(x);
      if(m&&!c){c=normCls((m[1].toUpperCase()==='NURSERY'?'NUR':m[1])+(m[2]||''));return}
      if(!n&&known.has(x.toLowerCase().replace(/\s+/g,' '))){n=known.get(x.toLowerCase().replace(/\s+/g,' ')).n;return}
      rest.push(x)});
    rest.sort((a,b)=>b.length-a.length);const t=rest.shift()||'';
    if(!n){const k=rest.find(x=>/^[A-Za-z][A-Za-z .'-]{2,40}$/.test(x));if(k)n=k}
    if(!c&&n&&known.has(n.toLowerCase()))c=known.get(n.toLowerCase()).c;
    rows.push({d:d||defDate,n,c:c||defCls,t,ok:!!(n&&(c||defCls)&&t.length>3)})});
  return rows}
function pasteModal(){
  const cls=[...new Set(D.f.map(r=>r.c).filter(c=>c&&c!=='—'))].sort((a,b)=>crank(a)-crank(b));
  const srcs=[['Studybase','Studybase'],['Call','Call received'],['Desk','Front office desk'],['Diary','Diary remark']].concat(ME.role!=='teacher'?[['Internal','Internal (in-house / in-person)']]:[]);
  formModal('Paste many feedback',lab('Source (required)',sel('m',[['','Select source']].concat(srcs),''))
    +'<div class="row"><div style="flex:1">'+lab('Class if the rows have none',sel('c',[['','Not set']].concat(cls.map(x=>[x,x])),''))+'</div><div style="flex:1">'+lab('Date if the rows have none','<input type="date" name="d" value="'+todayISO()+'">')+'</div></div>'
    +lab('Paste rows from Studybase or a sheet','<textarea name="t" rows="8" placeholder="One feedback per line. Columns can be: date, student name, class, feedback (tab or | separated)"></textarea>')
    +'<div class="mut" style="font-size:12.5px;margin-top:8px">You will see a check list before anything is added.</div>','Check rows',v=>{
      if(!v.m){toast('Select the source first');return false}
      if(!v.t.trim()){toast('Paste the rows first');return false}
      const rows=parsePaste(v.t,v.c,v.d);if(!rows.length){toast('No rows found');return false}
      const good=rows.filter(r=>r.ok);
      setTimeout(()=>formModal('Check '+rows.length+' rows','<div class="mut" style="margin-bottom:8px">'+good.length+' ready to add'+(rows.length-good.length?', '+(rows.length-good.length)+' skipped (name, class or text missing)':'')+'. Source: '+esc(srcName(v.m))+'</div><div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr><th></th><th>Date</th><th>Child</th><th>Class</th><th>Feedback</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+(r.ok?'✓':'⚠')+'</td><td>'+esc(r.d?fmtS(r.d):'')+'</td><td>'+esc(r.n)+'</td><td>'+esc(r.c)+'</td><td>'+esc(r.t.slice(0,120))+'</td></tr>').join('')+'</tbody></table></div>',
        good.length?'Add '+good.length:'Close',()=>{if(!good.length)return true;good.forEach((r,i)=>{const id=(Date.now()+i).toString(36)+Math.random().toString(36).slice(2,4);ADD[id]={d:r.d||todayISO(),n:r.n,c:r.c,dp:'General',ct:'Informative Update',m:v.m,t:r.t,p:'Low',sub:'',by:ME.name,role:roleLbl(),at:Date.now()};saveADD(id)});mergeAdded();toast(good.length+' added')}),50)});
}
/* ===== Add feedback (all sources, request category, images) ===== */
function addModal(pre){
  pre=pre||{};
  const stu=[...new Set(D.f.filter(inScope).map(r=>r.n).filter(Boolean))].sort(),cls=[...new Set(D.f.map(r=>r.c).filter(c=>c&&c!=='—'))].sort((a,b)=>crank(a)-crank(b)),deps=tally(D.f,r=>r.dp).map(x=>x[0]),cts=[...new Set(tally(D.f,r=>r.ct).map(x=>x[0]).concat(['Request']))];
  const srcs=[['','Select source'],['Studybase','Studybase'],['Call','Call received'],['Diary','Diary remark'],['Desk','Front office desk']].concat(ME.role!=='teacher'?[['Internal','Internal (in-house / in-person)']]:[]);
  formModal(pre.ct==='Request'?'New request':'Add feedback',lab('Student name','<input name="n" list="dl" placeholder="Start typing a name" autocomplete="off"><datalist id="dl">'+stu.map(s=>'<option value="'+esc(s)+'">').join('')+'</datalist>')+lab('Class and section',sel('c',cls,cls[0]))
  +'<div class="row"><div style="flex:1">'+lab('Source (required)',sel('m',srcs,pre.m||''))+'</div><div style="flex:1">'+lab('Date','<input type="date" name="d" value="'+todayISO()+'">')+'</div></div>'
  +'<div class="row"><div style="flex:1">'+lab('Type',sel('ct',cts,pre.ct||'Informative Update'))+'</div><div style="flex:1">'+lab('Priority',sel('p',['Low','Medium','High'],'Low'))+'</div></div>'
  +'<div class="row"><div style="flex:1">'+lab('Department',sel('dp',deps,'General'))+'</div><div style="flex:1">'+lab('Subject teacher (optional)',sel('sub',[['','None']].concat(SUBJECTS.filter(s=>s!=='Class Teacher').map(s=>[s,s])),''))+'</div></div>'
  +lab('Request category (only when Type is Request)',sel('rc',[['','Decide automatically']].concat(RQCATS.map(x=>[x,x])),''))
  +lab('Feedback','<textarea name="t" rows="4" placeholder="What did the parent say, or what was written in the diary?"></textarea>')
  +lab('Attach image (optional, up to 3)','<input type="file" id="addimg" accept="image/*" multiple>')
  +'<div class="mut" style="font-size:12.5px;margin-top:10px">Saved with date and time by '+esc(ME.name)+'. Many rows at once? Use "Paste from Studybase".</div>','Add',v=>{
    if(!v.m){toast('Select the source first');return false}
    if(!v.n.trim()||!v.t.trim()){toast('Student name and feedback are required');return false}
    const files=[...(document.getElementById('addimg').files||[])].slice(0,3),id=Date.now().toString(36);
    const rec={d:v.d||todayISO(),n:v.n.trim(),c:v.c,dp:v.dp,ct:v.ct,m:v.m,t:v.t.trim(),p:v.p,sub:v.sub,rc:v.ct==='Request'?v.rc:'',by:ME.name,role:roleLbl(),at:Date.now(),imgs:[]};
    toast(files.length?'Uploading image and saving…':'Feedback added');
    (async()=>{for(const f of files){const i=await putImg(f);if(i)rec.imgs.push(i)}ADD[id]=rec;mergeAdded();saveADD(id);if(files.length)toast('Feedback added');render(true)})();
  });
}
/* ===== Stay signed in ===== */
let UID='',ME_WAIT=!LS.get('pc2_me');
async function restoreMe(){
  try{const U=await claude.use('user');if(!U||!U.id)return;UID=await U.id()||'';if(!UID||!DB)return;
    if(!ME){const s=await DB.collection('data/users/'+UID).doc('me').get();const v=s&&(typeof s.data==='function'?s.data():s.data);
      if(v&&v.name&&v.role){ME={role:v.role,name:v.name,groups:v.groups||[],subject:v.subject||'',classes:v.classes||[]};LS.set('pc2_me',ME);F=newF();syncCM();fuSeg=ME.role==='teacher'?myKey():'';view='ov'}}
    else saveMe()}catch(e){}
}
function saveMe(){try{if(DB&&UID&&ME&&!ME.va)DB.collection('data/users/'+UID).doc('me').set({role:ME.role,name:ME.name,groups:ME.groups||[],subject:ME.subject||'',classes:ME.classes||[]})}catch(e){}}

function normCls(v){let s=String(v).replace(/\./g,'').replace(/\s+/g,'').toUpperCase(),m=/^(NUR|PG|LKG|UKG)([A-C]?)$/.exec(s);if(m)return(m[1]==='NUR'?'Nur':m[1])+(m[2]?' '+m[2]:'');m=/^(\d{1,2})([A-E]?)$/.exec(s);return m?m[1]+m[2]:String(v).trim()}

/* ===== Move a feedback to Requests ===== */
let RT=LS.get('pc2_rt')||{};
const saveRT=id=>save('retag',RT,'pc2_rt',id);
function applyRT(){Object.keys(RT).forEach(id=>{const r=D.byId&&D.byId[id];if(!r)return;const t=RT[id];if(r._ct0===undefined)r._ct0=r.ct;if(t&&t.ct==='Request'){r.ct='Request';r.rc=t.rc||''}else{r.ct=r._ct0;r.rc=''}})}
function mvReqModal(id){
  const r=D.byId[id],cur=RT[id]&&RT[id].ct==='Request'?RT[id].rc:'';
  formModal(cur?'Change request category':'Move to Requests','<div class="quote" style="margin:0 0 6px;max-height:90px;overflow:auto">'+esc(r.t)+'</div>'
    +lab('Request category',sel('rc',[['','Not a request (remove from Requests)']].concat(RQCATS.map(x=>[x,x])),cur||reqCat(Object.assign({},r,{rc:'',ct:'Request'}))))
    +'<div class="mut" style="font-size:12.5px;margin-top:10px">Saved with date and time by '+esc(ME.name)+'. The original feedback stays as it is.</div>','Save',v=>{
      RT[id]=v.rc?{ct:'Request',rc:v.rc,by:ME.name,at:Date.now()}:{ct:'',rc:'',by:ME.name,at:Date.now()};
      if(!v.rc&&r._ct0!==undefined){r.ct=r._ct0;r.rc=''}applyRT();saveRT(id);toast(v.rc?'Moved to Requests: '+v.rc:'Removed from Requests')},dr(id));
}

boot();
