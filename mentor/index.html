<div id="gate" class="hide"><form id="gf" novalidate><h2>Mentor Student Performance Record</h2><p class="muted" style="margin:0 0 14px">Staff login · Flourish International School</p>
<div class="field"><label>Your full name</label><input id="gn" autocomplete="name" placeholder="e.g. Megha Sharma"></div>
<div class="field" id="gpw"><label>FIS staff password</label><input id="gp" type="password" autocomplete="current-password" placeholder="Your first name + the FIS staff code"></div>
<div class="err" id="ge"></div><button class="btn" style="width:100%" type="submit">Log in</button></form></div>
<header class="band"><div class="wrap">
<div class="top"><a class="back" href="../fis/">‹ FIS Staff Hub</a><button class="me" id="meBtn"></button></div>

<div class="sw" id="segSw"><button data-seg="P">Primary · 1–5</button><button data-seg="S">Secondary · 6–11</button></div>
</div></header>

<script>
(function(){'use strict';

async function call(fn,args){
  if(!API_URL){const x=new Error('offline');x.net=1;throw x}
  let r,j;try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:args||[],token:TOKEN})});j=await r.json()}catch(e){const x=new Error('offline');x.net=1;throw x}
  if(!j.ok){if(j.login&&fn!=='login'){TOKEN=null;lsPut('token',null);showGate()}throw new Error(j.err==='LOGIN'?'Please log in again.':j.err)}
  return j.v;
}

async function flush(){
  if(!API_URL||flushing||!TOKEN)return;flushing=true;
  try{for(const p of Object.keys(OUT)){const d=OUT[p];if(d.del)await call('del',[p,{}]);else{const b=Object.assign({},d);delete b.p;await call('set',[p,b])}delete OUT[p];persist()}setSync('Saved ✓')}
  catch(e){setSync(e.net?'Offline · '+Object.keys(OUT).length+' waiting':'⚠ '+e.message)}
  flushing=false;
}

function rowEntry(e,s){

function testStats(t){let sum=0,k=0,poor=0,ab=0,pend=0;const n=nOf(t.sec);for(let s=1;s<=n;s++){const v=t.m[s];if(v==null||v==='')pend++;else if(v==='A'||v==='NG')ab++;else{const p=pctOf(t,s);if(p!=null){sum+=p;k++;if(isLow(t,s))poor++}}}return{avg:k?sum/k:null,poor,ab,pend,k}}

function rowTest(t,s){

function refreshTest(t){
  if(!U.open||U.open.p!==t.p)return;

  for(let s=1;s<=n;s++){if(isLow(t,s)){const sk=streakAt(t.sec,t.subj,s,t);poor.push([s,pctOf(t,s),sk]);const f=$('fl'+s);if(f)f.innerHTML=sk>=2?'<span class="flag">low '+sk+' tests in a row</span>':''}}
  const b=$('testBar');if(b)b.innerHTML='<div class="small" style="margin-top:4px">Average <b>'+(st.avg==null?'—':st.avg.toFixed(0)+'%')+'</b> · <span class="'+(st.poor?'red':'')+'">'+st.poor+' below minimum</span> · '+st.ab+' absent/NG · '+st.pend+' to mark</div>';
  const pb=$('poorBox');if(pb)pb.innerHTML='<h4 style="color:var(--ns)">Below minimum ('+fmtN(minOf(t))+') · '+poor.length+'</h4>'+(poor.length?poor.map(x=>'<div>'+x[0]+'. <b>'+esc(nameOf(t.sec,x[0]))+'</b> — '+fmtN(t.m[x[0]])+'/'+t.max+' ('+x[1].toFixed(0)+'%)'+(x[2]>=2?' <span class="flag">again low · '+x[2]+' in a row</span>':'')+'</div>').join(''):'<div class="muted">No one below the minimum so far.</div>');
}

function scopeOpts(){const o=[];if(plSet().size)o.push(['pl','My PL classes']);if(mineSet().size)o.push(['mine','My classes']);o.push(['sec','Section '+curSec()]);o.push(['seg',U.seg==='P'?'All Primary':'All Secondary']);if(isAdmin())o.push(['all','Whole school']);return o}
function scopeNow(){const o=scopeOpts().map(x=>x[0]);if(!U.scope||!o.includes(U.scope))U.scope=plSet().size?'pl':mineSet().size?'mine':(isAdmin()?'seg':'sec');return U.scope}
function cutoff(){if(U.per==='all')return '';const d=new Date();d.setDate(d.getDate()-(+U.per));return isoD(d)}
function inScope(r,ignorePer){
  const sc=scopeNow();
  if(sc==='pl'){if(!plSet().has(r.sec))return false}
  else if(sc==='mine'){if(!mineSet().has(r.sec+'|'+r.subj))return false}
  else if(sc==='sec'){if(r.sec!==curSec())return false}
  else if(sc==='seg'){if(segOf(r.sec)!==U.seg)return false}
  if(U.dept){const d=(subjDef(+r.sec.slice(0,-1),r.subj)||{}).d;if(d!==U.dept)return false}
  if(!ignorePer){const c=cutoff();if(c&&r.date<c)return false}
  return true;
}
function deptList(){const set=new Set();subjectsFor(U.cls).forEach(x=>set.add(x.d));if(scopeNow()!=='sec'){segClasses(U.seg).forEach(c=>subjectsFor(c).forEach(x=>set.add(x.d)))}return [...set]}

function dashCheck(){
  const es=docs('e').filter(e=>inScope(e));
  if(!es.length)return '<div class="empty">No checking records in this view yet.</div>';
  const tot=zero(),byItem={},bySubj={},bySec={};
  es.forEach(e=>{const t=tally(e);addT(tot,t);(byItem[e.item]=byItem[e.item]||{t:zero(),n:0});addT(byItem[e.item].t,t);byItem[e.item].n++;
    (bySubj[e.subj]=bySubj[e.subj]||{t:zero(),n:0});addT(bySubj[e.subj].t,t);bySubj[e.subj].n++;(bySec[e.sec]=bySec[e.sec]||{t:zero(),n:0});addT(bySec[e.sec].t,t);bySec[e.sec].n++});
  let h='<div class="tiles"><div class="tile ok"><b>'+tot.C+'</b><span>Checked</span></div><div class="tile ic"><b>'+tot.I+'</b><span>Incomplete</span></div><div class="tile ns"><b>'+tot.N+'</b><span>Not submitted</span></div><div class="tile ab"><b>'+tot.A+'</b><span>Absent</span></div><div class="tile pn"><b>'+tot.P+'</b><span>Not marked</span></div></div>';
  h+='<div class="card"><h4>By item</h4><div class="tw"><table>'+THEAD+ITEMS.filter(i=>byItem[i]).map(i=>trow(esc(i),byItem[i].t,byItem[i].n)).join('')+'</table></div></div>';
  h+='<div class="card"><h4>By subject</h4><div class="tw"><table>'+THEAD+Object.keys(bySubj).sort().map(s=>trow(esc(s),bySubj[s].t,bySubj[s].n)).join('')+'</table></div></div>';
  if(Object.keys(bySec).length>1)h+='<div class="card"><h4>By section</h4><div class="tw"><table>'+THEAD+Object.keys(bySec).sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b)).map(s=>trow(s,bySec[s].t,bySec[s].n)).join('')+'</table></div></div>';
  const pend=es.filter(e=>tally(e).P>0).sort((a,b)=>a.date.localeCompare(b.date));
  if(pend.length)h+='<div class="card"><h4>Checks with students still unmarked · '+pend.length+'</h4>'+pend.slice(0,25).map(e=>'<button class="entry" data-act="gofix" data-k="e" data-p="'+esc(e.p)+'" style="padding:8px 10px"><div class="eh"><b>'+e.sec+' · '+esc(e.subj)+' · '+esc(e.item)+' · '+esc(lessonLabel(e))+'</b><span class="badge ic">'+tally(e).P+' left</span></div><div class="small muted">'+fD(e.date)+' · '+esc(teacherOf(e.sec,e.subj)||e.by||'')+'</div></button>').join('')+'</div>';
  return h;
}

const secSort=(a,b)=>parseInt(a)-parseInt(b)||String(a).localeCompare(String(b));
const R_RED='red',R_AMB='amb';
function repSub(){const o=scopeOpts().find(x=>x[0]===scopeNow());return (o?o[1]:'')+(U.dept?' · '+U.dept:'')+' · '+(U.per==='all'?'All dates':'Last '+U.per+' days')+' · '+fD(today())}
function buildRep(k){
  const es=docs('e').filter(e=>inScope(e)),ts=docs('t').filter(t=>inScope(t)),sub=repSub();
  if(k==='def'){
    const list=followItems().filter(x=>x.c!=='A'||U.incA).sort((a,b)=>secSort(a.e.sec,b.e.sec)||a.s-b.s||a.since-b.since);
    const stu=new Set(list.map(x=>x.e.sec+'#'+x.s)).size;
    return{title:'Defaulters — follow-up list',sub:sub+' · '+list.length+' items · '+stu+' students',wa:'def',list,
      tables:[{cols:['Class','No.','Student','Subject','Item','Lesson','Status','Since','Days'],rows:list.map(x=>[x.e.sec,String(x.s),nameOf(x.e.sec,x.s),x.e.subj,x.e.item,lessonLabel(x.e),[CODES[x.c].n,x.c==='N'?R_RED:x.c==='I'?R_AMB:''],fD(isoD(new Date(x.since))),[String(x.days),x.days>=2?R_RED:'']]),none:'No defaulters — every item has been submitted.'}]};
  }
  if(k==='cls'){
    const C={},S={};
    es.forEach(e=>{const t=tally(e);(C[e.sec]=C[e.sec]||{t:zero(),n:0,st:new Set()});addT(C[e.sec].t,t);C[e.sec].n++;const key=e.sec+'|'+e.subj;(S[key]=S[key]||{sec:e.sec,subj:e.subj,t:zero(),n:0,st:new Set()});addT(S[key].t,t);S[key].n++;
      for(let s=1;s<=nOf(e.sec);s++){const c=e.m[s];if(c==='N'||c==='I'){C[e.sec].st.add(s);S[key].st.add(s)}}});
    const row=(a,o)=>[a,String(o.st.size),[String(o.t.N),o.t.N?R_RED:''],[String(o.t.I),o.t.I?R_AMB:''],String(o.t.C),String(o.n),pcell(o.t)];
    return{title:'Class summary',sub:sub,tables:[
      {h:'By class',cols:['Class','Students defaulting','Not submitted','Incomplete','Checked','Checks','Done'],rows:Object.keys(C).sort(secSort).map(s=>row(s,C[s])),none:'No records.'},
      {h:'By class and subject',cols:['Class','Subject','Students defaulting','Not submitted','Incomplete','Checked','Checks','Done'],rows:Object.values(S).sort((a,b)=>secSort(a.sec,b.sec)||a.subj.localeCompare(b.subj)).map(o=>{const r=row(o.sec,o);r.splice(1,0,o.subj);return r}),none:'No records.'}]};
  }
  if(k==='low'){
    const rows=[];ts.forEach(t=>{for(let s=1;s<=nOf(t.sec);s++)if(isLow(t,s)){const sk=streakAt(t.sec,t.subj,s,t);rows.push({sec:t.sec,s,r:[t.sec,nameOf(t.sec,s),t.subj,lessonLabel(t)+' · '+fD(t.date),fmtN(t.m[s])+'/'+t.max,[pctOf(t,s).toFixed(0)+'%',R_RED],fmtN(minOf(t)),[sk>=2?'Low '+sk+' tests in a row':'',sk>=2?R_RED:'']]})}});
    rows.sort((a,b)=>secSort(a.sec,b.sec)||a.s-b.s);
    return{title:'Low performers — below minimum marks',sub:sub+' · '+rows.length+' results',tables:[{cols:['Class','Student','Subject','Test','Marks','%','Minimum','Repeat'],rows:rows.map(x=>x.r),none:'Nobody is below the minimum marks.'}]};
  }
  if(k==='card'){
    const sec=curSec(),sl=subjectsFor(U.cls),n=nOf(sec),pend={};
    followItems().filter(x=>x.e.sec===sec&&x.c!=='A').forEach(x=>pend[x.s]=(pend[x.s]||0)+1);
    const tsec=ts.filter(t=>t.sec===sec),rows=[];
    for(let s=1;s<=n;s++){const r=[String(s),nameOf(sec,s)];sl.forEach(sb=>{let sum=0,c=0;tsec.filter(t=>t.subj===sb.n).forEach(t=>{const p=pctOf(t,s);if(p!=null){sum+=p;c++}});const a=c?sum/c:null;r.push(a==null?'—':[a.toFixed(0)+'%',a<60?R_RED:'']);});r.push([String(pend[s]||0),pend[s]?R_RED:'']);rows.push(r)}
    return{title:'Class report card · '+sec,sub:sub+' · average % of tests per subject',tables:[{cols:['No.','Student'].concat(sl.map(x=>x.n),['Open defaulter items']),rows,none:'No students.'}]};
  }
  if(k==='tst'){
    const rows=ts.slice().sort((a,b)=>b.date.localeCompare(a.date)||secSort(a.sec,b.sec)).map(t=>{const st=testStats(t);return[fD(t.date),t.sec,t.subj,lessonLabel(t),String(t.max),fmtN(minOf(t)),st.avg==null?'—':[st.avg.toFixed(0)+'%',st.avg<60?R_RED:''],[String(st.poor),st.poor?R_RED:''],String(st.ab),String(st.k)]});
    return{title:'Test results',sub:sub+' · '+rows.length+' tests',tables:[{cols:['Date','Class','Subject','Lesson','Max','Min','Average','Below min','Absent','Marked'],rows,none:'No tests in this view.'}]};
  }
  const D={};
  es.forEach(e=>{const r=(D[e.date]=D[e.date]||{c:0,t:zero(),tn:0});r.c++;addT(r.t,tally(e))});ts.forEach(t=>{(D[t.date]=D[t.date]||{c:0,t:zero(),tn:0}).tn++});
  return{title:'Date-wise report',sub:sub,tables:[{cols:['Date','Checks','Checked','Incomplete','Not submitted','Absent','Tests'],rows:Object.keys(D).sort().reverse().map(d=>[fD(d),String(D[d].c),String(D[d].t.C),[String(D[d].t.I),D[d].t.I?R_AMB:''],[String(D[d].t.N),D[d].t.N?R_RED:''],String(D[d].t.A),String(D[d].tn)]),none:'No records.'}]};
}
const cellT=c=>Array.isArray(c)?c[0]:c;
function repHTML(R){

  R.tables.forEach(t=>{if(t.h)h+='<h4 style="margin-top:12px">'+esc(t.h)+'</h4>';
    h+=t.rows.length?'<div class="tw"><table class="rt"><tr>'+t.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(c=>Array.isArray(c)?'<td class="'+c[1]+'">'+esc(c[0])+'</td>':'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>':'<div class="empty" style="padding:14px">'+esc(t.none||'Nothing to show.')+'</div>'});
  return h+'</div>';
}
function repTSV(R){return R.title+'\t'+R.sub+'\n'+R.tables.map(t=>(t.h?t.h+'\n':'')+t.cols.join('\t')+'\n'+t.rows.map(r=>r.map(cellT).join('\t')).join('\n')).join('\n\n')}
function repWA(R){
  if(R.wa==='def'){const g={};R.list.forEach(x=>(g[x.e.sec]=g[x.e.sec]||[]).push(x));
    let t='*Defaulters · '+fD(today())+'*\n';
    Object.keys(g).sort(secSort).forEach(sec=>{t+='\n*Class '+sec+'*\n';g[sec].forEach((x,i)=>{t+=(i+1)+'. '+nameOf(sec,x.s)+' – '+x.e.subj+' '+x.e.item+' '+lessonLabel(x.e)+' – '+CODES[x.c].n+' since '+fD(isoD(new Date(x.since)))+'\n'})});return t}
  return '*'+R.title+'*\n'+R.sub+'\n\n'+R.tables.map(t=>(t.h?'*'+t.h+'*\n':'')+t.rows.map(r=>r.map(cellT).join(' | ')).join('\n')).join('\n\n');
}

function followItems(){
  const out=[];
  docs('e').filter(e=>inScope(e,true)).forEach(e=>{for(let s=1;s<=nOf(e.sec);s++){const c=e.m[s];if(c==='I'||c==='N'||c==='A'){const since=sinceOf(e,s);out.push({e,s,c,since,days:Math.floor((Date.now()-since)/864e5)})}}});
  return out;
}

  return h;

function repeatConcerns(){
  const out=[],cnt={};
  docs('e').filter(e=>inScope(e)).forEach(e=>{for(let s=1;s<=nOf(e.sec);s++){const c=e.m[s];if(c==='I'||c==='N'){const k=e.sec+'#'+s+'#'+e.subj;cnt[k]=(cnt[k]||0)+1}}});
  Object.keys(cnt).forEach(k=>{if(cnt[k]>=3){const p=k.split('#');out.push({sec:p[0],s:+p[1],what:p[2]+': incomplete / not submitted '+cnt[k]+' times'})}});
  const seen={};docs('t').filter(t=>inScope(t,true)).forEach(t=>{const key=t.sec+'|'+t.subj;if(seen[key])return;seen[key]=1;for(let s=1;s<=nOf(t.sec);s++){const sk=streakAt(t.sec,t.subj,s,null);if(sk>=2)out.push({sec:t.sec,s,what:t.subj+': below minimum in '+sk+' tests in a row'})}});
  return out;
}

/* ---------- sample data (trial mode) ---------- */
function seedSample(){
  let sd=7;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
  Object.keys(DB).forEach(k=>{if(DB[k]&&DB[k].sm)delete DB[k]});
  const secs=Object.keys(ROSTER).sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b));
  const dayN=n=>{const d=new Date();d.setDate(d.getDate()-n);return isoD(d)};
  secs.forEach(sec=>{const c=+sec.slice(0,-1),n=nOf(sec);
    subjectsFor(c).forEach((sb,si)=>{
      const its=itemsFor(c,sb.n),by=teacherOf(sec,sb.n)||'Teacher';
      its.filter(i=>i!=='Test Notebook').slice(0,2).forEach((it,ii)=>{
        const dt=dayN(1+si%5+ii*2),id='s'+sec+si+ii,m={},lg=[],rm={};
        for(let s=1;s<=n;s++){const r=rnd();if(r<.06)continue;const old=Date.now()-(1+si%4)*864e5;
          if(r<.72)m[s]='C';else if(r<.86){m[s]='I';lg.push([s,'I',old,by,'']);rm[s]='Will submit tomorrow'}else if(r<.94){m[s]='N';lg.push([s,'N',old,by,''])}else m[s]='A'}
        DB['e/'+dt+'/'+sec+'/'+id]={p:'e/'+dt+'/'+sec+'/'+id,k:'e',sec,date:dt,subj:sb.n,item:it,ls:String(5+si),lt:'',by,ts:Date.now()-864e5*(1+si%5),m,lg,rm,sm:1};
      });
      [0,1,2].forEach(ti=>{
        const dt=dayN(2+ti*4+si%3),id='t'+sec+si+ti,max=[10,20,25][ti],m={};
        for(let s=1;s<=n;s++){const r=rnd();if(r<.05)m[s]='A';else{const weak=(s%7===0);m[s]=Math.max(0,Math.min(max,Math.round(max*(weak?.35+rnd()*.3:.55+rnd()*.45))))}}
        DB['t/'+dt+'/'+sec+'/'+id]={p:'t/'+dt+'/'+sec+'/'+id,k:'t',sec,date:dt,subj:sb.n,ls:String(3+ti+si%3),lt:'',max,min:Math.round(max*6)/10,item:'Test Notebook',by,ts:Date.now()-864e5*(2+ti*4),m,sm:1};
      });
    });
  });
  persist();lsPut('seeded3',1);
}

      d.edited=ME+' · '+Date.now();

    case'seed':seedSample();render();toast('Sample data loaded');break;
    case'unseed':if(sure('unseed')){Object.keys(DB).forEach(k=>{if(DB[k].sm)delete DB[k]});persist();lsPut('seeded3',1);render();toast('Sample data removed')}break;
    case'fitem':readForm();U.form.item=D.v;render();break;

      if(!ls&&!lt){toast('Enter the lesson number or topic');break}
      const sel=$('fls');if(sel&&sel.tagName==='SELECT'&&sel.value&&sel.value!=='*'&&!lt){const o=sel.options[sel.selectedIndex];f.lt=o.dataset.t||''}
      const sec=curSec(),id=rid();let d;
      if(f.k==='e')d={p:'e/'+f.date+'/'+sec+'/'+id,k:'e',sec,date:f.date,subj:U.subj,item:f.item,ls,lt:(f.lt||'').trim(),by:ME,ts:Date.now(),m:{},lg:[],rm:{}};
      else{const mx=parseFloat(f.max);if(!(mx>0)){toast('Enter the maximum marks');break}let mn=parseFloat(f.min);if(!(mn>=0))mn=Math.round(mx*6)/10;if(mn>mx){toast('Minimum cannot be more than maximum');break}d={p:'t/'+f.date+'/'+sec+'/'+id,k:'t',sec,date:f.date,subj:U.subj,item:'Test Notebook',ls,lt:(f.lt||'').trim(),max:mx,min:mn,by:ME,ts:Date.now(),m:{}}}
