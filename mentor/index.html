  h+='<div class="card"><h3>Teachers · '+curSec()+'</h3><div class="small muted" style="margin-bottom:8px">Pre-filled from the Teacher Prep &amp; Checking apps. Type a name to change it for this section only; clear to go back.</div>'+subjectsFor(U.cls).map(x=>'<div class="grid2" style="align-items:center;margin-bottom:6px"><b>'+esc(x.n)+'</b><input data-act="teach" data-k="'+esc(curSec()+'|'+x.n)+'" value="'+esc((CFG.teach||{})[curSec()+'|'+x.n]||'')+'" placeholder="'+esc(teacherDef(curSec(),x.n)||'Teacher')+'" style="border:1px solid var(--line);border-radius:9px;padding:8px 10px"></div>').join('')+'</div>';
  h+='<div class="card"><h3>Items checked · Class '+U.cls+'</h3><div class="small muted" style="margin-bottom:8px">Tap to switch an item on or off for each subject (applies to the whole class).</div>'+subjectsFor(U.cls).map(x=>{const cur=itemsFor(U.cls,x.n);return '<div style="margin-bottom:8px"><b>'+esc(x.n)+'</b><div class="row" style="margin-top:4px">'+ITEMS.map(i=>'<button class="chip sm" data-act="titem" data-n="'+esc(x.n)+'" data-i="'+esc(i)+'" aria-pressed="'+cur.includes(i)+'">'+esc(IT_SHORT[i])+'</button>').join('')+'</div></div>'}).join('')+'</div>';
  h+='<div class="card"><h3>Lessons</h3><div class="small muted" style="margin-bottom:8px">Paste rows from the academic planner: <b>Class, Subject, Lesson no, Title</b> (one per line). Teachers then pick the lesson from a list. '+Object.keys(LESSONS).length+' subject lists loaded.</div><textarea id="lsTxt" rows="5" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px" placeholder="3, Science, 6, Reproduction in Plants"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-act="lsimport">Import lessons</button><button class="btn ghost sm" data-act="lsclear">Clear all</button></div></div>';
  h+='<div class="card"><h3>Admins</h3><div class="small muted" style="margin-bottom:6px">Names that can edit this Setup (comma separated).</div><input id="adm" value="'+esc((CFG.admins&&CFG.admins.length?CFG.admins:ADMIN_DEF).join(', '))+'" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px"><div class="row" style="margin-top:8px"><button class="btn sm" data-act="admsave">Save</button></div></div>';
  return h;
}
/* ---------- render / events ---------- */
function render(){
  chrome();const v=$('view');
  v.innerHTML=U.tab==='check'?viewCheck():U.tab==='perf'?viewPerf():U.tab==='dash'?viewDash():U.tab==='stu'?viewStu():viewSet();
  saveUI();
}
let sureK=null;function sure(k){if(sureK===k){sureK=null;return true}sureK=k;toast('Tap again to confirm');setTimeout(()=>{sureK=null},4000);return false}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function readForm(){const f=U.form;if(!f)return;const g=id=>{const e=$(id);return e?e.value:null};
  const ls=g('fls');if(ls!=null&&ls!=='*')f.ls=ls;if(ls==='*'){f.useText=true;f.ls=''}
  const d=g('fdt');if(d)f.date=d;const lt=g('flt');if(lt!=null)f.lt=lt;const mx=g('fmax');if(mx!=null)f.max=mx}
function rowRefresh(e,s){const r=$('r'+s);if(!r)return;const tmp=document.createElement('div');tmp.innerHTML=rowEntry(e,s);r.replaceWith(tmp.firstChild);const b=$('entryBar');if(b)b.innerHTML=bar(tally(e),nOf(e.sec))}
let mkTimer=null;
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act,D=b.dataset;
  const cur=U.open?DB[U.open.p]:null;
  switch(a){
    case'cls':U.cls=+D.v;U.open=null;U.form=null;U.stu=null;render();break;
    case'sec':U.sec=D.v;U.open=null;U.form=null;U.stu=null;render();break;
    case'tab':U.tab=D.v;U.open=null;U.form=null;U.stu=null;render();window.scrollTo(0,0);break;
    case'subj':U.subj=D.v;U.open=null;U.form=null;render();break;
    case'fnew':U.form={k:D.k,date:today(),item:itemsFor(U.cls,U.subj)[0],more:false,ls:'',lt:'',max:''};render();break;
    case'fitem':readForm();U.form.item=D.v;render();break;
    case'fmore':readForm();U.form.more=true;render();break;
    case'fcancel':U.form=null;render();break;
    case'fcreate':{readForm();const f=U.form,ls=(f.ls||'').trim(),lt=(f.lt||'').trim();
      if(!ls&&!lt){toast('Enter the lesson number or topic');break}
      const sel=$('fls');if(sel&&sel.tagName==='SELECT'&&sel.value&&sel.value!=='*'&&!lt){const o=sel.options[sel.selectedIndex];f.lt=o.dataset.t||''}
      const sec=curSec(),id=rid();let d;
      if(f.k==='e')d={p:'e/'+f.date+'/'+sec+'/'+id,k:'e',sec,date:f.date,subj:U.subj,item:f.item,ls,lt:(f.lt||'').trim(),by:ME,ts:Date.now(),m:{},lg:[],rm:{}};
      else{const mx=parseFloat(f.max);if(!(mx>0)){toast('Enter the maximum marks');break}d={p:'t/'+f.date+'/'+sec+'/'+id,k:'t',sec,date:f.date,subj:U.subj,ls,lt:(f.lt||'').trim(),max:mx,by:ME,ts:Date.now(),m:{}}}
      putDoc(d);U.open={k:f.k,p:d.p};U.form=null;render();window.scrollTo(0,0);break}
    case'open':case'gofix':if(a==='gofix'){U.tab='check';const e=DB[D.p];U.cls=+e.sec.slice(0,-1);U.sec=e.sec.slice(-1);U.subj=e.subj;U.seg=U.cls<=5?'P':'S'}U.open={k:D.k,p:D.p};render();window.scrollTo(0,0);break;
    case'back':U.open=null;render();break;
    case'mark':{const e=cur;if(!e)break;const s=+D.s;setMark(e,s,e.m[s]===D.c?null:D.c);rowRefresh(e,s);break}
    case'allok':{const e=cur;let k=0;for(let s=1;s<=nOf(e.sec);s++)if(!e.m[s]){e.m[s]='C';k++}putDoc(e);render();toast(k+' marked ✓');break}
    case'quick':{const e=cur;(e.rm=e.rm||{})[D.s]=D.q;putDoc(e);rowRefresh(e,+D.s);break}
    case'mkx':{const t=cur;const s=+D.s;if(t.m[s]===D.c)delete t.m[s];else t.m[s]=D.c;putDoc(t);const r=$('r'+s);const tmp=document.createElement('div');tmp.innerHTML=viewTestRow(t,s);r.replaceWith(tmp.firstChild);refreshTest(t);break}
    case'delentry':if(sure('del')){delDoc(cur.p);U.open=null;render();toast('Deleted')}break;
    case'resolve':{const e=DB[D.p];setMark(e,+D.s,'C');toast('Marked ✓ · time logged');render();break}
    case'scope':U.scope=D.v;render();break;
    case'per':U.per=D.v;render();break;
    case'dept':U.dept=D.v;render();break;
    case'dsub':U.dsub=D.v;render();break;
    case'pview':U.pview=D.v;render();break;
    case'overdue':U.overdue=!U.overdue;render();break;
    case'copyfup':{const t=waFollow();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied · paste in WhatsApp'),()=>{U.wa=t;render()});break}
    case'stu':U.stu={sec:D.sec,s:+D.s};render();window.scrollTo(0,0);break;
    case'stuback':U.stu=null;render();break;
    case'signout':TOKEN=null;lsPut('token',null);ME='';lsPut('me','');DB={};OUT={};REV=0;persist();lsPut('rev',0);showGate();break;
    case'titem':{CFG.items=CFG.items||{};const k=U.cls+'|'+D.n;let cu=itemsFor(U.cls,D.n).slice();cu=cu.includes(D.i)?cu.filter(x=>x!==D.i):cu.concat([D.i]);cu=ITEMS.filter(x=>cu.includes(x));if(!cu.length){toast('Keep at least one item');break}CFG.items[k]=cu;saveCfg();render();break}
    case'lsimport':{const tx=$('lsTxt').value.split('\n');let k=0;tx.forEach(l=>{const p=l.split(',');if(p.length<4)return;const c=p[0].trim(),sub=p[1].trim(),no=p[2].trim(),ti=p.slice(3).join(',').trim();if(!c||!sub||!no)return;const key=c+'|'+sub;(LESSONS[key]=LESSONS[key]||[]).push([no,ti]);k++});if(k){saveLessons();toast(k+' lessons added')}else toast('No valid rows found');render();break}
    case'lsclear':if(sure('ls')){LESSONS={};saveLessons();render()}break;
    case'admsave':CFG.admins=$('adm').value.split(',').map(x=>x.trim()).filter(Boolean);saveCfg();toast('Saved');break;
  }
});
function viewTestRow(t,s){const v=t.m[s],p=pctOf(t,s);return '<div class="srow" id="r'+s+'"><div class="sline"><span class="sno">'+s+'</span><span class="sname">'+esc(nameOf(t.sec,s))+'<span id="fl'+s+'"></span></span><span class="pc'+(p!=null&&p<60?' low':'')+'" id="pc'+s+'">'+(p!=null?p.toFixed(0)+'%':(v==='A'||v==='NG'?v:''))+'</span><input class="mk'+(p!=null&&p<60?' low':'')+'" inputmode="decimal" data-act="mk" data-s="'+s+'" value="'+(typeof v==='number'?v:'')+'" placeholder="–"><div class="cb"><button data-act="mkx" data-s="'+s+'" data-c="A" class="A'+(v==='A'?' on':'')+'">A</button><button data-act="mkx" data-s="'+s+'" data-c="NG" class="A'+(v==='NG'?' on':'')+'">NG</button></div></div></div>'}
document.addEventListener('input',ev=>{
  const el=ev.target,a=el.dataset&&el.dataset.act;
  if(a==='mk'){const t=U.open&&DB[U.open.p];if(!t)return;const s=+el.dataset.s;const raw=el.value.trim();
    if(raw===''){delete t.m[s]}else{const n=parseFloat(raw);if(isNaN(n)||n<0){return}if(n>t.max){toast('More than the maximum ('+t.max+')');el.value='';delete t.m[s]}else t.m[s]=n}
    const p=pctOf(t,s);el.classList.toggle('low',p!=null&&p<60);const pc=$('pc'+s);if(pc){pc.textContent=p!=null?p.toFixed(0)+'%':'';pc.classList.toggle('low',p!=null&&p<60)}
    refreshTest(t);clearTimeout(mkTimer);mkTimer=setTimeout(()=>putDoc(t),500)}
  if(el.id==='sq'){U.q=el.value;const pos=el.selectionStart;render();const n=$('sq');n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener('change',ev=>{
  const el=ev.target,a=el.dataset&&el.dataset.act;
  if(a==='note'){const e=U.open&&DB[U.open.p];if(e){(e.rm=e.rm||{})[el.dataset.s]=el.value.trim();putDoc(e)}}
  if(a==='teach'){CFG.teach=CFG.teach||{};const v=el.value.trim();if(v)CFG.teach[el.dataset.k]=v;else delete CFG.teach[el.dataset.k];saveCfg();toast('Saved')}
  if(el.id==='fls'&&el.tagName==='SELECT'){if(el.value==='*'){readForm();render()}else{const o=el.options[el.selectedIndex],lt=$('flt');if(lt&&!lt.value&&o&&o.dataset.t)lt.value=o.dataset.t}}
});
$('segSw').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;U.seg=b.dataset.seg;U.open=null;U.form=null;U.stu=null;ensureSel();render()});
$('meBtn').addEventListener('click',()=>{U.tab='set';U.open=null;render()});
/* ---------- login ---------- */
function showGate(){$('gate').classList.remove('hide');$('gpw').classList.toggle('hide',!API_URL);$('ge').textContent=API_URL?'':'Trial mode: type your name to try the app. Records stay on this phone.';$('gn').value=ME||''}
$('gf').addEventListener('submit',async ev=>{
  ev.preventDefault();const n=$('gn').value.trim().replace(/\s+/g,' ');if(n.length<3){$('ge').textContent='Type your full name.';return}
  if(!API_URL){ME=n;lsPut('me',ME);$('gate').classList.add('hide');boot();return}
  $('ge').textContent='Checking…';
  try{const r=await call('login',[n,$('gp').value]);TOKEN=r.token;ME=r.name;lsPut('token',TOKEN);lsPut('me',ME);$('gp').value='';$('gate').classList.add('hide');boot()}
  catch(e){$('ge').textContent=e.net?'No internet connection.':e.message}
});
async function boot(){render();await loadRoster();await pull();await flush();render();}
if(API_URL?!TOKEN:!ME)showGate();else{boot()}
setInterval(()=>{if(!document.hidden&&TOKEN){flush();pull()}},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN){flush();pull()}});
render();
})();

</script></body></html>
