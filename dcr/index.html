<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIS DCR Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: formal navy register with gold rule; light work surface; status colours carry meaning; tables collapse to cards on phones */
:root{
  --navy:#1B3156;--navy2:#243D69;--navy3:#14233F;--mag:#E91D69;--mag-d:#C9135A;--mag-t:#FDE8F0;
  --pur:#572686;--pur-t:#EFE8F6;--amb:#EFA11D;--amb-t:#FDF1DC;--sky:#2B9BD6;--sky-l:#68C0EA;--sky-t:#E4F4FC;
  --bg:#F3F5FA;--card:#FFFFFF;--ink:#18223A;--ink2:#667391;--line:#E2E7F0;--soft:#F6F8FC;
  --gold:#EFA11D;--goldbg:#FDF1DC;
  --ok:#1E9E6A;--okbg:#E3F5EC;--no:#D93A4B;--nobg:#FCE9EB;--ic:#9A6508;--icbg:#FDF1DC;
  --abs:#572686;--absbg:#EFE8F6;--lv:#1B77A8;--lvbg:#E4F4FC;--rt:#243D69;--rtbg:#E6EBF5;--na:#8C97B0;--nabg:#EDF0F6;
  --shadow:0 1px 2px rgba(20,35,63,.05),0 6px 20px rgba(20,35,63,.06);
  --display:'Plus Jakarta Sans',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.1px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--navy2)}
/* header */
.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--gold);box-shadow:0 2px 14px rgba(8,16,44,.3)}
.top .row{display:flex;align-items:center;gap:12px;padding:9px 16px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(145deg,#E3BE72,#A87725);color:#0F1E45;font:700 14px var(--display);display:grid;place-items:center;letter-spacing:.5px;flex:none}
.brand b{display:block;font:700 16px var(--display);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.78;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;display:block}
.sp{flex:1}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 10px 5px 6px;font-size:12.5px;min-width:0;max-width:46vw}
.me i{font-style:normal;width:26px;height:26px;border-radius:6px;background:var(--gold);color:#0F1E45;display:grid;place-items:center;font-weight:800;font-size:11.5px;flex:none}
.me span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{font-size:11px;display:flex;align-items:center;gap:6px;opacity:.92;white-space:nowrap}
.sync:before{content:"";width:8px;height:8px;border-radius:50%;background:#58D39A}
.sync.warn:before{background:#F2B94B}
.nav{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;color:#C4CFEE;padding:9px 13px;font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-3px}
.nav button.on{color:#fff;border-bottom-color:var(--gold)}
.nav .newbtn{margin-left:auto;background:var(--gold);color:#0F1E45;border-radius:7px;border:0;padding:6px 14px;margin-block:5px;font-weight:800;margin-bottom:5px}
.vbar{background:var(--card);border-bottom:1px solid var(--line)}
.vbar .in{max-width:1240px;margin:0 auto;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.vbar b{color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:14px 16px 96px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.sec-h{display:flex;align-items:center;gap:10px;margin:20px 0 9px;flex-wrap:wrap}
.sec-h h2{font-size:18px}
.sec-h small{color:var(--ink2)}
.sec-h:before{content:"";width:4px;height:20px;background:var(--gold);border-radius:2px}
.sec-h.nb:before{display:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 13px;font-weight:700;font-size:13.5px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0F1E45}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink2)}
.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-no{background:var(--nobg);color:var(--no)}.p-ic{background:var(--icbg);color:var(--ic)}
.p-abs{background:var(--absbg);color:var(--abs)}.p-lv{background:var(--lvbg);color:var(--lv)}.p-rt{background:var(--rtbg);color:var(--rt)}.p-na{background:var(--nabg);color:var(--na)}
.p-gold{background:var(--goldbg);color:var(--gold)}
.itm{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:1px 8px 1px 2px;font-size:12px;font-weight:600;background:var(--card);margin:2px 3px 2px 0}
.itm i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:800;color:#fff}
.t-B i,.ty.t-B{background:#2B5FD0}.t-N i,.ty.t-N{background:#C2562B}.t-A i,.ty.t-A{background:#0E8A6E}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-weight:500;color:var(--ink);font-size:14px;min-width:0}
/* date bar */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar h1{font-size:23px;margin-right:6px}
.datebar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);border-top:3px solid var(--navy2)}
.kpi .v{font:700 25px var(--display);line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.25}
.kpi.no{border-top-color:var(--no)}.kpi.ic{border-top-color:var(--ic)}.kpi.ok{border-top-color:var(--ok)}.kpi.abs{border-top-color:var(--abs)}.kpi.lv{border-top-color:var(--lv)}.kpi.gold{border-top-color:var(--gold)}
/* board */
.brow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border:0}
.brow b{font-size:13px}
.bsecs{display:flex;gap:7px;flex-wrap:wrap}
.sp-box{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--soft);min-width:122px}
.sp-box .n{font-size:11px;font-weight:800;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.mbs{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.mb{border:0;border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:800;background:var(--nabg);color:var(--na)}
.mb.done{background:var(--okbg);color:var(--ok)}.mb.pend{background:var(--icbg);color:var(--ic)}.mb.over{background:var(--nobg);color:var(--no)}
.mb sup{font-size:10px;margin-left:2px;color:var(--no)}
/* lists */
.list{display:grid;gap:9px}
.rc{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
.rc h3{font-size:16px}
.rc .meta{display:flex;gap:5px 10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);margin-top:4px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.bar div.t{height:9px;border-radius:5px;background:var(--nabg);overflow:hidden}
.bar div.t span{display:block;height:100%;background:linear-gradient(90deg,var(--no),#D98A4D)}
details.ex{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
details.ex summary{padding:9px 13px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}
details.ex summary::-webkit-details-marker{display:none}
details.ex .in{padding:2px 13px 11px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
/* defaulter register */
.reg{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.reg .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 13px;background:var(--soft);border-bottom:1px solid var(--line)}
.reg .rh h3{font-size:15.5px}
.dh,.dr{display:grid;grid-template-columns:1.25fr 1.35fr 1.1fr 1.05fr 1.3fr auto;gap:10px;padding:9px 13px;align-items:start}
.dh{font-size:10.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line)}
.dr{border-bottom:1px solid var(--line);font-size:12.5px}
.dr:last-child{border:0}
.dr .lb{display:none}
.dr .acts{display:flex;gap:5px;flex-wrap:wrap}
.dr small{color:var(--ink2);display:block}
.rem{font-style:italic;color:var(--ink)}
/* round screen */
.rhead{display:grid;gap:9px}
.rhead h1{font-size:24px}
.phases{display:flex;gap:8px;flex-wrap:wrap}
.ph{flex:1;min-width:160px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-align:left}
.ph.on{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(27,50,112,.14)}
.ph b{display:block;font:700 15px var(--display)}
.ph small{color:var(--ink2);font-size:11.5px}
.banner{border-radius:8px;padding:9px 13px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--icbg);color:var(--ic)}.banner.info{background:var(--lvbg);color:var(--lv)}.banner.bad{background:var(--nobg);color:var(--no)}.banner.good{background:var(--okbg);color:var(--ok)}
.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
table.grid2{border-collapse:separate;border-spacing:0;min-width:100%}
table.grid2 th,table.grid2 td{padding:0;border-bottom:1px solid var(--line);text-align:center}
table.grid2 thead th{position:sticky;top:0;background:var(--soft);z-index:3;vertical-align:bottom;padding:6px 4px;min-width:72px;max-width:94px;border-bottom:2px solid var(--line)}
table.grid2 thead th.stk{left:0;z-index:5;min-width:180px;text-align:left;padding-left:12px}
table.grid2 td.stk,table.grid2 th.stk{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;border-right:2px solid var(--line)}
table.grid2 td.stk{padding:5px 10px;cursor:pointer;min-width:180px}
table.grid2 tbody tr:nth-child(even) td.stk{background:var(--soft)}
.rl{display:inline-block;width:26px;color:var(--ink2);font-size:11px;font-weight:700}
.sn{font-weight:700;font-size:13.5px}
.sflag{display:block;margin-left:26px;margin-top:1px}
th .ty{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;color:#fff;font-size:10px;font-weight:800;margin-bottom:3px}
th .nm{display:block;font-size:11px;line-height:1.15;font-weight:700;cursor:pointer;word-break:break-word}
th .dd{display:block;font-size:10px;color:var(--ink2);font-weight:600;margin-top:2px}
.c{width:100%;min-width:60px;height:44px;border:0;background:transparent;font-weight:800;font-size:15px}
.c span{display:inline-grid;place-items:center;min-width:32px;height:28px;border-radius:7px;padding:0 6px}
.c.ok span{background:var(--okbg);color:var(--ok)}.c.no span{background:var(--nobg);color:var(--no)}.c.ic span{background:var(--icbg);color:var(--ic);font-size:12.5px}
.c.abs span{background:var(--absbg);color:var(--abs)}.c.lv span{background:var(--lvbg);color:var(--lv)}.c.rt span{background:var(--rtbg);color:var(--rt);font-size:12.5px}
.c.na span{background:var(--nabg);color:var(--na)}
.c:active span{transform:scale(.92)}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--gold);box-shadow:0 -6px 20px rgba(15,30,69,.12);z-index:25;padding:9px 16px}
.sticky-bar .in{max-width:1240px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(9,15,38,.58);z-index:60;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sh{background:var(--card);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 20px;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (min-width:720px){#sheet{align-items:center}.sh{border-radius:14px}}
.sh h2{font-size:20px;margin-bottom:4px}
.sh .x{float:right;border:0;background:var(--soft);width:32px;height:32px;border-radius:8px;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;margin:11px 0}
.opt{border:2px solid var(--line);background:var(--card);border-radius:9px;padding:10px 11px;text-align:left;font-weight:700;display:flex;gap:10px;align-items:center}
.opt .g{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;flex:none}
.opt.cur{border-color:var(--navy2);background:var(--soft)}
.opt small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.chip{border:2px solid var(--line);border-radius:8px;background:var(--card);padding:5px 11px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.chip i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:800;color:#fff}
.chip.on{border-color:var(--navy2);background:var(--navy);color:#fff}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin:11px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:9px;font-weight:700;z-index:80;box-shadow:var(--shadow);max-width:90vw;border-left:4px solid var(--gold)}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.who-list{display:grid;gap:6px;max-height:42vh;overflow:auto;margin-top:10px}
.who-list button,.persona{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 11px;text-align:left;display:flex;justify-content:space-between;gap:10px;font-weight:700;align-items:center}
.who-list small,.persona small{color:var(--ink2);font-weight:500;display:block}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;margin:10px 0}
.persona{flex-direction:column;align-items:flex-start;gap:2px}
.persona .rl2{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);font-weight:800}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.erow .grow{flex:1;min-width:150px}
.fcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 13px;margin-bottom:9px}
.fcard .hd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:5px}
.dsum{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:13px}
@media (max-width:760px){
  .brand small{display:none}.brand b{font-size:14px}.sync{display:none}
  .dh{display:none}
  .dr{grid-template-columns:1fr 1fr;gap:6px 12px}
  .dr .lb{display:block;font-size:10px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
  .dr>div:first-child,.dr .acts{grid-column:1/-1}
  .brow{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 34px}
  table.grid2 thead th.stk,table.grid2 td.stk{min-width:140px}
  .datebar h1{font-size:19px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dsum{grid-template-columns:1fr auto auto}
  .dsum .hide-m{display:none}
}

/* ===== FIS design system overrides ===== */
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3{letter-spacing:0;color:var(--navy);font-weight:700}
h1{font-size:19px}
.sec-h h2,.card h2{font-size:14.5px}
.rc h3,.reg .rh h3{font-size:14.5px}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:fixed;inset:0 auto 0 0;z-index:40;background:linear-gradient(180deg,#1B3156,#14233F);color:#C3CDE4;display:flex;flex-direction:column;padding:18px 14px 22px;overflow:auto}
.side:after{content:"";position:fixed;left:0;bottom:0;width:236px;height:5px;background:linear-gradient(90deg,#E91D69 0 25%,#EFA11D 25% 50%,#68C0EA 50% 75%,#572686 75% 100%)}
.slogo{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.slogo .mark{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--navy);font:800 13px var(--body);display:grid;place-items:center;flex:none;letter-spacing:.3px}
.slogo b{display:block;color:#fff;font-size:14px;line-height:1.2}
.slogo small{display:block;font-size:10.5px;color:#7D8FB6;letter-spacing:.6px;margin-top:1px}
.slab{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#7D8FB6;font-weight:700;padding:14px 10px 6px}
.snav{display:flex;flex-direction:column;gap:3px}
.snav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-left:3px solid transparent;color:#C3CDE4;font-weight:600;font-size:13.5px;padding:9px 10px;border-radius:10px;text-align:left;width:100%}
.snav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.snav button:hover{background:rgba(255,255,255,.07)}
.snav button.on{background:rgba(233,29,105,.16);color:#fff;border-left-color:var(--mag);border-radius:0 10px 10px 0}
.snav .bdg{margin-left:auto;background:var(--mag);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.sfoot{margin-top:auto;padding:14px 10px 10px;font-size:11.5px;color:#7D8FB6}
.col{margin-left:236px;min-width:0;flex:1}
.tb{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.tb .tt{min-width:0}
.tb .tt b{display:block;font-size:19px;font-weight:700;color:var(--navy);line-height:1.2}

<script>
const D = {"classes":[{"k":"PG","l":"Pre-Nursery (PG)","b":"pp","s":["A","B"]},{"k":"NUR","l":"Nursery","b":"pp","s":["A","B"]},{"k":"LKG","l":"LKG","b":"pp","s":["A","B"]},{"k":"UKG","l":"UKG","b":"pp","s":["A","B"]},{"k":"C1","l":"Class 1","b":"pri","s":["A","B","C"]},{"k":"C2","l":"Class 2","b":"pri","s":["A","B","C"]},{"k":"C3","l":"Class 3","b":"pri","s":["A","B","C"]},{"k":"C4","l":"Class 4","b":"pri","s":["A","B","C"]},{"k":"C5","l":"Class 5","b":"pri","s":["A","B","C"]},{"k":"C6","l":"Class 6","b":"sec","s":["A","B","C"]},{"k":"C7","l":"Class 7","b":"sec","s":["A","B","C"]},{"k":"C8","l":"Class 8","b":"sec","s":["A","B","C"]},{"k":"C9","l":"Class 9","b":"sec","s":["A","B"]},{"k":"C10","l":"Class 10","b":"sec","s":["A","B"]},{"k":"C11","l":"Class 11","b":"sr","s":["A"]}],"stu":{},"staff":[],"ct":{}};
const API=(new URLSearchParams(location.search).get('api'))||"https://script.google.com/macros/s/AKfycbws-Cjw6IkVAhqWJQbpYr77R8_Ni2rTf0VzUFOIomnXFywwKAH-2Zjz2kx6bE82nDOU/exec";
const LIVE=!!API;
if(LIVE){D.stu={};D.staff=[];D.ct={}}
/* ============ constants & helpers ============ */
const CLSMAP = Object.fromEntries(D.classes.map(c=>[c.k,c]));
const CAT = {
  pp:{B:['English','Hindi','Maths','EVS','Rhymes'],N:['English','Hindi','Maths','EVS','Drawing'],A:['Activity Sheet']},
  pri:{B:['English Reader','English Grammar','Hindi','Hindi Vyakaran','Maths','EVS / Science','S.St','G.K.','Computer'],
       N:['English','English Grammar','Hindi','Hindi Vyakaran','Maths','EVS / Science','S.St','G.K.','Computer','Drawing','Rough'],
       A:['English','Hindi','Maths','EVS / Science','S.St','G.K.']},
  sec:{B:['English','English Grammar','Hindi','Maths','Science','Social Science','Computer','Third Language'],
       N:['English','English Grammar','Hindi','Maths','Science','Social Science','Computer','Third Language','Rough'],
       A:['English','Hindi','Maths','Science','Social Science']},
  sr:{B:['English','Accountancy','BST','Economics','Informatics Practices','Maths'],
      N:['English','Accountancy','BST','Economics','Informatics Practices','Maths','Rough'],
      A:['English','Accountancy','BST','Economics','Informatics Practices']}
};
const TYPE={B:'Book',N:'Notebook',A:'Assignment'};
const KIND={ISSUE:{l:'Not received',c:'no'},RETURN:{l:'Not submitted',c:'no'},IC:{l:'Incomplete',c:'ic'},LEAVE:{l:'On leave',c:'lv'},RETAIN:{l:'Retained',c:'rt'}};
const XK={ABS:['Absent','abs'],NOREC:['Not received','no'],MISS:['Not submitted','no'],IC:['Incomplete','ic'],LV:['On leave','lv'],RT:['Retained','rt']};
const KINDLBL={weekly:'Weekly (Sat → Mon)',daily:'Daily (diary)',other:'Other',leave:'Leave kit'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '—';const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fdl=s=>{const d=parse(s);return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const ft=ts=>{const d=new Date(ts);let h=d.getHours();const ap=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap};
const dOf=ts=>iso(new Date(ts));
const fdt=ts=>ts?fd(dOf(ts))+', '+ft(ts):'';
const todayISO=()=>iso(new Date());
const nextSchool=s=>{let n=addDays(s,1);if(parse(n).getDay()===0)n=addDays(n,1);return n};
const nextMonday=s=>{const d=parse(s);do{d.setDate(d.getDate()+1)}while(d.getDay()!==1);return iso(d)};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const uid=()=>Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const secLabel=(ck,sec)=>CLSMAP[ck].l+(ck==='C11'?'':' – '+sec);
const SECS=[];D.classes.forEach(c=>c.s.forEach(s=>SECS.push({k:c.k+'-'+s,ck:c.k,sec:s,label:secLabel(c.k,s)})));
const SECMAP=Object.fromEntries(SECS.map(s=>[s.k,s]));
const initials=n=>n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const itemChip=(it,extra)=>`<span class="itm t-${it.t}"><i>${it.t}</i>${esc(it.n||it.in)}${extra?' <small class="muted">'+esc(extra)+'</small>':''}</span>`;
const short=n=>n.length>16?n.replace('English','Eng').replace('Social Science','S.St').replace('Informatics Practices','IP').replace('Grammar','Gram.'):n;

/* ---- collection dates per item ---- */
const icd=(r,it)=>it.cd||r.collect;
const groupsOf=r=>[...new Set(r.items.map(i=>icd(r,i)))].sort();
const csubFor=(r,d)=>r.cs&&r.cs[d];
const allColl=r=>groupsOf(r).every(d=>csubFor(r,d));
const itemsFor=(r,gd)=>gd?r.items.filter(i=>icd(r,i)===gd):r.items;
function curGroup(r){const g=groupsOf(r);if(S.grp&&g.includes(S.grp))return S.grp;return g.find(d=>!csubFor(r,d))||g[g.length-1]}
const editKey=(ph,gd)=>ph==='dist'?'dist':'c'+gd;

/* ============ roles & scope ============ */
const MGMT=['Chairperson','Dean - Academics','Operational Manager','Director'];
const DEF_SCOPES={'Chandani Chayal':['PG','NUR'],'Karishma Suthar':['LKG','UKG'],'Komal Suthar':['C1','C2'],'Manisha Chauhan':['C3'],'Vijay Raj Soni':['C4'],'Yashika Gupta':['C5'],
  'Mansi Soni':['C6','C7'],'Rashmi Singh':['C8'],'Saba Panwar':['C9'],'Tanushree Purohit':['C10'],'Upender Singh Shekhawat':['C11'],
  'Dr. Garima Khatri':['PG','NUR','LKG','UKG'],'Neha Sethia':['C1','C2'],'Poonam Sharda':['C3','C4','C5'],'Rashmi Rathore':['C6','C7'],'Sarita Saini':['C8','C9'],'Shally Taneja':['C10','C11']};
const scopesCfg=()=>Object.assign({},DEF_SCOPES,(S.config&&S.config.scopes)||{});
function scopeFor(n,r){
  if(!n)return{all:true,label:'Whole school',kind:'Staff'};
  if(n==='Director'||MGMT.includes(r))return{all:true,label:'Whole school · all sections',kind:r==='Director'||n==='Director'?'Director':r};
  const ct=Object.keys(D.ct).filter(k=>(D.ct[k].ct||[]).includes(n)||(D.ct[k].as||[]).includes(n));
  if(ct.length)return{keys:new Set(ct),label:ct.map(k=>SECMAP[k].label).join(', '),kind:(D.ct[ct[0]].ct||[]).includes(n)?'Class Teacher':'Assistant Teacher'};
  const sc=scopesCfg()[n];
  if(sc){const keys=new Set();sc.forEach(c=>CLSMAP[c]&&CLSMAP[c].s.forEach(s=>keys.add(c+'-'+s)));return{keys,label:sc.map(c=>CLSMAP[c].l).join(', '),kind:r==='Class Manager'?'Coordinator':r}}
  return{all:true,label:'All sections',kind:r||'Staff'}}
const SC=()=>scopeFor(S.me&&S.me.n,S.me&&S.me.r);
const inScope=key=>{const s=SC();return s.all||s.keys.has(key)};
const scopeSecs=()=>SECS.filter(s=>inScope(s.k));
const scopeClasses=()=>D.classes.filter(c=>c.s.some(s=>inScope(c.k+'-'+s)));
const PERSONAS=[['Director','Director','Whole school: every section, every defaulter'],['Sunita Nirban','Teacher','Class Teacher · Class 1 – A'],['Pallavi Joshi','Science Teacher','Class Teacher · Class 8 – A'],
  ['Mansi Soni','Class Manager','Coordinator · Class 6 and Class 7 (A, B, C)'],['Komal Suthar','Class Manager','Coordinator · Class 1 and Class 2'],['Rashmi Rathore','Program Leader','Program Leader · Class 6 and 7'],['Amit Sanwal','Mathematics Teacher','Subject teacher · all sections']];

/* ============ state ============ */
const S={me:null,tab:'dash',date:todayISO(),rounds:{},ledger:{},config:{custom:[]},openRound:null,phase:'dist',grp:null,
  fu:{k:'all',cls:'',sec:'',t:'',q:'',od:false,res:false},rf:{q:'',cls:'',scope:'recent'},sa:{key:''},loaded:false,mode:'local',syncMsg:''};
if(!LIVE){try{const m=JSON.parse(localStorage.getItem('dcr_me')||'null');if(m&&m.n)S.me=m}catch(e){}}
const canSwitch=()=>!LIVE||!S.real||MGMT.includes(S.real.r)||S.real.r==='Director';

/* ============ storage ============ */
const unwrap=x=>{if(!x)return null;if(typeof x.exists==='boolean'&&!x.exists)return null;if(typeof x.exists==='function'&&!x.exists())return null;
  if(typeof x.data==='function')return x.data();if(x.data&&typeof x.data==='object'&&!Array.isArray(x.data)&&!('cls' in x))return x.data;return x};
const docsOf=snap=>{const out=[];if(!snap)return out;const push=d=>{const v=typeof d.data==='function'?d.data():(d.data&&typeof d.data==='object'&&!('cls' in d)?d.data:d);out.push({id:d.id||(v&&v.id),data:v})};
  if(Array.isArray(snap.docs))snap.docs.forEach(push);else if(Array.isArray(snap))snap.forEach(push);else if(typeof snap.forEach==='function')snap.forEach(push);return out};
/* ---- HTTP backend (Apps Script) for the staff hub ---- */
let TOK='';try{TOK=localStorage.getItem('dcr_tok')||''}catch(e){}
function apiCall(fn,args){
  return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,code:TOK,args:args||[]})})
  .then(r=>r.json()).then(j=>{if(!j||j.ok===false){const e=new Error((j&&j.error)||'Request failed');e.auth=!!(j&&j.auth);throw e}return j.data})}
function gate(){return new Promise(resolve=>{
  const ok=()=>resolve();
  const form=()=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#1B3156,#14233F);display:grid;place-items:center;padding:16px';
    d.innerHTML='<form style="background:#fff;color:#18223A;border-radius:14px;padding:24px;max-width:360px;width:100%;border-top:4px solid #E91D69;font-family:var(--body)"><h2 style="margin:0 0 4px;font-size:19px;color:#1B3156">FIS DCR Desk</h2><p style="margin:0 0 12px;font-size:13px;color:#667391">Sign in with your name and the same password as the Diary app.</p><label class="field">Full name<input id="g-n" autocomplete="username" style="border:1px solid #D8DEEA;border-radius:8px;padding:9px"></label><label class="field" style="margin-top:9px">Password<input id="g-p" type="password" autocomplete="current-password" style="border:1px solid #D8DEEA;border-radius:8px;padding:9px"></label><div id="g-e" style="color:#BE2F36;font-size:12.5px;min-height:18px;margin-top:6px"></div><button class="btn gold" style="width:100%;margin-top:4px">Sign in</button></form>';
    document.body.appendChild(d);const f=d.querySelector('form');
    f.onsubmit=ev=>{ev.preventDefault();const n=d.querySelector('#g-n').value.trim(),p=d.querySelector('#g-p').value;if(!n||!p){d.querySelector('#g-e').textContent='Type your name and password.';return}
      d.querySelector('#g-e').textContent='Checking…';
      apiCall('login',[n,p]).then(r=>{TOK=r.token;try{localStorage.setItem('dcr_tok',TOK)}catch(e){}d.remove();ok()}).catch(e=>{d.querySelector('#g-e').textContent=e.auth||/password|name|login|approv/i.test(e.message)?e.message:'Could not reach the server. Check the connection.'})}};
  if(!TOK){form();return}
  apiCall('ping').then(ok).catch(e=>{if(e.auth){TOK='';try{localStorage.removeItem('dcr_tok')}catch(x){}form()}else ok()})})}
const HT={ver:0,cache:{dcr_rounds:{},dcr_ledger:{},dcr_config:{}},subs:[],timer:null,busy:false,
  async poll(){if(this.busy)return;this.busy=true;
    try{const r=await apiCall('sync',[this.ver,addDays(todayISO(),-21)]);
      if(r&&!r.same){Object.keys(r.rows||{}).forEach(k=>{const i=k.indexOf('/');const col=k.slice(0,i),id=k.slice(i+1);const v=r.rows[k];if(v===null)delete this.cache[col][id];else this.cache[col][id]=v});this.ver=r.ver;this.fire()}
      else if(!this.once)this.fire();this.once=1;if(S.syncMsg==='Could not reach the server'){S.syncMsg='';render()}}
    catch(e){if(e.auth){TOK='';try{localStorage.removeItem('dcr_tok')}catch(x){}location.reload();return}S.syncMsg='Could not reach the server';render()}
    this.busy=false},
  fire(cols){this.subs.forEach(s=>{s.cb(Object.entries(this.cache[s.col]).map(([id,data])=>({id,data:clone(data)})))})},
  start(){if(!this.timer){this.poll();this.timer=setInterval(()=>this.poll(),12000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.poll()})}}};
const Store={db:null,mode:'local',mem:{dcr_rounds:{},dcr_ledger:{},dcr_config:{}},subs:[],

  const col=(title,rows,kind,empty)=>`<div class="wcol"><div class="wh"><b>${title}</b><span class="pill p-gold num">${rows.length}</span></div>${rows.length?rows.map(r=>row(r,kind)).join(''):`<div class="muted tiny" style="padding:10px 0">${empty}</div>`}</div>`;
  return `<div class="card"><div class="calh" style="margin-bottom:6px"><b>${esc(fdl(D0))}</b><span class="sp"></span><span class="muted tiny">${D0===t?'Today':D0<t?'Past date':'Upcoming'}</span></div>
  <div class="wgrid">${col('To distribute',dist,'d','Nothing to distribute on this date.')}${col('To collect',coll,'c','Nothing to collect on this date.')}</div>
  ${open.length?`<div class="banner info" style="margin-top:10px">${open.length} leave set${open.length>1?'s':''} due back this day · <a href="#" data-act="tab" data-v="leave">open Leave desk</a></div>`:''}</div>`}

function dashCharts(R,D0){
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(D0,-i));
  const data=days.map(d=>{let due=0,sub=0,miss=0;const perC={};
    R.forEach(r=>{if(!groupsOf(r).includes(d))return;due++;const ck=r.key.slice(0,r.key.lastIndexOf('-'));
      if(csubFor(r,d)){sub++;const st=stats(r,itemsFor(r,d));const m=st.miss-st.absC;miss+=m;perC[ck]=(perC[ck]||0)+m}});
    return{d,due,sub,miss,perC,rate:due?Math.round(sub*100/due):null}});
  if(!data.some(x=>x.due))return '';
  const W=460,Ht=180,L=34,Rr=14,T=22,B=30,pw=W-L-Rr,ph=Ht-T-B,n=data.length,xs=i=>L+pw*(i+.5)/n;
  const lab=d=>fd(d).split(' ').slice(0,2).join(' ');
  /* line: submission rate */
  let g=[0,50,100].map(v=>{const y=T+ph*(1-v/100);return `<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="#E2E7F0"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#667391">${v}%</text>`}).join('');
  const pts=data.map((x,i)=>x.rate==null?null:[xs(i),T+ph*(1-x.rate/100),x.rate]);
  const seg=pts.filter(Boolean);
  const path=seg.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=seg.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="#243D69" stroke-width="2"/><text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1B3156">${p[2]}%</text>`).join('');
  const xl=data.map((x,i)=>`<text x="${xs(i)}" y="${Ht-10}" text-anchor="middle" font-size="10" fill="#667391">${lab(x.d)}</text>`).join('');
  const line=`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Collection submission rate, last 7 days">${g}${seg.length>1?`<path d="${path}" fill="none" stroke="#243D69" stroke-width="2.2" stroke-linejoin="round"/>`:''}${dots}${xl}</svg>`;
  /* bars: not submitted */
  const mx=Math.max(1,...data.map(x=>x.miss));const bw=Math.min(34,pw/n*.55);
  const bars=data.map((x,i)=>{const h0=ph*x.miss/mx;return `<rect x="${(xs(i)-bw/2).toFixed(1)}" y="${(T+ph-h0).toFixed(1)}" width="${bw}" height="${Math.max(h0,x.miss?2:0).toFixed(1)}" rx="4" fill="${x.d===D0?'#E91D69':'#572686'}"/><text x="${xs(i).toFixed(1)}" y="${(T+ph-h0-6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1B3156">${x.due?x.miss:''}</text>`}).join('');
  const bsvg=`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Items not submitted, last 7 days"><line x1="${L}" x2="${W-Rr}" y1="${T+ph}" y2="${T+ph}" stroke="#E2E7F0"/>${bars}${xl}</svg>`;
  /* heat grid: class x day */
  const cls=D.classes.filter(c=>data.some(x=>x.perC[c.k]!=null));
  let hm='';
  if(cls.length){const rh=17,top=22,lw=64,cw=(W-lw-8)/n;const hmax=Math.max(1,...cls.flatMap(c=>data.map(x=>x.perC[c.k]||0)));
    const cells=cls.map((c,ri)=>data.map((x,i)=>{const v=x.perC[c.k];const y=top+ri*rh;
      if(v==null)return `<rect x="${(lw+i*cw+1).toFixed(1)}" y="${y}" width="${(cw-2).toFixed(1)}" height="${rh-2}" rx="3" fill="#F3F5FA"/>`;
      const a=v?(.18+.82*v/hmax):0;const col=v?`rgba(217,58,75,${a.toFixed(2)})`:'#E3F5EC';
      return `<rect x="${(lw+i*cw+1).toFixed(1)}" y="${y}" width="${(cw-2).toFixed(1)}" height="${rh-2}" rx="3" fill="${col}"/><text x="${(lw+i*cw+cw/2).toFixed(1)}" y="${y+12}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${v&&a>.55?'#fff':'#1B3156'}">${v}</text>`}).join('')).join('');
    const rl=cls.map((c,ri)=>`<text x="0" y="${top+ri*rh+12}" font-size="10.5" font-weight="600" fill="#243D69">${esc(c.l)}</text>`).join('');
    const hl=data.map((x,i)=>`<text x="${(lw+i*cw+cw/2).toFixed(1)}" y="14" text-anchor="middle" font-size="9.5" fill="#667391">${lab(x.d)}</text>`).join('');
    hm=`<svg viewBox="0 0 ${W} ${top+cls.length*rh+4}" role="img" aria-label="Items not submitted by class and day">${hl}${rl}${cells}</svg>`}
  return `<div class="charts"><div class="card"><h3>Collection submission rate</h3><div class="muted tiny">Sections that submitted a due collection · last 7 days</div>${line}</div>
  <div class="card"><h3>Items not submitted</h3><div class="muted tiny">Per day, excluding absentees · selected date highlighted</div>${bsvg}</div>
  ${hm?`<div class="card"><h3>Not submitted by class</h3><div class="muted tiny">Heat grid · class by day · red = more items outstanding</div>${hm}</div>`:''}</div>`}

function dashView(){
  const D0=S.date;const R=sRounds().filter(r=>r.kind!=='leave');const sc=SC();
  const dist=R.filter(r=>r.date===D0),coll=R.filter(r=>groupsOf(r).includes(D0));
  const dDone=dist.filter(r=>r.dsub).length,cDone=coll.filter(r=>csubFor(r,D0)).length;
  let miss=0,ic=0,notrec=0;const absSet=new Set();
  coll.filter(r=>csubFor(r,D0)).forEach(r=>{const its=itemsFor(r,D0);const s=stats(r,its);miss+=s.miss-s.absC;ic+=s.ic;(excs(r,'coll',its).ABS||[]).forEach(o=>absSet.add(r.key+o.sid))});
  dist.filter(r=>r.dsub).forEach(r=>{const s=stats(r);notrec+=s.notgiven-s.absD;(excs(r,'dist').ABS||[]).forEach(o=>absSet.add(r.key+o.sid))});
  const open=openEntries();const t=todayISO();const od=open.filter(e=>e.due&&e.due<t);
  const leaveStu=new Set(open.filter(e=>e.k==='LEAVE').map(e=>e.lk+e.s));
  const pend=R.filter(r=>(r.dsub&&groupsOf(r).some(g=>g<=D0&&!csubFor(r,g)))||(!r.dsub&&r.date<=D0&&r.date>=addDays(D0,-3)));
  const none=Object.keys(S.rounds).length===0;
  const title=sc.all?(sc.kind==='Director'?'Director’s overview':'School overview'):sc.kind+' · '+(sc.keys.size<=3?sc.label:sc.label);
  let h=`<div class="datebar"><h1>${esc(fdl(D0))}</h1><button class="btn sm" data-act="dateshift" data-v="-1" aria-label="Previous day">‹</button><input type="date" id="dbdate" value="${D0}" data-chg="date" aria-label="Pick date"><button class="btn sm" data-act="dateshift" data-v="1" aria-label="Next day">›</button><button class="btn sm" data-act="datetoday">Today</button></div><div class="muted tiny" style="margin-top:4px">${esc(title)}</div>`;
  h+=`<div class="calwrap">${calendarCard(R,D0)}${dayWorklist(R,D0)}</div>`;
  if(none)h+=`<div class="card empty" style="margin-top:14px"><h3>No rounds yet</h3><p>Create the first round with <b>+ New round</b>, or load sample data to see how every view works.</p><button class="btn gold" data-act="demo">Load sample data</button></div>`;
  h+=`<div class="kpis">
   <div class="kpi gold"><div class="v num">${dDone}/${dist.length}</div><div class="l">Sections distributed</div></div>
   <div class="kpi gold"><div class="v num">${cDone}/${coll.length}</div><div class="l">Sections collected</div></div>
   <div class="kpi no"><div class="v num">${miss}</div><div class="l">Not submitted</div></div>
   <div class="kpi ic"><div class="v num">${ic}</div><div class="l">Incomplete · returned</div></div>
   <div class="kpi abs"><div class="v num">${absSet.size}</div><div class="l">Students absent</div></div>
   <div class="kpi no"><div class="v num">${notrec}</div><div class="l">Not received · issue due</div></div>
   <div class="kpi lv"><div class="v num">${leaveStu.size}</div><div class="l">On leave with sets</div></div>
   <div class="kpi ${od.length?'no':'ok'}"><div class="v num">${open.length}</div><div class="l">Open defaulters${od.length?' · '+od.length+' overdue':''}</div></div></div>`;
  /* trend charts (inline SVG) */
  h+=dashCharts(R,D0);
  /* defaulters by section */
  const by={};open.forEach(e=>{const b=by[e.lk]=by[e.lk]||{n:0,od:0,old:'9',stu:new Set()};b.n++;b.stu.add(e.s);if(e.due&&e.due<t){b.od++}if(e.d0<b.old)b.old=e.d0});
  const rows=Object.entries(by).sort((a,b)=>b[1].od-a[1].od||b[1].n-a[1].n);
  h+=`<div class="sec-h"><h2>Defaulters by section</h2><small>${open.length} items · ${new Set(open.map(e=>e.lk+e.s)).size} students</small><span class="sp"></span><button class="btn sm" data-act="tab" data-v="fu">Open register</button></div>`;
  if(!rows.length)h+=`<div class="card muted">No pending items in ${sc.all?'any section':'your sections'}.</div>`;
  else h+=`<div class="card" style="padding:6px 13px"><div class="dsum" style="font-size:10.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;padding:6px 0"><span>Section</span><span>Items</span><span>Overdue</span><span class="hide-m"> </span></div>`+rows.slice(0,sc.all?12:30).map(([lk,b])=>`<div class="dsum" style="padding:7px 0;border-top:1px solid var(--line)"><span><b>${esc(SECMAP[lk].label)}</b> <span class="muted tiny">${esc((classTeacher(lk)||'').split(' ')[0])} · ${b.stu.size} student${b.stu.size>1?'s':''} · since ${fd(b.old)}</span></span><span class="pill p-na num">${b.n}</span><span class="pill ${b.od?'p-no':'p-ok'} num">${b.od}</span><span class="hide-m"><button class="btn sm" data-act="fu-sec" data-lk="${lk}">View</button></span></div>`).join('')+`</div>`;
  /* needs attention */
  h+=`<div class="sec-h"><h2>Pending actions</h2><small>Distributions and collections not yet submitted by ${esc(fd(D0))}</small></div>`;
  if(!pend.length)h+=`<div class="card muted">Nothing pending for this date.</div>`;
  else h+=`<div class="list">`+pend.sort((a,b)=>(a.collect<b.collect?-1:1)).map(r=>{const g=groupsOf(r).find(x=>!csubFor(r,x)&&x<=D0);const dueD=r.dsub?g:r.date;const late=D0>dueD;
    return `<div class="rc"><div><h3>${esc(secLabel(r.cls,r.sec))}</h3><div class="meta"><span class="pill ${late?'p-no':'p-ic'}">${r.dsub?'Collection pending':'Distribution pending'}${late?' · overdue '+diffDays(D0,dueD)+' d':''}</span><span>${r.dsub?'Due '+fd(g)+' · '+itemsFor(r,g).length+(itemsFor(r,g).length>1?' items':' item'):'Planned '+fd(r.date)}</span><span>${esc(classTeacher(r.key)||'')}</span></div></div><button class="btn sm pri" data-act="open" data-id="${r.id}" data-ph="${r.dsub?'coll':'dist'}" data-g="${r.dsub?g:''}">Open</button></div>`}).join('')+`</div>`;
  /* board */
  h+=`<div class="sec-h"><h2>Section board</h2><small>D = distribution on this date · C = collection due this date</small></div><div class="card" style="padding:6px 13px">`;
  D.classes.forEach(c=>{
    const secs=c.s.filter(s=>inScope(c.k+'-'+s));if(!secs.length)return;
    h+=`<div class="brow"><b>${esc(c.l)}</b><div class="bsecs">`+secs.map(sec=>{
      const key=c.k+'-'+sec;const d=dist.filter(r=>r.key===key),cc=coll.filter(r=>r.key===key);const ct=classTeacher(key);let badges='';
      d.forEach(r=>{const st=r.dsub?'done':(D0<todayISO()?'over':'pend');const s=stats(r);badges+=`<button class="mb ${st}" data-act="open" data-id="${r.id}" data-ph="dist">D ${r.dsub?'✓':'…'}${r.dsub&&s.notgiven?`<sup>${s.notgiven}</sup>`:''}</button>`});
      cc.forEach(r=>{const its=itemsFor(r,D0);const st=csubFor(r,D0)?'done':(D0<todayISO()?'over':'pend');const s=stats(r,its);const bad=s.miss+s.ic;badges+=`<button class="mb ${st}" data-act="open" data-id="${r.id}" data-ph="coll" data-g="${D0}">C ${csubFor(r,D0)?'✓':'…'}${csubFor(r,D0)&&bad?`<sup>${bad}</sup>`:''}</button>`});
      if(!badges)badges='<span class="mb">no round</span>';
      return `<div class="sp-box"><div class="n"><span>${esc(sec)}</span><span class="tiny" style="font-weight:600">${esc((ct||'').split(' ')[0])}</span></div><div class="mbs">${badges}</div></div>`}).join('')+`</div></div>`});
  h+=`</div>`;
  /* exceptions */
  const cat={MISS:[],IC:[],ABS:[],NOREC:[],LV:[],RT:[]};
  coll.filter(r=>csubFor(r,D0)).forEach(r=>{const ex=excs(r,'coll',itemsFor(r,D0));Object.keys(ex).forEach(k=>ex[k].forEach(o=>cat[k].push({r,o,by:csubFor(r,D0).by,ph:'coll',g:D0})))});
  dist.filter(r=>r.dsub).forEach(r=>{const ex=excs(r,'dist');Object.keys(ex).forEach(k=>ex[k].forEach(o=>cat[k].push({r,o,by:r.dsub.by,ph:'dist'})))});
  h+=`<div class="sec-h"><h2>What happened on this date</h2><small>Who did not submit, who was incomplete, who was absent</small></div>`;
  let any=false;
  ['MISS','IC','ABS','NOREC','LV','RT'].forEach(k=>{const rows=cat[k];if(!rows.length)return;any=true;
    const lab={MISS:'Not submitted',IC:'Incomplete · returned to child',ABS:'Absent',NOREC:'Not received · distribution',LV:'On leave with set',RT:'Retained by child'}[k];
    h+=`<details class="ex" ${rows.length<=12?'open':''}><summary><span class="pill p-${XK[k][1]}">${rows.length}</span>${lab}</summary><div class="in tw"><table class="t"><thead><tr><th>Section</th><th>Student</th><th>Items</th><th>Marked by</th></tr></thead><tbody>`+
      rows.map(x=>`<tr><td><a href="#" data-act="open" data-id="${x.r.id}" data-ph="${x.ph}" data-g="${x.g||''}">${esc(secLabel(x.r.cls,x.r.sec))}</a></td><td><b>${esc(x.o.name)}</b> <span class="muted tiny">#${x.o.roll}</span></td><td>${x.o.items.map(i=>itemChip(i.it,i.rs&&i.rs!=='Forgot'?i.rs:'')).join('')}</td><td class="tiny">${esc(x.by)}</td></tr>`).join('')+`</tbody></table></div></details>`});
  if(!any)h+=`<div class="card muted">No exceptions recorded for this date.</div>`;
  const agg={};coll.filter(r=>csubFor(r,D0)).forEach(r=>{const its=itemsFor(r,D0);its.forEach(it=>{const k=it.n+' '+TYPE[it.t];agg[k]=agg[k]||{n:k,m:0}});
    roster(r).forEach(([roll])=>{const sid=sidOf(r,roll);its.forEach(it=>{const c=cell(r,sid,it.id);if(c.d!=='G')return;if(c.c==='M'||c.c==='IC')agg[it.n+' '+TYPE[it.t]].m++})})});
  const top=Object.values(agg).filter(a=>a.m>0).sort((a,b)=>b.m-a.m).slice(0,8);
  if(top.length){const mx=top[0].m;h+=`<div class="sec-h"><h2>Most missing items</h2><small>Not submitted + incomplete</small></div><div class="card bars">`+top.map(a=>`<div class="bar"><span>${esc(a.n)}</span><div class="t"><span style="width:${Math.max(6,a.m/mx*100)}%"></span></div><b class="num">${a.m}</b></div>`).join('')+`</div>`}
  if(canSwitch())h+=`<div style="margin-top:20px"><button class="btn sm" data-act="admin">Admin tools</button></div>`;
  return h}

function reportView(r,ph,its,gd){

  its.forEach(it=>{let ok=0,tot=0;const lists={};

      if(ph==='dist'){tot++;if(c.d==='G')ok++;else{const k='✗ '+(c.dr||'Not received');(lists[k]=lists[k]||[]).push(name)}}
      else if(c.d==='G'){tot++;if(c.c==='R')ok++;else{const k=c.c==='M'?'✗ '+(c.cr||'Not submitted'):c.c==='IC'?'IC Incomplete':c.c==='LV'?'L On leave':'RT Retained';(lists[k]=lists[k]||[]).push(name)}}});

    const splitSec=R()<.6;

      const old=e.d0<=pSat+'z'&&e.d0===pSat;
      if(e.k==='RETURN'||e.k==='IC'){
        if(old){const x=R();if(x<.6){e.st='closed';e.how='Received';e.cb=R()<.7?T:A1;const base=at(e.due||pMon,15,10+Math.floor(R()*40));e.ca=Math.min(base+pick([-1,-1,0,1,2])*864e5,now-36e5)}
          else if(x<.85)e.h=[{at:rt(sat,12),by:T,act:'Remark',t:pick(remarks)},{at:rt(mon,8),by:A1,act:'Remark',t:pick(remarks)}].filter(h=>h.at<=now+864e5*2)}
        else if(e.d0===fri&&R()<.22){e.st='closed';e.how='Received';e.cb=T;e.ca=rt(sat,14)}
        else if(R()<.3)e.h=[{at:rt(sat,13),by:T,act:'Remark',t:pick(remarks)}]}
      else if(e.k==='ISSUE'&&R()<.6){e.st='closed';e.how='Issued late';e.cb=T;e.ca=rt(sat,12)}
      else if(e.k==='LEAVE'){e.lv=1;if(old&&R()<.45){e.st='closed';e.how='Received';e.cb=T;e.ca=at(addDays(e.due||mon,-1),11,20)}}});
    S.ledger[key]=led;
    await Promise.all([Store.set('dcr_ledger',key,led)].concat(Object.values(S.rounds).filter(r=>r.key===key&&r.demo).map(r=>Store.set('dcr_rounds',r.id,r))))}
  S.date=sat;S.calM=sat.slice(0,7);S.tab='dash';closeSheet();toast('Sample data loaded · '+fd(fri)+', '+fd(sat)+', '+fd(mon));render()}
async function clearDemo(){
  for(const r of Object.values(S.rounds).filter(r=>r.demo)){delete S.rounds[r.id];await Store.del('dcr_rounds',r.id)}
  for(const [k,l] of Object.entries(S.ledger)){let ch=false;Object.keys(l.entries||{}).forEach(ek=>{if(l.entries[ek].demo){delete l.entries[ek];ch=true}});if(ch)await Store.set('dcr_ledger',k,l)}
  closeSheet();toast('Sample data removed');render()}

/* ============ events ============ */
const ACT={
  close:()=>closeSheet(),
  tab:el=>{S.tab=el.dataset.v;window.scrollTo(0,0);render()},
  who:()=>{if(canSwitch())openWho(false)},
  setme:el=>{saveMe({n:el.dataset.n,r:el.dataset.r});closeSheet();S.tab='dash';render();toast('Viewing as '+el.dataset.n)},
  newround:()=>{if(!S.me){openWho(true);return}openNewRound()},
  open:(el,ev)=>{if(ev)ev.preventDefault();const r=S.rounds[el.dataset.id];if(!r)return;S.openRound=r.id;S.phase=el.dataset.ph||(r.dsub?'coll':'dist');S.grp=el.dataset.g||null;S.tab='round';window.scrollTo(0,0);render()},
  phase:el=>{S.phase=el.dataset.v;render()},grp:el=>{S.grp=el.dataset.v;render()},
  calpick:el=>{S.date=el.dataset.v;S.calM=S.date.slice(0,7);render()},calmon:el=>{const b=(S.calM||S.date.slice(0,7)).split('-').map(Number);const d=new Date(b[0],b[1]-1+Number(el.dataset.v),1);S.calM=d.getFullYear()+'-'+pad(d.getMonth()+1);render()},dateshift:el=>{S.date=addDays(S.date,Number(el.dataset.v));render()},datetoday:()=>{S.date=todayISO();S.calM=S.date.slice(0,7);render()},
  cell:el=>openCell(el.dataset.s,el.dataset.i),setcell:el=>applyCell(SH.sid,SH.iid,el.dataset.v),
  stusheet:el=>openStu(el.dataset.s),bulkstu:el=>applyBulkStu(SH.sid,el.dataset.v),
  colsheet:el=>openCol(el.dataset.i),bulkcol:el=>applyBulkCol(SH.iid,el.dataset.v),
  submit:()=>{if(!S.me){openWho(true);return}openSubmit()},dosubmit:()=>{closeSheet();const r=S.rounds[S.openRound];submitPhase(S.openRound,S.phase,S.phase==='coll'?curGroup(r):null)},
  copyrep:()=>{const r=S.rounds[S.openRound];const gd=curGroup(r);copyText(reportText(r,S.phase,S.phase==='coll'?itemsFor(r,gd):r.items,gd))},
  'fu-copy':el=>copyText(fuText(el.dataset.lk)),
  'fu-sec':el=>{const lk=el.dataset.lk;S.fu.k='all';S.fu.cls=SECMAP[lk].ck;S.fu.sec=SECMAP[lk].sec;S.fu.res=false;S.fu.od=false;S.fu.q='';S.tab='fu';window.scrollTo(0,0);render()},
  'fu-k':el=>{S.fu.k=el.dataset.v;render()},
  resolve:el=>{if(!S.me){openWho(true);return}openResolve(el.dataset.lk,null,[el.dataset.ek])},
  'resolve-stu':el=>{if(!S.me){openWho(true);return}closeSheet();openResolve(el.dataset.lk,el.dataset.s,null)},
  'res-save':()=>doResolve(),
  remark:el=>{if(!S.me){openWho(true);return}openRemark(el.dataset.lk,el.dataset.ek)},'rmk-save':()=>saveRemark(),
  stuhist:el=>openHist(el.dataset.key,el.dataset.roll),
  'nr-kind':el=>{NR.kind=el.dataset.v;NR.collect=autoCollect(NR);sheetBody(nrBody())},
  'nr-sec':el=>{const s=el.dataset.v;NR.secs.has(s)?NR.secs.delete(s):NR.secs.add(s);sheetBody(nrBody())},
  'nr-allsec':()=>{CLSMAP[NR.ck].s.forEach(s=>NR.secs.add(s));sheetBody(nrBody())},
  'nr-item':el=>{const cat=catFor(NR.ck).find(i=>i.id===el.dataset.id);if(NR.items.has(cat.id)){NR.items.delete(cat.id);delete NR.cd[cat.id]}else NR.items.set(cat.id,{id:cat.id,t:cat.t,n:cat.n});sheetBody(nrBody())},
  'nr-q':el=>{const v=el.dataset.v;const cat=catFor(NR.ck);
    if(v==='clear'){NR.items.clear();NR.cd={}}else if(v==='last'){lastItems()}else cat.filter(i=>v.includes(i.t)).forEach(i=>NR.items.set(i.id,{id:i.id,t:i.t,n:i.n}));sheetBody(nrBody())},
  'nr-addc':()=>{const n=(NR.cname||'').trim();if(!n)return;const t=NR.cn;const b=CLSMAP[NR.ck].b;const id=t+'_'+slug(n);
    if(!(S.config.custom||[]).find(c=>c.b===b&&c.t===t&&c.n===n))mutC(c=>{c.custom=c.custom||[];c.custom.push({b,t,n})});
    NR.items.set(id,{id,t,n});NR.cname='';sheetBody(nrBody())},
  'nr-create':()=>createRounds(),
  roundmenu:()=>openRoundMenu(),'rm-save':()=>saveRoundDates(),'rm-del':()=>confirmDelete(),
  'rm-del2':async()=>{const r=S.rounds[S.openRound];const id=r.id,key=r.key;delete S.rounds[id];await Store.del('dcr_rounds',id);mutL(key,l=>{Object.keys(l.entries).forEach(ek=>{if(l.entries[ek].r===id)delete l.entries[ek]})});closeSheet();S.tab='rounds';render();toast('Round deleted')},
  'lv-item':el=>{const id=el.dataset.id;LV.items.has(id)?LV.items.delete(id):LV.items.add(id);render()},
  'lv-all':()=>{catFor(LV.ck).filter(i=>i.t!=='A').forEach(i=>LV.items.add(i.id));render()},'lv-none':()=>{LV.items.clear();render()},
  'lv-save':()=>saveLeave(),
  admin:()=>openAdmin(),demo:()=>loadDemo(),cleardemo:()=>clearDemo(),scopes:()=>openScopes(),'sc-tog':el=>toggleScope(el.dataset.c)
};
async function saveLeave(){
  if(!S.me){openWho(true);return}
  const ro=D.stu[LV.ck+'-'+LV.sec]||[];const st=ro.find(x=>String(x[0])===String(LV.roll));
  if(!st){toast('Choose the student');return}if(!LV.items.size){toast('Choose the items taken');return}
  const till=LV.till||addDays(todayISO(),7);const cat=catFor(LV.ck);const items=[...LV.items].map(id=>{const i=cat.find(x=>x.id===id);return{id:i.id,t:i.t,n:i.n,cd:till}});
  const by=stamp();const key=LV.ck+'-'+LV.sec;
  const r={id:'leave-'+todayISO().replace(/-/g,'')+'-'+key.toLowerCase()+'-'+st[0]+'-'+uid(),cls:LV.ck,sec:LV.sec,key,kind:'leave',date:todayISO(),collect:till,items,by,cat:Date.now(),stu:[st],m:{},cs:{},dsub:{by:by.n,role:by.r,at:Date.now()},csub:null,log:[{at:Date.now(),by:by.n,act:'Leave kit recorded'}]};
  const sid=sidOf(r,st[0]);items.forEach(i=>setCell(r,sid,i.id,{c:'LV',ret:till,n:LV.note}));
  S.rounds[r.id]=r;await Store.set('dcr_rounds',r.id,r);
  const fresh=buildEntries(r,'coll',by);Object.values(fresh).forEach(e=>e.lv=1);mutL(key,l=>applyEntries(l,r,'coll',fresh));
  LV.items.clear();LV.roll='';LV.note='';toast('Leave kit recorded for '+st[1]);render()}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(el){const f=ACT[el.dataset.act];if(f){f(el,ev)}return}
  if(ev.target.id==='sheet'&&S.me)closeSheet()});
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg,v=el.type==='checkbox'?el.checked:el.value;
  switch(k){
    case 'date':if(v){S.date=v;S.calM=v.slice(0,7)}render();break;case 'actf':S.actf=v;render();break;
    case 'rf-cls':S.rf.cls=v;render();break;case 'rf-scope':S.rf.scope=v;render();break;
    case 'fu-cls':S.fu.cls=v;S.fu.sec='';render();break;case 'fu-sec':S.fu.sec=v;render();break;case 'fu-t':S.fu.t=v;render();break;case 'fu-od':S.fu.od=v;render();break;case 'fu-res':S.fu.res=v;render();break;
    case 'sa-cls':{const f=SECS.find(s=>s.ck===v&&inScope(s.k));if(f)S.sa.key=f.k;render();break}
    case 'sa-sec':S.sa.key=SECMAP[S.sa.key].ck+'-'+v;render();break;
    case 'lv-cls':LV.ck=v;LV.sec=CLSMAP[v].s[0];LV.roll='';LV.items.clear();render();break;case 'lv-sec':LV.sec=v;LV.roll='';render();break;case 'lv-roll':LV.roll=v;render();break;case 'lv-till':LV.till=v;break;
    case 'nr-date':NR.date=v;NR.collect=autoCollect(NR);sheetBody(nrBody());break;case 'nr-collect':NR.collect=v;sheetBody(nrBody());break;
    case 'nr-cls':NR.ck=v;NR.secs=new Set();NR.items.clear();NR.cd={};sheetBody(nrBody());break;case 'nr-cn':NR.cn=v;break;
    case 'nr-split':NR.split=v;if(!v)NR.cd={};sheetBody(nrBody());break;
    case 'nr-tdate':[...NR.items.values()].filter(i=>i.t===el.dataset.t).forEach(i=>NR.cd[i.id]=v);sheetBody(nrBody());break;
    case 'nr-idate':NR.cd[el.dataset.id]=v;sheetBody(nrBody());break;
    case 'sc-pick':openScopes(v);break;
    case 'res-all':if(v)document.querySelectorAll('.rsel').forEach(s=>{if([...s.options].some(o=>o.value===v))s.value=v});break;
  }});
document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-inp]');if(!el)return;const k=el.dataset.inp,v=el.value;
  if(k==='who-q')whoList(v);else if(k==='nr-cname')NR.cname=v;else if(k==='lv-note')LV.note=v;
  else if(k==='rf-q'){S.rf.q=v;const p=el.selectionStart;render();const n=$('#rfq');if(n){n.focus();n.setSelectionRange(p,p)}}
  else if(k==='fu-q'){S.fu.q=v;const p=el.selectionStart;render();const n=$('#fuq');if(n){n.focus();n.setSelectionRange(p,p)}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.me)closeSheet()});

/* ============ boot ============ */
async function boot(){
  render();
  await Store.init();render();
  let first=true;const timer=setTimeout(()=>{if(first&&Store.mode==='live'){S.syncMsg='Still connecting to shared data…';render()}},10000);
  const done=()=>{if(first){first=false;clearTimeout(timer);S.syncMsg='';S.loaded=true}};
  const cutoff=addDays(todayISO(),-21);
  Store.sub('dcr_rounds',docs=>{done();const next={};docs.forEach(d=>{if(d.data&&d.data.id)next[d.id]=d.data});
    Object.keys(S.rounds).forEach(id=>{if((Q.r[id]||inflight.has(id))&&S.rounds[id])next[id]=S.rounds[id]});S.rounds=next;render()},['date','>=',cutoff]);
  Store.sub('dcr_ledger',docs=>{done();const next={};docs.forEach(d=>{if(d.data)next[d.id]=d.data});Object.keys(S.ledger).forEach(k=>{if(Q.l[k])next[k]=S.ledger[k]});S.ledger=next;render()});
  Store.sub('dcr_config',docs=>{const c=docs.find(d=>d.id==='main');if(c&&c.data)S.config=Object.assign({custom:[]},c.data)});
}
boot();

['openStu','openResolve','openHist'].forEach(n=>{const f=window[n];if(typeof f==='function'){window[n]=function(){const r=f.apply(this,arguments);const sh=document.getElementById('sheet');if(sh&&sh.classList.contains('on'))sh.classList.add('drawer');return r}}});
