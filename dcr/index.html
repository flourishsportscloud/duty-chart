<!DOCTYPE html>
<html lang="en">
<head><script src="../fis/shell.js?v=3"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIS DCR Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: formal navy register with gold rule; light work surface; status colours carry meaning; tables collapse to cards on phones */
:root{
  --navy:#1B3156;--navy2:#243D69;--navy3:#14233F;--mag:#E91D69;--mag-d:#C9135A;--mag-t:#FDE8F0;
  --pur:#572686;--pur-t:#EFE8F6;--amb:#EFA11D;--amb-t:#FDF1DC;--sky:#2B9BD6;--sky-l:#68C0EA;--sky-t:#E4F4FC;
  --bg:#F3F5FA;--card:#FFFFFF;--ink:#18223A;--ink2:#667391;--line:#E2E7F0;--soft:#F6F8FC;
  --gold:#EFA11D;--goldbg:#FDF1DC;
  --ok:#1E9E6A;--okbg:#E3F5EC;--no:#D93A4B;--nobg:#FCE9EB;--ic:#9A6508;--icbg:#FDF1DC;
  --abs:#572686;--absbg:#EFE8F6;--lv:#1B77A8;--lvbg:#E4F4FC;--rt:#243D69;--rtbg:#E6EBF5;--na:#8C97B0;--nabg:#EDF0F6;
  --shadow:0 1px 2px rgba(20,35,63,.05),0 6px 20px rgba(20,35,63,.06);
  --display:'Plus Jakarta Sans',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html,body{overscroll-behavior:none}
button,.tl,.it,.chip,.mb,.btn,.snav,.seg,.datebar,.itiles,.tgrid{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.1px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--navy2)}
/* header */
.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--gold);box-shadow:0 2px 14px rgba(8,16,44,.3)}
.top .row{display:flex;align-items:center;gap:12px;padding:9px 16px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(145deg,#E3BE72,#A87725);color:#0F1E45;font:700 14px var(--display);display:grid;place-items:center;letter-spacing:.5px;flex:none}
.brand b{display:block;font:700 16px var(--display);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.78;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;display:block}
.sp{flex:1}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 10px 5px 6px;font-size:12.5px;min-width:0;max-width:46vw}
.me i{font-style:normal;width:26px;height:26px;border-radius:6px;background:var(--gold);color:#0F1E45;display:grid;place-items:center;font-weight:800;font-size:11.5px;flex:none}
.me span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{font-size:11px;display:flex;align-items:center;gap:6px;opacity:.92;white-space:nowrap}
.sync:before{content:"";width:8px;height:8px;border-radius:50%;background:#58D39A}
.sync.warn:before{background:#F2B94B}
.nav{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;color:#C4CFEE;padding:9px 13px;font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-3px}
.nav button.on{color:#fff;border-bottom-color:var(--gold)}
.nav .newbtn{margin-left:auto;background:var(--gold);color:#0F1E45;border-radius:7px;border:0;padding:6px 14px;margin-block:5px;font-weight:800;margin-bottom:5px}
.vbar{background:var(--card);border-bottom:1px solid var(--line)}
.vbar .in{max-width:1240px;margin:0 auto;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.vbar b{color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:14px 16px 96px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.sec-h{display:flex;align-items:center;gap:10px;margin:20px 0 9px;flex-wrap:wrap}
.sec-h h2{font-size:18px}
.sec-h small{color:var(--ink2)}
.sec-h:before{content:"";width:4px;height:20px;background:var(--gold);border-radius:2px}
.sec-h.nb:before{display:none}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 13px;font-weight:700;font-size:13.5px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0F1E45}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--ink2)}
.tiny{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-no{background:var(--nobg);color:var(--no)}.p-ic{background:var(--icbg);color:var(--ic)}
.p-abs{background:var(--absbg);color:var(--abs)}.p-lv{background:var(--lvbg);color:var(--lv)}.p-rt{background:var(--rtbg);color:var(--rt)}.p-na{background:var(--nabg);color:var(--na)}
.p-gold{background:var(--goldbg);color:var(--gold)}
.itm{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:1px 8px 1px 2px;font-size:12px;font-weight:600;background:var(--card);margin:2px 3px 2px 0}
.itm i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:800;color:#fff}
.t-B i,.ty.t-B{background:#2B5FD0}.t-N i,.ty.t-N{background:#C2562B}.t-A i,.ty.t-A{background:#0E8A6E}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-weight:500;color:var(--ink);font-size:14px;min-width:0}
/* date bar */
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar h1{font-size:23px;margin-right:6px}
.datebar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);border-top:3px solid var(--navy2)}
.kpi .v{font:700 25px var(--display);line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:600;line-height:1.25}
.kpi.no{border-top-color:var(--no)}.kpi.ic{border-top-color:var(--ic)}.kpi.ok{border-top-color:var(--ok)}.kpi.abs{border-top-color:var(--abs)}.kpi.lv{border-top-color:var(--lv)}.kpi.gold{border-top-color:var(--gold)}
/* board */
.brow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.brow:last-child{border:0}
.brow b{font-size:13px}
.bsecs{display:flex;gap:7px;flex-wrap:wrap}
.sp-box{border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--soft);min-width:122px}
.sp-box .n{font-size:11px;font-weight:800;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.mbs{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.mb{border:0;border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:800;background:var(--nabg);color:var(--na)}
.mb.done{background:var(--okbg);color:var(--ok)}.mb.pend{background:var(--icbg);color:var(--ic)}.mb.over{background:var(--nobg);color:var(--no)}
.mb sup{font-size:10px;margin-left:2px;color:var(--no)}
/* lists */
.list{display:grid;gap:9px}
.rc{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
.rc h3{font-size:16px}
.rc .meta{display:flex;gap:5px 10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);margin-top:4px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.bar div.t{height:9px;border-radius:5px;background:var(--nabg);overflow:hidden}
.bar div.t span{display:block;height:100%;background:linear-gradient(90deg,var(--no),#D98A4D)}
details.ex{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
details.ex summary{padding:9px 13px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none}
details.ex summary::-webkit-details-marker{display:none}
details.ex .in{padding:2px 13px 11px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
/* defaulter register */
.reg{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.reg .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 13px;background:var(--soft);border-bottom:1px solid var(--line)}
.reg .rh h3{font-size:15.5px}
.dh,.dr{display:grid;grid-template-columns:1.25fr 1.35fr 1.1fr 1.05fr 1.3fr auto;gap:10px;padding:9px 13px;align-items:start}
.dh{font-size:10.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line)}
.dr{border-bottom:1px solid var(--line);font-size:12.5px}
.dr:last-child{border:0}
.dr .lb{display:none}
.dr .acts{display:flex;gap:5px;flex-wrap:wrap}
.dr small{color:var(--ink2);display:block}
.rem{font-style:italic;color:var(--ink)}
/* round screen */
.rhead{display:grid;gap:9px}
.rhead h1{font-size:24px}
.phases{display:flex;gap:8px;flex-wrap:wrap}
.ph{flex:1;min-width:160px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;text-align:left}
.ph.on{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(27,50,112,.14)}
.ph b{display:block;font:700 15px var(--display)}
.ph small{color:var(--ink2);font-size:11.5px}
.banner{border-radius:8px;padding:9px 13px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--icbg);color:var(--ic)}.banner.info{background:var(--lvbg);color:var(--lv)}.banner.bad{background:var(--nobg);color:var(--no)}.banner.good{background:var(--okbg);color:var(--ok)}
.tblwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
table.grid2{border-collapse:separate;border-spacing:0;min-width:100%}
table.grid2 th,table.grid2 td{padding:0;border-bottom:1px solid var(--line);text-align:center}
table.grid2 thead th{position:sticky;top:0;background:var(--soft);z-index:3;vertical-align:bottom;padding:6px 4px;min-width:72px;max-width:94px;border-bottom:2px solid var(--line)}
table.grid2 thead th.stk{left:0;z-index:5;min-width:180px;text-align:left;padding-left:12px}
table.grid2 td.stk,table.grid2 th.stk{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;border-right:2px solid var(--line)}
table.grid2 td.stk{padding:5px 10px;cursor:pointer;min-width:180px}
table.grid2 tbody tr:nth-child(even) td.stk{background:var(--soft)}
.rl{display:inline-block;width:26px;color:var(--ink2);font-size:11px;font-weight:700}
.sn{font-weight:700;font-size:13.5px}
.sflag{display:block;margin-left:26px;margin-top:1px}
th .ty{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;color:#fff;font-size:10px;font-weight:800;margin-bottom:3px}
th .nm{display:block;font-size:11px;line-height:1.15;font-weight:700;cursor:pointer;word-break:break-word}
th .dd{display:block;font-size:10px;color:var(--ink2);font-weight:600;margin-top:2px}
.c{width:100%;min-width:60px;height:44px;border:0;background:transparent;font-weight:800;font-size:15px}
.c span{display:inline-grid;place-items:center;min-width:32px;height:28px;border-radius:7px;padding:0 6px}
.c.ok span{background:var(--okbg);color:var(--ok)}.c.no span{background:var(--nobg);color:var(--no)}.c.ic span{background:var(--icbg);color:var(--ic);font-size:12.5px}
.c.abs span{background:var(--absbg);color:var(--abs)}.c.lv span{background:var(--lvbg);color:var(--lv)}.c.rt span{background:var(--rtbg);color:var(--rt);font-size:12.5px}
.c.na span{background:var(--nabg);color:var(--na)}
.c:active span{transform:scale(.92)}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--gold);box-shadow:0 -6px 20px rgba(15,30,69,.12);z-index:25;padding:9px 16px}
.sticky-bar .in{max-width:1240px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(9,15,38,.58);z-index:60;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sh{background:var(--card);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 20px;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (min-width:720px){#sheet{align-items:center}.sh{border-radius:14px}}
.sh h2{font-size:20px;margin-bottom:4px}
.sh .x{float:right;border:0;background:var(--soft);width:32px;height:32px;border-radius:8px;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;margin:11px 0}
.opt{border:2px solid var(--line);background:var(--card);border-radius:9px;padding:10px 11px;text-align:left;font-weight:700;display:flex;gap:10px;align-items:center}
.opt .g{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:800;flex:none}
.opt.cur{border-color:var(--navy2);background:var(--soft)}
.opt small{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.chip{border:2px solid var(--line);border-radius:8px;background:var(--card);padding:5px 11px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.chip i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:800;color:#fff}
.chip.on{border-color:var(--navy2);background:var(--navy);color:#fff}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin:11px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:9px;font-weight:700;z-index:80;box-shadow:var(--shadow);max-width:90vw;border-left:4px solid var(--gold)}
.empty{text-align:center;padding:30px 16px;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.who-list{display:grid;gap:6px;max-height:42vh;overflow:auto;margin-top:10px}
.who-list button,.persona{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 11px;text-align:left;display:flex;justify-content:space-between;gap:10px;font-weight:700;align-items:center}
.who-list small,.persona small{color:var(--ink2);font-weight:500;display:block}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;margin:10px 0}
.persona{flex-direction:column;align-items:flex-start;gap:2px}
.persona .rl2{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);font-weight:800}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.erow .grow{flex:1;min-width:150px}
.fcard{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 13px;margin-bottom:9px}
.fcard .hd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:5px}
.dsum{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:13px}
@media (max-width:760px){
  .brand small{display:none}.brand b{font-size:14px}.sync{display:none}
  .dh{display:none}
  .dr{grid-template-columns:1fr 1fr;gap:6px 12px}
  .dr .lb{display:block;font-size:10px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
  .dr>div:first-child,.dr .acts{grid-column:1/-1}
  .brow{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 34px}
  table.grid2 thead th.stk,table.grid2 td.stk{min-width:140px}
  .datebar h1{font-size:19px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dsum{grid-template-columns:1fr auto auto}
  .dsum .hide-m{display:none}
}

/* ===== FIS design system overrides ===== */
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3{letter-spacing:0;color:var(--navy);font-weight:700}
h1{font-size:19px}
.sec-h h2,.card h2{font-size:14.5px}
.rc h3,.reg .rh h3{font-size:14.5px}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;position:fixed;top:0;bottom:0;left:0;z-index:40;background:linear-gradient(180deg,#1B3156,#14233F);color:#C3CDE4;display:flex;flex-direction:column;padding:18px 14px 22px;overflow:auto}
.side:after{content:"";position:fixed;left:0;bottom:0;width:236px;height:5px;background:linear-gradient(90deg,#E91D69 0 25%,#EFA11D 25% 50%,#68C0EA 50% 75%,#572686 75% 100%)}
.slogo{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.slogo .mark{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--navy);font:800 13px var(--body);display:grid;place-items:center;flex:none;letter-spacing:.3px}
.slogo b{display:block;color:#fff;font-size:14px;line-height:1.2}
.slogo small{display:block;font-size:10.5px;color:#7D8FB6;letter-spacing:.6px;margin-top:1px}
.slab{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#7D8FB6;font-weight:700;padding:14px 10px 6px}
.snav{display:flex;flex-direction:column;gap:3px}
.snav button{display:flex;align-items:center;gap:11px;background:none;border:0;border-left:3px solid transparent;color:#C3CDE4;font-weight:600;font-size:13.5px;padding:9px 10px;border-radius:10px;text-align:left;width:100%}
.snav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.snav button:hover{background:rgba(255,255,255,.07)}
.snav button.on{background:rgba(233,29,105,.16);color:#fff;border-left-color:var(--mag);border-radius:0 10px 10px 0}
.snav .bdg{margin-left:auto;background:var(--mag);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.sfoot{margin-top:auto;padding:14px 10px 10px;font-size:11.5px;color:#7D8FB6}
.col{margin-left:236px;min-width:0;flex:1}
