<div class="top"><a class="fis" href="../fis/">‹ FIS</a><div style="flex:1;min-width:0"><h1 id="ttl">Support Staff</h1><div class="sub" id="sub"></div></div><span class="live" id="live">connecting</span></div>

<script>
/* ---------- FIS sync layer: Google Sheet via Apps Script (replaces the artifact database) ---------- */
const API_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbzDf3rfh9w_8CfPygfsswDhjbNbHkfImwp171va5xEz9fWO6B_wHf53xr4pgvx7FFDhow/exec';
const FISDB=(()=>{
  const CK='fis_support_cache_v1',OK='fis_support_outbox_v1';
  let store={},rev=0,outbox=[],busy=false,state=API_URL?'connecting':'setup',blobWant={};
  const subs={},onState=[];
  const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
  const cp=o=>JSON.parse(JSON.stringify(o));
  (()=>{const c=lsGet(CK);if(c&&c.store){store=c.store;rev=c.rev||0}const o=lsGet(OK);if(Array.isArray(o))outbox=o})();
  function saveCache(){
    const light={};Object.keys(store).forEach(c=>{if(c==='photos'&&API_URL)return;light[c]={};Object.keys(store[c]).forEach(id=>{const v=store[c][id];light[c][id]=(c==='refs'&&API_URL&&v)?Object.assign({},v,{data:undefined}):v})});
    if(!lsSet(CK,{store:light,rev}))lsSet(CK,{store:{},rev:0});
  }
  const saveOut=()=>{if(!lsSet(OK,outbox)){/* photos too big for this device's storage: keep in memory only */}};
  const setState=s=>{state=s;onState.forEach(f=>f(s,outbox.length))};
  const docs=c=>Object.keys(store[c]||{}).map(id=>({id,data:store[c][id]}));
  const fire=c=>(subs[c]||[]).forEach(f=>{try{f(docs(c))}catch(e){}});
  const pendingKey=(c,id)=>outbox.some(o=>o.c===c&&o.id===id);
  async function call(fn,args){
    let r;try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}catch(e){const x=new Error('offline');x.net=1;throw x}
    let j;try{j=JSON.parse(await r.text())}catch(e){const x=new Error('offline');x.net=1;throw x}
    if(!j.ok){const x=new Error(j.err||'Server error');if(/Unknown request/i.test(x.message))x.setup=1;else if(/busy/i.test(x.message))x.net=1;throw x}
    return j.v;
  }
  async function flush(){
    while(outbox.length){
      const o=outbox[0];
      try{await call(o.op,o.op==='set'?[o.c,o.id,o.v]:[o.c,o.id])}
      catch(e){if(e.net||e.setup){setState(e.setup?'setup':'offline');return false}
        if(typeof toast==='function')toast('Not saved: '+e.message)}
      outbox.shift();saveOut();
    }
    return true;
  }
  async function fetchBlobs(){
    const ids=Object.keys(store.refs||{}).filter(id=>store.refs[id]&&store.refs[id]._blob&&!store.refs[id].data&&!blobWant[id]);
    if(!ids.length)return;
    ids.forEach(id=>blobWant[id]=1);
    for(let i=0;i<ids.length;i+=20){
      try{const m=await call('blobs',['refs',ids.slice(i,i+20)]);Object.keys(m).forEach(id=>{if(store.refs[id])store.refs[id].data=m[id]});fire('refs')}
      catch(e){ids.slice(i,i+20).forEach(id=>delete blobWant[id])}
    }
  }
  async function pull(){
    if(!API_URL||busy)return;busy=true;
    try{
      if(!(await flush()))return;
      const d=await call('sync',[rev]),ch={};
      d.docs.forEach(x=>{
        if(pendingKey(x.c,x.id))return;
        store[x.c]=store[x.c]||{};
        if(x.del)delete store[x.c][x.id];
        else{const old=store[x.c][x.id];if(x.c==='refs'&&old&&old.data&&old.t===x.j.t)x.j.data=old.data;store[x.c][x.id]=x.j}
        ch[x.c]=1;
      });
      if(d.rev<rev){store={};Object.keys(subs).forEach(c=>ch[c]=1);rev=0;busy=false;return pull()}
      rev=d.rev;saveCache();Object.keys(ch).forEach(fire);setState('live');fetchBlobs();
    }catch(e){setState(e.setup?'setup':'offline')}
    finally{busy=false}
  }
  function queue(o){
    outbox=outbox.filter(x=>!(x.c===o.c&&x.id===o.id));outbox.push(o);saveOut();
    if(!API_URL){saveCache();setState('setup');return Promise.resolve()}
    setState(state);pull();return Promise.resolve();
  }
  if(API_URL){setInterval(()=>{if(!document.hidden)pull()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});addEventListener('online',pull)}
  return{
    start(){Object.keys(subs).forEach(fire);if(API_URL)pull();else setState('setup')},
    state:()=>state,pending:()=>outbox.length,onState:f=>onState.push(f),
    collection(c){return{
      onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);return()=>{}},
      doc(id){return{
        set(v){store[c]=store[c]||{};store[c][id]=cp(v);if(!API_URL&&c!=='photos')saveCache();return queue({op:'set',c,id,v:cp(v)})},
        delete(){if(store[c])delete store[c][id];return queue({op:'del',c,id})},
        async get(){
          const loc=store[c]&&store[c][id];if(loc&&(c!=='photos'||loc.data))return{data:loc};
          const q=outbox.find(o=>o.c===c&&o.id===id&&o.op==='set');if(q)return{data:q.v};
          if(!API_URL)return{data:null};
          const v=await call('get',[c,id]);return{data:v};
        }
      }}
    }}
  };
})();
</script>

const DEFW=(()=>{const a=[{id:'w_admin',name:'Admin block',floor:'Admin',cub:0},{id:'w_front',name:'Front office',floor:'Admin',cub:0}];['LG','Ground','First','Second','Third'].forEach(f=>['Left','Right'].forEach(x=>a.push({id:'w_'+f.toLowerCase()+'_'+x[0].toLowerCase(),name:f+' floor – '+x+' side',floor:f,cub:0})));a.push({id:'w_staff',name:'Staff room washrooms',floor:'Staff',cub:0});return a})();
const WASHF=[
 {k:'clean',l:'Cleanliness',o:['Clean','!Needs cleaning']},
 {k:'smell',l:'Smell',o:['Fresh','!Bad smell']},
 {k:'leak',l:'Leakage (taps, flush, pipes)',o:['No leakage','!Leakage']},
 {k:'dry',l:'Floor dryness',o:['Floor dry','!Floor wet']},
 {k:'cubicles',l:'Cubicles and doors',o:['All OK','!Cubicle problem']},
 {k:'toil',l:'Toiletries (soap, tissue)',o:['Stocked','!Finished']},
 {k:'repair',l:'Repair or damage',o:['None','!Repair needed']}];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const mins=t=>{const a=String(t).split(':').map(Number);return a[0]*60+a[1]};
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const ago=m=>m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+'h '+(m%60)+'m ago';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pd=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const fmtD=k=>pd(k).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const shiftD=(k,n)=>{const d=pd(k);return dkey(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))};
const h12=x=>(x%12||12)+(x>=12?'p':'a');

let S={tab:'home',group:null,pid:null,date:today(),me:ls('fis_me')||'',role:ls('fis_role')||'',fg:'all',view:{}};
const sup=()=>{const r=S.role==='sup'?'Supervisor':S.role;return ROLES.indexOf(r)>0};

const D={log:{},visits:{},routine:{},wash:{}};
let washrooms=null;

/* ---------- data ---------- */
function rows(s){const a=Array.isArray(s)?s:(s&&s.docs)||[];return a.map(d=>{const v=typeof d.data==='function'?d.data():(d.data||d);return Object.assign({},v,{_id:d.id||(v&&v.id)})})}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
async function initDb(){
  db=FISDB;const lv=$('live');
  const paint=(s,n)=>{lv.textContent=s==='live'?'live':s==='offline'?'offline · '+n+' waiting':s==='setup'?'setting up':'connecting';lv.className='live'+(s==='live'?' on':'')};
  FISDB.onState(paint);
  ['log','visits','routine','wash'].forEach(c=>db.collection(c).onSnapshot(s=>{const m={};rows(s).forEach(r=>{m[r._id]=r});D[c]=m;rsoon()}));
  db.collection('cfg').onSnapshot(s=>{rows(s).forEach(r=>{if(r._id==='staff')staff=r.list||[];if(r._id==='washrooms')washrooms=r.list||null});rsoon()});
  FISDB.start();paint(FISDB.state(),FISDB.pending());
}
function put(coll,id,obj){
  if(!db){toast('Not connected – not saved');return Promise.resolve()}
  return db.collection(coll).doc(id).set(clone(obj)).catch(()=>toast('Could not save. Ask the Director for edit access.'));
}
function save(coll,id,obj){if(D[coll])D[coll][id]=obj;rsoon();return put(coll,id,obj)}
function del(coll,id){delete D[coll][id];rsoon();if(db)db.collection(coll).doc(id).delete().catch(()=>toast('Could not delete'))}
function saveStaff(list){staff=list;rsoon();return put('cfg','staff',{list})}
async function savePhoto(data){if(!data)return '';const id='p'+uid();pcache[id]=data;await put('photos',id,{data,t:new Date().toISOString(),by:S.me});return id}
async function getPhoto(id){
  if(pcache[id])return pcache[id];if(!db)return null;
  try{const d=await db.collection('photos').doc(id).get();const v=typeof d.data==='function'?d.data():d.data;if(v&&v.data){pcache[id]=v.data;return v.data}}catch(e){}
  return null;
}
function hydrate(){document.querySelectorAll('img[data-ph]').forEach(async im=>{const k=im.dataset.ph;if(im.dataset.k===k&&im.src)return;im.dataset.k=k;const d=await getPhoto(k);if(d)im.src=d})}
const img=(id,cls='')=>id?`<img class="th ${cls}" data-ph="${esc(id)}" alt="photo" data-zoom="1">`:'';
function pickPhoto(){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.style.display='none';document.body.appendChild(i);
    i.onchange=()=>{const f=i.files[0];i.remove();if(!f)return res(null);
      const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.55))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(f)};
    i.click();
  });
}

/* ---------- model ---------- */
const people=g=>staff.filter(p=>p.group===g);
const lid=(pid,g,d)=>d+'_'+g+'_'+pid;
const getLog=(p,d=S.date)=>D.log[lid(p.id,p.group,d)]||{id:lid(p.id,p.group,d),date:d,group:p.group,pid:p.id,name:p.name,att:'',in:'',out:'',inPh:'',outPh:'',obs:[],last:''};
function mutLog(p,d,fn){const l=clone(getLog(p,d));fn(l);l.last=new Date().toISOString();l.lastBy=S.me;save('log',l.id,l)}
function activeDate(p){ // night guard may still be on duty from yesterday
  if(p.group==='guard'&&S.date===today()){const t=getLog(p,S.date),y=getLog(p,shiftD(S.date,-1));if(!t.in&&y.in&&!y.out)return shiftD(S.date,-1)}
  return S.date;
}
const isVis=v=>['Visit','Check-in','Watering check-in','Cleaning check-point'].indexOf(v.type)>=0;
const vOf=(p,d=S.date)=>Object.values(D.visits).filter(v=>isVis(v)&&v.pid===p.id&&v.group===p.group&&v.date===d).sort((a,b)=>a.t.localeCompare(b.t));
const defTasks=p=>p.tasks||(p.areas||[]).map((n,i)=>({id:'d'+i,name:n,from:'',to:'',floor:''}));
function dayDoc(p,d){
  const id='ar_'+d+'_'+p.id,x=D.routine[id];
  if(x&&Array.isArray(x.items))return x;
  return{id,date:d,pid:p.id,group:p.group,items:defTasks(p).map(t=>({id:'t_'+t.id,tid:t.id,name:t.name,from:t.from||'',to:t.to||'',floor:t.floor||'',st:'',t:''}))};
}
const itemsOf=(p,d=S.date)=>dayDoc(p,d).items.slice().sort((a,b)=>(a.from||'99').localeCompare(b.from||'99'));
function mutItems(p,d,fn){const doc=clone(dayDoc(p,d));fn(doc.items);save('routine',doc.id,doc)}
const badOf=v=>{const g=FORMS[v.group]||[];let n=0;g.forEach(f=>{const val=v.f&&v.f[f.k];if(val&&f.o.indexOf('!'+val)>=0)n++});return n};
function sinceVisit(p){
  const l=getLog(p,activeDate(p));if(!l.in||l.out||S.date!==today())return null;
  const vs=vOf(p,today());const last=vs.length?vs[vs.length-1].t:l.in;
  return{min:Math.max(0,nowM()-mins(last)),none:!vs.length};
}
const overdue=p=>{const s=sinceVisit(p);return !!s&&s.min>G[p.group].every};

/* ---------- sheet (bottom form) ---------- */
function sheet(o){
  return new Promise(res=>{
    const L=$('layer'),st={};o.fields.forEach(f=>st[f.k]=f.val==null?'':f.val);
    let pic=null,pid=o.photoId||'',arm=false;const mp=(o.photoIds||[]).slice(),mn=[];
    const close=v=>{L.innerHTML='';res(v)};
    const draw=()=>{
      const fh=o.fields.map(f=>{
        if(f.type==='multi')return `<div class="fl">${esc(f.l)}</div><div class="chipset">${f.o.map(x=>`<button type="button" class="ch ${st[f.k].indexOf(x)>=0?'on':''}" data-mk="${f.k}" data-mv="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
        if(f.type==='chips')return `<div class="fl">${esc(f.l)}</div><div class="chipset">${f.o.map(x=>{const bad=x[0]==='!',lb=bad?x.slice(1):x;return `<button type="button" class="ch ${bad?'bad':''} ${st[f.k]===lb?'on':''}" data-k="${f.k}" data-v="${esc(lb)}">${esc(lb)}</button>`}).join('')}</div>`;
        if(f.type==='ta')return `<div class="fl">${esc(f.l)}</div><textarea id="f_${f.k}" rows="${f.rows||3}" data-i="${f.k}" placeholder="${esc(f.ph||'')}">${esc(st[f.k])}</textarea>`;
        return `<div class="fl">${esc(f.l)}</div><input id="f_${f.k}" data-i="${f.k}" type="${f.type||'text'}" value="${esc(st[f.k])}" placeholder="${esc(f.ph||'')}">`}).join('');
      let ph='';
      if(o.photo==='multi'||o.photo==='multireq'){
        ph=`<div class="fl">Photos ${o.photo==='multireq'?'(at least one)':'(optional)'} · ${mp.length+mn.length}</div><div class="row">${mp.map((x,i)=>`<div style="position:relative"><img class="th s" data-ph="${esc(x)}" alt="photo"><button type="button" class="btn bad sm" data-rmo="${i}" style="min-height:28px;padding:0 8px;position:absolute;top:-6px;right:-6px">✕</button></div>`).join('')}${mn.map((x,i)=>`<div style="position:relative"><img class="th s" src="${x}" alt="new photo"><button type="button" class="btn bad sm" data-rmn="${i}" style="min-height:28px;padding:0 8px;position:absolute;top:-6px;right:-6px">✕</button></div>`).join('')}</div><button type="button" class="btn sec" id="spm" style="margin-top:8px">📷 Add photo</button>`;
      }else if(o.photo&&o.photo!=='none'){
        ph=`<div class="fl">Photo ${o.photo==='req'?'(needed)':'(optional)'}</div><button type="button" class="btn sec" id="sp">📷 ${pic||pid?'Take again':'Take photo'}</button>${pic?`<img class="pv" src="${pic}" alt="new photo">`:pid?`<img class="pv" data-ph="${esc(pid)}" alt="photo">`:''}`;
      }
      L.innerHTML=`<div class="modal" id="bd"><div class="box"><h3>${esc(o.title)}</h3>${o.sub?`<div class="hint">${esc(o.sub)}</div>`:''}${fh}${ph}
        <div class="row" style="margin-top:18px"><button class="btn" id="sok" style="flex:1">${esc(o.ok||'Save')}</button><button class="btn sec" id="scn">Cancel</button></div>
        ${o.del?`<button class="btn bad" id="sdl" style="width:100%;margin-top:10px">${arm?'Tap again to delete':'🗑 Delete'}</button>`:''}</div></div>`;
      hydrate();
      L.querySelector('#bd').onclick=e=>{if(e.target.id==='bd')close(null)};
      L.querySelectorAll('.ch[data-k]').forEach(b=>b.onclick=()=>{st[b.dataset.k]=st[b.dataset.k]===b.dataset.v?'':b.dataset.v;draw()});
      L.querySelectorAll('.ch[data-mk]').forEach(b=>b.onclick=()=>{const a=st[b.dataset.mk],i=a.indexOf(b.dataset.mv);if(i>=0)a.splice(i,1);else a.push(b.dataset.mv);draw()});
      L.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>{st[e.dataset.i]=e.value});
      const sp=L.querySelector('#sp');if(sp)sp.onclick=async()=>{const d=await pickPhoto();if(d){pic=d;draw()}};
      const spm=L.querySelector('#spm');if(spm)spm.onclick=async()=>{const d=await pickPhoto();if(d){mn.push(d);draw()}};
      L.querySelectorAll('[data-rmo]').forEach(b=>b.onclick=()=>{mp.splice(+b.dataset.rmo,1);draw()});
      L.querySelectorAll('[data-rmn]').forEach(b=>b.onclick=()=>{mn.splice(+b.dataset.rmn,1);draw()});
      L.querySelector('#scn').onclick=()=>close(null);
      L.querySelector('#sok').onclick=()=>{const m=o.validate?o.validate(st,pic||mn[0],pid||mp[0]):'';if(m){toast(m);return}close({st,pic,pid,pics:mn,pids:mp,del:false})};
      const sd=L.querySelector('#sdl');if(sd)sd.onclick=()=>{if(!arm){arm=true;draw();return}close({del:true})};
    };
    draw();
  });
}
async function identify(){
  const r=await sheet({title:'Who are you?',sub:'Staff can log IN and OUT. Supervisors can log visits.',fields:[{k:'n',l:'Your name',type:'text',val:S.me},{k:'role',l:'Your role',type:'chips',o:ROLES,val:S.role==='sup'?'Supervisor':S.role}],photo:'none',ok:'Save',validate:s=>!s.n?'Type your name':!s.role?'Choose your role':''});
  if(!r)return false;S.me=r.st.n;S.role=r.st.role;ls('fis_me',S.me);ls('fis_role',S.role);return true;
}
async function needName(){if(S.me)return true;return identify()}
async function welcome(){if(S.me&&S.role)return;await identify();render()}

/* ---------- flows ---------- */
async function visitFlow(p,v,pre){
  if(!(await needName()))return;
  const g=p.group,items=itemsOf(p,v?v.date:S.date);
  const f=[];
  if(items.length)f.push({k:'area',l:'Which area?',type:'chips',o:items.map(i=>i.name),val:v?v.area:(pre||'')});
  FORMS[g].forEach(x=>f.push({k:x.k,l:x.l,type:'chips',o:x.o,val:v&&v.f?v.f[x.k]:''}));
  if(items.length)f.push({k:'astatus',l:'Area status now',type:'chips',o:['Not started','Working','Done'],val:''});
  f.push({k:'remark',l:'Remark – what did you see?',type:'ta',val:v?v.remark:'',ph:'Write in your own words'});
  if(v)f.push({k:'t',l:'Time',type:'time',val:v.t});
  const r=await sheet({title:(v?'Edit visit – ':'Visit – ')+p.name,sub:v?'':'Time is saved automatically: '+hhmm(),fields:f,photo:PHOTO[g],photoId:v&&v.ph,del:!!v,ok:'Save visit',
    validate:(s,pic,pid)=>{
      if(PHOTO[g]==='req'&&!pic&&!pid&&!Object.values(s).some(x=>/^Not found|^Not at post/.test(x)))return 'Take a photo (or choose "Not found")';
      return ''}});
  if(!r)return;
  if(r.del){del('visits',v.id);return}
  const ph=r.pic?await savePhoto(r.pic):r.pid;
  const fv={};FORMS[g].forEach(x=>{if(r.st[x.k])fv[x.k]=r.st[x.k]});
  const base=v?clone(v):{id:'v'+uid(),date:S.date,t:hhmm(),by:S.me,ts:new Date().toISOString(),group:g,pid:p.id,name:p.name,type:'Visit'};
  if(v&&r.st.t)base.t=r.st.t;
  save('visits',base.id,Object.assign(base,{f:fv,remark:r.st.remark||'',ph,area:r.st.area||''}));
  if(r.st.area&&r.st.astatus){
    const it=items.find(i=>i.name===r.st.area);
    if(it)mutItems(p,base.date,a=>{const x=a.find(y=>y.id===it.id);if(x){x.st=r.st.astatus==='Not started'?'':r.st.astatus==='Done'?'done':'working';x.t=base.t}});
  }
  toast('Visit saved '+base.t);
}
async function inFlow(p){
  const d=S.date;
  if(!(await needName()))return;
  let pic=null;
  if(p.group==='water'){const r=await sheet({title:'Log in – '+p.name,sub:'Time: '+hhmm(),fields:[],photo:'opt',ok:'Log in now'});if(!r)return;pic=r.pic}
  const ph=pic?await savePhoto(pic):'';
  mutLog(p,d,l=>{l.in=hhmm();l.att='P';l.out='';if(ph)l.inPh=ph});
}
async function outFlow(p){
  const d=activeDate(p);let pic=null;
  if(p.group==='water'){const r=await sheet({title:'Log out – '+p.name,sub:'Time: '+hhmm(),fields:[],photo:'opt',ok:'Log out now'});if(!r)return;pic=r.pic}
  const ph=pic?await savePhoto(pic):'';
  mutLog(p,d,l=>{l.out=hhmm();if(ph)l.outPh=ph});
  if(sup())await transferFlow(p,true);
}
async function timeFlow(p,which){
  const d=activeDate(p),l=getLog(p,d);
  const r=await sheet({title:(which==='in'?'Edit IN time':'Edit OUT time'),fields:[{k:'t',l:'Time',type:'time',val:l[which]||hhmm()}],photo:'none',del:!!l[which],ok:'Save'});
  if(!r)return;
  mutLog(p,d,x=>{x[which]=r.del?'':r.st.t;if(which==='in'&&!r.del)x.att='P'});
}
async function areaFlow(p,it){
  const r=await sheet({title:it?'Edit task':'Add task',sub:'Task name, time limit and floor.',
    fields:[{k:'name',l:'Task / area',type:'text',val:it?it.name:'',ph:'e.g. Print gate, Assembly area, Nursery A'},{k:'from',l:'From',type:'time',val:it?it.from:''},{k:'to',l:'To (time limit)',type:'time',val:it?it.to:''},{k:'floor',l:'Floor / block',type:'chips',o:FLOORS,val:it?it.floor:''},{k:'scope',l:'Apply to',type:'chips',o:['Today only','Every day'],val:'Today only'}],
    photo:'none',del:!!it,validate:s=>s.name?'':'Type the task name'});
  if(!r)return;
  const every=r.st.scope==='Every day',nm=r.st.name,fr=r.st.from,to=r.st.to,fl=r.st.floor;
  let tid=it&&it.tid;
  if(every){
    let ts=defTasks(p).slice();
    if(it&&r.del){if(tid)ts=ts.filter(x=>x.id!==tid)}
    else if(it&&tid)ts=ts.map(x=>x.id===tid?{id:tid,name:nm,from:fr,to:to,floor:fl}:x);
    else if(!r.del){tid='k'+uid();ts.push({id:tid,name:nm,from:fr,to:to,floor:fl})}
    saveStaff(staff.map(x=>x.id===p.id?Object.assign({},x,{tasks:ts}):x));
  }
  mutItems(p,S.date,a=>{
    if(it&&r.del){const i=a.findIndex(y=>y.id===it.id);if(i>=0)a.splice(i,1);return}
    if(it){const x=a.find(y=>y.id===it.id);if(x){x.name=nm;x.from=fr;x.to=to;x.floor=fl}}
    else a.push({id:every?'t_'+tid:'a'+uid(),tid:every?tid:'',name:nm,from:fr,to:to,floor:fl,st:'',t:''});
  });
  toast(every?'Saved for every day':'Saved for today');
}
async function moveFlow(p,it){
  const others=staff.filter(x=>x.id!==p.id).sort((a,b)=>(b.group===p.group)-(a.group===p.group));
  const lbl=x=>x.name+(x.group!==p.group?' ('+G[x.group].label+')':'');
  const r=await sheet({title:'Move "'+it.name+'"',sub:'Give this task to someone else, or change the time.',
    fields:[{k:'to',l:'Give to (leave empty to keep with '+p.name+')',type:'chips',o:others.map(lbl),val:''},{k:'from',l:'New start time',type:'time',val:it.from},{k:'end',l:'New end time',type:'time',val:it.to}],photo:'none',ok:'Move'});
  if(!r)return;
  const tp=r.st.to?others.find(x=>lbl(x)===r.st.to):p;
  if(tp.id===p.id){mutItems(p,S.date,a=>{const x=a.find(y=>y.id===it.id);if(x){x.from=r.st.from;x.to=r.st.end}});return}
  mutItems(p,S.date,a=>{const i=a.findIndex(y=>y.id===it.id);if(i>=0)a.splice(i,1)});
  mutItems(tp,S.date,a=>a.push({id:'a'+uid(),name:it.name,from:r.st.from,to:r.st.end,floor:it.floor||'',st:it.st,t:it.t,was:p.name}));
  toast('Moved to '+tp.name);
}
async function transferFlow(p,quiet){
  const open=itemsOf(p).filter(x=>x.st!=='done');
  if(!open.length){if(!quiet)toast('No pending tasks');return}
  const others=staff.filter(x=>x.id!==p.id).sort((a,b)=>(b.group===p.group)-(a.group===p.group));
  if(!others.length){if(!quiet)toast('No one else to give tasks to');return}
  const lbl=x=>x.name+(x.group!==p.group?' ('+G[x.group].label+')':'');
  const names=open.map((x,i)=>(x.from?x.from+' ':'')+x.name+' #'+(i+1));
  const r=await sheet({title:'Move tasks from '+p.name,sub:p.name+' has '+open.length+' pending task'+(open.length>1?'s':'')+'. They keep the same time.',
    fields:[{k:'sel',type:'multi',l:'Tasks to move',o:names,val:names.slice()},{k:'to',type:'chips',l:'Give to',o:others.map(lbl),val:''}],photo:'none',ok:'Move tasks',
    validate:s=>!s.sel.length?'Choose a task':!s.to?'Choose who gets them':''});
  if(!r)return;
  const tp=others.find(x=>lbl(x)===r.st.to),moving=open.filter((x,i)=>r.st.sel.indexOf(names[i])>=0);
  mutItems(p,S.date,a=>{moving.forEach(m=>{const i=a.findIndex(y=>y.id===m.id);if(i>=0)a.splice(i,1)})});
  mutItems(tp,S.date,a=>moving.forEach(m=>a.push({id:'a'+uid(),name:m.name,from:m.from,to:m.to,floor:m.floor||'',st:'',t:'',was:p.name})));
  toast(moving.length+' task'+(moving.length>1?'s':'')+' moved to '+tp.name);
}
async function staffFlow(p){
  const r=await sheet({title:p?'Edit '+p.name:'Add staff',
    fields:[{k:'name',l:'Name',type:'text',val:p?p.name:''},
     {k:'group',l:'Work',type:'chips',o:GK.map(k=>G[k].label),val:p?G[p.group].label:''},
     {k:'role',l:'Post / team / section (e.g. Main Gate, Back kitchen, Floor 1 team)',type:'text',val:p?p.role:''},
     {k:'shift',l:'Shift (guards)',type:'chips',o:['Day','Night'],val:p?p.shift:'Day'}],
    photo:'none',del:!!p,validate:s=>!s.name?'Type the name':!s.group?'Choose the work':''});
  if(!r)return;
  if(r.del){saveStaff(staff.filter(x=>x.id!==p.id));return}
  const g=GK.find(k=>G[k].label===r.st.group);

    h+=`<div class="chips">${[['roster','Roster'],['people','People'],['floor','By floor'],['time','By time'],['area','By area']].map(x=>`<button class="${v===x[0]?'on':''}" data-act="gview" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
    if(v==='floor'||v==='time'||v==='area')return h+rTaskViews(g,v);
    if(v==='roster')return h+rRoster(ps);
  }
  if(g==='guard'){
    ['Day','Night'].forEach(sh=>{const x=ps.filter(p=>(p.shift||'Day')===sh);if(x.length)h+=`<h2 style="margin:6px 0 8px;font-size:15px">${sh==='Day'?'☀️ Day guards':'🌙 Night guards'}</h2>`+x.map(pcard).join('')});
  }else h+=ps.map(pcard).join('');
  return h;
}
function rPerson(){
  const p=staff.find(x=>x.id===S.pid);if(!p){S.pid=null;return rGroup()}
  const g=p.group,d=activeDate(p),l=getLog(p,d),vs=vOf(p),st=statusOf(p),sv=sinceVisit(p);
  let h=dateBar();
  h+=`<div class="card"><div class="row sp"><div><b style="font-size:18px">${esc(p.name)}</b><div class="hint">${esc(p.role||G[g].label)}${g==='guard'?' · '+esc(p.shift||'Day')+' shift':''}</div></div><span class="tag ${st[1]}">${esc(st[0])}</span></div>
   ${d!==S.date?`<div class="tag warn" style="margin-top:8px">Still on duty since ${fmtD(d)}</div>`:''}
   <div class="kv" style="margin-top:12px"><button data-act="etime" data-v="in"><small>IN time (tap to edit)</small><b>${l.in||'–'}</b></button><button data-act="etime" data-v="out"><small>OUT time (tap to edit)</small><b>${l.out||'–'}</b></button></div>
   ${g==='water'&&(l.inPh||l.outPh)?`<div class="row">${l.inPh?`<div>${img(l.inPh,'s')}<small class="hint">In</small></div>`:''}${l.outPh?`<div>${img(l.outPh,'s')}<small class="hint">Out</small></div>`:''}</div>`:''}
   <div class="row">
    ${!l.in||l.out?`<button class="btn ok" data-act="in" style="flex:1">▶ Log IN</button>`:`<button class="btn warn" data-act="out" style="flex:1">⏹ Log OUT</button>`}
    ${l.att==='A'?`<button class="btn sec" data-act="att" data-v="P">Mark present</button>`:!l.in?`<button class="btn bad sm" data-act="att" data-v="A">Absent</button>`:''}
   </div></div>`;
  if(sup())h+=`<button class="btn big" data-act="visit" style="margin-bottom:12px">🧭 Log supervisor visit now</button>`;
  h+=`<div class="card"><h2>Visits ${S.date===today()?'today':'on this day'}: ${vs.length}</h2>${sv&&S.date===today()?`<div style="margin-bottom:8px">${overdue(p)?`<span class="tag bad">${sv.none?'No visit since log-in':'Last visit '+ago(sv.min)}</span>`:`<span class="tag ok">Last visit ${ago(sv.min)}</span>`} <span class="hint">Visit every ${G[g].every} min</span></div>`:''}${strip(p)||''}${G[g].tg?`<div class="hint" style="margin-top:6px">Visits per hour. Target ${G[g].tg}.</div>`:''}</div>`;
  h+=rAreas(p);
  h+=`<h2 style="margin:6px 0 8px;font-size:15px">Visit details</h2>`+(vs.slice().reverse().map(v=>vcard(v,false)).join('')||`<div class="card empty">No visit logged yet.</div>`);
  return h;
}
function rAreas(p){
  const it=itemsOf(p),vs=vOf(p),nowT=hhmm(),isT=S.date===today(),n=it.filter(x=>x.st==='done').length;
  let h=`<div class="card"><div class="row sp" style="margin-bottom:8px"><h2 style="margin:0">Tasks today (${n}/${it.length})</h2>${sup()?'<button class="btn sm" data-act="aadd">＋ Add task</button>':''}</div>`;
  if(sup()&&it.some(x=>x.st!=='done'))h+=`<button class="btn warn sm" data-act="transfer" style="margin-bottom:10px">↔ Move pending tasks to someone else</button>`;
  if(!it.length)h+=`<div class="empty">No tasks yet.${sup()?' Tap "Add task", choose Every day to repeat it daily.':''}</div>`;
  h+=it.map(x=>{
    const lv=vs.filter(v=>v.area===x.name).pop(),over=isT&&x.st!=='done'&&x.to&&x.to<nowT;
    return `<div class="ar ${x.st==='done'?'done':''}"><div class="h"><div><b>${esc(x.name)}</b><div class="hint">${x.from?esc(x.from)+(x.to?' – '+esc(x.to):''):'Any time'}${x.floor?' · '+esc(x.floor):''}${x.t?' · marked '+esc(x.t):''}</div><div class="tg">${over?'<span class="tag bad">Overdue</span>':''}${x.was?`<span class="tag warn">from ${esc(x.was)}</span>`:''}${lv?`<span class="tag ok">Visited ${esc(lv.t)}</span>`:''}</div></div>${lv&&lv.ph?img(lv.ph,'s'):''}</div>
     <div class="seg3"><button class="${!x.st?'on':''}" data-act="ast" data-v="${x.id}" data-s="">Pending</button><button class="${x.st==='working'?'on working':''}" data-act="ast" data-v="${x.id}" data-s="working">Working</button><button class="${x.st==='done'?'on done':''}" data-act="ast" data-v="${x.id}" data-s="done">Done</button></div>
     ${sup()?`<div class="row" style="margin-top:8px"><button class="btn sm" data-act="avisit" data-v="${x.id}">🧭 Visit</button><button class="btn sec sm" data-act="aedit" data-v="${x.id}">✎ Edit</button><button class="btn sec sm" data-act="amove" data-v="${x.id}">↔ Move</button></div>`:''}</div>`}).join('');
  return h+`</div>`;
}
function rLog(){
  let vs=Object.values(D.visits).filter(v=>isVis(v)&&v.date===S.date&&(S.fg==='all'||v.group===S.fg)).sort((a,b)=>b.t.localeCompare(a.t));
  let h=dateBar()+`<div class="chips">${[['all','All']].concat(GK.map(k=>[k,G[k].ico+' '+G[k].label])).map(x=>`<button class="${S.fg===x[0]?'on':''}" data-act="fg" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  h+=`<div class="row sp" style="margin-bottom:10px"><b>${vs.length} visit${vs.length===1?'':'s'}</b><button class="btn sec sm" data-act="copy">Copy table</button></div>`;
  return h+(vs.map(v=>vcard(v,true)).join('')||`<div class="card empty">No supervisor visits logged on this day.</div>`);
}
const wphs=(v,cls)=>(v.phs&&v.phs.length?v.phs:(v.ph?[v.ph]:[])).map(x=>img(x,cls)).join('');
const washBad=v=>WASHF.filter(x=>{const val=v.f&&v.f[x.k];return val&&x.o.indexOf('!'+val)>=0}).map(x=>v.f[x.k]);
function washTags(v){
  const t=[];if(v.who)t.push(`<span class="tag">Cleaned by ${esc(v.who)}</span>`);
  WASHF.forEach(x=>{const val=v.f&&v.f[x.k];if(val)t.push(`<span class="tag ${x.o.indexOf('!'+val)>=0?'bad':'ok'}">${esc(val)}</span>`)});
  if(v.cubno)t.push(`<span class="tag bad">Cubicle: ${esc(v.cubno)}</span>`);
  return t.join('');
}
function rWash(){
  const ws=WL(),isT=S.date===today(),ins=Object.values(D.wash).filter(x=>x.f&&x.date===S.date).sort((a,b)=>a.t.localeCompare(b.t));
  const lastOf=w=>ins.filter(x=>x.wid===w.id).pop();
  let ok=0,bad=0;ws.forEach(w=>{const l=lastOf(w);if(l){ok++;if(washBad(l).length)bad++}});
  let h=dateBar()+`<div class="tiles"><div class="tile"><b>${ok}/${ws.length}</b><small>checked</small></div><div class="tile"><b style="color:${bad?'var(--bad)':'var(--ok)'}">${bad}</b><small>with problems</small></div><div class="tile"><b>${ws.length-ok}</b><small>not checked</small></div></div>`;
  const fl={};ws.forEach(w=>{(fl[w.floor||'Other']=fl[w.floor||'Other']||[]).push(w)});
  Object.keys(fl).sort((a,b)=>{const i=WFL.indexOf(a),j=WFL.indexOf(b);return (i<0?99:i)-(j<0?99:j)}).forEach(f=>{
    h+=`<div class="fh">${esc(f)}${f==='Admin'||f==='Staff'||f==='Other'?'':' floor'}</div>`;
    fl[f].forEach(w=>{
      const l=lastOf(w),b=l?washBad(l):[];
      h+=`<div class="wr ${l?(b.length?'bad':'ok'):''}"><div class="h"><div><b>${esc(w.name)}</b><div class="hint">${w.cub?w.cub+' cubicles · ':''}${l?'Checked '+esc(l.t)+(isT?' · '+ago(Math.max(0,nowM()-mins(l.t))):'')+' · by '+esc(l.by||'?'):'Not checked yet'}</div></div></div>
       ${l?`<div class="row" style="margin-top:6px">${wphs(l,'s')}</div><div class="tg">${washTags(l)}</div>${l.remark?`<div class="hint">${esc(l.remark)}</div>`:''}`:''}
       <button class="btn sm" data-act="winspect" data-v="${w.id}" style="margin-top:8px">🧭 Inspect now</button></div>`;
    });
  });
  h+=`<div class="fh">All inspections ${isT?'today':'on this day'} (${ins.length})</div>`;
  h+=ins.slice().reverse().map(v=>`<button class="vis" data-act="editwash" data-v="${esc(v.id)}"><div class="h"><b>${esc(v.t)}</b><small>${esc(v.wname)} · by ${esc(v.by||'?')}</small></div><div class="tg">${washTags(v)}</div>${v.remark?`<p>${esc(v.remark)}</p>`:''}<div class="row">${wphs(v,'')}</div></button>`).join('')||`<div class="card empty">No washroom inspection logged yet.</div>`;
  return h;
}
function floorSummary(ps){
  const m={};let inN=0;
  ps.forEach(p=>{const l=getLog(p,activeDate(p));if(l.in&&!l.out)inN++;itemsOf(p).forEach(x=>{const k=x.floor||'No floor',o=m[k]=m[k]||{n:0,d:0,w:{}};o.n++;if(x.st==='done')o.d++;o.w[p.id]=1})});
  const keys=Object.keys(m).sort((a,b)=>{const i=FLOORS.indexOf(a),j=FLOORS.indexOf(b);return (i<0?99:i)-(j<0?99:j)});
  return `<div class="card"><div class="row sp"><b>${inN}/${ps.length} on duty</b><button class="btn sec sm" data-act="grp" data-v="eve">Open team</button></div>`+(keys.map(k=>{const o=m[k],pc=Math.round(o.d/o.n*100);return `<div style="margin-top:10px"><div class="row sp"><b>${esc(k)}</b><span class="hint">${Object.keys(o.w).length} staff · ${o.d}/${o.n} tasks done</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join('')||'<div class="empty">No tasks assigned yet.</div>')+`</div>`;
}
function rDash(){
  let h=dateBar();
  const by={};Object.values(D.visits).filter(v=>isVis(v)&&v.date===S.date).forEach(v=>{const k=v.by||'?';(by[k]=by[k]||[]).push(v.t)});
  const ks=Object.keys(by),ws=WL(),wi=Object.values(D.wash).filter(x=>x.f&&x.date===S.date);
  h+=`<div class="card"><h2>Supervisor visits</h2>${ks.length?`<table style="width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums"><tr style="text-align:left;color:var(--mute)"><th>Supervisor</th><th>Visits</th><th>First</th><th>Last</th></tr>${ks.map(k=>{const t=by[k].slice().sort();return `<tr><td style="padding:6px 0"><b>${esc(k)}</b></td><td>${t.length}</td><td>${t[0]}</td><td>${t[t.length-1]}</td></tr>`}).join('')}</table>`:'<div class="empty">No visits yet.</div>'}</div>`;
  const wch=ws.filter(w=>wi.some(i=>i.wid===w.id)).length,wbad=ws.filter(w=>{const l=wi.filter(i=>i.wid===w.id).pop();return l&&washBad(l).length}).length;
  h+=`<button class="gcard" style="--c:var(--gWater)" data-act="tab" data-v="wash"><div class="t"><i>🚻</i>Washrooms</div><div class="m"><span><b>${wch}/${ws.length}</b> checked</span><span><b style="color:${wbad?'var(--bad)':'var(--ok)'}">${wbad}</b> with problems</span></div></button>`;
  GK.forEach(g=>{const ps=people(g);if(!ps.length)return;h+=`<h2 style="margin:14px 0 8px;font-size:16px">${G[g].ico} ${G[g].label}</h2>`+(g==='helper'?rHelperChart(chartDoc()):g==='eve'?floorSummary(ps):ps.map(pcard).join(''))});
  return h;
}
function rSetup(){
  let h=`<div class="card"><h2>You</h2><div class="row sp"><div><b>${esc(S.me)||'Not set'}</b><div class="hint">${esc(S.role==='sup'?'Supervisor':S.role)||'No role'}</div></div><button class="btn sec sm" data-act="setname">Change</button></div></div>`;
  if(!sup())return h;
  h+=`<div class="row sp" style="margin-bottom:10px"><h2 style="font-size:16px">Staff</h2><div class="row"><button class="btn sec sm" data-act="sbulk">Add many</button><button class="btn sm" data-act="sadd">＋ Add staff</button></div></div>`;
  GK.forEach(g=>{const ps=people(g);if(!ps.length)return;h+=`<div class="card"><h2>${G[g].ico} ${G[g].label} (${ps.length})</h2>`+ps.map(p=>`<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line)"><div><b>${esc(p.name)}</b><div class="hint">${esc(p.role||'')}${g==='guard'?' · '+esc(p.shift||'Day'):''} · ${defTasks(p).length} daily tasks</div></div><button class="btn sec sm" data-act="sedit" data-v="${p.id}">Edit</button></div>`).join('')+`</div>`});
  h+=`<div class="row sp" style="margin:14px 0 10px"><h2 style="font-size:16px">Washrooms (${WL().length})</h2><button class="btn sm" data-act="wsadd">＋ Add</button></div><div class="card">`+WL().map(w=>`<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line)"><div><b>${esc(w.name)}</b><div class="hint">${esc(w.floor)}${w.cub?' · '+w.cub+' cubicles':''}</div></div><button class="btn sec sm" data-act="wsedit" data-v="${w.id}">Edit</button></div>`).join('')+`</div>`;
  h+=`<p class="hint">Open a person to give daily tasks with a time limit. Removing a person keeps all past records.</p>`;
  return h;
}
function render(){
  if(!sup()&&(S.tab==='log'||S.tab==='dash'||S.tab==='wash'))S.tab='home';
  const t=S.tab;let title='Support Staff',sub='Flourish International School',back=false,body='';
  if(t==='home'){
    if(S.pid){const p=staff.find(x=>x.id===S.pid);title=p?p.name:'';sub=p?G[p.group].label:'';back=true;body=rPerson()}
    else if(S.group){title=G[S.group].ico+' '+G[S.group].label;sub=S.group==='helper'?'Who is on which floor today':'Tap a person';back=true;body=rGroup()}
    else{title='Support Staff';sub='Today · '+fmtD(today());body=rHome()}
  }else if(t==='wash'){title='Washrooms';sub='Inspect, photo and remark';body=rWash()}
  else if(t==='log'){title='Visit log';sub='Every supervisor visit';body=rLog()}
  else if(t==='dash'){title='Dashboard';sub='Who was visited, and when';body=rDash()}
  else{title='Setup';sub='Staff and daily areas';body=rSetup()}
  $('ttl').textContent=title;$('sub').textContent=sub;
  const app=$('app');
  app.innerHTML=(back?`<button class="back" data-act="back" style="margin-bottom:10px">◀ Back</button>`:'')+body;
  $('nav').innerHTML=(sup()?[['home','🏠','Home'],['wash','🚻','Washrooms'],['log','📋','Visit log'],['dash','📊','Dashboard'],['setup','⚙️','Setup']]:[['home','🏠','Home'],['setup','👤','Me']]).map(x=>`<button class="${t===x[0]?'on':''}" data-act="tab" data-v="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('');
  hydrate();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const z=e.target.closest('[data-zoom]');
  if(z&&z.src){e.stopPropagation();e.preventDefault();const L=document.createElement('div');L.className='lb';L.innerHTML=`<img src="${z.src}" alt="photo">`;L.onclick=()=>L.remove();document.body.appendChild(L);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,p=staff.find(x=>x.id===S.pid);
  try{
  if(a==='tab'){S.tab=v;S.group=null;S.pid=null;render();window.scrollTo(0,0)}
  else if(a==='grp'){S.group=v;S.pid=null;render();window.scrollTo(0,0)}
  else if(a==='pick'){S.group=b.dataset.g;S.pid=v;S.tab='home';render();window.scrollTo(0,0)}
  else if(a==='back'){if(S.pid)S.pid=null;else S.group=null;render()}
  else if(a==='dshift'){S.date=shiftD(S.date,+v);render()}
  else if(a==='fg'){S.fg=v;render()}
  else if(a==='in'&&p)await inFlow(p);
  else if(a==='out'&&p)await outFlow(p);
  else if(a==='etime'&&p)await timeFlow(p,v);
  else if(a==='att'&&p){mutLog(p,S.date,l=>{l.att=v;if(v==='A'){l.in='';l.out=''}});if(v==='A'&&sup())await transferFlow(p,true)}
  else if(a==='gview'){S.view[S.group]=v;render()}
  else if(a==='hatt'||a==='hfl'||a==='hws'){const q=staff.find(x=>x.id===b.dataset.p);if(q){const doc=chartDoc(),r=hrow(doc,q);
    if(a==='hatt'){r.att=r.att===v?'':v;mutLog(q,S.date,l=>{l.att=r.att;if(r.att==='A'){l.in='';l.out=''}})}else if(a==='hfl')r.floor=v;else r.wash=v;saveChart(doc)}}
  else if(a==='hallp'){const doc=chartDoc();people('helper').forEach(q=>{const r=hrow(doc,q);if(r.att!=='A'){r.att='P'}});saveChart(doc);toast('All marked present (absent ones kept)')}
  else if(a==='hwb')await washByFlow(v);
  else if(a==='hcopy'){try{await navigator.clipboard.writeText(helperText(chartDoc()));toast('Copied – paste in WhatsApp')}catch(err){toast('Copy not allowed here')}}
  else if(a==='qin'){const q=staff.find(x=>x.id===v);if(q)await inFlow(q)}
  else if(a==='qout'){const q=staff.find(x=>x.id===v);if(q)await outFlow(q)}
  else if(a==='transfer'&&p)await transferFlow(p,false);
  else if(a==='avisit'){const q=b.dataset.p?staff.find(x=>x.id===b.dataset.p):p;if(q){const it=itemsOf(q).find(y=>y.id===v);await visitFlow(q,null,it?it.name:'')}}
  else if(a==='winspect'){const w=WL().find(x=>x.id===v);if(w)await washFlow(w,null)}
  else if(a==='editwash'){const x=D.wash[v];if(x)await washFlow(WL().find(w=>w.id===x.wid)||{id:x.wid,name:x.wname,floor:x.floor},x)}
  else if(a==='wsadd')await wsFlow(null);
  else if(a==='wsedit')await wsFlow(WL().find(x=>x.id===v));
  else if(a==='sbulk')await bulkFlow();
  else if(a==='visit'&&p)await visitFlow(p,null);
  else if(a==='editvisit'){const x=D.visits[v];const q=x&&staff.find(s=>s.id===x.pid);if(x&&q)await visitFlow(q,x)}
  else if(a==='aadd'&&p)await areaFlow(p,null);
  else if(a==='aedit'&&p)await areaFlow(p,itemsOf(p).find(x=>x.id===v));
  else if(a==='amove'&&p)await moveFlow(p,itemsOf(p).find(x=>x.id===v));
  else if(a==='ast'&&p)mutItems(p,S.date,arr=>{const x=arr.find(y=>y.id===v);if(x){x.st=b.dataset.s;x.t=b.dataset.s?hhmm():''}});
  else if(a==='sadd')await staffFlow(null);
  else if(a==='sedit')await staffFlow(staff.find(x=>x.id===v));
  else if(a==='setname'){await identify();render()}
  else if(a==='copy'){
    const vs=Object.values(D.visits).filter(x=>isVis(x)&&x.date===S.date&&(S.fg==='all'||x.group===S.fg)).sort((x,y)=>x.t.localeCompare(y.t));
    const txt=['Time\tWork\tPerson\tArea\tObservation\tRemark\tBy'].concat(vs.map(x=>[x.t,G[x.group]?G[x.group].label:'',x.name,x.area||'',Object.keys(x.f||{}).map(k=>x.f[k]).join(', '),x.remark||'',x.by||''].join('\t'))).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('Copied – paste in Excel or WhatsApp')}catch(err){toast('Copy not allowed here')}
  }
  }catch(err){toast('Something went wrong. Try again.')}
});
render();
initDb().then(welcome);
</script>
</body>
