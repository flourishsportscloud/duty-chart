<div class="top"><a class="fis" href="../fis/">‹ FIS</a><div style="flex:1;min-width:0"><h1 id="ttl">Support Staff</h1><div class="sub" id="sub"></div></div><span class="live" id="live">connecting</span></div>

<script>
/* ---------- FIS sync layer: Google Sheet via Apps Script ----------
   Saves go into an outbox (kept in IndexedDB, so they survive closing the app or losing network) and are sent one by one.
   Each save has its own id: a save is never dropped or replaced while it is being sent, and the server applies it only once.
   With the v2 server, saves send only the changed fields ("merge"), so two people editing the same record keep both changes. */
const API_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbzDf3rfh9w_8CfPygfsswDhjbNbHkfImwp171va5xEz9fWO6B_wHf53xr4pgvx7FFDhow/exec';
const FISDB=(()=>{
  const CK='fis_support_cache_v1',OK='fis_support_outbox_v1',KEEP_DAYS=62;
  let store={},rev=0,outbox=[],busy=false,state=API_URL?'connecting':'setup',blobWant={},sv=0,skew=0,inflight=null,failN=0,retryT=0,persistOK=true,cacheT=0,warned=false;
  const subs={},onState=[];
  const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  const lsSet=k=>v=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
  const cp=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const merge=(b,p)=>{if(!isObj(p))return cp(p);const o=isObj(b)?b:{};Object.keys(p).forEach(k=>{if(p[k]===null)delete o[k];else o[k]=merge(o[k],p[k])});return o};
  const oid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const warn=m=>{if(typeof toast==='function')toast(m)};
  const minDate=()=>{const d=new Date(Date.now()+skew-KEEP_DAYS*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  /* ---- outbox storage: IndexedDB first, localStorage as fallback ---- */
  let idb=null;
  const idbOpen=()=>new Promise(res=>{try{const r=indexedDB.open('fis_support',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
  const idbGet=k=>new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}});
  const idbPut=(k,v)=>new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=t.onabort=()=>res(false)}catch(e){res(false)}});
  async function saveOut(){
    let ok=await idbPut(OK,cp(outbox));
    if(ok){try{localStorage.removeItem(OK)}catch(e){}}else ok=lsSet(OK)(outbox);
    persistOK=ok;if(!ok&&!warned){warned=true;warn('Phone storage is full – unsent changes will be lost if you close the app. Stay online until it says Saved.')}
    paint();
  }
  /* ---- local cache (last 2 months only) ---- */
  function prune(){const cut=minDate();['log','visits','wash','routine','green','issues','tasks'].forEach(c=>{const m=store[c];if(!m)return;Object.keys(m).forEach(id=>{const v=m[id],d=v&&v.date;if(d&&d<cut&&!outbox.some(o=>o.c===c&&o.id===id))delete m[id]})})}
  function saveCache(){
    clearTimeout(cacheT);cacheT=0;prune();
    const light={};Object.keys(store).forEach(c=>{if(c==='photos'&&API_URL)return;light[c]={};Object.keys(store[c]).forEach(id=>{const v=store[c][id];light[c][id]=(c==='refs'&&API_URL&&v)?Object.assign({},v,{data:undefined}):v})});
    if(!lsSet(CK)({store:light,rev,sv})){lsSet(CK)({store:{},rev:0});if(!warned){warned=true;warn('Phone storage is full. The app still works but opens slower.')}}
  }
  const cacheSoon=()=>{if(!cacheT)cacheT=setTimeout(saveCache,800)};
  (()=>{const c=lsGet(CK);if(c&&c.store){store=c.store;rev=c.rev||0;sv=c.sv||0}const o=lsGet(OK);if(Array.isArray(o))outbox=o})();
  const ready=idbOpen().then(async d=>{idb=d;const o=await idbGet(OK);if(Array.isArray(o)){const have={};outbox.forEach(x=>{if(x.oid)have[x.oid]=1});o.forEach(x=>{if(!x.oid||!have[x.oid])outbox.push(x)})}outbox.forEach(x=>{if(!x.oid)x.oid=oid()});replayAll()});
  /* ---- status chip ---- */
  function paint(){const n=outbox.length;onState.forEach(f=>{try{f(state,n,{busy:!!inflight,failed:failN>0,persist:persistOK})}catch(e){}})}
  const setState=s=>{state=s;paint()};
  const docs=c=>Object.keys(store[c]||{}).map(id=>({id,data:store[c][id]}));
  const fire=c=>(subs[c]||[]).forEach(f=>{try{f(docs(c))}catch(e){}});
  /* put the user's unsent changes back on top of a record (used after a server copy arrives) */
  function replay(c,id){
    outbox.filter(o=>o.c===c&&o.id===id).forEach(o=>{store[c]=store[c]||{};
      if(o.op==='set')store[c][id]=cp(o.v);else if(o.op==='del')delete store[c][id];else store[c][id]=merge(cp(store[c][id])||{},o.p)});
  }
  function replayAll(){const seen={};outbox.forEach(o=>{const k=o.c+'/'+o.id;if(!seen[k]){seen[k]=1;replay(o.c,o.id)}});Object.keys(store).forEach(fire);paint()}
  async function call(fn,args){
    let r;try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}catch(e){const x=new Error('offline');x.net=1;throw x}
    let j;try{j=JSON.parse(await r.text())}catch(e){const x=new Error('offline');x.net=1;throw x}
    if(!j.ok){const x=new Error(j.err||'Server error');if(/Unknown request/i.test(x.message))x.old=1;else if(/busy/i.test(x.message))x.net=1;throw x}
    return j.v;
  }
  const by=()=>{try{return localStorage.getItem('fis_me')||''}catch(e){return ''}};
  async function flush(){
    while(outbox.length){
      const o=outbox[0];inflight=o.oid;paint();
      try{
        if(o.op==='merge'&&sv<2){ /* old server: send the whole record instead */
          const full=cp(store[o.c]&&store[o.c][o.id])||merge({},o.p);await call('set',[o.c,o.id,full,{oid:o.oid,by:by()}]);
        }else{
          const opt={oid:o.oid,by:by()};
          const r=await call(o.op,o.op==='set'?[o.c,o.id,o.v,opt]:o.op==='merge'?[o.c,o.id,o.p,opt]:[o.c,o.id,opt]);
          if(o.op==='merge'&&r&&r.j&&!outbox.some(x=>x!==o&&x.c===o.c&&x.id===o.id)){store[o.c]=store[o.c]||{};if(JSON.stringify(store[o.c][o.id])!==JSON.stringify(r.j)){store[o.c][o.id]=r.j;fire(o.c)}}
        }
        failN=0;
      }catch(e){
        inflight=null;
        if(e.net){failN++;setState('offline');retry();return false}
        if(e.old&&o.op==='merge'){sv=1;continue}            /* server not updated yet: retry as a whole-record save */
        if(e.old){setState('setup');return false}
        failN++;
        if(failN<4){setState('failed');retry();return false}
        warn('Could not save '+o.c+' ('+e.message+'). Please enter it again.');failN=0;   /* a record the server refuses even after retries */
      }
      inflight=null;
      const i=outbox.findIndex(x=>x.oid===o.oid);if(i>=0)outbox.splice(i,1);
      await saveOut();
    }
    return true;
  }
  function retry(){clearTimeout(retryT);const ms=Math.min(60000,2000*Math.pow(2,Math.min(5,failN-1)))+Math.random()*1000;retryT=setTimeout(pull,ms)}
  async function fetchBlobs(){
    const ids=Object.keys(store.refs||{}).filter(id=>store.refs[id]&&store.refs[id]._blob&&!store.refs[id].data&&!blobWant[id]);
    if(!ids.length)return;
    ids.forEach(id=>blobWant[id]=1);
    for(let i=0;i<ids.length;i+=20){
      try{const m=await call('blobs',['refs',ids.slice(i,i+20)]);Object.keys(m).forEach(id=>{if(store.refs[id])store.refs[id].data=m[id]});fire('refs')}
      catch(e){ids.slice(i,i+20).forEach(id=>delete blobWant[id])}
    }
  }
  async function pull(){
    if(!API_URL||busy)return;busy=true;
    try{
      await ready;
      if(outbox.length&&state!=='offline')setState('saving');
      if(!(await flush()))return;
      const d=await call('sync',[rev,rev?'':minDate()]),ch={};
      if(d.v)sv=d.v;if(d.t)skew=d.t-Date.now();
      d.docs.forEach(x=>{
        store[x.c]=store[x.c]||{};
        const before=JSON.stringify(store[x.c][x.id]);
        if(x.del)delete store[x.c][x.id];
        else{const old=store[x.c][x.id];if(x.c==='refs'&&old&&old.data&&old.t===x.j.t)x.j.data=old.data;store[x.c][x.id]=x.j}
        replay(x.c,x.id);
        if(JSON.stringify(store[x.c][x.id])!==before)ch[x.c]=1;      /* only redraw when something really changed */
      });
      if(d.rev<rev){store={};Object.keys(subs).forEach(c=>ch[c]=1);rev=0;busy=false;return pull()}
      rev=d.rev;cacheSoon();Object.keys(ch).forEach(fire);setState(outbox.length?'saving':'live');fetchBlobs();
    }catch(e){setState(e.old?'setup':'offline');if(e.net)retry()}
    finally{busy=false;if(outbox.length&&state==='live')setTimeout(pull,300)}
  }
  function queue(o){
    o.oid=oid();
    /* a newer whole-record save replaces older ones that are NOT being sent right now */
    if(o.op==='set'||o.op==='del')outbox=outbox.filter(x=>!(x.c===o.c&&x.id===o.id&&x.oid!==inflight));
    outbox.push(o);saveOut();
    if(!API_URL){cacheSoon();setState('setup');return Promise.resolve()}
    if(state==='live')setState('saving');pull();return Promise.resolve();
  }
  let pollT=0;
  function schedule(){clearTimeout(pollT);pollT=setTimeout(()=>{if(!document.hidden)pull();schedule()},20000+Math.random()*10000)}
  if(API_URL){schedule();document.addEventListener('visibilitychange',()=>{if(document.hidden)saveCache();else pull()});addEventListener('online',()=>{failN=0;pull()});addEventListener('pagehide',saveCache)}
  return{
    start(){Object.keys(subs).forEach(fire);if(API_URL)pull();else setState('setup')},
    state:()=>state,pending:()=>outbox.length,onState:f=>onState.push(f),
    now:()=>new Date(Date.now()+skew),
    call,
    collection(c){return{
      onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);return()=>{}},
      doc(id){return{
        set(v){store[c]=store[c]||{};store[c][id]=cp(v);return queue({op:'set',c,id,v:cp(v)})},
        merge(p){store[c]=store[c]||{};store[c][id]=merge(cp(store[c][id])||{},cp(p));return queue({op:'merge',c,id,p:cp(p)})},
        delete(){if(store[c])delete store[c][id];return queue({op:'del',c,id})},
        async get(){
          const loc=store[c]&&store[c][id];if(loc&&(c!=='photos'||loc.data))return{data:loc};
          const q=outbox.find(o=>o.c===c&&o.id===id&&o.op==='set');if(q)return{data:q.v};
          if(!API_URL)return{data:null};
          const v=await call('get',[c,id]);return{data:v};
        }
      }}
    }}
  };
})();
</script>

  FISDB.onState(paint);

function put(coll,id,obj){
  if(!db){toast('Not connected – not saved');return Promise.resolve()}

}
const isO=x=>x&&typeof x==='object'&&!Array.isArray(x);
/* the fields that changed between two copies of a record (null = removed) */
function diff(a,b){if(!isO(a)||!isO(b))return b;const p={};let n=0;
  Object.keys(b).forEach(k=>{const x=a[k],y=b[k];if(y===undefined||JSON.stringify(x)===JSON.stringify(y))return;p[k]=isO(x)&&isO(y)?diff(x,y):y;n++});
  Object.keys(a).forEach(k=>{if(!(k in b)||b[k]===undefined){p[k]=null;n++}});return n?p:null}
/* save only what changed, so two people editing the same record keep both changes */
function save(coll,id,obj){const old=D[coll]&&D[coll][id];if(D[coll])D[coll][id]=obj;rsoon(true);
  if(!db){toast('Not connected – not saved');return Promise.resolve()}
  const pt=old?diff(old,obj):clone(obj);if(!pt)return Promise.resolve();delete pt._id;if(!Object.keys(pt).length)return Promise.resolve();

/* ---------- sheet (bottom form) ---------- */
function sheet(o){
  return new Promise(res=>{
    const L=$('layer'),st={};o.fields.forEach(f=>st[f.k]=f.val==null?'':f.val);
    let pic=null,pid=o.photoId||'',arm=false,dirty=false;const mp=(o.photoIds||[]).slice(),mn=[];
    let done=false;const close=(v,fromBack)=>{if(done)return;done=true;L.innerHTML='';modalDone(fromBack);res(v)};
    modalOpen(()=>{if(dirty){toast('Tap Cancel to close without saving');return false}close(null,true);return true});
    const draw=()=>{
      const fh=o.fields.map(f=>{
        if(f.type==='multi')return `<div class="fl">${esc(f.l)}</div><div class="chipset">${f.o.map(x=>`<button type="button" class="ch ${st[f.k].indexOf(x)>=0?'on':''}" data-mk="${f.k}" data-mv="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;

        <div class="row" style="margin-top:18px"><button class="btn" id="sok" style="flex:1">${esc(o.ok||'Save')}</button><button class="btn sec" id="scn">Cancel</button></div>
        ${o.del?`<button class="btn bad" id="sdl" style="width:100%;margin-top:10px">${arm?'Tap again to delete':'🗑 Delete'}</button>`:''}</div></div>`;
      hydrate();
      /* a tap outside the form closes it only if nothing was changed – typed text and photos are never lost */
      L.querySelector('#bd').onclick=e=>{if(e.target.id!=='bd')return;if(dirty){toast('Tap Cancel to close without saving');return}close(null)};
      L.querySelectorAll('.ch[data-k]').forEach(b=>b.onclick=()=>{dirty=true;st[b.dataset.k]=st[b.dataset.k]===b.dataset.v?'':b.dataset.v;draw()});
      L.querySelectorAll('.ch[data-mk]').forEach(b=>b.onclick=()=>{dirty=true;const a=st[b.dataset.mk],i=a.indexOf(b.dataset.mv);if(i>=0)a.splice(i,1);else a.push(b.dataset.mv);draw()});
      L.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>{dirty=true;st[e.dataset.i]=e.value});

      const spm=L.querySelector('#spm');if(spm)spm.onclick=async()=>{const d=await pickPhoto();if(d){dirty=true;mn.push(d);draw()}};
      L.querySelectorAll('[data-rmo]').forEach(b=>b.onclick=()=>{dirty=true;mp.splice(+b.dataset.rmo,1);draw()});
      L.querySelectorAll('[data-rmn]').forEach(b=>b.onclick=()=>{dirty=true;mn.splice(+b.dataset.rmn,1);draw()});

      const sd=L.querySelector('#sdl');if(sd)sd.onclick=()=>{if(!arm){arm=true;draw();return}close({del:true})};
    };

/* ---------- Nannies: floor-wise allocation board (who is on which floor today; washroom after departure) ----------
   Record: routine/fh_<date> {type:'floorchart',rows:{<pid>:{att:'P'|'A'|'LT'|'',floor,wash}},washBy:{floor:name}}
   Check-in time comes from the same person's log (Staff Attendance and the group page write the same record). */
const HFL=['Third','Second','First','Ground','LG','Reception','Admin'];          /* top to bottom, like the building */
const FLL={LG:'Lower ground (LGF)',Ground:'Ground floor (GF)',First:'1st floor',Second:'2nd floor',Third:'3rd floor',Reception:'Reception',Admin:'Admin block'};
const FLS={LG:'LGF',Ground:'GF',First:'1st',Second:'2nd',Third:'3rd',Reception:'Reception',Admin:'Admin'};
const flName=f=>FLL[f]||f;
const flKey=l=>HFL.find(f=>FLL[f]===l||FLS[f]===l||f===l)||'';
/* the daily nannies from the Nanny Adjustment sheet, with their usual floor */
const NANNIES=[['Asha','LG'],['Santosh','Ground'],['Suman','Ground'],['Aarti (new)','Ground'],['Nirmla','Ground'],['Vimala','Ground'],['Kamla','First'],['Geeta','First'],['Chanda','Second'],['Shoba','Second'],['Sonu','Reception'],['Gaytri',''],['Laxmi','']];
const nkey=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z]+/g,' ').trim().split(' ')[0];
let HF=ls('fis_hfloor')||'';
function chartDoc(d=S.date){
  const id='fh_'+d,x=D.routine[id];
  if(x&&x.rows)return clone(x);
  const prev=Object.values(D.routine).filter(r=>r.type==='floorchart'&&r.date<d).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const doc={id,date:d,type:'floorchart',rows:{},washBy:{},fresh:true,from:prev?prev.date:''};
  people('helper').forEach(p=>{const o=prev&&prev.rows&&prev.rows[p.id];doc.rows[p.id]={att:'',floor:o&&o.floor?o.floor:(p.floor||''),wash:o?o.wash:'Yes'}});
  if(prev&&prev.washBy)doc.washBy=clone(prev.washBy);
  return doc;
}
function hrow(doc,p){return doc.rows[p.id]||(doc.rows[p.id]={att:'',floor:p.floor||'',wash:'Yes'})}
function saveChart(doc){delete doc.fresh;doc.last=new Date().toISOString();doc.lastBy=S.me;save('routine',doc.id,doc)}
/* status of one nanny today: in (with time), late, coming late, absent, or not in yet */
function hstat(doc,p){
  const r=hrow(doc,p),l=getLog(p,doc.date),c=acfg(),lim=c.ssIn||c.inBy;
  if(r.att==='A'||l.st==='A'||l.att==='A')return{k:'A',l:'Absent',cls:'bad'};
  if(l.in){const late=mins(l.in)>mins(lim);return{k:l.out?'out':'P',l:(l.out?'Left '+t12(l.out):'In '+t12(l.in)),late,cls:l.out?'':late?'warn':'ok',t:l.in}}
  if(r.att==='LT')return{k:'LT',l:'Coming late',cls:'warn'};
  if(r.att==='P')return{k:'P',l:'Present',cls:'ok'};
  return{k:'',l:doc.date<today()?'Not marked':'Not in yet',cls:''};
}
const hIsIn=s=>s.k==='P'||s.k==='out';
function floorPlan(doc){
  const ps=people('helper'),out={};
  HFL.forEach(f=>out[f]={on:[],wash:[]});
  ps.forEach(p=>{const r=hrow(doc,p),s=hstat(doc,p);if(s.k!=='A'&&r.floor&&out[r.floor]){out[r.floor].on.push(p);if(r.wash==='Yes')out[r.floor].wash.push(p.name)}});
  HFL.forEach(f=>{const o=out[f],b=doc.washBy&&doc.washBy[f];if(o.on.length&&!o.wash.length&&b)o.by=b});
  return out;
}
function helperText(doc){
  const fp=floorPlan(doc),ps=people('helper');
  const lines=['*Nanny Adjustment – '+fmtD(doc.date)+'*'];

  let h=`<div class="hint" style="margin:6px 0 10px"><b>${o.P}</b> present · <b>${o.late}</b> late · <b>${o.A}</b> absent · <b>${o.L}</b> leave${o.ins.length?' · in on average '+aavg(o.ins):''}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">`+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="hint" style="text-align:center;font-size:11px;font-weight:700">${x}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  ds.forEach(d=>{const r=arec(d,p),s=astat(d,p);let bg='var(--soft)',t='';
    if(d>td)bg='transparent';else if(r.st==='A'){bg='var(--badbg)';t='Absent'}else if(r.in){bg=s.late?'var(--warnbg)':'var(--okbg)';t=t12(r.in).replace(/ (a|p)m/,'$1')+(r.out?'<br>'+t12(r.out).replace(/ (a|p)m/,'$1'):'')}else if(s.k==='leave'){bg='var(--soft)';t='Leave'}
    h+=`<div style="border-radius:9px;min-height:50px;padding:4px;font-size:11px;background:${bg};border:1px solid var(--line);${d>td?'opacity:.35':''}"><b style="display:block;font-size:13px">${+d.slice(8)}</b>${t}</div>`});
  return h+`</div><p class="hint">Green = on time · amber = late · red = absent</p>`;
}

/* ---------- Cleaning complaints: anyone reports (photo, floor, place) · supervisor assigns · cleaner marks cleaned with a photo · reporter or supervisor checks and closes ----------
   Record: issues/<id> {type:'clean',date,t,iso,by,floor,place,kind,urgent,note,phs[],st:'open'|'assigned'|'done'|'closed',
     to,toBy,toIso,doneBy,who,doneIso,donePh[],doneNote,closeBy,closeIso,reopen,rem:{<id>:[by,iso,text]}} */
const CFL=['LG','Ground','First','Second','Third','Reception','Admin','Staff room','Outside'];
const cFL=f=>FLS[f]||f;
const CKINDS=['Washroom dirty','Floor wet / spill','Dust / not swept','Dustbin full','Bad smell','Vomit – urgent','Classroom messy','Corridor / stairs','Other'];
const CSTL={open:['Open – not assigned','bad'],assigned:['Assigned','warn'],done:['Cleaned – to check','ok'],closed:['Closed','']};
const CS={per:'today',st:'pend',fl:'',open:null};
const cAll=()=>Object.values(D.issues||{}).filter(x=>x&&x.type==='clean'&&x.iso);
const cMin=(a,b)=>Math.max(0,Math.round(((b?new Date(b):NOW())-new Date(a))/60000));
const cAge=x=>cMin(x.iso,x.st==='done'||x.st==='closed'?x.doneIso:null);
const cDur=m=>m<60?m+' min':m<1440?Math.floor(m/60)+'h '+(m%60?m%60+'m':''):Math.floor(m/1440)+' day'+(m>=2880?'s':'');
const cPend=x=>x.st==='open'||x.st==='assigned';
const cLim=x=>x.urgent?15:45;                 /* minutes before an open complaint turns red */
function cPeriod(x){const t=today(),d=x.date;return CS.per==='today'?d===t:CS.per==='week'?d>=shiftD(t,-6):CS.per==='month'?d>=shiftD(t,-29):true}
function cCan(x){return sup()||(S.me&&anorm(S.me)===anorm(x.by))}
function cSave(x){x.last=new Date().toISOString();x.lastBy=S.me;save('issues',x.id,x)}
function cRem(x,text){const o={};o['r'+uid()]=[S.me,new Date().toISOString(),text];x.rem=Object.assign({},x.rem||{},o)}
/* who works on that floor today: nannies first, then housekeeping on duty */
function cWho(f){
  const doc=chartDoc(today()),on=people('helper').filter(p=>hrow(doc,p).floor===f&&hstat(doc,p).k!=='A').map(p=>p.name);
  const hk=people('clean').concat(people('eve'),people('helper')).map(p=>p.name).filter(n=>on.indexOf(n)<0);
  return {on,all:on.concat(hk)};
}
function cHome(){
  const all=cAll(),p=all.filter(cPend),red=p.filter(x=>x.st==='open'&&cAge(x)>cLim(x)).length,td=all.filter(x=>x.date===today());
  const old=p.reduce((m,x)=>Math.max(m,cAge(x)),0);
  return `<div class="gcard" style="--c:var(--gClean)"><button data-act="tab" data-v="clean" style="all:unset;display:block;cursor:pointer;width:100%"><div class="t"><i>🧽</i>Cleaning complaints</div>
    <div class="m"><span><b style="color:${p.length?'var(--bad)':'var(--ok)'}">${p.length}</b> pending</span><span>Today <b>${td.length}</b></span><span>Cleaned today <b>${td.filter(x=>!cPend(x)).length}</b></span></div>
    ${p.length?`<div class="m"><span class="tag ${red?'bad':'warn'}">Oldest waiting ${cDur(old)}</span></div>`:''}</button>
    <button class="btn" data-act="c-new" style="width:100%;margin-top:10px">＋ Report a cleaning problem</button></div>`;
}
function rClean(){
  const all=cAll(),pend=all.filter(cPend),inP=all.filter(cPeriod);
  const done=inP.filter(x=>!cPend(x)),avg=done.length?Math.round(done.reduce((s,x)=>s+cAge(x),0)/done.length):0;
  const ontime=done.filter(x=>cAge(x)<=cLim(x)).length;
  let h=`<button class="btn" data-act="c-new" style="width:100%;font-size:17px;min-height:54px;margin-bottom:12px">＋ Report a cleaning problem</button>`;
  h+=`<div class="chips">${[['today','Today'],['week','7 days'],['month','1 month'],['all','All']].map(x=>`<button class="${CS.per===x[0]?'on':''}" data-act="c-per" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  const T=[['pend','Pending now',pend.length,pend.length?'var(--bad)':'var(--ok)'],['open','Not assigned',pend.filter(x=>x.st==='open').length,'var(--bad)'],['assigned','Being cleaned',pend.filter(x=>x.st==='assigned').length,'var(--warn)'],
    ['done','Cleaned – to check',all.filter(x=>x.st==='done').length,'var(--ok)'],['period','Reported',inP.length,'var(--acc)'],['closed','Closed',inP.filter(x=>x.st==='closed').length,'var(--mute)']];
  h+=`<div class="tiles">${T.map(t=>`<button class="tile" data-act="c-st" data-v="${t[0]}" style="${CS.st===t[0]?'outline:2px solid '+t[3]+';outline-offset:-1px':''}"><b style="color:${t[3]}">${t[2]}</b><small>${t[1]}</small></button>`).join('')}</div>`;
  if(done.length)h+=`<p class="hint" style="margin:-4px 0 10px">Average time to clean: <b>${cDur(avg)}</b> · cleaned in time: <b>${Math.round(ontime*100/done.length)}%</b> (urgent 15 min, others 45 min)</p>`;
  const fls=CFL.filter(f=>all.some(x=>x.floor===f));
  if(fls.length>1)h+=`<div class="chips">${[''].concat(fls).map(f=>`<button class="${CS.fl===f?'on':''}" data-act="c-fl" data-v="${f}">${f?esc(cFL(f)):'All floors'}</button>`).join('')}</div>`;
  let list=CS.st==='pend'?pend:CS.st==='open'||CS.st==='assigned'?pend.filter(x=>x.st===CS.st):CS.st==='done'?all.filter(x=>x.st==='done'):CS.st==='closed'?inP.filter(x=>x.st==='closed'):inP;
  if(CS.fl)list=list.filter(x=>x.floor===CS.fl);
  list=list.slice().sort((a,b)=>cPend(a)&&cPend(b)?(b.urgent?1:0)-(a.urgent?1:0)||a.iso.localeCompare(b.iso):b.iso.localeCompare(a.iso));
  const lbl=T.find(t=>t[0]===CS.st);h+=`<div class="row sp" style="margin:4px 0 8px"><b style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">${esc(lbl?lbl[1]:'')}${CS.fl?' · '+esc(cFL(CS.fl)):''}</b><small class="hint">${list.length}</small></div>`;
  if(!list.length)return h+`<div class="card empty">${CS.st==='pend'?'Nothing pending. 👍':'Nothing here.'}</div>`;
  return h+list.map(cRow).join('');
}
function cRow(x){
  const age=cAge(x),late=cPend(x)&&age>cLim(x),s=CSTL[x.st]||CSTL.open;
  return `<button class="cc ${late?'late':''}" data-act="c-open" data-v="${x.id}">${x.phs&&x.phs[0]?img(x.phs[0],'s'):'<span class="noimg">🧽</span>'}

/* ---------- Back button: every screen has its own history entry; phone Back steps back one screen, closes popups first ---------- */
let MODAL=[],IGN=0,depth=0,exitArm=0;
function modalOpen(onBack){MODAL.push(onBack);history.pushState({m:1},'',location.hash)}
function modalDone(fromBack){MODAL.pop();if(!fromBack&&history.state&&history.state.m){IGN++;history.back()}}
const routeOf=()=>S.tab==='home'?(S.pid?'#p-'+S.pid:S.group?'#g-'+S.group:'#home'):S.tab==='clean'&&CS.open?'#c-'+CS.open:'#'+S.tab;
function applyRoute(h){h=(h||'').replace(/^#/,'');S.group=null;S.pid=null;
  if(/^p-/.test(h)){const p=staff.find(x=>x.id===h.slice(2));S.tab='home';if(p){S.pid=p.id;S.group=p.group}else S.pid=h.slice(2)}
  else if(/^g-/.test(h)){S.tab='home';S.group=G[h.slice(2)]?h.slice(2):null}
  else if(/^c-/.test(h)){S.tab='clean';CS.open=h.slice(2)}
  else{S.tab=['att','wash','log','dash','setup','clean'].indexOf(h)>=0?h:'home';CS.open=null}}
function go(){const h=routeOf();if(location.hash!==h){history.pushState({r:1},'',h);depth++}render();window.scrollTo(0,0)}
function goBack(){if(depth>0){history.back();return}if(S.pid)S.pid=null;else if(S.group)S.group=null;else if(S.tab==='clean'&&CS.open)CS.open=null;else S.tab='home';history.replaceState({r:1},'',routeOf());render();window.scrollTo(0,0)}
addEventListener('popstate',e=>{
  if(IGN){IGN--;return}
  if(MODAL.length){const f=MODAL[MODAL.length-1];if(f()===false)history.pushState({m:1},'',location.hash);return}
  const st=e.state||{};
  if(st.base){
    if(S.tab==='clean'&&CS.open){CS.open=null;history.pushState({r:1},'','#clean');render();return}
    if(routeOf()!=='#home'){S.tab='home';S.group=null;S.pid=null;history.pushState({r:1},'','#home');render();return}
    if(Date.now()-exitArm<2500){history.back();return}
    exitArm=Date.now();toast('Press back again to exit');history.pushState({r:1},'','#home');return}
  if(depth>0)depth--;applyRoute(location.hash);render();
});

addEventListener('unhandledrejection',e=>{reportErr('promise: '+(e.reason&&e.reason.message||e.reason))});
/* ---------- warn before leaving with changes not yet sent ---------- */
addEventListener('beforeunload',e=>{if(FISDB.pending()){e.preventDefault();e.returnValue='Some changes are not saved yet.';return e.returnValue}});
/* ---------- start: reload opens the same screen ---------- */
const startHash=location.hash;
history.replaceState({base:1},'',startHash||'#home');history.pushState({r:1},'',startHash||'#home');
applyRoute(startHash);
try{render()}catch(e){reportErr('first render: '+e.message)}
initDb().then(()=>{if(startHash&&/^#p-/.test(startHash))applyRoute(startHash);render();return welcome()});
</script>
</body>
</html>
