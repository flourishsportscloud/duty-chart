<style>

.card{border-radius:10px;box-shadow:0 1px 2px #16202e0d}

th{letter-spacing:.04em}

 .stack tr:first-child{display:none}

 .stack td:nth-child(2){flex:1 1 60%}

 .gcards{grid-template-columns:1fr}
 .datebar b{min-width:0;font-size:14px}
 .modal .box{max-height:94vh}
}

<body>
<header>
  <h1><a href="../fis/" style="color:#fff;text-decoration:none;font-size:12px;font-weight:600;background:#ffffff22;padding:3px 8px;border-radius:6px;margin-right:8px;white-space:nowrap">‹ FIS</a>Support Services <span style="font-weight:400;opacity:.75">· Live</span> <small style="font-weight:400;opacity:.6;font-size:11px">v2.0 · 6 Nov</small></h1>
  <span class="clock" id="clock"></span>
  <span class="live off" id="live">connecting</span>
  <button class="me" id="me" data-act="whoami"></button>
</header>
<nav class="top" id="nav"></nav>
<main id="app"></main>
<div id="layer"></div>

<script>
/* ---------- FIS sync layer: Google Sheet via Apps Script (replaces the artifact database) ---------- */
const API_URL=new URLSearchParams(location.search).get('api')||'https://script.google.com/macros/s/AKfycbzDf3rfh9w_8CfPygfsswDhjbNbHkfImwp171va5xEz9fWO6B_wHf53xr4pgvx7FFDhow/exec';
const FISDB=(()=>{
  const CK='fis_support_cache_v1',OK='fis_support_outbox_v1';
  let store={},rev=0,outbox=[],busy=false,state=API_URL?'connecting':'setup',blobWant={};
  const subs={},onState=[];
  const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
  const cp=o=>JSON.parse(JSON.stringify(o));
  (()=>{const c=lsGet(CK);if(c&&c.store){store=c.store;rev=c.rev||0}const o=lsGet(OK);if(Array.isArray(o))outbox=o})();
  function saveCache(){
    const light={};Object.keys(store).forEach(c=>{if(c==='photos'&&API_URL)return;light[c]={};Object.keys(store[c]).forEach(id=>{const v=store[c][id];light[c][id]=(c==='refs'&&API_URL&&v)?Object.assign({},v,{data:undefined}):v})});
    if(!lsSet(CK,{store:light,rev}))lsSet(CK,{store:{},rev:0});
  }
  const saveOut=()=>{if(!lsSet(OK,outbox)){/* photos too big for this device's storage: keep in memory only */}};
  const setState=s=>{state=s;onState.forEach(f=>f(s,outbox.length))};
  const docs=c=>Object.keys(store[c]||{}).map(id=>({id,data:store[c][id]}));
  const fire=c=>(subs[c]||[]).forEach(f=>{try{f(docs(c))}catch(e){}});
  const pendingKey=(c,id)=>outbox.some(o=>o.c===c&&o.id===id);
  async function call(fn,args){
    let r;try{r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}catch(e){const x=new Error('offline');x.net=1;throw x}
    let j;try{j=JSON.parse(await r.text())}catch(e){const x=new Error('offline');x.net=1;throw x}
    if(!j.ok){const x=new Error(j.err||'Server error');if(/Unknown request/i.test(x.message))x.setup=1;else if(/busy/i.test(x.message))x.net=1;throw x}
    return j.v;
  }
  async function flush(){
    while(outbox.length){
      const o=outbox[0];
      try{await call(o.op,o.op==='set'?[o.c,o.id,o.v]:[o.c,o.id])}
      catch(e){if(e.net||e.setup){setState(e.setup?'setup':'offline');return false}
        if(typeof toast==='function')toast('Not saved: '+e.message)}
      outbox.shift();saveOut();
    }
    return true;
  }
  async function fetchBlobs(){
    const ids=Object.keys(store.refs||{}).filter(id=>store.refs[id]&&store.refs[id]._blob&&!store.refs[id].data&&!blobWant[id]);
    if(!ids.length)return;
    ids.forEach(id=>blobWant[id]=1);
    for(let i=0;i<ids.length;i+=20){
      try{const m=await call('blobs',['refs',ids.slice(i,i+20)]);Object.keys(m).forEach(id=>{if(store.refs[id])store.refs[id].data=m[id]});fire('refs')}
      catch(e){ids.slice(i,i+20).forEach(id=>delete blobWant[id])}
    }
  }
  async function pull(){
    if(!API_URL||busy)return;busy=true;
    try{
      if(!(await flush()))return;
      const d=await call('sync',[rev]),ch={};
      d.docs.forEach(x=>{
        if(pendingKey(x.c,x.id))return;
        store[x.c]=store[x.c]||{};
        if(x.del)delete store[x.c][x.id];
        else{const old=store[x.c][x.id];if(x.c==='refs'&&old&&old.data&&old.t===x.j.t)x.j.data=old.data;store[x.c][x.id]=x.j}
        ch[x.c]=1;
      });
      if(d.rev<rev){store={};Object.keys(subs).forEach(c=>ch[c]=1);rev=0;busy=false;return pull()}
      rev=d.rev;saveCache();Object.keys(ch).forEach(fire);setState('live');fetchBlobs();
    }catch(e){setState(e.setup?'setup':'offline')}
    finally{busy=false}
  }
  function queue(o){
    outbox=outbox.filter(x=>!(x.c===o.c&&x.id===o.id));outbox.push(o);saveOut();
    if(!API_URL){saveCache();setState('setup');return Promise.resolve()}
    setState(state);pull();return Promise.resolve();
  }
  if(API_URL){setInterval(()=>{if(!document.hidden)pull()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});addEventListener('online',pull)}
  return{
    start(){Object.keys(subs).forEach(fire);if(API_URL)pull();else setState('setup')},
    state:()=>state,pending:()=>outbox.length,onState:f=>onState.push(f),
    collection(c){return{
      onSnapshot(cb){(subs[c]=subs[c]||[]).push(cb);return()=>{}},
      doc(id){return{
        set(v){store[c]=store[c]||{};store[c][id]=cp(v);if(!API_URL&&c!=='photos')saveCache();return queue({op:'set',c,id,v:cp(v)})},
        delete(){if(store[c])delete store[c][id];return queue({op:'del',c,id})},
        async get(){
          const loc=store[c]&&store[c][id];if(loc&&(c!=='photos'||loc.data))return{data:loc};
          const q=outbox.find(o=>o.c===c&&o.id===id&&o.op==='set');if(q)return{data:q.v};
          if(!API_URL)return{data:null};
          const v=await call('get',[c,id]);return{data:v};
        }
      }}
    }}
  };
})();
</script>
<script>
const G={
 water:{label:'Water Service',sn:'Watermen',ico:'',c:'#0b6e99',al:'Water points'},
 garden:{label:'Horticulture',sn:'Gardeners',ico:'',c:'#2f7d32',al:'Greenery areas'},
 clean:{label:'Housekeeping',sn:'Cleaners',ico:'',c:'#a35a00',al:'Cleaning areas'},
 guard:{label:'Security',sn:'Guards',ico:'',c:'#3b3f9e',al:'Gates'}
};
const GK=Object.keys(G);
const mk=(g,arr)=>arr.map((n,i)=>({id:g+(i+1),name:n}));
const DEF={
 water:mk('water',['Main Gate','Reception','Ground Floor','First Floor','Second Floor','Staff Room','Library','Science Lab','Playground','Canteen']),
 garden:mk('garden',['Outer Railing','Outer Plants','Main Gate Beds','Front Lawn','Playground Edge','Rear Garden','Corridor Pots','Terrace Plants']),
 clean:mk('clean',['Front Area','Reception & Lobby','Ground Floor Classes','First Floor Classes','Second Floor Classes','Third Floor Classes','Staircases','Staff Room','Library & Labs','Office Area']),
 guard:mk('guard',['Gate 1','Gate 2','Gate 3'])
};
const DEF_WASH=mk('wash',['Ground Floor – Left','Ground Floor – Right','First Floor – Left','First Floor – Right','Second Floor – Left','Second Floor – Right','Third Floor – Left','Third Floor – Right','Office Area']);
const DEF_CHK={
 water:['Present at the area','Water flowing / pressure OK','Area fully watered'],
 garden:['Present at work','Working on allotted task','Tools & safety','Work area tidy'],
 clean:['Present at the area','Cleaning quality','Materials / equipment','Uniform'],
 guard:['At assigned post','Alert – not sleeping','Not using mobile phone','Uniform, cap & ID card','Behaviour with visitors & parents','Language – polite','Gate / entry controlled','Visitors stopped, asked & noted'],
 groom:['Room clean & tidy','Visitor register updated','Vehicle register updated','Torch, lathi & first-aid box in place','Phone / walkie-talkie working','Washroom clean, water available'],
 wash:['Smell','Lights','Floor cleaning','Urinals','WC cabins & doors / flush','Washbasins & taps','Water supply','Supplies (soap / tissue)','Dustbins']
};
const DEF_SET={start:{water:'07:00',garden:'07:00',clean:'07:00',guard:'08:00'},every:{water:60,garden:120,clean:60,guard:120,groom:240},end:{water:'15:00',garden:'15:00',clean:'15:00',guard:''}};
const STATUS=['On duty','Working','Break','Done'];
const SUBS={
 water:[['people','Watermen'],['hist','Date-wise History']],
 garden:[['people','Gardeners & Tasks'],['green','Greenery Health'],['damage','Damaged Plants'],['develop','Areas to Develop'],['tasks','Task Bank']],
 clean:[['people','Daily Tasks'],['timeline','Timeline'],['plan','Standing Schedule'],['week','Weekly Summary'],['routine','Machine Cleaning'],['wash','Washrooms'],['chart','Time Chart']],
 guard:[['people','Guards']]
};

const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const mins=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const ago=t=>{const x=Math.max(0,nowM()-mins(t));return x<60?x+' min ago':Math.floor(x/60)+'h '+(x%60)+'m ago'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtD=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})};
const fmtS=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const shiftD=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const tag=(c,t)=>`<span class="tag ${c}">${t}</span>`;

let S={tab:'today',group:'water',sub:{},date:today(),pid:null,rep:'day',month:today().slice(0,7),rpid:'',role:ls('fis_role')||'staff',me:ls('fis_me')||'',vg:'all',chart:'person',iss:'open'};
let staff=[],areas=clone(DEF),CFG={wash:clone(DEF_WASH),checks:clone(DEF_CHK),set:clone(DEF_SET),routines:[],cplan:[],groom:mk('groom',['Guard Room']),groster:[]};let synced=false;
const COLL=['log','visits','wash','green','issues','tasks','refs','routine'];
const D={};COLL.forEach(c=>D[c]={});
let db=null,lastCsv='';
const pcache={};

/* ---------- data layer ---------- */
function rows(s){const a=Array.isArray(s)?s:(s&&s.docs)||[];return a.map(d=>{const v=typeof d.data==='function'?d.data():(d.data||d);return Object.assign({},v,{_id:d.id||(v&&v.id)})})}
let rt=0;const rsoon=()=>{clearTimeout(rt);rt=setTimeout(render,60)};
async function initDb(){
  db=FISDB;
  const lv=document.getElementById('live');
  const show=(st,n)=>{const w=n?' · '+n+' waiting':'';
    if(st==='live'){lv.textContent=n?'saving'+w:'live';lv.className='live on'}
    else if(st==='setup'){lv.textContent='setting up · saved on this device'+w;lv.className='live off'}
    else if(st==='offline'){lv.textContent='offline · will sync'+w;lv.className='live off'}
    else{lv.textContent='connecting';lv.className='live off'}};
  db.onState((st,n)=>{if((st==='live'||st==='setup')&&!synced){synced=true;rsoon()}show(st,n)});if(db.state()==='setup')synced=true;show(db.state(),db.pending());
  COLL.forEach(c=>db.collection(c).onSnapshot(s=>{const m={};rows(s).forEach(r=>{m[r._id]=r});D[c]=m;rsoon()}));
  db.collection('cfg').onSnapshot(s=>{rows(s).forEach(r=>{
    if(r._id==='staff')staff=r.list||[];
    if(r._id==='areas')GK.forEach(g=>{areas[g]=(r[g]&&r[g].length)?r[g]:clone(DEF[g])});
    if(r._id==='wash'&&r.list&&r.list.length)CFG.wash=r.list;
    if(r._id==='routines')CFG.routines=r.list||[];
    if(r._id==='cplan')CFG.cplan=r.list||[];
    if(r._id==='checks')Object.keys(DEF_CHK).forEach(k=>{if(r[k]&&!(k==='guard'&&r[k].some(c=>c.startsWith('# ')))&&!(k==='groom'&&r[k].some(c=>c.startsWith('# '))))CFG.checks[k]=r[k]});
    if(r._id==='groster')CFG.groster=r.list||[];
    if(r._id==='groom'&&r.list&&r.list.length)CFG.groom=r.list;

    i.onchange=()=>{const f=i.files[0];i.remove();if(!f)return res(null);
      const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.5))};im.onerror=()=>res(null);im.src=r.result};r.readAsDataURL(f)};

  }

    const hrs=[];for(let x=hs;x<=Math.min(he,22);x++)hrs.push(x);
    const cell=(l,x)=>{
      const a0=x*60,a1=a0+60,inH=t=>t&&mins(t)>=a0&&mins(t)<a1;let o='';
      if(inH(l.in))o+=`<div>▶ In ${l.in}${late(l)?' <b style="color:var(--bad)">late</b>':''}</div>`;
      (l.alloc||[]).filter(a=>mins(a.from)<a1&&mins(a.to)>a0).sort((a,b)=>a.from.localeCompare(b.from)).forEach(a=>{const ar=areas.clean.find(z=>z.id===a.aid),n=(a.checks||[]).length,ic=a.st==='done'?'✔':a.st==='working'?'⏳':a.st==='issue'?'✖':'○';o+=`<div>${ic} <b>${esc(aName(a))}</b> <small>${a.from}–${a.to}</small>${n?` 📍${n}`:''}</div>`});
      if(inH(l.lunchOut))o+=`<div>🍽 out ${l.lunchOut}</div>`;
      if(inH(l.lunchIn))o+=`<div>🍽 back ${l.lunchIn}</div>`;
      if(inH(l.out))o+=`<div>⏹ Out ${l.out}${early(l)?' <b style="color:var(--bad)">early</b>':''}</div>`;
      return o;
    };
    body=ps.map(p=>{const l=getLog(p,'clean');return `<tr><td><b>${esc(p.name)}</b><br>${attTag(l.att)}</td>${hrs.map(x=>`<td style="min-width:110px;vertical-align:top;font-size:12.5px">${l.att==='A'||l.att==='L'?(x===hrs[0]?attName[l.att]:''):cell(l,x)}</td>`).join('')}</tr>`}).join('');
    h+=`<div class="card"><h3>Hour grid – ${fmtD(S.date)}</h3><small style="color:var(--mute)">✔ done · ⏳ working · ✖ not done · ○ pending · 📍 supervisor check points</small><div class="tw" style="margin-top:8px"><table><tr><th>Person</th>${hrs.map(x=>`<th>${pad(x)}:00–${pad(x+1)}:00</th>`).join('')}</tr>${body}</table></div></div>`;
  }else{
    csvr.push(['Area','Person','Slot','Status','Marked at']);
    areas.clean.forEach(a=>{
      const al=[];ps.forEach(p=>(getLog(p,'clean').alloc||[]).filter(x=>x.aid===a.id).forEach(x=>al.push(Object.assign({pn:p.name},x))));
      al.sort((x,y)=>x.from.localeCompare(y.from));
      body+=`<tr class="grpsep"><td colspan="5">${refImg(a.id,'s')} ${esc(a.name)} – ${al.length?al.filter(x=>x.st==='done').length+'/'+al.length+' done':'<span style="color:var(--bad)">not allocated</span>'} ${sup()?`<button class="btn sm sec" data-act="alloc2" data-v="${a.id}" style="margin-left:8px">＋ Allocate</button>`:''}</td></tr>`+al.map(x=>{csvr.push([a.name,x.pn,x.from+'-'+x.to,x.st,x.t||'']);return `<tr><td>${x.from}–${x.to}</td><td>${esc(x.pn)}</td><td>${aTag(x)}${(x.checks||[]).length?' 📍'+x.checks.length:''}</td><td>${x.t||''}</td><td>${img(x.ph,'','s')}</td></tr>`}).join('');
    });
    h+=`<div class="card"><div class="row" style="justify-content:space-between"><h3>Area-wise cleaning – ${fmtD(S.date)}</h3><button class="btn sec sm" data-act="copy">Copy as CSV</button></div><div class="tw"><table><tr><th>Slot</th><th>Person</th><th>Status</th><th>Marked at</th><th>Latest photo</th></tr>${body}</table></div></div>`;
  }
  lastCsv=csv(csvr);
  return h;
}

/* ---------- weekly tables ---------- */
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function weekDays(){const [y,m,d]=S.date.split('-').map(Number);const w=(new Date(y,m-1,d).getDay()+6)%7;const o=[];for(let i=0;i<7;i++)o.push(dkey(new Date(y,m-1,d-w+i)));return o}
function weekHead(title){
  const ds=weekDays();
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${title}</h3><div class="row"><button class="btn sm sec" data-act="dshift" data-v="-7">◀ Prev week</button><b style="font-size:13px">${fmtS(ds[0])} – ${fmtS(ds[6])}</b><button class="btn sm sec" data-act="dshift" data-v="7">Next week ▶</button></div></div>`;
}
const wkTh=ds=>ds.map((d,i)=>`<th style="text-align:center">${DN[i]}<br><small>${fmtS(d)}</small></th>`).join('');

  const tot=ds.map(()=>0),csvr=[['Area'].concat(ds.map((d,i)=>DN[i]+' '+fmtS(d)),['Days watered'])],missed=[];

        t+=`<tr><td><b>${esc(p.name)}</b></td>${cells}<td><b>${c.P}</b></td><td>${c.H}</td><td>${c.A}</td><td>${c.L}</td></tr>`;
      });
      h+=t+`</table></div></div>`;
    });
    lastCsv=csv(csvr);
    if(!csvr.length)h+='<div class="card empty">No staff added yet.</div>';
  }else{
    const all=[];GK.forEach(g=>gStaff(g).forEach(p=>all.push({g,p})));
    h+=`<div class="card"><select class="inl" data-act="rpick"><option value="">Select a person…</option>${all.map(x=>`<option value="${x.g}|${x.p.id}" ${S.rpid===x.g+'|'+x.p.id?'selected':''}>${G[x.g].label} – ${esc(x.p.name)}</option>`).join('')}</select></div>`;
    if(S.rpid){
      const [g,id]=S.rpid.split('|'),p=staff.find(x=>x.id===id&&x.group===g);
      if(p){
        const r=[['Date','Attendance','Late','In','Lunch out','Lunch in','Out','Check-ins','Allocations / areas done']];
        Object.values(D.log).filter(l=>l.group===g&&l.pid===id).sort((a,b)=>b.date.localeCompare(a.date)).forEach(l=>r.push([fmtD(l.date),attName[l.att]||'–',late(l)?'Late':'',l.in||'–',l.lunchOut||'–',l.lunchIn||'–',l.out||'–',pVisits(p,g,l.date).length,g==='clean'?(l.alloc||[]).filter(a=>a.st==='done').length+'/'+(l.alloc||[]).length:doneN(l)]));
        lastCsv=csv(r);
        h+=`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(p.name)} – ${G[g].label}</h3><button class="btn sec sm" data-act="copy">Copy as CSV</button></div>${r.length>1?tbl(r):'<div class="empty">No records yet.</div>'}</div>`;
      }
    }
  }
  return h;
}

    const ph=await savePhoto(r.photo),p=cur();
    mutate(p,l=>{l.obs.push({t:hhmm(),kind:d.v,by:S.me,text:r.t,ph})});
    logVisit({group:S.group,type:d.v,pid:p.id,who:p.name,remark:r.t,ph});
  },
  /* gardener tasks */
  addtask:async d=>{
    const gs=gStaff('garden');
    const r=await ask('New gardening task',[{k:'n',label:'Task'},{k:'m',label:'Remark (optional)',type:'textarea'},{k:'p',label:'Allocate to',type:'select',opts:[{v:'',l:'– not now (keep in bank) –'}].concat(gs.map(p=>({v:p.id,l:p.name}))),val:d.v||''},{k:'d',label:'Date',type:'date',val:S.date}]);
    if(!r||!r.n)return;
    const t={id:'t'+uid(),name:r.n,note:r.m,st:'open',created:new Date().toISOString(),by:S.me,alloc:null};
    const p=gs.find(x=>x.id===r.p);if(p)t.alloc={date:r.d||S.date,pid:p.id,pname:p.name};
    save('tasks',t.id,t);
    if(p)logVisit({group:'garden',type:'Task allocated',pid:p.id,who:p.name,remark:r.n});
  },
  pulltask:async d=>{
    const open=Object.values(D.tasks).filter(t=>t.st!=='done'&&!(t.alloc&&t.alloc.date===S.date&&t.alloc.pid===d.v));
    if(!open.length){toast('Task bank has no open task');return}
    const r=await ask('Allocate from task bank',[{k:'t',label:'Task',type:'select',opts:open.map(t=>({v:t.id,l:t.name+(t.alloc?' (now: '+t.alloc.pname+')':'')}))}],'Allocate');
    if(!r)return;const t=clone(D.tasks[r.t]),p=gStaff('garden').find(x=>x.id===d.v);
    t.alloc={date:S.date,pid:p.id,pname:p.name};save('tasks',t.id,t);
    logVisit({group:'garden',type:'Task allocated',pid:p.id,who:p.name,remark:t.name});
  },
  talloc:async d=>{
    const t=clone(D.tasks[d.v]),gs=gStaff('garden');
    const r=await ask('Allocate – '+t.name,[{k:'p',label:'Gardener',type:'select',opts:gs.map(p=>({v:p.id,l:p.name})),val:t.alloc?t.alloc.pid:''},{k:'d',label:'Date',type:'date',val:t.alloc?t.alloc.date:S.date}],'Allocate');
    if(!r)return;const p=gs.find(x=>x.id===r.p);if(!p)return;
    t.alloc={date:r.d||S.date,pid:p.id,pname:p.name};save('tasks',t.id,t);
    logVisit({group:'garden',type:'Task allocated',pid:p.id,who:p.name,remark:t.name});
  },
  tdel:d=>{del('tasks',d.v)},
  tstat:async d=>{
    const t=clone(D.tasks[d.v]);
    if(d.s==='working'&&!t.before){const x=await pickPhoto();if(!x){toast('Before photo is needed to start the task');return}t.before=await savePhoto(x);t.tb=hhmm()}
    if(d.s==='done'&&!t.after){const x=await pickPhoto();if(!x){toast('After photo is needed to finish the task');return}t.after=await savePhoto(x);t.ta=hhmm()}
    t.st=d.s;
    if(d.s==='working')t.ts=hhmm();
    if(d.s==='done')t.t=hhmm();
    if(d.s==='open'){t.t='';t.ts=''}
    save('tasks',t.id,t);
    if(d.s==='done')logVisit({group:'garden',type:'Task done',pid:t.alloc?t.alloc.pid:'',who:t.alloc?t.alloc.pname:'',remark:t.name,phs:[{l:'Before',id:t.before||''},{l:'After',id:t.after}].filter(x=>x.id),ph:t.after});
  },
  tphoto:async d=>{
    const data=await pickPhoto();if(!data)return;
    const id=await savePhoto(data),t=clone(D.tasks[d.v]);
    t[d.slot]=id;if(d.slot==='before')t.tb=hhmm();else t.ta=hhmm();
    save('tasks',t.id,t);
  },
  /* greenery */
  green:async d=>{
    const a=areas.garden.find(x=>x.id===d.v),old=D.green[S.date+'_'+d.v]||{};
    const r=await ask('Greenery – '+a.name,[{k:'h',label:'Plant health',type:'select',opts:['Good','Average','Poor'],val:old.health||'Good'},{k:'r',label:'Remark',type:'textarea',val:old.remark||''}],'Save',{photo:true});
    if(!r)return;
    const ph=r.photo?await savePhoto(r.photo):(old.ph||'');
    const e={id:S.date+'_'+d.v,date:S.date,gid:d.v,gname:a.name,health:r.h,remark:r.r,ph,t:hhmm(),by:S.me};
    save('green',e.id,e);
    logVisit({group:'garden',type:'Greenery check',where:a.name,remark:r.h+(r.r?' – '+r.r:''),ph});
  },
  /* issues */
  addiss:async d=>{
    const dm=d.v==='damage';
    const fields=dm?[{k:'n',label:'Plant name'},{k:'a',label:'Area / location'},{k:'re',label:'Reason of damage'},{k:'rq',label:'Requirement (e.g. fertiliser, replacement)'},{k:'m',label:'Remark',type:'textarea'}]:
      [{k:'n',label:'Area to be developed'},{k:'m',label:'Remark / plan',type:'textarea'},{k:'rq',label:'Requirement (plants, soil, labour…)'}];
    const r=await ask(dm?'Damaged plant':'Area yet to develop',fields,'Save',{photo:true});
    if(!r||!r.n)return;
    const ph=await savePhoto(r.photo);
    const i={id:'i'+uid(),kind:d.v,date:S.date,t:hhmm(),name:r.n,area:r.a||'',reason:r.re||'',req:r.rq||'',remark:r.m||'',ph,st:'open',by:S.me};
    save('issues',i.id,i);
    logVisit({group:'garden',type:dm?'Damaged plant reported':'Area to develop',where:r.n,remark:[r.re,r.rq].filter(Boolean).join(' | '),ph});
  },
  issst:d=>{const i=clone(D.issues[d.v]);i.st=i.st==='resolved'?'open':'resolved';save('issues',i.id,i)},
  issdel:d=>{del('issues',d.v)},
  /* cleaner allocation */
  alloc:()=>allocDialog('',cur().id),
  alloc2:d=>allocDialog(d.v,''),
  copyprev:()=>{
    const y=shiftD(S.date,-1);let n=0;
    gStaff('clean').forEach(p=>{const pl=D.log[lid(p.id,'clean',y)],cl=getLog(p);
      if(pl&&(pl.alloc||[]).length&&!(cl.alloc||[]).length){mutate(p,l=>{l.alloc=pl.alloc.map(a=>({id:'a'+uid(),aid:a.aid,from:a.from,to:a.to,st:'pending',t:'',note:a.note||'',ph:'',checks:[]}))});n++}});
    toast(n?'Copied for '+n+' cleaner(s)':'Nothing to copy (yesterday empty or today already allocated)');
  },
  alcp:async d=>{
    const p=cur(),a=getLog(p).alloc.find(x=>x.id===d.v),ar=areas.clean.find(x=>x.id===a.aid);
    const r=await ask('Check point – '+(ar?ar.name:'')+' '+a.from+'–'+a.to+' ('+hhmm()+')',[{k:'s',label:'Status at this visit',type:'select',opts:['Working','Done','Not done'],val:d.s},{k:'n',label:'Remark',type:'textarea'}],'Save check point',{photos:['Photo'],need:['Photo']});
    if(!r)return;
    const ph=await savePhoto(r.photo);
    mutate(p,l=>{const x=l.alloc.find(z=>z.id===d.v);(x.checks=x.checks||[]).push({t:hhmm(),s:r.s,note:r.n,ph,by:S.me});x.st=r.s==='Done'?'done':r.s==='Working'?'working':'issue';x.t=hhmm();x.ph=ph});
    logVisit({group:'clean',type:'Cleaning check-point',pid:p.id,who:p.name,where:(ar?ar.name:'')+' '+a.from+'–'+a.to,remark:r.s+(r.n?' – '+r.n:''),ph});
  },
  alreset:d=>{mutate(cur(),l=>{const x=l.alloc.find(z=>z.id===d.v);x.st='pending';x.t=''})},
  aldel:d=>{mutate(cur(),l=>{l.alloc=l.alloc.filter(x=>x.id!==d.v)})},
  almove:async d=>{
    const p=cur(),cs=gStaff('clean').filter(x=>x.id!==p.id);
    if(!cs.length){toast('No other cleaner');return}
    const r=await ask('Move to another cleaner',[{k:'p',label:'Cleaner',type:'select',opts:cs.map(x=>({v:x.id,l:x.name}))},{k:'f',label:'New from (optional)',type:'time'},{k:'t',label:'New to (optional)',type:'time'}],'Move');
    if(!r)return;
    const a=clone(getLog(p).alloc.find(x=>x.id===d.v)),tp=cs.find(x=>x.id===r.p);
    if(r.f)a.from=r.f;if(r.t)a.to=r.t;
    mutate(p,l=>{l.alloc=l.alloc.filter(x=>x.id!==d.v)});
    mutate(tp,l=>{l.alloc.push(a)});
    logVisit({group:'clean',type:'Area re-allocated',pid:tp.id,who:p.name+' → '+tp.name});
  },
  /* washroom */
  inspect:async d=>{
    const w=CFG.wash.find(x=>x.id===d.v);
    const r=await ask('Inspect – '+w.name+' ('+hhmm()+')',[{k:'ss',label:'Session',type:'select',opts:SESS,val:sessOf(hhmm())},{k:'r',label:'Remark',type:'textarea'}],'Save inspection',{checks:CFG.checks.wash,photos:['Photo'],need:['Photo']});
    if(!r)return;
    const ph=await savePhoto(r.photo);
    const x={id:'w'+uid(),date:S.date,t:hhmm(),sess:r.ss,wid:w.id,wname:w.name,checks:r.checks,remark:r.r,ph,by:S.me};
    save('wash',x.id,x);
    logVisit({group:'clean',type:'Washroom inspection',where:w.name+' ('+r.ss+')',checks:r.checks,remark:r.r,ph});
  },
  nightout:d=>{
    const l=clone(D.log[d.v]);l.out=hhmm();l.outDate=S.date;l.last=new Date().toISOString();l.lastBy=S.me;
    save('log',l.id,l);logVisit({group:'guard',type:'Logout (night shift)',pid:l.pid,who:l.name});
  },
  rtap:async d=>{
    if(d.d>today()){toast('Cannot mark a future date');return}
    const r=CFG.routines.find(x=>x.id===d.v),id=d.d+'_'+d.v,x=D.routine[id];
    if(!x){
      const o={id,date:d.d,tid:d.v,t:hhmm(),by:S.me};save('routine',id,o);
      logVisit({date:d.d,group:'clean',type:'Routine task done',where:r?r.name:'',remark:RT[r?r.type:'']||''});
      return;
    }
    const a=await ask((r?r.name:'Routine task')+' – '+fmtS(d.d),[{k:'a',label:'Marked done at '+x.t+(x.by?' by '+x.by:''),type:'select',opts:['Keep','Undo (not done)']},{k:'n',label:'Remark',type:'textarea',val:x.note||''}],'Save',{photo:true});
    if(!a)return;
    if(a.a.startsWith('Undo')){del('routine',id);return}
    const o=clone(x);o.note=a.n;if(a.photo)o.ph=await savePhoto(a.photo);save('routine',id,o);
  },
  addroutine:async()=>{
    const r=await ask('New routine cleaning task',[{k:'n',label:'Task name (e.g. Scrubbing machine – Lobby)'},{k:'t',label:'Type',type:'select',opts:[{v:'machine',l:'Machine task – every day'},{v:'weekly',l:'Weekly cleaning'},{v:'monthly',l:'Monthly cleaning'}]},{k:'a',label:'Area (optional)',type:'select',opts:[{v:'',l:'– none –'}].concat(areas.clean.map(a=>({v:a.id,l:a.name})))}],'Add');
    if(!r||!r.n)return;
    CFG.routines.push({id:'r'+uid(),name:r.n,type:r.t,aid:r.a});render();put('cfg','routines',{list:CFG.routines});
  },
  rmroutine:d=>{CFG.routines=CFG.routines.filter(x=>x.id!==d.v);render();put('cfg','routines',{list:CFG.routines})},
  /* manage */
  addstaff:async d=>{
    const r=await ask('Add '+G[d.v].label+' staff',[{k:'n',label:'Name'},{k:'p',label:'Phone (optional)',type:'tel'}]);
    if(r&&r.n){staff.push({id:'s'+uid(),name:r.n,phone:r.p,group:d.v});render();saveStaff()}
  },
  rmstaff:d=>{staff=staff.filter(p=>p.id!==d.v);if(S.pid===d.v)S.pid=null;render();saveStaff()},
  addarea:async d=>{
    const r=await ask('Add to '+(d.v==='wash'?'washrooms':d.v==='groom'?'guard rooms':G[d.v].al),[{k:'n',label:'Name'}],'Add',{photo:true});
    if(!r||!r.n)return;
    const id=d.v+uid();listOf(d.v).push({id,name:r.n});
    if(r.photo)save('refs',id,{data:r.photo,t:new Date().toISOString(),by:S.me});
    render();saveAreas(d.v);
  },
  rnarea:async d=>{
    const a=listOf(d.g).find(x=>x.id===d.v);const r=await ask('Rename',[{k:'n',label:'Name',val:a.name}]);
    if(r&&r.n){a.name=r.n;render();saveAreas(d.g)}
  },
  rmarea:d=>{
    if(d.g==='groom')CFG.groom=CFG.groom.filter(x=>x.id!==d.v);else if(d.g==='wash')CFG.wash=CFG.wash.filter(x=>x.id!==d.v);else areas[d.g]=areas[d.g].filter(x=>x.id!==d.v);
    render();saveAreas(d.g);
  },
  addchk:async d=>{const r=await ask('Add checkpoint',[{k:'n',label:'Checkpoint (start with # and a space for a section heading, e.g. # Registers)'}],'Add');if(r&&r.n){CFG.checks[d.v].push(r.n);render();saveChecks()}},
  rmchk:d=>{CFG.checks[d.g].splice(+d.v,1);render();saveChecks()},
  setcfg:async d=>{
    const r=await ask('Timing – '+G[d.v].label,[{k:'s',label:'Duty start time',type:'time',val:CFG.set.start[d.v]},{k:'en',label:'Duty end time (logout before this = Left early)',type:'time',val:CFG.set.end[d.v]},{k:'e',label:'Supervisor check-in due every (minutes)',type:'number',val:CFG.set.every[d.v]}]);
    if(!r)return;
    if(r.s)CFG.set.start[d.v]=r.s;CFG.set.end[d.v]=r.en||'';if(+r.e>0)CFG.set.every[d.v]=+r.e;
    render();put('cfg','settings',CFG.set);
  }
};
document.addEventListener('click',e=>{
  const th=e.target.closest('img.th');
  if(th&&th.src){const L=document.getElementById('layer');L.innerHTML=`<div class="lb"><img src="${th.src}" alt=""></div>`;L.onclick=()=>{L.innerHTML='';L.onclick=null};return}
  const el=e.target.closest('[data-act]');
  if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  if(el.dataset.p)S.pid=el.dataset.p;
  const f=ACT[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&(el.tagName==='INPUT'||el.tagName==='SELECT')){const f=ACT[el.dataset.act];if(f)f(el.dataset,el)}
});

/* ---------- start ---------- */
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,20000);
setInterval(()=>{if(!document.getElementById('layer').innerHTML)render()},120000);
render();
initDb().then(async()=>{if(!S.me){const r=await ask('Welcome – who are you?',[{k:'me',label:'Your name'},{k:'role',label:'Role',type:'select',opts:ROLES,val:'Supervisor'}],'Start');if(r&&r.me){S.me=r.me;S.role=r.role;ls('fis_me',S.me);ls('fis_role',S.role);render()}}});
</script>
</body>
</html>
