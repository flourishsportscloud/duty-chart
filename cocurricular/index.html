<style>:root{
  /* Palette from the FIS logo. Layout: fixed navy rail + light work surface, cards for each task. */
  --navy:#1B3156; --navy2:#14233F; --navy3:#243d69;
  --mag:#E91D69; --mag-d:#C9135A; --mag-t:#FDE8F0;
  --pur:#572686; --pur-t:#EFE8F6;
  --amb:#EFA11D; --amb-t:#FDF1DC;
  --sky:#2B9BD6; --sky-l:#68C0EA; --sky-t:#E4F4FC;
  --ok:#1E9E6A; --ok-t:#E3F5EC; --bad:#D93A4B; --bad-t:#FCE9EB;
  --bg:#F3F5FA; --card:#fff; --ink:#18223A; --mut:#667391; --line:#E2E7F0; --line2:#EEF1F7;
  --r:14px; --sh:0 1px 2px rgba(20,35,63,.05),0 6px 20px rgba(20,35,63,.06);
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;height:100%}
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#cfd8ec;display:flex;flex-direction:column;padding:18px 12px;position:relative;overflow:auto}
.side:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--mag) 0 25%,var(--amb) 25% 50%,var(--sky-l) 50% 75%,var(--pur) 75%)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand span{font-size:11px;color:#9fb0d3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c3cde4;text-decoration:none;font-weight:600;font-size:13.5px;border-left:3px solid transparent}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(233,29,105,.16);color:#fff;border-left-color:var(--mag)}
.nav .cnt{margin-left:auto;background:var(--mag);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.nav h6{margin:16px 12px 6px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#7d8fb6;font-weight:700}
.sidefoot{margin-top:auto;padding:14px 8px 10px;font-size:11px;color:#8294bb}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 26px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.top h1{font-size:19px;color:var(--navy)}
.top .sub{color:var(--mut);font-size:12.5px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;cursor:pointer}
.ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--mag),var(--pur));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who small{display:block;color:var(--mut);font-size:11px;line-height:1.1}
.who b{font-size:12.5px;line-height:1.2}
#view{flex:1;overflow:auto;padding:22px 26px 60px}
.banner{display:flex;gap:10px;align-items:center;background:var(--amb-t);border:1px solid #f4d9a4;color:#7a5410;padding:9px 14px;border-radius:12px;margin-bottom:16px;font-size:12.5px}
.banner b{color:#5d3f08}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:14.5px;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .hint{margin-left:auto;font-weight:500;color:var(--mut);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}
.mt{margin-top:16px}.mb{margin-bottom:16px}

}

 idx();const k=s.id;if(expMemo.has(k))return expMemo.get(k);

 s.targets.forEach(t=>(_secM[t]||[]).forEach(st=>{

 }));
 out.sort((a,b)=>_stM[a].n.localeCompare(_stM[b].n));
 expMemo.set(k,out);return out;
}
function effMark(s,sid){
 const m=s.marks[sid];if(m)return{st:m[0],src:m[1],by:m[2],ts:m[3],note:m[4]||'',auto:false};
 const a=S.days[s.date]&&S.days[s.date].absent&&S.days[s.date].absent[sid];
 if(a)return{st:'A',src:a.src,by:a.by,ts:a.ts,note:a.note||'',auto:true};

}
let _tm=new Map(),_tv=-1;
function tally(s){
 if(_tv!==MUT){_tm.clear();_tv=MUT}
 if(_tm.has(s.id))return _tm.get(s.id);
 const t={P:0,A:0,S:0,I:0,L:0,N:0,U:0,total:0};
 if(s.status==='held'){expected(s).forEach(id=>{const m=effMark(s,id);t.total++;if(m)t[m.st]++;else t.U++})}
 else expected(s).forEach(()=>t.total++);

 _tm.set(s.id,t);return t;
}

function studentSessions(sid,a,b){
 const st=stu(sid);const out=[];
 for(const s of sessionsInRange(a,b)){
  if(!s.targets.includes(st.sec))continue;
  const lane=LANE[s.lane];
  if(lane.mode==='enrol'&&!activeEnr(sid,s.date,lane.acts))continue;
  out.push(s);
 }
 return out.sort((x,y)=>x.date.localeCompare(y.date)||x.start.localeCompare(y.start));
}
function studentSummary(sid,a,b){
 const rows={};const mk=(key,label)=>rows[key]=rows[key]||{key,label,sched:0,held:0,notheld:0,P:0,A:0,S:0,I:0,L:0,N:0,U:0,up:0};
 studentSessions(sid,a,b).forEach(s=>{
  const lane=LANE[s.lane];let key=s.lane,label=lane.name;
  if(lane.mode==='enrol'){const e=activeEnr(sid,s.date,lane.acts);key=s.lane+':'+e.act;label=lane.name+' · '+ACT[e.act].n}
  const r=mk(key,label);r.lane=s.lane;r.sched++;
  const ss=sstate(s);
  if(ss==='held'){r.held++;const m=effMark(s,sid);if(m)r[m.st]++;else r.U++}
  else if(ss==='notheld')r.notheld++;
  else if(ss==='upcoming'||ss==='today')r.up++;
  else r.U+=0;
 });
 return Object.values(rows).sort((x,y)=>LANES.findIndex(l=>l.id===x.lane)-LANES.findIndex(l=>l.id===y.lane));
}

 bad:['Class started about 8 minutes late.','Discipline dropped during the transition between activities.','No lesson plan displayed; session felt unplanned.','Video not captured although it was planned.','Only half of the group was actively practising.','Equipment was not ready at the start.']
};
const pick=(R,a)=>a[Math.floor(R()*a.length)];
function initState(){
 S={v:2,demo:false,students:[],enr:[],coaches:JSON.parse(JSON.stringify(SEED_COACHES)),template:JSON.parse(JSON.stringify(SEED_TEMPLATE)),days:{},sessions:{},requests:[],log:[],staff:{rt:{},rec:{}},ann:[]};
 ROSTER.forEach(r=>{S.students.push({id:r[0],n:r[1],sec:r[2]});r[3].forEach(a=>S.enr.push({id:r[0]+a,sid:r[0],act:a,from:null,to:null,by:'Activity list'}))});
 ENRV++;
 importAtt();
 log('Attendance imported from the Activity Attendance report (12 to 21 Nov 2026)');
}
function genDemo(){
 const R=mulberry(11);
 const dates=[];for(let i=1;i<=26;i++){const d=addDays(TODAY,-i);if(S.template[wd(d)])dates.push(d)}
 dates.sort();
 const hol=dates.length>3?dates[Math.floor(dates.length/2)-1]:null;
 const skippers=new Set();for(let i=0;i<14;i++)skippers.add(S.students[Math.floor(R()*S.students.length)].id);
 dates.forEach(date=>{
  const day=ensureDay(date);
  if(date===hol){day.holiday='School holiday';sessionsOn(date).forEach(s=>{s.status='notheld';s.reason='School holiday'});return}
  S.students.forEach(st=>{if(R()<.04)day.absent[st.id]={src:R()<.55?'entry':'diary',ts:date+' 09:10',by:R()<.55?'Entry-Exit app':'Diary',note:''}});
  sessionsOn(date).forEach(s=>{
   const r=R();
   if(r<.045){s.status='notheld';s.reason='Coach absent';return}
   if(r<.075){s.status='notheld';s.reason=R()<.5?'Exam / school event':'Ground or room not available';return}
   s.status='held';
   const late=R()<.3?Math.floor(R()*10)+2:0;
   const st0=mins(s.start)+late,en0=mins(s.end)-(R()<.15?4:0);
   const tm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
   s.lp.actual={start:tm(st0),end:tm(en0)};
   const P=POOL[s.lane]||POOL._;
   if(R()<.78){s.lp.title=pick(R,P.title||POOL._.title);s.lp.plan={};(PLAN[s.lane]||[]).forEach(([k])=>{if(P[k])s.lp.plan[k]=pick(R,P[k])})}
   if(R()<.72){s.lp.followed=R()<.7?'yes':(R()<.6?'partly':'no');s.lp.taught=(s.lp.title||'Class activity')+(s.lp.followed==='yes'?' completed as planned.':' covered in part.')}
   expected(s).forEach(id=>{
    if(day.absent[id])return;
    const bad=skippers.has(id)?.35:0;const x=R();let m='P';
    if(x<bad)m='N';else if(x<bad+.025)m='S';else if(x<bad+.045)m='I';else if(x<bad+.065)m='N';else if(x<bad+.075)m='L';
    s.marks[id]=[m,'coach',s.coach,date+' '+tm(st0+6)];
   });
   s.sub={by:s.coach,ts:date+' '+tm(en0+4)};
   if(R()<.2&&LANE[s.lane].mode!=='x'){
    const sc=OBS_LANE[s.lane]||OBS_LANE._;const o={id:uid(),by:R()<.5?'Manager':'Director',role:R()<.5?'manager':'director',ts:date+' 11:20',ratings:{},flags:{},stage:pick(R,STAGES),remark:'',action:'',done:false};
    const g=R()<.72;
    [...OBS_BASE,...sc.r].forEach(([k])=>o.ratings[k]=g?3+Math.floor(R()*3):1+Math.floor(R()*4));
    [...OBS_FLAGS,...sc.f].forEach(([k])=>o.flags[k]=R()<(g?.88:.4)?'y':'n');
    o.remark=pick(R,g?REM.good:REM.bad);
    if(!g&&R()<.6){o.action='Discuss with coach and revisit next session';o.done=R()<.4}
    s.obs.push(o);
   }
  });
 });
}

/* Real attendance: Activity Attendance PDF, 12 to 21 Nov 2026. 1 = present. 0 = did not attend (reason not in the report). */
function importAtt(){
 idx();
 const D=[];for(let i=12;i<=21;i++)D.push('2026-11-'+pad(i));
 const grp={};
 ATT.forEach(([sid,a,f])=>{const st=_stM[sid];if(!st)return;for(let k=0;k<10;k++)(grp[a+'|'+k]=grp[a+'|'+k]||[]).push([sid,st.sec,f[k]==='1'])});
 Object.keys(grp).sort().forEach(key=>{
  const[a,ks]=key.split('|');const rows=grp[key];
  const secs=[...new Set(rows.filter(r=>r[2]).map(r=>r[1]))];if(!secs.length)return;
  secs.sort((x,y)=>SECTIONS.indexOf(x)-SECTIONS.indexOf(y));
  const date=D[+ks];
  if(!S.days[date])S.days[date]={absent:{},note:'',holiday:'',image:null,init:true,ids:[]};
  const s=addSession(date,{lane:ACT[a].lane,targets:secs,start:'00:00',end:'00:00',acts:[a],coach:''});
  s.status='held';s.imp=true;s.sub={by:'Imported report',ts:'2026-11-22'};
  rows.forEach(r=>{if(secs.includes(r[1]))s.marks[r[0]]=[r[2]?'P':'N','import','Imported report','2026-11-22 00:00',r[2]?'':'Not present. Reason not in the report.']});
 });
 STRUCT++;
}

function sessPill(s){
 const ss=sstate(s);
 if(ss==='held')return`<span class="pill ok">Held</span>`;
 if(ss==='notheld')return`<span class="pill bad">Not held · ${h(reasonOf(s))}</span>`;
 if(ss==='pending')return`<span class="pill amb">Not recorded</span>`;
 if(ss==='today')return`<span class="pill sky">Today</span>`;
 return`<span class="pill grey">Upcoming</span>`;
}
function stPill(k){return`<span class="pill ${ST[k].pill}">${ST[k].l}</span>`}
function dotColor(s){const ss=sstate(s);if(ss==='held'){const t=tally(s);const r=t.marked?t.P/t.marked:1;return r>=.85?'#1E9E6A':r>=.6?'#EFA11D':'#D93A4B'}return ss==='notheld'?'#D93A4B':ss==='pending'?'#EFA11D':'#CBD3E3'}
function dotTitle(s){const ss=sstate(s);const t=tally(s);return`${fd(s.date)} · `+(ss==='held'?`Held, ${t.P}/${t.marked} present`:ss==='notheld'?`Not held: ${reasonOf(s)}`:ss==='pending'?'Not recorded':'Upcoming')}
function lastDots(s,n=4){
 const l=lastSessions(s,n).reverse();
 if(!l.length)return'<span class="xs mut">first on record</span>';
 return`<span class="dots">${l.map(x=>`<i style="background:${dotColor(x)}" title="${h(dotTitle(x))}"></i>`).join('')}</span>`;
}
function groupCounts(s){
 const lane=LANE[s.lane];if(lane.mode!=='enrol')return'';
 const c={};expected(s).forEach(id=>{const e=activeEnr(id,s.date,lane.acts);if(e){const k=ACT[e.act].s;c[k]=(c[k]||0)+1}});
 const order=lane.acts.map(a=>ACT[a].s);const parts=Object.entries(c).sort((x,y)=>order.indexOf(x[0])-order.indexOf(y[0])).map(([k,v])=>`${k}-${v}`);
 if(!parts.length&&s.lane==='fitness'&&typeof secClass(s.targets[0])==='string')return'Wushu, Karate';
 return parts.join(', ');
}
function ask(msg,yes,label='Confirm'){
 openModal(`<div class="mh"><h3>${h(label)}</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2">${msg}</div><div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" id="askyes">${h(label)}</button></div>`);
 $('#askyes').onclick=()=>{closeModal();yes()};
}

function weekStrip(){
 const d=pd(ui.date);const k=(d.getDay()+6)%7;const mon=addDays(ui.date,-k);
 return`<div class="week">${[0,1,2,3,4,5].map(i=>{const x=addDays(mon,i);const day=S.days[x];const has=S.template[wd(x)]||(day&&day.ids&&day.ids.length);const n=has?sessionsOn(x).length:0;const hol=day&&day.holiday;
  return`<button class="${x===ui.date?'on':''} ${hol?'hol':''}" data-a="setdate" data-d="${x}"><b>${DOW[wd(x)]} ${pd(x).getDate()}</b><span>${hol?'Holiday':n?n+' classes':'No chart'}</span></button>`}).join('')}</div>`;
}
function dateBar(title){
 return`<div class="datebar"><button class="btn sm" data-a="prevday" aria-label="Previous day">‹</button><div class="big">${fd(ui.date)}${ui.date===TODAY?' <span class="pill sky">Today</span>':''}</div><button class="btn sm" data-a="nextday" aria-label="Next day">›</button><input type="date" id="datepick" value="${ui.date}" style="width:auto" aria-label="Pick date"><button class="btn sm" data-a="gotoday">Today</button><span class="sp"></span>${title||''}</div>${weekStrip()}`;
}

/* ---------- Day Chart ---------- */
ui.dc={mode:'chart',parent:false};
function dayText(date){
 const ss=sessionsOn(date);let out=`*Co-curricular schedule · ${fd(date)}*\n`;
 [1,2,3].forEach(c=>{
  const l=ss.filter(s=>LANE[s.lane].cat===c);if(!l.length)return;
  out+=`\n*${CATS[c].n}* (${CATS[c].m})\n`;
  l.forEach(s=>{const g=groupCounts(s);out+=`${tr(s.start,s.end)}  ${LANE[s.lane].name}: Class ${targetLabel(s.targets)}${g&&LANE[s.lane].mode==='enrol'?' ('+g+')':''}\n`});
 });
 return out;
}
function viewDayChart(){
 const date=ui.date;const day=ensureDay(date);const ss=sessionsOn(date);const par=ui.dc.parent;
 const abs=Object.keys(day.absent||{}).length;
 let h1=`<div class="row mb"><div class="seg"><button class="${ui.dc.mode==='chart'?'on':''}" data-a="dcmode" data-m="chart">Chart</button><button class="${ui.dc.mode==='image'?'on':''}" data-a="dcmode" data-m="image">Attached image</button><button class="${ui.dc.mode==='text'?'on':''}" data-a="dcmode" data-m="text">Share text</button></div>
  <label class="row sm mut" style="gap:6px"><input type="checkbox" id="dcparent" ${par?'checked':''}> Parent / staff view</label><span class="sp"></span>
  ${can.absent()&&!par?`<button class="btn sm" data-a="absentmodal" data-src="entry">Add absentees: Entry-Exit app</button><button class="btn sm" data-a="absentmodal" data-src="diary">Add absentees: Diary</button>`:''}
  ${can.timetable()&&!par?(day.holiday?`<button class="btn sm" data-a="clearholiday">Remove holiday</button>`:`<button class="btn sm" data-a="holidaymodal">Mark day as holiday</button>`):''}</div>`;
 let body='';
 if(day.holiday)body+=`<div class="note bad mb"><b>${h(day.holiday)}</b>. No co-curricular classes on this date.</div>`;
 if(ui.dc.mode==='chart')body+=ss.length?chartHtml(ss,par):`<div class="card empty">No chart for ${DOW[wd(date)]}day yet.<br>Add sessions in <a href="#timetable">Timetable</a>, or attach the day's image here.</div>`;
 else if(ui.dc.mode==='image'){
  body+=day.image?`<div class="card imgbox"><div class="row mb"><h3 style="margin:0">Attached day plan</h3><span class="sp"></span><button class="btn sm" data-a="pickimg">Replace image</button>${can.timetable()?`<button class="btn sm danger" data-a="rmimg">Remove</button>`:''}</div><img src="${day.image}" alt="Attached co-curricular day plan"></div>`
   :`<div class="drop"><b>No image attached for ${fds(date)}</b><p class="sm">Attach the day's co-curricular chart (PNG or JPG). It shows in this view for staff and parents.</p><button class="btn pri" data-a="pickimg">Attach image</button></div>`;
  body+=`<input type="file" id="imgfile" accept="image/*" hidden>`;
 } else body+=`<div class="card"><div class="row mb"><h3 style="margin:0">Message text</h3><span class="sp"></span><button class="btn pri sm" data-a="copytext">Copy text</button></div><pre id="daytext" style="white-space:pre-wrap;font-family:inherit;margin:0;font-size:13px;line-height:1.7">${h(dayText(date))}</pre></div>`;
 const meta=!par&&ss.length?`<div class="kpis mt" style="margin-bottom:0">${[
  ['Classes planned',ss.length,'var(--navy)',''],['Held so far',ss.filter(s=>sstate(s)==='held').length,'var(--ok)',''],['Not held',ss.filter(s=>sstate(s)==='notheld').length,'var(--bad)',''],['School absentees',abs,'var(--amb)','from Entry-Exit app and Diary']
 ].map(k=>`<div class="kpi" style="--c:${k[2]}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[3]||'&nbsp;'}</div></div>`).join('')}</div>`:'';
 return dateBar()+h1+body+meta;
}
function chartHtml(ss,par){
 const cats=[1,2,3].map(c=>{
  const lanes=LANES.filter(l=>l.cat===c&&(l.id!=='clubs'||ss.some(s=>s.lane==='clubs')));
  const items=ss.filter(s=>LANE[s.lane].cat===c);
  const rows=[...new Set(items.map(s=>s.start+'-'+s.end))].sort();
  let lunchAt=rows.findIndex(r=>r.split('-')[0]>='11:30');
  const hasBefore=rows.some(r=>r.split('-')[0]<'11:30'),hasAfter=lunchAt>=0;
  const tdr=(r,i)=>{const[a,b]=r.split('-');
   return`<tr><td class="t">${tr(a,b)}</td>${lanes.map(l=>`<td>${items.filter(s=>s.lane===l.id&&s.start===a&&s.end===b).map(s=>cellHtml(s,par)).join('')}</td>`).join('')}</tr>`};
  let trs='';rows.forEach((r,i)=>{if(i===lunchAt&&hasBefore)trs+=`<tr><td class="lunch" colspan="${lanes.length+1}">LUNCH · 11:30–12:00</td></tr>`;trs+=tdr(r,i)});
  if(!items.length)return'';
  return`<div class="ch"><h4 style="background:${CATS[c].c}">${CATS[c].n}<small>${CATS[c].m}</small></h4><div class="scroll"><table><thead><tr><th>Time</th>${lanes.map(l=>`<th>${h(l.short)}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table></div></div>`;
 }).join('');
 return`<div class="chart3">${cats}</div>`;
}
function cellHtml(s,par){
 const l=LANE[s.lane];const g=groupCounts(s);const ss=sstate(s);let st='';
 if(!par){
  if(ss==='held'){const t=tally(s);st=`<span class="st" style="color:var(--ok)">✓ ${t.marked?Math.round(t.P*100/t.marked):0}% present</span>`}
  else if(ss==='notheld')st=`<span class="st" style="color:var(--bad)">✕ ${h(reasonOf(s))}</span>`;

function lineChart(pts){

 const W=640,H=210,L=38,R=14,Tp=14,B=30;const x=i=>L+i*(W-L-R)/(pts.length-1);const y=v=>Tp+(100-v)*(H-Tp-B)/100;
 const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
 const area=`${line} L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B}Z`;

function importCsv(){

 rows.forEach((line,i)=>{
  const c=line.split(',').map(x=>x.trim());const[date,cls,act,name,stt,rem]=c;
  const lane=LANE_ALIAS[(act||'').toLowerCase()];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')||!lane||!cls){bad.push(`Row ${i+1}: check date, class and activity`);return}
  ensureDay(date);

  if(!name){
   if((stt||'').toUpperCase().replace(/\s/g,'')==='NOTHELD'){sessions.forEach(s=>{s.status='notheld';s.reason=NOTHELD.includes(rem)?rem:(rem||'Other');nh++})}
   else bad.push(`Row ${i+1}: student missing`);return;
  }
  const stc=ST_ALIAS[(stt||'').toLowerCase()];

const STS={ontime:['On time','ok'],late:['Late','amb'],na:['Not arrived','bad'],wait:['Awaiting','grey'],leave:['On leave','pur'],none:['No record','grey']};
const dayRT=date=>{const r=S.staff.rt;if(r[date])return r[date];const k=Object.keys(r).filter(x=>x<date).sort();return k.length?r[k[k.length-1]]:'08:00'};

function staffState(date,c){
 const rec=((S.staff.rec[date]||{})[c.id])||{};const rt=rec.rt||dayRT(date);
 if(rec.leave)return{k:'leave',rt,rec};
 if(!rec.in){if(!trackedDay(date))return{k:'none',rt,rec};const past=date<TODAY||(date===TODAY&&mins(hhmm())>mins(rt));return{k:past?'na':'wait',rt,rec}}

}

 switch(a){

  case'unconvey':{const ss=t.dataset.sid?S.sessions[t.dataset.sid]:s;const o=ss.obs.find(x=>x.id===t.dataset.id);o.conv=false;save();if(ui.sess)renderDrawer(true);render();return true}
  case'stl':ui.stl=t.dataset.l;ui.sta='all';ui.stn=60;render();return true;

  case'sin':{const r=sRec(d,t.dataset.c);r.in=hhmm();save();render();return true}

  case'rtall':{const v=$('#rtday').value;if(!v)return true;S.staff.rt[d]=v;Object.values(S.staff.rec[d]||{}).forEach(r=>{delete r.rt});save();toast('Reporting time set for the day');render();return true}
  case'annf':ui.anf=t.dataset.v;render();return true;
  case'annnew':annModal(false);return true;
  case'annhub':annModal(true);return true;
  case'annsave':{const ti=$('#an_t').value.trim(),bo=$('#an_b').value.trim();if(!ti||!bo){toast('Add a title and a message');return true}
   S.ann.unshift({id:uid(),title:ti,body:bo,aud:$('#an_a').value,pin:$('#an_p').checked,by:ui.me.name,ts:nowIso(),src:t.dataset.hub==='1'?'hub':'local',rd:[]});save();closeModal();toast('Posted');render();return true}
  case'annread':{const a=S.ann.find(x=>x.id===t.dataset.id);a.rd=a.rd||[];if(!a.rd.includes(ui.me.name))a.rd.push(ui.me.name);save();render();return true}
  case'anndel':ask('Delete this announcement?',()=>{S.ann=S.ann.filter(x=>x.id!==t.dataset.id);save();render()},'Delete');return true;
 }
 return false;
}

 const r=ROUTES.find(x=>x[0]===ui.route)||ROUTES[0];
 $('#nav').innerHTML=`<h6>Co-curricular</h6>`+ROUTES.map(x=>`<a href="#${x[0]}" class="${x[0]===r[0]?'on':''}">${ico(x[2])}${x[1]}${x[0]==='enrolment'&&pendCount()?`<span class="cnt">${pendCount()}</span>`:''}${x[0]==='staff'&&staffNA()?`<span class="cnt">${staffNA()}</span>`:''}</a>`).join('');
 $('#ttl').textContent=r[1];$('#sub').textContent=r[3];
 $('#who').innerHTML=`<span class="ava">${h(initials(ui.me.name||'U'))}</span><span><b>${h(ui.me.name)}</b>${ui.me.name!==ROLES[ui.me.role]?`<small>${h(ROLES[ui.me.role])}</small>`:''}</span>`;
 const v=({dashboard:viewDashboard,daychart:viewDayChart,attendance:viewSessions,learning:viewLearning,students:viewStudents,enrolment:viewEnrolment,observations:viewObservations,staff:viewStaff,announce:viewAnnounce,timetable:viewTimetable,setup:viewSetup})[r[0]];
 const hasImp=['dashboard','daychart','attendance'].includes(r[0])&&Object.values(S.sessions).some(x=>x.imp);
 const ban=hasImp?`<div class="banner"><div><b>Attendance loaded from your report.</b> Classes of 12 to 21 Nov 2026 come from the Activity Attendance report. It shows present or not present only, so a child who was not present shows as No-show. Class times, coaches and reasons were not in the report. Open a class to assign the coach and correct a reason.</div></div>`:''
 const warn=ui.warn?`<div class="banner" style="background:var(--bad-t);border-color:#f2b9c0;color:#992030">This browser could not save your changes. Use Setup, then Copy backup, to keep a copy.</div>`:'';
 const el=$('#view');const sc=el.scrollTop;
 el.innerHTML=ban+warn+v();
 if(el.dataset.r===r[0])el.scrollTop=sc;el.dataset.r=r[0];
}
function setRoute(){const x=(location.hash||'').replace('#','');if(ROUTES.some(r=>r[0]===x)){ui.route=x}render()}
function workDay(d,dir){let x=d;do{x=addDays(x,dir)}while(wd(x)===0);return x}
function bootDate(){
 let d=TODAY;for(let i=0;i<8;i++){if(S.template[wd(d)])break;d=addDays(d,1)}
 ui.date=S.template[wd(d)]?d:TODAY;
}
function rerenderFocus(id){
 const had=document.activeElement&&document.activeElement.id===id;const pos=had?document.activeElement.selectionStart:0;
 render();const e=document.getElementById(id);if(e&&had){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}
}
function imageFromFile(file,cb){
 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const mx=1500;const k=Math.min(1,mx/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>toast('Could not read that image');im.src=fr.result};fr.readAsDataURL(file);
}
function setHoliday(reason){
 const day=ensureDay(ui.date);day.holiday=reason;
 day.ids.forEach(i=>{const s=S.sessions[i];if(s&&!Object.keys(s.marks).length){s.status='notheld';s.reason='School holiday'}});
 log(`Marked ${fds(ui.date)} as ${reason}`);save();
}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');
 if(e.target.id==='ov'){closeDrawer();return}
 if(e.target.id==='md'){closeModal();return}
 if(!t)return;const a=t.dataset.a;
 if(t.tagName==='A')e.preventDefault();
 const s=curS();
 if(moreClick(a,t,s))return;
 switch(a){
  case'setdate':ui.date=t.dataset.d;render();break;
  case'prevday':ui.date=workDay(ui.date,-1);render();break;
  case'nextday':ui.date=workDay(ui.date,1);render();break;
  case'gotoday':bootDate();render();break;
  case'dcmode':ui.dc.mode=t.dataset.m;render();break;
  case'absentmodal':absentModal(t.dataset.src);break;
  case'saveabs':saveAbsent();break;
  case'rmabs':{delete S.days[ui.date].absent[t.dataset.s];save();absentModal(ui.abs);render();if(ui.sess)renderDrawer(true);break}
  case'holidaymodal':openModal(`<div class="mh"><h3>Mark ${fds(ui.date)} as holiday</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><div class="fld"><label class="f" for="hol_r">Reason</label><input type="text" id="hol_r" value="School holiday"></div><p class="sm mut">All classes that day show as “Not held · School holiday” and are counted in the monthly report.</p></div><div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" data-a="saveholiday">Mark holiday</button></div>`);break;
  case'saveholiday':setHoliday($('#hol_r').value.trim()||'School holiday');closeModal();render();break;
  case'clearholiday':{const day=S.days[ui.date];day.holiday='';day.ids.forEach(i=>{const x=S.sessions[i];if(x&&x.status==='notheld'&&x.reason==='School holiday'&&!Object.keys(x.marks).length){x.status='planned';x.reason=''}});save();render();break}
  case'pickimg':{const f=$('#imgfile');if(f)f.click();break}
  case'rmimg':S.days[ui.date].image=null;save();render();break;
  case'copytext':copyText(dayText(ui.date));break;
  case'lanef':ui.sf.lane=t.dataset.l;render();break;
  case'opensess':{closeModal();const id=t.dataset.id;openSession(id);if(t.dataset.tab){ui.stab=t.dataset.tab;renderDrawer()}break}
  case'closedrawer':closeDrawer();break;
  case'closemodal':closeModal();break;
  case'stab':ui.stab=t.dataset.t;renderDrawer();break;
  case'sstatus':{if(s.sub&&!can.reopen())break;s.status=t.dataset.v;if(s.status==='notheld'){s.reason=s.reason||NOTHELD[0]}else s.reason='';save();renderDrawer(true);break}
  case'allpresent':{if(s.sub&&!can.reopen())break;let n=0;expected(s).forEach(id=>{if(!effMark(s,id)){s.marks[id]=['P',srcByRole(),ui.me.name,nowIso(),''];n++}});if(s.status!=='held')s.status='held';save();renderStudents();$('#ov .df').innerHTML=footAtt(s,false);toast(n?`${n} marked present`:'Everyone is already marked');break}
  case'af':ui.af=t.dataset.v;renderStudents();break;
  case'mark':doMark(t.dataset.s,t.dataset.v);break;
  case'notebtn':ui.noteOpen[t.dataset.s]=!ui.noteOpen[t.dataset.s];renderStudents();break;
  case'followed':s.lp.followed=s.lp.followed===t.dataset.v?'':t.dataset.v;save();renderDrawer(true);break;
  case'rate':{const d=ui.obsDraft;const k=t.dataset.k,n=+t.dataset.n;d.ratings[k]=d.ratings[k]===n?0:n;renderDrawer(true);break}
  case'flag':{const d=ui.obsDraft;d.flags[t.dataset.k]=t.dataset.v;renderDrawer(true);break}
  case'saveobs':{const d=ui.obsDraft;if(!Object.values(d.ratings).some(Boolean)&&!d.remark.trim()){toast('Add at least one rating or a remark');break}
   s.obs.push({id:uid(),priv:true,conv:false,by:ui.me.name,role:ui.me.role,ts:nowIso(),ratings:d.ratings,flags:d.flags,stage:d.stage,remark:d.remark.trim(),action:d.action.trim(),done:false});ui.obsDraft=null;save();toast('Observation saved');renderDrawer(true);break}
  case'delobs':{const ss=t.dataset.sid?S.sessions[t.dataset.sid]:s;ask('Delete this observation?',()=>{ss.obs=ss.obs.filter(o=>o.id!==t.dataset.id);save();if(ui.sess)renderDrawer(true);render()},'Delete');break}
  case'toggledone':{const ss=t.dataset.sid?S.sessions[t.dataset.sid]:s;const o=ss.obs.find(x=>x.id===t.dataset.id);o.done=!o.done;save();if(ui.sess)renderDrawer(true);render();break}
  case'submit':{
   const tl=tally(s);
   const fin=()=>{s.sub={by:ui.me.name,ts:nowIso()};save();renderDrawer(true);toast('Attendance submitted')};
   if(s.status==='held'&&tl.U){ask(`<p>${tl.U} student${tl.U>1?'s are':' is'} not marked. Mark them present and submit?</p>`,()=>{expected(s).forEach(id=>{if(!effMark(s,id))s.marks[id]=['P',srcByRole(),ui.me.name,nowIso(),'']});fin()},'Mark present and submit')}
   else fin();break}
  case'reopen':s.sub=null;log(`Reopened ${s.id}`);save();renderDrawer(true);break;
  case'period':ui.period=t.dataset.p;render();break;
  case'dtab':ui.dtab=t.dataset.t;render();break;
  case'gocal':openModal(`<div class="mh"><h3>Choose a date</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><input type="date" id="dpick2" value="${ui.date}"></div><div class="mf"><button class="btn pri" data-a="godate">Apply</button></div>`);break;
  case'godate':ui.date=$('#dpick2').value||ui.date;closeModal();render();break;
  case'cellinfo':cellInfo(t.dataset.sec,t.dataset.l);break;
  case'stuprof':openProfile(t.dataset.s);break;
  case'pp':ui.pp=t.dataset.p;renderProfile();break;
  case'pl':ui.pl=t.dataset.l;renderProfile();break;
  case'copyparent':copyText($('#ptext').textContent,'Summary copied');break;
  case'newreq':newReqModal(t.dataset.s);break;
  case'rqpick':ui.rq.sid=t.dataset.s;renderReq();break;
  case'rqclear':ui.rq.sid='';renderReq();break;
  case'saverq':saveReq();break;
  case'approve':{const r=S.requests.find(x=>x.id===t.dataset.id);applyReq(r);save();toast('Approved and applied');render();break}
  case'reject':{const r=S.requests.find(x=>x.id===t.dataset.id);r.status='rejected';r.decidedBy=ui.me.name;r.decidedTs=nowIso();log(`Rejected enrolment change for ${stu(r.sid).n}`);save();render();break}
  case'etab':ui.etab=t.dataset.t;render();break;
  case'addstudent':addStudentModal();break;
  case'savestudent':saveStudent();break;
  case'morestu':ui.stn+=80;render();break;
  case'of':ui.of=t.dataset.l;render();break;
  case'obsnew':{const ss=sessionsOn(ui.date);openModal(`<div class="mh"><h3>Observe a class · ${fds(ui.date)}</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><p class="sm mut">Pick the class you observed. Change the date from Attendance if needed.</p>${ss.map(x=>`<div class="orow" style="cursor:pointer" data-a="opensess" data-id="${h(x.id)}" data-tab="obs"><span>${laneTag(x.lane)} <b>${h(targetLabel(x.targets))}</b> <span class="xs mut">${tr(x.start,x.end)}</span></span><span class="pill grey">${x.obs.length} obs</span></div>`).join('')||'<div class="empty">No sessions on this date.</div>'}</div>`,true);break}
  case'ttab':ui.ttab=t.dataset.t;render();break;
  case'ttday':ui.ttd=+t.dataset.d;render();break;
  case'copyday':copyDayModal();break;
  case'docopyday':{const src=S.template[ui.ttd]||[];$$('.cpd:checked').forEach(c=>{S.template[+c.value]=JSON.parse(JSON.stringify(src))});regenFuture();log(`Copied ${DOW[ui.ttd]} template`);save();closeModal();toast('Copied');render();break}
  case'addtt':ui.ttm=null;ttModal(t.dataset.mode);break;
  case'edittt':ttModal(t.dataset.mode,t.dataset.i);break;
  case'rmtt':ask('Remove this session?'+(t.dataset.mode==='date'?'<p class="sm mut">Attendance already marked for it will be lost.</p>':'<p class="sm mut">Future days without attendance are rebuilt from the template.</p>'),()=>{if(t.dataset.mode==='tpl'){S.template[ui.ttd].splice(+t.dataset.i,1);regenFuture()}else{removeSession(t.dataset.i);ENRV++}save();render()},'Remove');break;
  case'tttgt':{const d=ui.ttm;const x=t.dataset.t;d.start=$('#tt_s').value;d.end=$('#tt_e').value;d.coach=$('#tt_c').value;d.targets=d.targets.includes(x)?d.targets.filter(y=>y!==x):[...d.targets,x];renderTT(null,true);break}
  case'ttall':{const d=ui.ttm;const secs=CLASS_SECS[t.dataset.c].map(x=>t.dataset.c+x);const all=secs.every(x=>d.targets.includes(x));d.start=$('#tt_s').value;d.end=$('#tt_e').value;d.coach=$('#tt_c').value;d.targets=all?d.targets.filter(x=>!secs.includes(x)):[...new Set([...d.targets,...secs])];renderTT(null,true);break}
  case'savett':saveTT();break;
  case'resetday':ask('<p>Rebuild this date from the weekly template? Sessions without attendance are replaced.</p>',()=>{const day=ensureDay(ui.date);day.ids.slice().forEach(i=>{const x=S.sessions[i];if(x&&!hasData(x))removeSession(i)});day.init=false;ENRV++;save();render()},'Reset');break;
  case'saveuser':{ui.me={role:$('#u_r').value,name:$('#u_n').value.trim()||ROLES[$('#u_r').value]};saveUi();closeModal();render();break}
  case'addcoach':{const n=$('#nc_n').value.trim();if(!n)break;S.coaches.push({id:uid(),name:n,lanes:[$('#nc_l').value]});save();render();break}
  case'rmcoach':ask('Remove this coach from the list? Past sessions keep the name.',()=>{S.coaches.splice(+t.dataset.i,1);save();render()},'Remove');break;
  case'clearattn':ask('<p>This deletes all attendance, lesson notes, observations and holiday marks. The student list, enrolment, timetable template and coaches stay.</p>',()=>{S.days={};S.sessions={};S.requests=[];S.demo=false;STRUCT++;ENRV++;log('Cleared attendance data');save();bootDate();render();toast('Cleared. Ready for real attendance.')},'Clear everything');break;
  case'resetdemo':ask('Replace current data with fresh demo data?',()=>{initState();save();bootDate();render()},'Reload demo');break;
  case'exportjson':copyText(JSON.stringify(S),'Backup copied');break;
  case'importjson':openModal(`<div class="mh"><h3>Restore from backup</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><textarea id="bk" rows="8" placeholder="Paste the backup text"></textarea></div><div class="mf"><button class="btn pri" data-a="dorestore">Restore</button></div>`);break;
  case'dorestore':{try{const o=JSON.parse($('#bk').value);if(!o.sessions||!o.students)throw 0;S=o;ENRV++;STRUCT++;save();closeModal();render();toast('Restored')}catch(x){toast('That text is not a valid backup')}break}
  case'importcsv':importCsv();render();break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(moreInput(t))return;
 if(t.id==='sq'){ui.sf.q=t.value;rerenderFocus('sq')}
 else if(t.id==='stuq'){ui.stq=t.value;ui.stn=60;rerenderFocus('stuq')}
 else if(t.id==='stq'){ui.sq=t.value;renderStudents()}
 else if(t.dataset.od){ui.obsDraft[t.dataset.od]=t.value}
});
document.addEventListener('change',e=>{
 const t=e.target;const s=curS();
 if(moreChange(t,s))return;
 if(t.id==='datepick'){ui.date=t.value||ui.date;render()}
 else if(t.id==='dcparent'){ui.dc.parent=t.checked;render()}
 else if(t.id==='imgfile'&&t.files[0]){imageFromFile(t.files[0],u=>{ensureDay(ui.date);S.days[ui.date].image=u;save();render()})}
 else if(t.id==='stuc'){ui.stc=t.value;ui.stn=60;render()}
 else if(t.id==='stul'){ui.stl=t.value;ui.stn=60;render()}
 else if(t.id==='dsc'){ui.dsc=t.value;render()}
 else if(t.id==='dsl'){ui.dsl=t.value;render()}
 else if(t.id==='dss'){ui.dss=t.value;render()}
 else if(t.id==='opend'){ui.op=t.checked;render()}
 else if(t.id==='dcoach'&&s){s.coach=t.value;if(s.imp)Object.values(S.sessions).forEach(x=>{if(x.imp&&!x.coach&&x.lane===s.lane&&(x.acts||[]).join()===(s.acts||[]).join())x.coach=t.value});save();renderDrawer(true)}
 else if(t.id==='nhreason'&&s){s.reason=t.value;save()}
 else if(t.id==='nhnote'&&s){s.note=t.value;save()}
 else if(t.dataset.f&&s){setPath(s,t.dataset.f,t.value);save();if(t.dataset.f.startsWith('lp.actual'))renderDrawer(true)}
 else if(t.classList.contains('notein')&&s){const m=s.marks[t.dataset.s];if(!m){toast('Mark a status first, then add the remark');t.value='';return}m[4]=t.value;save();renderStudents()}
 else if(t.dataset.rq){ui.rq[t.dataset.rq]=t.value;renderReq()}
 else if(t.dataset.tt==='lane'){const d=ui.ttm;d.lane=t.value;d.start=$('#tt_s').value;d.end=$('#tt_e').value;d.coach=defaultCoach(t.value);renderTT(null,true)}
 else if(t.dataset.coach!==undefined){const c=S.coaches[+t.dataset.coach];const old=c.name;c.name=t.value.trim()||old;Object.values(S.sessions).forEach(x=>{if(x.coach===old)x.coach=c.name});Object.values(S.template).forEach(l=>l.forEach(x=>{if(x.coach===old)x.coach=c.name}));save()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#md').className){closeModal()}else if($('#ov').className){closeDrawer()}}
 if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('srow'))e.target.click();
});
window.addEventListener('hashchange',setRoute);
$('#who').addEventListener('click',userModal);

/* patch renderTT to use stored values (declared in 50-people.js) */
function renderTT(cur,fromState){
 const d=ui.ttm;
 if(!fromState){const c=cur||{};d.start=cur?cur.start:'08:30';d.end=cur?cur.end:'09:15';d.coach=cur?cur.coach:defaultCoach(d.lane);d.isEdit=!!cur}
 const chipsFor=cl=>{const secs=CLASS_SECS[cl].map(x=>cl+x);const all=secs.every(x=>d.targets.includes(x));
  return`<div class="row" style="gap:5px;margin-bottom:5px"><b class="sm" style="width:58px">Class ${cl}</b><button class="chip ${all?'on':''}" data-a="ttall" data-c="${cl}">All</button>${secs.map(x=>`<button class="chip ${d.targets.includes(x)?'on':''}" data-a="tttgt" data-t="${x}">${x}</button>`).join('')}</div>`};
 openModal(`<div class="mh"><h3>${d.isEdit?'Edit':'Add'} session${d.mode==='date'?' · '+fds(ui.date):' · '+DOW[ui.ttd]}</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2">
 <div class="grid g2"><div class="fld"><label class="f" for="tt_l">Activity area</label><select id="tt_l" data-tt="lane">${LANES.map(l=>`<option value="${l.id}" ${l.id===d.lane?'selected':''}>${h(l.name)} (${CATS[l.cat].m})</option>`).join('')}</select></div>
 <div class="fld"><label class="f" for="tt_c">Coach / teacher</label><select id="tt_c">${[...new Set([d.coach,defaultCoach(d.lane),...myCoachNames()])].filter(Boolean).map(n=>`<option ${n===d.coach?'selected':''}>${h(n)}</option>`).join('')}</select></div>
 <div class="fld"><label class="f" for="tt_s">Start</label><input type="time" id="tt_s" value="${d.start}"></div><div class="fld"><label class="f" for="tt_e">End</label><input type="time" id="tt_e" value="${d.end}"></div></div>
 <label class="f">Classes</label>${Object.keys(CLASS_SECS).map(chipsFor).join('')}
 <div class="row" style="gap:5px"><b class="sm" style="width:58px">Pre-primary</b>${SECTIONS.filter(x=>typeof secClass(x)==='string').map(x=>`<button class="chip ${d.targets.includes(x)?'on':''}" data-a="tttgt" data-t="${x}">${x}</button>`).join('')}</div></div>
 <div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" data-a="savett">Save session</button></div>`,true);
}

/* boot */
(function boot(){
 document.getElementById('logo').innerHTML=LOGO;
 loadUi();
 if(!loadState())initState();
 ENRV++;STRUCT++;
 bootDate();
 if(!location.hash&&ui.me.role==='coach')ui.route='attendance';
 if(location.hash){const x=location.hash.slice(1);if(ROUTES.some(r=>r[0]===x))ui.route=x}
 render();
 save();
})();

</script></body></html>
