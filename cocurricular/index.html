<style>:root{
  /* Palette from the FIS logo. Layout: fixed navy rail + light work surface, cards for each task. */
  --navy:#1B3156; --navy2:#14233F; --navy3:#243d69;
  --mag:#E91D69; --mag-d:#C9135A; --mag-t:#FDE8F0;
  --pur:#572686; --pur-t:#EFE8F6;
  --amb:#EFA11D; --amb-t:#FDF1DC;
  --sky:#2B9BD6; --sky-l:#68C0EA; --sky-t:#E4F4FC;
  --ok:#1E9E6A; --ok-t:#E3F5EC; --bad:#D93A4B; --bad-t:#FCE9EB;
  --bg:#F3F5FA; --card:#fff; --ink:#18223A; --mut:#667391; --line:#E2E7F0; --line2:#EEF1F7;
  --r:14px; --sh:0 1px 2px rgba(20,35,63,.05),0 6px 20px rgba(20,35,63,.06);
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;height:100%}
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#cfd8ec;display:flex;flex-direction:column;padding:18px 12px;position:relative;overflow:auto}
.side:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--mag) 0 25%,var(--amb) 25% 50%,var(--sky-l) 50% 75%,var(--pur) 75%)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand span{font-size:11px;color:#9fb0d3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c3cde4;text-decoration:none;font-weight:600;font-size:13.5px;border-left:3px solid transparent}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(233,29,105,.16);color:#fff;border-left-color:var(--mag)}
.nav .cnt{margin-left:auto;background:var(--mag);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.nav h6{margin:16px 12px 6px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#7d8fb6;font-weight:700}
.sidefoot{margin-top:auto;padding:14px 8px 10px;font-size:11px;color:#8294bb}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 26px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.top h1{font-size:19px;color:var(--navy)}
.top .sub{color:var(--mut);font-size:12.5px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;cursor:pointer}
.ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--mag),var(--pur));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who small{display:block;color:var(--mut);font-size:11px;line-height:1.1}
.who b{font-size:12.5px;line-height:1.2}
#view{flex:1;overflow:auto;padding:22px 26px 60px}
.banner{display:flex;gap:10px;align-items:center;background:var(--amb-t);border:1px solid #f4d9a4;color:#7a5410;padding:9px 14px;border-radius:12px;margin-bottom:16px;font-size:12.5px}
.banner b{color:#5d3f08}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:14.5px;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .hint{margin-left:auto;font-weight:500;color:var(--mut);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}
.mt{margin-top:16px}.mb{margin-bottom:16px}

.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--navy);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;width:100%;font-size:13px}
textarea{resize:vertical;min-height:58px}
label.f{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:5px;letter-spacing:.2px}
.fld{margin-bottom:12px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-t);color:#127a50}.pill.bad{background:var(--bad-t);color:#b3202f}
.pill.amb{background:var(--amb-t);color:#8a5a06}.pill.sky{background:var(--sky-t);color:#17719f}
.pill.pur{background:var(--pur-t);color:var(--pur)}.pill.grey{background:#EEF1F7;color:#5a6783}
.pill.mag{background:var(--mag-t);color:var(--mag-d)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:#EEF1F7;color:#4d5a78}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--navy))}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase}
.kpi .v{font-size:27px;font-weight:800;color:var(--navy);margin:3px 0 1px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--mut)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd;position:sticky;top:0;z-index:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#fafbfe}
.tbl .r{text-align:right}
.tbl th.sortable{cursor:pointer}
.scroll{overflow:auto;max-width:100%}
.scroll.tall{max-height:520px}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:12.5px}
.bar .t{height:10px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;background:var(--c,var(--navy))}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--mag)}

.datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.datebar .big{font-size:17px;font-weight:800;color:var(--navy)}
.week{display:flex;gap:6px;flex-wrap:wrap}
.week button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;min-width:66px;text-align:center}

.week button span{font-size:10.5px;color:var(--mut)}

.week button.on b,.week button.on span{color:#fff}
.week button.hol{border-color:#f0b9c5;background:var(--bad-t)}
.week button.hol.on{background:var(--bad)}

.srow{display:grid;grid-template-columns:96px 140px minmax(90px,1.1fr) minmax(110px,1fr) 150px 150px 24px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;background:#fff}
.srow:hover{background:#fafbfe}

.lane{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.lane i{width:10px;height:10px;border-radius:3px;background:var(--c)}

.catbar{display:flex;align-items:center;gap:10px;padding:9px 14px;color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.3px;border-radius:12px 12px 0 0}
.listcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:var(--sh)}

.prog{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--ok)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:11px;height:11px;border-radius:3px;display:block}

/* drawer */
#ov,#md{position:fixed;inset:0;background:rgba(14,24,45,.5);display:none;z-index:50;backdrop-filter:blur(2px)}
#ov.on{display:flex;justify-content:flex-end}

.modal{margin:auto;width:min(620px,calc(100% - 24px));max-height:calc(100% - 28px);background:#fff;border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}

.dh{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;flex:none}
.dh h2{font-size:19px;color:var(--navy)}
.db{flex:1;overflow:auto;padding:18px 22px 30px}
.df{background:#fff;border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;align-items:center;flex:none;flex-wrap:wrap}
.mh{padding:18px 22px 10px;display:flex;align-items:center;gap:10px}.mh h3{font-size:17px;color:var(--navy)}
.mb2{padding:6px 22px 18px;overflow:auto}
.mf{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:var(--mut);padding:2px 8px;border-radius:8px}

.stu{display:grid;grid-template-columns:30px minmax(150px,1.4fr) minmax(60px,.6fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line2)}

.sts{display:flex;gap:4px}

.stu.auto{background:#fff7f8}

.summ{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.summ .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 13px;font-weight:700;font-size:12px;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.seg button.on.ok{background:var(--ok)}.seg button.on.bad{background:var(--bad)}.seg button.on.amb{background:var(--amb)}
.stars{display:inline-flex;gap:3px}
.stars button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:#8793ad}
.stars button.on{background:var(--amb);border-color:var(--amb);color:#fff}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.note{background:var(--sky-t);border:1px solid #bfe3f5;color:#15597f;border-radius:10px;padding:9px 12px;font-size:12.5px}
.note.warn{background:var(--amb-t);border-color:#f2d7a1;color:#7a5410}
.note.bad{background:var(--bad-t);border-color:#f2b9c0;color:#992030}

/* heat grid */
.heat{display:grid;gap:3px;font-size:11.5px;min-width:760px}
.heat .h{font-weight:700;color:var(--mut);text-align:center;padding:4px 2px;font-size:10.5px;text-transform:uppercase}
.heat .rl{font-weight:800;color:var(--navy);padding:6px 4px}
.heat .c{border:0;border-radius:7px;padding:6px 0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;background:#E9EDF5}
.heat .c.e{color:#b8c1d6;background:#F3F5FA;cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}

/* day chart */
.chart3{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.ch{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
.ch h4{color:#fff;padding:11px 14px;font-size:13px;letter-spacing:.3px}

.ch th{background:#EEF1F7;font-size:11px;color:#4d5a78;padding:7px 6px;text-transform:uppercase;letter-spacing:.4px}
.ch td{border-top:1px solid var(--line2);padding:7px 6px;vertical-align:top;text-align:center;font-size:12px}
.ch td.t{background:#F6F8FC;font-weight:700;color:var(--navy);white-space:nowrap;font-size:11.5px;width:78px}
.ch td.lunch{background:var(--amb-t);color:#8a5a06;font-weight:800;letter-spacing:1.5px;font-size:11px;text-align:center}
.cell{display:inline-block;margin:2px;padding:4px 8px;border-radius:9px;background:var(--tint);border:1px solid var(--bd);min-width:44px;cursor:pointer}
.cell b{display:block;font-size:15px;color:var(--navy);line-height:1.15}
.cell small{display:block;font-size:10px;color:#5d6a88;line-height:1.2}
.cell .st{font-size:10px;font-weight:800;display:block;margin-top:2px}
.imgbox img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.drop{border:2px dashed #c6d0e4;border-radius:12px;padding:22px;text-align:center;color:var(--mut);background:#fafbfe}

.toasts{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{padding:34px;text-align:center;color:var(--mut)}
.spark{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}

.parentbox{background:linear-gradient(135deg,#fff,#faf6fc);border:1px solid #e3d6f0;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}

@media (max-width:980px){

  .dh,.db,.df{padding-left:14px;padding-right:14px}
}

.vasbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-right:10px}.vasbox select{width:auto;max-width:210px;padding:6px 8px;font-size:12.5px}
.vasbox.on{background:#EEF4FF;border:1px solid #c9d8f5;border-radius:10px;padding:5px 10px;color:#1B3156}
.thumb{position:relative;display:inline-block}.thumb img{height:54px;border-radius:8px;border:1px solid var(--line)}.thumb .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#D93A4B;color:#fff;cursor:pointer;font-size:13px;line-height:20px;padding:0}
details.tmr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fff}details.tmr summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
@media(max-width:640px){.vasbox span{display:none}.vasbox select{max-width:130px}}
.drawer .tabs{overflow-x:auto;white-space:nowrap;flex-wrap:nowrap;scrollbar-width:none}.drawer .tabs button{flex:none}
.grow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:10px 0;border-bottom:1px solid var(--line)}.grow .gn{display:flex;flex-direction:column;min-width:120px;flex:1}.grow .gt{display:flex;flex-direction:column;font-size:11px;color:var(--mut);font-weight:700;gap:3px}.grow .gt input{width:136px}.grow .gb{display:flex;gap:6px}
.cxbar{background:#f1f3f8;border-color:#d5dae6}
.cell.cxd{--tint:#eef0f5!important;--bd:#c9cfdc!important;opacity:.75}.cell.cxd b{text-decoration:line-through;color:#6b778c}
.tile.cxt{background:#f1f3f8;opacity:.85}.tile.cxt .tt{color:#6b778c;text-decoration:line-through}
.pill.cxl{background:#e4e8f0;color:#566178}
.seg button.on.cxon{background:#6b778c}
.cxg{margin-bottom:12px}.cxr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.cxr.dn{opacity:.7}.cxr label{flex:1;min-width:160px}.cxr input[type=checkbox]{width:20px;height:20px}.cxpad{width:20px}
.bdgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bdg{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:99px;color:var(--c,#566178);border:1px solid var(--c,#566178);background:#fff;white-space:nowrap}
.bdg.tm{--c:#572686}.bdg.bst{--c:#B7791F;background:#FFF6DD}.bdg.ac{--c:#0E8A7D;background:#E0F4F1}
.tagl{color:var(--mut);font-weight:700;text-decoration:none}
.pcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.lsl{margin-top:10px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px;background:#fff;flex-wrap:wrap}
.pchip a{color:var(--navy);font-weight:700;text-decoration:none}.pchip small{color:var(--mut);margin-left:5px;font-weight:600}
.pchip .bdgs{margin:0}.x2{border:0;background:#eef0f5;border-radius:99px;width:22px;height:22px;cursor:pointer;font-weight:800;color:#566178}
.rtt th.now,.rtt td.now{background:#F0F6FF}
.rch{display:inline-flex;flex-direction:column;align-items:flex-start;text-decoration:none;font-size:12px;font-weight:800;border:1.5px solid var(--c);color:var(--c);border-radius:8px;padding:3px 8px;margin:2px;background:#fff}
.rch small{font-weight:600;color:var(--mut);font-size:10px}.rch.held{background:var(--c);color:#fff}.rch.held small{color:#fff9}
.rch.plan{border-style:dashed}.rch.cx{--c:#9AA5B8;text-decoration:line-through}

   const r=R();
   if(r<.045){s.status='notheld';s.reason='Coach absent';return}
   if(r<.075){s.status='notheld';s.reason=R()<.5?'Exam / school event':'Ground or room not available';return}
   s.status='held';
   const late=R()<.3?Math.floor(R()*10)+2:0;
   const st0=mins(s.start)+late,en0=mins(s.end)-(R()<.15?4:0);
   const tm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
   s.lp.actual={start:tm(st0),end:tm(en0)};
   const P=POOL[s.lane]||POOL._;
   if(R()<.78){s.lp.title=pick(R,P.title||POOL._.title);s.lp.plan={};(PLAN[s.lane]||[]).forEach(([k])=>{if(P[k])s.lp.plan[k]=pick(R,P[k])})}
   if(R()<.72){s.lp.followed=R()<.7?'yes':(R()<.6?'partly':'no');s.lp.taught=(s.lp.title||'Class activity')+(s.lp.followed==='yes'?' completed as planned.':' covered in part.')}
   expected(s).forEach(id=>{
    if(day.absent[id])return;
    const bad=skippers.has(id)?.35:0;const x=R();let m='P';
    if(x<bad)m='N';else if(x<bad+.025)m='S';else if(x<bad+.045)m='I';else if(x<bad+.065)m='N';else if(x<bad+.075)m='L';
    s.marks[id]=[m,'coach',s.coach,date+' '+tm(st0+6)];
   });
   s.sub={by:s.coach,ts:date+' '+tm(en0+4)};
   if(R()<.2&&LANE[s.lane].mode!=='x'){
    const sc=OBS_LANE[s.lane]||OBS_LANE._;const o={id:uid(),by:R()<.5?'Manager':'Director',role:R()<.5?'manager':'director',ts:date+' 11:20',ratings:{},flags:{},stage:pick(R,STAGES),remark:'',action:'',done:false};
    const g=R()<.72;
    [...OBS_BASE,...sc.r].forEach(([k])=>o.ratings[k]=g?3+Math.floor(R()*3):1+Math.floor(R()*4));
    [...OBS_FLAGS,...sc.f].forEach(([k])=>o.flags[k]=R()<(g?.88:.4)?'y':'n');
    o.remark=pick(R,g?REM.good:REM.bad);
    if(!g&&R()<.6){o.action='Discuss with coach and revisit next session';o.done=R()<.4}
    s.obs.push(o);
   }
  });
 });
}

/* Real attendance: Activity Attendance PDF, 12 to 21 Nov 2026. 1 = present. 0 = did not attend (reason not in the report). */
function importAtt(){
 idx();
 const D=[];for(let i=12;i<=21;i++)D.push('2026-11-'+pad(i));
 const grp={};
 ATT.forEach(([sid,a,f])=>{const st=_stM[sid];if(!st)return;for(let k=0;k<10;k++)(grp[a+'|'+k]=grp[a+'|'+k]||[]).push([sid,st.sec,f[k]==='1'])});
 Object.keys(grp).sort().forEach(key=>{
  const[a,ks]=key.split('|');const rows=grp[key];
  const secs=[...new Set(rows.filter(r=>r[2]).map(r=>r[1]))];if(!secs.length)return;
  secs.sort((x,y)=>SECTIONS.indexOf(x)-SECTIONS.indexOf(y));
  const date=D[+ks];
  if(!S.days[date])S.days[date]={absent:{},note:'',holiday:'',image:null,init:true,ids:[]};
  const s=addSession(date,{lane:ACT[a].lane,targets:secs,start:'00:00',end:'00:00',acts:[a],coach:''});
  s.status='held';s.imp=true;s.sub={by:'Imported report',ts:'2026-11-22'};
  rows.forEach(r=>{if(secs.includes(r[1]))s.marks[r[0]]=[r[2]?'P':'N','import','Imported report','2026-11-22 00:00',r[2]?'':'Not present. Reason not in the report.']});
 });
 STRUCT++;
}

function sessPill(s){
 const ss=sstate(s);
 if(ss==='held')return`<span class="pill ok">Held</span>`;
 if(ss==='notheld')return`<span class="pill grey cxl">Class cancelled · ${h(reasonOf(s))}</span>`;
 if(ss==='pending')return`<span class="pill amb">Not recorded</span>`;
 if(ss==='today')return`<span class="pill sky">Today</span>`;
 return`<span class="pill grey">Upcoming</span>`;
}
function stPill(k){return`<span class="pill ${ST[k].pill}">${ST[k].l}</span>`}
function dotColor(s){const ss=sstate(s);if(ss==='held'){const t=tally(s);const r=t.marked?t.P/t.marked:1;return r>=.85?'#1E9E6A':r>=.6?'#EFA11D':'#D93A4B'}return ss==='notheld'?'#9AA5B8':ss==='pending'?'#EFA11D':'#CBD3E3'}
function dotTitle(s){const ss=sstate(s);const t=tally(s);return`${fd(s.date)} · `+(ss==='held'?`Held, ${t.P}/${t.marked} present`:ss==='notheld'?`Class cancelled: ${reasonOf(s)}`:ss==='pending'?'Not recorded':'Upcoming')}
function lastDots(s,n=4){
 const l=lastSessions(s,n).reverse();
 if(!l.length)return'<span class="xs mut">first on record</span>';
 return`<span class="dots">${l.map(x=>`<i style="background:${dotColor(x)}" title="${h(dotTitle(x))}"></i>`).join('')}</span>`;
}
function groupCounts(s){
 const lane=LANE[s.lane];if(lane.mode!=='enrol')return'';
 const c={};expected(s).forEach(id=>{const e=activeEnr(id,s.date,lane.acts);if(e){const k=ACT[e.act].s;c[k]=(c[k]||0)+1}});
 const order=lane.acts.map(a=>ACT[a].s);const parts=Object.entries(c).sort((x,y)=>order.indexOf(x[0])-order.indexOf(y[0])).map(([k,v])=>`${k}-${v}`);
 if(!parts.length&&s.lane==='fitness'&&typeof secClass(s.targets[0])==='string')return'Wushu, Karate';
 return parts.join(', ');
}

}

function weekStrip(){
 const d=pd(ui.date);const k=(d.getDay()+6)%7;const mon=addDays(ui.date,-k);
 return`<div class="week">${[0,1,2,3,4,5].map(i=>{const x=addDays(mon,i);const day=S.days[x];const has=S.template[wd(x)]||(day&&day.ids&&day.ids.length);const n=has?sessionsOn(x).length:0;const hol=day&&day.holiday;
  return`<button class="${x===ui.date?'on':''} ${hol?'hol':''}" data-a="setdate" data-d="${x}"><b>${DOW[wd(x)]} ${pd(x).getDate()}</b><span>${hol?'Holiday':n?n+' classes':'No chart'}</span></button>`}).join('')}</div>`;
}

}

ui.dc={mode:'chart',parent:false};
function dayText(date){
 const ss=sessionsOn(date);let out=`*Co-curricular schedule · ${fd(date)}*\n`;
 [1,2,3].forEach(c=>{
  const l=ss.filter(s=>LANE[s.lane].cat===c);if(!l.length)return;
  out+=`\n*${CATS[c].n}* (${CATS[c].m})\n`;
  l.forEach(s=>{const g=groupCounts(s);out+=`${tr(s.start,s.end)}  ${LANE[s.lane].name}: Class ${targetLabel(s.targets)}${g&&LANE[s.lane].mode==='enrol'?' ('+g+')':''}\n`});
 });
 return out;
}

const ST_ALIAS={p:'P',present:'P',a:'A',absent:'A',s:'S',sick:'S',ic:'I',i:'I','in class':'I',l:'L',leave:'L',n:'N',skipped:'N',d:'D','on duty':'D',duty:'D','did not attend':'N'};
function importCsv(){
 const rows=$('#csvin').value.split(/\n/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^date\s*,/i.test(x));
 let ok=0,bad=[],nh=0;
 rows.forEach((line,i)=>{
  const c=line.split(',').map(x=>x.trim());const[date,cls,act,name,stt,rem]=c;
  const lane=LANE_ALIAS[(act||'').toLowerCase()];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')||!lane||!cls){bad.push(`Row ${i+1}: check date, class and activity`);return}
  ensureDay(date);
  const sec=cls.toUpperCase().replace(/\s+/g,'');
  const sessions=sessionsOn(date).filter(s=>s.lane===lane&&s.targets.includes(sec));
  if(!sessions.length){bad.push(`Row ${i+1}: no ${act} session for ${cls} on ${date} in the timetable`);return}
  if(!name){
   if((stt||'').toUpperCase().replace(/\s/g,'')==='NOTHELD'){sessions.forEach(s=>{s.status='notheld';s.reason=NOTHELD.includes(rem)?rem:(rem||'Other');nh++})}
   else bad.push(`Row ${i+1}: student missing`);return;
  }
  const stc=ST_ALIAS[(stt||'').toLowerCase()];
  const stu_=S.students.find(s=>s.sec===sec&&s.n.toLowerCase()===name.toLowerCase());
  if(!stc||!stu_){bad.push(`Row ${i+1}: ${!stu_?'student not found in '+cls:'status not recognised'}`);return}
  const s=sessions.find(x=>expected(x).includes(stu_.id))||sessions[0];
  s.status='held';s.marks[stu_.id]=[stc,'import','Import',date+' 00:00',rem||''];ok++;
 });
 S.demo=S.demo;save();MUT++;
 ui.csvIn=bad.length?$('#csvin').value:'';ui.csvMsg=`<b style="color:var(--ok)">${ok} marks</b> and ${nh} not-held classes imported.${bad.length?` <span style="color:var(--bad)">${bad.length} problems:</span> ${bad.slice(0,6).map(h).join('; ')}`:''}`;
}

function posterHtml(ss,par,date,day){
 if(ss.some(s=>s.lane==='clubs'))return'';
 /* place every session on a row of its category grid */
 const place={};
 for(const s of ss){
  const g=PG[LANE[s.lane].cat];if(!g.lanes.includes(s.lane))return'';
  const slots=g.idx?g.idx.map((ri,k)=>[ri,g.rows[k]]):g.rows.map((r,ri)=>[ri,r]).filter(x=>x[1]);
  let hit=slots.find(([ri,r])=>r[0]<=s.start&&s.start<r[1]);
  if(!hit)hit=slots.find(([ri,r])=>r[0]>=s.start&&mins(r[0])-mins(s.start)<=30);
  if(!hit)return'';
  (place[LANE[s.lane].cat+'|'+hit[0]+'|'+s.lane]=place[LANE[s.lane].cat+'|'+hit[0]+'|'+s.lane]||[]).push([s,hit[1]]);
 }
 const cellP=(c,ri,l)=>(place[c+'|'+ri+'|'+l]||[]).map(([s,r])=>{
  const g=groupCounts(s);const odd=r[0]!==s.start||r[1]!==s.end;
  return`<div class="pc" ${par?'':`data-a="opensess" data-id="${h(s.id)}"`}><b>${h(targetLabel(s.targets))}</b>${g?`<small>(${h(g)})</small>`:''}${odd?`<i>(${per(s.start,s.end)})</i>`:''}</div>`}).join('');
 let head1='',head2='',body='';
 [1,2,3].forEach(c=>{const g=PG[c];head1+=`<th colspan="${g.lanes.length+1}" style="background:${g.c}">${h(g.head)}</th>`;
  head2+=`<th class="tm">Time</th>`+g.lanes.map(l=>`<th style="background:${g.c}">${h(LANE[l].short)}</th>`).join('')});
 const covered={1:{},2:{},3:{}};
 for(let ri=0;ri<10;ri++){
  const lunch=ri===5;let tr_='<tr>';
  [1,2,3].forEach(c=>{const g=PG[c];
   if(lunch){tr_+=`<td class="tm lun">11:30-12:00</td>`+g.lanes.map(()=>`<td class="lunch">LUNCH</td>`).join('');return}
   const k=ri<5?ri:ri-1;
   if(covered[c][ri])return;
   let r=null,span=1;
   if(g.idx){const j=g.idx.indexOf(k);r=j>=0?g.rows[j]:null;span=r&&r[2]||1;if(j<0&&ri!==5&&!g.idx.some((x,jj)=>x<k&&x+((g.rows[jj][2])||1)>k)){r=null}}
   else r=g.rows[k]||null;
   if(span>1){for(let q=1;q<span;q++)covered[c][ri+q+(ri<5&&ri+q>=5?1:0)]=1}
   const rs=span>1?` rowspan="${span+(ri<5&&ri+span>5?1:0)}"`:'';
   tr_+=`<td class="tm"${rs}>${r?per(r[0],r[1]):''}</td>`+g.lanes.map(l=>`<td${rs} style="background:${l==='events'?'#FDE8D8':g.tint}">${cellP(c,k,l)}</td>`).join('');
  });
  body+=tr_+'</tr>';
 }
 const dn=DOW[wd(date)];const dd=pd(date);
 const title=`CO-CURRICULAR CLASS SCHEDULE — ${['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][wd(date)]}, ${dd.getDate()} ${['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][dd.getMonth()]} ${dd.getFullYear()}${day.note?' ('+h(day.note.toUpperCase())+')':''}`;
 return`<div class="poster"><div class="pt">${title}</div><div class="scroll"><table class="pt-tbl"><thead><tr>${head1}</tr><tr>${head2}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}

 return`<div class="note mb">Set the slots, times and options. Times and names can be changed any time; past attendance keeps its record.</div>`+S.ac.slots.map((sl,si)=>`<div class="card mb"><div class="row mb" style="gap:8px"><input type="text" data-acs="${si}" data-k="name" value="${h(sl.name)}" style="flex:1"><input type="time" data-acs="${si}" data-k="start" value="${sl.start}"><span>to</span><input type="time" data-acs="${si}" data-k="end" value="${sl.end}"><button class="btn sm dan" data-a="acdelslot" data-v="${si}">Remove slot</button></div>

function acUpModal(){openModal(`<div class="mh"><h3>Upload academy student list</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><p class="sm mut">One child per line: Student name, Class and section, Option. Paste from Excel, or choose a CSV file.</p><input type="file" id="acfile" accept=".csv,.txt"><textarea id="actext" rows="9" placeholder="Aarav Sharma, 7B, Guitar&#10;Riya Singh, 5A, Cricket"></textarea><div id="acres" class="sm mt"></div></div><div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" data-a="acupsave">Add to academy</button></div>`,true)}
const nrm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function acUpSave(){
 const txt=$('#actext').value;let ok=0,dup=0,newS=0;const bad=[];
 const optBy={};S.ac.slots.forEach(sl=>sl.opts.forEach(op=>{optBy[nrm(op.n)]=[sl.id,op.id]}));
 const byName={};S.students.forEach(s=>{(byName[nrm(s.n)+'|'+nrm(s.sec)]=byName[nrm(s.n)+'|'+nrm(s.sec)]||[]).push(s)});
 txt.split(/\r?\n/).map(l=>l.split(/\t|,|;/).map(x=>x.trim())).filter(c=>c.length>=3&&c[0]).forEach((c,i)=>{
  if(/^student|^name$/i.test(c[0]))return;
  const o=optBy[nrm(c[2])];if(!o){bad.push(c.join(' · ')+' (option not found)');return}
  let st=(byName[nrm(c[0])+'|'+nrm(c[1])]||[])[0];
  if(!st){const cand=S.students.filter(s=>nrm(s.n)===nrm(c[0]));if(cand.length===1)st=cand[0]}
  if(!st){const sec=SECTIONS.find(x=>nrm(x)===nrm(c[1]));if(!sec){bad.push(c.join(' · ')+' (class not found)');return}const id='N'+uid();st={id,n:c[0],sec};S.students.push(st);ENRV++;STRUCT++;newS++}
  if(S.ac.enr.some(e=>e.sid===st.id&&e.slot===o[0]&&e.opt===o[1])){dup++;return}
  S.ac.enr.push({sid:st.id,slot:o[0],opt:o[1]});ok++});
 save();
 if(bad.length){$('#acres').innerHTML=`<b>${ok} added${dup?', '+dup+' already listed':''}${newS?', '+newS+' new children created':''}.</b> These lines need a fix:<br>${bad.slice(0,15).map(h).join('<br>')}`;render();return}
 closeModal();toast(`${ok} added${newS?' ('+newS+' new children)':''}`);render();
}
function acAddModal(){openModal(`<div class="mh"><h3>Add a child to the academy</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><div class="fld"><label class="f">Student (type name)</label><input type="text" id="ac_s" list="ac_dl" autocomplete="off"><datalist id="ac_dl">${S.students.slice(0,2000).map(s=>`<option value="${h(s.n)} · ${h(s.sec)}">`).join('')}</datalist></div><div class="fld"><label class="f">Option</label><select id="ac_o">${S.ac.slots.map(sl=>`<optgroup label="${h(sl.name)}">${sl.opts.map(op=>`<option value="${sl.id}|${op.id}">${h(op.n)}</option>`).join('')}</optgroup>`).join('')}</select></div></div><div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" data-a="acaddsave">Add</button></div>`)}
function acClick(a,t){
 acInit();const d=ui.date;
 switch(a){
  case'actab':ui.acT=t.dataset.t;render();return true;
  case'acslot':ui.acS=t.dataset.v;ui.acO='';render();return true;
  case'acopt':ui.acO=t.dataset.v;render();return true;
  case'acmark':{const r=acRec(d,ui.acS,ui.acO,true);if(r.sub&&!can.reopen())return true;const id=t.dataset.s,v=t.dataset.v;if(r.marks[id]&&r.marks[id][0]===v)delete r.marks[id];else r.marks[id]=[v,(r.marks[id]||[])[1]||'',ui.me.name,nowIso()];save();render();return true}
  case'acnote':{const r=acRec(d,ui.acS,ui.acO,true);const id=t.dataset.s;const x=prompt?null:null;const m=r.marks[id]||['P','',ui.me.name,nowIso()];const row=t.closest('.stu');if(row.querySelector('.notein'))return true;const inp=document.createElement('input');inp.type='text';inp.className='notein acn';inp.value=m[1]||'';inp.placeholder='Remark';inp.dataset.s=id;inp.style.gridColumn='1/-1';row.appendChild(inp);inp.focus();return true}
  case'acall':{const r=acRec(d,ui.acS,ui.acO,true);acEnrolled(ui.acS,ui.acO).forEach(id=>{if(!r.marks[id])r.marks[id]=['P','',ui.me.name,nowIso()]});save();render();return true}
  case'acsub':{const r=acRec(d,ui.acS,ui.acO,true);const n=acEnrolled(ui.acS,ui.acO).filter(i=>!r.marks[i]).length;if(n&&!confirm(n+' children are not marked. Submit anyway?'))return true;r.sub=1;r.by=ui.me.name;r.ts=nowIso();save();render();toast('Academy attendance submitted');return true}
  case'acreopen':{const r=acRec(d,ui.acS,ui.acO,true);r.sub=0;save();render();return true}
  case'acup':acUpModal();return true;
  case'acupsave':acUpSave();return true;
  case'acadd':acAddModal();return true;
  case'acaddsave':{const nm=$('#ac_s').value.split(' · ');const st=S.students.find(s=>s.n===nm[0]&&(!nm[1]||s.sec===nm[1]));if(!st){toast('Pick the child from the list');return true}const[sl,op]=$('#ac_o').value.split('|');if(!S.ac.enr.some(e=>e.sid===st.id&&e.slot===sl&&e.opt===op))S.ac.enr.push({sid:st.id,slot:sl,opt:op});save();closeModal();render();return true}
  case'acrem':{t.dataset.s&&(S.ac.enr=S.ac.enr.filter(e=>!(e.sid===t.dataset.s&&e.slot===t.dataset.sl&&e.opt===t.dataset.o)));save();render();return true}
  case'acaddopt':{const sl=S.ac.slots[+t.dataset.v];sl.opts.push({id:'X'+uid(),n:'New option',g:sl.opts[0]?sl.opts[0].g:'Option',coach:''});save();render();return true}
  case'acdelopt':{const sl=S.ac.slots[+t.dataset.sl];const op=sl.opts[+t.dataset.v];if(acEnrolled(sl.id,op.id).length&&!confirm('Children are listed in this option. Remove it and their listing?'))return true;S.ac.enr=S.ac.enr.filter(e=>!(e.slot===sl.id&&e.opt===op.id));sl.opts.splice(+t.dataset.v,1);save();render();return true}
  case'acaddslot':S.ac.slots.push({id:'s'+uid(),name:'New academy slot',start:'17:45',end:'18:30',opts:[]});save();render();return true;
  case'acdelslot':{if(!confirm('Remove this slot and its student lists?'))return true;const sl=S.ac.slots[+t.dataset.v];S.ac.enr=S.ac.enr.filter(e=>e.slot!==sl.id);S.ac.slots.splice(+t.dataset.v,1);save();render();return true}
 }
 return false;
}
function acChange(t){
 if(t.dataset.ac){const r=acRec(ui.date,ui.acS,ui.acO,true);r[t.dataset.ac]=t.value;save();return true}
 if(t.classList.contains('acn')){const r=acRec(ui.date,ui.acS,ui.acO,true);const id=t.dataset.s;const m=r.marks[id]||['P','',ui.me.name,nowIso()];m[1]=t.value;r.marks[id]=m;save();render();return true}
 if(t.dataset.acs!==undefined&&t.dataset.acs!==''){S.ac.slots[+t.dataset.acs][t.dataset.k]=t.value;save();return true}

ui.rp={scope:'morning',by:'activity',q:''};
function rpRecs(a,b){
 const out=[];
 if(ui.rp.scope!=='academy'){
  sessionsInRange(a,b).filter(s=>sstate(s)==='held').forEach(s=>{
   expected(s).forEach(id=>{const m=effMark(s,id);if(!m)return;const st=stu(id);const lr=s.learn&&s.learn[id];
    out.push({k:'m',sess:s.id,date:s.date,sid:id,n:st.n,sec:st.sec,cls:String(secClass(st.sec)),act:actName(s),coach:s.coach||'Not set',st:m.st,note:m.note,lr:lr&&lr.r?Object.values(lr.r):[],plan:!!(s.lp&&(s.lp.title||Object.values(s.lp.plan||{}).some(Boolean)))})})});
 }
 if(ui.rp.scope!=='morning'){
  acInit();acClasses(a,b).forEach(c=>Object.entries(c.rec.marks).forEach(([id,m])=>{const st=stu(id);if(!st)return;
   out.push({k:'a',sess:'ac'+c.date+c.slot+c.opt,date:c.date,sid:id,n:st.n,sec:st.sec,cls:String(secClass(st.sec)),act:c.op.n+' (Academy)',coach:c.coach||'Not set',st:m[0],note:m[1],lr:[],plan:!!c.plan})}))}
 return out;
}
function rpGroup(recs,by){
 const key={student:r=>r.sid,section:r=>r.sec,class:r=>'Class '+r.cls,activity:r=>r.act,coach:r=>r.coach,date:r=>r.date}[by];
 const g={};recs.forEach(r=>{const k=key(r);const x=g[k]=g[k]||{k,label:by==='student'?r.n+' ('+r.sec+')':by==='date'?fd(r.date):k,n:0,P:0,sess:new Set(),plans:new Set(),g:0,lw:0,lt:0,notes:0,dates:new Set()};
  x.n++;if(r.st==='P')x.P++;x.sess.add(r.sess);x.dates.add(r.date);if(r.plan)x.plans.add(r.sess);if(r.note)x.notes++;r.lr.forEach(v=>{x.lt++;x.g+=v==='g'?1:v==='a'?.5:0});});
 return Object.values(g).sort((p,q)=>by==='date'?p.k.localeCompare(q.k):by==='student'||by==='section'?String(p.label).localeCompare(String(q.label),undefined,{numeric:true}):q.n-p.n);
}

function dashAcademy(a,b,dc){
 acInit();let cl=acClasses(a,b);if(dc)cl=cl.filter(c=>c.coach===dc);
 const T=cl.reduce((x,c)=>{x.P+=c.t.P;x.n+=c.t.total;x.S+=c.t.S;x.L+=c.t.L;x.A+=c.t.A;return x},{P:0,n:0,S:0,L:0,A:0});
 if(!cl.length)return'<div class="card empty">No academy attendance in this period yet. Coaches mark it in Academy.</div>';
 const grp=(f,lab)=>{const m={};cl.forEach(c=>{const k=f(c);const x=m[k]=m[k]||{label:lab?lab(c):k,P:0,n:0,c:0};x.P+=c.t.P;x.n+=c.t.total;x.c++});return Object.values(m)};
 const byOpt=grp(c=>c.slot+c.opt,c=>c.op.n).map(x=>({label:x.label,v:pcn(x.P,x.n),c:'#572686',sub:x.c+' classes'})).sort((p,q)=>q.v-p.v);
 const byCoach=grp(c=>c.coach||'Not set').map(x=>({label:x.label,v:pcn(x.P,x.n),c:'#2B9BD6',sub:x.c+' classes'}));
 const byDate=grp(c=>c.date,c=>fd(c.date)).map(x=>({label:x.label,v:pcn(x.P,x.n),c:'#E8890C',sub:x.c+' classes'}));

function clAssign(sid,act,coach){

function clClick(a,t){
 switch(a){
  case'clco':ui.cl.coach=t.dataset.v;ui.cl.act='';ui.cl.q='';render();return true;
  case'clact':ui.cl.act=t.dataset.v;ui.cl.q='';render();return true;
  case'cladd':{const c=clCur();clAssign(t.dataset.s,ui.cl.act,c.name);log(`${stu(t.dataset.s).n} added to ${c.name} · ${ACT[ui.cl.act].n}`);save();toast('Added');render();return true}
  case'clun':{const e=S.enr.find(x=>x.id===t.dataset.id);if(e){delete e.coach;ENRV++;STRUCT++;log(`${stu(e.sid).n} unassigned from coach list`);save();render()}return true}
  case'cldrop':{const e=S.enr.find(x=>x.id===t.dataset.id);if(e)ask(`<p>Remove <b>${h(stu(e.sid).n)}</b> from ${h(ACT[e.act].n)}?</p>`,()=>{e.to=ui.date;ENRV++;STRUCT++;log(`${stu(e.sid).n} removed from ${ACT[e.act].n}`);save();render()},'Remove');return true}
  case'clbulk':openModal(`<div class="mh"><h3>Paste a list</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><p class="sm mut">One child per line: Student name, Class and section. They are added to <b>${h(ACT[ui.cl.act].n)}</b> for <b>${h(clCur().name)}</b>.</p><textarea id="cltext" rows="9" style="width:100%" placeholder="Aarav Sharma, 6A"></textarea></div><div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" data-a="clbulksave">Add</button></div>`);return true;
  case'clbulksave':{
   const c=clCur(),act=ui.cl.act;let ok=0;const bad=[];
   $('#cltext').value.split(/\r?\n/).map(l=>l.split(/\t|,|;/).map(x=>x.trim())).filter(r=>r[0]).forEach(r=>{

    clAssign(c1[0].id,act,c.name);ok++});
   log(`${ok} children added to ${c.name} · ${ACT[act].n}`);save();closeModal();render();

   return true}
 }
 return false;
}

 return false;

function migrate(){
 if(!S)return;
 S.fb=S.fb||[];S.lf=S.lf||{};S.work=S.work||{};
 S.staff=S.staff||{rt:{},rec:{}};S.staff.grp=S.staff.grp||{};S.staff.grt=S.staff.grt||{};S.staff.rt=S.staff.rt||{};S.staff.rec=S.staff.rec||{};
 if(!S.people||!S.people.length)S.people=JSON.parse(JSON.stringify(SEED_PEOPLE));
 else SEED_PEOPLE.forEach(p=>{const x=S.people.find(y=>y.name===p.name);if(!x)S.people.push(Object.assign({},p));else if(p.name==='Anahida'||p.name==='Saurabh')x.title=p.title});
 const oldOnly=S.coaches.length&&S.coaches.every(c=>OLD_COACH_NAMES.includes(c.name)&&!c.title);
 if(oldOnly){
  const old=S.coaches.map(c=>c.name);
  S.coaches=JSON.parse(JSON.stringify(SEED_COACHES));
  Object.values(S.sessions).forEach(x=>{if(old.includes(x.coach))x.coach=defaultCoach(x.lane)});
  Object.values(S.template).forEach(l=>l.forEach(x=>{if(old.includes(x.coach))x.coach=defaultCoach(x.lane)}));
  S.enr.forEach(e=>{if(old.includes(e.coach))delete e.coach});
  S.staff.rec={};
  ENRV++;STRUCT++;MUT++;
 }else S.coaches.forEach(c=>{if(!c.title)c.title=c.name;if(!c.acts)c.acts=[]});
 TG();
 if(S.ttv!==2){S.ttv=2;S.template=JSON.parse(JSON.stringify(SEED_TEMPLATE));regenFuture()}
 S.v=3;
}

/* ===== v3: class work per activity: assignment / book checking, tests, notes, diet chart, performance video ===== */
const CHK=[['c','✓','Checked','ok'],['i','IC','Incomplete','amb'],['n','NS','Not submitted','bad'],['a','A','Absent','grey']];
const classNo=sec=>{const c=secClass(sec);return typeof c==='number'?c:0};
function sessActs(s){
 if(s.acts&&s.acts.length)return s.acts;
 const l=LANE[s.lane];if(l.mode!=='enrol')return[];
 const set=new Set();expected(s).forEach(id=>{const e=activeEnr(id,s.date,l.acts);if(e)set.add(e.act)});return[...set];
}
function workKeys(s){
 const out=[];const cfg=k=>S.work&&S.work[k]!==undefined?S.work[k]:WORK_DEF[k];
 const acts=sessActs(s);
 if(acts.length)acts.forEach(a=>{const c=cfg(a)!==undefined?cfg(a):cfg(s.lane);(c||[]).forEach(k=>{if(!out.includes(k))out.push(k)})});
 else(cfg(s.lane)||[]).forEach(k=>out.push(k));
 return out;
}
function workItems(s){
 const top=Math.max(0,...s.targets.map(classNo));
 const only1=s.lane==='lang'&&top===1;  /* Class 1 foreign language: assignment checking only */
 return workKeys(s).filter(k=>WORK_ITEMS[k]&&(!only1||k==='asg')&&(!WORK_ITEMS[k].minClass||!top||top>=WORK_ITEMS[k].minClass)).map(k=>Object.assign({k},WORK_ITEMS[k]));
}
const workTabName=s=>workItems(s).some(i=>i.t==='chk'||i.t==='marks')?'Checking & notes':'Notes & files';
function wkRec(s,k){s.wk=s.wk||{};return s.wk[k]||(s.wk[k]={t:'',mx:'',att:[],link:'',r:{}})}
function wkTab(s){
 const items=workItems(s);if(!items.length)return'<div class="card empty">Nothing to check for this activity. Set it up in Setup, Class work items.</div>';
 const ids=expected(s).filter(id=>{const m=effMark(s,id);return !m||!['A','S','L','D'].includes(m.st)||true});
 const top=Math.max(0,...s.targets.map(classNo));
 let o=`<div class="note mb">${s.targets.some(t=>classNo(t)===1)&&workKeys(s).includes('book')?'<b>Class 1</b> has the assignment only. Book checking and tests start from <b>Class 2</b>. ':''}Tap a button for each child. A child marked <b>NS</b> or <b>IC</b> who submits later can be changed to ✓ and the date and time of the resubmission is kept.</div>`;
 items.forEach(it=>{

  const done=ids.filter(id=>r.r[id]).length;head+=`<span class="pill ${done===ids.length&&ids.length?'ok':'grey'}">${done} of ${ids.length}</span></div>`;

  if(it.att||it.t==='video')ctl+=`<div class="row mb"><button class="btn sm" data-a="wkpick" data-k="${it.k}">${it.t==='video'?'Attach a photo from the performance':'Attach photo or file of '+h(it.l.replace(' given','').toLowerCase())}</button><input type="file" id="wkf_${it.k}" accept="image/*" data-wkf="${it.k}" hidden>${(r.att||[]).map((u,i)=>`<span class="thumb"><img src="${u}" alt="Attachment ${i+1}"><button class="x" data-a="wkrm" data-k="${it.k}" data-i="${i}" aria-label="Remove attachment">×</button></span>`).join('')}<input type="text" class="wkin" data-k="${it.k}" data-f="link" value="${h(r.link||'')}" placeholder="${it.t==='video'?'Class video link (optional)':'Link (optional)'}" style="flex:1;min-width:180px"></div>`;
  let rows='';

/* test performance analysis for the class */
function markAnalysis(r,ids){
 const mx=+r.mx;if(!mx)return`<p class="sm mut">Enter the maximum marks above to see the performance analysis.</p>`;
 const vals=ids.map(id=>({id,v:r.r[id]})).filter(x=>x.v&&x.v[0]!=='a'&&x.v[0]!=='').map(x=>({id:x.id,p:+x.v[0]*100/mx}));
 if(!vals.length)return'';
 const avg=vals.reduce((n,x)=>n+x.p,0)/vals.length;const hi=vals.reduce((a,b)=>b.p>a.p?b:a),lo=vals.reduce((a,b)=>b.p<a.p?b:a);
 const bands=[['90%+',x=>x>=90],['75-89%',x=>x>=75&&x<90],['60-74%',x=>x>=60&&x<75],['Below 60%',x=>x<60]];
 return`<div class="card mt" style="margin-top:10px;background:#f6f8fd"><b style="color:var(--navy)">Performance analysis</b><div class="sm" style="margin-top:6px">${vals.length} of ${ids.length} tested · class average <b>${Math.round(avg)}%</b> · highest <b>${h(stu(hi.id).n)} ${Math.round(hi.p)}%</b> · lowest <b>${h(stu(lo.id).n)} ${Math.round(lo.p)}%</b></div><div class="chips" style="margin-top:6px">${bands.map(([l,f])=>`<span class="chip">${l}<span class="n">${vals.filter(x=>f(x.p)).length}</span></span>`).join('')}</div></div>`;
}

 return cancelClick1(a,t);
}

const PP_SECS=SECTIONS.filter(x=>typeof secClass(x)==='string');
const PP_LANES=['fitness','music','dance'];
const wkStart=d=>addDays(d,-((wd(d)+6)%7));
ui.rt={back:5,pre:null};
function rtData(){
 const m={};const cnt={};const last={};
 Object.values(S.sessions).forEach(s=>{
  if(!PP_LANES.includes(s.lane))return;
  const ss=sstate(s);
  s.targets.forEach(t=>{if(!PP_SECS.includes(t))return;
   const k=t+'|'+wkStart(s.date);(m[k]=m[k]||[]).push({s,st:ss});
   if(s.acts&&s.acts.length===1&&(ss==='held'||ss==='today'||ss==='upcoming'||ss==='pending')){const c=cnt[t]=cnt[t]||{};c[s.acts[0]]=(c[s.acts[0]]||0)+(ss==='held'?1:0);
    if(ss==='held'){const l=last[t]=last[t]||{};if(!l[s.lane]||l[s.lane].d<s.date)l[s.lane]={d:s.date,a:s.acts[0]}}}
  })});
 return{m,cnt,last};
}
function rtSuggest(sec,lane,cnt,last){
 const acts=LANE[lane].acts;const c=cnt[sec]||{};
 const min=Math.min(...acts.map(a=>c[a]||0));
 const lastAct=last[sec]&&last[sec][lane]?last[sec][lane].a:'';
 const pick=acts.filter(a=>(c[a]||0)===min&&a!==lastAct);
 return(pick[0]||acts.find(a=>(c[a]||0)===min)||acts[0]);
}
function viewRotation(){
 const{m,cnt,last}=rtData();const w0=wkStart(TODAY);
 const wks=[];for(let i=-ui.rt.back;i<=2;i++)wks.push(addDays(w0,i*7));
 let o=`<div class="row mb"><button class="btn pri" data-a="rtplan">Plan an activity</button><span class="sp"></span><span class="sm mut">Pre-primary classes try a different activity each week. Mark their attendance in <a href="#attendance">Attendance</a>.</span></div>`;
 if(!PP_SECS.length)return o+'<div class="card empty">No pre-primary classes.</div>';
 o+=`<div class="card mb"><h3>Week by week <span class="hint">solid = held · dashed = planned · grey = cancelled</span></h3><div class="scroll"><table class="tbl rtt"><thead><tr><th>Class</th>${wks.map(w=>`<th class="${w===w0?'now':''}">${fds(w)}${w===w0?'<br><span class="pill sky">This week</span>':''}</th>`).join('')}</tr></thead><tbody>${PP_SECS.map(sec=>`<tr><td><b>${h(sec)}</b></td>${wks.map(w=>{const l=m[sec+'|'+w]||[];return`<td class="${w===w0?'now':''}">${l.sort((a,b)=>a.s.date<b.s.date?-1:1).map(x=>`<a href="#" class="rch ${x.st==='held'?'held':x.st==='notheld'?'cx':'plan'}" style="--c:${LANE[x.s.lane].color}" data-a="opensess" data-id="${h(x.s.id)}" title="${h(LANE[x.s.lane].name)} · ${fd(x.s.date)}">${h(x.s.acts&&x.s.acts.length===1?ACT[x.s.acts[0]].n:LANE[x.s.lane].short+' · set activity')}<small>${fds(x.s.date)}</small></a>`).join('')||'<span class="mut">–</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`;
 /* counts */
 const acts=PP_LANES.flatMap(l=>LANE[l].acts);
 o+=`<div class="card mb"><h3>Times each class went <span class="hint">orange = not yet · green = most</span></h3><div class="scroll"><table class="tbl"><thead><tr><th>Class</th>${PP_LANES.map(l=>`<th colspan="${LANE[l].acts.length}" style="color:${LANE[l].color}">${h(LANE[l].short)}</th>`).join('')}</tr><tr><th></th>${acts.map(a=>`<th class="r xs">${h(ACT[a].n)}</th>`).join('')}</tr></thead><tbody>${PP_SECS.map(sec=>{const c=cnt[sec]||{};return`<tr><td><b>${h(sec)}</b></td>${PP_LANES.flatMap(l=>{const mx=Math.max(0,...LANE[l].acts.map(a=>c[a]||0));return LANE[l].acts.map(a=>{const n=c[a]||0;return`<td class="r num" style="${n===0?'background:#FFF1DB;color:#b57a0a':n===mx&&mx>1?'background:#E6F6EE;color:#1E7A52':''}">${n}</td>`})}).join('')}</tr>`}).join('')}</tbody></table></div></div>`;
 /* last time and suggestion */
 o+=`<div class="card"><h3>Last time and suggested next <span class="hint">so no activity is missed</span></h3><div class="scroll"><table class="tbl"><thead><tr><th>Class</th>${PP_LANES.map(l=>`<th>${h(LANE[l].short)}</th>`).join('')}</tr></thead><tbody>${PP_SECS.map(sec=>`<tr><td><b>${h(sec)}</b></td>${PP_LANES.map(l=>{const lt=last[sec]&&last[sec][l];const sg=rtSuggest(sec,l,cnt,last);return`<td><div class="xs mut">${lt?'Last: '+h(ACT[lt.a].n)+' · '+fds(lt.d):'Not yet'}</div><button class="btn sm" data-a="rtplan" data-sec="${h(sec)}" data-l="${l}" data-act="${sg}">Next: ${h(ACT[sg].n)}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`;
 return o;
}

function imageFromFile(file,cb){

}

  case'savestudent':saveStudent();break;

  case'ttab':ui.ttab=t.dataset.t;render();break;
  case'ttday':ui.ttd=+t.dataset.d;render();break;
  case'copyday':copyDayModal();break;
  case'docopyday':{const src=S.template[ui.ttd]||[];$$('.cpd:checked').forEach(c=>{S.template[+c.value]=JSON.parse(JSON.stringify(src))});regenFuture();log(`Copied ${DOW[ui.ttd]} template`);save();closeModal();toast('Copied');render();break}
  case'addtt':ui.ttm=null;ttModal(t.dataset.mode);break;
  case'edittt':ttModal(t.dataset.mode,t.dataset.i);break;
  case'rmtt':ask('Remove this session?'+(t.dataset.mode==='date'?'<p class="sm mut">Attendance already marked for it will be lost.</p>':'<p class="sm mut">Future days without attendance are rebuilt from the template.</p>'),()=>{if(t.dataset.mode==='tpl'){S.template[ui.ttd].splice(+t.dataset.i,1);regenFuture()}else{removeSession(t.dataset.i);ENRV++}save();render()},'Remove');break;
  case'tttgt':{const d=ui.ttm;const x=t.dataset.t;d.start=$('#tt_s').value;d.end=$('#tt_e').value;d.coach=$('#tt_c').value;d.targets=d.targets.includes(x)?d.targets.filter(y=>y!==x):[...d.targets,x];renderTT(null,true);break}
  case'ttall':{const d=ui.ttm;const secs=CLASS_SECS[t.dataset.c].map(x=>t.dataset.c+x);const all=secs.every(x=>d.targets.includes(x));d.start=$('#tt_s').value;d.end=$('#tt_e').value;d.coach=$('#tt_c').value;d.targets=all?d.targets.filter(x=>!secs.includes(x)):[...new Set([...d.targets,...secs])];renderTT(null,true);break}
  case'savett':saveTT();break;
  case'resetday':ask('<p>Rebuild this date from the weekly template? Sessions without attendance are replaced.</p>',()=>{const day=ensureDay(ui.date);day.ids.slice().forEach(i=>{const x=S.sessions[i];if(x&&!hasData(x))removeSession(i)});day.init=false;ENRV++;save();render()},'Reset');break;
  case'saveuser':{ui.me={role:$('#u_r').value,name:$('#u_n').value.trim()||ROLES[$('#u_r').value]};saveUi();closeModal();render();break}
  case'addcoach':{const n=$('#nc_n').value.trim();if(!n)break;S.coaches.push({id:uid(),name:n,lanes:[$('#nc_l').value]});save();render();break}
  case'rmcoach':ask('Remove this coach from the list? Past sessions keep the name.',()=>{S.coaches.splice(+t.dataset.i,1);save();render()},'Remove');break;
  case'clearattn':ask('<p>This deletes all attendance, lesson notes, observations and holiday marks. The student list, enrolment, timetable template and coaches stay.</p>',()=>{S.days={};S.sessions={};S.requests=[];S.demo=false;STRUCT++;ENRV++;log('Cleared attendance data');save();bootDate();render();toast('Cleared. Ready for real attendance.')},'Clear everything');break;
  case'resetdemo':ask('Replace current data with fresh demo data?',()=>{initState();save();bootDate();render()},'Reload demo');break;
  case'exportjson':copyText(JSON.stringify(S),'Backup copied');break;
  case'importjson':openModal(`<div class="mh"><h3>Restore from backup</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2"><textarea id="bk" rows="8" placeholder="Paste the backup text"></textarea></div><div class="mf"><button class="btn pri" data-a="dorestore">Restore</button></div>`);break;
  case'dorestore':{try{const o=JSON.parse($('#bk').value);if(!o.sessions||!o.students)throw 0;S=o;ENRV++;STRUCT++;save();closeModal();render();toast('Restored')}catch(x){toast('That text is not a valid backup')}break}
  case'importcsv':importCsv();render();break;
 }
});

 const chipsFor=cl=>{const secs=CLASS_SECS[cl].map(x=>cl+x);const all=secs.every(x=>d.targets.includes(x));
  return`<div class="row" style="gap:5px;margin-bottom:5px"><b class="sm" style="width:58px">Class ${cl}</b><button class="chip ${all?'on':''}" data-a="ttall" data-c="${cl}">All</button>${secs.map(x=>`<button class="chip ${d.targets.includes(x)?'on':''}" data-a="tttgt" data-t="${x}">${x}</button>`).join('')}</div>`};
 openModal(`<div class="mh"><h3>${d.isEdit?'Edit':'Add'} session${d.mode==='date'?' · '+fds(ui.date):' · '+DOW[ui.ttd]}</h3><button class="x" data-a="closemodal">×</button></div><div class="mb2">
 <div class="grid g2"><div class="fld"><label class="f" for="tt_l">Activity area</label><select id="tt_l" data-tt="lane">${LANES.map(l=>`<option value="${l.id}" ${l.id===d.lane?'selected':''}>${h(l.name)} (${CATS[l.cat].m})</option>`).join('')}</select></div>
 <div class="fld"><label class="f" for="tt_c">Coach / teacher</label><select id="tt_c">${[...new Set([d.coach,defaultCoach(d.lane),...myCoachNames()])].filter(Boolean).map(n=>`<option ${n===d.coach?'selected':''}>${h(n)}</option>`).join('')}</select></div>
 <div class="fld"><label class="f" for="tt_s">Start</label><input type="time" id="tt_s" value="${d.start}"></div><div class="fld"><label class="f" for="tt_e">End</label><input type="time" id="tt_e" value="${d.end}"></div></div>
 <label class="f">Classes</label>${Object.keys(CLASS_SECS).filter(c=>!(LANE[d.lane]&&LANE[d.lane].maxClass&&+c>LANE[d.lane].maxClass)).map(chipsFor).join('')}
 <div class="row" style="gap:5px;${LANE[d.lane]&&LANE[d.lane].maxClass?'display:none':''}"><b class="sm" style="width:58px">Pre-primary</b>${SECTIONS.filter(x=>typeof secClass(x)==='string').map(x=>`<button class="chip ${d.targets.includes(x)?'on':''}" data-a="tttgt" data-t="${x}">${x}</button>`).join('')}</div></div>
 <div class="mf"><button class="btn" data-a="closemodal">Cancel</button><button class="btn pri" data-a="savett">Save session</button></div>`,true);
}

/* ===== Hub build only: password-protected data load, optional live server (Google Apps Script) ===== */
const API_URL="";   /* paste the Apps Script /exec URL between the quotes after setup (see SETUP.md), or open the page with ?api=URL */
const API=(new URLSearchParams(location.search).get('api'))||API_URL;
const SYNC={tok:'',ver:0,dirty:false,busy:false,role:'',name:''};
const TOKK='fis-cc-tok';
function gate(html,after){
 let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
 g.innerHTML=`<div class="gcard"><div class="row" style="gap:12px;margin-bottom:14px">${LOGO}<div><b style="font-size:16px;color:var(--navy)">FIS Co-Curricular Desk</b><div class="xs mut">Flourish International School</div></div></div>${html}</div>`;
 if(after)after(g);
}
function gdone(){const g=document.getElementById('gate');if(g)g.remove()}
async function rpc(fn,args){
 let r;try{r=await fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:args||[],code:SYNC.tok})})}catch(e){throw new Error('No connection. Check the internet and try again.')}
 let j;try{j=await r.json()}catch(e){throw new Error('The server did not answer properly. Try again.')}
 if(!j.ok){if(j.auth){try{localStorage.removeItem(TOKK)}catch(e){}SYNC.tok=''}throw new Error(j.error||'Something went wrong.')}
 return j.data;
}
async function decSeed(pw){
 const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SEED_ENC.s),iterations:SEED_ENC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(SEED_ENC.i)},key,b(SEED_ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));
}
function askSeed(note){
 return new Promise(res=>{
  gate(`<p class="sm mut">${note}</p><div class="fld"><label class="f" for="gp">Data password</label><input type="password" id="gp" autocomplete="off"></div><div id="gerr" class="sm" style="color:var(--bad);min-height:18px"></div><button class="btn pri" id="gb">Unlock</button>`,g=>{
   const go=async()=>{const pw=g.querySelector('#gp').value;g.querySelector('#gerr').textContent='Checking…';
    try{const d=await decSeed(pw);ROSTER=d.roster;ATT=d.att;gdone();res()}catch(e){g.querySelector('#gerr').textContent='That password is not right.'}};
   g.querySelector('#gb').onclick=go;g.querySelector('#gp').onkeydown=e=>{if(e.key==='Enter')go()};g.querySelector('#gp').focus();
  });
 });
}
function askLogin(){
 return new Promise(res=>{
  gate(`<p class="sm mut">Sign in with the same name and password you use for the other FIS apps.</p><div class="fld"><label class="f" for="gn">Name</label><input type="text" id="gn" autocomplete="username"></div><div class="fld"><label class="f" for="gp">Password</label><input type="password" id="gp" autocomplete="current-password"></div><div id="gerr" class="sm" style="color:var(--bad);min-height:18px"></div><button class="btn pri" id="gb">Sign in</button>`,g=>{
   const go=async()=>{g.querySelector('#gerr').textContent='Signing in…';
    try{const r=await rpc('login',[g.querySelector('#gn').value,g.querySelector('#gp').value]);SYNC.tok=r.token;SYNC.role=r.role;SYNC.name=r.name;try{localStorage.setItem(TOKK,r.token);localStorage.setItem(TOKK+'-me',JSON.stringify({role:r.role,name:r.name}))}catch(e){}gdone();res()}catch(e){g.querySelector('#gerr').textContent=e.message}};
   g.querySelector('#gb').onclick=go;g.querySelector('#gp').onkeydown=e=>{if(e.key==='Enter')go()};g.querySelector('#gn').focus();
  });
 });
}
const roleMap=r=>r==='admin'?'director':/manager/i.test(r||'')?'manager':/front/i.test(r||'')?'front':'coach';
async function pullFirst(){
 const r=await rpc('getState',[0]);
 SYNC.role=r.role||SYNC.role;SYNC.name=r.name||SYNC.name;
 if(r.json){try{localStorage.setItem(LS,r.json)}catch(e){}SYNC.ver=r.ver;return true}
 if(SYNC.role!=='admin'){gate(`<p>The Director has not loaded the attendance data yet. Please try again later.</p>`);return false}
 await askSeed('First time set-up. Enter the data password to load the students and attendance onto the server.');
 try{localStorage.removeItem(LS)}catch(e){}
 return true;
}
async function pullNow(manual){
 if(!API||!SYNC.tok||SYNC.busy)return;
 try{const r=await rpc('getState',[SYNC.ver]);if(r.same||!r.json)return;
  if(SYNC.dirty&&!manual)return;
  S=JSON.parse(r.json);SYNC.ver=r.ver;ENRV++;STRUCT++;MUT++;try{localStorage.setItem(LS,r.json)}catch(e){}
  render();if(ui.sess)renderDrawer(true)}catch(e){}
}
let syncT;
function syncSoon(){if(!API||!SYNC.tok)return;SYNC.dirty=true;clearTimeout(syncT);syncT=setTimeout(pushNow,4000)}
async function pushNow(){
 if(SYNC.busy||!SYNC.dirty)return;SYNC.busy=true;SYNC.dirty=false;
 try{
  const r=await rpc('putState',[SYNC.ver,JSON.stringify(S)]);
  if(r.conflict){
   try{localStorage.setItem('fis-cc-v2-conflict',JSON.stringify(S))}catch(e){}
   SYNC.busy=false;SYNC.dirty=false;SYNC.ver=0;const g=await rpc('getState',[0]);
   S=JSON.parse(g.json);SYNC.ver=g.ver;ENRV++;STRUCT++;MUT++;try{localStorage.setItem(LS,g.json)}catch(e){}
   render();if(ui.sess)renderDrawer(true);toast('Someone else saved first. Showing the latest. Please repeat your last change.');
  }else SYNC.ver=r.ver;
 }catch(e){SYNC.dirty=true;ui.warn=true;toast(e.message);setTimeout(pushNow,15000)}
 SYNC.busy=false;
}
async function hubStart(){
 try{
  if(API){
   try{SYNC.tok=localStorage.getItem(TOKK)||'';const m=JSON.parse(localStorage.getItem(TOKK+'-me')||'{}');SYNC.role=m.role||'';SYNC.name=m.name||''}catch(e){}
   if(!SYNC.tok)await askLogin();
   let ok;try{ok=await pullFirst()}catch(e){if(!SYNC.tok){await askLogin();ok=await pullFirst()}else throw e}
   if(!ok)return;
  }else if(!loadState()){await askSeed('This copy holds school data and is locked. Enter the data password to open it.')}
 }catch(e){gate(`<p>${h(e.message||'Could not start.')}</p><button class="btn pri" onclick="location.reload()">Try again</button>`);return}
 boot();
 if(API){ui.me={role:roleMap(SYNC.role),name:SYNC.name||'Staff'};render();setInterval(()=>pullNow(false),25000);window.addEventListener('beforeunload',()=>{if(SYNC.dirty)pushNow()})}
}
hubStart();
