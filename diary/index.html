<title>Diary Report – FIS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16467A">
<link rel="icon" href="../fis/fis-icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky control bar (date, class chips, section tabs) over a one-column list of student cards, each with five tap-to-cycle marks; report sheet slides up from the bottom. */
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#0e1a2b; --muted:#5a6678; --line:#e0e5ec;
  --accent:#16467a; --accent-ink:#ffffff; --accent-soft:#e7eef6;
  --ok:#1d6b49; --ok-soft:#e2f1e9; --bad:#9e3a33; --bad-soft:#f7e7e5; --warn:#855710; --warn-soft:#f9efd9;
  --font-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1622; --card:#161f2d; --ink:#e7edf6; --muted:#97a4b8; --line:#243246;
    --accent:#86abd8; --accent-ink:#0e1622; --accent-soft:#1c2c44;
    --ok:#62c796; --ok-soft:#14352a; --bad:#f08c84; --bad-soft:#3b1f1d; --warn:#e8b861; --warn-soft:#3a2c0f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1622; --card:#161f2d; --ink:#e7edf6; --muted:#97a4b8; --line:#243246;
  --accent:#86abd8; --accent-ink:#0e1622; --accent-soft:#1c2c44;
  --ok:#62c796; --ok-soft:#14352a; --bad:#f08c84; --bad-soft:#3b1f1d; --warn:#e8b861; --warn-soft:#3a2c0f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header.top{padding-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.datebox{display:flex;flex-direction:column;gap:2px}
.datebox label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.datebox input{font:inherit;font-weight:600;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin-top:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:44px;height:40px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:20px;font-weight:600;position:relative}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tab{height:36px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;font-weight:600}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.stats .bad b{color:var(--bad)} .stats .warn b{color:var(--warn)}
.status{font-size:13px;color:var(--muted);padding:8px 0 0;min-height:24px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.stu{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px}
.stu.absent{background:var(--bad-soft)}
.head{display:flex;align-items:center;gap:10px;min-width:0}
.roll{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:22px;flex:0 0 auto}
.nm{font-weight:600;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.pen{flex:0 0 auto;width:40px;height:36px;border:1.5px solid var(--line);background:transparent;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600}
.pen.has{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.marks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.mk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 2px}
.mk small{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mk span{font-weight:700;font-size:14px}
.mk.ok{background:var(--ok-soft);border-color:var(--ok)} .mk.ok span{color:var(--ok)}
.mk.bad{background:var(--bad-soft);border-color:var(--bad)} .mk.bad span{color:var(--bad)}
.mk.warn{background:var(--warn-soft);border-color:var(--warn)} .mk.warn span{color:var(--warn)}
.mk:disabled{opacity:.35;cursor:default}
.rem{margin-top:8px}
.rem textarea{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;min-height:62px}
.fab{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:6}
.fab .wrap{display:flex;gap:8px}
.btn{height:48px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px;flex:1}
.btn.alt{background:var(--card);color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,16,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:720px;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.panel h2{font-family:var(--font-display);font-size:20px;margin:0}
.scope{display:flex;gap:6px;flex-wrap:wrap}
#rtext{flex:1 1 auto;min-height:200px;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.45;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:none}
.opt{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.opt input{width:20px;height:20px}
.row{display:flex;gap:8px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.toast[hidden]{display:none}
.nav{display:flex;gap:6px;margin-top:10px}
.nav .tab{flex:1;height:42px}
.dsub{font-size:13px;color:var(--muted);padding:2px 0 4px}
h2.sec{font-family:var(--font-display);font-size:18px;margin:18px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile b{font-family:var(--font-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--muted);font-weight:600}
.tile.t-warn b{color:var(--warn)} .tile.t-bad b{color:var(--bad)} .tile.t-ok b{color:var(--ok)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.me td{background:var(--accent-soft)}
.tbl td.hot{color:var(--bad);font-weight:700}
.tbl button.lnk{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.item.done{opacity:.62}
.ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.iname{font-weight:700}
.iwhere{color:var(--muted);font-size:13px;margin-left:auto}
.itext{font-size:15px;overflow-wrap:anywhere}
.arow{display:flex;gap:6px;flex-wrap:wrap}
.arow select,.arow input{font:inherit;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.arow select{flex:1 1 150px}.arow input{flex:2 1 160px}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtn{height:40px;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;font-weight:600;font-size:14px}
.sbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fab[hidden]{display:none}
.when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbtn-go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iss{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.rem-text{flex:1 1 200px;min-width:0;font-size:16px;font-weight:500}
.streak{font-size:12.5px;font-weight:700;color:var(--warn)} .streak.hot{color:var(--bad)}
.logl{font-size:13.5px;color:var(--ok);font-weight:600}
.flatbar{margin-top:12px;padding-bottom:6px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--font-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.w b{color:var(--warn)} .kpi.a b{color:var(--accent)} .kpi.b b{color:var(--bad)}
h3.grp{font-family:var(--font-display);font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;font-weight:700}
.summary{font-size:13px;color:var(--muted);font-weight:600;padding:2px 2px 0}
.ic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ic-head{display:flex;align-items:center;gap:10px;min-width:0}
.ic-name{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.ic-name b{font-family:var(--font-display);font-size:16px;font-weight:700;overflow-wrap:anywhere}
.ic-name small{font-size:12.5px;color:var(--muted)}
.stat{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.stat.ok{background:var(--ok-soft);color:var(--ok)} .stat.warn{background:var(--warn-soft);color:var(--warn)}
.stat.acc{background:var(--accent-soft);color:var(--accent)} .stat.mute{background:var(--bg);color:var(--muted)}
.ic-body{display:flex;flex-direction:column;gap:8px}
.quote{margin:0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.flag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.flag-l{font-weight:600}
.flag-s{font-size:12.5px;font-weight:700;color:var(--warn)} .flag-s.hot{color:var(--bad)}
.dot2{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--muted)} .dot2.w{background:var(--warn)} .dot2.b{background:var(--bad)}
.tl{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.tl-row{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.tl-role{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;grid-row:span 2}
.tl-role.pl{background:var(--accent-soft);color:var(--accent)} .tl-role.ad{background:var(--ok-soft);color:var(--ok)}
.tl-text{font-size:15px;overflow-wrap:anywhere}
.tl-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qrow{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{height:36px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;font-weight:600;font-size:14px}
.arow2{display:flex;gap:6px;flex-wrap:wrap}
.arow2 input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gobtn{height:40px;padding:0 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.tab[aria-selected="true"]{font-weight:700}
.tbl th{white-space:normal;text-align:right;vertical-align:bottom}
.tbl th:first-child{text-align:left}
@media (prefers-reduced-motion:no-preference){.mk,.chip,.tab{transition:background .12s,border-color .12s}}

.drow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.drow label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:2px}
.drow input{font:inherit;font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.drow input[type=search]{flex:1 1 140px;min-width:120px}
.dt{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.dt th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.dt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.dt td.nw{white-space:nowrap}.dt td.nm2{font-weight:700;min-width:120px}.dt td.rmk{min-width:200px}
.dt small{display:block;color:var(--muted);font-size:12px}
.dt .eline{margin-bottom:4px}.dt .dash{color:var(--muted)}
.lnk2{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;font-size:13px}
.xr td{background:var(--accent-soft)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:10px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:left}
.stile b{font-size:16px}.stile small{font-size:11.5px;color:var(--muted);font-weight:600}
.stile.hot{border-color:var(--accent)}.stile.hot small{color:var(--accent)}
.stile.on{background:var(--accent-soft);border-color:var(--accent)}

.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-top:8px}
.who b{color:var(--ink)}
.who .lnkb{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;font-size:13px;margin-left:auto}
.home{color:var(--accent);font-weight:700;font-size:13px;text-decoration:none}
.banner{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;overflow-wrap:anywhere}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.authcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;display:grid;gap:12px}
.authcard h2{margin:0;font-family:var(--font-display);font-size:20px}
.authcard p{margin:0;color:var(--muted);font-size:14px}
.field{display:grid;gap:4px}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select{font:inherit;padding:10px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.authcard .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ucard .un{font-weight:700;flex:1 1 140px}.ucard small{color:var(--muted);display:block;font-weight:400}
.ucard select{font:inherit;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Diary Report</h1>
      <div class="sub"><a class="home" href="../fis/">‹ FIS apps</a> · Class Managers mark each child's diary in front of them</div>
    </div>
    <div class="datebox">
      <label for="date">Report date</label>
      <input id="date" type="date">
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div id="auth" hidden></div>
  <div class="who" id="who" hidden></div>
  <div id="app" hidden>
  <nav class="nav" id="nav" aria-label="View">
    <button class="tab" type="button" data-view="mark" aria-selected="true">Marking</button>
    <button class="tab" type="button" data-view="cls" aria-selected="false">Class (PL)</button>
    <button class="tab" type="button" data-view="cen" aria-selected="false">Central</button>
    <button class="tab" type="button" data-view="staff" aria-selected="false" id="navStaff" hidden>Staff</button>
  </nav>

  <div id="viewMark">
  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Class"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Section"></div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="list" id="list"></div>
  </div>

  <div id="viewCls" hidden>
    <div class="bar">
      <div class="chips" id="pchips" role="group" aria-label="Class"></div>
      <div class="tabs" id="ptabs" role="tablist" aria-label="Section"></div>
      <div class="tabs" id="psegs" role="tablist" aria-label="Segment" style="margin-top:6px"></div>
    </div>
    <div class="status" id="psub"></div>
    <div class="list" id="pitems"></div>
  </div>

  <div id="viewCen" hidden>
    <div class="row2" style="margin-top:12px"><h2 class="sec" style="margin:0">Central dashboard</h2><button class="tab sbtn-go" id="cxl" type="button">Copy for Excel</button></div>
    <div class="flatbar">
      <div class="tabs" id="csegs" role="tablist" aria-label="Segment"></div>
      <div id="cremctl">
        <div class="drow"><label>From <input type="date" id="cfrom"></label><label>To <input type="date" id="cto"></label><input type="search" id="cq" placeholder="Search name" aria-label="Search name"></div>
        <div class="chips" id="cchips" role="group" aria-label="Class scope" style="margin-top:8px"></div>

<script>
function EMPTY_ROSTER(){ const r = {}; for (let c = 1; c <= 11; c++) r[c] = {A: []}; return r; }
let ROSTER = EMPTY_ROSTER(), rosterVer = "";
const rosterReady = () => Object.keys(ROSTER).some(c => Object.values(ROSTER[c]).some(l => l.length));
const ORD = ["","1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th"];
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

const API_URL = new URLSearchParams(location.search).get("api") || "https://script.google.com/macros/s/AKfycbyvWTDOKOQ8F0vD-oy9vchmq04GdhfZfgtpomgWg73rIa13gmkrFkpZsvQl9ISZKrSFQw/exec";
let token = ""; try { token = localStorage.getItem("diary-token") || ""; } catch(e){}
let me = null, ready = false, authMode = "login", users = [], refreshing = false;
const ROLE_LABEL = {cm:"Class Manager", pl:"Class incharge (PL)", admin:"Admin / central team"};
const canMark = () => !!me && (me.role === "cm" || me.role === "admin");
const canPL = () => !!me && (me.role === "pl" || me.role === "admin");
const canAdmin = () => !!me && me.role === "admin";
function setToken(t){ token = t || ""; try { if (token) localStorage.setItem("diary-token", token); else localStorage.removeItem("diary-token"); } catch(e){} }
async function api(fn, args){
  let r;
  try { r = await fetch(API_URL, {method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn, args:args || []})}); }
  catch(e){ throw new Error("Can't reach the server. Check your internet and try again."); }
  const txt = await r.text(); let j;
  try { j = JSON.parse(txt); } catch(e){ throw new Error("The server didn't answer properly. Check the Apps Script deployment (Anyone can access)."); }
  if (!j.ok) { if (/log in again/i.test(j.err || "")) { setToken(""); me = null; render(); } throw new Error(j.err || "Something went wrong."); }
  return j.v;
}
function banner(msg, info){ const b = $("banner"); b.textContent = msg || ""; b.hidden = !msg; b.className = "banner" + (info ? " info" : ""); }
let date = todayStr();
let cls = 1, sec = "A";
let docs = {};            // "date_cls" -> {date, cls, m:{}}
const timers = {}, writing = {}, dirtyKeys = {};
const openRem = new Set();

function todayStr(){
  const d = new Date(); const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function dmy(s){ const [y,m,d] = s.split("-"); return d + "-" + m + "-" + y; }
function docId(c){ return date + "_" + c; }
function getDoc(c){ const id = docId(c); if (!docs[id]) docs[id] = {date, cls:c, m:{}}; return docs[id]; }
function sections(c){ return Object.keys(ROSTER[c]); }
function key(s, i){ return s + "-" + (i+1); }
function mark(c, s, i, dt){ const d = docs[(dt || date) + "_" + c]; return (d && d.m[key(s,i)]) || {}; }
function firstName(n){ return n.trim().split(/\s+/)[0].toUpperCase(); }

/* ---------- storage (Google Sheet through the Apps Script web app) ---------- */
function scheduleSave(c, k){
  const id = docId(c); (dirtyKeys[id] = dirtyKeys[id] || new Set()).add(k);
  setStatus("Saving…");
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), 500);
}
async function flush(id){
  if (!me || !API_URL) return;
  const keys = dirtyKeys[id]; if (!keys || !keys.size) return;
  if (writing[id]) { timers[id] = setTimeout(() => flush(id), 400); return; }
  writing[id] = true;
  const sent = Array.from(keys); keys.clear();
  const d = docs[id], set = {}, del = [];
  sent.forEach(k => { if (d.m[k]) set[k] = d.m[k]; else del.push(k); });
  try { await api("saveMarks", [token, d.date, d.cls, set, del]); setStatus("Saved for everyone"); }
  catch(e){ sent.forEach(k => keys.add(k)); setStatus("Not saved yet. Will retry. " + e.message); toast(e.message); }
  finally { writing[id] = false; }
}
function retryDirty(){ Object.keys(dirtyKeys).forEach(id => { if (dirtyKeys[id].size && !writing[id]) flush(id); }); }
function applyState(s){
  if (!s) return;
  me = s.me || null; users = s.users || [];
  if (!me) { if (token) { setToken(""); banner("Please log in again.", true); } ready = true; render(); return; }
  if (s.roster) {
    const r = EMPTY_ROSTER(); Object.keys(s.roster).forEach(c => { if (r[c]) r[c] = s.roster[c]; });
    ROSTER = r; rosterVer = s.rosterVer || "";
    if (!ROSTER[cls][sec]) sec = sections(cls)[0]; if (!ROSTER[pcls][psec]) psec = sections(pcls)[0];
  }
  Object.keys(s.docs || {}).forEach(id => {
    if (writing[id]) return;
    const v = s.docs[id], m = JSON.parse(JSON.stringify(v.m || {})), loc = docs[id];
    if (loc && dirtyKeys[id]) dirtyKeys[id].forEach(k => { if (loc.m[k]) m[k] = loc.m[k]; else delete m[k]; });
    docs[id] = {date:v.date, cls:v.cls, m};
  });
  Object.keys(s.acts || {}).forEach(id => { if (aBusy[id]) return; acts[id] = {log: s.acts[id].log || []}; });
  smsRec = s.sms || {};
  ready = true;
  const p = n => String(n).padStart(2,"0"), n = new Date();
  setStatus("Live · updated " + p(n.getHours()) + ":" + p(n.getMinutes()));
  render();
}
async function refresh(){
  if (!API_URL || !token || refreshing) return;
  refreshing = true;
  try { applyState(await api("state", [token, date, rosterVer])); }
  catch(e){ setStatus("Can't reach the server. Retrying."); if (!ready) { ready = true; render(); } }
  finally { refreshing = false; }
}

/* ---------- state changes ---------- */
function setMark(c, s, i, patch){
  const d = getDoc(c), k = key(s,i), prev = d.m[k] || {};
  const cur = Object.assign({}, prev, patch);
  const tm = Object.assign({}, prev.t || {}), now = Date.now();
  ["a","d","e","s","b"].forEach(f => { if (f in patch) { if (cur[f]) tm[f] = now; else delete tm[f]; } });
  if ("r" in patch) { if (cur.r && cur.r.trim()) { if (!(prev.r && prev.r.trim())) tm.r = now; } else delete tm.r; }
  ["a","d","e","s","b"].forEach(f => { if (!cur[f]) delete cur[f]; });
  if (!cur.r || !cur.r.trim()) delete cur.r;
  cur.t = tm; if (!Object.keys(tm).length) delete cur.t;
  const has = ["a","d","e","s","b","r"].some(f => cur[f]);
  if (has) d.m[k] = cur; else delete d.m[k];
  scheduleSave(c, k);
}
const cycle3 = v => ((v||0) + 1) % 3;

/* ---------- render ---------- */
function setStatus(t){ $("status").textContent = t; }
let toastT;
function toast(t){ const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 2200); }

function renderChips(){
  const box = $("chips"); box.textContent = "";
  for (let c = 1; c <= 11; c++){
    const b = el("button","chip", String(c)); b.type = "button";
    b.setAttribute("aria-pressed", String(c === cls)); b.setAttribute("aria-label","Class " + c);
    const d = docs[docId(c)]; if (d && Object.keys(d.m).length) b.appendChild(el("i","dot"));
    b.onclick = () => { cls = c; if (!ROSTER[c][sec]) sec = "A"; render(); };
    box.appendChild(b);
  }
}
function counts(c, s){
  const names = ROSTER[c][s]; let absent = 0, def = 0, enNo = 0, sgNo = 0, bad = 0;
  names.forEach((n,i) => {
    const m = mark(c,s,i);
    if (m.a) { absent++; return; }
    if (m.d) def++; if (m.e === 2) enNo++; if (m.s === 2) sgNo++; if (m.b === 2) bad++;
  });
  return {total:names.length, absent, present:names.length-absent, def, enNo, sgNo, bad};
}
function renderTabs(){
  const box = $("tabs"); box.textContent = "";
  sections(cls).forEach(s => {
    const b = el("button","tab", cls + " " + s); b.type = "button"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(s === sec));
    b.onclick = () => { sec = s; render(); };
    box.appendChild(b);
  });
  const k = counts(cls, sec), st = el("div","stats");
  const add = (cn, lab, v) => { const sp = el("span", cn); sp.append(lab + " "); sp.appendChild(el("b", null, String(v))); st.appendChild(sp); };
  add("", "Present", k.present + "/" + k.total); add("bad", "Absent", k.absent); add("warn", "Defaulters", k.def);
  box.appendChild(st);
}
function markBtn(label, text, tone, onclick, disabled){
  const b = el("button","mk" + (tone ? " " + tone : "")); b.type = "button";
  b.appendChild(el("small", null, label)); b.appendChild(el("span", null, text));
  b.onclick = onclick; b.disabled = !!disabled;
  b.setAttribute("aria-label", label + ": " + text);
  return b;
}
function renderList(){
  const box = $("list"); box.textContent = "";
  const names = ROSTER[cls][sec];
  if (!names || !names.length){ box.appendChild(el("div","empty","No students in this section.")); return; }
  names.forEach((n, i) => {
    const m = mark(cls, sec, i), abs = !!m.a;
    const card = el("div","stu" + (abs ? " absent" : ""));
    const head = el("div","head");
    head.appendChild(el("span","roll", String(i+1)));
    head.appendChild(el("span","nm", n));
    if (m.t) { const lt = Math.max.apply(null, Object.values(m.t)); head.appendChild(el("span","when", fmtT(lt))); }
    const pen = el("button","pen" + (m.r ? " has" : ""), m.r ? "Note" : "+ Note"); pen.type = "button";
    pen.style.width = "auto"; pen.style.padding = "0 10px";
    pen.onclick = () => { const k = cls+sec+i; if (openRem.has(k)) openRem.delete(k); else openRem.add(k); renderList(); };
    head.appendChild(pen); card.appendChild(head);
    const mk = el("div","marks");
    mk.appendChild(markBtn("Attend", abs ? "A" : "P", abs ? "bad" : "ok", () => { setMark(cls,sec,i,{a: abs ? 0 : 1}); render(); }));
    mk.appendChild(markBtn("Diary", m.d ? "DEF" : "OK", m.d ? "warn" : "", () => { setMark(cls,sec,i,{d: m.d ? 0 : 1}); render(); }, abs));
    const yn = (f, label) => markBtn(label, m[f] === 1 ? "Yes" : m[f] === 2 ? "No" : "–", m[f] === 1 ? "ok" : m[f] === 2 ? "bad" : "", () => { setMark(cls,sec,i,{[f]: cycle3(m[f])}); render(); }, abs);
    mk.appendChild(yn("e","English"));
    mk.appendChild(yn("s","Sign"));
    mk.appendChild(markBtn("Behav", m.b === 1 ? "Good" : m.b === 2 ? "Bad" : "–", m.b === 1 ? "ok" : m.b === 2 ? "bad" : "", () => { setMark(cls,sec,i,{b: cycle3(m.b)}); render(); }, abs));
    card.appendChild(mk);
    if (m.r || openRem.has(cls+sec+i)){
      const r = el("div","rem"); const ta = el("textarea"); ta.id = "rem-" + cls + sec + i;
      ta.placeholder = "Remark from parent"; ta.value = m.r || ""; ta.setAttribute("aria-label","Parent remark for " + n);
      let t; ta.oninput = () => { clearTimeout(t); t = setTimeout(() => { setMark(cls,sec,i,{r: ta.value}); renderTabs(); renderChips(); }, 400); };
      ta.onblur = () => { const has = !!ta.value.trim(); pen.className = "pen" + (has ? " has" : ""); pen.textContent = has ? "Note" : "+ Note"; };
      r.appendChild(ta); card.appendChild(r);
    }
    box.appendChild(card);
  });
}
function renderMark(){
  renderChips(); renderTabs();
  const ae = document.activeElement;
  if (ae && ae.tagName === "TEXTAREA" && $("list").contains(ae)) return; // don't disturb typing
  renderList();
}

/* ---------- report ---------- */
function reportFor(c, withNames){
  const lines = [];
  const secs = sections(c);
  secs.forEach(s => {
    const k = counts(c, s), label = "Class " + ORD[c] + " " + s;
    lines.push("*" + label + " - Present - " + k.present + "/" + k.total + "*");
    const rem = [];
    ROSTER[c][s].forEach((n,i) => { const m = mark(c,s,i); if (m.r && m.r.trim()) rem.push(firstName(n) + " - " + m.r.trim().replace(/\s+/g," ")); });
    if (rem.length) rem.forEach((t,i) => lines.push((i+1) + ". " + t)); else lines.push("NA");
    const extra = [];
    if (k.enNo) extra.push("Spoken English (No): " + k.enNo);
    if (k.sgNo) extra.push("Parent sign (No): " + k.sgNo);
    if (k.bad) extra.push("Behaviour (Bad): " + k.bad);
    if (extra.length) lines.push("_" + extra.join(" | ") + "_");
    lines.push("");
  });
  lines.push("*Diary defaulters -*");
  secs.forEach(s => {
    const k = counts(c, s);
    let t = "*" + c + ORD[c].replace(/^\d+/, "") + " " + s + " -* " + k.def;
    if (withNames && k.def){
      const nm = []; ROSTER[c][s].forEach((n,i) => { const m = mark(c,s,i); if (!m.a && m.d) nm.push(n); });
      t += " (" + nm.join(", ") + ")";
    }
    lines.push(t);
  });
  return lines.join("\n");
}
let scope = "class";
function buildReport(){
  const wn = $("optNames").checked;
  const head = "*Diary Remarks*- " + dmy(date) + "\n\n";
  let body;
  if (scope === "class") body = reportFor(cls, wn);
  else { const parts = []; for (let c = 1; c <= 11; c++) parts.push(reportFor(c, wn)); body = parts.join("\n\n"); }
  $("rtext").value = head + body;
}

/* ---------- wiring ---------- */
$("date").value = date;
$("date").onchange = e => { if (!e.target.value) return; date = e.target.value; render(); refresh(); };
$("btnAllPresent").onclick = () => {
  ROSTER[cls][sec].forEach((n,i) => { if (mark(cls,sec,i).a) setMark(cls,sec,i,{a:0}); });
  render(); toast("All marked present");
};
$("btnReport").onclick = () => { buildReport(); $("sheet").hidden = false; };
$("rclose").onclick = () => { $("sheet").hidden = true; };
$("sheet").onclick = e => { if (e.target === $("sheet")) $("sheet").hidden = true; };
$("optNames").onchange = buildReport;
$("scope").querySelectorAll("button").forEach(b => { b.onclick = () => {
  scope = b.dataset.scope;
  $("scope").querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  buildReport();
}; });
$("rcopy").onclick = async () => {
  const t = $("rtext").value;
  try { await navigator.clipboard.writeText(t); toast("Report copied"); }
  catch(e){ const ta = $("rtext"); ta.removeAttribute("readonly"); ta.focus(); ta.select(); ta.setAttribute("readonly",""); toast("Text selected. Use Copy."); }
};
document.addEventListener("keydown", e => { if (e.key === "Escape") $("sheet").hidden = true; });

/* ---------- action log, class view (PL) and central view (admin) ---------- */
let view = "mark", pcls = 1, psec = "A", pseg = "rem";
let ccls = 0, csec = "all", cseg = "rem";
let acts = {};            // "2026-10-27_1A9" -> {log:[{a,cats,at,by}]}
let smsRec = {};          // "1A9_def" -> {sentOn, sentAt, remark}
const aPending = {}, aWriting = {};
let pMsg = ""; const aBusy = {};
const FIELD = {def:"d", eng:"e", sig:"s", beh:"b", rem:"r"};
const LABEL = {rem:"Parent remark", def:"Diary not completed", eng:"Spoken English", sig:"Parent signature", beh:"Conduct"};
const QUICK = {
  rem:["Noted","Counselled","Warned"],
  def:["Student cautioned","Called parent"],
  eng:["Student guided","Called parent"],
  sig:["Parent reminded","Called parent"],
  beh:["Student counselled","Called parent"]
};
const ADMIN_QUICK = ["Noted","Counselled","Warned"];
const STREAK_CATS = ["def","eng","sig","beh"];
const DEF_SEG = ["def","eng","sig","beh"];

function shiftDate(s, n){
  const [y,m,d] = s.split("-").map(Number); const t = new Date(Date.UTC(y, m-1, d + n));
  const p = x => String(x).padStart(2,"0");
  return t.getUTCFullYear() + "-" + p(t.getUTCMonth()+1) + "-" + p(t.getUTCDate());
}
function fmtT(ms){
  if (!ms) return "time not recorded";
  const d = new Date(ms), p = n => String(n).padStart(2,"0");
  let h = d.getHours(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
  return p(d.getDate()) + "-" + p(d.getMonth()+1) + " " + h + ":" + p(d.getMinutes()) + " " + ap;
}
function gap(from, to){
  if (!from || !to) return "";
  const m = Math.max(0, Math.round((to - from) / 60000));
  return m < 1 ? "under 1 min" : m < 60 ? m + " min" : m < 1440 ? Math.floor(m/60) + " h " + (m%60) + " min" : Math.floor(m/1440) + " d " + Math.floor((m%1440)/60) + " h";
}
function flagged(m, cat){
  if (!m || m.a) return false;
  return cat === "def" ? !!m.d : cat === "eng" ? m.e === 2 : cat === "sig" ? m.s === 2 : m.b === 2;
}
function streak(c, s, i, cat){
  const k = key(s,i); let n = 0, start = null;
  for (let b = 0; b < 14; b++){
    const dt = shiftDate(date, -b), d = docs[dt + "_" + c];
    if (!d || !Object.keys(d.m).length) continue;
    if (flagged(d.m[k], cat)) { n++; start = dt; } else break;
  }
  return {n, start};
}
function issuesFor(c, s, i, seg, dt){
  const m = mark(c, s, i, dt), t = m.t || {}, out = [];
  if (seg === "rem") {
    if (m.r && m.r.trim()) out.push({cat:"rem", text:m.r.trim(), at:t.r});
  } else if (!m.a) {
    if (m.d) out.push({cat:"def", at:t.d});
    if (m.e === 2) out.push({cat:"eng", at:t.e});
    if (m.s === 2) out.push({cat:"sig", at:t.s});
    if (m.b === 2) out.push({cat:"beh", at:t.b});
  }
  return out;
}
function aid(c, s, i, dt){ return dt + "_" + c + s + (i+1); }
function allLog(c, s, i, dt){ const a = acts[aid(c,s,i,dt)]; return (a && a.log) || []; }
function dayList(dt, c, s, seg){
  const out = [], cats = seg === "rem" ? ["rem"] : DEF_SEG;
  ROSTER[c][s].forEach((nm, i) => {
    const iss = issuesFor(c, s, i, seg, dt); if (!iss.length) return;
    const mine = allLog(c, s, i, dt).filter(l => (l.cats || []).some(x => cats.includes(x)));
    out.push({dt, c, s, i, nm, seg, iss, pl: mine.filter(l => l.by !== "admin"), ad: mine.filter(l => l.by === "admin")});
  });
  return out;
}
function rangeItems(seg, c0, s0, days){
  const out = [];
  for (let b = 0; b < days; b++){
    const dt = shiftDate(date, -b);
    for (let c = 1; c <= 11; c++){
      if (c0 && c !== c0) continue; if (!docs[dt + "_" + c]) continue;
      sections(c).forEach(s => { if (s0 && s0 !== "all" && s !== s0) return; dayList(dt, c, s, seg).forEach(x => out.push(x)); });
    }
  }
  return out;
}
function saveLog(it, text, by){
  const id = aid(it.c, it.s, it.i, it.dt);
  const cats = it.seg === "rem" ? ["rem"] : it.iss.map(x => x.cat);
  const at = Date.now(), before = allLog(it.c, it.s, it.i, it.dt);
  acts[id] = {log: before.concat([{a:text, cats, at, by, who: me ? me.name : ""}])};
  aBusy[id] = (aBusy[id] || 0) + 1; pMsg = "Saving\u2026";
  api("addLog", [token, it.dt, it.c, it.s, it.i + 1, it.nm, text, cats, by]).then(r => {
    acts[id] = {log: r.log}; pMsg = "Saved for everyone";
  }).catch(e => {
    acts[id] = {log: allLog(it.c, it.s, it.i, it.dt).filter(l => l.at !== at)}; pMsg = ""; toast(e.message);
  }).finally(() => { aBusy[id]--; if (!aBusy[id]) delete aBusy[id]; render(); });
}

/* shared card */
function statusChip(txt, tone){ return el("span", "stat " + tone, txt); }
function itemCard(it, role){
  const box = el("article", "ic");
  const head = el("div", "ic-head");
  head.appendChild(el("span", "roll", String(it.i + 1)));
  const nm = el("div", "ic-name"); nm.appendChild(el("b", null, it.nm));
  if (role === "admin") nm.appendChild(el("small", null, "Class " + it.c + " " + it.s + " · " + dmy(it.dt)));
  head.appendChild(nm);
  if (role === "pl") {
    head.appendChild(it.pl.length ? statusChip("Actioned", "ok") : statusChip("Awaiting action", "warn"));
  } else {
    head.appendChild(it.pl.length ? statusChip("PL actioned", "ok") : statusChip("No PL action yet", "mute"));
  }
  box.appendChild(head);

  const body = el("div", "ic-body");
  it.iss.forEach(x => {
    if (x.cat === "rem") {
      const q = el("blockquote", "quote", x.text); body.appendChild(q);
      body.appendChild(el("div", "meta", "Remark entered " + fmtT(x.at)));

function smsDue(){

function parseRoster(text){
  const out = {}; let n = 0, bad = 0;
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const cells = []; line.replace(/("([^"]*)"|[^,\t]*)(,|\t|$)/g, (m, a, q) => { cells.push((q != null ? q : a).trim()); return ""; });
    const cm = /(\d{1,2})/.exec(cells[0] || ""), sc = /^[A-Za-z]$/.test(cells[1] || "") ? cells[1].toUpperCase() : "", nm = (cells[2] || "").trim();
    if (!cm || !sc || !nm) { if (i > 0) bad++; return; }
    const c = +cm[1]; if (c < 1 || c > 11) { bad++; return; }
    ((out[c] = out[c] || {})[sc] = out[c][sc] || []).push(nm); n++;
  });
  return {out, n, bad};
}

  c.appendChild(t);

    parsed = r; const secs = Object.values(r.out).reduce((a, o) => a + Object.keys(o).length, 0);
    msg.textContent = r.n + " students in " + secs + " sections of " + Object.keys(r.out).length + " classes" + (r.bad ? " (" + r.bad + " rows skipped)" : "") + ". Check, then tap Upload."; go.disabled = false;
  };
  go.onclick = async () => { if (!parsed) return; go.disabled = true; try { applyState(await api("saveRoster", [token, parsed.out])); toast("Class lists saved"); } catch(e){ toast(e.message); go.disabled = false; } };

  return c;
}
