<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1F2D5A">
<title>Diary &amp; Remarks · FIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2D5A;--navy2:#16214A;--navy-soft:#E8ECF6;--gold:#E3A94F;--gold-soft:#FBF1DF;--gold-ink:#8A5B12;
  --plum:#5F3585;--plum-soft:#F1EAF8;--rose:#C2385B;--rose-soft:#FBE8EE;
  --bg:#F5F3EE;--card:#FFFFFF;--ink:#1B2340;--mute:#646B80;--faint:#9AA0B1;--line:#E6E2D8;--line2:#EFECE4;
  --ok:#2E7D5B;--ok-soft:#E4F3EB;--bad:#C0353F;--bad-soft:#FBE7E8;--warn:#A8670A;--warn-soft:#FDF1DC;--sky:#1B74AB;--sky-soft:#E3F2FB;
  --head:'Lora',Georgia,'Times New Roman',serif;--body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;--sh:0 1px 2px rgba(20,25,60,.05),0 8px 24px rgba(20,25,60,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid rgba(227,169,79,.55);outline-offset:2px}
[hidden]{display:none!important}

/* header */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--gold);box-shadow:0 4px 18px rgba(15,22,50,.28);padding:10px 14px 0;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo img{width:34px;height:auto}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-family:var(--head);font-weight:600;font-size:19px;line-height:1.15;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl a{display:block;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-decoration:none;margin-top:2px}
.hdate{border:0;border-radius:10px;padding:7px 8px;font-weight:600;font-size:13.5px;background:rgba(255,255,255,.96);color:var(--navy2);max-width:142px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 11px;max-width:980px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--head);font-weight:600;font-size:14.5px;color:#DCE1F0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 11px}
nav button.on{background:var(--gold);color:var(--navy2);border-color:var(--gold)}
nav button em{font-style:normal;font-family:var(--body);font-size:11px;font-weight:800;min-width:19px;height:19px;line-height:19px;border-radius:10px;text-align:center;padding:0 5px;background:var(--rose);color:#fff}
nav button.on em{background:var(--navy);color:var(--gold)}

main{max-width:980px;margin:0 auto;padding:12px 12px 24px}
@media (max-width:420px){main{padding:10px 10px 20px}.ttl h1{font-size:17px}.hdate{max-width:128px;font-size:13px}}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card>.pad{padding:14px 14px}
.cardh{display:flex;align-items:center;gap:10px;padding:13px 14px 11px;border-bottom:1px solid var(--line2)}
.cardh h2{margin:0;font-family:var(--head);font-weight:600;color:var(--navy);font-size:18px;line-height:1.2;flex:1;min-width:0}
.cardh h2 small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--mute);margin-top:2px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:16px 2px 8px}
.muted{color:var(--mute)} .small{font-size:12.5px}
.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700;background:var(--navy);color:#fff;letter-spacing:.01em}
.btn.gold{background:var(--gold);color:var(--navy2)}
.btn.ghost{background:#F3F0E8;color:var(--navy);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.lnk{background:none;border:0;padding:4px 0;color:var(--navy);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(31,45,90,.3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;background:var(--warn-soft);color:#6E4508;font-size:14px;border:1px solid #F3DDB2}
.banner.info{background:var(--navy-soft);color:var(--navy);border-color:#D6DDEF}
.empty{padding:26px 16px;text-align:center;color:var(--mute);font-size:14px}
.empty b{display:block;font-family:var(--head);font-size:17px;color:var(--navy);margin-bottom:4px;font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 2px 10px}
.who b{color:var(--ink)}
.rolepill{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:20px;background:var(--navy-soft);color:var(--navy)}

/* chips & segmented */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:40px;height:38px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink);position:relative}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip i{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1.5px solid #fff}
.chip.sm{height:32px;font-size:12.5px;min-width:0;padding:0 11px}
.seg{display:flex;background:#F0EDE5;border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,25,60,.12)}
.seg button em{font-style:normal;font-size:11px;font-weight:800;margin-left:5px;padding:1px 6px;border-radius:10px;background:var(--rose-soft);color:var(--rose)}
.selector{padding:12px 12px 10px;display:grid;gap:9px}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}
.stat{padding:12px 6px 11px;text-align:center;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--head);font-size:24px;font-weight:600;line-height:1.1;color:var(--navy)}
.stat span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.plum b{color:var(--plum)}

/* summary groups */
.groups{padding:4px 14px 12px}
.grp{padding:10px 0;border-bottom:1px solid var(--line2)}
.grp:last-child{border-bottom:0}
.grp-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:7px}
.grp-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.grp-h .n{margin-left:auto;font-size:12px;font-weight:800;color:var(--mute)}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm{display:inline-flex;align-items:baseline;gap:6px;border:0;border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600;line-height:1.25;text-align:left}
.nm small{font-size:11px;font-weight:700;opacity:.75}
.t-bad{background:var(--bad-soft);color:#8E1F28}.t-warn{background:var(--warn-soft);color:#7A4A05}.t-plum{background:var(--plum-soft);color:#4A2768}
.t-sky{background:var(--sky-soft);color:#155985}.t-ok{background:var(--ok-soft);color:#1F5E43}.t-mute{background:#F0EEE8;color:var(--mute)}.t-navy{background:var(--navy-soft);color:var(--navy)}
.d-bad{background:var(--bad)}.d-warn{background:var(--warn)}.d-plum{background:var(--plum)}.d-sky{background:var(--sky)}.d-ok{background:var(--ok)}.d-mute{background:var(--faint)}.d-navy{background:var(--navy)}.d-gold{background:var(--gold)}
.allclear{display:flex;gap:10px;align-items:center;padding:14px;color:var(--ok);font-weight:700}
.secs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line2);background:#FBFAF7}
.secpill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.secpill span{color:var(--mute);font-weight:600;margin-left:4px}
.secpill.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.secpill.done span{color:var(--ok)}

/* marking list */
.kid{padding:12px 14px;border-bottom:1px solid var(--line2);scroll-margin-top:150px}
.kid:last-child{border-bottom:0}
.kid.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
.kid-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.roll{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy-soft);color:var(--navy);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.kid-n{flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.25}
.kid-n small{display:block;font-size:11.5px;font-weight:500;color:var(--faint);margin-top:1px}
.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--navy);flex:none}
.mini.on{background:var(--gold-soft);border-color:#EDD3A3;color:var(--gold-ink)}
.mk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mb{border:0;border-radius:10px;padding:7px 4px 8px;background:#F3F1EC;text-align:center;min-height:48px}
.mb small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.mb span{display:block;font-weight:800;font-size:14.5px;margin-top:1px;color:var(--faint)}
.mb.ok{background:var(--ok-soft)}.mb.ok span{color:var(--ok)}
.mb.bad{background:var(--bad-soft)}.mb.bad span{color:var(--bad)}.mb.bad small{color:#9E3A42}
.mb.warn{background:var(--warn-soft)}.mb.warn span{color:var(--warn)}.mb.warn small{color:#8A5B12}
.kid.abs .mb:not(.att){opacity:.35}
.note{margin-top:9px}
.note textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#FBFAF7;resize:vertical;font-size:14.5px}
.note textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,169,79,.25);background:#fff}

/* bottom action bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(20,25,60,.07)}
.dock .in{max-width:980px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1;padding:12px 8px;font-size:14px}
body.dock-on .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
.status{font-size:12px;color:var(--mute);text-align:right;margin:-4px 4px 8px}

/* remark / item cards */
.rc{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.rc.over{border-color:#E9B4B9;box-shadow:0 0 0 2px rgba(192,53,63,.12),var(--sh)}
.rc-h{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.rc-n{flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.25}
.rc-n .cs{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;color:var(--navy);background:var(--navy-soft);padding:2px 7px;border-radius:7px;vertical-align:1px}
.pill{flex:none;font-size:11px;font-weight:800;letter-spacing:.03em;padding:4px 9px;border-radius:20px;white-space:nowrap}
.rc-q{margin:10px 14px 0;padding:11px 13px;background:#FBF8F1;border-left:3px solid var(--gold);border-radius:4px 12px 12px 4px;font-size:15.5px;line-height:1.5;color:#232A45;white-space:pre-line;overflow-wrap:anywhere}
.rc-m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 14px 0;font-size:12px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 14px 0}
.flag{font-size:13px;font-weight:700;padding:6px 10px;border-radius:9px}
.flag small{font-weight:600;opacity:.8;margin-left:4px}
.tl{margin:10px 14px 0;border-left:2px solid var(--line);padding-left:12px;display:grid;gap:9px}
.te{position:relative;font-size:13.5px;line-height:1.4}
.te::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 2px #fff}
.te.fo::before{background:var(--plum)}
.te.fu::before{background:var(--sky)}.te.fu.late::before{background:var(--bad)}.te.fu.dn::before{background:var(--ok)}
.te .rb{font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.rb.pl{background:var(--navy-soft);color:var(--navy)}.rb.fo{background:var(--plum-soft);color:var(--plum)}
.te b{font-weight:700}
.te .tm{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.te .ed{display:inline-flex;gap:10px;margin-left:8px}
.te textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:56px}
.due{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:4px}
.rc-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:12px;border-top:1px solid var(--line2)}
.rc-bar button{border:0;background:#fff;padding:11px 4px 10px;font-size:12.5px;font-weight:700;color:var(--navy);border-right:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;gap:3px}
.rc-bar button:last-child{border-right:0}
.rc-bar svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rc-bar button.on{background:var(--navy);color:#fff}
.rc-bar button.done{color:var(--ok)}
.rc-p{padding:12px 14px 14px;background:#FBFAF7;border-top:1px solid var(--line2)}
.rc-p .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute);margin-bottom:8px}
.words{display:flex;flex-wrap:wrap;gap:7px}
.word{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--navy)}
.word.sug{border-color:#EDD3A3;background:var(--gold-soft);color:var(--gold-ink)}
.rc-p textarea,.rc-p input[type=text]{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;font-size:14.5px}
.rc-p textarea{min-height:70px;resize:vertical}
.rc-p input[type=date],.rc-p input[type=time]{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff}
.dgrp{font-family:var(--head);font-weight:600;color:var(--navy);font-size:16px;margin:18px 4px 9px;display:flex;align-items:center;gap:8px}
.dgrp::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--gold)}
.dgrp small{font-family:var(--body);font-size:12px;color:var(--mute);font-weight:600}

/* follow-up strip */
.fus{background:linear-gradient(135deg,#1F2D5A,#2C3D73);color:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.fus h3{margin:0 0 8px;font-family:var(--head);font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.fus .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13.5px}
.fus .it b{font-weight:700}
.fus .it .due{background:rgba(255,255,255,.16);color:#fff}
.fus .it .due.late{background:var(--rose)}
.fus .it button{margin-left:auto;flex:none}

/* dashboard */
.period{margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 12px 11px;box-shadow:0 1px 2px rgba(20,25,60,.04)}
.tile b{display:block;font-family:var(--head);font-size:24px;font-weight:600;line-height:1.05;color:var(--navy)}
.tile span{display:block;font-size:12.5px;font-weight:700;margin-top:3px;color:var(--ink);line-height:1.25}
.tile small{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.tile::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c,var(--navy))}
.tile.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.tile.zero b{color:var(--faint)}
.rep{margin-top:4px}
.tw{overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:#F7F5F0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.nw{white-space:nowrap}
td .s{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
tr:last-child td{border-bottom:0}

/* forms / auth / settings */
.field{display:grid;gap:5px;margin-bottom:11px}
.field label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mute)}
.field input,.field select,.inp{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;width:100%}
.field input:focus,.field select:focus,.inp:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,169,79,.25)}
.auth{max-width:440px;margin:18px auto}
.auth .hero{text-align:center;padding:22px 16px 6px}
.auth .hero h2{font-family:var(--head);font-weight:600;color:var(--navy);margin:0 0 6px;font-size:23px}
.auth .hero p{margin:0;color:var(--mute);font-size:14px}
.urow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line2)}
.urow:last-child{border-bottom:0}
.urow .un{flex:1 1 150px;font-weight:700}
.urow .un small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.urow select{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}

/* sheet & toast */
.sheet{position:fixed;inset:0;background:rgba(14,20,45,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:4px solid var(--gold)}
.sheet h2{margin:0;font-family:var(--head);font-weight:600;color:var(--navy);font-size:19px}
.sheet textarea{width:100%;min-height:42vh;border:1px solid var(--line);border-radius:12px;padding:11px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#FBFAF7}

<script>
/* ================= Diary & Remarks · FIS =================
   Same Google Sheet backend as before (Apps Script web app). Roles: cm = Class Manager (CM),
   pl = Class incharge (PL), admin = Front Office (FO). */
function EMPTY_ROSTER(){ const r = {}; for (let c = 1; c <= 11; c++) r[c] = {A: []}; return r; }
let ROSTER = EMPTY_ROSTER(), rosterVer = "";
const rosterReady = () => Object.keys(ROSTER).some(c => Object.values(ROSTER[c]).some(l => l.length));
const ORD = ["","1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th"];
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const btn = (c, txt, fn, title) => { const b = el("button", c, txt); b.type = "button"; if (fn) b.onclick = fn; if (title) b.setAttribute("aria-label", title); return b; };
const ICON = {
  check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
  bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/>',
  note:'<path d="M5 4h14v12H9l-4 4z"/><path d="M8.5 8.5h7M8.5 12h4.5"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
};
const svg = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + '</svg>';

const API_URL = new URLSearchParams(location.search).get("api") || "https://script.google.com/macros/s/AKfycbyvWTDOKOQ8F0vD-oy9vchmq04GdhfZfgtpomgWg73rIa13gmkrFkpZsvQl9ISZKrSFQw/exec";
let token = ""; try { token = localStorage.getItem("diary-token") || ""; } catch(e){}
let me = null, ready = false, authMode = "login", users = [], refreshing = false;
const ROLE_LABEL = {cm:"CM · Class Manager", pl:"PL · Class incharge", admin:"FO · Front Office"};
const ROLE_SHORT = {cm:"CM", pl:"PL", admin:"FO"};
const canMark = () => !!me && (me.role === "cm" || me.role === "admin");
const canPL = () => !!me && (me.role === "pl" || me.role === "admin");
const canAdmin = () => !!me && me.role === "admin";
function setToken(t){ token = t || ""; try { if (token) localStorage.setItem("diary-token", token); else localStorage.removeItem("diary-token"); } catch(e){} }
async function api(fn, args){
  let r;
  try { r = await fetch(API_URL, {method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn, args:args || []})}); }
  catch(e){ throw new Error("Can't reach the server. Check your internet and try again."); }
  const txt = await r.text(); let j;
  try { j = JSON.parse(txt); } catch(e){ throw new Error("The server didn't answer properly. Please try again."); }
  if (!j.ok) { if (/log in again/i.test(j.err || "")) { setToken(""); me = null; render(); } throw new Error(j.err || "Something went wrong."); }
  return j.v;
}
function banner(msg, info){ const b = $("banner"); b.textContent = msg || ""; b.hidden = !msg; b.className = "banner" + (info ? " info" : ""); }
let toastT;
function toast(t){ const e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { e.hidden = true; }, 2400); }
async function copyText(t, ok){ try { await navigator.clipboard.writeText(t); toast(ok || "Copied"); } catch(e){ toast("Copy is blocked here. Long-press to select."); } }

/* ---------- dates & times ---------- */
function todayStr(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()); }
function shiftDate(s, n){ const [y,m,d] = s.split("-").map(Number); const t = new Date(Date.UTC(y, m-1, d + n)), p = x => String(x).padStart(2,"0"); return t.getUTCFullYear() + "-" + p(t.getUTCMonth()+1) + "-" + p(t.getUTCDate()); }
function dayGap(a, b){ return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dmy(s){ const [y,m,d] = s.split("-"); return d + "-" + m + "-" + y; }
function nice(s){ const [y,m,d] = s.split("-").map(Number); const w = new Date(Date.UTC(y,m-1,d)).getUTCDay(); return WD[w] + ", " + d + " " + MON[m-1]; }
function hm(ms){ const d = new Date(ms); let h = d.getHours(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + ":" + String(d.getMinutes()).padStart(2,"0") + " " + ap; }
function fmtT(ms){ if (!ms) return "time not recorded"; const d = new Date(ms); const ds = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); return (ds === todayStr() ? "Today" : d.getDate() + " " + MON[d.getMonth()]) + ", " + hm(ms); }
function gap(from, to){ if (!from || !to) return ""; const m = Math.max(0, Math.round((to - from) / 60000)); return m < 1 ? "within a minute" : m < 60 ? m + " min" : m < 1440 ? Math.floor(m/60) + " h " + (m%60 ? (m%60) + " min" : "") : Math.floor(m/1440) + " d " + Math.floor((m%1440)/60) + " h"; }
function until(ms){ const m = Math.round((ms - Date.now()) / 60000), a = Math.abs(m); const t = a < 60 ? a + " min" : a < 1440 ? Math.floor(a/60) + " h" + (a%60 ? " " + (a%60) + " min" : "") : Math.floor(a/1440) + " d"; return m >= 0 ? "in " + t : t + " overdue"; }

let date = todayStr();
let cls = 1, sec = "A";
let docs = {};            // "date_cls" -> {date, cls, m:{}}
let acts = {};            // "date_1A9" -> {log:[...]}
let smsRec = {};          // "1A9_def" -> {sentOn, sentAt, remark, by}
const timers = {}, writing = {}, dirtyKeys = {}, aBusy = {};
const openRem = new Set();

function docId(c, dt){ return (dt || date) + "_" + c; }
function getDoc(c){ const id = docId(c); if (!docs[id]) docs[id] = {date, cls:c, m:{}}; return docs[id]; }
function sections(c){ return Object.keys(ROSTER[c] || {}); }
function key(s, i){ return s + "-" + (i+1); }
function mark(c, s, i, dt){ const d = docs[docId(c, dt)]; return (d && d.m[key(s,i)]) || {}; }
function firstName(n){ return n.trim().split(/\s+/)[0].toUpperCase(); }
function title(n){ return n.trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" "); }

/* ---------- saving marks ---------- */
function scheduleSave(c, k){
  const id = docId(c); (dirtyKeys[id] = dirtyKeys[id] || new Set()).add(k);
  setStatus("Saving…"); clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), 500);
}
async function flush(id){
  if (!me) return;
  const keys = dirtyKeys[id]; if (!keys || !keys.size) return;
  if (writing[id]) { timers[id] = setTimeout(() => flush(id), 400); return; }
  writing[id] = true;
  const sent = Array.from(keys); keys.clear();
  const d = docs[id], set = {}, del = [];
  sent.forEach(k => { if (d.m[k]) set[k] = d.m[k]; else del.push(k); });
  try { await api("saveMarks", [token, d.date, d.cls, set, del]); setStatus("Saved for everyone · " + hm(Date.now())); }
  catch(e){ sent.forEach(k => keys.add(k)); setStatus("Not saved yet. Will retry."); toast(e.message); }
  finally { writing[id] = false; }
}
function retryDirty(){ Object.keys(dirtyKeys).forEach(id => { if (dirtyKeys[id].size && !writing[id]) flush(id); }); }
let statusText = "";
function setStatus(t){ statusText = t; const s = $("cmStatus"); if (s) s.textContent = t; }
function applyState(s){
  if (!s) return;
  me = s.me || null; users = s.users || [];
  if (!me) { if (token) { setToken(""); banner("Please log in again.", true); } ready = true; render(); return; }
  if (s.roster) {
    const r = EMPTY_ROSTER(); Object.keys(s.roster).forEach(c => { if (r[c]) r[c] = s.roster[c]; });
    ROSTER = r; rosterVer = s.rosterVer || "";
    if (!ROSTER[cls][sec]) sec = sections(cls)[0]; if (!ROSTER[pcls][psec]) psec = sections(pcls)[0];
  }
  Object.keys(s.docs || {}).forEach(id => {
    if (writing[id]) return;
    const v = s.docs[id], m = JSON.parse(JSON.stringify(v.m || {})), loc = docs[id];
    if (loc && dirtyKeys[id]) dirtyKeys[id].forEach(k => { if (loc.m[k]) m[k] = loc.m[k]; else delete m[k]; });
    docs[id] = {date:v.date, cls:v.cls, m};
  });
  Object.keys(s.acts || {}).forEach(id => { if (aBusy[id]) return; acts[id] = {log: s.acts[id].log || []}; });
  smsRec = s.sms || {};
  ready = true;
  if (!statusText || /^Live/.test(statusText)) setStatus("Live · updated " + hm(Date.now()));
  render();
}
async function refresh(){
  if (!token || refreshing) return;
  refreshing = true;
  try { applyState(await api("state", [token, date, rosterVer])); }
  catch(e){ setStatus("Can't reach the server. Retrying."); if (!ready) { ready = true; render(); } }
  finally { refreshing = false; }
}

/* ---------- marks ---------- */
const MF = ["a","d","e","s","b","v","y","p"];
/* value codes: a 2 present · 1 absent · 3 diary not brought | d 2 OK · 1 not completed | others 1 yes/good · 2 no/bad */
function subKey(s){ return "_" + s; }
function subOf(c, s, dt){ const d = docs[docId(c, dt)]; return (d && d.m[subKey(s)]) || null; }
function hasMarks(c, s, dt){ const d = docs[docId(c, dt)]; return !!d && Object.keys(d.m).some(k => k.indexOf(s + "-") === 0); }
function secDone(c, s, dt){ return !!subOf(c, s, dt) || hasMarks(c, s, dt); }
function submitSec(c, s){ const d = getDoc(c), k = subKey(s); d.m[k] = {k:1, at:Date.now(), u:(me && me.name) || ""}; scheduleSave(c, k); }
function setMark(c, s, i, patch){
  const d = getDoc(c), k = key(s,i), prev = d.m[k] || {};
  const cur = Object.assign({}, prev, patch);
  const tm = Object.assign({}, prev.t || {}), now = Date.now();
  MF.forEach(f => { if (f in patch) { if (cur[f]) tm[f] = now; else delete tm[f]; } });
  if ("r" in patch) { if (cur.r && cur.r.trim()) { if (!(prev.r && prev.r.trim())) tm.r = now; } else delete tm.r; }
  MF.forEach(f => { if (!cur[f]) delete cur[f]; });
  if (!cur.r || !cur.r.trim()) delete cur.r;
  cur.t = tm; if (!Object.keys(tm).length) delete cur.t;
  if (MF.concat(["r"]).some(f => cur[f])) d.m[k] = cur; else delete d.m[k];
  scheduleSave(c, k);
}

/* categories used everywhere */
const CATS = [
  {k:"abs",  l:"Absent",              tone:"bad",  test:m => m.a === 1},
  {k:"nb",   l:"Diary not brought",   tone:"warn", test:m => m.a === 3, f:"a"},
  {k:"def",  l:"Diary not completed", tone:"warn", test:m => m.a !== 1 && m.d === 1, f:"d"},
  {k:"sig",  l:"Diary not signed",    tone:"bad",  test:m => m.a !== 1 && m.s === 2, f:"s"},
  {k:"eng",  l:"Spoken English",      tone:"plum", test:m => m.a !== 1 && m.e === 2, f:"e"},
  {k:"beh",  l:"Behaviour",           tone:"bad",  test:m => m.a !== 1 && m.b === 2, f:"b"},
  {k:"tv",   l:"TV hour",             tone:"sky",  test:m => m.a !== 1 && m.v === 2, f:"v"},
  {k:"study",l:"Study hour",          tone:"sky",  test:m => m.a !== 1 && m.y === 2, f:"y"},
  {k:"play", l:"Play hour",           tone:"sky",  test:m => m.a !== 1 && m.p === 2, f:"p"}
];
const DCATS = CATS.filter(x => x.k !== "abs");
const CAT = {}; CATS.forEach(x => CAT[x.k] = x);
const LABEL = {rem:"Parent remark"}; DCATS.forEach(x => LABEL[x.k] = x.l);
function flagged(m, cat){ return !!m && !!CAT[cat] && CAT[cat].test(m); }
function counts(c, s, dt){
  const names = ROSTER[c][s] || [], k = {total:names.length, present:0, absent:0, unmarked:0, def:0, kids:0, rem:0};
  names.forEach((n,i) => {
    const m = mark(c,s,i,dt);
    if (m.r && m.r.trim()) k.rem++;
    if (m.a === 1) { k.absent++; return; }
    if (m.a === 2 || m.a === 3) k.present++; else k.unmarked++;
    if (m.d === 1 || m.a === 3) k.def++;
    if (DCATS.some(x => x.test(m))) k.kids++;
  });
  return k;
}

/* ---------- topics for parent remarks (from the last weeks of real remarks) ---------- */
const TOPICS = [
  {k:"health", l:"Health & medicine", tone:"bad", re:/not well|unwell|fever|sick|injur|pain|hurt|wound|medicine|doctor|stomach|\bfell\b|fall (down|from)|vomit|cough|\bcold\b|allerg|muscle|fracture|headache/i, acts:["Informed","Given","Counselled"]},
  {k:"leave", l:"Leave & absence", tone:"mute", re:/\bleave\b|absent|out of (the )?(town|station)|wedding|marriage|function|could ?n['’]?t (come|attend)|not (be )?able to (come|attend)|late for school|nani|grandparent|election|went to/i, acts:["Informed","Allowed","Excused"]},
  {k:"stay", l:"Stay back & academy", tone:"plum", re:/stay ?back|staying back|stay in school|smart study|after school|evening academy|(not|won['’]?t|n['’]?t) (do )?stay|stay (for|only|till|from)|will stay/i, acts:["Updated","Informed","Allowed"]},
  {k:"pickup", l:"Pick-up & transport", tone:"sky", re:/pick(ed)? ?up|\bpick\b|by walk|\bbus\b|\bvan\b|\bauto\b|transport|conveyance|go with|drop/i, acts:["Informed","Arranged","Updated"]},
  {k:"uniform", l:"Uniform", tone:"navy", re:/uniform|dress|jacket|shoes?\b|\bshirt\b|\bpant|beige|blazer|sweater/i, acts:["Allowed","Excused","Informed"]},
  {k:"books", l:"Books & material", tone:"warn", re:/\bbooks?\b|notebook|\bkit\b|stationery|\bcopy\b|guide book/i, acts:["Given","Sent","Received"]},
  {k:"food", l:"Lunch & water", tone:"ok", re:/lunch|tiffin|\bfood\b|\beat\b|fruit|water bottle|\bmeal/i, acts:["Informed","Counselled","Given"]},
  {k:"work", l:"Homework & tests", tone:"warn", re:/assignment|home ?work|worksheet|\btests?\b|exam|submit|pending work|written work|work done|complete (his|her|the)/i, acts:["Allowed","Received","Informed"]},
  {k:"study", l:"Academic help", tone:"sky", re:/explain|doubt|understood|understand|guide|concept|teach|learn|spelling|practi[cs]e|correct/i, acts:["Guided","Arranged","Informed"]},
  {k:"behav", l:"Behaviour concerns", tone:"bad", re:/behav|misbehav|disciplin|rude|fight/i, acts:["Counselled","Informed","Warned"]},
  {k:"activity", l:"Activity & sports change", tone:"plum", re:/activit|academy|sports?\b|skill course|dance|music|guitar|karate|taekwondo|yoga|skating|tennis|shooting|cricket|tabla|harmonium|pottery|\bart\b|archery|fitness|abacus|keyboard|photography|acting|legacy league|tournament|olympiad|swimming|chess/i, acts:["Changed","Allocated","Informed"]},
  {k:"other", l:"Other", tone:"mute", re:/.^/, acts:["Informed"]}
];
const TOPIC = {}; TOPICS.forEach(t => TOPIC[t.k] = t);
function topicOf(text){ const t = TOPICS.find(x => x.re.test(text || "")); return t ? t.k : "other"; }
const ACTION_WORDS = ["Given","Received","Allocated","Changed","Informed","Counselled","Allowed","Sent","Excused","Arranged","Guided","Updated","Warned","Called parent"];
const DEF_ACTS = ["Counselled","Called parent","Warned","Informed"];
</script>

<script>
/* ================= CM · marking ================= */
function classChips(cur, onPick, dotFn){
  const box = el("div","chips"); box.setAttribute("role","group"); box.setAttribute("aria-label","Class");
  for (let c = 1; c <= 11; c++){
    const b = btn("chip" + (c === cur ? " on" : ""), String(c), () => onPick(c), "Class " + c);
    b.setAttribute("aria-pressed", String(c === cur));
    if (dotFn && dotFn(c)) b.appendChild(el("i"));
    box.appendChild(b);
  }
  return box;
}
function secSeg(c, cur, onPick, labelFn){
  const seg = el("div","seg"); seg.setAttribute("role","tablist");
  sections(c).forEach(s => {
    const b = btn(s === cur ? "on" : "", c + " " + s, () => onPick(s)); b.setAttribute("role","tab"); b.setAttribute("aria-selected", String(s === cur));
    const extra = labelFn && labelFn(s); if (extra) b.appendChild(el("em", null, extra));
    seg.appendChild(b);
  });
  return seg;
}
function summaryGroups(c, s){
  const names = ROSTER[c][s] || [], out = [];
  CATS.forEach(cat => {
    const l = []; names.forEach((n,i) => { if (cat.test(mark(c,s,i))) l.push({i, n}); });
    if (l.length) out.push({k:cat.k, l:cat.l, tone:cat.tone, list:l});
  });
  const rem = []; names.forEach((n,i) => { const m = mark(c,s,i); if (m.r && m.r.trim()) rem.push({i, n}); });
  if (rem.length) out.push({k:"rem", l:"Parent remarks", tone:"gold", list:rem});
  const un = []; names.forEach((n,i) => { const m = mark(c,s,i); if (!m.a) un.push({i, n}); });
  if (un.length && un.length < names.length) out.push({k:"un", l:"Attendance not marked", tone:"mute", list:un});
  return out;
}
function jumpTo(i){ const r = $("kid-" + i); if (!r) return; r.scrollIntoView({behavior:"smooth", block:"center"}); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash"); }

let showUn = false;
function renderCM(){
  const box = $("vCM");
  const ae = document.activeElement;
  if (ae && ae.tagName === "TEXTAREA" && box.contains(ae)) { renderDock(); return; }
  box.textContent = "";
  if (!(ROSTER[cls] && ROSTER[cls][sec])) sec = sections(cls)[0];

  // selector
  const sel = el("div","card"); const sp = el("div","selector");
  sp.appendChild(classChips(cls, c => { cls = c; if (!ROSTER[c][sec]) sec = sections(c)[0]; render(); }, c => { const d = docs[docId(c)]; return d && Object.keys(d.m).length; }));
  sp.appendChild(secSeg(cls, sec, s => { sec = s; render(); }));
  sel.appendChild(sp); box.appendChild(sel);

  // summary
  const k = counts(cls, sec), sb = subOf(cls, sec);
  const sum = el("div","card");
  const h = el("div","cardh"); const h2 = el("h2", null, "Class " + cls + " " + sec);
  h2.appendChild(el("small", null, nice(date) + " · " + (sb ? "Submitted " + hm(sb.at) + (sb.u ? " by " + sb.u : "") : "Not submitted yet")));
  h.appendChild(h2); h.appendChild(el("span","pill " + (sb ? "t-ok" : "t-warn"), sb ? "Submitted" : "Open"));
  sum.appendChild(h);
  const st = el("div","stats");
  [[k.present + "/" + k.total, "Present", ""],[k.absent, "Absent", k.absent ? "bad" : ""],[k.kids, "Defaulters", k.kids ? "warn" : ""],[k.rem, "Remarks", k.rem ? "plum" : ""]].forEach(([v,l,t]) => {
    const d = el("div","stat " + t); d.appendChild(el("b", null, String(v))); d.appendChild(el("span", null, l)); st.appendChild(d);
  });
  sum.appendChild(st);
  const gs = summaryGroups(cls, sec);
  const gw = el("div","groups");
  if (!gs.length) gw.appendChild(el("div","empty", k.present ? "Everyone marked so far is fine." : "Nothing marked yet for this section."));
  gs.forEach(g => {
    const d = el("div","grp"); const gh = el("div","grp-h");
    gh.appendChild(el("span","dot d-" + g.tone)); gh.appendChild(el("span", null, g.l)); gh.appendChild(el("span","n", String(g.list.length)));
    d.appendChild(gh);
    const ns = el("div","names");
    const many = g.k === "un" && g.list.length > 8 && !showUn;
    (many ? g.list.slice(0, 8) : g.list).forEach(x => { const b = btn("nm t-" + (g.tone === "gold" ? "warn" : g.tone), "", () => jumpTo(x.i)); b.appendChild(el("small", null, String(x.i + 1))); b.appendChild(document.createTextNode(x.n)); ns.appendChild(b); });
    if (g.k === "un" && g.list.length > 8) ns.appendChild(btn("lnk", showUn ? "Show fewer" : "+ " + (g.list.length - 8) + " more", () => { showUn = !showUn; render(); }));
    d.appendChild(ns); gw.appendChild(d);
  });
  sum.appendChild(gw);
  if (sections(cls).length > 1) {
    const ss = el("div","secs");
    sections(cls).forEach(s2 => { const kk = counts(cls, s2), done = !!subOf(cls, s2);
      const b = btn("secpill" + (s2 === sec ? " on" : "") + (done ? " done" : ""), cls + s2, () => { sec = s2; render(); });
      b.appendChild(el("span", null, done ? "✓ " + kk.present + "/" + kk.total : kk.present + "/" + kk.total)); ss.appendChild(b); });
    sum.appendChild(ss);
  }
  box.appendChild(sum);

$("bAll").onclick = () => { (ROSTER[cls][sec] || []).forEach((n,i) => { if (!mark(cls,sec,i).a) setMark(cls,sec,i,{a:2}); }); render(); toast("Unmarked children set to present"); };
$("bSubmit").onclick = () => { const was = !!subOf(cls, sec); submitSec(cls, sec); render(); toast(was ? "Submitted again" : "Class " + cls + " " + sec + " submitted"); };

/* ---------- WhatsApp report ---------- */
function reportFor(c, withNames){
  const lines = [];
  sections(c).forEach(s => {
    const k = counts(c, s), label = "Class " + ORD[c] + " " + s;
    lines.push("*" + label + " - Present - " + k.present + "/" + k.total + "*" + (secDone(c, s) ? "" : " _(not submitted yet)_"));
    const rem = [];
    (ROSTER[c][s] || []).forEach((n,i) => { const m = mark(c,s,i); if (m.r && m.r.trim()) rem.push(firstName(n) + " - " + m.r.trim().replace(/\s+/g," ")); });
    if (rem.length) rem.forEach((t,i) => lines.push((i+1) + ". " + t)); else lines.push("NA");
    const extra = [];
    DCATS.filter(x => !["def","nb"].includes(x.k)).forEach(x => { const n = (ROSTER[c][s] || []).filter((nm,i) => x.test(mark(c,s,i))).length; if (n) extra.push(x.l + ": " + n); });

}
$("bReport").onclick = () => { buildReport(); $("sheet").hidden = false; };
$("sClose").onclick = () => { $("sheet").hidden = true; };

$("sScope").querySelectorAll("button").forEach(b => { b.onclick = () => { scope = b.dataset.s; $("sScope").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); buildReport(); }; });

<script>
/* ================= items: remarks & defaulters, and the PL / FO workflow ================= */
function aid(c, s, i, dt){ return dt + "_" + c + s + (i+1); }
function rawLog(c, s, i, dt){ const a = acts[aid(c,s,i,dt)]; return (a && a.log) || []; }
/* older entries had no type: "Noted" was the acknowledgement, anything else a written action */
function entryType(e){ return e.t || (e.a === "Noted" ? "ack" : "act"); }
function issuesFor(c, s, i, seg, dt){
  const m = mark(c, s, i, dt), t = m.t || {}, out = [];
  if (seg === "rem") { if (m.r && m.r.trim()) out.push({cat:"rem", text:m.r.trim(), at:t.r}); }
  else if (m.a !== 1) DCATS.forEach(x => { if (x.test(m)) out.push({cat:x.k, at:t[x.f]}); });
  return out;
}
function makeItem(dt, c, s, i, seg){
  const iss = issuesFor(c, s, i, seg, dt); if (!iss.length) return null;
  const nm = (ROSTER[c][s] || [])[i] || "";
  const cats = seg === "rem" ? ["rem"] : iss.map(x => x.cat);
  const log = rawLog(c, s, i, dt).filter(e => !e.x && (e.cats || []).some(x => seg === "rem" ? x === "rem" : x !== "rem"));
  const it = {dt, c, s, i, nm, seg, iss, cats, log, topic: seg === "rem" ? topicOf(iss[0].text) : "def"};
  it.st = itemStatus(it);
  return it;
}
function openFus(it){ return it.log.filter(e => entryType(e) === "fu" && !e.done); }
function itemStatus(it){
  const fus = openFus(it);
  if (fus.length) { const d = Math.min.apply(null, fus.map(f => f.due)); return {k: d <= Date.now() ? "late" : "fu", due:d}; }
  if (it.log.some(e => entryType(e) === "act")) return {k:"act"};
  if (it.log.some(e => entryType(e) === "fu" && e.done)) return {k:"act"};
  if (it.log.length) return {k:"noted"};

}
const ST_LABEL = {pend:["Pending","t-warn"], noted:["Noted","t-navy"], act:["Actioned","t-ok"], fu:["Follow-up","t-sky"], late:["Follow-up due","t-bad"]};
function dayItems(dt, c0, s0, seg){
  const out = [];
  for (let c = 1; c <= 11; c++){
    if (c0 && c !== c0) continue; if (!docs[docId(c, dt)]) continue;
    sections(c).forEach(s => { if (s0 && s0 !== "all" && s !== s0) return; (ROSTER[c][s] || []).forEach((n, i) => { const it = makeItem(dt, c, s, i, seg); if (it) out.push(it); }); });
  }
  return out;
}
function rangeItems(seg, from, to, c0, s0){
  const out = []; let dt = to, g = 0;
  while (dt >= from && g++ < 62) { dayItems(dt, c0, s0, seg).forEach(x => out.push(x)); dt = shiftDate(dt, -1); }
  return out;
}

/* ---------- saving workflow entries ---------- */
let noRemarkOp = false;
function remarkOp(it, op){
  const id = aid(it.c, it.s, it.i, it.dt), before = rawLog(it.c, it.s, it.i, it.dt);
  const tmp = Object.assign({id:"tmp" + Date.now(), at:Date.now(), by: canAdmin() ? "admin" : "pl", who: me.name, cats: it.cats}, op);
  let next = before.slice();
  if (["ack","act","note","fu"].includes(op.t)) next.push(tmp);
  else next = next.map(e => {
    if (e.id !== op.id) return e;
    const c = Object.assign({}, e);
    if (op.t === "edit") { c.a = op.a; c.ed = Date.now(); }
    if (op.t === "del") c.x = Date.now();
    if (op.t === "done") { c.done = Date.now(); c.dw = me.name; }
    if (op.t === "undo") { delete c.done; delete c.dw; }
    return c;
  });
  acts[id] = {log: next}; aBusy[id] = (aBusy[id] || 0) + 1;
  render();
  const by = canAdmin() ? "admin" : "pl";
  /* until the server has the new workflow (remarkOp), Noted / Action / Remark still save through the older addLog */
  const legacy = async () => {
    if (!["ack","act","note"].includes(op.t)) throw new Error("Follow-ups, edit and delete start working once the server update is installed.");
    return api("addLog", [token, it.dt, it.c, it.s, it.i + 1, it.nm, op.a || "Noted", it.cats, by]);
  };
  (noRemarkOp ? legacy() : api("remarkOp", [token, it.dt, it.c, it.s, it.i + 1, it.nm, Object.assign({cats: it.cats}, op)])
    .catch(e => { if (/^Unknown action\.$/.test(e.message) && ["ack","act","note"].includes(op.t)) { noRemarkOp = true; return legacy(); } throw e; }))
    .then(r => { acts[id] = {log: r.log}; })
    .catch(e => { acts[id] = {log: before}; toast(e.message); })
    .finally(() => { aBusy[id]--; if (!aBusy[id]) delete aBusy[id]; render(true); });
}

/* ---------- the card ---------- */
const panelOpen = {};          // item id -> "act" | "note" | "fu"
const editing = {};            // entry id -> true
const iid = it => it.seg + ":" + aid(it.c, it.s, it.i, it.dt);
function roleOf(e){ return e.by === "admin" ? "fo" : "pl"; }
function itemCard(it, opts){
  opts = opts || {};
  const id = iid(it), st = ST_LABEL[it.st.k];
  const card = el("article","rc" + (it.st.k === "late" ? " over" : "")); card.id = "rc-" + id.replace(/[^a-z0-9]/gi, "");
  const h = el("div","rc-h");
  h.appendChild(el("span","roll", String(it.i + 1)));
  const n = el("div","rc-n", title(it.nm)); n.appendChild(el("span","cs", it.c + it.s)); h.appendChild(n);
  h.appendChild(el("span","pill " + st[1], st[0]));
  card.appendChild(h);

  if (it.seg === "rem") {
    card.appendChild(el("div","rc-q", it.iss[0].text));
    const mt = el("div","rc-m"); const tp = TOPIC[it.topic];
    mt.appendChild(el("span","tag t-" + tp.tone, tp.l));
    mt.appendChild(el("span", null, "Written " + (opts.showDate ? fmtT(it.iss[0].at) : (it.iss[0].at ? hm(it.iss[0].at) : ""))));
    card.appendChild(mt);
  } else {
    const fl = el("div","flags");
    it.iss.forEach(x => { const c = CAT[x.cat]; const f = el("span","flag t-" + c.tone, c.l);
      const s2 = streak(it.c, it.s, it.i, x.cat);
      if (s2.n >= 2 && it.dt === date) f.appendChild(el("small", null, s2.n + " days in a row" + (s2.n >= smsAfter(x.cat) ? " · SMS" : "")));
      fl.appendChild(f); });
    card.appendChild(fl);
  }

  // timeline
  const first = it.iss[0].at;
  const log = it.log.slice().sort((a,b) => a.at - b.at);
  if (log.length) {
    const tl = el("div","tl");
    log.forEach(e => tl.appendChild(entryRow(it, e, first)));
    card.appendChild(tl);
  }

  if (!canPL()) { card.appendChild(el("div","rc-m", " ")); return card; }
  const mine = it.log.find(e => entryType(e) === "ack" && e.who === me.name);
  const bar = el("div","rc-bar"), p = panelOpen[id];
  const mk = (k, label, ic, fn, cls2) => { const b = btn((p === k ? "on " : "") + (cls2 || ""), "", fn, label + " · " + title(it.nm)); b.innerHTML = svg(ic) + "<span>" + label + "</span>"; bar.appendChild(b); };
  mk("ack", mine ? "Noted ✓" : "Noted", "check", () => { if (mine) return; remarkOp(it, {t:"ack", a:"Noted"}); toast("Noted"); }, mine ? "done" : "");
  mk("act", "Action", "bolt", () => { panelOpen[id] = p === "act" ? null : "act"; render(true); });
  mk("note", "Remark", "note", () => { panelOpen[id] = p === "note" ? null : "note"; render(true); setTimeout(() => { const t = $("np-" + id); if (t) t.focus(); }, 30); });
  mk("fu", "Follow-up", "clock", () => { panelOpen[id] = p === "fu" ? null : "fu"; render(true); });
  card.appendChild(bar);
  if (p) card.appendChild(panel(it, p, id));
  return card;
}
function entryRow(it, e, first){
  const t = entryType(e), r = roleOf(e);
  const row = el("div","te " + r + (t === "fu" ? " fu" + (e.done ? " dn" : e.due <= Date.now() ? " late" : "") : ""));
  row.appendChild(el("span","rb " + r, r.toUpperCase()));
  if (t === "ack") row.appendChild(el("b", null, "Noted"));
  else if (t === "act") { row.appendChild(document.createTextNode("Action: ")); row.appendChild(el("b", null, e.a)); }

    const rr = el("div","row"); rr.style.marginTop = "6px";
    rr.appendChild(btn("btn sm", "Save", () => { const v = ta.value.trim(); if (!v) return; delete editing[e.id]; remarkOp(it, {t:"edit", id:e.id, a:v}); }));
    rr.appendChild(btn("btn ghost sm", "Cancel", () => { delete editing[e.id]; render(true); }));
    row.appendChild(rr); return row;
  } else row.appendChild(el("span", null, e.a));
  const tm = el("span","tm", (e.who || "") + " · " + fmtT(e.at) + (first && t !== "fu" ? " · " + gap(first, e.at) + " after" : "") + (e.ed ? " · edited" : ""));
  const own = canAdmin() || e.who === (me && me.name);

    if (t === "fu") ed.appendChild(btn("lnk", e.done ? "Reopen" : "Mark done", () => remarkOp(it, {t: e.done ? "undo" : "done", id:e.id})));
    let armed = false;

function panel(it, p, id){

    const ws = el("div","words");
    words.forEach(w => ws.appendChild(btn("word" + (sug.includes(w) ? " sug" : ""), w, () => { panelOpen[id] = null; remarkOp(it, {t:"act", a:w}); toast("Action saved: " + w); })));

    [["In 30 min", 18e5],["In 1 hour", 36e5],["In 2 hours", 72e5]].forEach(([l, ms]) => quick.appendChild(btn("word", l, () => setQ(Date.now() + ms))));
    quick.appendChild(btn("word", "Tomorrow 9 am", () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); setQ(d.getTime()); }));
    box.appendChild(quick);

    }));

/* ---------- follow-ups across everything loaded ---------- */
function allFollowUps(){
  const out = [];
  Object.keys(acts).forEach(id => {
    const m = /^(\d{4}-\d\d-\d\d)_(\d{1,2})([A-Z])(\d+)$/.exec(id); if (!m) return;
    const dt = m[1], c = +m[2], s = m[3], i = +m[4] - 1;
    (acts[id].log || []).forEach(e => {
      if (e.x || entryType(e) !== "fu") return;
      const seg = (e.cats || []).includes("rem") ? "rem" : "def";
      out.push({e, dt, c, s, i, seg, nm: ((ROSTER[c] || {})[s] || [])[i] || ""});
    });
  });
  return out.sort((a,b) => (a.e.done ? 1 : 0) - (b.e.done ? 1 : 0) || a.e.due - b.e.due);
}
function fuStrip(filter){
  const due = allFollowUps().filter(f => !f.e.done && f.e.due <= Date.now() + 36e5 && (!filter || filter(f)));
  if (!due.length) return null;
  const box = el("div","fus");
  const h = el("h3"); h.textContent = "Follow-ups due · " + due.length; box.appendChild(h);
  due.slice(0, 6).forEach(f => {
    const r = el("div","it"); const late = f.e.due <= Date.now();
    const t = el("div"); t.appendChild(el("b", null, title(f.nm) + " · " + f.c + f.s));
    t.appendChild(el("span","due" + (late ? " late" : ""), until(f.e.due)));
    if (f.e.a) { t.appendChild(el("br")); t.appendChild(document.createTextNode(f.e.a)); }
    r.appendChild(t);
    const it = makeItem(f.dt, f.c, f.s, f.i, f.seg);
    if (it && canPL()) r.appendChild(btn("btn gold sm", "Done", () => remarkOp(it, {t:"done", id:f.e.id})));
    box.appendChild(r);
  });
  return box;
}

/* ---------- streaks & SMS ---------- */
const SMS_AFTER = {nb:2};
const smsAfter = cat => SMS_AFTER[cat] || 3;
const STREAK_CATS = DCATS.map(x => x.k);
/* Only days on which the section was marked count as school days. The run must end on the section's

function streak(c, s, i, cat){
  const k = key(s,i); let n = 0, start = null, prev = null;
  for (let b = 0; b < 21; b++){
    const dt = shiftDate(date, -b), d = docs[docId(c, dt)];
    if (!d || !secDone(c, s, dt)) continue;
    if (prev && dayGap(dt, prev) > 4) break;
    if (!flagged(d.m[k] || {}, cat)) break;
    n++; start = dt; prev = dt;
  }
  return {n, start};
}
function smsText(first, cat, n){
  const f = first.charAt(0) + first.slice(1).toLowerCase(), p = n + " days";
  const t = {
    sig:"your ward " + f + "'s diary has not been signed by you for the past " + p + ". You are requested to ensure that you sign your ward's diary every day.",
    nb:"your ward " + f + " has not brought the diary to school for the past " + p + ". You are requested to ensure that your ward brings the diary to school every day.",
    def:"your ward " + f + "'s diary has not been signed by you for the past " + p + ". You are requested to ensure that you sign your ward's diary every day.",
    eng:"your ward " + f + " has not been speaking in English at school for the past " + p + ". You are requested to encourage your ward to speak in English at home as well.",
    beh:"your ward " + f + "'s behaviour at school has not been appropriate for the past " + p + ". You are requested to talk to your ward about it.",
    tv:"your ward " + f + " has not followed the TV hour routine at home for the past " + p + ". You are requested to ensure that your ward follows the TV hour routine every day.",
    study:"your ward " + f + " has not followed the study hour routine at home for the past " + p + ". You are requested to ensure that your ward follows the study hour routine every day.",
    play:"your ward " + f + " has not followed the play hour routine at home for the past " + p + ". You are requested to ensure that your ward follows the play hour routine every day."
  };
  return "Dear Parent,\nGreetings!\nThis is to inform you that " + t[cat] + "\nRegards";
}
function smsDue(){
  const out = [];
  for (let c = 1; c <= 11; c++) sections(c).forEach(s => (ROSTER[c][s] || []).forEach((nm,i) => {
    STREAK_CATS.forEach(cat => {
      const st = streak(c,s,i,cat); if (st.n < smsAfter(cat)) return;
      const rec = smsRec[c + s + (i+1) + "_" + cat];
      out.push({c, s, i, nm, cat, n:st.n, start:st.start, sent: !!(rec && rec.sentOn >= st.start), rec});
    });
  }));
  return out;
}
async function markSms(it, sent, remark){

  catch(e){ toast(e.message); }
}

function parseRoster(text){
  const out = {}; let n = 0, bad = 0;
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const cells = []; line.replace(/("([^"]*)"|[^,\t]*)(,|\t|$)/g, (m, a, q) => { cells.push((q != null ? q : a).trim()); return ""; });
    const cm = /(\d{1,2})/.exec(cells[0] || ""), sc = /^[A-Za-z]$/.test(cells[1] || "") ? cells[1].toUpperCase() : "", nm = (cells[2] || "").trim();
    if (!cm || !sc || !nm) { if (i > 0) bad++; return; }
    const c = +cm[1]; if (c < 1 || c > 11) { bad++; return; }
    ((out[c] = out[c] || {})[sc] = out[c][sc] || []).push(nm); n++;
  });
  return {out, n, bad};
}

    msg.textContent = r.n + " students in " + secs + " sections of " + Object.keys(r.out).length + " classes" + (r.bad ? " (" + r.bad + " rows skipped)" : "") + ". Check, then tap Upload."; go.disabled = false; };
